# appliances/gb10/deploy/observability-services.yml
#
# STAGING FRAGMENT — this is NOT a standalone compose file and is not meant
# to be `docker compose up`'d on its own (it has no `postgres`/`vllm`/`litellm`
# services, and running it as its own project would put these five services
# on an isolated network with nothing to scrape). It exists because the
# author of this fragment does not own docker-compose.yml — another agent
# owns that file and is deploying the key portal in parallel. The integrator
# merges the `services:` and `volumes:` blocks below verbatim into the real
# appliances/gb10/docker-compose.yml (which already has `postgres`, `vllm`,
# `litellm`, `cloudflared`, and a `pg-data` volume as of commit 07e901c on
# gb10-appliance) and re-validates with:
#
#   docker compose --env-file .env --env-file versions.env config -q
#
# All five services below join the compose project's implicit default
# network the same way postgres/vllm/litellm/cloudflared already do — no
# explicit `networks:` block needed, since nothing here overrides the
# default. Service DNS names used by prometheus/prometheus.yml (`litellm`,
# `vllm`, `node-exporter`, `nvidia-gpu-exporter`) all resolve on that network
# once merged.
#
# Grafana is bound to 127.0.0.1:3000 only, same as every other ops-only
# service in this file. It is published to the tailnet by a HOST-level
# command, `tailscale serve` — run on promaxgb10-d62a itself, natively (Task
# 4's Tailscale install; there is no `tailscale` container to `docker compose
# exec` into). This fragment's author was told not to run this — it is
# documented here for whoever brings this service up for real:
#
#   sudo tailscale serve --bg --https=3001 http://localhost:3000
#
# After that, Grafana is reachable at https://promaxgb10-d62a.taile5d412.ts.net:3001
# from any device on tailnet taile5d412, and from nowhere else — verify with
# `curl -sI https://promaxgb10-d62a.taile5d412.ts.net:3001` from a machine
# NOT on the tailnet and confirm it doesn't resolve/connect.
#
# GPU METRIC NAMES ARE UNVERIFIED — see appliances/gb10/deploy/
# observability-verification.md before trusting any nvidia_smi_* panel or
# alert. The exporter has never been deployed by this fragment's author
# (no `docker compose` was run on this box while authoring this).
#
# All five services validate as syntactically correct standalone YAML
# (`python3 -c "import yaml; yaml.safe_load(...)"`) and prometheus.yml/
# alert-rules.yml both passed `promtool check config`/`check rules` locally
# (not on the box) — see the verification doc for exactly what was and
# wasn't proven this way.

services:
  node-exporter:
    image: ${NODE_EXPORTER_DIGEST}
    container_name: gb10-node-exporter
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped

  nvidia-gpu-exporter:
    image: ${NVIDIA_GPU_EXPORTER_DIGEST}
    container_name: gb10-nvidia-gpu-exporter
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "127.0.0.1:9835:9835"
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_DIGEST}
    container_name: gb10-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prom-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  alertmanager:
    image: ${ALERTMANAGER_DIGEST}
    container_name: gb10-alertmanager
    volumes:
      # NOTE: alertmanager.yml (no .template suffix) is the file
      # render-config.sh generates from alertmanager.yml.template + .env on
      # the host at ExecStartPre time. It is gitignored — do not create it by
      # hand and do not commit it if you do.
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_DIGEST}
    container_name: gb10-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://promaxgb10-d62a.taile5d412.ts.net:3001/
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  prom-data:
  grafana-data:
