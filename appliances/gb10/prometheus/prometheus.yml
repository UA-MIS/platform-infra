# appliances/gb10/prometheus/prometheus.yml
#
# Scrape targets use compose service DNS names on the `gb10-appliance_default`
# network. Verified live on the box (2026-09-29):
#   - litellm exposes Prometheus metrics on its own port 4000 (/metrics,
#     require_auth_for_metrics_endpoint: false — reachable only from the
#     compose network + loopback, never public).
#   - vllm exposes its own /metrics on port 8000. It is NOT sharing litellm's
#     network namespace (that coupling was removed on the box — see the
#     comment in docker-compose.yml's vllm service — so scrape it at
#     `vllm:8000`, not `litellm:8000` as an earlier draft of the plan assumed).
#     Confirmed via `docker inspect gb10-vllm` on 2026-09-29: vllm has its own
#     network alias "vllm" on gb10-appliance_default.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/alert-rules.yml"

scrape_configs:
  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ["litellm:4000"]

  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: nvidia-gpu
    static_configs:
      - targets: ["nvidia-gpu-exporter:9835"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
