name: gb10-appliance

services:
  postgres:
    image: ${POSTGRES_DIGEST}
    container_name: gb10-postgres
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=litellm
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  vllm:
    image: ${VLLM_DIGEST}
    container_name: gb10-vllm
    # NOT network_mode: service:litellm. vLLM takes ~9 minutes to cold start
    # (CUDA graph capture); litellm restarts in seconds. Sharing litellm's
    # netns made the expensive container a dependent of the cheap one, so a
    # litellm config change orphaned vLLM networking and cost a 9-minute
    # outage to recover. They talk over compose service DNS instead.
    ports:
      - "127.0.0.1:8000:8000"   # loopback only; bench harness + local debug
    ipc: host
    volumes:
      - /home/uamis/.cache/huggingface:/root/.cache/huggingface
    command:
      - "--model=Inferact/Qwen3.8-27B-NVFP4"
      - "--tensor-parallel-size=1"
      # 262144 is the model's native context window. max-model-len is a
      # CEILING, not a reservation: vLLM (PagedAttention) allocates KV
      # blocks on demand, so a small request costs the same whether this
      # is 32k or 262k. Raising it does NOT reduce concurrency for normal
      # requests — it only lets one large request grow bigger. Primary
      # workload is real in-project coding help, where 32k truncated on
      # realistic multi-file context.
      - "--max-model-len=262144"
      - "--kv-cache-dtype=fp8"
      - "--gpu-memory-utilization=0.75"
      - "--reasoning-parser=qwen3"
      # DFlash2: block-diffusion drafter, LOSSLESS (greedy output matches the
      # target model exactly). Upstream vLLM since PR #52816 (merged 2026-08-21).
      # Published vs MTP on coding: HumanEval 3.11x vs 2.20x, MBPP 3.29x vs 2.22x.
      - "--speculative-config={\"method\":\"dflash\",\"model\":\"incoai/Qwen3.8-27B-DFlash2\",\"num_speculative_tokens\":7}"
      # Required for Continue Agent mode / any tool-calling client.
      # Without these vLLM returns tool calls as prose, the client fails
      # to parse them, and it retry-loops. Per the vLLM recipe for this model.
      - "--enable-auto-tool-choice"
      - "--tool-call-parser=qwen3_xml"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    # No Docker healthcheck: cold start is ~7 minutes (CUDA graph capture).
    # A healthcheck with any sane interval/retries would restart-loop the
    # container before it ever finishes booting. Readiness is verified by
    # Task 16/17's own curl-based checks, not by Docker's own restart logic.

  litellm:
    image: ${LITELLM_DIGEST}
    container_name: gb10-litellm
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - DATABASE_URL=postgresql://litellm:${PG_PASSWORD}@postgres:5432/litellm
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  keyportal:
    # Task 12 (D11): student/faculty self-service key portal, served at
    # local-llm-keys.uamishub.com via the cloudflared service above (that
    # hostname's ingress route already points at keyportal:8080; no
    # cloudflared config change needed here). Verifies the Cloudflare
    # Access JWT itself (see keyportal/app.py's verify_access_jwt) rather
    # than trusting the Cf-Access-Authenticated-User-Email header, so it
    # stays safe even if cloudflared's ingress is ever hand-edited to add
    # a stray public route.
    build:
      context: ./keyportal
      dockerfile: Dockerfile
    image: gb10-keyportal:local
    container_name: gb10-keyportal
    environment:
      - LITELLM_BASE_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - PENDING_TEAM_ID=${PENDING_TEAM_ID}
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN}
      # CF_ACCESS_AUD_KEYPORTAL is filled from the Cloudflare Zero Trust
      # dashboard (Access > Applications > local-llm-keys.uamishub.com).
      # app.py refuses to start (fails loudly, container restart-loops)
      # if this is blank rather than silently skipping JWT verification.
      - CF_ACCESS_AUD=${CF_ACCESS_AUD_KEYPORTAL}
      - ALLOWED_EMAIL_SUFFIXES=@crimson.ua.edu,@ua.edu
      - ADMIN_CONTACT=${ADMIN_CONTACT}
    volumes:
      - keyportal-data:/data
    depends_on:
      - litellm
    restart: unless-stopped

  cloudflared:
    image: ${CLOUDFLARED_DIGEST}
    container_name: gb10-cloudflared
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - litellm
    restart: unless-stopped

  node-exporter:
    image: ${NODE_EXPORTER_DIGEST}
    container_name: gb10-node-exporter
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped

  nvidia-gpu-exporter:
    image: ${NVIDIA_GPU_EXPORTER_DIGEST}
    container_name: gb10-nvidia-gpu-exporter
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "127.0.0.1:9835:9835"
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_DIGEST}
    container_name: gb10-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prom-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  alertmanager:
    image: ${ALERTMANAGER_DIGEST}
    container_name: gb10-alertmanager
    volumes:
      # NOTE: alertmanager.yml (no .template suffix) is the file
      # render-config.sh generates from alertmanager.yml.template + .env on
      # the host at ExecStartPre time. It is gitignored — do not create it by
      # hand and do not commit it if you do.
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_DIGEST}
    container_name: gb10-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://promaxgb10-d62a.taile5d412.ts.net:3001/
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  pg-data:
  keyportal-data:
  prom-data:
  grafana-data:
