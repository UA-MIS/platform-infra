model_list:
  # 2026-10-24: switched from vLLM to Ollama. Same model_name aliases, so no
  # client, key, or Continue config changes. vLLM container is stopped but not
  # removed -- rollback is: docker start gb10-vllm, then restore a backup of
  # this file and restart litellm.
  #
  # ollama_chat/ (not openai/) is REQUIRED: drop_params:true strips 
  # and  from a generic openai/ passthrough, so thinking stayed on
  # and num_ctx silently defaulted to the model max (which allocates a 16 GiB
  # f16 KV cache and spills layers to CPU at ~7.8 tok/s). Measured 2026-10-24.
  #
  # num_ctx 262144 keeps the previously advertised window, costing ~16 GiB of
  # KV. With vLLM stopped there is ~121 GiB free, so this is affordable.
  # max_input_tokens + max_output_tokens must still sum to num_ctx:
  #   253952 + 8192 = 262144.
  - model_name: qwen3.8-27b-base
    litellm_params:
      model: ollama_chat/qwen3.8:27b-mtp-q4_K_M
      api_base: http://100.103.27.65:11434
      think: false
      num_ctx: 262144
      keep_alive: -1
    model_info:
      mode: chat
      max_input_tokens: 253952
      max_output_tokens: 8192

  - model_name: qwen3.8-27b
    litellm_params:
      model: ollama_chat/qwen3.8:27b-mtp-q4_K_M
      api_base: http://100.103.27.65:11434
      think: false
      num_ctx: 262144
      keep_alive: -1
    model_info:
      mode: chat
      max_input_tokens: 253952
      max_output_tokens: 8192

  # Embeddings. NOTE the provider prefix: ollama/ NOT ollama_chat/.
  # ollama_chat is chat-only and /v1/embeddings against it fails with
  # "Unmapped LLM provider for this endpoint". 768-dimension vectors.
  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://100.103.27.65:11434
    model_info:
      mode: embedding

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_spend_logs: false
  store_prompts_in_spend_logs: false   # safe default for everyone; ungraded's
                                        # key additionally sets disable_logging
                                        # in its own metadata (Task 8) as a
                                        # second, key-specific guarantee.

litellm_settings:
  callbacks: ["prometheus"]
  require_auth_for_metrics_endpoint: false   # /metrics is only reachable via
                                              # the docker network + loopback
                                              # publish, never public — see
                                              # Task 13's scrape config.
  drop_params: true
