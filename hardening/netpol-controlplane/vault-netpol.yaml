# Control-plane NetworkPolicies — vault namespace (ADR-030 B1, SEC-ESO-1).
#
# Vault is the secrets store; it must be reachable ONLY by ESO (the
# external-secrets namespace) + provider-vault (the crossplane-system namespace,
# for tenant Vault Policy/AuthBackendRole MRs during onboarding, Track-5/ADR-031)
# + Backstage (the backstage namespace, backstage-vault-writer SA — the portal's
# Secrets tab, so teams can set tenant secrets via k8s-auth login)
# + the slides app (the slides namespace, slides-vault-writer SA — lab hosting;
# see the DIRECT-CALLER note below) + the node
# (kubelet probes) + itself (raft peers — Vault now runs 3-node Raft HA,
# vault-app.yaml ha.replicas: 3, so intra-namespace :8200/:8201 traffic is
# LIVE raft peering, not merely provisioned-for-later). Everything else is
# denied. This brings Vault under the same default-deny + scoped-allow posture
# as argocd/dex/harbor.
#
# DIRECT CALLERS vs ESO. Most Vault consumers on this cluster never appear in this
# list, because they read secrets through an ExternalSecret — and ESO always dials
# Vault from its OWN controller pod in ns external-secrets, so the packet's source
# namespace is `external-secrets` no matter which namespace the ExternalSecret and
# its target Secret live in. Only components that hold a projected
# serviceAccountToken (audience: vault) and call Vault's HTTP API themselves need a
# rule here. Today that is exactly two: `backstage` (portal Secrets tab) and
# `slides` (the lab-hosting backend, which WRITES each student's per-lab DB
# credentials to secret/labs/<labSlug>/<username> via slides-labs-writer; ESO then
# reads that path back into the student's lab namespace). If you add a namespace
# here, it is because that namespace's pods speak to Vault directly — an
# ExternalSecret alone is never a reason to add one.
#
# Lives in hardening/netpol-controlplane/ so it inherits the MANUAL-SYNC Application
# (platform-netpol-controlplane) — default-deny is applied to the vault namespace
# only via the deliberate, watched `argocd app sync`, never auto-applied (same
# lockout-avoidance + SEC-011 live-apply gate as the other control-plane netpols).
# NetworkPolicies are ADDITIVE (OR); these sit alongside the Cilium CNPs.
#
# Talos/Cilium CIDRs (proven-enforced, SEC-011): pods 10.244.0.0/16,
# services 10.96.0.0/12, nodes 10.237.168.0/22 (apiserver :6443 binds a node IP).
# NO external egress is granted to Vault: it has no public ingress and (in B1) does
# NOT round-trip to any external issuer — only the apiserver (TokenReview for the
# k8s auth method + service_registration) and DNS. (If Transit auto-unseal points
# at an EXTERNAL unsealer Vault later, add a scoped egress; the recommended unsealer
# is IN-CLUSTER, covered by the intra-cluster CIDRs.)

# --- default-deny (ingress + egress) for every pod in vault ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zz-default-deny
  namespace: vault
  labels:
    platform.capstone/component: platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# --- INGRESS: from ESO + provider-vault + Backstage + slides (the four
#     application clients), intra-namespace (raft peers — LIVE, 3-node HA), and
#     kubelet probes from the node. ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-eso-crossplane-backstage-and-raft
  namespace: vault
  labels:
    platform.capstone/component: platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # ESO controller (external-secrets ns) -> vault API :8200. The ExternalSecret
    # pull path. The human reaches the UI/API via `kubectl port-forward` (apiserver
    # path), not a netpol-gated route.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
      ports:
        - protocol: TCP
          port: 8200
    # provider-vault (crossplane-system ns) -> vault API :8200. Writes tenant Vault
    # Policy + AuthBackendRole MRs during tenant onboarding (Track-5/ADR-031). Scoped
    # to :8200 only — no other port, no other namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: crossplane-system
      ports:
        - protocol: TCP
          port: 8200
    # Backstage (backstage ns) -> vault API :8200. The backstage-vault-writer SA
    # logs in via k8s-auth to write tenant secrets from the portal's Secrets tab.
    # Scoped to :8200 only — no other port, no other namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backstage
      ports:
        - protocol: TCP
          port: 8200
    # slides (slides ns) -> vault API :8200. The slides-vault-writer SA logs in via
    # k8s-auth (role slides-labs-writer) and WRITES each student's per-lab DB
    # credentials to secret/labs/<labSlug>/<username>; ESO then reads that path back
    # into the student's lab namespace. This is a DIRECT call from the slides pod —
    # unlike every other consumer, it is not proxied by ESO, so it needs its own
    # rule (see the DIRECT CALLERS note in the header). Scoped to :8200 only — no
    # other port, no other namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: slides
      ports:
        - protocol: TCP
          port: 8200
    # Intra-namespace: raft peer traffic (:8201) + active/standby forwarding
    # (:8200) between the 3 Vault pods — required now that ha.replicas: 3.
    - from:
        - podSelector: {}
    # Kubelet readiness/liveness probes originate from the NODE IP (not a
    # pod/namespace) — without this, default-deny fails Vault's probes and the
    # StatefulSet never goes Ready.
    - from:
        - ipBlock:
            cidr: 10.237.168.0/22
---
# --- EGRESS: DNS, intra-cluster (raft peers + the in-cluster unsealer Vault if
#     Transit auto-unseal is adopted), and the apiserver (TokenReview for k8s auth +
#     service_registration "kubernetes"). NO external egress. ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-scoped
  namespace: vault
  labels:
    platform.capstone/component: platform
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS to CoreDNS (kube-system), UDP+TCP 53.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Intra-cluster: any pod (10.244/16) or service (10.96/12) — covers raft peers
    # + an in-cluster Transit unsealer Vault (the recommended auto-unseal source).
    - to:
        - ipBlock:
            cidr: 10.244.0.0/16
        - ipBlock:
            cidr: 10.96.0.0/12
    # kube-apiserver on the node IPs (:6443) — TokenReview (k8s auth method) +
    # service_registration "kubernetes" both call the apiserver.
    - to:
        - ipBlock:
            cidr: 10.237.168.0/22
      ports:
        - protocol: TCP
          port: 6443
