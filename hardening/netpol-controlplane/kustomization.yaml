# netpol-controlplane (P2-hardening, SEC-009/SEC-013) — default-deny + scoped
# allows for the control-plane namespaces (argocd, dex) AND the harbor registry
# namespace. Compensating control for the accepted oidc.tls.insecure.skip.verify
# (PR #4 / SEC-009) and Harbor's matching oidc_verify_cert:false (SEC-012/SEC-013).
#
# Additive to ArgoCD's upstream per-component ingress policies. k3s embedded
# kube-router enforces these (no FQDN egress — external egress is port-scoped to
# 443). Each manifest pins its own namespace, overriding the appset's neutral
# kube-system default. Managed by the platform-services-appset.
#
# Phase-3: tighten external egress to GitHub's CIDRs (or move to an FQDN-capable
# CNI), and remove alongside the skip.verify line when the issuer goes ACME-public.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - argocd-netpol.yaml
  - dex-netpol.yaml
  - harbor-netpol.yaml          # SEC-013: extend the SEC-009 fence to the harbor ns
  - apiserver-cnp.yaml          # Cilium: kube-apiserver egress by entity (ipBlock can't — flannel->Cilium gap)
  - vault-netpol.yaml           # ADR-030 B1: default-deny + ESO-only ingress for the vault ns (was unwired — #107 gap)
  - vault-unsealer-netpol.yaml  # Track-2 DR: default-deny + vault-ns-only ingress for the unsealer ns
  - vault-cnp.yaml              # SEC-B1: Cilium apiserver/cluster egress by entity for vault+unsealer (ipBlock can't — flannel->Cilium gap)
  - crossplane-db-cnp.yaml      # ADR-033: Cilium egress for provider-sql -> off-cluster DB tier (tailnet:3306) + its apiserver/DNS surface
  # NOTE: the service-mesh mutual-auth CNPs (mtls-vault-cnp.yaml,
  # mtls-harbor-provider-cnp.yaml) deliberately do NOT live here. Cilium
  # v1.17.4 (pinned, see clusters/real-talos/cilium-mtls-values.yaml) fails
  # CLOSED — drops the flow — when `authentication.mode: required` can't
  # complete a handshake (fail-open only lands in Cilium 1.19+). This
  # directory is swept by the manual-sync `platform-netpol-controlplane`
  # Application (see applicationsets/netpol-controlplane-app.yaml) alongside
  # routine, SPIRE-independent netpol changes, so a routine
  # `argocd app sync platform-netpol-controlplane` run before SPIRE is live
  # would drop ESO/Backstage/provider-vault -> Vault and
  # provider-harbor -> Harbor traffic. Those two manifests live in
  # `hardening/service-mesh-mtls/` instead — a directory with NO ArgoCD
  # Application wired to it (auto or manual) — and are applied only by an
  # operator running `kubectl apply -k hardening/service-mesh-mtls/` by hand,
  # after confirming SPIRE is live (docs/cilium-cni-runbook.md Step 5).

labels:
  - pairs:
      platform.capstone/component: platform
    includeSelectors: false
