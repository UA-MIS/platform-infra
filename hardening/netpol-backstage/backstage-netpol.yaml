# Backstage ("The Process") namespace NetworkPolicies (M3 §3, devops).
#
# Default-deny + scoped egress for ns `backstage`. Backstage is a SERVER (unlike the
# arc-runners, which are clients) — so it takes INGRESS from Traefik on :7007, and its
# egress is scoped to exactly what the portal + the M3 capstone:seal-secret action need:
#   egress: DNS; in-cluster (bundled Postgres :5432, the catalog/scaffolder loopback);
#           Dex/issuer :443 (OIDC discovery + token); GitHub :443 (Octokit PR publish for
#           the seal-secret action + the githubOrg catalog ingestion + Scaffolder).
#   NO kube-system sealed-secrets controller egress — M3 seals OFFLINE against the mounted
#   PUBLIC cert (D-047 A2); the backstage pod never calls the controller.
#   ingress: Traefik (the portal HTTP route) + kubelet probes.
#
# ⚠ ENFORCEMENT: INERT until the Cilium swap (Talos ships flannel = no NetworkPolicy
# backend; memory capstone-cilium-swap-state / capstone-talos-netpol-inert-flannel). These
# rules are accepted but NOT enforced today — this is INTENT, wired as a MANUAL-sync
# Application (like platform-netpol-runners / SEC-011) so default-deny never lands on the
# running portal unattended. Enforcement = the explicit watched `argocd app sync
# platform-netpol-backstage` AFTER the Cilium swap + CIDR re-confirm + a deny-test.
# CIDRs (Talos, live): pods 10.244.0.0/16, svc 10.96.0.0/12, nodes 10.237.168.0/22
# (LAN incl. apiserver :6443), tailnet 100.64.0.0/10. Same Cilium CIDR-identity caveats
# as the runner netpol apply (node/tailnet excepts inert until policyCIDRMatchMode:nodes).

# --- default-deny (ingress + egress) for every pod in backstage ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zz-default-deny
  namespace: backstage
  labels:
    platform.capstone/component: platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# --- INGRESS: Traefik (portal HTTP route to :7007) + kubelet probes (node IP). ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-traefik-and-probes
  namespace: backstage
  labels:
    platform.capstone/component: platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    # Traefik ingress controller (the process.<domain> route) → backend :7007.
    # Traefik runs in kube-system on this cluster (NOT a dedicated `traefik` ns) — scope
    # by ns + the traefik pod label so this doesn't also admit other kube-system pods.
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 7007
    # Kubelet readiness/liveness/startup probes originate from the NODE IP.
    - from:
        - ipBlock:
            cidr: 10.237.168.0/22   # Talos node LAN segment (kubelet probe source)
---
# --- EGRESS: DNS + in-cluster (Postgres :5432 + catalog/scaffolder loopback via svc) +
#     Dex/issuer :443 + GitHub :443. NO kube-system controller egress (A2 offline seal). ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-scoped
  namespace: backstage
  labels:
    platform.capstone/component: platform
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS to CoreDNS (kube-system), UDP+TCP 53.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Bundled Postgres (backstage-postgresql) — same namespace, :5432.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # In-cluster services (10.96/12): Dex/issuer (id.capstone via Traefik ClusterIP :443)
    # + the catalog/scaffolder self-call (backstage talks to its OWN backend :7007 over the
    # loopback, but the auth resolver's catalog client uses localhost — covered by the pod's
    # own egress; the svc path here is for Dex discovery + any in-cluster service the portal
    # reads). PORT-scoped to 443 (Traefik websecure) + 8443 (Traefik pod port, post-xlate)
    # + 5432 (covered above) — mirrors the runner-netpol Traefik-pod-port lesson.
    - to:
        - ipBlock:
            cidr: 10.96.0.0/12
      ports:
        - protocol: TCP
          port: 443     # Dex/issuer + in-cluster HTTPS via Traefik websecure Service
        - protocol: TCP
          port: 8443    # Traefik websecure POD port (:443 svc -> :8443 pod, Cilium post-xlate)
    # External HTTPS:443 — GitHub (Octokit PR publish for seal-secret + githubOrg ingestion
    # + Scaffolder) and the OIDC issuer if it resolves to the public edge. Port-scoped (no
    # FQDN egress until Cilium). Excepts block cross-tenant + apiserver-via-node-IP/tailnet
    # (the latter two INERT until policyCIDRMatchMode:nodes + Host Firewall — see runner netpol).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.244.0.0/16    # pods (cross-tenant + lateral) — ENFORCED (endpoint identity)
              - 10.96.0.0/12     # services — covered by the scoped allow above
              - 10.237.168.0/22  # NODE LAN incl. apiserver :6443 — INERT until policyCIDRMatchMode:nodes
              - 100.64.0.0/10    # TAILNET (Talos overlay) — INERT until policyCIDRMatchMode:nodes + Host Firewall
      ports:
        - protocol: TCP
          port: 443
