# Crossplane runtime Application (ADR-031). Installs the FOUR providers + the two
# composition functions + their ProviderConfigs + the curated provider-kubernetes
# RBAC + the (placeholder) provider credentials — everything under
# platform-services/crossplane/ EXCEPT apis/ (the XRD/Composition, which need the
# provider + function CRDs to exist first → crossplane-apis-app, wave 1).
#
# Directory-source Application (recurse) over platform-services/crossplane, with
# apis/ and docs excluded. Within the app, sync-waves order (annotations live on the
# manifests themselves under platform-services/crossplane/):
#   wave 0: Provider + Function packages (providers/), the provider-kubernetes
#           DeploymentRuntimeConfig (its Provider's runtimeConfigRef points at it, so it
#           MUST exist by the time the provider builds its Deployment or the provider
#           never goes Healthy and the wave deadlocks), RBAC (rbac/), creds (creds/).
#   wave 2: ProviderConfigs (config/*) + the SecretStore/PushSecret plumbing
#           (config/vault-push-secretstore.yaml). The ProviderConfig kinds
#           (github.upbound.io, harbor.crossplane.io, vault.upbound.io,
#           kubernetes.crossplane.io) are installed BY the wave-0 provider packages, so
#           they only apply cleanly once those packages are Installed+Healthy.
#
# WHY SkipDryRunOnMissingResource=true (below): ArgoCD dry-run-validates every resource
# in the sync together. The wave-2 ProviderConfigs reference CRDs that don't exist until
# the wave-0 providers install, so their dry-run fails and — without this option — aborts
# the WHOLE sync ("one or more synchronization tasks are not valid"), so the providers
# themselves never get applied and nothing ever installs. SkipDryRunOnMissingResource
# lets ArgoCD apply a resource whose CRD isn't registered yet instead of failing; the
# sync-waves then guarantee the providers install first so the ProviderConfigs land
# cleanly on the following wave (canonical ArgoCD CRD-bootstrap pattern).
#
# ⚠ DO NOT APPLY without the one-time SRE review (ADR-031 constraint #4). THE review
# focus lives here: rbac/provider-kubernetes-rbac.yaml (the privileged ClusterRole —
# it can mint AppProjects + namespaced RBAC; it is hand-curated, never cluster-admin)
# and creds/ (the four scoped provider credentials — shipped as PLACEHOLDER
# SealedSecret stubs; the real values are the operator's keyboard).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-crossplane-runtime
  namespace: argocd
  labels:
    platform.capstone/component: platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # after core (-1), before apis (1)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/UA-MIS/platform-infra
    targetRevision: HEAD
    path: platform-services/crossplane
    directory:
      recurse: true
      # apis/ (XRD+Composition) is its own app (needs provider+function CRDs first);
      # docs are not manifests.
      #
      # POSTGRES CUTOVER (ADR-036, #350/#356): db-tier-postgres-admin was resealed with
      # real creds onto the dedicated CNPG cluster (capstone-tenant-pg-rw.db-tier), so the
      # earlier gate — a placeholder SealedSecret carrying illegal-base64 ciphertext that
      # left the app Degraded — no longer applies. The two postgres entries
      # (config/providerconfig-postgres.yaml + creds/postgres-admin-creds-sealed.yaml) are
      # therefore re-enabled here (removed from the exclude glob) so ArgoCD tracks and
      # applies them. The companion db-tier ingress rule (crossplane-system -> CNPG:5432)
      # is added in platform-services/db-tier/netpol.yaml alongside this change.
      exclude: '{apis/**,README.md,creds/README.md}'
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false    # crossplane-system created by platform-crossplane-core
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true   # ProviderConfig CRDs are installed by the
                                           # wave-0 provider packages; skip dry-run so
                                           # their absence doesn't abort the whole sync
    retry:
      limit: 10                  # ProviderConfigs wait for provider CRDs to register
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
