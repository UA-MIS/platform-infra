# Harbor Application (P2.2, §1.5, D-022) — self-hosted OCI registry via the Harbor
# Helm chart. DEPLOY METHOD = (A) Helm-source Application (orchestrator direction;
# human to confirm A vs B kustomize-helm-inflation — see harbor/README.md). The
# chart repo is pinned and must be allowlisted in the `platform` AppProject
# sourceRepos (see bootstrap/platform-appproject.yaml patch in this PR — DO NOT
# MERGE the allowlist change until the human confirms method A).
#
# Root-app recurses applicationsets/, so this Application is registered. Values are
# declarative in git below (method-portable: the same values block feeds a
# kustomize helmCharts: inflation if we pivot to method B).
#
# Chart: harbor v1.19.1 (Harbor app v2.x), pinned. Storage: ceph-block (Phase-4 Rook
# RBD, the cluster default SC). Bundled postgres+redis (external DB is Phase-4). OIDC: the
# chart exposes externalURL + serves the UI; the OIDC AUTH MODE itself is a Harbor
# system-config applied post-install (oidc-config Job / documented) pointing at the
# shared Dex broker — see harbor/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-harbor
  namespace: argocd
  labels:
    platform.capstone/component: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://helm.goharbor.io           # PINNED chart repo (sourceRepos allowlist)
    chart: harbor
    targetRevision: 1.19.1                       # pinned chart version (no ^/~/latest)
    helm:
      releaseName: harbor
      values: |
        # --- Exposure: Traefik ingress on harbor.${PLATFORM_DOMAIN} ---
        # PUBLIC TLS is terminated at the Cloudflare edge (Universal SSL, D-036); the
        # Cloudflare Tunnel routes *.capstone.uamishub.com -> Traefik. The ingress keeps
        # tls.enabled with Traefik's internal wildcard TLSStore cert (certSource:none =
        # no per-ingress secret) — harmless internally; the cert clients SEE is CF's.
        expose:
          type: ingress
          tls:
            enabled: true
            certSource: none
          ingress:
            hosts:
              core: harbor.capstone.uamishub.com
            className: traefik
        # externalURL = the PUBLIC https host (CF-edge-terminated). Drives the OIDC
        # redirect + the registry endpoint clients pull/push against.
        externalURL: https://harbor.capstone.uamishub.com

        # --- Admin password + data key from the SealedSecret (harbor-admin) ---
        existingSecretAdminPassword: harbor-admin
        existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
        existingSecretSecretKey: harbor-admin     # 16-char data-encryption key

        # --- Persistence: ceph-block (Phase-4 Rook RBD, the cluster default SC).
        #     Was local-path (k3d), which does NOT exist on Talos -> every Harbor PVC
        #     hung Pending "unbound immediate PersistentVolumeClaims" and the data
        #     tier never started. ceph-block is replica-3 RWO RBD (survives a node
        #     loss). ---
        # registry size: 20Gi -> 60Gi (2026-07-09). The registry PVC hit 100% full
        # (ENOSPC/Err:28 on blob upload -> every Backstage image push failed) because
        # tag pruning was never configured: backstage/backstage-process accumulated 21
        # tagged artifacts (~8.5GB) and backstage/cache (Kaniko layer cache) accumulated
        # 31 layers, with nothing reclaiming either. ceph-block supports online
        # expansion, so the PVC was live-resized 20Gi -> 60Gi to unblock pushes
        # immediately; this bumps the git value to match so ArgoCD does not show
        # harbor-registry OutOfSync (PVC shrink is unsupported, but the sizes must
        # still agree — ArgoCD/K8s reject a spec.resources.requests.storage that is
        # LOWER than the bound PVC's current size, which 20Gi now is). The retention +
        # GC setup below (platform-services/harbor-retention-gc-config) is the actual
        # fix for the leak; 60Gi is headroom, not a substitute for pruning.
        #
        # registry size: 60Gi -> 100Gi (2026-09-16). SECOND ENOSPC outage, and the
        # sentence directly above this one was WRONG about it. Retention + GC were
        # both configured, both running nightly, and both reporting Success (GC 1918
        # at 02:30 on 2026-09-16 freed 658MB) — and the PVC still hit 100%, because
        # what actually filled it was a class of data neither one can see:
        #
        #   22.7 GiB of ORPHANED MULTIPART UPLOADS under
        #   /storage/docker/registry/v2/repositories/**/_uploads/
        #
        # `_uploads` are half-finished blob PUT sessions. They are not tags, so tag
        # retention never selects them; they are not untagged manifests or referenced
        # blobs, so GC's delete_untagged never walks them; and Harbor's own quota
        # accounting does not count them either (live evidence: quota API summed to
        # ~39.5G across all 23 projects while `df` on the PVC showed 59G used — the
        # ~20G delta IS the orphan pile, invisible to Harbor at every layer).
        # base-images/library/golang alone held 41 dead sessions / 20.8GB while
        # showing ZERO tags.
        #
        # The producer is the nightly dockerhub-mirror-populate CronJob: `crane copy`
        # of large base images (golang, rust, node, dotnet/sdk), which retries each
        # image 3x, so one failing multi-hundred-MB copy strands up to 3 partial
        # sessions. Jobs -29823960 and -29825400 both FAILED, and the orphan
        # `startedat` timestamps cluster exactly on those runs.
        #
        # The ONLY mechanism that reclaims `_uploads` is registry upload_purging,
        # configured below. It was already enabled at the chart default age=168h
        # (7 days) — enabled, correct, and structurally useless here, because the
        # leak rate (~4-7GB/day) fills the volume in ~4 days and nothing becomes
        # purge-eligible for 7. The fix is the age, not the enable flag.
        #
        # 100Gi is again headroom, NOT the fix — upload_purging below is the fix, and
        # the per-project quotas in platform-services/harbor-retention-gc-config are
        # the enforcement ceiling. Projected steady state under all three: ~40-45G of
        # ~98G usable (~45%), with no unbounded consumer remaining.
        persistence:
          enabled: true
          persistentVolumeClaim:
            registry:   { storageClass: ceph-block, size: 100Gi }
            jobservice:
              jobLog:   { storageClass: ceph-block, size: 1Gi }
            database:   { storageClass: ceph-block, size: 2Gi }
            redis:      { storageClass: ceph-block, size: 1Gi }
            trivy:      { storageClass: ceph-block, size: 5Gi }

        # --- Trivy vulnerability scanning ENABLED (scan-on-push set at project
        #     level post-install; enforce-block strength is a D-022 should-decide —
        #     default scan+WARN, flagged for the human, see README) ---
        # Resource-reclaim (VPA-driven, task follow-up): chart default is a flat
        # 200m/512Mi request, 1/1Gi limit for every install regardless of scale.
        # Live VPA target for `trivy` is mem ~175Mi (+15% below); cpu keeps a
        # conservative floor above the idle `kubectl top` reading (1m) because
        # Trivy's real cost is a scan-time CPU burst, not steady-state.
        trivy:
          enabled: true
          resources:
            requests: { cpu: 50m, memory: 208Mi }
            limits: { cpu: 500m, memory: 768Mi }

        # --- Deployment update strategy: Recreate (NOT the chart default
        #     RollingUpdate). The registry + jobservice Deployments mount RWO
        #     (ReadWriteOnce) ceph-block RBD PVCs — single-mounter volumes. Under
        #     RollingUpdate the chart surges a NEW pod before the OLD one releases
        #     the PVC, so the new pod hangs on `Multi-Attach error ... Volume is
        #     already exclusively attached to one node` and every rollout (image
        #     bump, values change, node drain) deadlocks. The Harbor chart README:
        #     "updateStrategy.type ... should be set to Recreate if RWM for volumes
        #     is not supported." We are RWO single-replica, so Recreate is correct.
        #     (Revisit ONLY if we move registry to RWX/S3 + multi-replica HA, where
        #     RollingUpdate becomes safe again — that is a Phase-4+ HA decision.)
        # The chart's ONLY knob is updateStrategy.type (Context7 /goharbor/harbor-helm,
        # 2026-06-28 — there is no rollingUpdate value to set; the registry/jobservice
        # templates hardcode `rollingUpdate: null` whenever type=Recreate). The apply
        # failure is NOT a values bug — see the syncPolicy.syncOptions block below for
        # the real (ArgoCD + ServerSideApply) root cause and fix.
        updateStrategy:
          type: Recreate

        # Single-replica everything for Phase-2 local (laptop). Phase-4 scales.
        #
        # Resource-reclaim (VPA-driven, task follow-up): the chart ships every one
        # of these components with NO requests/limits at all (Burstable-unbounded —
        # verified live, `kubectl get deploy ... -o jsonpath=...resources` returns
        # `{}`). Values below are the live VPA/Goldilocks recommendation target +
        # ~15% headroom where the target is a real (non-floor) measurement; where
        # the target is the recommender's short-history floor (15m cpu / 100Mi
        # mem — the number every near-idle container reports under ~1h of
        # history), this instead uses observed `kubectl top` actual usage + ~15%
        # headroom, which is the more trustworthy signal for these low-traffic
        # components.
        #
        # ⚠ registry (the `registry` sub-container specifically) is the ONE
        # exception to "low-traffic" above, and its 100m CPU limit was WRONG —
        # found live 2026-08-16 (DEPLOY-1 follow-up): CFS-throttled 13-78% of
        # periods for the full duration of a real image push, producing
        # intermittent-then-fatal 502 Bad Gateway on the PATCH blob-upload
        # endpoint. VPA here is controlledValues: RequestsOnly (see
        # vpa-policies/harbor-vpa.yaml) — it NEVER touches the limit, so no
        # VPA recommendation could have caught or fixed this; the
        # idle-usage-derived 100m ceiling was simply never validated against
        # actual push-time load. B4 made registry the CI push/pull path for
        # every tenant, so its steady-state idle profile (the number every
        # `kubectl top` snapshot shows) is not representative of the
        # workload that matters.
        #
        # First bump (500m, matching trivy's ceiling) was INSUFFICIENT —
        # confirmed by direct reproduction (crane push of a synthetic 1.4GB
        # random-content layer through the same in-cluster Traefik path
        # Kaniko/ARC runners use, bypassing Cloudflare via /etc/hosts, same
        # as their hostAliases): still throttled 33-65% of periods during
        # the push, still 502'd. Root cause is Docker Registry's own
        # streaming digest verification -- it SHA256-hashes the full blob
        # body while writing it, which is genuinely CPU-bound; raw storage
        # write to the PVC measured at ~165MB/s (200MB in 1.21s, not the
        # bottleneck), and Ceph reported HEALTH_OK with 33 active+clean PGs
        # throughout (not the bottleneck either) -- registry logs confirmed
        # the large-blob PATCH request was "authorized" but never logged
        # "response completed" before the client gave up, consistent with
        # hashing throughput being CPU-starved at 500m. Bumped to 2000m (2
        # full cores -- node capstone-w1 has 16 allocatable, ample headroom)
        # /256Mi. Memory untouched at the time: never observed near its
        # ceiling in either CPU-throttling incident.
        #
        # That "memory untouched" call turned out to be premature, not wrong
        # in isolation -- a THIRD incident the same night. Once the actual
        # root cause (Traefik's websecure entrypoint readTimeout, default
        # 60s, see traefik-app.yaml) was fixed, requests could finally run
        # to completion instead of being cut off by Traefik at ~60-70s. That
        # unmasked a real memory ceiling: harbor-registry OOMKilled (exitCode
        # 137, kubectl containerStatuses.lastState.terminated.reason)
        # partway through a full-length large-blob push, confirmed live
        # 2026-08-16T07:05:13Z -- the OOM timestamp lines up exactly with
        # the push's failure. The 60s timeout had been an ACCIDENTAL safety
        # net: it always killed the connection before the registry got far
        # enough into a large blob for memory to matter, so the ceiling was
        # invisible until the timeout itself was fixed. Bumped limit
        # 256Mi -> 1Gi. CPU (2000m) is untouched -- this incident is memory-
        # shaped (OOMKilled), not CPU-shaped (no throttling signature).
        # registryctl (`controller` below) is untouched: it serves Harbor's
        # own admin/GC API, not the Docker Registry v2 blob-upload path
        # Kaniko's PATCH requests hit, and showed no throttling or memory
        # pressure in any of the three incidents.
        portal:
          replicas: 1
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
        core:
          replicas: 1
          resources:
            requests: { cpu: 20m, memory: 192Mi }
            limits: { cpu: 200m, memory: 384Mi }
        jobservice:
          replicas: 1
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
        registry:
          replicas: 1
          # --- upload_purging: THE fix for the 2026-09-16 ENOSPC outage. ---
          # Reclaims abandoned multipart upload sessions under
          # /storage/docker/registry/v2/repositories/**/_uploads/. This is the only
          # mechanism in Harbor that touches them — tag retention and GC are both
          # structurally blind to `_uploads` (see the persistence block above for the
          # full evidence trail), which is why the previous incident's retention+GC
          # fix did not prevent this one.
          #
          # age: 168h (chart default, 7 days) -> 24h.
          #   168h could not work here: the mirror CronJob strands ~4-7GB/day of dead
          #   sessions, which fills the volume in roughly 4 days, while nothing became
          #   purge-eligible until day 7. The purge was enabled and still never got
          #   the chance to fire against this pile.
          #   24h is safe against killing a LEGITIMATE in-flight upload: the largest
          #   real push path here is the mirror CronJob, itself capped at
          #   activeDeadlineSeconds: 3600 (1h), and Kaniko tenant pushes complete in
          #   minutes. Nothing on this platform legitimately holds an upload session
          #   open for 24h, so the margin is ~24x the worst realistic case.
          # interval: 24h -> 1h.
          #   The interval timer restarts from process start, so with a 24h interval a
          #   registry pod that restarts more often than daily may never purge at all.
          #   Hourly makes the purge independent of restart cadence and bounds the
          #   worst-case orphan lifetime to ~25h instead of ~48h.
          # dryrun stays false — dryrun:true logs candidates and frees nothing.
          upload_purging:
            enabled: true
            age: 24h
            interval: 1h
            dryrun: false
          registry:
            resources:
              requests: { cpu: 100m, memory: 128Mi }
              limits: { cpu: 2000m, memory: 1Gi }
          controller:
            resources:
              requests: { cpu: 20m, memory: 64Mi }
              limits: { cpu: 100m, memory: 128Mi }

        database:
          internal:
            resources:
              requests: { cpu: 30m, memory: 128Mi }
              limits: { cpu: 200m, memory: 256Mi }

        redis:
          internal:
            resources:
              requests: { cpu: 20m, memory: 64Mi }
              limits: { cpu: 100m, memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false      # harbor ns ships as its own object (platform-services/harbor)
      # ROOT CAUSE of the platform-harbor OutOfSync stall: the goharbor chart renders the
      # registry + jobservice (RWO ceph-block PVC) Deployments with
      #   strategy: { type: Recreate, rollingUpdate: null }
      # — the Helm "delete this key" idiom. ArgoCD STRIPS null-valued fields before it
      # applies, so under ServerSideApply it sent only `strategy.type: Recreate`, while the
      # stale `strategy.rollingUpdate` block (API-server-defaulted back when these
      # Deployments were RollingUpdate, and OWNED BY kube-controller-manager) stayed put.
      # SSA cannot drop a field it does not own → the merged object is invalid
      # ("spec.strategy.rollingUpdate: Forbidden when type is 'Recreate'") and every sync
      # was rejected (verified via managedFields: argocd-controller owned only f:strategy.f:type).
      # FIX: Replace=true uses `kubectl replace` (full overwrite, not a field-merge), so the
      # rendered spec — Recreate with NO rollingUpdate — lands verbatim and is valid.
      # ApplyOutOfSyncOnly scopes replace to DRIFTED resources only, so the in-sync
      # StatefulSets (database/redis/trivy) and ClusterIP Services are never replaced
      # (their volumeClaimTemplates / clusterIP are immutable and would reject a replace).
      # (goharbor ships no CRDs/large objects, so the former ServerSideApply=true was inert here.)
      - Replace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
