# Harbor Application (P2.2, §1.5, D-022) — self-hosted OCI registry via the Harbor
# Helm chart. DEPLOY METHOD = (A) Helm-source Application (orchestrator direction;
# human to confirm A vs B kustomize-helm-inflation — see harbor/README.md). The
# chart repo is pinned and must be allowlisted in the `platform` AppProject
# sourceRepos (see bootstrap/platform-appproject.yaml patch in this PR — DO NOT
# MERGE the allowlist change until the human confirms method A).
#
# Root-app recurses applicationsets/, so this Application is registered. Values are
# declarative in git below (method-portable: the same values block feeds a
# kustomize helmCharts: inflation if we pivot to method B).
#
# Chart: harbor v1.19.1 (Harbor app v2.x), pinned. Storage: ceph-block (Phase-4 Rook
# RBD, the cluster default SC). Bundled postgres+redis (external DB is Phase-4). OIDC: the
# chart exposes externalURL + serves the UI; the OIDC AUTH MODE itself is a Harbor
# system-config applied post-install (oidc-config Job / documented) pointing at the
# shared Dex broker — see harbor/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-harbor
  namespace: argocd
  labels:
    platform.capstone/component: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://helm.goharbor.io           # PINNED chart repo (sourceRepos allowlist)
    chart: harbor
    targetRevision: 1.19.1                       # pinned chart version (no ^/~/latest)
    helm:
      releaseName: harbor
      values: |
        # --- Exposure: Traefik ingress on harbor.${PLATFORM_DOMAIN} ---
        # PUBLIC TLS is terminated at the Cloudflare edge (Universal SSL, D-036); the
        # Cloudflare Tunnel routes *.capstone.uamishub.com -> Traefik. The ingress keeps
        # tls.enabled with Traefik's internal wildcard TLSStore cert (certSource:none =
        # no per-ingress secret) — harmless internally; the cert clients SEE is CF's.
        expose:
          type: ingress
          tls:
            enabled: true
            certSource: none
          ingress:
            hosts:
              core: harbor.capstone.uamishub.com
            className: traefik
        # externalURL = the PUBLIC https host (CF-edge-terminated). Drives the OIDC
        # redirect + the registry endpoint clients pull/push against.
        externalURL: https://harbor.capstone.uamishub.com

        # --- Admin password + data key from the SealedSecret (harbor-admin) ---
        existingSecretAdminPassword: harbor-admin
        existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
        existingSecretSecretKey: harbor-admin     # 16-char data-encryption key

        # --- Persistence: ceph-block (Phase-4 Rook RBD, the cluster default SC).
        #     Was local-path (k3d), which does NOT exist on Talos -> every Harbor PVC
        #     hung Pending "unbound immediate PersistentVolumeClaims" and the data
        #     tier never started. ceph-block is replica-3 RWO RBD (survives a node
        #     loss). ---
        persistence:
          enabled: true
          persistentVolumeClaim:
            registry:   { storageClass: ceph-block, size: 20Gi }
            jobservice:
              jobLog:   { storageClass: ceph-block, size: 1Gi }
            redis:      { storageClass: ceph-block, size: 1Gi }
            trivy:      { storageClass: ceph-block, size: 5Gi }
            # (no `database` entry: database.type is external below, so the chart
            # never renders the bundled-postgres StatefulSet/PVC — see database:.)

        # --- Trivy vulnerability scanning ENABLED (scan-on-push set at project
        #     level post-install; enforce-block strength is a D-022 should-decide —
        #     default scan+WARN, flagged for the human, see README) ---
        # Resource-reclaim (VPA-driven, task follow-up): chart default is a flat
        # 200m/512Mi request, 1/1Gi limit for every install regardless of scale.
        # Live VPA target for `trivy` is mem ~175Mi (+15% below); cpu keeps a
        # conservative floor above the idle `kubectl top` reading (1m) because
        # Trivy's real cost is a scan-time CPU burst, not steady-state.
        trivy:
          enabled: true
          resources:
            requests: { cpu: 50m, memory: 208Mi }
            limits: { cpu: 500m, memory: 768Mi }

        # --- Deployment update strategy: Recreate (NOT the chart default
        #     RollingUpdate). The registry + jobservice Deployments mount RWO
        #     (ReadWriteOnce) ceph-block RBD PVCs — single-mounter volumes. Under
        #     RollingUpdate the chart surges a NEW pod before the OLD one releases
        #     the PVC, so the new pod hangs on `Multi-Attach error ... Volume is
        #     already exclusively attached to one node` and every rollout (image
        #     bump, values change, node drain) deadlocks. The Harbor chart README:
        #     "updateStrategy.type ... should be set to Recreate if RWM for volumes
        #     is not supported." We are RWO single-replica, so Recreate is correct.
        #     (Revisit ONLY if we move registry to RWX/S3 + multi-replica HA, where
        #     RollingUpdate becomes safe again — that is a Phase-4+ HA decision.)
        # The chart's ONLY knob is updateStrategy.type (Context7 /goharbor/harbor-helm,
        # 2026-06-28 — there is no rollingUpdate value to set; the registry/jobservice
        # templates hardcode `rollingUpdate: null` whenever type=Recreate). The apply
        # failure is NOT a values bug — see the syncPolicy.syncOptions block below for
        # the real (ArgoCD + ServerSideApply) root cause and fix.
        updateStrategy:
          type: Recreate

        # Single-replica everything for Phase-2 local (laptop). Phase-4 scales.
        #
        # Resource-reclaim (VPA-driven, task follow-up): the chart ships every one
        # of these components with NO requests/limits at all (Burstable-unbounded —
        # verified live, `kubectl get deploy ... -o jsonpath=...resources` returns
        # `{}`). Values below are the live VPA/Goldilocks recommendation target +
        # ~15% headroom where the target is a real (non-floor) measurement; where
        # the target is the recommender's short-history floor (15m cpu / 100Mi
        # mem — the number every near-idle container reports under ~1h of
        # history), this instead uses observed `kubectl top` actual usage + ~15%
        # headroom, which is the more trustworthy signal for these low-traffic
        # components.
        portal:
          replicas: 1
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
        core:
          replicas: 1
          resources:
            requests: { cpu: 20m, memory: 192Mi }
            limits: { cpu: 200m, memory: 384Mi }
        jobservice:
          replicas: 1
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
        registry:
          replicas: 1
          registry:
            resources:
              requests: { cpu: 20m, memory: 64Mi }
              limits: { cpu: 100m, memory: 128Mi }
          controller:
            resources:
              requests: { cpu: 20m, memory: 64Mi }
              limits: { cpu: 100m, memory: 128Mi }

        # --- Database: EXTERNAL, the in-cluster CNPG cluster `capstone-pg` (ns
        #     db-tier, PostgreSQL 17 via the CloudNativePG operator) — replaces the
        #     chart's bundled internal Postgres StatefulSet (PG 15.17). CNPG already
        #     has a `harbor` role + `harbor` database provisioned (Database CR
        #     capstone-pg-harbor, owner `harbor` — platform-services/cnpg/cluster/
        #     databases.yaml). The RW service is only reachable in-cluster
        #     (capstone-pg-rw.db-tier.svc.cluster.local:5432); db-tier's default-deny
        #     NetworkPolicy needed an explicit ingress allow for the harbor namespace
        #     on 5432 (platform-services/db-tier/netpol.yaml, same PR).
        #
        #     ⚠ PG17 COMPATIBILITY: Harbor 2.15.x (this chart's app version) only
        #     OFFICIALLY SUPPORTS PostgreSQL 15.x for its external-DB target
        #     (goharbor/harbor maintainer confirmation, Oct 2025:
        #     https://github.com/goharbor/harbor/issues/22456 — "PG17 not officially
        #     support yet"). A user on Harbor chart 1.17.0/app 2.13.0 against a PG17-
        #     family server hit a real GC-job failure (SQLSTATE 22007, "invalid value
        #     ... for MON" — a date-format function whose overload resolution changed
        #     between PG15 and PG17: same issue thread, 2026-04-23 comment). This is
        #     UNSUPPORTED/AT-RISK, not just untested — verify GC + core CRUD paths
        #     immediately after cutover, and be ready to revert database.type to
        #     `internal` if GC (or any core.*database* path) errors.
        #
        #     coreDatabase is "harbor" (the actual database name CNPG created), NOT
        #     the chart's own "registry" default — that default is just the name the
        #     bundled Postgres happens to init with, Harbor itself has no hardcoded
        #     dependency on the literal string "registry". Only ONE database is
        #     needed: Harbor dropped Notary years ago (no notary_server/
        #     notary_signer values exist anywhere in this chart), and the live
        #     internal DB confirms a single `registry` database (no others).
        database:
          type: external
          external:
            host: "capstone-pg-rw.db-tier.svc.cluster.local"
            port: "5432"
            username: "harbor"
            coreDatabase: "harbor"
            # existingSecret must live in the `harbor` namespace with key "password"
            # (chart requirement) — sourced from Vault platform/db/cnpg/harbor via a
            # namespace-local ExternalSecret (platform-services/harbor/
            # externalsecret-database.yaml), NOT the db-tier ExternalSecret directly
            # (Secret refs don't cross namespaces).
            existingSecret: "harbor-database-credentials"
            # CNPG issues in-cluster server TLS certs by default; "require" gets
            # encryption-in-transit without needing to distribute/trust a CA bundle
            # (verify-ca/verify-full would need that). No prior in-cluster CNPG
            # consumer to match a convention against (harbor is the first cutover).
            sslmode: "require"

        redis:
          internal:
            resources:
              requests: { cpu: 20m, memory: 64Mi }
              limits: { cpu: 100m, memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false      # harbor ns ships as its own object (platform-services/harbor)
      # ROOT CAUSE of the platform-harbor OutOfSync stall: the goharbor chart renders the
      # registry + jobservice (RWO ceph-block PVC) Deployments with
      #   strategy: { type: Recreate, rollingUpdate: null }
      # — the Helm "delete this key" idiom. ArgoCD STRIPS null-valued fields before it
      # applies, so under ServerSideApply it sent only `strategy.type: Recreate`, while the
      # stale `strategy.rollingUpdate` block (API-server-defaulted back when these
      # Deployments were RollingUpdate, and OWNED BY kube-controller-manager) stayed put.
      # SSA cannot drop a field it does not own → the merged object is invalid
      # ("spec.strategy.rollingUpdate: Forbidden when type is 'Recreate'") and every sync
      # was rejected (verified via managedFields: argocd-controller owned only f:strategy.f:type).
      # FIX: Replace=true uses `kubectl replace` (full overwrite, not a field-merge), so the
      # rendered spec — Recreate with NO rollingUpdate — lands verbatim and is valid.
      # ApplyOutOfSyncOnly scopes replace to DRIFTED resources only, so the in-sync
      # StatefulSets (database/redis/trivy) and ClusterIP Services are never replaced
      # (their volumeClaimTemplates / clusterIP are immutable and would reject a replace).
      # (goharbor ships no CRDs/large objects, so the former ServerSideApply=true was inert here.)
      - Replace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
