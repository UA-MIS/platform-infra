# Backstage "The Process" Application (P5, §1.6) — the platform's developer portal: the
# software catalog + Scaffolder golden-path templates + TechDocs, with human SSO via
# the SAME shared Dex broker as ArgoCD/Harbor. DEPLOY METHOD = (A) Helm-source
# Application (the Harbor/ARC/Rook/metrics-server precedent, D-022/D-028): the chart
# is pinned + its OCI repo allowlisted in the `platform` AppProject sourceRepos
# (bootstrap/platform-appproject.yaml — INSTALL-OWNED, re-apply after merge).
#
# Root-app recurses applicationsets/, so this Application is registered. The namespace
# + SealedSecret PREREQS ship separately via the platform-services-appset
# (platform-services/backstage/), which must sync FIRST — same split as Harbor.
#
# ⚠ AHEAD-OF-NEED PREP — DO NOT DEPLOY YET. The Process goes live AFTER (1) the cluster
#   heals (Cilium swap), (2) the Phase-3 domain cutover, and (3) the one-time custom
#   Backstage image is built + pushed to Harbor. See platform-services/backstage/README.md
#   "To go live" checklist. Until then this renders + reviews but is intentionally not synced.
#
# ── THE CUSTOM IMAGE (the load-bearing prereq) ─────────────────────────────────
# Backstage is NOT a configure-and-run server: you scaffold YOUR OWN app with
# `npx @backstage/create-app`, wire plugins (OIDC auth provider, the Scaffolder
# actions, the catalog), `yarn build-image`, and push to Harbor. The chart's default
# image `ghcr.io/backstage/backstage:latest` is a DEMO and has neither our Dex auth
# provider nor The Process templates — so `image.repository` below points at the Harbor
# image we will build. Until that image exists the tag is a PLACEHOLDER (`v0.1.0`).
#
# Chart: backstage 2.8.2 (OCI: ghcr.io/backstage/charts), pinned. Bundles the Bitnami
# postgresql subchart (postgresql.enabled=true) on ceph-block.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-backstage-process
  namespace: argocd
  labels:
    platform.capstone/component: platform
  annotations:
    # GO-LIVE (M1): deploy-status flipped to live, auto-sync enabled below, image.tag
    # set to the first CI-built SHA, and the platform-services/backstage appset-exclude
    # removed (so the ns + REAL sealed secrets sync as prereqs — same split as Harbor).
    platform.capstone/deploy-status: "live"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: ghcr.io/backstage/charts # PINNED OCI chart repo (sourceRepos allowlist)
    chart: backstage
    targetRevision: 2.8.2 # pinned chart version (no ^/~/latest)
    helm:
      releaseName: backstage
      # STRUCTURED Helm values (ArgoCD `valuesObject`), NOT an inline `values: |`
      # string block. This is deliberate: the Backstage image tag below
      # (path .spec.source.helm.valuesObject.backstage.image.tag) is now a real,
      # yq-addressable YAML node, so CI's `bump-portal` job in
      # .github/workflows/backstage-process-build-push.yaml can rewrite it in place
      # after each main build — no more hand-typed 12-char sha at go-live. ArgoCD
      # renders `valuesObject` identically to the previous inline `values` string,
      # so the produced manifests are unchanged.
      valuesObject:
        # ── The portal pod ────────────────────────────────────────────────────
        backstage:
          replicas: 1 # single replica for the 3-box cluster
          # Recreate so plugin DB migrations never run concurrently (chart guidance:
          # a single Backstage pod at a time when migrations run on startup).
          strategy:
            type: Recreate
          image:
            # THE CUSTOM IMAGE built from the in-repo Backstage app (platform-services/
            # backstage/app) by ARC-CI (Kaniko) + pushed to Harbor (see README "To go
            # live"). Lives in the DEDICATED `backstage` Harbor project (ADR-029 / D-046,
            # its own CI push robot) — NOT the shared `library` project. PLACEHOLDER tag
            # until the first build lands; the CI build tags by commit SHA.
            registry: harbor.capstone.uamishub.com
            repository: backstage/backstage-process
            tag: a57f92c25162 # Hardened+themed image: hardened backend Dockerfile (#300, toolchain removed), UA-MIS theme + golden-path landing page (#282), labmx membership fix (#299), GitHub Component discovery provider (#301). Built from main commit f353012 via backstage-process-build-push; digest sha256:95f1cd6fc9360ec017834cfa04c0cbad812fad0e386e699e96026162e6288b44. MANUAL bump (not the usual CI `bump-portal` auto-bump): the gate's `/additions/vulnerabilities` call 403s on a separate CI-robot permission bug (fix in a parallel PR); this ships the already-verified image in the meantime, next build after the robot fix auto-bumps normally. Supply-chain-gate clean: admin-verified Trivy scan's only Criticals are the 2 documented-accepted, unfixable base-image CVEs (CVE-2026-42496, CVE-2026-8376 — perl-base, Essential Debian pkg, no upstream fix), both on accepted-cves.txt (#306). FULL 12-char short-sha (CI tags with `git rev-parse | cut -c1-12`). prev: 3b39d66f39c1 (P5 Secrets-UX on ESO+Vault, #106/#108); 251ce97987db (#98 scaffolder route); ca6ce4e9784d (M3+M4 PR #94).
            pullPolicy: IfNotPresent
            # Pull from the private Harbor `backstage` project via a robot
            # imagePullSecret (`harbor-pull`, minted at go-live by `make harbor-robot
            # NAME=backstage ENV=...` — same robot pattern as team workloads, see README).
            pullSecrets:
              - harbor-pull
          # Resource-reclaim (VPA-driven, task follow-up): live VPA target is cpu
          # 49m / mem ~488Mi (+15% headroom below) — memory was UNDER-provisioned
          # (actual usage `kubectl top` ~333Mi, already 30% over the old 256Mi
          # request). cpu comes down (real signal, actual usage ~23m). Limit
          # unchanged — still comfortable headroom above the new request.
          resources:
            requests:
              cpu: 64m
              memory: 576Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # OIDC client secret + backend signing key are env-injected from the
          # SealedSecret (platform-services/backstage/sealedsecret-oidc.yaml). That
          # Secret also still carries a legacy POSTGRES_PASSWORD key from the bundled-
          # Postgres era — left in place (not resealed) so `git revert` of the CNPG
          # cutover restores the old path with zero SealedSecret changes. The REAL DB
          # password now comes from backstage-cnpg-db-credentials (ExternalSecret,
          # platform-services/backstage/externalsecret-cnpg-db.yaml, Vault path
          # platform/db/cnpg/backstage) — listed SECOND so its POSTGRES_PASSWORD wins
          # the envFrom key collision (Kubernetes: last envFrom source wins on
          # duplicate keys).
          # ── OpenTelemetry TRACES → the platform otel-collector (OBSERVABILITY, ADR-032) ──
          # The Backstage image bakes `--require /app/instrumentation.js` into NODE_OPTIONS
          # (packages/backend/Dockerfile); that MINIMAL bootstrap (http + express only, NOT the
          # auto-instrumentations-node meta-package) reads its endpoint + service name + sampler
          # from these OTEL_* env vars, so they are tunable here with NO image rebuild. Backstage
          # is "The Process" — the FIRST span producer wired to the otherwise-idle collector
          # (Tempo had zero producers). Metrics/logs are NOT wired in the bootstrap at all
          # (Prometheus is near-OOM; logs already flow via the Alloy DaemonSet → Loki), so no
          # metrics/logs env is needed here.
          #
          #   endpoint : the ONE canonical collector OTLP receiver. HTTP/4318 (not gRPC/4317);
          #              the exporter-trace-otlp-http exporter POSTs to <endpoint>/v1/traces.
          #              The collector re-exports to tempo:4317 and applies its OWN 15%
          #              probabilistic_sampler on top.
          #   sampler  : parentbased_traceidratio @ 0.5 — a SANE default, NOT always-on 100%
          #              (trace volume kept modest). Effective retention ≈ this × the collector's
          #              15% ≈ 7.5%; enough to populate Grafana → Drilldown → Traces on a low-
          #              traffic internal portal. Bump OTEL_TRACES_SAMPLER_ARG here (no rebuild)
          #              for a denser demo. Tenant apps should default LOWER (≈0.1) via the
          #              scaffolder template (follow-up).
          extraEnvVars:
            - name: OTEL_SERVICE_NAME
              value: backstage-process
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4318
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.5"
          # OIDC client secret + backend signing key are env-injected from the
          # SealedSecret (platform-services/backstage/sealedsecret-oidc.yaml). That
          # Secret also still carries a legacy POSTGRES_PASSWORD key from the bundled-
          # Postgres era — left in place (not resealed) so `git revert` of the CNPG
          # cutover restores the old path with zero SealedSecret changes. The REAL DB
          # password now comes from backstage-cnpg-db-credentials (ExternalSecret,
          # platform-services/backstage/externalsecret-cnpg-db.yaml, Vault path
          # platform/db/cnpg/backstage) — listed SECOND so its POSTGRES_PASSWORD wins
          # the envFrom key collision (Kubernetes: last envFrom source wins on
          # duplicate keys).
          extraEnvVarsSecrets:
            - backstage-process-secrets
            - backstage-cnpg-db-credentials
          # ── Vault WRITE path for the secrets-UX (#108, ADR-030 B1) ──────────────
          # The backend writes tenant secret VALUES to Vault over KV-v2 (role
          # `backstage-writer`, see external-secrets/vault-policies/backstage-role.sh).
          # Two mounts the client needs (paths match app-config.production.yaml's
          # capstone.secrets.vault saTokenPath/caPath):
          #   1. a PROJECTED SA token with audience=vault — the DEFAULT SA token's
          #      audience is the apiserver, which the Vault role REJECTS; this projected
          #      token carries audience=vault so the k8s-auth login succeeds.
          #   2. the Vault server CA (vault-server-tls ca.crt) so the client trusts the
          #      in-cluster TLS listener (same cert ESO trusts).
          extraVolumes:
            - name: vault-token
              projected:
                sources:
                  - serviceAccountToken:
                      path: vault-token
                      audience: vault
                      expirationSeconds: 3600
            - name: vault-ca
              # In-NAMESPACE ConfigMap (a pod can only mount volumes from its OWN ns;
              # vault-server-tls lives in ns `vault`, unreachable from here). The human
              # materializes `vault-ca` (key ca.crt = the public Vault CA PEM) in the
              # backstage ns at go-live — same pattern as the per-tenant vault-ca drop:
              #   kubectl -n vault get secret vault-server-tls -o jsonpath='{.data.ca\.crt}' \
              #     | base64 -d | kubectl -n backstage create configmap vault-ca --from-file=ca.crt=/dev/stdin
              configMap:
                name: vault-ca
                items:
                  - key: ca.crt
                    path: ca.crt
          extraVolumeMounts:
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
            - name: vault-ca
              mountPath: /etc/backstage/vault-ca
              readOnly: true
          # app-config.production.yaml baked into the custom image is the SOURCE OF TRUTH
          # for auth + integrations; this block is MERGED on top (chart -> ConfigMap ->
          # $APP_CONFIG_*). Kept to the host/deploy seams only (app/backend/catalog) — the
          # auth + github subtrees are DELIBERATELY OMITTED here so the baked config's
          # custom OIDC code resolver stays authoritative (see notes below). No secret
          # lands in git; secrets arrive via extraEnvVarsSecrets above.
          appConfig:
            app:
              title: "The Process — UA-MIS Capstone Developer Portal"
              baseUrl: https://process.capstone.uamishub.com
              # ── New-frontend-system extension overrides (MUST live HERE) ─────────────
              # CRITICAL: the chart launches the backend with ONLY
              # `--config /app/app-config-from-configmap.yaml` (this overlay) — it does NOT
              # load the image's baked app-config.yaml. `app.extensions` is frontend config
              # served to the browser AT RUNTIME from whatever the backend loaded, so an
              # extension override that lives ONLY in the baked app-config.yaml never reaches
              # the running app. That is exactly why `https://process.capstone.uamishub.com/`
              # 404'd "someone dropped the mic": the home landing page
              # (packages/app/src/modules/home, extension id `page:home`) was registered in
              # App.tsx and defaults to its param path `/home`, but the baked
              # `page:home -> path: /` override that moves it to the app root was dropped at
              # runtime → `/` matched no route → NotFoundErrorPage. Mirror the baked
              # app-config.yaml `app.extensions` block EXACTLY (same rule as auth/catalog/
              # permission below). Takes effect on ArgoCD appConfig sync — NO image rebuild.
              #   - page:home {path: /}  : mount the landing page at the root instead of /home.
              #   - theme:app/{light,dark}: false : disable the stock Backstage themes so the
              #     custom UA-MIS crimson/charcoal theme (themeModule) is the only one on offer.
              extensions:
                - page:home:
                    config:
                      path: /
                - theme:app/light: false
                - theme:app/dark: false
            organization:
              name: "UA-MIS"
            backend:
              baseUrl: https://process.capstone.uamishub.com
              listen:
                port: 7007
              # HTTP server keep-alive tuning (defense-in-depth for the sign-in "Premature
              # close"). The in-process catalog-client (node-fetch) reuses pooled keep-alive
              # sockets to localhost:7007; if the server closes an idle socket before the
              # client's next request, the reuse resets mid-response → "Premature close" →
              # the OIDC resolver's catalog lookup throws → sign-in loop. The PRIMARY cure is
              # pinning Node 24.16 (the Node 24.17 CVE-2026-48931 keep-alive change is the
              # root, Backstage #34651 — see the Dockerfile). These timeouts are a belt: keep
              # server sockets alive longer than the client reuse window, and headersTimeout >
              # keepAliveTimeout (Node requirement). app-config-settable since backend-defaults
              # 0.13.0 / Backstage 1.44; takes effect on appConfig sync (no rebuild for THIS).
              server:
                keepAliveTimeout: {seconds: 60}
                headersTimeout: {seconds: 65}
              cors:
                origin: https://process.capstone.uamishub.com
                methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
                credentials: true
              # Backend auth signing key from the SealedSecret (BACKEND_SECRET).
              auth:
                keys:
                  - secret: ${BACKEND_SECRET}
              database:
                client: pg
                # PLUGIN-DB MODE: `schema` (not the Backstage default `database`) —
                # deliberate, matches the CNPG role: `backstage` (platform-services/
                # cnpg/cluster/roles.yaml) is NOT granted CREATEDB (unlike the
                # crossplane_provisioner role, which explicitly IS — least-privilege
                # by design). In `database` mode Backstage CREATEs a database per
                # plugin at startup (backstage_plugin_catalog, _auth, _scaffolder, ...
                # — 13 on the old bundled instance) and would fail closed against a
                # role without CREATEDB. `schema` mode gives each plugin its own
                # SCHEMA inside the single `backstage` database instead — no CREATEDB
                # needed, since the `backstage` role already OWNS that database
                # (databases.yaml) and schema creation is an owner privilege. This is
                # also the Backstage-docs-recommended mode for a single managed DB
                # instance. No data migration: the catalog re-ingests from GitHub on
                # first boot, so a fresh `backstage` database is sufficient (the old
                # bundled-Postgres data is left untouched for rollback).
                pluginDivisionMode: schema
                connection:
                  host: capstone-pg-rw.db-tier.svc.cluster.local # CNPG capstone-pg RW service (db-tier)
                  port: 5432
                  user: backstage # CNPG DatabaseRole (roles.yaml), owns db `backstage` (databases.yaml)
                  password: ${POSTGRES_PASSWORD} # from backstage-cnpg-db-credentials (see extraEnvVarsSecrets above)
            # ── SSO via the shared Dex broker ──────────────────────────────────────
            # The auth block MUST live HERE in the Helm appConfig: the chart launches the
            # backend with ONLY `--config /app/app-config-from-configmap.yaml` (this
            # overlay) — it does NOT load the image's baked app-config.production.yaml.
            # So an earlier "defer auth to the baked config" trim left NO oidc provider
            # registered → Sign In 404'd `No auth provider registered for 'oidc'` (+ the
            # default env=development). Mirror the baked block exactly. Reads the injected
            # ${AUTH_OIDC_CLIENT_ID}/${AUTH_OIDC_CLIENT_SECRET}/${BACKEND_SECRET} from
            # backstage-process-secrets; the `process` Dex staticClient is the IdP.
            # NO `signIn.resolvers` key — config resolvers take PRIORITY over the custom
            # code resolver in packages/backend, so omitting it keeps the code module
            # (Dex preferred_username -> User, catalog fallback) authoritative.
            # Org/identity gating is enforced UPSTREAM at Dex (UA-MIS org-only, SEC-007).
            auth:
              environment: production
              session:
                secret: ${BACKEND_SECRET}
              providers:
                oidc:
                  production:
                    metadataUrl: https://id.capstone.uamishub.com/.well-known/openid-configuration
                    clientId: ${AUTH_OIDC_CLIENT_ID}
                    clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
                    prompt: auto
                    # LOGIN-LOOP FIX: request offline_access so Dex returns a refresh_token.
                    # The OAuth backend reads this per-provider `additionalScopes` from config
                    # (CookieScopeManager) and UNIONS it into the Dex authorize request
                    # SERVER-SIDE — so no frontend change and no image rebuild are needed; the
                    # currently-deployed image (same Backstage 1.52) honors it on appConfig
                    # sync. Without it Dex returns no refresh_token -> the OAuth frame handler
                    # never sets the refresh cookie -> /api/auth/oidc/refresh 401 "Missing
                    # session cookie" -> the sign-in popup loops (handler/frame 200, no throw).
                    # The SPA refresh cookie needs ONLY this token; it does NOT require
                    # auth.experimentalRefreshToken.enabled (that flag gates the separate
                    # DB-backed offline-token service for OIDC/MCP clients, not this path).
                    additionalScopes: [offline_access]
            # ── Catalog: The Process golden-path templates + seed + GitHub-org ingest ──
            # CRITICAL (PR #71): the chart launches the backend with ONLY this overlay
            # ConfigMap — it does NOT load the image's baked app-config.production.yaml. So
            # every M2 runtime config (githubOrg provider, permission.enabled, the github
            # integration) MUST live HERE, not only in the baked file. Mirror the baked
            # blocks exactly.
            catalog:
              # MIRROR of app-config.production.yaml's catalog.orphanStrategy (the pod loads
              # ONLY this Helm appConfig overlay). Auto-prune ORPHANED entities — a
              # Component/Location whose emitting provider stopped yielding it. Second half of
              # the teardown "ghost tenant" fix: teardown strips the `capstone-tenant` topic so
              # the github.tenants provider drops the repo (and archived repos are already
              # excluded), orphaning the tenant's Component; default `keep` would leave it in the
              # catalog forever (why torn-down tenants lingered). `delete` prunes it next cycle.
              orphanStrategy: delete
              rules:
                - allow: [Component, System, API, Resource, Location, Template, Group, User]
              locations:
                # The Scaffolder golden-path template(s), baked into the image OR
                # served from platform-infra. Pointed at the in-repo catalog dir so
                # the template shows up without rebuilding the image for content edits.
                # Still needed in M2: it seeds the `platform` Group that owns the template.
                - type: url
                  target: https://github.com/UA-MIS/platform-infra/blob/main/platform-services/backstage/catalog/all.yaml
                  rules:
                    - allow: [Template, Location, Group, System]
              # M2: GitHub-org ingestion (one Group per GitHub team, slug = <team>; one User
              # per member with spec.memberOf). This populates the ownership data the
              # sign-in resolver + permission policy depend on. Auth = the GitHub App below.
              providers:
                githubOrg:
                  id: production
                  githubUrl: https://github.com
                  orgs: ['UA-MIS']
                  schedule:
                    initialDelay: {seconds: 30}
                    frequency: {hours: 1}
                    timeout: {minutes: 10}
                # Tenant Component discovery — MIRROR of app-config.production.yaml's
                # catalog.providers.github block (same "chart loads ONLY this overlay" seam
                # as auth/catalog/integrations above; MUST match that file's filters exactly).
                # Scans UA-MIS repos for a root catalog-info.yaml and registers/refreshes it
                # as a Component Location on a schedule — this is what (re)populates the
                # Secrets page (/my-projects), which lists Components the signed-in user owns
                # and is EMPTY without it. Self-heals: unlike the scaffolder's one-off
                # catalog:register step, a catalog-DB rebuild (e.g. the CNPG migration) can't
                # silently drop these again. Auth = the SAME GitHub App as githubOrg below.
                #
                # SEC: org-wide with NO further filter would ingest a root catalog-info.yaml
                # from ANY of the org's 363 members' repos (this org carries ~100+ old,
                # unrelated student-capstone repos, none topic-tagged) — catalog clutter AND
                # an entity-spoofing vector (any member could commit a catalog-info.yaml
                # claiming spec.owner: group:default/<someone-else>). Two scoped provider
                # entries instead of one org-wide one — see app-config.production.yaml's copy
                # of this block for the full rationale:
                #   - `tenants`: only repos carrying the `capstone-tenant` GitHub topic (all
                #     8 scaffolder templates now self-tag new tenant repos with it; the 2
                #     existing live tenants were backfilled directly via the GitHub API).
                #   - `platformInfra`: this repo specifically, matched by exact name (not a
                #     tenant, doesn't self-tag).
                # TIMEOUT: UA-MIS is a ~5,520-repo org. GithubEntityProvider enumerates the
                # ENTIRE org before applying filters.topic/filters.repository client-side
                # (no server-side scoping for these filter types), so a full run reads all
                # ~5,520 repos even though `tenants` matches only a handful and
                # `platformInfra` matches exactly one. That enumeration alone exceeded the
                # old 10m timeout ("Read 5520 GitHub repositories (1 matching the pattern)"
                # followed by "Task timed out and was lost" in the backend log), killing the
                # task before it could commit — tenant Components never landed and
                # /my-projects stayed empty. 30m is comfortably under the 1h frequency (no
                # run overlap) and covers the observed enumeration time with headroom.
                # MIRROR of app-config.production.yaml's copy of this block.
                github:
                  tenants:
                    organization: 'UA-MIS'
                    catalogPath: '/catalog-info.yaml'
                    filters:
                      branch: 'main'
                      topic:
                        include: ['capstone-tenant']
                    schedule:
                      initialDelay: {minutes: 2}
                      frequency: {hours: 1}
                      timeout: {minutes: 30}
                  platformInfra:
                    organization: 'UA-MIS'
                    catalogPath: '/catalog-info.yaml'
                    filters:
                      branch: 'main'
                      repository: '^platform-infra$'
                    schedule:
                      initialDelay: {minutes: 2, seconds: 5}
                      frequency: {hours: 1}
                      timeout: {minutes: 30}
            # ── Permission framework (M2: THE SPINE) ─────────────────────────────────
            # Turn enforcement ON so the custom CapstoneTeamPermissionPolicy filters the
            # catalog per-team. WITHOUT this the framework no-ops and serves everything
            # regardless of policy (plan R6, the §5 backend-API acceptance test catches it).
            permission:
              enabled: true
            # ── Integrations: GitHub App (M2) ────────────────────────────────────────
            # Authenticate as the UA-MIS GitHub App (ua-mis-backstage) for org ingestion
            # (and M4 Scaffolder repo create). M1 left this absent-tolerant; M2 makes it
            # load-bearing. Non-secret IDs inlined; the two SECRET values arrive as env
            # vars from backstage-process-secrets (devops seals — see README/PR handoff):
            #   GITHUB_APP_PRIVATE_KEY    — the .pem contents (multi-line)
            #   GITHUB_APP_CLIENT_SECRET  — the App client secret
            # These MUST be sealed into backstage-process-secrets BEFORE this image deploys,
            # else ingestion fails on first run and (with the M2 resolver tightening) nobody
            # can sign in (plan R1 — break-glass: roll image.tag back to the M1 SHA).
            integrations:
              github:
                - host: github.com
                  apps:
                    - appId: 4097147
                      clientId: Iv23liRQ6d2I2mibDMbY
                      clientSecret: ${GITHUB_APP_CLIENT_SECRET}
                      privateKey: ${GITHUB_APP_PRIVATE_KEY}
                      allowedInstallationOwners: ['UA-MIS']
            # ── Harbor provisioning (capstone:harbor-onboard, #114) ────────────────
            # MIRROR of app-config.production.yaml's capstone.harbor block (same
            # "chart loads ONLY this overlay" seam as auth/catalog/integrations above —
            # PR #114 added this to the baked image config but missed this overlay, so
            # the scaffolder step failed closed: "missing config section `capstone.harbor`
            # (need baseUrl + provisioner username/secret)"). Authenticates with a
            # DEDICATED LEAST-PRIVILEGE PROVISIONER ROBOT (project-create + member-add
            # only — NOT harbor-admin). DEPLOY DEPENDENCY (devops): seal
            # HARBOR_PROVISIONER_USERNAME / HARBOR_PROVISIONER_SECRET into
            # backstage-process-secrets (see platform-services/backstage/README.md) —
            # the action refuses to call Harbor unauthenticated until both are set.
            capstone:
              harbor:
                baseUrl: http://harbor-core.harbor.svc:80
                username: ${HARBOR_PROVISIONER_USERNAME}
                secret: ${HARBOR_PROVISIONER_SECRET}
                oidcGroupPrefix: UA-MIS
        # ── ServiceAccount for the Vault WRITE path (#108) ───────────────────────
        # Dedicated SA the secrets-UX backend authenticates to Vault as (k8s-auth role
        # `backstage-writer` binds THIS SA — NOT `default`, which would grant write-any-
        # tenant to every pod in the ns). The chart sets the Deployment's
        # serviceAccountName to this. The projected vault-token volume above mints an
        # audience=vault token for this SA via TokenRequest.
        serviceAccount:
          create: true
          name: backstage-vault-writer
          automountServiceAccountToken: true
        # ── Ingress: process.<domain> via Traefik (matches every other service) ──
        # Plain Ingress, TLS host listed but NO secretName — Traefik's default TLSStore
        # serves the cert-manager wildcard cert for *.capstone.uamishub.com (§5.1/§5.2),
        # exactly like dex/harbor/argocd. className: traefik.
        ingress:
          enabled: true
          className: traefik
          host: process.capstone.uamishub.com
          tls:
            enabled: true
            # No secretName: the wildcard cert is served via the default TLSStore.
        service:
          type: ClusterIP
          ports:
            backend: 7007
        # ── Bundled Postgres — DISABLED, cut over to CNPG (docs/operator/
        # in-cluster-db-tier-runbook.md §4a; backend.database.connection above now
        # points at capstone-pg-rw.db-tier.svc.cluster.local). `enabled: false` stops
        # ArgoCD from rendering/reconciling the subchart's StatefulSet+Service (they
        # get pruned by the automated syncPolicy below), but the StatefulSet's
        # volumeClaimTemplate-backed PVC is NOT owned by those manifests, so the old
        # data is NOT deleted — it survives untouched for rollback. The rest of this
        # block is INTENTIONALLY left in place (not deleted) so reverting this PR
        # (`enabled: true`) instantly restores the exact prior bundled-Postgres config
        # with no reconstruction needed.
        postgresql:
          enabled: false
          auth:
            username: bn_backstage
            database: backstage
            existingSecret: backstage-postgresql # our sealed keys: postgres-password, password
            # The bundled Bitnami postgresql subchart defaults its existingSecret keys
            # to `user-password`/`admin-password`, but our sealed `backstage-postgresql`
            # uses the classic `password`/`postgres-password` names (what the sealed file
            # + the live-ops batch produced). Remap so the chart reads OUR keys — this
            # fixes BOTH the postgres pod AND the Backstage container's POSTGRES_PASSWORD
            # env (the chart wires both from userPasswordKey), avoiding a reseal. Without
            # it: CreateContainerConfigError "couldn't find key user-password in Secret
            # backstage/backstage-postgresql".
            secretKeys:
              userPasswordKey: password # app user (bn_backstage) — Backstage connects with this
              adminPasswordKey: postgres-password # postgres superuser
          primary:
            persistence:
              enabled: true
              storageClass: ceph-block
              size: 8Gi
            # Resource-reclaim (VPA-driven, task follow-up): live VPA target for
            # backstage-postgresql is cpu 35m / mem ~194Mi (+15% headroom below) —
            # actual usage (`kubectl top`) ~156Mi, comfortably inside the new
            # request. cpu + limits come down (real signal; actual usage ~23m).
            resources:
              requests:
                cpu: 48m
                memory: 224Mi
              limits:
                cpu: 500m
                memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    # GO-LIVE: auto-sync enabled (matches Harbor). prune+selfHeal keep the portal
    # reconciled to git.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false # backstage ns ships via platform-services/backstage
      - ServerSideApply=true # large chart objects
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 5m}
