# ida-llm PREVIEW GUARDRAILS ApplicationSet — the platform half of per-PR previews.
#
# Pairs with the TENANT-half preview ApplicationSet that the CapstoneTenant
# Composition renders (`ida-llm-preview`). Both use the SAME pullRequest generator
# and the SAME `preview` label gate, so they create and tear down together:
#
#   this one          project: platform  -> the fence + the platform-owned secrets
#                                           + a throwaway Postgres
#   ida-llm-preview   project: ida-llm   -> the application itself
#
# ── WHY TWO APPLICATIONS AND NOT ONE ────────────────────────────────────────
# This is blocker B1 from tenants/_template/applicationset-preview.yaml, whose
# header read: "the fence is NOT in this App. A team-project App CANNOT create
# them anyway — the team AppProject's namespaceResourceWhitelist excludes
# Quota/LimitRange/NetworkPolicy/RBAC and clusterResourceWhitelist is empty. So
# the guardrails MUST be applied by a PLATFORM-project App. Proposed: a sibling
# applicationset-preview-guardrails.yaml (project: platform) using the SAME
# pullRequest generator... UNTIL B1 LANDS, PREVIEWS ARE UNFENCED — do not enable."
# This is that sibling.
#
# The split is the security property, not an implementation detail: a tenant that
# could write its own ResourceQuota and NetworkPolicy would have no fence at all.
#
# ── SCOPED TO ONE TENANT, ON PURPOSE ────────────────────────────────────────
# Deliberately NOT generalised across all tenants yet. Previews run untrusted
# pull-request code; proving the fence on the tenant that asked for it is a
# smaller, reviewable step than turning previews on cluster-wide. Generalising
# this (a per-tenant generator driven off the claims) is a clean follow-up once
# it has run for a while — the same staging the scoped egress policies took.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ida-llm-preview-guardrails
  namespace: argocd
  labels:
    platform.capstone/component: platform
    platform.capstone/team: ida-llm
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - pullRequest:
        github:
          owner: UA-MIS
          repo: ida-llm
          appSecretName: argocd-repo-creds-uamis
          # ⚠ THE LABEL GATE — KEEP IN LOCKSTEP WITH THE TENANT-HALF GENERATOR.
          # A preview exists IFF the PR carries the `preview` label. CI re-adds it
          # on every PR build; the cohort-gc preview-ttl CronJob REMOVES it once a
          # preview is older than 12h, which drops the element from BOTH
          # generators so the app AND its fence are pruned together.
          #
          # If these two generators ever disagree about the gate, the failure is
          # silent and bad in one direction: an app with no fence. They must
          # match.
          labels:
            - preview
        requeueAfterSeconds: 120
  template:
    metadata:
      name: 'ida-llm-pr-{{ .number }}-guardrails'
      labels:
        platform.capstone/team: ida-llm
        platform.capstone/env: preview
        platform.capstone/component: platform
    spec:
      project: platform
      source:
        repoURL: https://github.com/UA-MIS/platform-infra
        # HEAD, not the PR's head_sha: the FENCE must come from reviewed
        # platform-infra main, never from the pull request it is fencing.
        # (The tenant-half App does track the PR's head_sha — that is the point
        # of a preview — which is precisely why the fence must not.)
        targetRevision: HEAD
        path: platform-services/ida-llm-preview-guardrails
        kustomize:
          namespace: 'ida-llm-pr-{{ .number }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'ida-llm-pr-{{ .number }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # Either half may win the race to create the namespace; both must be
          # able to.
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff: { duration: 10s, factor: 2, maxDuration: 3m }
