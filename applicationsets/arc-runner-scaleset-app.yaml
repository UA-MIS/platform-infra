# ARC runner scale set Application (P2.3, §1.3, D-032) — the org-scoped, ephemeral,
# scale-FROM-ZERO self-hosted runner set, the UNTRUSTED-CODE surface. Helm-source
# Application (method A, gha-runner-scale-set chart, same OCI registry + version as
# the controller). Sync-wave 1 so the controller CRDs (wave 0) exist first.
#
# ⚠ runs-on CONTRACT: in the scale-set model the workflow `runs-on:` value IS the
# SCALE SET NAME (helm.releaseName / AutoscalingRunnerSet metadata.name). This is
# set to `ua-mis-kaniko` — DEVELOPER must use `runs-on: ua-mis-kaniko` in the
# .devops workflow (confirming the exact string with them; change both sides
# together if they prefer another token).
#
# ⚠ GitHub App credential: githubConfigSecret references the SealedSecret
# `arc-github-app` (keys github_app_id / github_app_installation_id /
# github_app_private_key) the human seals into arc-runners — see
# platform-services/arc/README.md. Until that exists the listener can't auth (the
# app will be Progressing); that's expected pre-credential.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-arc-runner-scaleset
  namespace: argocd
  labels:
    platform.capstone/component: platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # after the controller CRDs (wave 0)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.2               # pinned (match the controller chart)
    helm:
      # releaseName == the runs-on label the workflow selects (see header).
      releaseName: ua-mis-kaniko
      values: |
        # --- org-scoped runners (UA-MIS), authed by the GitHub App SealedSecret ---
        githubConfigUrl: "https://github.com/UA-MIS"
        githubConfigSecret: arc-github-app   # SealedSecret in arc-runners (README)

        # Be EXPLICIT about the controller SA + namespace instead of relying on the
        # chart's cross-namespace label discovery (which fails when the controller
        # isn't found — e.g. at standalone `helm template` time, or if discovery
        # mislabels). The controller (arc-controller-app, release `arc`, ns
        # arc-system) creates SA `arc-gha-rs-controller`. Keep in sync if either
        # the controller releaseName or namespace changes.
        controllerServiceAccount:
          name: arc-gha-rs-controller
          namespace: arc-system

        # --- SCALE FROM ZERO: no idle runners burning the box; cap the burst.
        #     maxRunners is the RESOURCE KNOB — 3 on the local k3d laptop; raise on
        #     real hardware (Phase-4). minRunners 0 = pods only exist during a job. ---
        minRunners: 0
        maxRunners: 3

        # --- containerMode KUBERNETES: workflow job steps run as separate K8s PODS,
        #     NO dind, NO docker socket, NOT privileged — the rootless model Kaniko
        #     needs + the isolation foundation. Job pods get an ephemeral work PVC
        #     (ceph-block = the cluster default RBD SC; was local-path/k3d which is
        #     absent on Talos -> the PVC would hang Pending and no runner could start;
        #     RWO, cleared per job). ---
        containerMode:
          type: "kubernetes"
          kubernetesModeWorkVolumeClaim:
            accessModes: ["ReadWriteOnce"]
            storageClassName: "ceph-block"
            resources:
              requests:
                storage: "5Gi"

        # --- Runner POD hardening (the security gate; security reviews this).
        #     non-root, no privilege-escalation, drop ALL caps, seccomp
        #     RuntimeDefault. (read-only root FS is NOT set on the runner container:
        #     the actions runner writes its _work/_diag dirs; the ephemeral work PVC
        #     + per-job pod recycle bound that. Job-step pods inherit the same
        #     restricted posture via the controller.) ---
        template:
          spec:
            # --- Node placement for the RUNNER pod (CI-fast, #237/#297; BUILD POOL) ---
            # Was pinned to the single node `ua-mis-db-1` via `capstone.io/ci-build=true`
            # (#297) — a hard bottleneck: every CI job serialized onto one box. Switched
            # to the POOL label `capstone.io/pool=build` (same convention as the Mac
            # fleet's `capstone.io/pool=mac-debian`, see ansible/inventory/group_vars/
            # mac_workers.yml) so ANY node carrying the label is a candidate — currently
            # `ua-mis-db-1` (~7.5GiB allocatable) + `laptop-01` (Ryzen 7 8C/16T,
            # ~14GiB allocatable), giving the scheduler two boxes to spread builds across
            # instead of queuing on one. nodeSelector stays a HARD (required) constraint
            # — it just now matches a set, not a singleton — so this supersedes the
            # softer control-plane toleration/affinity below (still harmless no-ops:
            # neither pool node carries the control-plane taint/label). laptop-01 is
            # TEMPORARY (retires when a replacement mini PC arrives) — un-labeling it
            # cleanly falls back to db1-only with no manifest change. NOTE: the actual
            # Kaniko BUILD runs in a separate step pod (containerMode:kubernetes) whose
            # placement is set in platform-services/arc/hook-template.yaml — the SAME
            # nodeSelector is mirrored there (that is what makes the memory-hungry build
            # land on a pool node too). Both are needed; this one only moves the
            # lightweight runner pod. Nodes must be labeled live (not git-declared — db1
            # was labeled the same way in #297; there is no Ansible/join automation for
            # either db1 or laptop-01, unlike the Mac fleet):
            #   kubectl label node ua-mis-db-1 capstone.io/pool=build --overwrite
            #   kubectl label node laptop-01    capstone.io/pool=build --overwrite
            nodeSelector:
              capstone.io/pool: "build"
            tolerations:
              - key: capstone.io/control-plane
                operator: Equal
                value: "true"
                effect: PreferNoSchedule
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: Exists
            securityContext:
              runAsNonRoot: true
              runAsUser: 1001
              fsGroup: 1001
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:2.335.1   # pinned runner image (bump: 2.328.0 deprecated by GitHub — couldn't connect to the broker)
                command: ["/home/runner/run.sh"]
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
                # --- Harbor PUSH credential for Kaniko = OPTION C (container-hook).
                #     In containerMode:kubernetes the build runs in its OWN job-step
                #     pod (a `container:` step — ARC requires job containers in k8s
                #     mode), so a secret on the RUNNER pod is invisible to it. The k8s
                #     container hook merges `platform-services/arc/hook-template.yaml`
                #     into every job-step pod, landing `harbor-push` inside the build
                #     container at /kaniko/.docker/config.json (Kaniko's default dir) —
                #     workflow needs ZERO cred steps. ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
                #     points the runner at that template (mounted from the
                #     arc-hook-template ConfigMap below). The push cred NEVER touches
                #     the general runner pod, only the build container (tightest option:
                #     untrusted non-build steps can't read it; + least-priv robot +
                #     ephemeral runner).
                env:
                  - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
                    value: /home/runner/pod-templates/hook-template.yaml
                volumeMounts:
                  - name: hook-template
                    mountPath: /home/runner/pod-templates
                    readOnly: true
                resources:
                  # RESOURCE KNOB — LIMIT raised 2Gi -> 6Gi to match the Kaniko WORKLOAD
                  # step-pod ceiling (platform-services/arc/hook-template.yaml), so
                  # nothing on this scaleset is capped below the ~6Gi a Backstage yarn
                  # build needs. REQUEST deliberately left low (not raised to ~4Gi):
                  # this listener/orchestration pod's real usage is a few hundred Mi, and
                  # nodeSelector now pins EVERY pod this scaleset creates — this runner
                  # pod, the job-container pod (checkout/resolve, containerMode:
                  # kubernetes' `container:` — see workflow), AND the Kaniko step-pod
                  # (hook-template.yaml's "$job" resources apply to BOTH job-container
                  # AND step pods per runner-container-hooks' mergeContainerWithOptions,
                  # confirmed against actions/runner-container-hooks source) — onto a
                  # SINGLE pool node (whichever of db1 ~7.5Gi / laptop-01 ~14Gi
                  # allocatable the scheduler picks for that pod; the pool can now spread
                  # a build's 3 pods across nodes, but nothing GUARANTEES that — treat
                  # worst case as all 3 landing on one node). All 3 can be co-resident
                  # for most of a build. Requesting ~4Gi on each would sum to ~12Gi of
                  # scheduler-admission requests — more than db1's ~7.5Gi allocatable
                  # alone -> the step-pod would Pend forever there (insufficient memory),
                  # defeating the fix (laptop-01's ~14Gi has headroom for that sum, but
                  # requests still must fit the SMALLEST pool member since nodeSelector
                  # doesn't guarantee which node). Keeping requests low + limits high
                  # (burstable) lets the Kaniko step-pod actually USE up to 6Gi at
                  # runtime (fixing the OOM, which was caused by NO limit at all, not by
                  # an under-provisioned request) without over-committing either pool
                  # node's scheduling budget.
                  requests: { cpu: "250m", memory: "512Mi" }
                  limits:   { cpu: "2",    memory: "6Gi" }
            volumes:
              # The hook template (arc-hook-template ConfigMap, key `content`) the
              # runner passes to the k8s container hook for every job-step pod.
              - name: hook-template
                configMap:
                  name: arc-hook-template
                  items:
                    - key: content
                      path: hook-template.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false           # arc-runners ships via platform-services/arc
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
