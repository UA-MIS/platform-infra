# ARC runner scale set Application (P2.3, §1.3, D-032) — the org-scoped, ephemeral,
# scale-FROM-ZERO self-hosted runner set, the UNTRUSTED-CODE surface. Helm-source
# Application (method A, gha-runner-scale-set chart, same OCI registry + version as
# the controller). Sync-wave 1 so the controller CRDs (wave 0) exist first.
#
# ⚠ runs-on CONTRACT: in the scale-set model the workflow `runs-on:` value IS the
# SCALE SET NAME (helm.releaseName / AutoscalingRunnerSet metadata.name). This is
# set to `ua-mis-kaniko` — DEVELOPER must use `runs-on: ua-mis-kaniko` in the
# .devops workflow (confirming the exact string with them; change both sides
# together if they prefer another token).
#
# ⚠ GitHub App credential: githubConfigSecret references the SealedSecret
# `arc-github-app` (keys github_app_id / github_app_installation_id /
# github_app_private_key) the human seals into arc-runners — see
# platform-services/arc/README.md. Until that exists the listener can't auth (the
# app will be Progressing); that's expected pre-credential.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-arc-runner-scaleset
  namespace: argocd
  labels:
    platform.capstone/component: platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # after the controller CRDs (wave 0)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.2               # pinned (match the controller chart)
    helm:
      # releaseName == the runs-on label the workflow selects (see header).
      releaseName: ua-mis-kaniko
      values: |
        # --- org-scoped runners (UA-MIS), authed by the GitHub App SealedSecret ---
        githubConfigUrl: "https://github.com/UA-MIS"
        githubConfigSecret: arc-github-app   # SealedSecret in arc-runners (README)

        # Be EXPLICIT about the controller SA + namespace instead of relying on the
        # chart's cross-namespace label discovery (which fails when the controller
        # isn't found — e.g. at standalone `helm template` time, or if discovery
        # mislabels). The controller (arc-controller-app, release `arc`, ns
        # arc-system) creates SA `arc-gha-rs-controller`. Keep in sync if either
        # the controller releaseName or namespace changes.
        controllerServiceAccount:
          name: arc-gha-rs-controller
          namespace: arc-system

        # --- SCALE FROM ZERO: no idle runners burning the box; cap the burst.
        #     maxRunners is the RESOURCE KNOB — 3 on the local k3d laptop; raise on
        #     real hardware (Phase-4). minRunners 0 = pods only exist during a job. ---
        minRunners: 0
        maxRunners: 3

        # --- containerMode KUBERNETES: workflow job steps run as separate K8s PODS,
        #     NO dind, NO docker socket, NOT privileged — the rootless model Kaniko
        #     needs + the isolation foundation. Job pods get an ephemeral work PVC
        #     (ceph-block = the cluster default RBD SC; was local-path/k3d which is
        #     absent on Talos -> the PVC would hang Pending and no runner could start;
        #     RWO, cleared per job). ---
        containerMode:
          type: "kubernetes"
          kubernetesModeWorkVolumeClaim:
            accessModes: ["ReadWriteOnce"]
            storageClassName: "ceph-block"
            resources:
              requests:
                storage: "5Gi"

        # --- Runner POD hardening (the security gate; security reviews this).
        #     non-root, no privilege-escalation, drop ALL caps, seccomp
        #     RuntimeDefault. (read-only root FS is NOT set on the runner container:
        #     the actions runner writes its _work/_diag dirs; the ephemeral work PVC
        #     + per-job pod recycle bound that. Job-step pods inherit the same
        #     restricted posture via the controller.) ---
        template:
          spec:
            # --- Node placement for the RUNNER pod (CI-fast, #237/#297/#372; SOFT TIER) ---
            # Mirrors the heavy Kaniko step pod's placement (platform-services/arc/
            # hook-template.yaml) so the lightweight listener/runner pod follows the same
            # tiered bias. HISTORY: HARD-pinned to db1 via capstone.io/ci-build (#297),
            # then HARD-pinned to the pool via `nodeSelector: capstone.io/pool=build`.
            # A HARD nodeSelector gives NO fallback when the pool nodes can't admit the
            # request; #372 replaces it with a SOFT, RAM-aware tier bias fenced by a HARD
            # candidate SET that only excludes nodes too small to build on.
            #
            # CANDIDATE SET (required, OR of two terms): capstone.io/pool=build (laptop-01
            # + ua-mis-db-1) OR a control-plane OptiPlex (capstone-n1/2/3). EXCLUDES the
            # 8GiB Mac workers (capstone.io/pool=mac-debian) and any future unlabeled node.
            # Uses only labels that exist live → applies on the next ArgoCD sync, NO
            # `kubectl label` step required.
            #
            # TIER BIAS (preferred, soft): laptop-01 (100) → ua-mis-db-1 (50) →
            # OptiPlex (10). Prefers laptop, spills to db1, then an OptiPlex, but lands on
            # ANY candidate that fits when the preferred tier is full.
            tolerations:
              - key: capstone.io/control-plane
                operator: Equal
                value: "true"
                effect: PreferNoSchedule
              # --- DEDICATE laptop-01 to CI (capacity fix, complements #372 soft affinity) ---
              # laptop-01 (16GiB) is tainted `capstone.io/dedicated=ci-build:NoSchedule` so
              # steady-state platform pods drain OFF and CI gets the near-full node. This
              # toleration lets the RUNNER pod land on the tainted node; #372's weight-100
              # "prefer laptop-01" affinity targets it. Mirrors the Kaniko step-pod placement
              # in platform-services/arc/hook-template.yaml. Taint applied live by the operator
              # AFTER this is synced. Undo: `kubectl taint node laptop-01
              # capstone.io/dedicated=ci-build:NoSchedule-`.
              - key: capstone.io/dedicated
                operator: Equal
                value: ci-build
                effect: NoSchedule
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - { key: capstone.io/pool, operator: In, values: ["build"] }
                    - matchExpressions:
                        - { key: node-role.kubernetes.io/control-plane, operator: Exists }
                preferredDuringSchedulingIgnoredDuringExecution:
                  # PRIMARY — laptop-01 (pool=build, no ci-build label).
                  - weight: 100
                    preference:
                      matchExpressions:
                        - { key: capstone.io/pool, operator: In, values: ["build"] }
                        - { key: capstone.io/ci-build, operator: DoesNotExist }
                  # SECONDARY — ua-mis-db-1 (dedicated CI box, ci-build=true).
                  - weight: 50
                    preference:
                      matchExpressions:
                        - { key: capstone.io/ci-build, operator: In, values: ["true"] }
                  # FALLBACK — control-plane OptiPlexes (last resort; tolerated above).
                  - weight: 10
                    preference:
                      matchExpressions:
                        - { key: node-role.kubernetes.io/control-plane, operator: Exists }
              # ── SOFT SPREAD runner pods across the build pool (node-GUIDED) ──────
              # One runner pod exists per in-flight build. Soft-prefer a pool node that
              # is NOT already running another runner pod (same `part-of` label this
              # scale-set stamps on its own pods) so two concurrent builds' runners land
              # on different pool nodes when both are free — the scheduler load-balances
              # within the pool instead of stacking. `preferred` (never blocks: a
              # single-node pool or one-free-node still schedules); topologyKey per-node
              # scales to N pool nodes with no edit. The heavy Kaniko step-pod carries the
              # SAME anti-affinity + a 4Gi request (platform-services/arc/hook-template.yaml)
              # — that request is the HARD anti-OOM backstop; this is the SOFT steer.
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/part-of: gha-runner-scale-set
                      topologyKey: kubernetes.io/hostname
            securityContext:
              runAsNonRoot: true
              runAsUser: 1001
              fsGroup: 1001
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:2.335.1   # pinned runner image (bump: 2.328.0 deprecated by GitHub — couldn't connect to the broker)
                command: ["/home/runner/run.sh"]
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
                # --- Harbor PUSH credential for Kaniko = OPTION C (container-hook).
                #     In containerMode:kubernetes the build runs in its OWN job-step
                #     pod (a `container:` step — ARC requires job containers in k8s
                #     mode), so a secret on the RUNNER pod is invisible to it. The k8s
                #     container hook merges `platform-services/arc/hook-template.yaml`
                #     into every job-step pod, landing `harbor-push` inside the build
                #     container at /kaniko/.docker/config.json (Kaniko's default dir) —
                #     workflow needs ZERO cred steps. ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
                #     points the runner at that template (mounted from the
                #     arc-hook-template ConfigMap below). The push cred NEVER touches
                #     the general runner pod, only the build container (tightest option:
                #     untrusted non-build steps can't read it; + least-priv robot +
                #     ephemeral runner).
                env:
                  - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
                    value: /home/runner/pod-templates/hook-template.yaml
                volumeMounts:
                  - name: hook-template
                    mountPath: /home/runner/pod-templates
                    readOnly: true
                resources:
                  # RESOURCE KNOB — LIMIT stays 8Gi (was 6Gi, which still OOM-killed the
                  # larger node_modules build — PR #329/#334) to match the Kaniko WORKLOAD
                  # step-pod ceiling (platform-services/arc/hook-template.yaml), so nothing
                  # on this scaleset is capped below the memory a Backstage yarn build
                  # peaks at. REQUEST stays a MODEST 1Gi and is DELIBERATELY NOT raised to
                  # ~4Gi: this is the listener/orchestration pod (runs run.sh; real usage a
                  # few hundred Mi) — it does NO build work, so reserving 4Gi here would be
                  # pure waste and would eat into the pool's build-scheduling budget. The
                  # build's memory is carried by the `$job` pair in hook-template.yaml (the
                  # job-container pod + the Kaniko step-pod), whose REQUEST was raised
                  # 2Gi → 4Gi in THIS same change. That is the lever that stops the OOM:
                  # the scheduler admits by request, and 4Gi on the job+kaniko pair (RWO
                  # `_work` PVC co-pins them = 8Gi together on one node) means laptop-01's
                  # ~11.3Gi build-free memory holds exactly ONE build's heavy pair, so a
                  # SECOND concurrent build cannot co-pack there — it spreads to the other
                  # pool node (podAntiAffinity above) or WAITS, instead of both bursting to
                  # 8Gi and OOM-ing the node (the incident: "requested 2Gi, used 13.4Gi,
                  # capacity 14.7Gi" on laptop-01). See the full one-build-per-node math in
                  # platform-services/arc/hook-template.yaml. Worst-case scheduler-admission
                  # sum for a whole build now = runner 1Gi + job 4Gi + kaniko 4Gi = 9Gi:
                  # fits laptop-01 (~11.3Gi free), does NOT fit ua-mis-db-1 (~7.5Gi alloc,
                  # ~4.5Gi free — it also hosts backstage/dex/db-tier) so a 2nd heavy build
                  # waits for laptop-01 rather than co-packing; db1 still takes lighter
                  # tenant builds when it has room. CPU is unchanged — memory is the fix;
                  # the runner is not CPU-bound and the Kaniko step-pod keeps its
                  # (unbounded) CPU so builds are not throttled.
                  requests: { cpu: "250m", memory: "1Gi" }
                  limits:   { cpu: "2",    memory: "8Gi" }
            volumes:
              # The hook template (arc-hook-template ConfigMap, key `content`) the
              # runner passes to the k8s container hook for every job-step pod.
              - name: hook-template
                configMap:
                  name: arc-hook-template
                  items:
                    - key: content
                      path: hook-template.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false           # arc-runners ships via platform-services/arc
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
