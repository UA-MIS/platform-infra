# Velero Application (dr-backup) — scheduled backup, into the platform's own
# MinIO object store (platform-services/minio, deliberately node-local/non-Ceph
# — see that namespace's header for why). Deploy method A (D-022/D-028): pinned
# Helm chart + the chart repo added to the `platform` AppProject sourceRepos
# allowlist (bootstrap/platform-appproject.yaml in this PR). ⚠ INSTALL-OWNED
# like every other Helm-source add — reaches the live `platform` AppProject
# only via `make bootstrap`/`make bootstrap-reapply` + VERIFY, else this app
# InvalidSpecErrors "repo not permitted".
#
# ⚠ SCOPE NARROWED 2026-09-21 — this no longer backs up "all namespaces". See
# the dated section below ("2026-09-21: narrowed to the 3 VM root disks only")
# for what changed and why; the header comments above/below it that still say
# "all namespaces + PVs" are HISTORY, kept for the incident record, not the
# current behavior.
#
# ── why file-system backup, not CSI/cloud snapshots ───────────────────────────
# `snapshotsEnabled: false` (no VolumeSnapshotLocation) — this cluster has no
# VolumeSnapshotClass wired for the Rook-Ceph RBD CSI driver yet (a documented
# follow-up, not attempted here; anti-gold-plate). Instead `deployNodeAgent: true`
# + `configuration.defaultVolumesToFsBackup: true` makes Velero back up every
# pod volume's ACTUAL FILE DATA via Kopia (its built-in uploader), working
# identically regardless of storage backend (Ceph RBD, the MinIO hostPath PV,
# anything) — the generically-correct choice for "back up all namespaces + PVs"
# without a CSI-snapshot prerequisite.
#
# ── credentials: a scoped, non-root MinIO user (least privilege) ─────────────
# `credentials.existingSecret` points at the SealedSecret this PR ships
# (platform-services/velero/sealedsecret-minio-credentials.yaml) for a DEDICATED
# MinIO IAM user restricted to ONLY the `velero` bucket (created by
# platform-services/minio/minio-provision-job.yaml) — not MinIO's root
# credential. No secret material in git (ADR-030 B1 principle applied here too).
#
# ── the AWS provider plugin talks to MinIO, not AWS ───────────────────────────
# Velero's own core has no S3 client; `velero-plugin-for-aws` (pinned initContainer
# image) IS the S3 client, pointed at MinIO's in-cluster ClusterIP via
# `s3Url` + `s3ForcePathStyle: true` (MinIO needs path-style, not the
# virtual-hosted-style AWS uses) + `region: minio` (a placeholder the plugin
# requires but MinIO ignores).
#
# ── the actual schedule (all namespaces + PVs) ────────────────────────────────
# `schedules.daily-full-backup` runs at 04:00 (after Vault's own 03:00 Raft
# snapshot, docs/operator/vault-and-dr.md, to spread nightly I/O), 30-day TTL,
# `includedNamespaces: ["*"]` — every namespace, minus two deliberate carve-outs
# in `excludedNamespaces`. `minio`: without it, Velero would back up MinIO's own
# local data THROUGH MinIO's own S3 API into itself (the backup store backing up
# its own backing store) — small but pointless recursive growth; excluding it
# does not weaken DR coverage of anything else (MinIO's contents are ALREADY the
# backups; the MinIO deployment's few Kubernetes objects — the StatefulSet,
# Service, SealedSecrets — are cheap to recreate from this very git repo).
# `monitoring`: added 2026-09-13 after a second capstone-w1 disk-pressure
# incident — see the dated comment further down (next to the schedules
# themselves) for the full reasoning.
#
# Chart: velero 12.1.0 (appVersion 1.18.1), pinned. Bump deliberately.
# Root-app recurses applicationsets/, so this Application is registered.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-velero
  namespace: argocd
  labels:
    platform.capstone/component: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts   # PINNED chart repo (sourceRepos allowlist)
    chart: velero
    targetRevision: 12.1.0                                  # pinned chart version (appVersion 1.18.1); no ^/~/latest
    helm:
      releaseName: velero
      values: |
        # AWS provider plugin — the actual S3 client Velero uses to speak to MinIO.
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.13.1
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - mountPath: /target
                name: plugins

        # Scoped, non-root MinIO IAM user (see this file's header). NOT root.
        credentials:
          useSecret: true
          existingSecret: velero-minio-credentials   # key: cloud (AWS-ini format)

        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: velero
              default: true
              credential:
                name: velero-minio-credentials
                key: cloud
              config:
                region: minio
                s3ForcePathStyle: "true"
                s3Url: http://minio.minio.svc.cluster.local:9000
          # No volumeSnapshotLocation — see header (fs-backup via node-agent instead).
          volumeSnapshotLocation: []
          # Back up every pod volume's real file data by default, without needing a
          # per-pod annotation — the generically-correct "all PVs" behavior.
          defaultVolumesToFsBackup: true
          defaultBackupTTL: 720h0m0s   # 30 days retention (matches the schedule's own ttl)

          # Per-repo kopia maintenance jobs (one per protected namespace, hourly by
          # default) previously ran with NO resource requests/limits (chart default:
          # unset) and kept the chart-default 3 failed/completed pods per repo. Found
          # 2026-08-05: after the MinIO re-home (#415/#416) wiped the backup bucket,
          # every pre-existing repo's maintenance job errored continuously
          # ("repository not initialized in the provided storage") and — at 3 kept
          # pods × ~29 affected repos — left ~90 dead Error pods sitting in the
          # velero namespace. Pinning small requests/limits (fleet is
          # resource-constrained OptiPlex/Mac-mini nodes) and dropping keepLatest to 1
          # bounds that debris to ~1 per repo on any future repeat, without losing the
          # most-recent-failure breadcrumb. Does NOT fix the underlying repo-init
          # issue — that's a one-time operator action (recreate the affected
          # BackupRepository CRs so Velero re-initializes them against the now-empty
          # bucket), tracked separately.
          repositoryMaintenanceJob:
            repositoryConfigData:
              global:
                podResources:
                  cpuRequest: "100m"
                  cpuLimit: "200m"
                  memoryRequest: "100Mi"
                  memoryLimit: "200Mi"
                keepLatestMaintenanceJobs: 1

        # No cloud/CSI snapshotter is configured (see header) — Velero backs up PV
        # DATA via the node-agent's file-system backup (Kopia) instead.
        snapshotsEnabled: false
        deployNodeAgent: true
        nodeAgent:
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

        # Velero server memory. RAISED 512Mi -> 2Gi on 2026-09-16.
        #
        # ROOT CAUSE (proven): the server was OOMKilled (exit 137) mid-backup and,
        # on restart, marked the in-flight backup Failed with
        #   "found a backup with status InProgress during the server starting".
        # Confirmed on velero-daily-full-backup-20260915040006: container
        # terminated OOMKilled at 2026-09-15T06:22:47Z; the backup was marked
        # Failed at 06:22:49Z. The 20260914 run died the same way.
        #
        # WHY IT OUTGREW 512Mi: each run now enumerates ~14k items (the cluster
        # has grown to 40+ namespaces). Velero holds the item list in memory
        # during resource collection, so peak RSS scales with item count, not
        # with the amount of PV data moved.
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi

        # Scheduled backups: ALL namespaces + PVs. excludedNamespaces:[minio]
        # avoids the backup store backing up itself (see header) — every other
        # namespace is included.
        #
        # ── 2026-09-03: 30 dailies -> 6 dailies + weeklies (grandfather-son) ──
        # ROOT CAUSE of the capstone-w1 DiskPressure incident. The store had
        # grown to 324.5 G on a 433 GiB node-local disk (94% of everything used
        # on that node), pinning it at the kubelet's 15% imagefs eviction line
        # and evicting alloy, the VPA recommender and student CI runner pods.
        #
        # The driver is NOT total data volume — it is SNAPSHOT COUNT times poor
        # deduplication. Kopia is content-addressed, so it dedupes well across
        # snapshots of files that DON'T change and badly across files that are
        # rewritten in place. Measured on 2026-09-03 (live PVC usage from
        # kubelet_volume_stats_used_bytes vs `du` of each per-namespace Kopia
        # repo, at 29 retained dailies):
        #
        #   namespace    live data   kopia repo   multiplier
        #   vault          2.7 GiB      44 G        16.5x   <- raft/BoltDB rewrite
        #   monitoring    18.1 GiB     108 G         6.0x   <- TSDB/WAL churn
        #   harbor        15.2 GiB      52 G         3.4x
        #   db-tier       14.4 GiB      28 G         1.9x   <- CNPG files stable
        #   VM tenants    12.5 GiB      19.6 G       1.6x   <- disk images static
        #
        # i.e. Vault's 2.7 GiB of real state costs 44 G because every nightly
        # snapshot of a live BoltDB file is nearly all-new content. Cutting the
        # retained snapshot count is therefore close to a linear reduction on
        # exactly the repos that are worst.
        #
        # ── WHAT THIS COSTS IN RECOVERY TERMS (the owner's call, stated plainly)
        # BEFORE: 30 restore points, one per day, covering 30 days. Any incident
        #         discovered within 30 days can be rewound to the previous day,
        #         so worst-case data loss on restore is ~24h at any age.
        # AFTER:  ~10 restore points. Mon-Sat dailies kept 7 days + Sunday fulls
        #         kept 30 days. Within the last week, unchanged (~24h). Between
        #         8 and 30 days old, granularity drops from daily to WEEKLY:
        #         worst-case data loss on restore becomes ~7 days, not ~24h.
        #
        # The concrete scenario this trades away: a silent corruption that began
        # ~12 days ago and is only noticed now. Today you could restore to day
        # 11. After this change the nearest point is the previous Sunday, so you
        # could lose up to 6 additional days of good work on top.
        #
        # The judgement being offered (NOT unilaterally taken — adjust the two
        # ttls below to move the dial): for a teaching cluster whose realistic
        # failure modes are "a team broke their own namespace yesterday" and
        # "a node died", near-daily granularity for a week plus monthly-depth
        # weeklies is the right shape, and 20 of the 30 dailies were buying
        # very little while costing the node it lives on. If long-tail silent
        # corruption is the bigger worry, raise the daily ttl to 336h (14d)
        # first — that is the cheapest place to buy granularity back, because
        # dailies are what dedupe worst.
        #
        # NOTE this alone does not make the store safe: it must be paired with
        # the MinIO bucket quotas (docs/operator/disk-headroom.md), which make
        # overrun fail the BACKUP loudly instead of failing the NODE silently.
        #
        # ── 2026-09-13: exclude `monitoring` entirely (2nd capstone-w1 incident) ──
        # The 09-03 retention cut above was not enough on its own: even at ~10
        # kept restore points instead of 30, the `monitoring` Kopia repo alone
        # regrew to 133 G (measured live 2026-09-13) and, combined with harbor
        # (81 G), vault (44 G), db-tier (34 G) and four tenant VMs (44 G), drove
        # capstone-w1 back to 95% disk, DiskPressure=True, and repeated `minio-0`
        # evictions — which in turn took the BackupStorageLocation `Unavailable`
        # and stalled every kopia maintenance job, so nothing could prune while
        # the disk stayed full (a closed loop; broken this time by manually
        # deleting the `monitoring` repo, 133G -> reclaimed, DiskPressure cleared).
        #
        # `monitoring`'s multiplier (see the table above: 6.0x at the 09-03
        # measurement, i.e. 18.1 GiB of live PVC data costing 108 G of repo) is
        # structural, not a fluke: its PVCs are Prometheus TSDB (20Gi), Loki
        # (10Gi), Tempo (20Gi), Grafana (5Gi) and Alertmanager (2Gi) — all
        # high-churn, self-describing telemetry that is already durably shipped
        # elsewhere (Prometheus -> Thanos long-term storage, `monitoring/
        # thanos.yaml`, retained per its own `raw 30d / 5m 180d / 1h 1y` policy in
        # the SEPARATE `dr-backup` bucket) or fully reconstructible from git
        # (Grafana dashboards/datasources are sidecar-provisioned from
        # ConfigMaps in this repo, and Grafana's own backend moved off its local
        # PVC onto CNPG/Postgres in `db-tier` — see `kube-prometheus-stack-
        # app.yaml`'s "Backend database" comment: "every dashboard and
        # datasource is PROVISIONED from ConfigMaps by the sidecar and
        # re-materializes against the empty database" — `db-tier` is NOT
        # excluded, so that Postgres data, including any hand-built dashboard,
        # keeps its own backup coverage regardless of this exclusion). A
        # week-old TSDB/Loki/Tempo restore has close to zero operational value
        # against the disk cost of a near-full copy every single night. Alertmanager's
        # silence state (2Gi) is the one piece that's ephemeral and unbacked-up
        # after this change, which is an accepted, trivially-recreated loss (a
        # fresh Alertmanager just reopens whatever was already firing).
        #
        # Net effect: `monitoring` drops out of the nightly footprint entirely
        # (not just capped) — same shape as the existing `minio` carve-out
        # above, extended to a second namespace whose own contents are backups
        # (Thanos blocks) or code (dashboards) rather than primary state.
        #
        # ── 2026-09-21: SCOPE NARROWED — the two `["*"]` schedules above are  ──
        # ── GONE. Velero now protects ONLY the 3 KubeVirt VM root disks.      ──
        #
        # TRIGGER: the same day, the `velero` MinIO bucket hit its 240GiB quota
        # and deadlocked — Kopia maintenance (which PRUNES expired snapshots)
        # needs to write a small metadata blob to complete a prune, that write
        # was itself quota-blocked, so nothing could ever be pruned. 70
        # `*-kopia-maintain-job-*` pods sat in `Error`, one per namespace, for
        # as long as two weeks. Fixed as an emergency measure in
        # `platform-services/minio/minio-provision-job.yaml` (quota 240->260GiB,
        # same PR day) — but that only buys headroom. It does not address why a
        # teaching cluster's backup store kept re-hitting its ceiling every few
        # weeks despite two prior retention cuts (2026-09-03, 2026-09-13, both
        # in the history above): this Application was backing up everything,
        # and "everything" on a 40+ namespace cluster keeps growing.
        #
        # THE OWNER'S CALL (stated plainly, not inferred): backups of student
        # projects are NOT mission-critical; keeping old data is not the need;
        # CI/storage must never again be blocked by retention. The only data
        # this Application protects that is genuinely irreplaceable is the 3
        # KubeVirt VM tenants' root disks — there is no other copy of a live VM
        # guest filesystem anywhere. Everything else this used to protect has a
        # better answer that already exists and was VERIFIED LIVE 2026-09-21,
        # not assumed:
        #
        #   - Postgres (`db-tier`, capstone-pg + capstone-tenant-pg): CNPG's
        #     own barman-cloud-plugin PITR, which this Velero backup was never
        #     even a good copy OF (Velero's fs-backup of a live Postgres data
        #     dir is not crash-consistent — no CHECKPOINT / pg_backup_start
        #     coordination). Confirmed via
        #     `kubectl get objectstores.barmancloud.cnpg.io -n db-tier -o
        #     jsonpath='{.items[*].status.serverRecoveryWindow}'`:
        #       capstone-pg-backup-store:        lastSuccessfulBackupTime
        #         2026-09-21T03:00:10Z, firstRecoverabilityPoint 2026-08-22
        #       capstone-tenant-pg-backup-store:  lastSuccessfulBackupTime
        #         2026-09-21T03:30:18Z, firstRecoverabilityPoint 2026-07-13
        #     Both clusters `Cluster in healthy state`, 3/3 ready.
        #   - MariaDB (`db-tier`, capstone-mariadb-mariadb-cluster, Galera):
        #     the operator's own nightly PhysicalBackup CronJob, same
        #     crash-consistency argument. Confirmed via
        #     `kubectl get physicalbackups.k8s.mariadb.com -n db-tier`:
        #     `COMPLETE=True STATUS=Success`, last scheduled 2026-09-21
        #     02:00:00 (143m before this check), job log shows the backup
        #     pushed to S3 storage and old-backup cleanup running normally.
        #   - Everything else (Harbor, Vault, Crossplane, ArgoCD state, tenant
        #     app namespaces, `agile`/board data, etc.): reconstructible from
        #     this git repo plus each service's own persistence mechanism
        #     (Harbor images re-pull/re-build, Vault has its own raft
        #     snapshot, ArgoCD state is git, tenant apps redeploy from their
        #     own repos). None of it was ever verified restorable FROM Velero
        #     either (board #26: no restore has ever been performed) — so this
        #     narrowing trades an unverified, repeatedly-deadlocking safety net
        #     for two verified, independently-operating ones plus the thing
        #     that actually only lives here.
        #
        # RETENTION: 3 days, deliberately short (the owner's instruction, not a
        # default) — these are VM tenants that only need protecting against
        # node loss or an accidental VM deletion, not fine-grained
        # point-in-time recovery; a 3-day-old restore point is adequate for
        # that and keeps this Application's footprint permanently small so it
        # can never again be the thing that fills the bucket.
        #
        # WHAT HAPPENS TO THE OLD DATA: the two `["*"]` schedules are deleted
        # here, but Velero Schedule objects only stamp Backup CRs at creation
        # time — deleting the Schedule does not touch Backups it already
        # created. Every pre-existing non-VM backup keeps the ttl it was given
        # (7d for dailies, 30d for weeklies) and will expire and get pruned on
        # its own now that Kopia maintenance actually works again. No backup
        # was force-deleted by this change. `velero` bucket usage will keep
        # dropping over the following ~30 days as the last weekly-full expires
        # — see minio-provision-job.yaml for the plan to bring the quota down
        # once that has happened (NOT done in this PR: dropping the quota
        # before the old data ages out would fail today's backups outright).
        schedules:
          vm-disks-daily-backup:
            disabled: false
            schedule: "0 4 * * *"
            useOwnerReferencesInBackup: false
            template:
              ttl: "72h0m0s"     # 3 days — short by design, see note above
              includedNamespaces:
                - paper-papas-vm-prod
                - ss-evan-and-emily-vm-prod
                - team-404-vm-prod
              defaultVolumesToFsBackup: true
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # No CreateNamespace: the velero namespace ships via the prereq dir
      # (platform-services/velero/namespace.yaml), same split as Harbor/Vault.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
