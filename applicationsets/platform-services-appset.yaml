# platform-services ApplicationSet (§2.1). A git DIRECTORY generator over
# platform-services/*/ — each service directory (cert-manager, traefik,
# sealed-secrets — wired in T4) becomes one Application in the `platform`
# project. Adding a platform service = adding a directory under platform-services/.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-services
  namespace: argocd
  labels:
    platform.capstone/component: platform
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/UA-MIS/platform-infra
        revision: HEAD
        directories:
          - path: platform-services/*
          # EXCLUDE harbor-onboarding/: it is a per-team Job TEMPLATE (contains a
          # literal `__TEAM__` placeholder substituted by `make harbor-onboard
          # NAME=<name>`), NOT a GitOps-synced service. Without this exclude the
          # appset generates `platform-svc-harbor-onboarding`, which fails to sync
          # ("harbor-onboard-__TEAM__" is an invalid RFC-1123 name) and sits
          # OutOfSync/Missing forever. It has no kustomization.yaml for the same
          # reason. Applied imperatively per team, not reconciled.
          - path: platform-services/harbor-onboarding
            exclude: true
          # EXCLUDE traefik/ (D-042/ADR-028): Traefik is no longer a kustomize-dir
          # service configured via the (k3s-only, inert-on-Talos) HelmChartConfig.
          # It is now a standalone Helm-source Application (applicationsets/traefik-app.yaml,
          # modeled on harbor/backstage) installing the real traefik/traefik chart.
          # The platform-services/traefik/ dir is DELETED in the same change; this
          # exclude documents intent + is belt-and-suspenders so the dir-generator
          # never re-emits a `platform-svc-traefik` if the dir reappears.
          - path: platform-services/traefik
            exclude: true
          # EXCLUDE kubevirt/ + cdi/ (ADR-032, KubeVirt VM workloads): these are
          # NOT single-dir kustomize services. Each is installed by a dedicated
          # operator/CR two-app split (applicationsets/{kubevirt,cdi}-{operator,cr}-app.yaml,
          # the rook-ceph precedent) pointing at the GRANDCHILD dirs
          # platform-services/<x>/{operator,cr}. The single-level `platform-services/*`
          # glob would match the PARENT platform-services/kubevirt + platform-services/cdi
          # (which hold only a README + those subdirs, no root kustomization.yaml) and
          # emit empty/erroring `platform-svc-kubevirt` / `platform-svc-cdi` apps that
          # also double-manage nothing useful. Exclude the parents; the dedicated apps
          # own the operator/ + cr/ subdirs (not matched by the single-level glob).
          - path: platform-services/kubevirt
            exclude: true
          - path: platform-services/cdi
            exclude: true
          # EXCLUDE kyverno-policies/ (supply-chain hardening): its ClusterPolicy
          # objects need the Kyverno CRDs (platform-kyverno, wave 0) to exist FIRST,
          # so it is a dedicated, sync-wave-1 Application
          # (applicationsets/kyverno-policies-app.yaml) — NOT this generic glob,
          # which sets no sync-wave and would risk the CRD race. Also avoids this
          # directory being managed by TWO Applications at once (the
          # platform-services/vpa-policies precedent left that double-management
          # unaddressed; not repeated here).
          - path: platform-services/kyverno-policies
            exclude: true
          # NOTE (P5/M1, D-046): platform-services/backstage IS generated as
          # `platform-svc-backstage` (ns + the REAL sealed secrets: backstage-process-secrets
          # / backstage-postgresql / harbor-pull) — the prereqs the dedicated chart app
          # `platform-backstage-process` needs, SAME SPLIT AS HARBOR. It was EXCLUDED
          # pre-go-live (a guard so the PLACEHOLDER secrets couldn't auto-apply → fail-to-
          # decrypt Degraded); that exclude is REMOVED at go-live now that the live-ops
          # batch sealed the real secrets into git. The single-level glob doesn't descend
          # into backstage/app/ (the in-repo Backstage source), and the dir's
          # kustomization lists only the ns + sealed secrets as resources — so the app
          # source is not applied here.
  template:
    metadata:
      name: 'platform-svc-{{.path.basename}}'
      labels:
        platform.capstone/component: platform
    spec:
      project: platform
      source:
        repoURL: https://github.com/UA-MIS/platform-infra
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        # Neutral default namespace. Each platform service pins its OWN namespace
        # inside its manifests (cert-manager -> cert-manager ns + its own
        # Namespace object; sealed-secrets + traefik -> kube-system), which
        # overrides this for namespaced objects; cluster-scoped objects
        # (CRDs, ClusterIssuers) ignore it. Using kube-system (always present)
        # avoids creating empty, unused per-service namespaces.
        namespace: kube-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # No CreateNamespace: services that need a namespace ship their own
          # Namespace object (cert-manager); the rest target kube-system.
          - ServerSideApply=true   # large CRDs (cert-manager) need SSA
        retry:
          limit: 5
          backoff: { duration: 5s, factor: 2, maxDuration: 3m }
