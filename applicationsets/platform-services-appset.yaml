# platform-services ApplicationSet (§2.1). A git DIRECTORY generator over
# platform-services/*/ — each service directory (cert-manager, traefik,
# sealed-secrets — wired in T4) becomes one Application in the `platform`
# project. Adding a platform service = adding a directory under platform-services/.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-services
  namespace: argocd
  labels:
    platform.capstone/component: platform
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/UA-MIS/platform-infra
        revision: HEAD
        directories:
          - path: platform-services/*
          # EXCLUDE harbor-onboarding/: it is a per-team Job TEMPLATE (contains a
          # literal `__TEAM__` placeholder substituted by `make harbor-onboard
          # NAME=<name>`), NOT a GitOps-synced service. Without this exclude the
          # appset generates `platform-svc-harbor-onboarding`, which fails to sync
          # ("harbor-onboard-__TEAM__" is an invalid RFC-1123 name) and sits
          # OutOfSync/Missing forever. It has no kustomization.yaml for the same
          # reason. Applied imperatively per team, not reconciled.
          - path: platform-services/harbor-onboarding
            exclude: true
          # EXCLUDE lab-hosting/ (lab-hosting layer): this directory holds
          # ONLY the shared Helm CHART (chart/), rendered per-element by the
          # two dedicated labs-*-appset.yaml ApplicationSets (git files/merge
          # generators over the external capstone-labs-fleet repo, NOT this
          # directory generator). (M-8 fix: an earlier draft of this comment
          # also mentioned a `harbor/` subdirectory of operator-only Job
          # templates with literal `__LAB_SLUG__` placeholders — removed when
          # the design switched from Harbor to GHCR, adversarial review B-2;
          # that subdirectory no longer exists.) Without this exclude the
          # glob would ALSO try to render platform-svc-lab-hosting from the
          # bare chart (no real values -> the PLACEHOLDER-* defaults in
          # chart/values.yaml) — the exact double-management failure mode
          # documented on every other exclude here.
          - path: platform-services/lab-hosting
            exclude: true
          # EXCLUDE traefik/ (D-042/ADR-028): Traefik is no longer a kustomize-dir
          # service configured via the (k3s-only, inert-on-Talos) HelmChartConfig.
          # It is now a standalone Helm-source Application (applicationsets/traefik-app.yaml,
          # modeled on harbor/backstage) installing the real traefik/traefik chart.
          # The platform-services/traefik/ dir is DELETED in the same change; this
          # exclude documents intent + is belt-and-suspenders so the dir-generator
          # never re-emits a `platform-svc-traefik` if the dir reappears.
          - path: platform-services/traefik
            exclude: true
          # EXCLUDE kubevirt/ + cdi/ (ADR-032, KubeVirt VM workloads): these are
          # NOT single-dir kustomize services. Each is installed by a dedicated
          # operator/CR two-app split (applicationsets/{kubevirt,cdi}-{operator,cr}-app.yaml,
          # the rook-ceph precedent) pointing at the GRANDCHILD dirs
          # platform-services/<x>/{operator,cr}. The single-level `platform-services/*`
          # glob would match the PARENT platform-services/kubevirt + platform-services/cdi
          # (which hold only a README + those subdirs, no root kustomization.yaml) and
          # emit empty/erroring `platform-svc-kubevirt` / `platform-svc-cdi` apps that
          # also double-manage nothing useful. Exclude the parents; the dedicated apps
          # own the operator/ + cr/ subdirs (not matched by the single-level glob).
          - path: platform-services/kubevirt
            exclude: true
          - path: platform-services/cdi
            exclude: true
          # EXCLUDE kyverno-policies/ (supply-chain hardening): its ClusterPolicy
          # objects need the Kyverno CRDs (platform-kyverno, wave 0) to exist FIRST,
          # so it is a dedicated, sync-wave-1 Application
          # (applicationsets/kyverno-policies-app.yaml) — NOT this generic glob,
          # which sets no sync-wave and would risk the CRD race. Also avoids this
          # directory being managed by TWO Applications at once (the
          # platform-services/vpa-policies precedent left that double-management
          # unaddressed; not repeated here).
          - path: platform-services/kyverno-policies
            exclude: true
          # EXCLUDE ida-llm-preview-guardrails/: it is a PER-PR template, not a
          # single service. It is rendered once per open pull request by
          # applicationsets/ida-llm-preview-guardrails.yaml, which supplies the
          # namespace (`kustomize.namespace: ida-llm-pr-<n>`) — every manifest in
          # that directory deliberately carries NO namespace of its own.
          #
          # Without this exclude the glob would ALSO emit
          # `platform-svc-ida-llm-preview-guardrails`, which would apply a
          # ResourceQuota, a LimitRange, four NetworkPolicies and a Postgres into
          # the appset's default destination namespace (kube-system) — a quota and
          # a default-deny netpol landing on kube-system is not a sync error, it is
          # an outage. Same class of trap as the harbor-onboarding exclude above,
          # with a much worse blast radius.
          - path: platform-services/ida-llm-preview-guardrails
            exclude: true
          # EXCLUDE cnpg/ (db-setup task, in-cluster DB tier): same reason as
          # kubevirt/cdi above — platform-services/cnpg/ holds only a README + the
          # GRANDCHILD dirs barman-plugin/ and cluster/, each owned by its own
          # dedicated Application (applicationsets/cnpg-barman-plugin-app.yaml,
          # applicationsets/cnpg-cluster-app.yaml — see platform-services/cnpg/README.md
          # for the full split). The operator itself + the two namespaces it needs
          # (cnpg-system, db-tier) are NOT under this excluded parent — cnpg-system/
          # and db-tier/ are their OWN flat top-level platform-services/ dirs (still
          # picked up by this glob, ns + secrets only, same split as harbor/vault/eso).
          - path: platform-services/cnpg
            exclude: true
          # EXCLUDE vpa-policies/ + crossplane-mr-prune/ (ArgoCD drift cleanup):
          # both dirs already have DEDICATED Applications
          # (applicationsets/vpa-platform-policies-app.yaml — sync-wave 1 after
          # the VPA CRDs; applicationsets/crossplane-mr-prune-app.yaml — its own
          # review surface, destination crossplane-system). Without these
          # excludes the glob ALSO generated platform-svc-vpa-policies /
          # platform-svc-crossplane-mr-prune, i.e. TWO Applications managing the
          # SAME live objects — each sync flipped the tracking-id annotation to
          # its own name, so one app of each pair was chronically OutOfSync (the
          # exact double-management the kyverno-policies exclude above calls out
          # as "unaddressed"; addressed now). The dedicated apps stay; the
          # svc-* duplicates are pruned by the generator (non-cascading — see
          # syncPolicy.preserveResourcesOnDeletion below).
          - path: platform-services/vpa-policies
            exclude: true
          - path: platform-services/crossplane-mr-prune
            exclude: true
          # NOTE (P5/M1, D-046): platform-services/backstage IS generated as
          # `platform-svc-backstage` (ns + the REAL sealed secrets: backstage-process-secrets
          # / backstage-postgresql / harbor-pull) — the prereqs the dedicated chart app
          # `platform-backstage-process` needs, SAME SPLIT AS HARBOR. It was EXCLUDED
          # pre-go-live (a guard so the PLACEHOLDER secrets couldn't auto-apply → fail-to-
          # decrypt Degraded); that exclude is REMOVED at go-live now that the live-ops
          # batch sealed the real secrets into git. The single-level glob doesn't descend
          # into backstage/app/ (the in-repo Backstage source), and the dir's
          # kustomization lists only the ns + sealed secrets as resources — so the app
          # source is not applied here.
  # Non-cascading prune of generator-removed Applications (ArgoCD drift cleanup):
  # when a directory stops matching the glob (deleted, or excluded above — this
  # change excludes vpa-policies/ + crossplane-mr-prune/), the appset controller
  # deletes the generated Application WITHOUT the resources-finalizer cascade, so
  # the LIVE objects survive and their dedicated/successor Application adopts them
  # in place. Trade-off (accepted): a dir removed WITHOUT a successor app leaves
  # its live objects orphaned for manual cleanup — for this platform that beats a
  # glob/exclude edit being able to delete a live service.
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: 'platform-svc-{{.path.basename}}'
      labels:
        platform.capstone/component: platform
    spec:
      project: platform
      source:
        repoURL: https://github.com/UA-MIS/platform-infra
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        # Neutral default namespace. Each platform service pins its OWN namespace
        # inside its manifests (cert-manager -> cert-manager ns + its own
        # Namespace object; sealed-secrets + traefik -> kube-system), which
        # overrides this for namespaced objects; cluster-scoped objects
        # (CRDs, ClusterIssuers) ignore it. Using kube-system (always present)
        # avoids creating empty, unused per-service namespaces.
        namespace: kube-system
      # Drift cleanup — two classes of MUTATION-INJECTED defaults that ArgoCD's
      # ServerSideApply-predicted state can never contain (both live in ATOMIC
      # lists, so per-item webhook/API-server additions read as a permanent diff):
      #   1. ESO's webhook defaults every ExternalSecret spec.data[].remoteRef
      #      (conversionStrategy/decodingStrategy/metadataPolicy/nullBytePolicy)
      #      — kept svc-backstage / svc-db-admin / svc-db-tier chronically OutOfSync.
      #   2. The API server stamps apiVersion/kind into StatefulSet
      #      volumeClaimTemplates — kept svc-monitoring (tempo) OutOfSync.
      # Class-level on purpose (this ONE template emits every platform-svc-* app;
      # any future dir with an ExternalSecret/StatefulSet inherits the fix), but
      # scoped to EXACTLY the injected fields — real spec changes still diff.
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - '.spec.data[].remoteRef.conversionStrategy'
            - '.spec.data[].remoteRef.decodingStrategy'
            - '.spec.data[].remoteRef.metadataPolicy'
            - '.spec.data[].remoteRef.nullBytePolicy'
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - '.spec.volumeClaimTemplates[].apiVersion'
            - '.spec.volumeClaimTemplates[].kind'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # No CreateNamespace: services that need a namespace ship their own
          # Namespace object (cert-manager); the rest target kube-system.
          - ServerSideApply=true   # large CRDs (cert-manager) need SSA
          - RespectIgnoreDifferences=true   # keep the ignored (webhook-owned) fields out of the apply
        retry:
          limit: 5
          backoff: { duration: 5s, factor: 2, maxDuration: 3m }
