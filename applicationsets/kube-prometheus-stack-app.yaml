# kube-prometheus-stack Application (Observability, retro #3 — "we run a multi-tenant
# platform blind: only metrics-server, no alert even on 'Vault sealed'"). Installs the
# full Prometheus Operator stack: Prometheus + Alertmanager + Grafana + node-exporter +
# kube-state-metrics + the operator and its CRDs (ServiceMonitor / PodMonitor /
# PrometheusRule / Prometheus / Alertmanager).
#
# Deploy method A (D-022/D-028), same as Harbor/Vault/metrics-server: a Helm-source
# Application with the chart repo pinned + allowlisted in the `platform` AppProject
# sourceRepos (bootstrap/platform-appproject.yaml — INSTALL-OWNED, re-apply via
# `make bootstrap-reapply` after merge). Root-app recurses applicationsets/, so this
# Application is registered.
#
# Chart: kube-prometheus-stack 87.3.0 (appVersion / prometheus-operator v0.92.0),
# pinned. Bump deliberately.
#
# SCOPE (anti-gold-plate, per the retro): NO remote-write, NO HA Prometheus pairs —
# single Prometheus (7d local retention, tuned further below) on a Ceph RBD PVC.
# That is still the right altitude for a homelab/student-capstone platform.
#
# ⚠ UPDATE (observability follow-up): a Thanos SIDECAR is now attached (below,
# `prometheus.prometheusSpec.thanos`) so blocks upload to the `dr-backup` MinIO
# bucket for LONG-TERM retention beyond the local 7d window — the Store Gateway/
# Query/Compactor components that read that long-term data back live as their own
# raw-manifest Application (platform-services/monitoring/thanos.yaml), not here.
# ⚠ DEPENDENCY: this sidecar reads the `thanos-objstore-config` SealedSecret (shipped
# by that same file) — if `platform-minio` or its `dr-backup` bucket is ever removed
# without also disabling this block, the sidecar just fails to upload (Prometheus
# itself is unaffected; local scrape/query/alerting keep working).
#
# ── The two values that make this a PLATFORM monitor (not just self-monitoring) ──
# serviceMonitor/podMonitor/probe/ruleSelectorNilUsesHelmValues: false → Prometheus
# discovers EVERY ServiceMonitor / PodMonitor / PrometheusRule in the cluster
# regardless of Helm release label (the default `true` would only match objects
# carrying this release's label). This is what lets the platform-svc-monitoring app
# (platform-services/monitoring/) ship the alert rules + the cross-component scrape
# configs (ArgoCD, cert-manager, ESO) and have Prometheus pick them up, and lets
# tenants add their own ServiceMonitors later.
#
# ── Grafana exposure ── Traefik ingress at grafana.${PLATFORM_DOMAIN} (same pattern
# as harbor/process/argocd: className traefik, TLS host listed but NO secretName so
# Traefik's default TLSStore serves the cert-manager wildcard cert for
# *.capstone.uamishub.com). Prometheus + Alertmanager stay ClusterIP (port-forward
# only) — internal ops surfaces, no need to expose.
#
# ── Grafana SSO (Observability SSO PR) ── Dex `auth.generic_oauth` federates to
# the SAME broker as ArgoCD/Harbor/Backstage/DB-console (platform-services/dex/,
# `grafana` staticClient). labmx -> GrafanaAdmin, every other UA-MIS member ->
# Viewer; the admin/password form stays as break-glass. Full detail + the
# `grafana-oauth` SealedSecret + folder/team-scoped-dashboard design: see
# platform-services/monitoring/README.md "Grafana SSO (Dex)" and "Team-scoped
# dashboards".
#
# Grafana admin password: rotated OFF the chart default — creds come from the
# grafana-admin SealedSecret via grafana.admin.existingSecret (below). Grafana IS
# internet-reachable via the Cloudflare tunnel, so this must be a REAL seal — it
# is (verified live 2026-08-15: login with the stored credential returns HTTP
# 200, isGrafanaAdmin: true). Reseal runbook (for future rotation, not initial
# seeding) + the Alertmanager webhook destination (also a SealedSecret) are in
# platform-services/monitoring/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kube-prometheus-stack
  namespace: argocd
  labels:
    platform.capstone/component: platform
  annotations:
    # Sync-deadlock fix (#127): this app is the monitoring-stack ORIGIN — it owns the
    # `monitoring` namespace (CreateNamespace=true below) AND installs the
    # prometheus-operator CRDs (ServiceMonitor/PodMonitor/PrometheusRule/...). wave 0
    # marks it as the first-to-go owner. NOTE: root-app (bootstrap/root-app.yaml) is a
    # single flat directory.recurse app-of-apps, so this wave is GLOBAL across all
    # platform apps (default wave is 0) — it is documentary here, not a per-app cross-
    # ordering lever. The actual ordering safety is structural: this app no longer
    # depends on anyone (it creates its own ns + CRDs), and the CR-bearing consumers
    # (platform-svc-monitoring, platform-loki) carry SkipDryRunOnMissingResource so
    # they don't hard-fail before these CRDs register; ArgoCD retry/selfHeal converges.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts   # PINNED chart repo (sourceRepos allowlist)
    chart: kube-prometheus-stack
    targetRevision: 87.3.0                                        # pinned chart version (appVersion v0.92.0); no ^/~/latest
    helm:
      releaseName: kube-prometheus-stack
      # Skip Helm hook-based CRD install timing issues: the chart templates its CRDs
      # (crds.enabled below); ServerSideApply on the syncPolicy handles their size.
      values: |
        fullnameOverride: kube-prometheus-stack

        # The prometheus-operator CRDs ship WITH the chart (templated). ArgoCD applies
        # them server-side (syncOptions ServerSideApply=true) — the Prometheus CRD is
        # far larger than the 262 KB client-side annotation limit.
        crds:
          enabled: true

        # The upstream mixin alerts (node/kubelet/apiserver/etcd/memory-pressure, and
        # KubePodCrashLooping / KubeNodeNotReady / KubePodNotReady etc.). Kept ON —
        # this is exactly the broad k8s coverage the "running blind" retro wants, and
        # it is free. Our 6 platform-specific alerts (Vault/ESO/ArgoCD/cert-manager,
        # plus explicit CrashLoop/ImagePull + NodeNotReady for traceability to the
        # retro) live in platform-services/monitoring/alerts.yaml.
        defaultRules:
          create: true
          # ── ADV-5: rules that are STRUCTURALLY FALSE on Talos + Cilium ──────
          # These three upstream mixin groups alert on control-plane components
          # that either do not exist on this cluster or are not reachable on the
          # endpoints the mixin assumes. They fired CONTINUOUSLY — and an alert
          # that is always firing carries zero information, while actively
          # training people to ignore the channel that the rest of FIX-7 works to
          # make trustworthy. Verified live before disabling (see each note).
          rules:
            # `KubeProxyDown` = absent(up{job="kube-proxy"}). There are NO
            # kube-proxy pods on this cluster and never will be — Cilium replaces
            # kube-proxy entirely (kubeProxyReplacement, clusters/real-talos/).
            # The rule is unsatisfiable by construction, not "currently broken".
            kubeProxy: false
            # `KubeSchedulerInstanceUnreachable` / `KubeControllerManagerInstance
            # Unreachable` (+ their TargetDown entries). Verified live from the
            # Prometheus targets API: all 3 control-plane endpoints return
            #   dial tcp 10.237.171.{5,6,8}:{10259,10257}: connect: connection refused
            # i.e. Talos binds these components to localhost, so they are not
            # scrapeable from the pod network on their default ports.
            #
            # ⚠ TRADE-OFF, STATED PLAINLY: this DOES give up direct alerting on the
            # scheduler and controller-manager. That is a real reduction in
            # coverage, accepted here because the alerts carried no signal (always
            # firing) and because failure of either component still surfaces
            # indirectly and quickly — pods stop being scheduled/replaced, which
            # trips KubePodNotReady / KubeDeploymentReplicasMismatch / NodeNotReady.
            # ⚠ HOW TO GET THE COVERAGE BACK PROPERLY (follow-up, NOT a values
            # change): set `--bind-address=0.0.0.0` for kube-scheduler and
            # kube-controller-manager in the Talos machine config
            # (cluster.scheduler.extraArgs / cluster.controllerManager.extraArgs),
            # roll the control-plane nodes, then flip these back to `true` and
            # re-enable the two component blocks below. That is a node-rolling
            # change and was deliberately NOT bundled into a pre-semester PR.
            kubeSchedulerAlerting: false
            kubeControllerManager: false

        # ── ADV-5 (cont.): stop DECLARING scrape targets that cannot be scraped ──
        # Disabling the rules above silences the *-InstanceUnreachable alerts, but
        # `TargetDown` (general.rules, computed straight off `up`) would keep firing
        # for as long as these ServiceMonitors exist and keep failing — it is a
        # generic rule and cannot be disabled per-job without dropping TargetDown for
        # everything. Turning the components off removes the Service + ServiceMonitor,
        # so the `up` series disappear and TargetDown has nothing to evaluate.
        # This is what clears the kube-scheduler / kube-controller-manager TargetDown
        # pair; it is the same one decision as the `defaultRules.rules` flags above
        # and must be reverted together with them (see the Talos bind-address note).
        # kubeProxy is included for the same reason and is unconditionally correct —
        # there is no kube-proxy to scrape.
        kubeProxy:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false

        prometheusOperator:
          # Resource-reclaim (VPA-driven, task follow-up): live VPA target is the
          # recommender's short-history floor (15m/100Mi); actual usage
          # (`kubectl top`) is ~3m cpu / ~76Mi mem — using actual + ~15% headroom.
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 192Mi }

        # ── RAM-governance trim (chore/ram-governance) ─────────────────────────
        # Cluster was under RAM pressure (nodes ~77% used, requests 70-76%).
        # Raise the GLOBAL scrape + rule-eval interval 30s → 60s: this halves the
        # sample-ingest rate and the chunk/WAL churn, which is the REAL Prometheus
        # RSS reducer (retention/limits alone barely move resident memory). No alert
        # impact — every rule in monitoring/alerts.yaml has a `for:` window of ≥ 5m,
        # far larger than a 60s scrape. To ROLL BACK, drop this defaults block.
        prometheus:
          prometheusSpec:
            scrapeInterval: 60s
            evaluationInterval: 60s
            # retention 15d → 7d (+ retentionSize cap): bounds the TSDB on the Ceph
            # RBD PVC and trims the memory-mapped block set the head keeps
            # referenced. 7d is ample for a homelab/student platform; alerts (all
            # `for:` ≥ 5m) and the shipped dashboards read only recent data.
            # retentionSize: 5GB is a hard size cap so compaction evicts oldest
            # blocks well before the 20Gi PVC fills (size GC belt to the 7d belt).
            retention: 7d
            retentionSize: 5GB
            # ── Discover ALL monitors/rules cluster-wide (see header) ──
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            # ── OOM-headroom sizing (paired with the capstone-n3 nodeSelector below) ──
            # The 2048Mi/2560Mi pair was chronically near-OOM: live RSS ~2418Mi
            # (`kubectl top`), ~94% of the 2560Mi limit — one WAL-replay or compaction
            # spike from an OOMKill. This 3Gi/6Gi pair (kept from #327) gives real
            # headroom. The pod now lands on capstone-n3, a control-plane OptiPlex
            # (~14.72GiB allocatable) that at move time sat ~53% used (~6.9Gi free by
            # request) — the roomiest of the three CP nodes (n1 ~68%, n2 ~66%).
            #   request 3Gi  — reserves comfortably above the ~2.4Gi steady-state
            #                  working set; steady-state RSS sits ~600Mi under the
            #                  reservation so the scheduler protects it from evict.
            #   limit   6Gi  — a burst ceiling for WAL replay / block compaction,
            #                  ~2.5x steady state. On n3 the steady footprint is
            #                  ~10.5Gi/14.72Gi (~71%) and a rare WAL-replay burst to
            #                  6Gi peaks ~95% briefly — acceptable for a single-replica,
            #                  quorum-free pod; n3 co-hosts control-plane components so
            #                  the burst is monitored (see runbook). NOT sized larger.
            #   ⚠ WHY n3, not laptop-01 (#327 → this change): laptop-01 is ALSO the CI
            #     build node (capstone.io/pool=build) where a Kaniko build bursts to
            #     ~6-8Gi. Prometheus (3Gi/6Gi) + a heavy build on the SAME ~14.7Gi box
            #     drove the kubelet OOM that rejected a runner pod ("requested 2Gi, used
            #     13.4Gi, capacity 14.7Gi" on laptop-01). Moving Prometheus onto the
            #     idle-est control-plane node ends that fight and frees laptop-01 for
            #     builds. n3's PreferNoSchedule control-plane taint is tolerated below.
            # (Goldilocks/VPA still can't see this StatefulSet — it's owned by the
            # `Prometheus` CRD, ConfigUnsupported/NoPodsMatched — so `kubectl top` is
            # ground truth here, not a VPA target.)
            resources:
              requests: { cpu: 128m, memory: 3Gi }
              limits: { memory: 6Gi }
            # ── SCHEDULING HARDENING (noisy-neighbor incident follow-up) ──────────
            # mac-debian-01 (4c/8GB) was simultaneously running the Vault raft
            # LEADER (vault-0), this Prometheus pod (2048-2560Mi mem request/limit,
            # the single heaviest thing on that box besides Ceph), AND a CNPG
            # Postgres replica — all fsync-sensitive on the same overlay-attached
            # Ceph RBD path. A cilium policy-recalc loop saturating that node
            # stalled Vault's raft snapshots 2s -> 23min. Vault (3 pods) and the
            # CNPG Cluster (3 instances) each carry their OWN required
            # one-pod-per-node anti-affinity (vault-app.yaml / cluster.yaml), which
            # — with only 3 Mac-Mini-class 4c/8GB workers currently eligible —
            # structurally pins one of each onto every Mac Mini already. This
            # single-replica Prometheus is the one piece of that puzzle that is
            # FREE to move: soft-prefer any node NOT already running a Vault server
            # pod or a CNPG instance, which in practice steers the scheduler toward
            # the untainted, comparatively idle `ua-mis-db-1` worker (or, under
            # pressure, the beefier 15GB control-plane OptiPlex nodes) instead of
            # re-landing on the same crowded Mac Mini. `preferred`, not `required`
            # — with only 7 nodes total we do not want to risk Prometheus going
            # Pending if every node happens to score poorly; see
            # artifacts/design/scheduling-hardening-runbook.md for the apply order (this is the
            # SAFE-to-apply-first half: Prometheus has no raft/quorum state, its
            # TSDB just reattaches wherever it lands).
            #
            # ⚠ podAntiAffinity: "" is REQUIRED alongside a custom `affinity:`
            #   below — verified by rendering the chart (helm template): the
            #   `prometheus.yaml` template has TWO independent `if` blocks that
            #   both write into `spec.affinity` (one for the custom `affinity`
            #   value, a SEPARATE one for the `podAntiAffinity: "soft"` chart
            #   default), producing a duplicate `podAntiAffinity:` map key with
            #   the chart's default self-anti-affinity term silently clobbering
            #   ours (last-key-wins on the k8s API's YAML/JSON unmarshal). With
            #   `replicas: 1` (unset here = chart default) the chart's own
            #   self-anti-affinity was inert anyway (nothing to avoid), so
            #   disabling it costs nothing.
            podAntiAffinity: ""
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 80
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: vault
                          component: server
                      topologyKey: kubernetes.io/hostname
                  - weight: 60
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          cnpg.io/podRole: instance
                      topologyKey: kubernetes.io/hostname
                  - weight: 60
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: mariadb
                      topologyKey: kubernetes.io/hostname
            # Allow scheduling onto the roomy OptiPlex control-plane nodes (see the
            # preferredDuringScheduling steering above — under memory pressure this
            # is where we WANT Prometheus to land). The control-plane nodes carry a
            # PreferNoSchedule taint (capstone.io/control-plane=true, verified live
            # via `kubectl get node capstone-n1 -o jsonpath='{.spec.taints}'`) so
            # they stay soft-repellent to everything else by default; this
            # toleration just opts single-replica, stateless-relative-to-quorum
            # Prometheus back in.
            tolerations:
              - key: capstone.io/control-plane
                operator: Equal
                value: "true"
                effect: PreferNoSchedule
            # ── HARD PIN to capstone-n3 (moved OFF the CI build node laptop-01) ────
            # Pin this single-replica Prometheus onto capstone-n3, a control-plane
            # OptiPlex (~14.72GiB allocatable) that sat ~53% used at move time — the
            # roomiest of the three CP nodes (n1 ~68%, n2 ~66%) and NOT a member of the
            # CI build pool. `nodeSelector` is a HARD filter (not the soft `affinity`
            # steering above), so the pod lands here deterministically.
            #
            # ⚠ WHY MOVED (was laptop-01, #327): laptop-01 is the fast CI BUILD node
            #   (capstone.io/pool=build). Running a 3Gi/6Gi Prometheus AND a Kaniko
            #   build (bursts ~6-8Gi) on the same ~14.7Gi box drove the kubelet OOM that
            #   rejected a runner pod ("requested 2Gi, used 13.4Gi, capacity 14.7Gi").
            #   Monitoring and CI were fighting for the same RAM. Moving Prometheus onto
            #   the idle-est CONTROL-PLANE node ends that fight and hands laptop-01 back
            #   to builds. n3 carries the `capstone.io/control-plane=true:PreferNoSchedule`
            #   taint — the `tolerations:` above (kept from #316) is REQUIRED for the pod
            #   to schedule here; verify it is present if you re-touch this block.
            #
            # The #316 `affinity:` (soft anti-affinity away from Vault/CNPG/MariaDB) is
            # KEPT ON PURPOSE even though this hard nodeSelector makes it inert while the
            # pin is in place (one candidate node → soft preferences never fire). n3 runs
            # no Vault/CNPG/MariaDB pod today, so there is no conflict. Retaining it means
            # dropping the nodeSelector later restores #316 soft-steering with no 2nd edit.
            #
            # ⚠ NODE CAVEAT: a hostname pin means if capstone-n3 drains/leaves, this pod
            #   goes Pending (its Ceph RBD PVC is RWO/replica-3 and survives node loss, so
            #   the DATA is safe — but nothing schedules the pod until a node named
            #   capstone-n3 exists again OR this selector changes). To rebalance: either
            #   (a) repin — swap this hostname to another roomy node + toleration if it is
            #   control-plane-tainted; or (b) drop this `nodeSelector:` block entirely to
            #   hand scheduling back to the #316 soft-affinity + toleration (retained
            #   above). Either is a one-line change; the PVC reattaches where the pod lands
            #   (brief WAL-replay restart on any move — expected, not data loss).
            nodeSelector:
              kubernetes.io/hostname: capstone-n3
            # TSDB on a Ceph RBD PVC (replica-3, survives node loss; same SC as
            # Harbor/Vault). 20Gi holds ~15d of platform-scale metrics comfortably.
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: ceph-block
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
            # Thanos sidecar — uploads completed TSDB blocks to the `dr-backup` MinIO
            # bucket for LONG-TERM storage beyond the 7d local retention above (see
            # the Application header + platform-services/monitoring/thanos.yaml,
            # which ships the objstore SealedSecret this references, plus the Query/
            # Store-Gateway/Compactor that read the uploaded blocks back). Adding this
            # does NOT change local scrape/query/alerting — it only adds a sidecar
            # container that (a) uploads finished blocks and (b) serves the Store
            # API (gRPC :10901, auto-added to the `prometheus-operated` headless
            # Service by the operator) so Thanos Query can read recent data straight
            # from this Prometheus while history comes from the Store Gateway.
            thanos:
              image: quay.io/thanos/thanos:v0.41.0   # pinned; matches platform-services/monitoring/thanos.yaml
              objectStorageConfig:
                existingSecret:
                  key: objstore.yml
                  name: thanos-objstore-config
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }

        alertmanager:
          alertmanagerSpec:
            # Mount the notification-destination SealedSecret (shipped by
            # platform-services/monitoring/sealedsecret-alertmanager-webhook.yaml) into
            # the Alertmanager pods at /etc/alertmanager/secrets/alertmanager-webhook/.
            # The `platform-oncall` receiver below reads its `url` key via url_file, so
            # the webhook endpoint is NEVER inlined in these values. ⚠ UPDATE
            # (observability follow-up): this now ships a REAL seal — the URL points
            # at the in-cluster `platform-alerts` topic on the self-hosted ntfy server
            # (platform-services/monitoring/ntfy.yaml), including `?template=alertmanager`
            # so ntfy renders readable firing/resolved notifications instead of raw
            # JSON. See that file + README "Notification channel" for the ntfy
            # dependency + phone-subscription instructions.
            secrets:
              - alertmanager-webhook
            # Resource-reclaim (VPA-driven, task follow-up): actual usage (`kubectl
            # top`) is ~2m cpu / ~40Mi mem — using actual + ~15% headroom. (Same
            # ConfigUnsupported/NoPodsMatched VPA gap as Prometheus above — this
            # Alertmanager StatefulSet is Operator-CRD-owned too — so `kubectl top`
            # is the source of truth, not a VPA target.)
            resources:
              requests: { cpu: 20m, memory: 48Mi }
              limits: { memory: 96Mi }
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: ceph-block
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi
          # ── Alertmanager routing — WEBHOOK RECEIVER ───────────────────────────
          # `null` swallows the always-firing Watchdog heartbeat; everything at
          # severity critical|warning routes to `platform-oncall`, a generic-webhook
          # receiver. The endpoint is read from a mounted SealedSecret via `url_file`
          # (see alertmanagerSpec.secrets above) so NO URL/token is inlined here. A
          # generic webhook is the simplest destination that needs no channel/token in
          # the values — repoint it at a Slack/Discord/PagerDuty relay, an incident
          # bot, or Alertmanager→Slack bridge. To switch to native slack_configs /
          # email_configs instead, keep the same pattern: put the URL/token in the
          # SealedSecret and reference it by *_file. url_file now resolves a REAL,
          # live destination (self-hosted ntfy, README "Notification channel").
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by: ['namespace', 'alertname']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              receiver: 'null'
              routes:
                - receiver: 'null'
                  matchers:
                    - alertname = "Watchdog"
                # FIX-15/MON-009: kube-prometheus-stack's bundled KubeClientCertificate
                # Expiration (both the warning and critical variant — same alertname,
                # different `severity` label, so ONE matcher on alertname covers both)
                # is a structural false positive on this cluster, the same class ADV-5
                # already removed elsewhere (kube-scheduler/controller-manager/proxy):
                # it fires CONTINUOUSLY, carries zero information, and trains people to
                # ignore the channel FIX-7 exists to make trustworthy.
                #
                # ROOT-CAUSED LIVE (not assumed), 2026-08-15: the expr is
                #   histogram_quantile(0.01, rate(apiserver_client_certificate_
                #   expiration_seconds_bucket{job="apiserver"}[5m])) < <threshold>
                # i.e. the 1st percentile of remaining lifetime across EVERY client
                # cert the apiserver has observed. On two of the three control-plane
                # instances, ~30104 of ~325k observed certs sit in the <=30-minute
                # bucket PERMANENTLY (a genuine, constant population of very
                # short-lived, presumably auto-rotating certs — not a snapshot
                # artifact: a 6h range query shows the quantile pinned between ~170s
                # and ~1800s the entire window, never once clearing even the 24h
                # CRITICAL threshold, let alone the 7d warning one). Nothing is
                # actually about to expire; the 1st-percentile statistic is
                # structurally dominated by a population that rotates on a timescale
                # the alert was never designed to tolerate.
                #
                # WHY A ROUTE, NOT `kubernetesSystem: false`: that flag is the ONLY
                # chart-native on/off switch, but it disables the WHOLE
                # kubernetes-system-apiserver rule group — 5 OTHER, genuinely useful
                # alerts live there too (KubeAPIDown, KubeAPIInstanceUnreachable,
                # KubeAggregatedAPIErrors, KubeAggregatedAPIDown, KubeAPITerminated
                # Requests), confirmed by rendering the chart's own rule templates.
                # Losing KubeAPIDown/KubeAPIInstanceUnreachable to silence one noisy
                # alert would be a materially worse trade than the ADV-5 cases (whose
                # entire groups WERE dead). This route is the surgical alternative,
                # following the exact pattern already established one line above for
                # Watchdog: the rule keeps evaluating and stays visible in
                # Prometheus's own /alerts view (so it is not a "blanket deletion" —
                # nothing that queries Prometheus directly loses information), it
                # simply never reaches a human via ntfy.
                - receiver: 'null'
                  matchers:
                    - alertname = "KubeClientCertificateExpiration"
                - receiver: 'platform-oncall'
                  matchers:
                    - severity =~ "critical|warning"
            receivers:
              - name: 'null'
              - name: 'platform-oncall'
                webhook_configs:
                  # url_file reads the endpoint from the mounted SealedSecret; the file
                  # lands at /etc/alertmanager/secrets/<secretName>/<key>.
                  - url_file: /etc/alertmanager/secrets/alertmanager-webhook/url
                    send_resolved: true
                    # ── SECOND delivery failure mode, distinct from the 400 (FIX-7) ──
                    # ntfy rejects any request whose BODY exceeds ~128 KiB with
                    # HTTP 413, and — exactly like the 400 that caused this task —
                    # Alertmanager does not retry 4xx, so the notification is dropped
                    # silently. This one is NOT fixed by the compact ntfy template:
                    # the body is rejected BEFORE the template ever runs, so how small
                    # the message renders is irrelevant.
                    #
                    # Measured against the real ntfy v2.25.0 by binary search:
                    #   114 alerts / 130610 B body -> HTTP 200
                    #   115 alerts / 131739 B body -> HTTP 413
                    # i.e. the cap is 128 KiB of request body, ~114 alerts at the
                    # ~1.1 KB/alert of a realistic Crossplane MR alert. Fatter alerts
                    # (longer labels/annotations) hit it sooner.
                    #
                    # This is reachable in practice, not theoretical: Alertmanager
                    # groups by ['namespace','alertname'], so ONE provider outage that
                    # trips a per-resource rule fans the whole fleet into a SINGLE
                    # webhook POST. FIX-4's CrossplaneManagedResourceNotSynced fires
                    # per managed resource against ~148 live MRs — one bad credential
                    # and that group alone is ~170 KB, over the cap. The alert that
                    # tells you the platform is broken would be the one that cannot be
                    # delivered.
                    #
                    # max_alerts truncates the alerts array at the SOURCE and reports
                    # the dropped count in the payload's `truncatedAlerts` field, which
                    # the ntfy template reads so the "×N" and "… and N more" counts stay
                    # HONEST (they report the true total, not the truncated one).
                    # 25 is chosen for headroom, not to fit exactly: at a fat ~3 KB per
                    # alert that is ~75 KB, comfortably under the 128 KiB cap, while
                    # still far more than the 5 the template itemises.
                    #
                    # ⚠ Fixing this at the ntfy end instead would mean raising
                    # message-size-limit, which is exactly the trade this task already
                    # rejected — >4K breaks FCM/APNS phone delivery silently.
                    max_alerts: 25

        grafana:
          # Admin creds come from the grafana-admin SealedSecret (shipped by
          # platform-services/monitoring/sealedsecret-grafana-admin.yaml), NOT the
          # chart default (admin / prom-operator) — Grafana is internet-reachable via
          # the CF tunnel (header). The Grafana chart reads keys admin-user /
          # admin-password from the referenced secret. ⚠ ships as a PLACEHOLDER seal —
          # until resealed, the grafana-admin Secret is absent and the Grafana pod
          # stays CreateContainerConfigError (README "Rotating the Grafana admin
          # password"). No password is inlined here.
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          # --- University of Alabama MIS UI theme (THEME, matching the ArgoCD pattern
          #     in platform-services/argocd-config/) ---
          # Grafana OSS gates real white-labeling (app_title/login_logo/menu_logo/
          # fav_icon under grafana.ini's [white_labeling] section) behind an Enterprise
          # license — those ini keys are silently ignored without one (confirmed via
          # the Grafana docs: "Enterprise only"). Two things ARE safe + free on OSS:
          #   1. default_theme: dark — a genuine [users] grafana.ini key, no license
          #      gate. Matches the charcoal-dark aesthetic already applied to ArgoCD's
          #      sidebar.
          #   2. Overlaying the two UNHASHED static icon files Grafana's OSS index.html
          #      template references directly off disk — `public/build/img/fav32.png`
          #      and `public/build/img/apple-touch-icon.png` (verified against
          #      grafana/grafana `pkg/api/index.go`, where FavIcon/AppleTouchIcon
          #      default to exactly those paths when no Enterprise branding is
          #      configured, and `public/views/index.html`, which references them via
          #      plain `<link>` tags). This is a file overlay, NOT a grafana.ini
          #      setting, so it needs no license and cannot fail Grafana's startup —
          #      worst case (an upstream chart bump moves the asset path) the mount is
          #      simply a no-op and Grafana falls back to its own default icon.
          # The ConfigMap (grafana-ua-mis-theme-cm) is generated from the committed
          # UA-MIS crimson PNGs in platform-services/monitoring/grafana-theme/ by the
          # platform-svc-monitoring app (platform-services/monitoring/kustomization.yaml)
          # — same namespace (monitoring), referenced here by its STABLE name.
          # --- Dex SSO (Observability SSO, mirrors ArgoCD/Harbor/Backstage/DB-console:
          #     one GitHub OAuth app via Dex, N tools) ---
          # `[server]` domain/root_url MUST be the public Traefik host — Grafana
          # builds the OAuth redirect_uri from root_url, and it MUST exactly equal
          # the `grafana` staticClient's redirectURIs entry in
          # platform-services/dex/configmap.yaml
          # (https://grafana.capstone.uamishub.com/login/generic_oauth) or Dex
          # rejects the callback. Without this block Grafana defaults to
          # http://localhost:3000, which is wrong behind Traefik.
          #
          # `[auth.generic_oauth]` points at Dex's standard OIDC endpoints
          # (id.capstone.uamishub.com — same issuer ArgoCD/Harbor/Backstage/the
          # DB-console oauth2-proxy already use). `client_secret` is deliberately
          # NOT set here — it comes from GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
          # (envValueFrom below), sourced from the `grafana-oauth` SealedSecret
          # (sealedsecret-grafana-oauth.yaml), same posture as oauth2-proxy's
          # OAUTH2_PROXY_CLIENT_SECRET (db-console-auth/deployment.yaml).
          #
          # Role mapping (role_attribute_path, JMESPath over the `groups` claim —
          # Dex's GitHub connector emits `UA-MIS:<team-slug>` entries, SEC-007):
          #   - `UA-MIS:labmx` (the platform-admin Team, same one ArgoCD RBAC maps
          #     to role:admin) -> Grafana `GrafanaAdmin` (org Admin + Grafana
          #     server admin — the "labmx -> Admin" requirement). Needs
          #     `allow_assign_grafana_admin = true`, scoped to this one role-map
          #     branch (no other branch ever resolves to GrafanaAdmin).
          #   - every other authenticated UA-MIS member (any other `UA-MIS:*`
          #     team, or none) -> `Viewer` — dashboards are for CONSUMING, not
          #     editing, per team.
          # `disable_login_form`/`auto_login` are left false — the chart-default
          # admin/password login form (grafana-admin SealedSecret) stays visible
          # as the break-glass fallback alongside the "Sign in with Dex" button,
          # never bypassed.
          "grafana.ini":
            # ── Backend database: Postgres on the in-cluster CNPG cluster ──────────
            # Grafana's backend store, moved OFF the chart-default embedded SQLite.
            #
            # WHY: Grafana 13.1 SELF-contends on the one SQLite file — unified
            # storage's `resource_version` table, three concurrent job-drivers,
            # ngalert's scheduler, and the dashboard-provisioning sidecar all
            # serialize on SQLite's single writer. Measured live with ZERO external
            # load: 43 of the last 50 log lines were `database is locked (5)
            # (SQLITE_BUSY)`, and ngalert.scheduler was failing to update alert rules
            # outright. This took Grafana down 4x in one day. It is an architectural
            # limit (one writer, period), not a tuning problem — Postgres removes the
            # serialization point entirely.
            #
            # `host` MUST carry the port: Grafana's [database] host is a single
            # `host:port` string, NOT a bare hostname with a separate port key.
            # Points at the RW (primary) service — Grafana writes constantly, so the
            # -ro/-r replica services would be wrong.
            #
            # NO `password` key here, deliberately: it arrives as the
            # GF_DATABASE_PASSWORD env var (envValueFrom below, ESO <- Vault
            # platform/db/cnpg/grafana). Grafana maps GF_<SECTION>_<KEY> onto this
            # ini, so that env var IS this section's `password` — no secret material
            # in git (ADR-030 §0).
            #
            # `ssl_mode: require` — encrypts the credential + query traffic on the
            # wire. Verified against this exact cluster before the cutover: `disable`
            # and `require` both connect; `verify-ca` does NOT (it needs the CNPG CA
            # bundle mounted into the Grafana pod — a worthwhile follow-up, not a
            # prerequisite). CNPG's pg_hba is `host all all all scram-sha-256`, which
            # permits both, so `require` is a free upgrade over the plaintext path.
            #
            # The `grafana` role owns the `grafana` database and runs Grafana's own
            # schema migrations on first boot (platform-services/cnpg/cluster/
            # {databases,roles}.yaml). NO data migration is performed or needed: every
            # dashboard and datasource is PROVISIONED from ConfigMaps by the sidecar
            # and re-materializes against the empty database. See this PR's body for
            # the exact (small) list of what does not carry over.
            database:
              type: postgres
              host: capstone-pg-rw.db-tier.svc.cluster.local:5432
              name: grafana
              user: grafana
              ssl_mode: require
            users:
              default_theme: dark
              # Belt-and-suspenders default for any auth path that doesn't hit
              # role_attribute_path (e.g. the break-glass admin/password login) —
              # the generic_oauth role_attribute_path below is what actually
              # governs SSO logins.
              auto_assign_org_role: Viewer
            server:
              domain: grafana.capstone.uamishub.com
              root_url: "https://grafana.capstone.uamishub.com"
            auth:
              disable_login_form: false
            "auth.generic_oauth":
              enabled: true
              name: "Dex (GitHub / UA-MIS)"
              icon: github
              client_id: grafana
              scopes: "openid profile email groups"
              auth_url: "https://id.capstone.uamishub.com/auth"
              token_url: "https://id.capstone.uamishub.com/token"
              api_url: "https://id.capstone.uamishub.com/userinfo"
              use_pkce: true
              allow_sign_up: true
              # Explicit (not the deprecated global `[auth] oauth_auto_login`) —
              # land on the chooser screen so the admin/password break-glass
              # login stays reachable, never auto-redirected past.
              auto_login: false
              role_attribute_path: "contains(groups[*], 'UA-MIS:labmx') && 'GrafanaAdmin' || 'Viewer'"
              role_attribute_strict: false
              allow_assign_grafana_admin: true
              # Inert without Grafana Enterprise (Team Sync is an Enterprise-only
              # feature — confirmed via Grafana docs, this install is OSS). Kept
              # set so a future Enterprise license activates team sync with zero
              # config change; see the monitoring README "Team-scoped dashboards"
              # for the OSS-compatible alternative actually in effect (folders +
              # a `namespace` template variable, not IdP-driven team membership).
              groups_attribute_path: groups
          # GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET — the ONLY piece of the OAuth
          # config not inlined in grafana.ini above (see the block header). Reads
          # the `client-secret` key from the grafana-oauth SealedSecret
          # (sealedsecret-grafana-oauth.yaml) — the SAME value as the
          # `grafana-client-secret` key in platform-services/dex/sealedsecret.yaml
          # (both sides of the OAuth handshake must agree).
          envValueFrom:
            # GF_DATABASE_PASSWORD — the `[database] password` for the CNPG backend
            # configured in grafana.ini above (Grafana maps GF_<SECTION>_<KEY> onto
            # its ini, and env takes precedence over the file). Reads the
            # GF_DATABASE_PASSWORD key from the `grafana-cnpg-db-credentials` Secret,
            # materialized by ESO from Vault platform/db/cnpg/grafana
            # (platform-services/monitoring/externalsecret-cnpg-db.yaml) — the SAME
            # Vault value CNPG's own `cnpg-grafana-app-credentials` Secret in ns
            # db-tier uses to set the role's password, so the two can never drift.
            # Same injection mechanism as the OAuth client secret below.
            GF_DATABASE_PASSWORD:
              secretKeyRef:
                name: grafana-cnpg-db-credentials
                key: GF_DATABASE_PASSWORD
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oauth
                key: client-secret
          extraConfigmapMounts:
            - name: ua-mis-favicon
              configMap: grafana-ua-mis-theme-cm
              mountPath: /usr/share/grafana/public/build/img/fav32.png
              subPath: fav32.png
              readOnly: true
            - name: ua-mis-apple-touch-icon
              configMap: grafana-ua-mis-theme-cm
              mountPath: /usr/share/grafana/public/build/img/apple-touch-icon.png
              subPath: apple-touch-icon.png
              readOnly: true
          persistence:
            enabled: true
            storageClassName: ceph-block
            accessModes: ["ReadWriteOnce"]
            size: 5Gi
          # Single replica + a ReadWriteOnce Ceph RBD PVC needs Recreate, not the
          # chart default RollingUpdate: RollingUpdate schedules the replacement pod
          # (which can land on a different node — this cluster now spans the
          # Talos control-plane nodes AND the Mac fleet workers) BEFORE tearing down
          # the old one, and Ceph RBD can only attach an RWO volume to one node at a
          # time. The new pod then wedges forever at Init:0/1 (init-chown-data can't
          # start — FailedAttachVolume: "Multi-Attach error ... already used by
          # pod(s) <old-pod>"), while the old pod keeps serving (so it isn't
          # obviously broken from the Grafana-availability side). Hit for the first
          # time on the #248 resource-request bump, which was simply the first spec
          # change to this Deployment since the Mac nodes joined — any future spec
          # change would trigger the same wedge without this. Recreate makes k8s
          # terminate (and detach) the old pod before scheduling the new one.
          deploymentStrategy:
            type: Recreate
          # Resource-reclaim (VPA-driven, task follow-up): live VPA target for the
          # `grafana` container is cpu 11m / mem ~259Mi (+15% headroom below) —
          # memory was UNDER-provisioned (old 128Mi request vs. actual pod usage
          # already at ~380Mi total across grafana + both sidecars).
          #
          # ⚠ UPDATE (operator-reported incident, 2026-07-10): clicking through several
          # dashboards quickly made Grafana unavailable for a few minutes. Live
          # investigation (thanos-query PromQL against this exact pod):
          #   - kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}:
          #     NO MATCH for this pod over the last 30d, and restartCount==0 the whole
          #     time — this was NOT a container OOMKill.
          #   - increase(container_cpu_cfs_throttled_periods_total{...}[24h]): NO DATA
          #     — expected, since the OLD spec set NO cpu limit at all, so CFS throttling
          #     was structurally impossible; "CPU limit too low" was not the cause either.
          #   - max_over_time(container_memory_working_set_bytes{...}[24h]) = 401870848
          #     bytes (~383.2Mi) against a 384Mi limit / GOMEMLIMIT (the chart wires
          #     GOMEMLIMIT to limits.memory automatically, visible on the live pod as
          #     GOMEMLIMIT=402653184) — i.e. the container was running at ~99.8% of its
          #     memory ceiling. That's the real mechanism: as heap approaches GOMEMLIMIT,
          #     Go's GC runs continuously trying to stay under it, burning CPU and
          #     stalling request handling long enough to fail the liveness/readiness
          #     probe (observed: repeated `Liveness probe failed: ... 503` /
          #     `Readiness probe failed: ... 503` events) — which reads to an operator
          #     as "the pod restarted," even though no restart/OOMKill occurred.
          #     Clicking through several dashboards quickly is exactly the burst
          #     (many concurrent panel-query allocations) that pushes it there.
          #   Fix: give real memory headroom (2x the old 384Mi limit, comfortably above
          #   the observed ~401Mi peak) so GC stops thrashing at the edge, and add a
          #   generous (not tight) CPU limit — `monitoring` is excluded from the
          #   Kyverno require-limits policy today, so a cpu limit isn't mandatory here,
          #   but on a 6-node homelab an literally-unbounded container can still starve
          #   its node's neighbors under the same burst, so bound it generously (1 core,
          #   ~60x the observed idle usage of ~16m) rather than leave it unlimited.
          resources:
            requests: { cpu: 50m, memory: 384Mi }
            limits: { cpu: 1000m, memory: 768Mi }
          # sidecar.resources is shared by BOTH the dashboard- and datasource-sync
          # sidecar containers (chart limitation, one knob for both). Sized for the
          # larger of the two VPA targets (grafana-sc-dashboard ~121Mi) + headroom.
          sidecar:
            resources:
              requests: { cpu: 16m, memory: 144Mi }
              limits: { memory: 192Mi }
            dashboards:
              # Folder-per-purpose (team-scoped UX, PART B): every dashboard
              # ConfigMap below carries a `grafana_folder` ANNOTATION (not the
              # `grafana_dashboard: "1"` LABEL, which stays the sidecar's pure
              # selector) whose value is the destination folder name — the
              # sidecar creates the folder on first sight and files the dashboard
              # into it. Two folders ship in this PR: "Platform / Infra" (admin-
              # facing, cross-tenant) and "Platform / Tenants" (per-app
              # dashboards with a `namespace` template variable — the "team logs
              # in, sees their app cleanly" default view). Dashboards with no
              # annotation land in "General" (none do, as of this PR).
              folderAnnotation: grafana_folder
              # NOTE (tried and reverted, #523): adding
              # `provider.foldersFromFilesStructure: true` here is NOT sufficient
              # to make the annotation above take effect, and is actively worse.
              # It does make Grafana create the folders, but the provisioner will
              # not MOVE a dashboard that is already provisioned into General --
              # it matches on uid and updates in place -- so the result is the
              # same 44 dashboards in General PLUS three empty folders. Worse,
              # the existing annotation values contain "/" ("Platform / Infra"),
              # which the sidecar writes as a nested directory, yielding three
              # sibling folders all titled "Platform".
              # Making this work needs the provisioned dashboards deleted so they
              # are re-created in the right folder, and the "/" dropped from the
              # annotation values. Left as a follow-up rather than done here --
              # it is cosmetic, and a dashboard wipe is not a pre-demo change.
              # ALL (not just this release's own `monitoring` namespace): lets
              # the sidecar also pick up the OFFICIAL dashboards baked into the
              # cilium Helm chart itself (dashboards.enabled / operator.
              # dashboards.enabled / hubble.metrics.dashboards.enabled —
              # clusters/real-talos/cilium-metrics-values.yaml), which land in
              # `kube-system` (Cilium's install namespace), not `monitoring`.
              searchNamespace: ALL
          # Traefik ingress, wildcard TLS via the default TLSStore (no secretName) —
          # identical pattern to harbor/process/argocd/dex.
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - grafana.capstone.uamishub.com
            tls:
              - hosts:
                  - grafana.capstone.uamishub.com
          # Wire Loki (platform-loki) as a log datasource so logs + metrics live in
          # one Grafana. Prometheus is auto-added by the chart.
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
            # Tempo (platform-services/monitoring/tempo.yaml, raw manifests) — trace
            # datasource. Traces arrive via the OTel Collector
            # (applicationsets/otel-collector-app.yaml); nothing writes to Tempo
            # directly.
            - name: Tempo
              type: tempo
              access: proxy
              url: http://tempo.monitoring.svc.cluster.local:3200
            # Thanos Query (platform-services/monitoring/thanos.yaml) — a SECOND,
            # ADDITIONAL Prometheus-compatible datasource (the default "Prometheus"
            # datasource this chart auto-adds is untouched, and every existing
            # dashboard's `${datasource}` variable still defaults to it). Pick
            # "Thanos" instead when a query needs data older than the 7d local
            # Prometheus retention above — Thanos Query merges live data straight
            # from the Prometheus sidecar with historical blocks from the Store
            # Gateway (dr-backup MinIO bucket).
            - name: Thanos
              type: prometheus
              access: proxy
              url: http://thanos-query.monitoring.svc.cluster.local:10902

        kube-state-metrics:
          # Resource-reclaim (VPA-driven, task follow-up): actual usage (`kubectl
          # top`) is ~1m cpu / ~75Mi mem, already brushing the old 64Mi request —
          # bumping memory to actual + ~15% headroom; cpu comes down.
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 192Mi }

        prometheus-node-exporter:
          # Resource-reclaim (VPA-driven, task follow-up): actual usage across all 6
          # node pods is ~25-33Mi (`kubectl top`) — the 100Mi VPA target is the
          # recommender's short-history floor, not real signal; small headroom bump
          # over observed max, cpu comes down.
          resources:
            requests: { cpu: 20m, memory: 40Mi }
            limits: { memory: 80Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Sync-deadlock fix (#127): this app CREATES the `monitoring` ns itself so it no
      # longer waits on platform-svc-monitoring (which couldn't sync until these CRDs
      # existed → ns was never created → both stuck). platform-services/monitoring/
      # still ships a tracked Namespace manifest (the declarative GitOps owner); this
      # is a create-if-missing bootstrap convenience, not managedNamespaceMetadata, so
      # there is no field-manager/ownership conflict between the two.
      - CreateNamespace=true       # owns the monitoring ns (was false → deadlock)
      - ServerSideApply=true       # large prometheus-operator CRDs
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
