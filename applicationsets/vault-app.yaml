# HashiCorp Vault Application (ADR-030 model B1 — the secrets store behind ESO).
# Raft integrated storage on a persistent Ceph PVC, TLS on the listener. Helm-source
# Application, deploy method A (D-028): pinned chart + the chart repo added to the
# `platform` AppProject sourceRepos allowlist (bootstrap/platform-appproject.yaml in
# this PR; security audits the addition).
#
# Chart: hashicorp/vault 0.33.0 (appVersion Vault 1.21.2 — pinned to the chart's
# tested image rather than the chart-default; bump deliberately).
# Root-app recurses applicationsets/, so this Application is registered.
#
# =============================================================================
# ⚠⚠⚠  TWO DECISIONS THE HUMAN MUST READ  ⚠⚠⚠  (full writeup: vault/README.md §A, §B)
# =============================================================================
#
# (B) TOPOLOGY — 3-NODE RAFT HA (ha.replicas: 3) is configured here (upgraded from
#   the prior single-node topology; see git history for the old ha.replicas: 1
#   rationale). WHY: single-node Raft had NO Vault-process HA — a single pod down
#   paused secret sync platform-wide until it rescheduled. 3-node Raft gives real
#   quorum: the cluster tolerates ONE node/pod loss (of 3 control-plane OptiPlex
#   nodes) with zero interruption to secret sync (an active leader is always
#   reachable via the `vault-active` Service, ESO/Backstage/Crossplane never see a
#   gap). Each replica still persists to its OWN replica-3 Ceph RBD PVC (a node
#   loss is doubly survivable — Raft quorum on the other two AND the PVC
#   reattaches if the pod reschedules). Hard pod anti-affinity (`server.affinity`
#   below) pins one Vault pod per node — required so a single node loss can never
#   take out 2-of-3 (which would lose quorum).
#   TRADEOFF vs single-node: 3x the pods/PVCs/unseal actions (transit auto-unseal
#   still means NO manual Shamir typing per pod — see decision A — but the
#   operator DOES do a one-time `vault operator raft join` per new follower; see
#   the ROLLOUT runbook, artifacts/design/vault-dr-runbook.md §G). Re-init is NOT
#   needed for this change — it is a pure scale-up of the existing single-node
#   Raft cluster (vault-0 keeps its data; vault-1/vault-2 join it empty and
#   replicate from it). Flagged for the human in vault/README.md §B.
#
# (A) UNSEAL STRATEGY — TRANSIT AUTO-UNSEAL (now WIRED, Track-2 DR). Vault boots
#   SEALED and re-seals on every pod restart (reboot, image bump, node drain, OOM).
#   There is NO cloud KMS on Talos. The chosen strategy (vault/README.md §A option 2)
#   is Transit auto-unseal against the tiny second `platform-vault-unsealer` Vault
#   (applicationsets/vault-unsealer-app.yaml) — so this main Vault SELF-unseals on
#   restart instead of needing a human to type 3 Shamir shares. The `seal "transit"`
#   stanza is ACTIVE in the raft config below; the unseal token is injected via
#   server.extraSecretEnvironmentVars -> VAULT_TOKEN (NOT inline — no secret in git).
#
#   ⚠⚠⚠ ORDERING — DO NOT merge+sync this change until ALL of the following exist,
#   or the main Vault pod will restart into a config it cannot satisfy and go DOWN:
#     1. platform-vault-unsealer is live + manually inited/unsealed, transit engine
#        enabled, `autounseal` key created, auto-unseal token minted;
#     2. Secret  vault-transit-unseal-token  (key: token)  in the vault ns;
#     3. Secret  vault-unsealer-ca           (key: ca.crt) in the vault ns;
#     4. you are ready to run the one-time `vault operator unseal -migrate` (Shamir
#        -> Transit) ceremony immediately after the sync.
#   FULL keyboard runbook: artifacts/design/vault-dr-runbook.md.
#
#   ⚠⚠⚠ SEPARATE ORDERING — the 3-NODE HA rollout (decision B, this PR) is its own
#   sequenced runbook (artifacts/design/vault-dr-runbook.md §G): sync this change,
#   then `vault operator raft join` vault-1 and vault-2 (in that order) against
#   vault-0, verify each auto-unseals via transit (no Shamir typing needed for the
#   MAIN Vault — only the unsealer stays manual, decision A), then confirm 3/3
#   voters via `vault operator raft list-peers`. Do this ONLY after decision A is
#   already live (transit auto-unseal proven working on the single node) — do not
#   combine the Shamir->Transit migration and the HA scale-up in the same sync.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-vault
  namespace: argocd
  labels:
    platform.capstone/component: platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # Vault before ESO (external-secrets-app = wave 1)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://helm.releases.hashicorp.com   # PINNED chart repo (sourceRepos allowlist)
    chart: vault
    targetRevision: 0.33.0                          # pinned chart version (appVersion 1.21.2); no ^/~/latest
    helm:
      releaseName: vault
      values: |
        # --- TLS ON the listener. The server cert lives in the `vault-server-tls`
        #     Secret (built by the human runbook, vault/README.md §C — a SAN-correct
        #     self-signed/CA cert for the in-cluster vault svc names). Public TLS is
        #     NOT relevant: Vault has no public ingress — only ESO (in-cluster) and
        #     the human (via `kubectl port-forward`) talk to it. ESO trusts this cert
        #     via the caBundle on the ClusterSecretStore.
        global:
          tlsDisable: false

        # --- Agent Injector OFF. We use ESO (the ExternalSecret pull model), not the
        #     Vault Agent sidecar injection model — running both is redundant. ESO is
        #     the single integration path (ADR-030 B1).
        injector:
          enabled: false

        server:
          # Pin the Vault image to the chart's tested appVersion (no floating tag).
          image:
            repository: hashicorp/vault
            tag: "1.21.2"

          # --- Persistence: Raft data on a Ceph RBD PVC (the cluster default SC,
          #     replica-3 — survives a node loss; same SC Harbor uses). 5Gi is ample
          #     for KV metadata + raft snapshots at capstone scale.
          dataStorage:
            enabled: true
            size: 5Gi
            storageClass: ceph-block
            accessMode: ReadWriteOnce
          # Audit log on its own PVC (Vault audit device written by the runbook).
          auditStorage:
            enabled: true
            size: 2Gi
            storageClass: ceph-block
            accessMode: ReadWriteOnce
          # Keep the data PVC if the StatefulSet is deleted/scaled (Raft state +
          # the unseal keys' encrypted blob live here — losing it = unrecoverable).
          persistentVolumeClaimRetentionPolicy:
            whenDeleted: Retain
            whenScaled: Retain

          # --- Mount the server-cert Secret into the pod (referenced by the raft
          #     config tls_cert_file/tls_key_file paths below), plus the unsealer's
          #     CA (so the seal "transit" TLS connection to the unsealer verifies —
          #     tls_skip_verify=false). vault-unsealer-ca holds ca.crt; created by the
          #     runbook (artifacts/design/vault-dr-runbook.md §C), NOT in git.
          extraVolumes:
            - type: secret
              name: vault-server-tls
            - type: secret
              name: vault-unsealer-ca

          # --- AUTO-UNSEAL token: injected as VAULT_TOKEN from the Secret
          #     vault-transit-unseal-token (key: token), created by the runbook (§C).
          #     The seal "transit" stanza reads VAULT_TOKEN when `token` is omitted
          #     from the stanza — so no token ever lands in git.
          extraSecretEnvironmentVars:
            - envName: VAULT_TOKEN
              secretName: vault-transit-unseal-token
              secretKey: token

          # --- HA Raft, 3-NODE (decision B above). Raft storage engine, 3
          #     replicas/voters — tolerates one node/pod loss with zero secret-sync
          #     interruption. setNodeId gives each pod a stable raft node id
          #     (vault-0/vault-1/vault-2). Each pod still gets its OWN Ceph PVC
          #     (dataStorage above is per-replica via the StatefulSet volumeClaim
          #     template), so a node loss is doubly survivable (Raft quorum on the
          #     other two AND the PVC reattaches if the pod reschedules).
          #     NOTE: no `retry_join` stanza — new followers join the cluster via a
          #     one-time, operator-run `vault operator raft join` (manual, matching
          #     the existing snapshot/policy runbooks' style: explicit + auditable
          #     over auto-discovery magic). See the ROLLOUT runbook,
          #     artifacts/design/vault-dr-runbook.md §G, for the join order.
          ha:
            enabled: true
            replicas: 3
            raft:
              enabled: true
              setNodeId: true
              # TLS listener (tls on). cluster_address = raft peer port (8201).
              config: |
                ui = true

                listener "tcp" {
                  address         = "[::]:8200"
                  cluster_address = "[::]:8201"
                  tls_cert_file   = "/vault/userconfig/vault-server-tls/tls.crt"
                  tls_key_file    = "/vault/userconfig/vault-server-tls/tls.key"
                }

                storage "raft" {
                  path = "/vault/data"
                }

                service_registration "kubernetes" {}

                # --- AUTO-UNSEAL (decision A): Transit auto-unseal against the
                #     platform-vault-unsealer Vault. `token` is intentionally OMITTED
                #     here — Vault reads it from the VAULT_TOKEN env injected via
                #     server.extraSecretEnvironmentVars (Secret vault-transit-unseal-
                #     token), so no secret material is committed. tls_ca_cert verifies
                #     the unsealer's server cert (tls_skip_verify=false). See the
                #     ORDERING warning in the header + artifacts/design/vault-dr-runbook.md.
                seal "transit" {
                  address         = "https://vault-unsealer.vault-unsealer.svc:8200"
                  disable_renewal = "false"
                  key_name        = "autounseal"
                  mount_path      = "transit/"
                  tls_ca_cert     = "/vault/userconfig/vault-unsealer-ca/ca.crt"
                  tls_skip_verify = "false"
                }

          # --- ANTI-AFFINITY (decision B): HARD requirement — one Vault server pod
          #     per node. There are exactly 3 control-plane OptiPlex nodes and 3
          #     replicas; without this, the scheduler could legally stack 2 (or 3)
          #     Vault pods on the SAME node, so a single node loss could take out a
          #     raft QUORUM majority instead of just one voter. This is also the
          #     chart's own default `server.affinity` — made EXPLICIT here (rather
          #     than relying on the chart default) so the anti-affinity guarantee is
          #     visible in git and survives a future chart default change.
          #
          # --- NOISY-NEIGHBOR (scheduling-hardening PR, post SEC-011-adjacent
          #     incident): a cilium policy-recalc loop saturated mac-debian-01,
          #     which happened to be running the raft LEADER (vault-0) *and*
          #     Prometheus (kube-prometheus-stack, ~469m CPU / 2.6GB RAM,
          #     fsync-heavy TSDB on the same Ceph RBD path) at once — raft
          #     snapshots stalled 2s -> 23min and ESO logins timed out. The 3 Vault
          #     server pods already get one-per-node via the hard rule above.
          #     (SUPERSEDED detail: this note previously said the eligible nodes were
          #     3 Mac-Mini-class workers, so "each Mac Mini hosts exactly one Vault
          #     pod". That is no longer true and was itself part of the board #199
          #     regression — pod anti-affinity only guarantees DIFFERENT hosts, never
          #     WHICH hosts, so Vault drifted onto the Tailscale-addressed workers.
          #     The nodeAffinity below now pins the eligible set to the 3 control-
          #     plane nodes; see kube-prometheus-stack-app.yaml and
          #     platform-services/cnpg/cluster/cluster.yaml for the matching
          #     Prometheus-side and CNPG-side rules). This SOFT (preferred) term
          #     adds the other half: steer Vault itself away from any node already
          #     running Prometheus, so the guarantee holds regardless of which
          #     workload reschedules first (e.g. a future Vault pod restart landing
          #     on Prometheus's node). Preferred, not required — Vault's raft quorum
          #     must never wedge on a soft placement preference for an unrelated
          #     workload; see artifacts/design/scheduling-hardening-runbook.md for
          #     the full rationale
          #     and the safe apply order (Prometheus moves first; Vault is NOT
          #     force-failed-over by this change).
          # --- NODE AFFINITY (board #199 — raft instability root cause). HARD
          #     requirement: all 3 Vault server pods run on the 3 control-plane
          #     OptiPlex nodes (capstone-n1/n2/n3).
          #
          #     WHY THIS EXISTS. Cilium runs in TUNNEL mode (routing-mode: tunnel,
          #     tunnel-protocol: vxlan), so every pod-to-pod packet is VXLAN-
          #     encapsulated to the DESTINATION NODE'S InternalIP. The two Debian
          #     workers advertise a TAILSCALE InternalIP (capstone-w1
          #     100.114.190.45, capstone-w2 100.81.94.114) while the control-plane
          #     nodes advertise LAN addresses (10.237.171.0/24). So the moment a
          #     Vault pod lands on w1/w2, its raft peer traffic is forced through
          #     the tailscale0 WireGuard tunnel (MTU 1280) instead of the physical
          #     LAN (MTU 1500) — even though w1/w2 sit on that same LAN (w1 is
          #     10.237.171.22 on eno2).
          #
          #     That path loses packets in BURSTS — and the burst shape is the
          #     whole story. tailscale0 carries tens of millions of tx_dropped on
          #     every node (w1 45.9M, w2 51.0M, n1 88.4M) while the LAN NICs show
          #     ~0, and the qdisc reports `dropped 0` (loss is at the TUN device,
          #     NOT qdisc congestion). Crucially, 42 of 45 burst-minutes are
          #     confined to a SINGLE node while ~4 other nodes are actively
          #     carrying tailscale0 traffic and dropping nothing, at a rate that
          #     clusters tightly at ~1500/s wherever it lands. A lossy shared
          #     tunnel would drop across all participants in proportion to
          #     traffic; this is a LOCAL per-node bulk discard (~100-180k packets
          #     at once) — tailscaled dumping queued packets for a peer whose
          #     path it is re-electing. Peers are DIRECT (not DERP-relayed) and
          #     their endpoints oscillate between each peer's LAN IPv4 address
          #     and its public IPv6 GUA many times per hour, all night.
          #     Measured correlation: 15 of 15 raft "failed to contact" episodes
          #     coincided with a tailscale0 drop burst — median peak 1613 drops/s
          #     at the events vs 2.2 drops/s away from them (7% control base
          #     rate). Over 24h vault-2 logged 71 contact-losses (vault-1 43,
          #     vault-0 28 — the predicted asymmetry, since w1<->w2 crosses
          #     Tailscale in BOTH directions and w1<->n1 only on the return leg).
          #     Only ~6 escalate to elections; the rest recover inside the 5s
          #     heartbeat timeout, so the election count badly under-reports the
          #     fault. Tenant-visible as ESO/Crossplane `context deadline
          #     exceeded`, CI push 401s and ImagePullBackOff.
          #
          #     NOT the cause, checked: the tun MTU 1280 vs negotiated path
          #     mtu=1360 is 80 bytes of HEADROOM, not a shortfall. The real MTU
          #     interaction is Cilium's own — pod MTU 1280 + 50B VXLAN = 1330B
          #     handed to a 1280B device — and cilium_vxlan has DF UNSET, so
          #     those FRAGMENT rather than black-hole. That doubles packet count
          #     here and makes each datagram die if either fragment is lost,
          #     amplifying every re-pin discard. Aggravator, not cause.
          #
          #     Pinning to the control plane puts the whole raft mesh back on the
          #     LAN: n1<->n2<->n3 are all `dev enp0s31f6`/`dev eno2` (verified with
          #     `ip route get`), zero Tailscale hops, MTU 1500.
          #
          #     WHY THE FLAPPING CANNOT FOLLOW VAULT HERE. tailscaled on
          #     n1/n2/n3 flaps too — those nodes show drop bursts as well. It is
          #     structurally irrelevant: `ip rule` sends all traffic through
          #     `lookup 52` first, and table 52 holds ONLY 100.x/32 host routes
          #     (verified on n1, n2, n3 AND w1 — no LAN prefix, no pod CIDR), so
          #     10.237.171.0/24 misses it and falls through to `main` and the LAN
          #     NIC. Cilium encapsulates to the destination node's InternalIP;
          #     for the control-plane nodes that is a LAN address, so their
          #     pod-to-pod traffic NEVER enters tailscale0 and tailscaled's
          #     endpoint election cannot touch it.
          #
          #     REGRESSION RISK (name it): this fix depends on n1/n2/n3 keeping
          #     LAN addresses as their kubelet InternalIP. If a control-plane node
          #     is ever re-registered with its Tailscale IP — exactly what was
          #     done to w1/w2, and how this bug was born — raft silently returns
          #     to the WireGuard path with nothing here to warn you.
          #
          #     SAFE TO REQUIRE: the control-plane taint is PreferNoSchedule (NOT
          #     NoSchedule), so no toleration is needed — vault-0 already runs on
          #     capstone-n1 today with no special toleration. Headroom checked:
          #     n2 30% CPU / 36% mem, n3 29% / 39%.
          #
          #     NOTE: this does NOT fix the underlying Tailscale/overlay loss, which
          #     still degrades every other cross-node workload on w1/w2. It removes
          #     Vault's raft quorum from that failure domain. The overlay itself is
          #     tracked separately — do NOT close that investigation on the basis of
          #     Vault going quiet.
          affinity: |
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: Exists
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: vault
                      app.kubernetes.io/instance: vault
                      component: server
                  topologyKey: kubernetes.io/hostname
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 80
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: prometheus
                    topologyKey: kubernetes.io/hostname

          # --- HA/active service topology (decision B). The chart's defaults are
          #     already what we want (service.enabled + active.enabled +
          #     standby.enabled default true) — set EXPLICITLY here for auditability:
          #       * `vault`        (this app's releaseName svc, all 3 pods) — what
          #                        ESO/Backstage/Crossplane/the operator already
          #                        target (clustersecretstore.yaml etc., unchanged
          #                        by this PR). Normal Vault API requests (KV
          #                        reads/writes, auth logins) are transparently
          #                        FORWARDED from a standby to the leader, so
          #                        hitting any of the 3 pods works.
          #       * `vault-active` — ONLY the current raft leader (label
          #                        vault-active="true", chart-managed, re-points on
          #                        failover). Required for the small set of
          #                        raft-local ops that do NOT forward — this PR
          #                        repoints the raft-snapshot CronJob's VAULT_ADDR
          #                        at it (see raft-snapshot.yaml).
          #       * `vault-standby` — the two non-leader voters (diagnostics only).
          #       * `vault-internal` (headless, always-on) — raft peer addresses
          #                        (vault-0/1/2.vault-internal), used by
          #                        `vault operator raft join` (see the ROLLOUT
          #                        runbook §G).
          service:
            enabled: true
            active:
              enabled: true
            standby:
              enabled: true

        # --- UI enabled, ClusterIP only (D-043 — NO LoadBalancer on Talos). The
        #     human reaches the UI via `kubectl -n vault port-forward svc/vault 8200`.
        ui:
          enabled: true
          serviceType: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false   # vault ns ships via platform-services/vault
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
