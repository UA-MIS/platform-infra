# Loki Application (Observability, retro #3) — log aggregation behind Grafana.
#
# ⚠ SCOPE — SINGLE-BINARY (monolithic) mode, the anti-gold-plate choice the retro
# called out explicitly. NOT the SSD (read/write/backend) split, NOT the
# microservices mode, NO MinIO/S3 object store, NO memcached caches, NO gateway. One
# StatefulSet, filesystem storage on a Ceph RBD PVC. This is the correct altitude
# for a homelab/student-capstone platform; scale up to SSD mode later if log volume
# ever demands it (a values change, not a re-architecture).
#
# Deploy method A (D-022/D-028): Helm-source Application, chart repo pinned +
# allowlisted in the `platform` AppProject sourceRepos (bootstrap/platform-appproject
# .yaml — INSTALL-OWNED, re-apply via `make bootstrap-reapply`). Root-app recurses
# applicationsets/, so this Application is registered.
#
# Chart: grafana/loki 6.55.0 (appVersion Loki 3.6.7 — TSDB schema v13), pinned.
# Bump deliberately. (The 7.x major exists; 6.55.0 is the mature single-binary path.)
#
# Wiring: Grafana (platform-kube-prometheus-stack) reads logs from this Loki via the
# additionalDataSources entry (http://loki.monitoring.svc.cluster.local:3100). Grafana
# Alloy (applicationsets/alloy-app.yaml) ships pod logs INTO it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-loki
  namespace: argocd
  labels:
    platform.capstone/component: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://grafana.github.io/helm-charts   # PINNED chart repo (sourceRepos allowlist)
    chart: loki
    targetRevision: 6.55.0                            # pinned chart version (appVersion 3.6.7); no ^/~/latest
    helm:
      releaseName: loki
      values: |
        deploymentMode: SingleBinary

        loki:
          # Single-tenant: no X-Scope-OrgID required from Grafana/Alloy.
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          limits_config:
            retention_period: 168h          # 7d — bounded so the PVC can't fill
            allow_structured_metadata: true
            volume_enabled: true
          compactor:
            retention_enabled: true         # actually deletes data past retention_period
            delete_request_store: filesystem
          pattern_ingester:
            enabled: false                  # anti-gold-plate (pattern detection not needed)

        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            storageClass: ceph-block        # replica-3 Ceph RBD (survives node loss)
            accessModes: ["ReadWriteOnce"]
            # OUTAGE 2026-09-21: storage-loki-0 filled at 10Gi and stayed full for
            # ~51 days (1300+ restarts, CrashLoopBackOff on
            # `mkdir /var/loki/tsdb-shipper-active/scratch: no space left on device`).
            # retention_period/compactor above were ALREADY correct (set 2026-07-07)
            # but never had a chance to run: Loki crashes on the disk-full mkdir
            # before the compactor module starts, so retention enforcement never
            # fired — a chicken-and-egg an unlimited retention_period would NOT have
            # fixed. Bumped 10Gi -> 30Gi (3x) for real headroom: the old size held
            # an unknown but clearly >7d backlog (retention never got to trim it),
            # plus the compactor needs scratch space of its own to catch up. Applied
            # live first (`kubectl patch pvc storage-loki-0 ... 30Gi`, ceph-block
            # allowVolumeExpansion:true, confirmed before patching; online expansion,
            # no pod disruption needed beyond the crash-loop's own restarts), THEN
            # this value bumped to match — unlike tempo.yaml's PVC (a raw
            # StatefulSet, where volumeClaimTemplates is immutable post-creation so
            # the git value deliberately stays stale), this is a Helm-chart-rendered
            # StatefulSet: the old `loki` StatefulSet object was deleted with
            # `--cascade=orphan` (keeps the pod/PVC, drops only the controller
            # object) so ArgoCD's next sync recreates it fresh from this 30Gi value
            # with NO immutable-field conflict against the live (already-resized)
            # PVC. A future full-teardown rebuild now reproduces the right size
            # directly. Follow-up: the existing KubePersistentVolumeFillingUp alert
            # (kube-prometheus-stack default) covers this PVC going forward — it is
            # what caught tempo's fill in August — now that Loki's own
            # ServiceMonitor can actually scrape a running pod.
            size: 30Gi
          # Resource-reclaim (VPA-driven, task follow-up): live VPA target for the
          # `loki` container is cpu 63m / mem ~309Mi (+15% headroom below). Memory
          # was UNDER-provisioned (actual usage already at the old 256Mi request);
          # cpu comes down (real, non-floor signal).
          #
          # OUTAGE 2026-09-21 follow-up: raising the PVC unblocked startup, but the
          # first restart after 51 days down OOMKilled (exitCode 137) at the old
          # 576Mi limit — every Alloy agent cluster-wide replayed its buffered
          # backlog into Loki simultaneously, on top of the TSDB index catch-up
          # across ~51 days of uncompacted daily tables. Limit raised 576Mi ->
          # 1536Mi (request 368Mi -> 512Mi) to survive that one-time replay flood;
          # nodes have ample headroom (all <75% mem at the time of this change).
          # Once steady-state ingest resumes this is a candidate to right-size back
          # down via the VPA target above — left at the incident-safe value here
          # rather than re-tightened blind.
          resources:
            requests: { cpu: 80m, memory: 512Mi }
            limits: { memory: 1536Mi }

        # ── Zero out every distributed target + the optional sidecars/caches/store ──
        # so the chart renders ONLY the single-binary StatefulSet (no surprise pods).
        backend: { replicas: 0 }
        read: { replicas: 0 }
        write: { replicas: 0 }
        ingester: { replicas: 0 }
        querier: { replicas: 0 }
        queryFrontend: { replicas: 0 }
        queryScheduler: { replicas: 0 }
        distributor: { replicas: 0 }
        compactor: { replicas: 0 }
        indexGateway: { replicas: 0 }
        bloomPlanner: { replicas: 0 }
        bloomBuilder: { replicas: 0 }
        bloomGateway: { replicas: 0 }
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        minio:
          enabled: false                    # filesystem store, not S3/MinIO
        gateway:
          enabled: false                    # clients hit the loki Service :3100 directly
        test:
          enabled: false
        lokiCanary:
          enabled: false
        # Let Prometheus scrape Loki's own /metrics (the ServiceMonitor CRD comes from
        # kube-prometheus-stack); no self-monitoring grafana-agent sidecar.
        monitoring:
          selfMonitoring:
            enabled: false
            grafanaAgent:
              installOperator: false
          serviceMonitor:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Sync-deadlock fix (#127): create the monitoring ns if missing so Loki doesn't
      # block on the same ns gap that stuck the stack (idempotent create-if-missing;
      # platform-svc-monitoring's namespace.yaml stays the declarative owner).
      - CreateNamespace=true
      # This chart renders a ServiceMonitor (monitoring.serviceMonitor.enabled: true)
      # — a CR of a kube-prometheus-stack CRD. Skip the dry-run so Loki's sync doesn't
      # hard-fail before that CRD registers; retry/selfHeal applies it once it exists.
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
