{{- if and .Values.studentApp (eq (toString .Values.withDatabase) "true") }}
# ExternalSecret — this student's database credentials, materialized from Vault
# (written by the SLIDES app; agents/platform-infra never write secret VALUES —
# see README "Vault: read side vs write side"). Read via the SAME
# platform-wide `vault-backend` ClusterSecretStore every other platform
# service reads through (platform-services/external-secrets/
# clustersecretstore.yaml) — NOT a per-student SecretStore (unlike tenants'
# per-namespace `vault-tenant` isolation): 15 students on a teaching platform is a
# deliberately lower security bar, matching the brief's explicit instruction to
# reuse the existing store rather than stand up per-student Vault roles.
#
# ONLY RENDERED WHEN withDatabase (adversarial review H-1): `hosted` and
# `with_database` are INDEPENDENT columns in slidedeck (server/db.js:56-57;
# scaffold.js: "Stack and database are ORTHOGONAL") — a `hosted: true,
# with_database: false` lab never gets a Vault path written by slides, so
# this object (and the Deployment's matching `envFrom`) must not exist for
# that lab at all, or every pod would sit CreateContainerConfigError forever
# waiting on a Secret that will never materialize.
#
# VAULT PATH NOTATION — THREE CORRECT FORMS, ONE VALUE (adversarial review
# M-6, disambiguating a README inconsistency): the ExternalSecret spec below
# uses the BARE KV-v2 logical path (`labs/<slug>/<user>`, no `secret/` or
# `secret/data/` prefix) — that is the correct form for THIS field
# (`remoteRef.key`), because the ClusterSecretStore already carries
# `spec.provider.vault.path: "secret"` as the mount point, and ESO appends
# `/data` itself for KV-v2 reads. The OTHER two forms are correct in THEIR
# own contexts, not interchangeable with this one: `secret/data/labs/<slug>/
# <user>` is the raw Vault HTTP KV-v2 API path (what `labs-read-role.sh`'s
# policy grants `read` on, and what curl/the Vault Go client would use
# directly); `vault kv patch secret/labs/<slug>/<user> ...` is the Vault
# CLI's own `kv` subcommand form (the CLI's `kv` helper inserts `data`
# itself, same as this field does — so the CLI form and THIS field's bare
# form look almost the same, which is the actual source of the confusion).
#
# CONTRACT (adversarial review C-1/C-3, see README): this remoteRef path uses
# `labSlug`/`username` AFTER chart-side validation (both already lowercase +
# DNS-safe, enforced by `_helpers.tpl`'s fail-guards) — the Vault path slides
# writes to MUST be the lowercased form, or ESO 404s here even though the
# roster/registration data looked fine. The `slides-labs-writer` Vault policy
# (platform-services/external-secrets/vault-policies/slides-labs-writer-role.sh)
# is CREATE/UPDATE/PATCH ONLY — no read-back, no delete; removing a key must be
# a KV-v2 merge-patch `{KEY: null}`, not a `vault kv delete`.
#
# `external-secrets-ro` (the policy bound to the ESO controller's k8s-auth role)
# does NOT cover secret/data/labs/* today — that is an OPERATOR step, see
# platform-services/external-secrets/vault-policies/labs-read-role.sh (drafted,
# not applied by this PR).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-db" (include "lab-app.appName" .) | quote }}
  namespace: {{ include "lab-app.namespace" . | quote }}
  labels:
    {{- include "lab-app.labels" . | nindent 4 }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ printf "%s-db" (include "lab-app.appName" .) | quote }}
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ printf "labs/%s/%s" (include "lab-app.labSlug" .) (include "lab-app.username" .) | quote }}
        property: DATABASE_URL
    - secretKey: DB_HOST
      remoteRef:
        key: {{ printf "labs/%s/%s" (include "lab-app.labSlug" .) (include "lab-app.username" .) | quote }}
        property: DB_HOST
    - secretKey: DB_NAME
      remoteRef:
        key: {{ printf "labs/%s/%s" (include "lab-app.labSlug" .) (include "lab-app.username" .) | quote }}
        property: DB_NAME
    - secretKey: DB_USER
      remoteRef:
        key: {{ printf "labs/%s/%s" (include "lab-app.labSlug" .) (include "lab-app.username" .) | quote }}
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ printf "labs/%s/%s" (include "lab-app.labSlug" .) (include "lab-app.username" .) | quote }}
        property: DB_PASSWORD
{{- end }}
