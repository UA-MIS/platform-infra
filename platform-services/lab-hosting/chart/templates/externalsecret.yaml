{{- if .Values.studentApp }}
# ExternalSecret — this student's database credentials, materialized from Vault
# `secret/labs/<labSlug>/<username>` (written by the SLIDES app; agents/platform-
# infra never write secret VALUES — see README "Vault: read side vs write side").
# Read via the SAME platform-wide `vault-backend` ClusterSecretStore every other
# platform service reads through (platform-services/external-secrets/
# clustersecretstore.yaml) — NOT a per-student SecretStore (unlike tenants'
# per-namespace `vault-tenant` isolation): 15 students on a teaching platform is a
# deliberately lower security bar, matching the brief's explicit instruction to
# reuse the existing store rather than stand up per-student Vault roles.
#
# `external-secrets-ro` (the policy bound to the ESO controller's k8s-auth role)
# does NOT cover secret/data/labs/* today — that is an OPERATOR step, see
# platform-services/external-secrets/vault-policies/labs-read-role.sh (drafted,
# not applied by this PR).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "lab-app.appName" . }}-db
  namespace: {{ include "lab-app.namespace" . }}
  labels:
    {{- include "lab-app.labels" . | nindent 4 }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ include "lab-app.appName" . }}-db
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: labs/{{ .Values.labSlug }}/{{ include "lab-app.username" . }}
        property: DATABASE_URL
    - secretKey: DB_HOST
      remoteRef:
        key: labs/{{ .Values.labSlug }}/{{ include "lab-app.username" . }}
        property: DB_HOST
    - secretKey: DB_NAME
      remoteRef:
        key: labs/{{ .Values.labSlug }}/{{ include "lab-app.username" . }}
        property: DB_NAME
    - secretKey: DB_USER
      remoteRef:
        key: labs/{{ .Values.labSlug }}/{{ include "lab-app.username" . }}
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: labs/{{ .Values.labSlug }}/{{ include "lab-app.username" . }}
        property: DB_PASSWORD
{{- end }}
