{{- if .Values.namespaceBootstrap }}
# One Namespace + ResourceQuota + LimitRange + baseline NetworkPolicies per lab
# (shared by every student of that lab — see README "Two ApplicationSets, not
# one" for why this is a SEPARATE Application from the per-student apps: sharing
# these objects across N per-student Applications would make ArgoCD fight itself
# over ownership of one shared object, the exact anti-pattern the tenants-appset
# avoids by giving each tenant its own bootstrap Application).
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "lab-app.namespace" . | quote }}
  labels:
    app.kubernetes.io/managed-by: argocd
    {{- include "lab-app.labels" . | nindent 4 }}
    # Goldilocks recommend-only sizing (never evicts) — same posture as tenant
    # namespaces (tenants/_template/namespaces/dev.yaml).
    goldilocks.fairwinds.com/enabled: "true"
    # Pod Security Admission enforced cluster-side, same as every tenant namespace.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.31
---
# ResourceQuota — starting values for a WHOLE LAB (all ~15 students share this
# namespace), sized well below the tenant-dev quota (tenants/_template) since a
# lab app is a single small student workload, not a multi-component tenant stack.
# Tunable per lab later (values.yaml).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: {{ include "lab-app.namespace" . | quote }}
  labels:
    {{- include "lab-app.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ .Values.quota.requestsCpu | quote }}
    requests.memory: {{ .Values.quota.requestsMemory | quote }}
    limits.cpu: {{ .Values.quota.limitsCpu | quote }}
    limits.memory: {{ .Values.quota.limitsMemory | quote }}
    pods: {{ .Values.quota.pods | quote }}
    services: {{ .Values.quota.services | quote }}
    # persistentvolumeclaims pinned to 0 ON PURPOSE: lab apps are deliberately
    # STATELESS (their database lives in the dedicated lab-mariadb instance in ns
    # `slides`, not a per-app PVC). Omitting this line from `hard` would NOT mean
    # "zero PVCs" — an absent ResourceQuota key is unlimited, not zero — so a
    # future lab that genuinely needs a PVC must raise this explicitly, not rely
    # on a silently-open default.
    persistentvolumeclaims: "0"
---
# LimitRange — per-container defaults + ceiling, same purpose as
# tenants/_template (makes the quota enforceable even if a student's Deployment
# omits requests/limits — required anyway by Kyverno `require-limits`, Audit mode).
apiVersion: v1
kind: LimitRange
metadata:
  name: container-limits
  namespace: {{ include "lab-app.namespace" . | quote }}
  labels:
    {{- include "lab-app.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: {{ .Values.limitRange.defaultCpu }}
        memory: {{ .Values.limitRange.defaultMemory }}
      defaultRequest:
        cpu: {{ .Values.limitRange.defaultRequestCpu }}
        memory: {{ .Values.limitRange.defaultRequestMemory }}
      max:
        cpu: {{ .Values.limitRange.maxCpu }}
        memory: {{ .Values.limitRange.maxMemory }}
---
# NetworkPolicy 1/3 — default-deny ingress+egress (mirrors tenants/_template).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ include "lab-app.namespace" . | quote }}
  labels:
    {{- include "lab-app.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# NetworkPolicy 2/3 — ingress from Traefik/cloudflared ONLY. NO oauth2-proxy
# selector anywhere (design decision: lab apps are public, like
# demos.uamishub.com — see ingress.yaml for the matching "no gating" note).
#
# ADVERSARIAL REVIEW M-2: the original draft also allowed intra-namespace
# pod-to-pod traffic (`- from: - podSelector: {}`), copied from the tenant
# model where one namespace = one TRUSTED team. Here one namespace =
# `lab-<slug>`, shared by up to 15 MUTUALLY UNTRUSTED students — nothing in
# this chart needs intra-ns traffic (one Deployment/Service per student, no
# sidecars, no shared cache), so allowing it would only give one student's pod
# an unnecessary network path to another's. Removed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-edge
  namespace: {{ include "lab-app.namespace" . | quote }}
  labels:
    {{- include "lab-app.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system } # traefik
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cloudflared }
---
# NetworkPolicy 3/3 — egress: DNS always, PLUS the shared lab-mariadb in ns
# `slides` ONLY IF this lab has withDatabase (adversarial review H-1 — see
# README "Contract: withDatabase"; `lab.yaml`'s canonical value, read
# directly here since namespaceBootstrap mode has a real path back to it,
# unlike studentApp mode — see the duplication note in chart/values.yaml).
# The lab-mariadb instance is the SAME one platform-services/lab-db/
# mariadb.yaml provisions for the browser-only Adminer console — hosted apps
# reach it directly with the DATABASE_URL the ExternalSecret materializes;
# that file's own `lab-mariadb` NetworkPolicy carries the matching INGRESS
# rule for this namespace-label, see platform-services/lab-db/netpol.yaml.
# No general internet egress by default, matching the platform-wide
# least-privilege posture (tenants/_template, slidedeck/deploy/netpol.yaml)
# — a lab exercise that needs outbound internet is a documented follow-up,
# not a default-open here. NO intra-namespace rule — same M-2 reasoning as
# NetworkPolicy 2/3 above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns-and-labdb
  namespace: {{ include "lab-app.namespace" . | quote }}
  labels:
    {{- include "lab-app.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- if eq (toString .Values.withDatabase) "true" }}
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: slides }
      ports:
        - { protocol: TCP, port: 3306 }
    {{- end }}
---
# ExternalSecret — the GHCR image-pull credential, ONE per lab namespace, shared
# by every student app in it (referenced from templates/serviceaccount.yaml's
# `imagePullSecrets`).
#
# WHY THIS EXISTS AT ALL — it REPLACES the "packages are PUBLIC" decision that
# PR #426 shipped (its H-3/M-2). That decision was built on an operator step
# that CANNOT WORK: `gh api -X PATCH /orgs/<org>/packages/container/<name> -f
# visibility=public`. GitHub's REST API for organization packages exposes only
# GET, DELETE and POST .../restore — there is no PATCH verb and no WRITABLE
# `visibility` field on that resource (the GET response does carry a READ-ONLY
# `visibility` enum, so you can observe it but not change it); package
# visibility is a per-package UI setting with no scripted equivalent. Student CI
# pushes from PRIVATE repos, so each package is created PRIVATE and it inherits
# its repo's visibility, and nothing in
# #426's design could ever have flipped it. Every lab pod would have sat in
# ImagePullBackOff forever. Hence: a real pull secret, which is what round 1
# originally wanted before H-3 talked itself out of it.
#
# WHY THIS LANDS HERE (namespaceBootstrap), NOT IN THE STUDENT APPLICATION: the
# credential is IDENTICAL for every student of every lab — one platform-owned
# read-only identity, not per-student data. Rendering it per-student would make
# N Applications all declare the same Secret in the same namespace, which is
# exactly the shared-resource ownership fight "Two ApplicationSets, not one"
# exists to avoid. It is deliberately NOT gated on `withDatabase` (unlike
# templates/externalsecret.yaml) — every lab pulls an image, database or not.
#
# CREDENTIAL: a classic PAT with `read:packages` ONLY, staged by the operator at
# Vault `secret/platform/labs-ghcr-pull` (keys GHCR_USERNAME, GHCR_TOKEN). GHCR
# REQUIRES a classic PAT — GitHub's own docs state Packages "only supports
# authentication using a personal access token (classic)"; fine-grained PATs and
# GitHub App installation tokens are NOT accepted for package auth, so the
# platform's existing fine-grained tokens cannot be reused here.
#
# NO NEW VAULT POLICY IS NEEDED for this path: `external-secrets-ro` (eso-role.sh)
# already grants read on `secret/data/platform/*`, which is why sibling services
# on the same `platform/<name>` convention (platform-services/lab-db/
# externalsecret.yaml -> `platform/lab-db`, slidedeck -> `platform/slidedeck`)
# resolve today with no per-service grant. This is UNLIKE `secret/data/labs/*`
# (the per-student DB creds), which genuinely does need labs-read-role.sh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.ghcr.pullSecretName | quote }}
  namespace: {{ include "lab-app.namespace" . | quote }}
  labels:
    {{- include "lab-app.labels" . | nindent 4 }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.ghcr.pullSecretName | quote }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        # The backtick literals below pass the INNER Go-template tokens through
        # Helm untouched so ESO's own template engine evaluates them against the
        # two fetched keys — the same two-engine escaping technique the tenant
        # harbor-pull ExternalSecret uses (platform-services/crossplane/apis/
        # composition.yaml). `auth` MUST be base64("<username>:<token>"); a
        # malformed dockerconfigjson fails at PULL time with an opaque kubelet
        # error, never at apply time, so this exact rendering is verified by
        # execution (README "Local verification"), not by inspection.
        #
        # `toString | toJson` rather than bare interpolation inside hand-written
        # quotes: toJson EMITS its own surrounding quotes and escapes any `"` or
        # `\` in the value, so a credential containing either cannot silently
        # produce invalid JSON. Not reachable with today's credential (classic
        # PATs are [A-Za-z0-9_], GitHub usernames alphanumeric+hyphen) — this is
        # hardening against a future rotation into a different token format,
        # whose only symptom would otherwise be an opaque ImagePullBackOff. The
        # leading `toString` pins string semantics so the value can never be
        # marshalled as a []byte (which Go would render as base64). `auth` needs
        # no escaping: b64enc output is base64-alphabet only, JSON-safe by
        # construction. Verified available: `toJson`/`toString` are both
        # registered in ESO v2.6.0's VENDORED sprig subset
        # (runtime/template/v2/sprig/functions.go) — ESO does not expose sprig
        # wholesale, so this was checked against the exact running version
        # rather than assumed.
        .dockerconfigjson: |
          {{ `{"auths":{"` }}{{ .Values.ghcr.registry }}{{ `":{"username":{{ .username | toString | toJson }},"password":{{ .token | toString | toJson }},"auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}` }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.ghcr.vaultPath | quote }}
        property: GHCR_USERNAME
    - secretKey: token
      remoteRef:
        key: {{ .Values.ghcr.vaultPath | quote }}
        property: GHCR_TOKEN
{{- end }}
