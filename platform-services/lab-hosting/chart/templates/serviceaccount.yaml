{{- if .Values.studentApp }}
# Dedicated ServiceAccount per student, referenced by deployment.yaml's
# `serviceAccountName` (adversarial review M-3). No RBAC bound to it — its only
# purpose is to NOT be `default`, and to carry `automountServiceAccountToken:
# false` at the Deployment level (belt-and-suspenders; the Pod spec's own
# `automountServiceAccountToken: false` is the one that actually matters, this
# SA existing at all is what lets that be set meaningfully instead of every lab
# pod sharing the namespace's `default` SA).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lab-app.appName" . | quote }}
  namespace: {{ include "lab-app.namespace" . | quote }}
  labels:
    {{- include "lab-app.labels" . | nindent 4 }}
automountServiceAccountToken: false
# GHCR pull credential for this student's private package.
#
# ON THE SERVICEACCOUNT, NOT THE POD SPEC — this repo's established convention:
# every `imagePullSecrets` in platform-infra sits on a ServiceAccount (all ~10
# Backstage scaffolder skeletons' .devops/chart/base/serviceaccount.yaml, whose
# own comment says "Set on the SA (not the pod spec) so it applies to every pod
# using this SA"). There is not one Deployment-pod-spec-level `imagePullSecrets`
# anywhere in this repo. The ServiceAccount admission plugin copies this into
# every Pod this SA creates, so the Deployment needs no change.
#
# Independent of `automountServiceAccountToken: false` above — that governs the
# projected API-server token; pull secrets are resolved by the kubelet at image
# pull time and are unaffected. The SA still grants the pod NO API access.
#
# The referenced Secret is materialized ONCE PER NAMESPACE by the sibling
# namespaceBootstrap Application (templates/namespace-bootstrap.yaml), not here
# — see that file's header for why, and README "Pull: private GHCR packages +
# an image pull secret" for the ordering/race behavior when it has not synced
# yet (best-effort, self-healing — a pod that cannot pull retries).
imagePullSecrets:
  - name: {{ .Values.ghcr.pullSecretName | quote }}
{{- end }}
