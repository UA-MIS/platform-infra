# Per-LAB-NAMESPACE Harbor PULL robot — TEMPLATE, parameterized by __LAB_SLUG__.
# NOT auto-synced (excluded via applicationsets/platform-services-appset.yaml,
# same as platform-services/harbor-onboarding/onboard-team-job.yaml) — this is an
# imperative, operator-run step, applied once per NEW hosted lab. See
# platform-services/lab-hosting/README.md "Harbor" for the full sequence
# (project creation -> this -> reseal into `lab-<slug>`).
#
# WHY A ROBOT PER LAB NAMESPACE (not one shared robot resealed everywhere): the
# generic `make harbor-robot NAME=<name> ENV=<env>` target names the robot
# `<name>-pull` — reusing NAME=labs for a second lab namespace would try to
# create a SECOND robot with the SAME name in the SAME Harbor project (robot
# names are unique per project) and 409. Minting `labs-pull-<lab_slug>` per lab
# sidesteps that, and mirrors the platform's existing convention of minting
# fresh per onboarding unit rather than asking the operator to retain and
# re-seal a plaintext credential between sessions (harbor-robot mints fresh per
# ENV for the exact same reason).
#
# Mirrors onboard-team-job.yaml / the harbor-robot Makefile target's in-cluster
# curl pattern (admin creds read via secretKeyRef, never leave the cluster) —
# admin-authenticated, so the provider-harbor "effect" subset-check gotcha
# (docs/operator/harbor-provisioner-robot-effect-fix.md, robot-CREATES-robot
# only) does not apply here.
#
# Usage (operator, after `make harbor-onboard NAME=labs` has created the shared
# `labs` Harbor project — see README):
#   sed 's/__LAB_SLUG__/lab1/g' labs-pull-robot-job.yaml \
#     | kubectl --context admin@capstone apply -f -
#   kubectl --context admin@capstone -n harbor wait --for=condition=complete \
#     --timeout=120s job/labs-pull-robot-lab1
#   json=$(kubectl --context admin@capstone -n harbor logs job/labs-pull-robot-lab1)
#   # parse {name,secret} from $json, then:
#   kubectl create secret docker-registry labs-pull \
#     --docker-server=harbor.capstone.uamishub.com \
#     --docker-username="<name from $json>" --docker-password="<secret from $json>" \
#     -n lab-lab1 --dry-run=client -o yaml \
#     | kubeseal --controller-namespace kube-system \
#         --controller-name sealed-secrets-controller \
#         --namespace lab-lab1 --format yaml \
#     > platform-services/lab-hosting/harbor/sealedsecret-pull-lab1.yaml
#   # git add + commit that file, and add it as a `resources:` entry rendered
#   # alongside the lab's namespace bootstrap — see README "Harbor" for the
#   # exact landing spot (a kustomization the labs-namespace Application's
#   # source also includes, or a tiny per-lab Application; TBD at the operator's
#   # first real onboarding, since v1 has zero hosted labs to onboard yet).
apiVersion: batch/v1
kind: Job
metadata:
  name: labs-pull-robot-__LAB_SLUG__
  namespace: harbor
  labels:
    platform.capstone/component: lab
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        platform.capstone/component: lab
    spec:
      restartPolicy: Never
      volumes:
        - name: tmp
          emptyDir: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: robot
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: HARBOR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-admin
                  key: HARBOR_ADMIN_PASSWORD
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              CORE="http://harbor-core.harbor.svc:80"; AUTH="admin:$HARBOR_ADMIN_PASSWORD"
              echo "==> creating pull robot 'labs-pull-__LAB_SLUG__' scoped to project 'labs' ..."
              code=$(curl -sS -u "$AUTH" -o /tmp/r.out -w '%{http_code}' \
                -X POST "$CORE/api/v2.0/robots" -H 'Content-Type: application/json' \
                -d '{"name":"labs-pull-__LAB_SLUG__","duration":-1,"level":"project","description":"pull-only, lab namespace lab-__LAB_SLUG__","permissions":[{"kind":"project","namespace":"labs","access":[{"resource":"repository","action":"pull"}]}]}')
              case "$code" in
                201) cat /tmp/r.out ;;
                *)   echo "FAIL: create robot HTTP $code"; cat /tmp/r.out; exit 1 ;;
              esac
