# platform-services/npm-mirror — in-cluster npm registry mirror (Verdaccio), the
# npm equivalent of platform-services/harbor-dockerhub-proxy for images. Picked up
# by the platform-services directory-generator ApplicationSet
# (applicationsets/platform-services-appset.yaml) as `platform-svc-npm-mirror` —
# no new Application file needed. See README.md for design/degradation notes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - statefulset.yaml
  - netpol.yaml

labels:
  - pairs:
      platform.capstone/component: platform
    includeSelectors: false
