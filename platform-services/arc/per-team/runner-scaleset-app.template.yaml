# PER-TEAM ARC runner scale set (retro #4). TEMPLATE: literal `__TEAM__` tokens —
# NOT a synced manifest. Render per onboarded team and commit into applicationsets/
# (or let the M4 scaffolder / track-5 Crossplane Composition emit it).
#
# WHY one scale set per team (not one org-wide set): the container hook cannot select
# a secret per job, so per-team push isolation = per-team scale set, each with its own
# hook-template ConfigMap (per-team/hook-template.template.yaml) → its own
# `harbor-push-__TEAM__` secret. `runs-on: __TEAM__-kaniko` selects this set.
#
# A1 (this template — shared `arc-runners` ns): all per-team scale sets live in
# arc-runners and SHARE the existing `arc-github-app` SealedSecret, `platform-ca`
# ConfigMap, and runner NetworkPolicy. Solves last-write-wins + concurrency with the
# least new wiring. Residual: a runner SA in the shared ns can, in principle, read a
# sibling team's harbor-push-<other> Secret. To close that (A2) move each team to its
# own `arc-__TEAM__` ns (then the runner SA is ns-confined) — see per-team/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-arc-runner-__TEAM__
  namespace: argocd
  labels:
    platform.capstone/component: platform
    platform.capstone/team: __TEAM__
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # after the controller CRDs (wave 0)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.2               # pinned (match the controller chart)
    helm:
      # releaseName == the runs-on label the team's workflow selects.
      releaseName: __TEAM__-kaniko
      values: |
        githubConfigUrl: "https://github.com/UA-MIS"
        githubConfigSecret: arc-github-app   # SHARED SealedSecret in arc-runners (A1)
        controllerServiceAccount:
          name: arc-gha-rs-controller
          namespace: arc-system
        minRunners: 0
        # maxRunners = OPERATOR-QUEUE lever: jobs beyond it wait "Waiting for a runner"
        # IN GitHub Actions (no pod → no OOM). Mirrors the LIVE per-tenant value rendered
        # by the Crossplane composition (platform-services/crossplane/apis/composition.yaml,
        # the actual source of truth for onboarded tenants — this file is the manual-render
        # fallback per per-team/README.md) — raised 3→8 there 2026-08-25 (owner-approved,
        # cluster now 80 vCPU / ~216GiB across 5 nodes). Keep this in sync if hand-rendering
        # a team that predates the Crossplane composition path.
        maxRunners: 8
        containerMode:
          type: "kubernetes"
          kubernetesModeWorkVolumeClaim:
            accessModes: ["ReadWriteOnce"]
            storageClassName: "ceph-block"
            resources:
              requests:
                storage: "5Gi"
        template:
          spec:
            # CI build priority: co-equal, never-preempt (see the shared scale set +
            # platform-services/arc/priorityclass-ci-build.yaml). Builds wait for room,
            # never evict a running workload.
            priorityClassName: capstone-ci-build
            # Node placement for the RUNNER pod (CI-fast, #237/#372; SOFT TIER). Mirrors
            # the org-wide scale set (applicationsets/arc-runner-scaleset-app.yaml) and
            # the build step-pod placement in per-team/hook-template.template.yaml: SOFT,
            # RAM-aware tier bias (laptop-01, matched directly by ci-build=true → any
            # other build-pool node e.g. ua-mis-db-1 → OptiPlex) fenced by a HARD candidate
            # SET that EXCLUDES the 8GiB Mac workers. Uses only labels that exist live →
            # applies on the next ArgoCD sync, no `kubectl label` step.
            tolerations:
              - key: capstone.io/control-plane
                operator: Equal
                value: "true"
                effect: PreferNoSchedule
              # DEDICATE laptop-01 to CI: tolerate `capstone.io/dedicated=ci-build:NoSchedule`
              # so this per-team RUNNER pod can land on the CI-dedicated node. Mirrors
              # per-team/hook-template.template.yaml; complements #372 affinity.
              - key: capstone.io/dedicated
                operator: Equal
                value: ci-build
                effect: NoSchedule
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - { key: capstone.io/pool, operator: In, values: ["build"] }
                    - matchExpressions:
                        - { key: node-role.kubernetes.io/control-plane, operator: Exists }
                preferredDuringSchedulingIgnoredDuringExecution:
                  # PRIMARY — laptop-01: the DEDICATED CI node, matched directly by its
                  # own label (capstone.io/ci-build=true). Highest weight = top preference.
                  - weight: 100
                    preference:
                      matchExpressions:
                        - { key: capstone.io/ci-build, operator: In, values: ["true"] }
                  # SECONDARY — any OTHER build-pool node (e.g. ua-mis-db-1, the 8GiB
                  # DB/Vault box) that is not the dedicated CI node. Fallback only.
                  - weight: 50
                    preference:
                      matchExpressions:
                        - { key: capstone.io/pool, operator: In, values: ["build"] }
                  # FALLBACK — control-plane OptiPlexes (last resort; tolerated above).
                  - weight: 10
                    preference:
                      matchExpressions:
                        - { key: node-role.kubernetes.io/control-plane, operator: Exists }
            securityContext:
              runAsNonRoot: true
              runAsUser: 1001
              fsGroup: 1001
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:2.335.1
                command: ["/home/runner/run.sh"]
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["ALL"]
                env:
                  # Point the hook at THIS team's template (mounted below) → the build
                  # pod mounts secret harbor-push-__TEAM__ at /kaniko/.docker.
                  - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
                    value: /home/runner/pod-templates/hook-template.yaml
                volumeMounts:
                  - name: hook-template
                    mountPath: /home/runner/pod-templates
                    readOnly: true
                resources:
                  # Mirror the shared scaleset (applicationsets/arc-runner-scaleset-app.yaml):
                  # memory LIMIT 8Gi so a per-team Kaniko build is not OOM-capped; request
                  # kept modest (1Gi) so co-resident build pods fit the smallest pool node.
                  requests: { cpu: "250m", memory: "1Gi" }
                  limits:   { cpu: "2",    memory: "8Gi" }
            volumes:
              # Per-team hook template ConfigMap (per-team/hook-template.template.yaml,
              # rendered → arc-hook-template-__TEAM__).
              - name: hook-template
                configMap:
                  name: arc-hook-template-__TEAM__
                  items:
                    - key: content
                      path: hook-template.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 5m }
