# ARC container-hook extension template (P2.3, §1.3, D-032) — injects the Harbor
# PUSH credential into the BUILD job-step pod ONLY (Option C, the only one that
# works in containerMode:kubernetes).
#
# WHY: in containerMode:kubernetes the workflow build runs in its OWN job-step pod
# (a `container:` step — ARC requires job containers in k8s mode), NOT on the
# runner pod. A volume on the runner pod is invisible to it. The k8s container hook
# MERGES this template's pod-spec patch into every job-step pod it creates, so the
# `harbor-push` Secret lands inside the Kaniko build container at
# /kaniko/.docker/config.json (Kaniko's default DOCKER_CONFIG dir) — the workflow
# needs ZERO cred-handling steps; Kaniko just finds it.
#
# SECURITY (resolves the A-vs-C question in C's favour): the push cred is projected
# ONLY into the build job-step container, NEVER onto the general runner pod — so
# untrusted NON-build workflow steps cannot read it. Combined with the
# least-privilege robot (push to the team's OWN Harbor project only,
# `make harbor-push-robot`) + ephemeral runners, this is the tight option.
#
# `optional: true` so a job container still starts before a team's harbor-push
# Secret is sealed (a build that needs it fails at push with a clear auth error,
# not at pod start). `$job` is the ARC convention for the job-step container.
# Mounted on the runner pod + referenced via ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
# (see applicationsets/arc-runner-scaleset-app.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: arc-hook-template
  namespace: arc-runners
  labels:
    platform.capstone/component: platform
data:
  content: |
    spec:
      # --- Node placement for the KANIKO BUILD pod (CI-fast, #237/#297; BUILD POOL) ---
      # In containerMode:kubernetes the Kaniko build runs HERE (this step pod), NOT on
      # the runner pod — so the build's node placement is governed by THIS template, not
      # arc-runner-scaleset-app.yaml. Was pinned to the single node `ua-mis-db-1` via
      # `capstone.io/ci-build=true` (#297), which bottlenecked the whole CI queue onto
      # one box. Switched to the POOL label `capstone.io/pool=build` (same convention as
      # the Mac fleet's `capstone.io/pool=mac-debian`) so ANY labeled node is a
      # candidate — currently `ua-mis-db-1` (~7.5GiB allocatable) + `laptop-01`
      # (Ryzen 7 8C/16T, ~14GiB allocatable), both memory-hungry-build-capable, more
      # than the OptiPlexes/Macs comfortably spare. nodeSelector is a HARD (required)
      # constraint — this PodSpecPatch is merged verbatim onto the generated step pod's
      # spec (runner-container-hooks' k8s mergePodSpecWithOptions directly assigns
      # top-level fields, no deep-merge) — so it fully pins the build pod to the pool,
      # just no longer to a single member of it. This supersedes the softer
      # control-plane toleration/affinity below (kept as no-ops: neither pool node
      # carries the control-plane taint/label, so they simply don't match anything once
      # nodeSelector narrows the candidate set to the pool). The SAME nodeSelector is
      # mirrored on the runner pod in applicationsets/arc-runner-scaleset-app.yaml —
      # both are needed; this one only moves the heavy Kaniko step pod. laptop-01 is
      # TEMPORARY — un-label it (`kubectl label node laptop-01 capstone.io/pool-`) to
      # fall back to db1-only with no manifest change; nodes are labeled live, there is
      # no git-tracked join automation for either box (see the sibling nodeSelector
      # comment in arc-runner-scaleset-app.yaml for the exact kubectl label commands).
      nodeSelector:
        capstone.io/pool: "build"
      tolerations:
        - key: capstone.io/control-plane
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      # Resolve the Harbor registry host to Traefik IN-CLUSTER so the Kaniko PUSH
      # never traverses the Cloudflare edge (CF Free/Pro caps request bodies at 100MB
      # → a >100MB image layer 413s). The public host externally resolves to the
      # CF-proxied wildcard; this hostAlias points the build pod straight at Traefik's
      # ClusterIP, which terminates the wildcard TLS and routes by SNI to harbor-core.
      # The image ref stays harbor.capstone.uamishub.com (TLS/cert/tags unchanged).
      #
      # ⚠ HARDCODED Traefik ClusterIP (10.97.22.53) — stable unless the traefik Service
      # is recreated. Known debt: the Talos-native CoreDNS split-horizon (backlog item
      # B) retires this hardcode cluster-wide. coredns-custom does NOT work on Talos
      # (k3s *.override import absent) — see platform-services/coredns-custom header.
      # If a build 413s/cannot-resolve harbor, re-check this IP:
      #   kubectl -n kube-system get svc traefik -o jsonpath='{.spec.clusterIP}'
      hostAliases:
        - ip: "10.97.22.53"
          hostnames:
            - harbor.capstone.uamishub.com
      containers:
        - name: "$job"
          # RESOURCE KNOB (OOM fix) — `$job` is the runner-container-hooks placeholder
          # matched against EVERY pod this template patches: both the containerMode:
          # kubernetes job-container pod (prepare-job — e.g. the workflow's `container:
          # image: node:24-trixie` running checkout/resolve) AND each `uses: docker://`
          # container-action step's own pod (run-container-step — e.g. the Kaniko
          # build), confirmed against actions/runner-container-hooks source
          # (mergeContainerWithOptions DIRECTLY OVERWRITES, not deep-merges,
          # unrecognized fields like `resources`). The Kaniko step-pod is the one that
          # actually runs `yarn install` + `tsc` + the filesystem snapshot (~6Gi peak,
          # per the OOM investigation above the executor invocation in
          # backstage-process-build-push.yaml) — it was previously UNSET (no limit at
          # all), letting the in-memory snapshot/cache grow until the node OOM-killed
          # the pod. LIMIT is raised to 8Gi here (6Gi still OOM-killed the larger
          # node_modules build — see PR #329; matches the runner pod's ceiling in
          # arc-runner-scaleset-app.yaml) so that pod can burst to the memory a Backstage
          # yarn+tsc+full-fs-snapshot build peaks at, with headroom (the operator has
          # confirmed RAM is not the constraint). REQUEST is a MODEST 2Gi (not ~4Gi):
          # this same block also sizes the much-lighter job-container pod, and BOTH pods
          # (plus the runner pod) now land on a pool node (nodeSelector below — db1
          # ~7.5Gi allocatable or laptop-01 ~14Gi; the scheduler decides, not guaranteed
          # to spread) and can be co-resident. Worst case all 3 on db1 sums 2Gi + 2Gi +
          # 1Gi = 5Gi of admission requests < db1's ~7.5Gi allocatable, so nothing Pends;
          # a 2Gi request (vs the old 512Mi) also makes this heavy pod a LESS likely
          # kernel-OOM victim under node pressure (protected up to its request). NOTE on
          # db1: an 8Gi LIMIT exceeds db1's ~7.5Gi allocatable, so a build that lands on
          # db1 can never actually reach 8Gi — it is effectively node-capped there and
          # only one heavy build fits at a time; that is acceptable (maxRunners is small,
          # builds are serial in practice, and laptop-01 ~14Gi has full 8Gi headroom).
          # See the matching note in arc-runner-scaleset-app.yaml.
          resources:
            requests: { memory: "2Gi" }
            limits:   { memory: "8Gi" }
          volumeMounts:
            - name: harbor-push
              mountPath: /kaniko/.docker
              readOnly: true
            # Trust the PLATFORM CA so the push VERIFIES Traefik's wildcard cert
            # (the in-cluster registry path serves the cert-manager-issued internal
            # cert, NOT Cloudflare's). Kaniko appends any cert under /kaniko/ssl/certs
            # to its trust store, so TLS verification stays ON (no --skip-tls-verify).
            - name: platform-ca
              mountPath: /kaniko/ssl/certs/platform-ca.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: harbor-push
          secret:
            secretName: harbor-push
            optional: true
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: platform-ca
          configMap:
            name: platform-ca
            optional: true
            items:
              - key: ca.crt
                path: ca.crt
