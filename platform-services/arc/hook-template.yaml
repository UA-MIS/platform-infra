# ARC container-hook extension template (P2.3, §1.3, D-032) — injects the Harbor
# PUSH credential into the BUILD job-step pod ONLY (Option C, the only one that
# works in containerMode:kubernetes).
#
# WHY: in containerMode:kubernetes the workflow build runs in its OWN job-step pod
# (a `container:` step — ARC requires job containers in k8s mode), NOT on the
# runner pod. A volume on the runner pod is invisible to it. The k8s container hook
# MERGES this template's pod-spec patch into every job-step pod it creates, so the
# `harbor-push` Secret lands inside the Kaniko build container at
# /kaniko/.docker/config.json (Kaniko's default DOCKER_CONFIG dir) — the workflow
# needs ZERO cred-handling steps; Kaniko just finds it.
#
# SECURITY (resolves the A-vs-C question in C's favour): the push cred is projected
# ONLY into the build job-step container, NEVER onto the general runner pod — so
# untrusted NON-build workflow steps cannot read it. Combined with the
# least-privilege robot (push to the team's OWN Harbor project only,
# `make harbor-push-robot`) + ephemeral runners, this is the tight option.
#
# `optional: true` so a job container still starts before a team's harbor-push
# Secret is sealed (a build that needs it fails at push with a clear auth error,
# not at pod start). `$job` is the ARC convention for the job-step container.
# Mounted on the runner pod + referenced via ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
# (see applicationsets/arc-runner-scaleset-app.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: arc-hook-template
  namespace: arc-runners
  labels:
    platform.capstone/component: platform
data:
  content: |
    spec:
      # --- Scheduling priority for the KANIKO BUILD pod (queue-not-fail, never-evict) --
      # capstone-ci-build (platform-services/arc/priorityclass-ci-build.yaml): value 0,
      # preemptionPolicy Never. The heavy build pod thus NEVER preempts/evicts a platform
      # pod, and at co-equal priority is never evicted mid-build either → a placed build
      # runs to completion; an unplaceable one WAITS (Pending), never fails another
      # workload to force room. runner-container-hooks merges this template's top-level
      # PodSpec fields verbatim (same path the working nodeSelector/tolerations/affinity/
      # hostAliases ride), so priorityClassName propagates onto the generated step pod.
      # Mirrored on the runner pod in applicationsets/arc-runner-scaleset-app.yaml.
      priorityClassName: capstone-ci-build
      # --- Node placement for the KANIKO BUILD pod (CI-fast, #237/#297/#372; SOFT TIER) ---
      # In containerMode:kubernetes the Kaniko build runs HERE (this step pod), NOT on
      # the runner pod — so the build's node placement is governed by THIS template, not
      # arc-runner-scaleset-app.yaml.
      #
      # HISTORY / WHY THIS CHANGED (#372): was HARD-pinned to one node via
      # `capstone.io/ci-build=true` (#297, bottleneck), then HARD-pinned to the pool via
      # `nodeSelector: capstone.io/pool=build`. But a HARD nodeSelector only matches
      # laptop-01 + ua-mis-db-1 and gives the build NO fallback: with a 4Gi request, when
      # neither pool node can admit it (committed requests + retry-stacking) the kubelet
      # rejects the pod at ADMISSION with `phase=Failed reason=OutOfmemory` and the build
      # dies immediately instead of spilling to a node that fits. FIX: drop the hard
      # nodeSelector for a SOFT, RAM-aware TIER bias (weighted nodeAffinity) fenced by a
      # HARD candidate SET that only excludes nodes too small to build on.
      #
      # ── PROMOTED capstone.io/ci-build=true: PREFERRED → REQUIRED (2026-09-09) ──
      # THIS is the pod that actually runs `RUN npm ci` (and every other Dockerfile
      # instruction) for a tenant build, so its placement is the direct cause of the
      # intermittent `npm ci` ETIMEDOUT / read tcp i/o-timeout failures: capstone-w1's
      # `eno2` NIC negotiates at 100 Mbit (7-9 MB/s measured) vs capstone-w2's 1000 Mbit
      # (25-55 MB/s measured; 55 MB/s / 13ms-connect / 20-parallel-<0.51s to
      # registry.npmjs.org). Under the OLD soft-only preference the scheduler's
      # least-allocated scorer routinely outweighed the weight-100 preference (w1 ~15%
      # mem vs w2 ~36%), so builds landed on w1 often enough to fail confusingly ~half
      # the time. Full rationale + evidence: applicationsets/arc-runner-scaleset-app.yaml.
      # See also docs/operator/debian-worker-onboarding.md §6.1.1.
      #
      # CANDIDATE SET (required, OR of two terms): capstone.io/ci-build=true (TODAY: only
      # capstone-w2 — a LIVE-ONLY label applied by hand, not set by any node manifest in
      # this repo) OR a control-plane OptiPlex (capstone-n1/2/3, ~14.7GiB each — degrade,
      # not die, if the ci-build node is unavailable). Deliberately DROPS bare
      # capstone.io/pool=build from the required set: w1 carries that label too and is
      # exactly the node being excluded. Still excludes the 8GiB Mac workers
      # (capstone.io/pool=mac-debian — too small for a 4Gi/8Gi build).
      #
      # REVERSIBLE: `kubectl label node capstone-w1 capstone.io/ci-build=true --overwrite`
      # once its NIC is fixed is the entire fix — no YAML change needed.
      #
      # ⚠ MUST STAY IN SYNC with the identical affinity block on the RUNNER pod in
      # applicationsets/arc-runner-scaleset-app.yaml, both per-team templates
      # (platform-services/arc/per-team/{hook-template,runner-scaleset-app}.template.yaml),
      # and both blocks rendered by platform-services/crossplane/apis/composition.yaml
      # (live for nextup/curb/ida-llm/motion/mychef/springais). Change ALL together.
      #
      # TIER BIAS (preferred, soft — now only breaks ties WITHIN the required set):
      # ci-build=true (100) → control-plane OptiPlex fallback (10). The old weight-50
      # "any pool=build node" tier is gone: it can never fire once bare pool=build is out
      # of the required set. (⚠ db1, if still part of the pool, is only ~7.5GiB alloc,
      # below the 8Gi LIMIT — it is no longer a placement candidate at all under this
      # required set; re-derive if it needs to come back as a tier.) This PodSpecPatch is
      # merged verbatim onto the step pod (runner-container-hooks' mergePodSpecWithOptions
      # assigns top-level fields, no deep-merge).
      tolerations:
        - key: capstone.io/control-plane
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
        # --- DEDICATE laptop-01 to CI (capacity fix, complements #372's soft affinity) ---
        # laptop-01 (16GiB) is tainted `capstone.io/dedicated=ci-build:NoSchedule` so
        # steady-state platform pods drain OFF and the memory-hungry Kaniko BUILD step pod
        # (8Gi limit) gets the near-full node. This toleration lets the build land on the
        # tainted node; #372's weight-100 "prefer laptop-01" affinity then targets it.
        # Taint applied live by the operator AFTER this toleration is synced (order matters
        # — else builds are repelled too). Undo: `kubectl taint node laptop-01
        # capstone.io/dedicated=ci-build:NoSchedule-`.
        - key: capstone.io/dedicated
          operator: Equal
          value: ci-build
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              # PRIMARY — a node explicitly vetted for CI (fast NIC). TODAY: only
              # capstone-w2. See the comment block above for the reversal step.
              - matchExpressions:
                  - { key: capstone.io/ci-build, operator: In, values: ["true"] }
              # FALLBACK — control-plane OptiPlexes (degrade, don't die).
              - matchExpressions:
                  - { key: node-role.kubernetes.io/control-plane, operator: Exists }
          preferredDuringSchedulingIgnoredDuringExecution:
            # Break ties WITHIN the required set above.
            - weight: 100
              preference:
                matchExpressions:
                  - { key: capstone.io/ci-build, operator: In, values: ["true"] }
            - weight: 10
              preference:
                matchExpressions:
                  - { key: node-role.kubernetes.io/control-plane, operator: Exists }
        # ── SOFT SPREAD across the build pool (node-GUIDED-not-BOUND) ──────────────
        # Prefer to place this build's job/step pod on a pool node that is NOT already
        # anchoring ANOTHER build's runner pod. The runner pods (arc-runner-scaleset-
        # app.yaml) carry `app.kubernetes.io/part-of: gha-runner-scale-set`; one runner
        # pod exists per in-flight build, so avoiding runner pods = avoiding other
        # builds. `preferred` (soft), so with only one pool node free (or on a
        # single-node pool) it never blocks scheduling — it only breaks ties toward the
        # emptier node when both are available, letting the scheduler genuinely load-
        # balance within the pool. topologyKey is per-node; scales to N pool nodes with
        # no edit. (Repulsion from this build's OWN runner is harmless: runner and
        # job/step share no volume, and the RWO `_work` PVC already co-pins job+step.)
        # The 4Gi request below is the HARD backstop against OOM co-packing; this
        # anti-affinity is the SOFT steer that spreads builds when both nodes are free.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/part-of: gha-runner-scale-set
                topologyKey: kubernetes.io/hostname
      # Resolve the Harbor registry host to Traefik IN-CLUSTER so the Kaniko PUSH
      # never traverses the Cloudflare edge (CF Free/Pro caps request bodies at 100MB
      # → a >100MB image layer 413s). The public host externally resolves to the
      # CF-proxied wildcard; this hostAlias points the build pod straight at Traefik's
      # ClusterIP, which terminates the wildcard TLS and routes by SNI to harbor-core.
      # The image ref stays harbor.capstone.uamishub.com (TLS/cert/tags unchanged).
      #
      # ⚠ HARDCODED Traefik ClusterIP (10.97.22.53) — stable unless the traefik Service
      # is recreated. Known debt: the Talos-native CoreDNS split-horizon (backlog item
      # B) retires this hardcode cluster-wide. coredns-custom does NOT work on Talos
      # (k3s *.override import absent) — see platform-services/coredns-custom header.
      # If a build 413s/cannot-resolve harbor, re-check this IP:
      #   kubectl -n kube-system get svc traefik -o jsonpath='{.spec.clusterIP}'
      hostAliases:
        - ip: "10.97.22.53"
          hostnames:
            - harbor.capstone.uamishub.com
      containers:
        - name: "$job"
          # RESOURCE KNOB (OOM fix + anti-co-pack) — `$job` is the runner-container-hooks
          # placeholder matched against EVERY pod this template patches: both the
          # containerMode:kubernetes job-container pod (prepare-job — e.g. the workflow's
          # `container: image: node:24-trixie` running checkout/resolve) AND each
          # `uses: docker://` container-action step's own pod (run-container-step — e.g.
          # the Kaniko build), confirmed against actions/runner-container-hooks source
          # (mergeContainerWithOptions DIRECTLY OVERWRITES, not deep-merges, unrecognized
          # fields like `resources`). The Kaniko step-pod is the one that actually runs
          # `yarn install` + `tsc` + the filesystem snapshot (~6Gi peak, per the OOM
          # investigation above the executor invocation in
          # backstage-process-build-push.yaml). LIMIT stays 8Gi (6Gi still OOM-killed the
          # larger node_modules build — PR #329/#334; matches the runner pod's ceiling in
          # arc-runner-scaleset-app.yaml).
          #
          # ── REQUEST raised 2Gi → 4Gi (node-GUIDED-not-BOUND incident) ──────────────
          # The OOM that triggered this was NOT an under-limit; it was the SCHEDULER
          # OVERPACKING laptop-01. The scheduler admits by REQUEST: at a 2Gi request the
          # job+kaniko pair of a build reserves only ~4Gi, so TWO concurrent builds' heavy
          # pairs (~8Gi of requests) fit on laptop-01's ~11.3Gi build-free memory — the
          # scheduler co-packs them, then BOTH burst toward the 8Gi limit and the kubelet
          # OOM-rejects (observed: "requested 2Gi, used 13.4Gi, capacity 14.7Gi"). Raising
          # the request to 4Gi makes the scheduler reserve real memory so it will NOT admit
          # a second heavy build onto a node already running one:
          #   • The job-container + Kaniko step of ONE build share the RWO `_work` Ceph-RBD
          #     PVC (kubernetesModeWorkVolumeClaim, ReadWriteOnce) → they are PINNED to the
          #     SAME node. Their combined request is 4Gi + 4Gi = 8Gi.
          #   • laptop-01 (~14.72GiB alloc, ~3.4Gi non-build baseline → ~11.3Gi free once
          #     Prometheus is off it, see kube-prometheus-stack-app.yaml): one build's 8Gi
          #     pair fits (≈2.3Gi spare) but a SECOND build's 8Gi pair does not (2.3 < 8) →
          #     the scheduler refuses to co-pack, and the 2nd build spreads to the other
          #     pool node (podAntiAffinity below) or WAITS (Pends) instead of OOMing.
          #   • ua-mis-db-1 (~7.5GiB alloc, and it also hosts backstage/dex/db-tier so
          #     only ~4.5Gi is realistically free) cannot hold an 8Gi pair — so under load
          #     a 2nd heavy build waits for laptop-01 rather than landing on db1. That is
          #     the intended "at most one heavy build per node, else wait" behaviour, and
          #     it is SAFE (maxRunners is small, builds are serial in practice). db1 still
          #     serves lighter tenant builds whenever it has the room. When db1 is freed
          #     of its DB tier (or a larger build node joins the `capstone.io/pool=build`
          #     set) this same sizing spreads two builds across the pool with no change.
          # 4Gi is the smallest round request that makes 2×(job+kaniko) exceed laptop-01's
          # build-free memory (2 builds would need ~16Gi of requests > ~11.3Gi) — i.e. the
          # threshold that flips co-packing into spread/wait. The runner pod (a light
          # listener, arc-runner-scaleset-app.yaml) is intentionally NOT raised to 4Gi —
          # it does no build work; only THIS `$job` pair carries the build's memory.
          resources:
            requests: { memory: "4Gi" }
            limits:   { memory: "8Gi" }
          volumeMounts:
            - name: harbor-push
              mountPath: /kaniko/.docker
              readOnly: true
            # Trust the PLATFORM CA so the push VERIFIES Traefik's wildcard cert
            # (the in-cluster registry path serves the cert-manager-issued internal
            # cert, NOT Cloudflare's). Kaniko appends any cert under /kaniko/ssl/certs
            # to its trust store, so TLS verification stays ON (no --skip-tls-verify).
            - name: platform-ca
              mountPath: /kaniko/ssl/certs/platform-ca.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: harbor-push
          secret:
            secretName: harbor-push
            optional: true
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: platform-ca
          configMap:
            name: platform-ca
            optional: true
            items:
              - key: ca.crt
                path: ca.crt
