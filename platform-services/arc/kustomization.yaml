# ARC PREREQS (P2.3, §1.3, D-032) — the namespaces that must exist before the ARC
# Helm Applications (applicationsets/arc-*-app.yaml) install. Managed by the
# platform-services-appset (kustomize directory generator over platform-services/*;
# this dir produces app `platform-svc-arc`). The two Helm charts (controller +
# runner scale set) are SEPARATE Helm-source Applications (method A, D-028) and do
# NOT render through this kustomize dir.
#
# The GitHub App credential is a SealedSecret added here ONCE the human creates the
# GitHub App (see README.md "GitHub App" — it carries github_app_id /
# github_app_installation_id / github_app_private_key). The human sealed it (PR #24)
# and it is now referenced in `resources` below; the scale-set's `githubConfigSecret:
# arc-github-app` materialises from it. (A NEW App credential = re-seal the file with
# `make seal NS=arc-runners` and recommit — never commit an unsealed Secret.)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - sealedsecret-github-app.yaml   # the human's sealed GitHub App creds (arc-github-app)
  - hook-template.yaml             # container-hook: injects harbor-push + platform-ca into the build job pod
  - configmap-job-started-hook.yaml # runner pre-job hook: echoes spec.nodeName into every job's "Set up job" log
  - priorityclass-ci-build.yaml    # cluster-scoped: CI builds wait-not-fail, never preempt (queue-not-OOM)
  - sealedsecret-harbor-push.yaml
  # LabMx's per-team container-hook template (ConfigMap arc-hook-template-labmx),
  # mounted by the `labmx-kaniko` scale set (applicationsets/arc-runner-labmx-app.yaml).
  # LabMx is a platform-operated site, not a scaffolded Crossplane tenant, so its hook
  # ConfigMap is hand-rendered here rather than emitted by the tenant Composition —
  # see hook-template-labmx.yaml's header.
  - hook-template-labmx.yaml
  # ARC listener-drift check: asserts every AutoscalingListener still references an
  # EphemeralRunnerSet that exists. A dangling reference silently prevents that scale
  # set from EVER running a job while the AutoscalingRunnerSet still reports
  # phase: Running and ArgoCD reports Healthy (2026-09-30 labmx-kaniko incident).
  # Lives in arc-system so it does not consume an arc-runners CI pod slot.
  - listener-drift-check-rbac.yaml
  - listener-drift-check-configmap.yaml
  - listener-drift-check-cronjob.yaml
  - platform-ca-configmap.yaml     # platform CA → mounted into Kaniko so the push verifies Traefik's cert
  - limitrange.yaml                # per-container defaults so no $job pod is ever BestEffort
  - resourcequota.yaml             # cross-tenant aggregate concurrency ceiling (~18 concurrent jobs)
labels:
  - pairs:
      platform.capstone/component: platform
    includeSelectors: false
