# Dex Deployment + Service (P2.1, §1.1). Pinned image ghcr.io/dexidp/dex:v2.45.1
# (no :latest). Single replica for Phase 1/local (matches the non-HA ArgoCD
# install; Phase-3 HA is a replica bump + leader-aware storage, not an app change).
#
# Config comes from the `dex` ConfigMap mounted at /etc/dex/config.yaml. The
# GitHub OAuth clientID/secret + ArgoCD static-client secret come from the
# `dex-github` Secret (materialised by the SealedSecret) as env vars, which the
# ConfigMap references as $VARS (Dex expands env at config load).
#
# A change to the ConfigMap does NOT auto-restart the pod: ArgoCD syncs the new
# ConfigMap, then a manual `kubectl -n dex rollout restart deploy/dex` picks it up
# (documented in the dex README). Phase-2 can add a config-hash annotation later.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: dex
  labels:
    platform.capstone/component: platform
    app.kubernetes.io/name: dex
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # after namespace/rbac/secret/configmap
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dex
        platform.capstone/component: platform
    spec:
      serviceAccountName: dex
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.45.1
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/dex", "serve", "/etc/dex/config.yaml"]
          ports:
            - name: http
              containerPort: 5556
            - name: telemetry
              containerPort: 5558
          env:
            # Injected from the dex-github Secret (SealedSecret). Referenced by
            # $VAR in the ConfigMap; Dex expands env vars at config load.
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: dex-github
                  key: client-id
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-github
                  key: client-secret
            - name: ARGOCD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-github
                  key: argocd-client-secret
            - name: HARBOR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-github
                  key: harbor-client-secret
            # Backstage "The Process" (P5) static-client secret. ⚠ The `process-client-secret`
            # key must be ADDED to the dex-github SealedSecret (re-seal — see
            # platform-services/backstage/README.md). Until then this key is absent and
            # Dex will fail to start IF this env is required — so it is marked optional
            # so the broker keeps serving the existing clients pre-go-live; flip to
            # required (drop `optional`) once the key is sealed in.
            - name: PROCESS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-github
                  key: process-client-secret
                  optional: true
            # DB console (tenant-db-access) shared oauth2-proxy static-client secret.
            # Same optional-until-sealed pattern as PROCESS_CLIENT_SECRET above — the
            # `db-console-client-secret` key must be ADDED to the dex-github SealedSecret
            # (re-seal — see README). Until then this key is absent and Dex keeps serving
            # every other client; flip to required (drop `optional`) once sealed in.
            - name: DB_CONSOLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-github
                  key: db-console-client-secret
                  optional: true
            # Grafana (Observability SSO) static-client secret. Unlike PROCESS_/
            # DB_CONSOLE_CLIENT_SECRET above, the `grafana-client-secret` key was
            # sealed with a REAL value in the same PR that added this staticClient
            # (see platform-services/dex/README.md "Grafana static client") — no
            # placeholder period, so this is required (not `optional`) from the start.
            - name: GRAFANA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-github
                  key: grafana-client-secret
            # IDA Agile Board (ida-llm tenant) static-client secret. Sealed with a
            # REAL value in the same change that added the staticClient, so this is
            # required from the start -- no `optional:` placeholder period, same as
            # GRAFANA_CLIENT_SECRET above.
            #
            # ⚠ THE SAME VALUE EXISTS IN TWO PLACES BY NECESSITY: here (Dex's side of
            # the client) and in Vault at tenants/ida-llm/prod/agile OIDC_CLIENT_SECRET
            # (the app's side, delivered by ESO). They are different trust domains --
            # the tenant must not be able to read the platform's SealedSecret, and the
            # platform does not write into the tenant's Vault subtree -- so a single
            # source is not available. Rotate BOTH TOGETHER; if they drift, sign-in
            # fails at the token exchange with an opaque OIDC error.
            - name: IDA_AGILE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dex-github
                  key: ida-agile-client-secret
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 5558
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 5558
            initialDelaySeconds: 10
            periodSeconds: 15
          # Resource-reclaim (VPA-driven, task follow-up): Goldilocks/VPA target ~15m
          # cpu / actual usage ~40Mi (`kubectl top`, dex ns); the 100Mi VPA memory
          # target is the recommender's short-history floor (identical across many
          # unrelated low-traffic controllers), so this uses observed actual + ~15%
          # headroom instead of the raw target. Not on a VPA Auto policy — see
          # platform-services/vpa-policies/ for the curated allowlist.
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: dex
