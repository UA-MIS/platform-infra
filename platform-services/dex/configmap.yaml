# Dex configuration (P2.1, §1.1, D-017) — the sole OIDC broker.
#
# Single connector: GitHub, org-gated to UA-MIS. Dex only issues a token to
# members of UA-MIS (native connector gating — no custom authenticator, §1.1) and
# surfaces the user's GitHub Teams as the OIDC `groups` claim. ArgoCD (and, later,
# Backstage/Grafana/Harbor) are registered as staticClients and federate here.
#
# Secrets are NOT in this ConfigMap. The GitHub OAuth app's clientID/clientSecret
# and ArgoCD's static-client secret are injected as ENV VARS from a SealedSecret
# (sealedsecret.yaml) and referenced below as $VARS — Dex expands environment
# variables in its config file at load. So this ConfigMap is safe to commit.
#
# PLATFORM_DOMAIN seam (§6): the issuer host `id.capstone.uamishub.com` is the
# Phase-1 dashed-sslip literal. Phase 3/4 re-points it at the Cloudflare zone —
# a one-line change here mirrored from clusters/<target>/values.env, plus the
# matching callback URL on the GitHub OAuth app.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex
  namespace: dex
  labels:
    platform.capstone/component: platform
data:
  config.yaml: |
    # External issuer URL — must match what clients use and what TLS terminates
    # at (Traefik wildcard cert for *.capstone.uamishub.com). HTTPS-terminated at the
    # ingress; Dex itself listens HTTP on :5556 behind Traefik.
    issuer: https://id.capstone.uamishub.com

    storage:
      type: kubernetes
      config:
        inCluster: true

    web:
      http: 0.0.0.0:5556

    # Health/readiness endpoint (used by the Deployment probes).
    telemetry:
      http: 0.0.0.0:5558

    # GitHub-only. No static password DB (students never type a password into
    # the platform — identity is GitHub-org membership, §1.1).
    enablePasswordDB: false

    connectors:
      - type: github
        id: github
        name: GitHub
        config:
          clientID: $GITHUB_CLIENT_ID
          clientSecret: $GITHUB_CLIENT_SECRET
          # MUST exactly equal the GitHub OAuth app's Authorization callback URL.
          redirectURI: https://id.capstone.uamishub.com/callback
          # --- THE SECURITY BOUNDARY (§1.1): org-gated to UA-MIS only ---
          # Dex rejects any login from a non-member of UA-MIS at the connector
          # level (uses the read:org grant to check membership). To admit only
          # specific GitHub Teams later, add `teams:` under the org entry.
          orgs:
            - name: UA-MIS
          # Emit the user's GitHub Teams as groups with team SLUGs (stable,
          # lowercase, URL-safe). With `orgs:` set, the connector's groupsForOrgs
          # path emits ONLY `<org>:<team-slug>` entries (e.g. `UA-MIS:sample`) —
          # the BARE org `UA-MIS` is never emitted as a group (SEC-007). Org
          # membership is gated by `orgs:` regardless; the org-wide read-only
          # baseline comes from argocd-rbac-cm `policy.default`, not a group.
          # NOTE: `loadAllGroups` is intentionally omitted — it is a NO-OP when
          # `orgs:` is set (groupsForOrgs returns before honoring it, SEC-007).
          teamNameField: slug
          # Use GitHub login (handle) as the user ID — human-readable in ArgoCD
          # audit/UI instead of an opaque numeric ID.
          useLoginAsID: true

    # OAuth2 clients that federate through this broker. Each platform tool that
    # does human SSO is a static client here — the WHOLE POINT of the shared broker
    # (§1.1): one GitHub OAuth app, N tools. Secrets are injected from the
    # SealedSecret as $<NAME>_CLIENT_SECRET env vars.
    staticClients:
      - id: argocd
        name: ArgoCD
        secretEnv: ARGOCD_CLIENT_SECRET
        redirectURIs:
          # ArgoCD's OIDC callback (server URL + /auth/callback).
          - https://argocd.capstone.uamishub.com/auth/callback
          # ArgoCD CLI (argocd login --sso) loopback callback.
          - http://localhost:8085/auth/callback
      # Harbor (P2.2) — registry SSO via the SAME broker (NO new GitHub OAuth app).
      # Harbor-core fetches Dex discovery SERVER-SIDE; the issuer host
      # id.capstone.uamishub.com is already in-cluster-reachable via the coredns-custom
      # rewrite -> Traefik -> Dex (slice-1 pattern, reused, no new rewrite needed).
      - id: harbor
        name: Harbor
        secretEnv: HARBOR_CLIENT_SECRET
        redirectURIs:
          # Harbor's OIDC callback (server URL + /c/oidc/callback).
          - https://harbor.capstone.uamishub.com/c/oidc/callback
      # Backstage "The Process" (P5) — developer-portal SSO via the SAME broker (NO new
      # GitHub OAuth app). Backstage fetches Dex discovery SERVER-SIDE at
      # id.capstone.uamishub.com (in-cluster via the coredns-custom rewrite -> Traefik
      # -> Dex, slice-1 pattern, reused). Same self-signed-CA caveat as ArgoCD/Harbor.
      # ⚠ The PROCESS_CLIENT_SECRET env (deployment.yaml) needs a `process-client-secret`
      #   key added to the dex-github SealedSecret — RE-SEAL before go-live (README).
      - id: process
        name: The Process
        secretEnv: PROCESS_CLIENT_SECRET
        redirectURIs:
          # Backstage OIDC callback (baseUrl + /api/auth/oidc/handler/frame).
          - https://process.capstone.uamishub.com/api/auth/oidc/handler/frame
      # DB console auth (tenant-db-access design, artifacts/research/tenant-db-access.md
      # §3.2 option D) — ONE shared oauth2-proxy fronts EVERY per-(team,env) Adminer
      # console + the platform-admin Adminer, so Dex needs only ONE static client with
      # ONE fixed redirect URI (Dex has no wildcard redirectURIs; a per-team client
      # would mean editing this ConfigMap at every onboarding — the exact dual-owner
      # anti-pattern the Composition itself forbids elsewhere). Per-(team,env) gating
      # happens downstream at the Traefik forwardAuth Middleware
      # (`?allowed_groups=UA-MIS:<team>`), NOT here — see
      # platform-services/db-console-auth/README.md for the oauth2-proxy side and
      # platform-services/crossplane/apis/composition.yaml's ADMINER CONSOLE blocks
      # for the per-team Middleware.
      # ⚠ The DB_CONSOLE_CLIENT_SECRET env (deployment.yaml) needs a
      #   `db-console-client-secret` key added to the dex-github SealedSecret —
      #   RE-SEAL before go-live (same procedure as PROCESS_CLIENT_SECRET, README).
      - id: db-console
        name: DB Console
        secretEnv: DB_CONSOLE_CLIENT_SECRET
        redirectURIs:
          # oauth2-proxy's own OIDC callback (single shared instance, fixed host —
          # NOT any of the per-team console hosts, which never talk to Dex directly).
          - https://db-auth.capstone.uamishub.com/oauth2/callback
      # Grafana (Observability SSO) — federates through the SAME broker (NO new
      # GitHub OAuth app), same "one GitHub OAuth app, N tools" model as ArgoCD/
      # Harbor/Backstage/DB-console. Grafana's `auth.generic_oauth` config lives in
      # `applicationsets/kube-prometheus-stack-app.yaml` (grafana.ini); the client
      # secret is injected via GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET from the
      # `grafana-oauth` SealedSecret (platform-services/monitoring/
      # sealedsecret-grafana-oauth.yaml) — the SAME value as the
      # `grafana-client-secret` key below (both sides must agree).
      - id: grafana
        name: Grafana
        secretEnv: GRAFANA_CLIENT_SECRET
        redirectURIs:
          # Grafana's OIDC callback (root_url + /login/generic_oauth).
          - https://grafana.capstone.uamishub.com/login/generic_oauth
      # IDA Agile Board — the ida-llm tenant's sprint board. FIRST TENANT-OWNED
      # APPLICATION to federate through this broker; every client above is a
      # platform service.
      #
      # It still gets a static client here rather than its own GitHub OAuth app,
      # for the same reason as the others: one GitHub OAuth app, N tools. The
      # difference worth noting is the AUTHORIZATION model. Platform clients rely
      # on the connector's `orgs:` gate (any UA-MIS member) plus their own RBAC.
      # This app additionally requires a specific GROUP — it checks the caller is
      # in `UA-MIS:ida-llm` before showing anyone the board.
      #
      # That works without any config here because the GitHub connector above sets
      # `teamNameField: slug` and, with `orgs:` set, emits ONLY `<org>:<team-slug>`
      # groups (never the bare org — SEC-007). So the group the app must require is
      # exactly `UA-MIS:ida-llm`, which is what it derives by default from its own
      # GITHUB_ORG/GITHUB_TEAM settings. Nothing to add to the connector.
      #
      # ⚠ Dex has NO WILDCARD redirect URIs, so this is the exact callback the app
      # builds from its APP_URL. If APP_URL and this ever disagree — a trailing
      # slash, http://, the wrong host — sign-in fails at the redirect with an
      # opaque OIDC error rather than at startup. Change both together.
      - id: ida-agile
        name: IDA Agile Board
        secretEnv: IDA_AGILE_CLIENT_SECRET
        redirectURIs:
          - https://ida-agile.capstone.uamishub.com/api/auth/callback
      # UA-MIS Platform board (agile.uamishub.com) — the MAINTAINERS' instance of
      # the SAME application as `ida-agile` above. Both run the identical image
      # (harbor.capstone.uamishub.com/platform/agile-board, built from
      # github.com/UA-MIS/agile-board); everything that differs between them is
      # environment. That is the whole point of the extraction: a second team's
      # board is a second Dex client and a second env block, never a second copy
      # of the code.
      #
      # Authorization is `UA-MIS:labmx` (the platform maintainers' team), derived
      # by the app from its GITHUB_ORG/GITHUB_TEAM. Note `labmx` is a SECRET
      # GitHub team; that is fine — the connector reads it through `/user/teams`
      # with `read:org`, which returns secret teams the member belongs to, so it
      # still appears in the `groups` claim as `UA-MIS:labmx` (verified).
      #
      # ⚠ Host is on the APEX zone `uamishub.com`, NOT `*.capstone.uamishub.com`
      # like every client above. Cloudflare already tunnels it to Traefik (a bare
      # `agile.uamishub.com` request returns Traefik's plain-text 404, not
      # Cloudflare's HTML error page — verified before this was added), so no DNS
      # or certificate change was needed. Same no-wildcard-redirect caveat as
      # ida-agile: this URI and the app's APP_URL must be changed together.
      - id: agile-board
        name: UA-MIS Platform Board
        secretEnv: AGILE_BOARD_CLIENT_SECRET
        redirectURIs:
          - https://agile.uamishub.com/api/auth/callback
          # ── PER-TEAM SPRINT BOARDS (D-186) ──────────────────────────────────
          # Every team board provisioned by the wizard is ANOTHER redirect URI on
          # THIS client, not a client of its own. One GitHub OAuth app, one Dex
          # client, N boards — the same "one broker, N tools" argument this file
          # makes for ArgoCD/Harbor/Backstage, carried one level further.
          #
          # WHY NOT A CLIENT PER TEAM: Dex has no wildcard redirect URIs, so both
          # shapes cost an edit here per board. But a per-team client would ALSO
          # need its own `<TEAM>_CLIENT_SECRET` env in deployment.yaml AND a
          # re-seal of sealedsecret.yaml — and `make seal` needs live cluster
          # credentials plus a full plaintext rebuild of every existing key, so
          # onboarding would block on an operator with a kubeconfig. Twelve times.
          # Sharing the client costs one generated line and no secret work at all.
          #
          # Holding this secret does not let anyone read a board: authorization
          # codes only ever go to a URI in this list, every one of which is a
          # platform-owned host, and each board independently requires
          # `UA-MIS:<its own team>` on the groups claim.
          #
          # ⚠ GENERATED. Do not hand-edit — edit tenants/_boards/ and run
          # platform-services/dex/gen-board-clients.py. `make validate` fails on
          # drift, and .github/workflows/dex-board-clients.yaml opens the fix PR.
          # Each URI must equal that board's APP_URL + /api/auth/callback exactly;
          # both sides derive from the one team slug so they cannot disagree.
          # ── BEGIN GENERATED team board redirect URIs (gen-board-clients.py) ──
          - https://capstone-demo-agile.capstone.uamishub.com/api/auth/callback
          - https://wizarddress-agile.capstone.uamishub.com/api/auth/callback
          # ── END GENERATED team board redirect URIs ──

    oauth2:
      # Skip the per-login "approve this app" screen — these are first-party
      # platform clients, not third-party. Smooth SSO UX.
      skipApprovalScreen: true
