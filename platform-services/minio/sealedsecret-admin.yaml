# SealedSecret -> Secret `minio-admin` in the minio namespace (Track DR, dr-backup).
# MINIO_ROOT_USER / MINIO_ROOT_PASSWORD: the MinIO server's root (superadmin)
# credentials. Used ONLY by the statefulset.yaml (server env) and the
# minio-provision Job (to bootstrap the scoped `velero` IAM user + bucket + policy
# via `mc admin`). Never handed to Velero directly — see sealedsecret-velero-user.yaml
# for the scoped credential Velero actually uses. Both platform-generated random
# values; rotate by regenerating + re-sealing (`make seal`), then restart the
# minio-0 pod and re-run the minio-provision Job.
# Sealed for the minio namespace (strict scope, D-008).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: minio-admin
  namespace: minio
spec:
  encryptedData:
    MINIO_ROOT_PASSWORD: 
    MINIO_ROOT_USER: 
  template:
    metadata:
      name: minio-admin
      namespace: minio
    type: Opaque
