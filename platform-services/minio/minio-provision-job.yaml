# MinIO provisioning Job (dr-backup) — declarative, idempotent bootstrap of the
# `velero` bucket + a DEDICATED, least-privilege IAM user for Velero. Modeled on
# platform-services/harbor-oidc-config/configure-oidc-job.yaml: a REGULAR ArgoCD
# resource (not a sync hook — a hook-only Application never fires, see that job's
# own header for why), Force+Replace so a changed manifest re-creates + re-runs
# it, secrets injected as env (never on argv).
#
# WHY A SEPARATE IAM USER (not just handing Velero the root creds): least
# privilege, same principle as Harbor's per-team robot accounts — Velero only
# ever needs read/write on the ONE `velero` bucket, never MinIO admin. The
# scoped user's access/secret keys are generated by the operator (kubeseal'd
# ahead of time into minio's sealedsecret-velero-user.yaml AND velero's
# sealedsecret-minio-credentials.yaml — same plaintext pair, sealed twice, once
# per consuming namespace per D-008); this Job's only job is to make the LIVE
# MinIO server agree with what was already sealed into git.
#
# `mc admin user add` and `mc admin policy attach` are both convERGENT (re-running
# with the same access key / policy name is a no-op-equivalent), matching the
# harbor-oidc-config Job's idempotency contract.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-provision
  namespace: minio
  labels:
    platform.capstone/component: platform
  annotations:
    # See configure-oidc-job.yaml's header for the full rationale on
    # Force=true,Replace=true,ServerSideApply=false for a regular (non-hook) Job.
    argocd.argoproj.io/sync-options: Force=true,Replace=true,ServerSideApply=false
    argocd.argoproj.io/sync-wave: "1"   # after the minio StatefulSet (wave 0, implicit default)
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        platform.capstone/component: platform
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: mac-debian-02
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /tmp   # mc writes its alias config to $HOME/.mc; / is read-only
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-admin
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-admin
                  key: MINIO_ROOT_PASSWORD
            - name: VELERO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-velero-user
                  key: ACCESS_KEY
            - name: VELERO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-velero-user
                  key: SECRET_KEY
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              echo "--- end diagnostics ---"

              echo "==> waiting for MinIO API at http://minio.minio.svc.cluster.local:9000 ..."
              i=0
              until mc alias set local http://minio.minio.svc.cluster.local:9000 \
                  "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                i=$((i+1)); [ "$i" -ge 60 ] && { echo "MinIO not reachable after ~5m"; exit 1; }
                echo "   ...not ready yet (attempt $i), sleeping 5s"; sleep 5
              done
              echo "==> MinIO is up."

              echo "==> ensuring bucket 'velero' exists ..."
              mc mb --ignore-existing local/velero

              echo "==> ensuring bucket 'dr-backup' exists (Thanos long-term metrics) ..."
              mc mb --ignore-existing local/dr-backup

              echo "==> writing least-privilege policy (velero-rw: only the velero bucket) ..."
              cat > /tmp/velero-rw-policy.json <<'EOF'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": ["s3:GetBucketLocation", "s3:ListBucket"],
                    "Resource": ["arn:aws:s3:::velero"]
                  },
                  {
                    "Effect": "Allow",
                    "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
                    "Resource": ["arn:aws:s3:::velero/*"]
                  }
                ]
              }
              EOF
              mc admin policy create local velero-rw /tmp/velero-rw-policy.json

              echo "==> ensuring the scoped 'velero' IAM user exists + is attached ..."
              mc admin user add local "$VELERO_ACCESS_KEY" "$VELERO_SECRET_KEY"
              mc admin policy attach local velero-rw --user="$VELERO_ACCESS_KEY"

              echo "==> done. buckets:"; mc ls local
      volumes:
        - name: tmp
          emptyDir: {}
