# MinIO provisioning Job (dr-backup) — declarative, idempotent bootstrap of the
# `velero` bucket + a DEDICATED, least-privilege IAM user for Velero. Modeled on
# platform-services/harbor-oidc-config/configure-oidc-job.yaml: a REGULAR ArgoCD
# resource (not a sync hook — a hook-only Application never fires, see that job's
# own header for why), Force+Replace so a changed manifest re-creates + re-runs
# it, secrets injected as env (never on argv).
#
# WHY A SEPARATE IAM USER (not just handing Velero the root creds): least
# privilege, same principle as Harbor's per-team robot accounts — Velero only
# ever needs read/write on the ONE `velero` bucket, never MinIO admin. The
# scoped user's access/secret keys are generated by the operator (kubeseal'd
# ahead of time into minio's sealedsecret-velero-user.yaml AND velero's
# sealedsecret-minio-credentials.yaml — same plaintext pair, sealed twice, once
# per consuming namespace per D-008); this Job's only job is to make the LIVE
# MinIO server agree with what was already sealed into git.
#
# `mc admin user add` and `mc admin policy attach` are both convERGENT (re-running
# with the same access key / policy name is a no-op-equivalent), matching the
# harbor-oidc-config Job's idempotency contract.
#
# THANOS USER (added to close a real gap found live 2026-07-07/08): this Job
# already created the `dr-backup` bucket for Thanos (below) but never created
# the matching IAM user — platform-services/monitoring/thanos.yaml's
# `thanos-objstore-config` secret authenticates as access_key `thanos`, and
# that MinIO user was created BY HAND (`mc admin user add`, live) during the
# overnight bring-up because this script never did it. That is now fixed here,
# mirroring the velero user exactly (same `mc admin user add` / `policy
# create` / `policy attach` shape, least-privilege to ONLY the `dr-backup`
# bucket). See sealedsecret-thanos-user.yaml's header for the important
# secret_key COUPLING to thanos.yaml's `thanos-objstore-config` — they must be
# rotated together, never independently.
#
# BUCKET QUOTAS (added 2026-09-13, capstone-w1 DiskPressure incident #2): the
# `minio-dr-local-pv` capacity field (platform-services/minio/pv-local.yaml,
# 200Gi) is a hostPath PV — Kubernetes uses it only to match a PVC's request,
# it enforces NOTHING on the node's actual filesystem. That gap is exactly how
# the underlying directory reached 381G on a 433G disk with the PV still
# reporting 200Gi. A `local`-type PV, a dedicated LV, or a filesystem quota
# would all require a one-off, out-of-band change ON THE NODE (mac fleet /
# Debian workers) that this GitOps Job cannot perform and that isn't captured
# by any file in this repo — rejected for that reason, not on merit.
# `node_filesystem_avail_bytes`-based alerting was also considered and
# REJECTED as redundant: `BuildPoolDiskFilling` (<20% free) and
# `NodeRootFilesystemNearEviction` (<17% free, critical) already exist
# (platform-services/monitoring/alerts.yaml) and already route to the real
# `platform-oncall` receiver — and `BuildPoolDiskFilling` fired continuously
# for 59.1 hours before the first incident without preventing it (see
# docs/operator/disk-headroom.md, "The 2026-09-03 lesson is not 'we had no
# alert'"). More detection does not fix an enforcement gap; a bucket quota
# does — MinIO fails the *write* (`mc cp: Bucket quota exceeded`), immediately
# and at the application layer, with zero dependency on anyone reading a page.
# `mc quota set` is convergent (same size, re-applied, is a no-op-equivalent),
# matching this Job's existing idempotency contract for `mc admin user add` /
# `mc admin policy attach`.
#
# Sizing: `docs/operator/disk-headroom.md` §"Sizing the ceiling" derives ~325
# GiB as the combined velero+dr-backup ceiling to keep capstone-w1 above its
# own 20%-free warning line (433 GiB root fs, ~21 GiB non-DR baseline usage).
# It proposed velero=240GiB / dr-backup=70GiB (310 GiB, ~15 GiB margin) but
# noted that quota could not yet be applied: at the time, `velero` held ~336G
# (monitoring 133G + harbor 81G + vault 44G + db-tier 34G + 4 tenant VMs 44G)
# — ABOVE a 240GiB quota, which would fail that same night's backup. The
# `monitoring` exclusion added in this same PR (applicationsets/velero-app.yaml)
# removes that 133G going forward, bringing steady-state `velero` usage to
# ~203G — safely under 240GiB — which is what finally makes applying this
# quota safe today instead of merely planned.
#
# ── 2026-09-21: SELF-INDUCED DEADLOCK, 240GiB -> 260GiB (temporary) ──────────
# The 240GiB quota above did its enforcement job (writes failed loudly instead
# of the node filling silently) but created a NEW failure mode nobody had
# modeled: Kopia's own per-namespace maintenance (the hourly job that PRUNES
# expired snapshot data) needs to write a small `kopia.maintenance` metadata
# blob to complete a prune cycle. Once the bucket sat AT the quota, that write
# itself started failing ("Bucket quota exceeded"), so maintenance could not
# complete, so nothing was ever pruned, so usage never dropped below the
# quota. A self-locking deadlock: full because it can't prune, can't prune
# because it's full. Found live 2026-09-21: 70 `*-kopia-maintain-job-*` pods
# across the `velero` namespace in `Error` (one per namespace/repo), usage
# pinned at 240.0/240 GiB, and 6 already-expired backups (2026-08-20,
# 2026-08-28, 2026-09-07..09-10) stuck in phase `Deleting` for as long as two
# weeks — their DeleteBackupRequests show `Processed`, but the repo-side prune
# that actually reclaims their blobs never ran.
#
# Fix: +20GiB, the smallest bump that gives maintenance room to write its own
# metadata blob and complete a prune pass (disk headroom exists: capstone-w1
# was at 327G/433G, 80% used, when this shipped — see PR description for the
# live figure at merge time). This is NOT the final number — see Job 2 in the
# same tracking issue (Velero scope narrowed to the 3 KubeVirt VM root disks
# only, ~88GiB) — once that scope change has had time to age out the rest of
# the current footprint under its own TTL, the quota comes back DOWN to a
# number sized for the new, much smaller steady state, with sane headroom
# instead of the ~20GiB emergency margin used here. Tracked; do not treat
# 260GiB as a permanent ceiling.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-provision
  namespace: minio
  labels:
    platform.capstone/component: platform
  annotations:
    # See configure-oidc-job.yaml's header for the full rationale on
    # Force=true,Replace=true,ServerSideApply=false for a regular (non-hook) Job.
    argocd.argoproj.io/sync-options: Force=true,Replace=true,ServerSideApply=false
    argocd.argoproj.io/sync-wave: "1"   # after the minio StatefulSet (wave 0, implicit default)
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        platform.capstone/component: platform
    spec:
      restartPolicy: Never
      # No nodeSelector: this Job is a network-only `mc` client to the minio
      # Service — it does NOT need to co-locate with the minio pod. Pinning it to a
      # single node (was mac-debian-02, now retired) only made it fragile. Let it
      # schedule anywhere so DR provisioning can't be stranded by a node leaving.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          imagePullPolicy: IfNotPresent
          resources:
            # Bumped 32Mi/64Mi -> 128Mi/256Mi (live incident, 2026-07-07/08):
            # `mc` OOMKilled at 64Mi partway through the provisioning script
            # (after creating the bucket, before finishing user/policy setup).
            requests: { cpu: 10m, memory: 128Mi }
            limits: { cpu: 100m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /tmp   # mc writes its alias config to $HOME/.mc; / is read-only
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-admin
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-admin
                  key: MINIO_ROOT_PASSWORD
            - name: VELERO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-velero-user
                  key: ACCESS_KEY
            - name: VELERO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-velero-user
                  key: SECRET_KEY
            - name: THANOS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-thanos-user
                  key: ACCESS_KEY
            - name: THANOS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-thanos-user
                  key: SECRET_KEY
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command: ["/bin/sh", "-eu", "-c"]
          args:
            - |
              echo "==> waiting for MinIO API at http://minio.minio.svc.cluster.local:9000 ..."
              i=0
              until mc alias set local http://minio.minio.svc.cluster.local:9000 \
                  "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                i=$((i+1)); [ "$i" -ge 60 ] && { echo "MinIO not reachable after ~5m"; exit 1; }
                echo "   ...not ready yet (attempt $i), sleeping 5s"; sleep 5
              done
              echo "==> MinIO is up."

              echo "==> ensuring bucket 'velero' exists ..."
              mc mb --ignore-existing local/velero

              echo "==> ensuring bucket 'dr-backup' exists (Thanos long-term metrics) ..."
              mc mb --ignore-existing local/dr-backup

              # Hard quotas (see this file's header, "BUCKET QUOTAS", for the full
              # rationale + sizing derivation). Convergent: re-setting the same size
              # on every Job re-run is a no-op-equivalent, same contract as the
              # `mc admin user add` / `mc admin policy attach` calls below. At the
              # quota, writes fail loudly (`Bucket quota exceeded`) instead of the
              # node filling silently.
              echo "==> setting hard quota on 'velero' (260GiB, temporary — see header) ..."
              mc quota set local/velero --size 260GiB

              echo "==> setting hard quota on 'dr-backup' (70GiB) ..."
              mc quota set local/dr-backup --size 70GiB

              echo "==> writing least-privilege policy (velero-rw: only the velero bucket) ..."
              cat > /tmp/velero-rw-policy.json <<'EOF'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": ["s3:GetBucketLocation", "s3:ListBucket"],
                    "Resource": ["arn:aws:s3:::velero"]
                  },
                  {
                    "Effect": "Allow",
                    "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
                    "Resource": ["arn:aws:s3:::velero/*"]
                  }
                ]
              }
              EOF
              mc admin policy create local velero-rw /tmp/velero-rw-policy.json

              echo "==> ensuring the scoped 'velero' IAM user exists + is attached ..."
              mc admin user add local "$VELERO_ACCESS_KEY" "$VELERO_SECRET_KEY"
              mc admin policy attach local velero-rw --user="$VELERO_ACCESS_KEY"

              echo "==> writing least-privilege policy (thanos-rw: only the dr-backup bucket) ..."
              cat > /tmp/thanos-rw-policy.json <<'EOF'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": ["s3:*"],
                    "Resource": [
                      "arn:aws:s3:::dr-backup",
                      "arn:aws:s3:::dr-backup/*"
                    ]
                  }
                ]
              }
              EOF
              mc admin policy create local thanos-rw /tmp/thanos-rw-policy.json

              echo "==> ensuring the scoped 'thanos' IAM user exists + is attached ..."
              mc admin user add local "$THANOS_ACCESS_KEY" "$THANOS_SECRET_KEY"
              mc admin policy attach local thanos-rw --user="$THANOS_ACCESS_KEY"

              echo "==> done. buckets:"; mc ls local
              echo "==> quotas:"; mc quota info local/velero; mc quota info local/dr-backup
      volumes:
        - name: tmp
          emptyDir: {}
