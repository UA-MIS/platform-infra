# SealedSecret -> Secret `minio-thanos-user` in the minio namespace (dr-backup).
# ACCESS_KEY / SECRET_KEY: a DEDICATED, non-root MinIO IAM user for Thanos —
# NOT the root credential, same least-privilege pattern as
# sealedsecret-velero-user.yaml (Thanos only ever needs read/write on the
# `dr-backup` bucket, never MinIO admin). The minio-provision Job
# (minio-provision-job.yaml) reads this to `mc admin user add` the user and
# `mc admin policy attach` a `thanos-rw` policy scoped to ONLY the `dr-backup`
# bucket (s3:* on `arn:aws:s3:::dr-backup` + `/*`).
#
# ⚠ THE COUPLING (read before rotating either secret): this is NOT a fresh,
# independently-generated pair like velero's. `platform-services/monitoring/
# thanos.yaml`'s `thanos-objstore-config` SealedSecret already ships a
# `secret_key` value that every Thanos component (sidecar/store-gateway/
# compactor) is hardcoded to authenticate with — access_key `thanos`. That
# SealedSecret was originally sealed by hand, live, with NO corresponding
# MinIO IAM user ever created by this provisioning Job (a documentation/
# implementation gap fixed in this same change — see minio-provision-job.yaml's
# header). To close the gap WITHOUT breaking the already-live Thanos
# deployment (re-generating a new random secret_key here would immediately
# make Thanos's existing objstore.yml wrong), this SealedSecret was sealed
# from the SAME plaintext ACCESS_KEY=thanos / SECRET_KEY that is already live
# in `thanos-objstore-config` — read out via `kubectl -n monitoring get secret
# thanos-objstore-config -o jsonpath='{.data.objstore\.yml}' | base64 -d` at
# the time this SealedSecret was authored, NOT independently generated. This
# is the same "one plaintext pair, sealed once per consuming namespace" shape
# as the velero user (D-008), just reconstructed from the live secret instead
# of generated fresh.
#
# OPERATOR STEP ON FUTURE ROTATION: the two SealedSecrets are NOT
# cryptographically linked (sealed-secrets has no shared-value mechanism) —
# rotating one without the other WILL drift them and break Thanos's MinIO
# auth. To rotate the `thanos` MinIO user's credentials:
#   1. Generate a new SECRET_KEY.
#   2. Reseal BOTH this file (ACCESS_KEY/SECRET_KEY) AND
#      platform-services/monitoring/thanos.yaml's `thanos-objstore-config`
#      (its objstore.yml `secret_key` field) from that SAME new value, in the
#      SAME PR, and merge/sync them together (never independently).
#   3. Unlike bucket/policy creation, `mc admin user add` on a CHANGED secret
#      for an EXISTING access key is not guaranteed convergent across all mc/
#      MinIO versions (existing-user-add can be a no-op instead of a rotate) —
#      verify with `mc admin user info local thanos` after the provision Job
#      re-runs; if the key didn't rotate, `mc admin user add` again by hand or
#      delete+recreate the user via the same Job's commands.
# A stronger fix (ESO from one shared Vault path, so neither file carries a
# literal secret and drift becomes structurally impossible) is a documented
# follow-up — this repo's SealedSecrets-only precedent for the minio/velero
# pair means that's a bigger pattern change than this hotfix-codification PR
# should carry; escalate/ADR before doing it.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: minio-thanos-user
  namespace: minio
spec:
  encryptedData:
    ACCESS_KEY: 
    SECRET_KEY: 
  template:
    metadata:
      name: minio-thanos-user
      namespace: minio
    type: Opaque
