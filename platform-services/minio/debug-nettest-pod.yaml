# TEMPORARY DEBUG POD — cross-node connectivity to MinIO on mac-debian-01.
# Scheduled on mac-debian-02 to test VXLAN/Tailscale cross-node path.
# DELETE after diagnosis is complete.
#
# Run output:
#   argocd app sync platform-svc-minio   (to apply)
#   then check logs in ArgoCD or via `kubectl logs -n minio nettest`
apiVersion: v1
kind: Pod
metadata:
  name: nettest
  namespace: minio
  labels:
    platform.capstone/component: platform
  annotations:
    argocd.argoproj.io/sync-options: "Prune=false"   # don't auto-delete on next sync
spec:
  nodeSelector:
    kubernetes.io/hostname: capstone-n1   # run on OptiPlex to test different cross-node path
  restartPolicy: Never
  securityContext:
    runAsNonRoot: false   # netshoot needs root for some tools
  containers:
    - name: nettest
      image: nicolaka/netshoot:v0.13
      command: ["/bin/bash", "-c"]
      args:
        - |
          echo "====== SCAN LAN SUBNET FOR SSH (port 22) ======"
          echo "Scanning 192.168.1.0/24 for hosts with port 22 open ..."
          nmap -sT -p 22 --open -T4 192.168.1.0/24 2>&1 || true
          echo ""
          echo "Scanning 192.168.0.0/24 ..."
          nmap -sT -p 22 --open -T4 192.168.0.0/24 2>&1 || true
          echo ""
          echo "Scanning 10.0.0.0/24 ..."
          nmap -sT -p 22 --open -T4 10.0.0.0/24 2>&1 || true
          echo ""

          echo "====== NODE INTERNAL IPs via Kubernetes API ======"
          curl -s --max-time 5 \
            -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
            --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
            https://kubernetes.default.svc.cluster.local/api/v1/nodes \
            | grep -E '"address"|"type"|"hostname"' | head -60
          echo ""

          echo "====== DONE ======"
          sleep 3600
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 64Mi }
