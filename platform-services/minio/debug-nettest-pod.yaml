# TEMPORARY DEBUG POD — cross-node connectivity to MinIO on mac-debian-01.
# Scheduled on mac-debian-02 to test VXLAN/Tailscale cross-node path.
# DELETE after diagnosis is complete.
#
# Run output:
#   argocd app sync platform-svc-minio   (to apply)
#   then check logs in ArgoCD or via `kubectl logs -n minio nettest`
apiVersion: v1
kind: Pod
metadata:
  name: nettest
  namespace: minio
  labels:
    platform.capstone/component: platform
  annotations:
    argocd.argoproj.io/sync-options: "Prune=false"   # don't auto-delete on next sync
spec:
  nodeSelector:
    kubernetes.io/hostname: capstone-n1   # run on OptiPlex to test different cross-node path
  restartPolicy: Never
  securityContext:
    runAsNonRoot: false   # netshoot needs root for some tools
  containers:
    - name: nettest
      image: nicolaka/netshoot:v0.13
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -x
          echo "====== NODE INFO ======"
          echo "Running on: $(hostname) on node $(cat /etc/hostname 2>/dev/null)"
          ip route show
          echo ""

          echo "====== NMAP mac-debian-01 Tailscale IP ======"
          echo "Scanning 100.69.204.106 for open ports ..."
          nmap -sT -p 22,9000,8472,10250 --open -T4 100.69.204.106 2>&1 || echo "nmap Tailscale IP done"
          echo ""

          echo "====== NMAP MinIO pod IP ======"
          echo "Scanning 10.244.3.244 ..."
          nmap -sT -p 9000 -T4 10.244.3.244 2>&1 || echo "nmap pod IP done"
          echo ""

          echo "====== ARP / neighbour table ======"
          ip neigh show
          echo ""

          echo "====== WHAT IP does mac-debian-01 hostname resolve to? ======"
          nslookup mac-debian-01 2>&1 || echo "no DNS for mac-debian-01"
          nslookup mac-debian-01.minio.svc.cluster.local 2>&1 || true
          echo ""

          echo "====== CILIUM NODE IPs (from kube-dns) ======"
          nslookup kubernetes.default.svc.cluster.local
          echo ""

          echo "====== DONE ======"
          sleep 3600
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 64Mi }
