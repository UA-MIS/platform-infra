# TEMPORARY DEBUG POD — cross-node connectivity to MinIO on mac-debian-01.
# Scheduled on mac-debian-02 to test VXLAN/Tailscale cross-node path.
# DELETE after diagnosis is complete.
#
# Run output:
#   argocd app sync platform-svc-minio   (to apply)
#   then check logs in ArgoCD or via `kubectl logs -n minio nettest`
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nettest-lan-node-reader
  labels:
    platform.capstone/component: platform
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nettest-lan-node-reader
  labels:
    platform.capstone/component: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nettest-lan-node-reader
subjects:
  - kind: ServiceAccount
    name: default
    namespace: minio
---
apiVersion: v1
kind: Pod
metadata:
  name: nettest-lan
  namespace: minio
  labels:
    platform.capstone/component: platform
  annotations:
    argocd.argoproj.io/sync-options: "Prune=false"   # don't auto-delete on next sync
spec:
  nodeSelector:
    kubernetes.io/hostname: capstone-n1   # run on OptiPlex to test different cross-node path
  restartPolicy: Never
  securityContext:
    runAsNonRoot: false   # netshoot needs root for some tools
  containers:
    - name: nettest
      image: nicolaka/netshoot:v0.13
      command: ["/bin/bash", "-c"]
      args:
        - |
          echo "====== NMAP LAN SUBNET 10.237.171.0/24 ======"
          nmap -p22 --open -oG - 10.237.171.0/24
          echo "====== DONE ======"
          sleep 3600
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { cpu: 100m, memory: 64Mi }
