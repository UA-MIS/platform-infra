# SealedSecret -> Secret `minio-velero-user` in the minio namespace (dr-backup).
# ACCESS_KEY / SECRET_KEY: a DEDICATED, non-root MinIO IAM user for Velero — NOT
# the root credential (least-privilege, mirrors the Harbor per-team robot-account
# pattern rather than handing every consumer the admin key). The minio-provision
# Job (statefulset.yaml dir) reads this to `mc admin user add` the user and
# `mc admin policy attach` a policy scoped to ONLY the `velero` bucket
# (GetObject/PutObject/DeleteObject/ListBucket — see minio-provision-job.yaml for
# the exact policy document). The SAME access/secret key pair is sealed a SECOND
# time for the velero namespace (platform-services/velero/sealedsecret-minio-
# credentials.yaml, AWS-ini `cloud` format) — that is the credential the Velero
# Deployment itself actually uses to talk to MinIO's S3 API. Two SealedSecrets,
# one plaintext pair, each sealed strictly to the namespace that consumes it (D-008).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: minio-velero-user
  namespace: minio
spec:
  encryptedData:
    ACCESS_KEY: 
    SECRET_KEY: 
  template:
    metadata:
      name: minio-velero-user
      namespace: minio
    type: Opaque
