# Scoped ServiceAccount the prune CronJob runs as. It holds ONLY the ClusterRole in
# rbac.yaml (get/list on CapstoneTenants + get/list/delete on the composed MR kinds) —
# no create/update/patch anywhere, so it can never mint or mutate a resource, only
# read and delete orphaned managed resources.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crossplane-mr-prune
  namespace: crossplane-system
  labels:
    platform.capstone/component: platform
