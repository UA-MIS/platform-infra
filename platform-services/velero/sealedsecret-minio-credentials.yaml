# SealedSecret -> Secret `velero-minio-credentials` in the velero namespace
# (dr-backup). Key `cloud`: the AWS-style credentials INI file the
# velero-plugin-for-aws expects (`[default]` profile, access/secret key pair) —
# Velero speaks the S3 API to MinIO through the AWS provider plugin
# (applicationsets/velero-app.yaml: credentials.existingSecret +
# backupStorageLocation[0].credential). The keys belong to a DEDICATED, non-root
# MinIO IAM user scoped to ONLY the `velero` bucket (created by the
# minio-provision Job in platform-services/minio/) — NOT the MinIO root
# credential. The SAME plaintext pair is sealed a second time for the minio
# namespace as `minio-velero-user` (platform-services/minio/sealedsecret-velero-
# user.yaml), which the provisioning Job uses to actually create this IAM user.
# Sealed for the velero namespace (strict scope, D-008).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: velero-minio-credentials
  namespace: velero
spec:
  encryptedData:
    cloud: 
  template:
    metadata:
      name: velero-minio-credentials
      namespace: velero
    type: Opaque
