# SealedSecret -> Secret `velero-repo-credentials` in the velero namespace
# (dr-backup fix, blocking review finding). This is the Kopia/restic file-system
# backup REPOSITORY ENCRYPTION PASSWORD — a completely separate concern from
# `velero-minio-credentials` above, which is the S3 access-key pair used to
# REACH the MinIO bucket. Without this Secret pre-existing, Velero silently
# creates its own `velero-repo-credentials` on first backup using the
# well-known upstream DEFAULT password `static-passw0rd`
# (https://velero.io/docs/v1.18/file-system-backup) — meaning anyone who has
# ever read Velero's source/docs can decrypt every file backed up into MinIO.
# Sealing a STRONG, randomly-generated (openssl rand -base64 32) password here
# BEFORE the velero namespace/Application ever exists means Velero finds this
# Secret already in place and uses it instead of minting the default — the
# backup store's file-system data is encrypted at rest with a secret only this
# cluster's SealedSecrets controller can decrypt.
#
# ⚠ Do not rotate this after the first backup runs: Velero ties the repository
# password to the Kopia/restic repo at creation time, so changing it after
# backups exist orphans them (same caveat as the upstream default). If rotation
# is ever required, it must accompany a full new backup repository (effectively
# starting DR history over) — see docs/operator/dr-backup.md.
#
# Sealed for the velero namespace (strict scope, D-008).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: velero-repo-credentials
  namespace: velero
spec:
  encryptedData:
    repository-password: 
  template:
    metadata:
      name: velero-repo-credentials
      namespace: velero
    type: Opaque
