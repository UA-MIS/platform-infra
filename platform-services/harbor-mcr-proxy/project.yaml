# mcr-proxy: the pull-through cache project for MCR (see kustomization.yaml).
# registryIdRef resolves the numeric registry_id from registry.yaml's Registry
# MR (same dir) — standard Crossplane cross-resource reference, avoids
# hardcoding an ID that only exists after the Registry is created. Mirrors
# harbor-dockerhub-proxy/project.yaml's registryIdRef-over-hardcoded-registryId
# reasoning exactly (see that file's comment for the full incident writeup on
# why the ref, not a literal ID, is correct here).
#
# public: true — deliberately, for the same reason as dockerhub-proxy: this
# caches images that are ALREADY public on MCR (dotnet/sdk, dotnet/aspnet),
# so every existing pull path (tenant CI runners, Kaniko build-step
# containers) can use it unauthenticated with zero new credential plumbing.
#
# forceDestroy: true — mirrors dockerhub-proxy/project.yaml: a cache project
# will be non-empty after any use, and Harbor refuses to delete a non-empty
# project without this set. No data-loss implication (reconstructible cache of
# a public upstream).
#
# vulnerabilityScanning: false — proxy-cached upstream content, not
# platform-built; scanning it is not actionable here (same call as
# dockerhub-proxy).
#
# ⚠ ADOPTING a pre-existing live object, not creating one. `mcr-proxy`
# ORIGINALLY existed as project_id=17222, registry_id=2 (created by hand on
# 2026-09-09, `GET /api/v2.0/projects/17222` confirmed both at the time).
# project_id=17222 was DESTROYED in the 2026-09-13 04:00:23Z incident (see the
# "deletionPolicy: Orphan" comment below) and RECREATED BY HAND on 2026-09-14
# during incident recovery as project_id=17226 — the id below is pinned to
# the CURRENT live project. registry_id=2 (registryIdRef: mcr) was unaffected
# — only the two Project MRs (base-images, mcr-proxy) were destroyed, not the
# Registry MRs. The external-name annotation makes the first reconcile a GET,
# adopting the hand-made project instead of a 409 create-conflict.
#
# ⚠ THE PIN IS STRUCTURALLY REQUIRED, NOT A BOOTSTRAP-ONLY CONVENIENCE — and
# it MUST be updated in git (this file) every time the live project is
# manually recreated. That is now a documented recovery step (see
# docs/operator/base-images.md's runbook — it covers mcr-proxy too, not just
# base-images), not tribal knowledge. See
# harbor-base-images/project.yaml's header comment for the full, verified
# reasoning (goharbor/terraform-provider-harbor source citations) on why this
# resource type has no name-based external-name, why a 403-on-GET never
# self-heals, and why Create has no 409-adopt fallback — all identical here,
# same resource type, same provisioner credential.
#
# ⚠ deletionPolicy: Orphan IS LORE-BEARING — DO NOT "TIDY" IT AWAY. Same
# incident and same reasoning as harbor-base-images/project.yaml (see that
# file's header comment for the full writeup, and
# docs/operator/base-images.md) — this MR was destroyed alongside base-images'
# in the 2026-09-13 04:00:23Z incident by the same mechanism (deletionPolicy
# defaulted to Delete, a recreate raced a delete, the recreate then 403'd and
# permanently stalled). TRADE-OFF ACCEPTED: a deliberate decommission of this
# project now needs a manual Harbor delete; the MR alone will not clean it up.
# Do NOT copy this onto tenant-scoped Project MRs — tenant teardown
# legitimately needs Crossplane to delete the tenant's own Harbor project.
apiVersion: project.harbor.crossplane.io/v1alpha1
kind: Project
metadata:
  name: mcr-proxy
  labels:
    platform.capstone/component: platform
  annotations:
    crossplane.io/external-name: "/projects/17226"   # RE-PIN THIS after any manual project recreate — see comment above
spec:
  deletionPolicy: Orphan   # shared platform mirror — never destroyable by MR churn; see header comment
  forProvider:
    name: mcr-proxy
    public: true
    registryIdRef:
      name: mcr
    vulnerabilityScanning: false
    forceDestroy: true
  providerConfigRef:
    name: default
