# Per-board SESSION_SECRET, generated in-cluster.
#
# WHY A GENERATOR AND NOT A VAULT KEY: every other per-board value is derived
# from the team slug, so this was the only field that would have forced a human
# (or the scaffolder) to write a secret into Vault at onboarding time — one more
# step to forget, and the step whose omission is silent (an app that boots with a
# short/blank session key does not fail readiness, it just signs cookies badly).
# Generating it here keeps the whole per-board contract at exactly ONE file in
# tenants/_boards/.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "agile-board.name" . }}-session
  labels:
    {{- include "agile-board.labels" . | nindent 4 }}
spec:
  # The app requires >= 32 chars. 64 alphanumerics is ~380 bits — generous, and
  # symbol-free so the value survives every shell/env round-trip unquoted.
  length: 64
  digits: 10
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
  secretKeys:
    - SESSION_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "agile-board.name" . }}-session
  labels:
    {{- include "agile-board.labels" . | nindent 4 }}
spec:
  # ⚠ CreatedOnce is LOAD-BEARING, not a tuning choice. Under `Periodic` the
  # generator would mint a NEW password on every refresh; the Secret would change
  # under a running pod, Reloader would restart it, and every signed-in student
  # would be silently logged out on a timer. CreatedOnce writes the Secret once
  # and never touches it again. To rotate deliberately: delete the Secret AND
  # this ExternalSecret's target, then let it re-create.
  refreshPolicy: CreatedOnce
  target:
    name: {{ include "agile-board.name" . }}-session
    creationPolicy: Owner
    deletionPolicy: Delete
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "agile-board.name" . }}-session
