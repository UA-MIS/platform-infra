# The credentials EVERY board shares, materialized per board.
#
# Reads the WHOLE Vault object `platform/agile-board` through the cluster-scoped
# `vault-backend` store, whose `external-secrets-ro` policy already grants
# `secret/data/platform/*`. `dataFrom.extract` (not named keys) means the
# Deployment can consume it with `envFrom`, so a key added in Vault reaches every
# board on the next refresh with no manifest edit — the slidedeck contract.
#
# WHY PER-BOARD AND NOT ONE SHARED SECRET: one Secret written by N board
# Applications is N owners of one object — the SharedResourceWarning dual-owner
# race this repo has hit three times (#3/#117/#123). A per-board copy of the same
# source costs a few KB and has exactly one owner.
#
# WHY `platform/...` AND NOT `tenants/<team>/...`: the tenant subtree is WRITABLE
# by students through the portal's Secrets tab (`backstage-writer` grants
# create/update/patch on secret/data/tenants/*). A shared Dex client secret and a
# shared GitHub App key must not sit where one team can overwrite them and break
# every other team's board. The tenant `vault-tenant` store structurally cannot
# read this path, which is the point.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "agile-board.name" . }}-shared
  labels:
    {{- include "agile-board.labels" . | nindent 4 }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ include "agile-board.name" . }}-shared
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.sharedVaultKey | quote }}
