# The sealed-secrets controller's PUBLIC sealing cert, exported ONCE by devops via:
#   kubeseal --controller-namespace kube-system --controller-name sealed-secrets-controller --fetch-cert
# run from an operator context (admin@capstone), NOT from the backstage pod. PUBLIC key —
# safe in git / a ConfigMap (NOT a Secret/SealedSecret).
#
# Mounted read-only into the backstage pod at /etc/backstage/sealing-cert/sealing-cert.pem
# (Helm extraVolumes/extraVolumeMounts in applicationsets/backstage-process-app.yaml) so the
# capstone:seal-secret scaffolder action runs `kubeseal --cert <this>` with ZERO controller
# egress (A2). Refresh = optional hygiene (v0.37.0 retains old keys; stale cert still seals).
# The platform.capstone/component label is applied by kustomization.yaml's labels: block.
