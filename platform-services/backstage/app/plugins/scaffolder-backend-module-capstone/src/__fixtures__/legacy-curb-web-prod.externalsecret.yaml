# VENDORED FIXTURE — DO NOT EDIT BY HAND.
# Verbatim copy of UA-MIS/curb-web .devops/chart/overlays/prod/app-secret.externalsecret.yaml
# at origin/main 5e3f9afcbc79abd042d77f61fb6c6e6c5abbc505 (2026-09-16), BEFORE the dataFrom conversion.
#
# This is the real legacy explicit-data[] shape that tenants still have in production.
# It is the regression anchor for listSecrets' backward compatibility: these tenants must
# keep working with ZERO changes to their repositories. Key NAMES only, no values —
# nothing here is secret, and nothing secret may ever be added to it.
#
# App secret — ESO ExternalSecret (ADR-030 B1, "no secret material in git").
#
# This declares the NAME + Vault POINTER only — NO value. ESO (via the per-tenant
# vault-tenant SecretStore) reads the value from Vault at
# secret/data/tenants/curb/prod/app (key APP_SECRET) and materializes the
# in-namespace Secret `curb-web-secret` (key `APP_SECRET`), which the base
# Deployment envs into APP_SECRET. This replaces the Phase-1 SealedSecret (D-006) with
# the v1 ESO model — the value lives in Vault, written by the platform or by The
# Process "Secrets" tab (PushSecret / vault kv put), never committed here.
#
# M4 ZERO-CONFIG: deletionPolicy Delete means a MISSING Vault key is NOT an error —
# the ExternalSecret stays healthy and simply creates no Secret. Combined with the
# base's `optional: true` on APP_SECRET, a freshly-scaffolded app with nothing in
# Vault still deploys (the app reports "secret loaded: false"). A team that needs the
# secret writes it to Vault and the Secret appears on the next refresh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: curb-web-secret
  namespace: curb-prod
  labels:
    app.kubernetes.io/name: curb-web
    platform.capstone/component: tenant
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-tenant
    kind: SecretStore          # the per-tenant store (NOT the ClusterSecretStore)
  target:
    name: curb-web-secret   # the k8s Secret the workload consumes
    creationPolicy: Owner
    deletionPolicy: Delete               # missing Vault key != error (M4 zero-config)
  data:
    - secretKey: "PHOTO_PUBLIC_BASE_URL"
      remoteRef:
        key: "tenants/curb/prod/app"
        property: "PHOTO_PUBLIC_BASE_URL"
    - secretKey: "R2_SECRET_ACCESS_KEY"
      remoteRef:
        key: "tenants/curb/prod/app"
        property: "R2_SECRET_ACCESS_KEY"
    - secretKey: "R2_ACCESS_KEY_ID"
      remoteRef:
        key: "tenants/curb/prod/app"
        property: "R2_ACCESS_KEY_ID"
    - secretKey: "R2_BUCKET"
      remoteRef:
        key: "tenants/curb/prod/app"
        property: "R2_BUCKET"
    - secretKey: "R2_ACCOUNT_ID"
      remoteRef:
        key: "tenants/curb/prod/app"
        property: "R2_ACCOUNT_ID"
    - secretKey: APP_SECRET
      remoteRef:
        key: tenants/curb/prod/app
        property: APP_SECRET
    # TICKETMASTER_API_KEY — the Discovery API credential the event-sync CronJob
    # reads (story `ticketmaster-sync`, D-208; base/cronjob.yaml names it as an
    # individual env var, since this chart has no `envFrom`).
    #
    # DECLARED IN ALL FOUR ENVIRONMENTS AT ONCE, AND THAT IS THE POINT. D-207:
    # MAPBOX_ACCESS_TOKEN was declared in the dev ExternalSecret only, so staging
    # and prod had nothing at their Vault path, the ref was `optional: true`, and
    # host onboarding answered 503 on production permanently with no failed pod to
    # show for it. A pointer here costs nothing when the Vault value is absent
    # (deletionPolicy: Delete means a missing key is not an error), so there is no
    # reason to add them one environment at a time and one very expensive reason
    # not to.
    #
    # THIS IS THE POINTER, NOT THE VALUE. The value is written to Vault at the
    # `key:` below through The Process "Secrets" tab, per environment, and never
    # appears in git.
    - secretKey: TICKETMASTER_API_KEY
      remoteRef:
        key: tenants/curb/prod/app
        property: TICKETMASTER_API_KEY
    # Removed 2026-09-14 — ESO fails the ENTIRE ExternalSecret on any missing Vault
    # property (SecretSyncedError, confirmed dev), which starved the sealed
    # TICKETMASTER_API_KEY. Re-add each pointer ONLY when its Vault value is actually
    # sealed (R2_* + PHOTO_PUBLIC_BASE_URL when R2 is provisioned).
    # MAPBOX_ACCESS_TOKEN is dead (D-207 removed the consumer) — do not re-add.
    # Removed here: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
    # R2_BUCKET, PHOTO_PUBLIC_BASE_URL. The pod-side secretKeyRefs for these remain
    # `optional: true` and tolerate their absence.
