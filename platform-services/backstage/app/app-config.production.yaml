# Production app-config for "The Process" (UA-MIS capstone developer portal), baked into
# the custom image. This is the source of truth for the deployed portal; the Helm values
# in applicationsets/backstage-process-app.yaml are MERGED ON TOP at deploy (so the same
# ${VAR} names must match). Secrets arrive as env vars from the `backstage-process-secrets`
# SealedSecret (devops-owned): AUTH_OIDC_CLIENT_ID, AUTH_OIDC_CLIENT_SECRET, BACKEND_SECRET,
# POSTGRES_PASSWORD (+ GITHUB_TOKEN later, M2/M4). NO plaintext secrets live in git.
#
# Interim host: process.capstone.uamishub.com (repo-wide domain convention, matches Dex,
# Harbor, ArgoCD). The Dex `process` static client + redirect URI are wired in
# platform-services/dex/configmap.yaml.
app:
  baseUrl: https://process.capstone.uamishub.com

backend:
  baseUrl: https://process.capstone.uamishub.com
  listen:
    port: 7007
  # HTTP keep-alive tuning — defense-in-depth for the sign-in "Premature close" (the
  # in-process catalog-client reuses keep-alive sockets to localhost:7007). PRIMARY cure is
  # the Node 24.16 pin (Dockerfile; Node 24.17 CVE keep-alive regression, Backstage #34651);
  # this keeps server sockets alive longer than the client reuse window. headersTimeout >
  # keepAliveTimeout (Node requirement). Mirrored into the Helm appConfig (pod loads that).
  server:
    keepAliveTimeout: { seconds: 60 }
    headersTimeout: { seconds: 65 }
  # Backend service-to-service signing key (env from the SealedSecret).
  auth:
    keys:
      - secret: ${BACKEND_SECRET}
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: https://process.capstone.uamishub.com
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # CNPG `capstone-pg` (db-tier), cut over from the bundled Bitnami postgresql subchart
  # (docs/operator/in-cluster-db-tier-runbook.md §4a). Host/user/pluginDivisionMode MUST
  # match applicationsets/backstage-process-app.yaml's Helm appConfig exactly — see the
  # comments there for why pluginDivisionMode is `schema` (the CNPG `backstage` role has
  # no CREATEDB). Password is env-injected from backstage-cnpg-db-credentials
  # (ExternalSecret, Vault path platform/db/cnpg/backstage).
  database:
    client: pg
    pluginDivisionMode: schema
    connection:
      host: capstone-pg-rw.db-tier.svc.cluster.local
      port: 5432
      user: backstage
      password: ${POSTGRES_PASSWORD}

# ── SSO via the shared Dex broker (issuer id.capstone.uamishub.com) ──────────────────
# Same broker as ArgoCD/Harbor. The OIDC provider is wired in packages/backend
# (src/modules/authOidcProcess.ts) with a custom Dex-aware sign-in resolver
# (preferred_username -> User entity, with a catalog fallback for M1). NOTE: do NOT add a
# signIn.resolvers list here — a code-defined resolver only takes effect when app-config
# carries no resolvers (config resolvers win). Org gating (UA-MIS-only) is enforced
# UPSTREAM at Dex (SEC-007); Backstage trusts the broker.
auth:
  environment: production
  session:
    secret: ${BACKEND_SECRET}
  providers:
    oidc:
      production:
        metadataUrl: https://id.capstone.uamishub.com/.well-known/openid-configuration
        clientId: ${AUTH_OIDC_CLIENT_ID}
        clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
        prompt: auto

# ── Permission framework (M2: THE SPINE) ───────────────────────────────────────────────
# Turn the permission framework ON so the custom CapstoneTeamPermissionPolicy
# (packages/backend/src/modules/permissionPolicy.ts) actually enforces. WITHOUT this the
# framework no-ops and serves every entity regardless of policy (plan R6). MUST also be
# mirrored into the Helm appConfig (the pod loads ONLY that — see the applicationset note).
permission:
  enabled: true

# ── Catalog ──────────────────────────────────────────────────────────────────────────
# M2: real GitHub-org ingestion (one Backstage Group per GitHub team, slug = <team>; one
# User per org member with spec.memberOf) replaces the M1 seed org.yaml. The ingested
# Users/Groups are what make the sign-in resolver + permission policy meaningful (a User
# carries its team memberships -> ownershipEntityRefs). The seed examples/org.yaml Location
# is REMOVED (it would re-inject the placeholder guest/guests and shadow real ingestion).
catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Template, Group, User]
  locations:
    - type: file
      target: ./examples/entities.yaml
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]
  # GitHub-org provider: ingests UA-MIS teams (-> Groups) and members (-> Users). Auth is
  # via integrations.github below (the GitHub App). Short initialDelay so the first
  # ingestion runs quickly after boot — R1: nobody can sign in until real Users exist.
  providers:
    githubOrg:
      id: production
      githubUrl: https://github.com
      orgs: ['UA-MIS']
      schedule:
        initialDelay: { seconds: 30 }
        frequency: { hours: 1 }
        timeout: { minutes: 10 }
    # GitHub Component discovery: scans repos in the UA-MIS org for a root catalog-info.yaml
    # (the scaffolder templates all ship one at repo root, e.g. this repo's own
    # ./catalog-info.yaml and every tenant repo's, github.com/UA-MIS/<appName>) and
    # registers/refreshes each as a catalog Location on a schedule. This is the DURABLE fix
    # for Component entities silently disappearing (they were previously registered once via
    # the scaffolder's catalog:register step and were lost outright in the CNPG catalog-DB
    # re-ingestion — a scheduled discovery provider self-heals instead of relying on a
    # one-off write). Auth is the SAME GitHub App as githubOrg above (integrations.github —
    # Contents:Read is already granted for the scaffolder's repo-create/commit flows, so no
    # new App permission is required). filters.branch pins to the templates' default branch.
    #
    # SEC: org-wide with NO further filter would ingest a root catalog-info.yaml from ANY of
    # the org's 363 members' repos (this org carries ~100+ old, unrelated student-capstone
    # repos going back semesters, none topic-tagged) — catalog clutter AND an entity-spoofing
    # vector (any member could commit a catalog-info.yaml claiming spec.owner:
    # group:default/<someone-else>). Two scoped provider entries instead of one org-wide one:
    #   - `tenants`: only repos carrying the `capstone-tenant` GitHub topic. All 8 scaffolder
    #     templates' publish:github step now tags new tenant repos with this topic
    #     (self-tagging, so this stays correct without a maintained allowlist); the 2
    #     existing live tenants (UA-MIS/swamiapp, UA-MIS/swami-student3) were tagged directly
    #     via `gh api repos/UA-MIS/<repo>/topics` as a one-time backfill.
    #   - `platformInfra`: this repo specifically, matched by exact name (it isn't a
    #     "tenant" and the scaffolder doesn't create it, so it can't self-tag; a name filter
    #     is fine here since platform-infra never renames).
    github:
      tenants:
        organization: 'UA-MIS'
        catalogPath: '/catalog-info.yaml'
        filters:
          branch: 'main'
          topic:
            include: ['capstone-tenant']
        schedule:
          initialDelay: { seconds: 45 }
          frequency: { hours: 1 }
          timeout: { minutes: 10 }
      platformInfra:
        organization: 'UA-MIS'
        catalogPath: '/catalog-info.yaml'
        filters:
          branch: 'main'
          repository: '^platform-infra$'
        schedule:
          initialDelay: { seconds: 50 }
          frequency: { hours: 1 }
          timeout: { minutes: 10 }

# GitHub integration: authenticates as the UA-MIS GitHub App (ua-mis-backstage). M2 uses it
# for org ingestion (Organization: Members = Read); M4's Scaffolder reuses it for repo
# create + branch protection. App auth is preferred over a PAT (scoped, rotatable, not tied
# to a person). The non-secret IDs are inlined; the two SECRET values arrive as env vars
# from the backstage-process-secrets SealedSecret (devops seals them — see README/PR):
#   GITHUB_APP_PRIVATE_KEY   — the .pem contents (multi-line)
#   GITHUB_APP_CLIENT_SECRET — the App client secret
integrations:
  github:
    - host: github.com
      apps:
        - appId: 4097147
          clientId: Iv23liRQ6d2I2mibDMbY
          clientSecret: ${GITHUB_APP_CLIENT_SECRET}
          privateKey: ${GITHUB_APP_PRIVATE_KEY}
          # Installation 141394298 on the UA-MIS org. allowedInstallationOwners scopes the
          # App to that org so credential discovery never strays to another installation.
          allowedInstallationOwners: ['UA-MIS']

# ── M3: the secrets capability (capstone:seal-secret), ESO+Vault model (ADR-030 B1) ─────
# Tells the secrets backend where to WRITE the value (Vault) + the repo-write conventions for
# the ExternalSecret declaration it commits. The value is written to Vault over the k8s-auth
# method; NOTHING secret is committed to git. DEPLOY DEPENDENCIES — ALL owned by eso-vault on
# the deploy side (confirmed): (1) a Vault `backstage-writer` k8s-auth role (audience `vault`)
# bound to a DEDICATED SA `backstage-vault-writer` in ns `backstage` (NOT the default SA) with
# policy `backstage-writer`: create/update/patch (NO read) on secret/data/tenants/* + read/list
# on secret/metadata/tenants/*; (2) the Vault CA bundle (the vault-server-tls issuing CA, same
# ESO uses) mounted at vault.caPath; (3) the Deployment serviceAccountName set to
# backstage-vault-writer + a PROJECTED serviceAccountToken volume (audience: vault) mounted at
# vault.saTokenPath — the default API-server-audience token 403s ("invalid audience"); + netpol
# egress to vault.vault.svc:8200 (paired with the vault-netpol ingress allow). SECURITY: this
# token can write ANY tenant path (coarse by design) — per-tenant authz is enforced in the
# Backstage layer (the capstone.secret.seal owner re-check, BEFORE the Vault write). These may
# need mirroring into the Helm appConfig — devops.
capstone:
  secrets:
    # PR branch name prefix for each set (branch = <prefix><key>-<env>-<timestamp>).
    defaultBranchPrefix: secrets/
    # Parent dir holding the per-env overlay dirs (dev/staging/prod; preview/pr-<n> are
    # ephemeral and out of scope for the Secrets tab).
    overlaysDir: .devops/chart/overlays
    # The ExternalSecret the M4 scaffolder ships INSIDE each overlay dir — the Secrets tab
    # UPSERTS a data[] entry into it per env (it's already a kustomization resource, so no
    # overlay edit + no kustomize load-restrictor escape). MUST match the scaffolder (#106).
    overlayEsFile: app-secret.externalsecret.yaml
    # Vault connection — the value-write path (k8s-auth -> KV-v2 PATCH).
    vault:
      addr: https://vault.vault.svc.cluster.local:8200
      mount: secret
      authMount: kubernetes
      role: backstage-writer
      # Projected SA token with audience=vault (deploy mounts a serviceAccountToken projected
      # volume here; the default API-server-audience token will NOT satisfy the Vault role).
      saTokenPath: /var/run/secrets/vault/vault-token
      caPath: /etc/backstage/vault-ca/ca.crt
  # ── Harbor provisioning (capstone:harbor-onboard) ────────────────────────────────────
  # Creates the team's Harbor PROJECT + OIDC Developer mapping at scaffold time so a fresh
  # team's first CI build can push (else `UNAUTHORIZED: project <team> not found`). The
  # action authenticates with a DEDICATED LEAST-PRIVILEGE PROVISIONER ROBOT — project-create
  # + member-add only — NOT the full harbor-admin account (admin in a web-facing backend is
  # too much blast radius). DEPLOY DEPENDENCY (devops): mint a Harbor SYSTEM robot with only
  # those two permissions and seal its username/secret into `backstage-process-secrets` as
  # HARBOR_PROVISIONER_USERNAME / HARBOR_PROVISIONER_SECRET BEFORE this image deploys (the
  # scaffolder step fails closed if they're unset). baseUrl is the in-cluster Harbor core.
  harbor:
    baseUrl: http://harbor-core.harbor.svc:80
    username: ${HARBOR_PROVISIONER_USERNAME}
    secret: ${HARBOR_PROVISIONER_SECRET}
    oidcGroupPrefix: UA-MIS
  # ── Admin Tenant Teardown page (capstone-tenants) ─────────────────────────────────────
  # De-provision a finished tenant: the backend opens a PR against the onboarding ledger repo
  # (platform-infra) removing tenants/_claims/<team>-<app>.yaml; on merge, ArgoCD prunes the
  # CapstoneTenant XR and Crossplane cascade-deletes the whole tenant (ADR-031 De-provision).
  # NO new deploy dependency: it reuses the SAME GitHub App (integrations.github) the onboarding
  # scaffolder already uses to write claims to platform-infra — that App has write to the ledger
  # repo. ADMIN-ONLY at the app layer (capstone.tenant.teardown -> the labmx admin group).
  teardown:
    infraRepoOwner: UA-MIS
    infraRepoName: platform-infra
    claimsDir: tenants/_claims
    appRepoOwner: UA-MIS
    branchPrefix: teardown/
