# ExternalSecret — Backstage's CNPG cutover DB credential (docs/operator/
# in-cluster-db-tier-runbook.md §4a). Materializes a SECOND, namespace-local
# consumer of the SAME Vault value that platform-services/db-tier/
# externalsecrets.yaml's `cnpg-backstage-app-credentials` already reads
# (platform/db/cnpg/backstage) — that Secret lives in ns db-tier and a pod in ns
# backstage cannot mount it, so this is a second materialization, not a new
# credential. No new Vault policy is needed: `external-secrets-ro` already grants
# read on secret/data/platform/* (platform-services/external-secrets/
# vault-policies/eso-role.sh), and vault-backend is a ClusterSecretStore
# (cluster-scoped, usable from any namespace).
#
# The rendered key is POSTGRES_PASSWORD (uppercase — the Backstage Helm chart's
# extraEnvVarsSecrets does a bulk envFrom, so the Secret's key names become the
# pod's env var names verbatim; see applicationsets/backstage-process-app.yaml).
# That Application lists this Secret AFTER the legacy `backstage-process-secrets`
# in extraEnvVarsSecrets, so on the POSTGRES_PASSWORD key collision Kubernetes'
# "last envFrom source wins" rule makes THIS value the one the pod actually gets —
# the legacy key is deliberately left untouched in the old SealedSecret for
# instant `git revert` rollback.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-cnpg-db-credentials
  namespace: backstage
  labels:
    platform.capstone/component: platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: backstage-cnpg-db-credentials
    creationPolicy: Owner
    template:
      data:
        POSTGRES_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: platform/db/cnpg/backstage
        property: password
