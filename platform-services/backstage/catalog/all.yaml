# The Process catalog ROOT (P5) — the single Location the Backstage app-config points at
# (backstage.appConfig.catalog.locations in applicationsets/backstage-process-app.yaml).
# It fans out to the golden-path template(s) + the seed org entities. Adding a
# template = adding its template.yaml target here.
#
# NOTE: served from platform-infra so template CONTENT can be edited without
# rebuilding the custom image. The GitHub integration must be able to read this repo
# (it's public; for private repos the integration token covers it).
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: process-catalog-root
  description: The Process golden-path templates + seed org entities.
spec:
  type: url
  targets:
    # The "New Capstone Project (Zero-Touch)" Scaffolder template (ADR-031 §11 Phase 2):
    # emits ONE CapstoneTenant XR that a Crossplane Composition fans out into the full
    # tenant — no onboarding PR to merge, no operator steps. The headline IDP feature.
    # ⚠ Requires the capstone:emit-tenant-claim action in the deployed image (post-#129
    # rebuild) + a healthy Crossplane install. See templates/new-capstone-project/
    # CROSSPLANE-CUTOVER.md.
    - https://github.com/UA-MIS/platform-infra/blob/main/platform-services/backstage/templates/new-capstone-project-zerotouch/template.yaml
    -   https://github.com/UA-MIS/platform-infra/blob/main/platform-services/backstage/templates/new-project/template.yaml
    # The "New Capstone Project" Scaffolder template — the imperative PR-path (a
    # review-gated onboarding PR + operator Harbor steps). PRESERVED as the fallback
    # safety net for the zero-touch template above.
    - https://github.com/UA-MIS/platform-infra/blob/main/platform-services/backstage/templates/new-capstone-project/template.yaml
    # The "Python FastAPI API" Scaffolder template (the Python backend family, #137 P4).
    - https://github.com/UA-MIS/platform-infra/blob/main/platform-services/backstage/templates/python-fastapi-api/template.yaml
    # The "Next.js Full-stack" Scaffolder template (TypeScript + Prisma + MySQL, #143).
    - https://github.com/UA-MIS/platform-infra/blob/main/platform-services/backstage/templates/nextjs-fullstack/template.yaml
    # The "React + Express" Scaffolder template (Vite SPA + Node/Express multi-component, #144).
    - https://github.com/UA-MIS/platform-infra/blob/main/platform-services/backstage/templates/react-express/template.yaml
    # The "C# ASP.NET Core API" Scaffolder template (.NET 8 + EF Core + MySQL, #140).
    - https://github.com/UA-MIS/platform-infra/blob/main/platform-services/backstage/templates/dotnet-aspnet-api/template.yaml
    # The "React Static SPA" Scaffolder template (Vite, no-DB, #142).
    - https://github.com/UA-MIS/platform-infra/blob/main/platform-services/backstage/templates/react-static/template.yaml
    # The "New Capstone VM" Scaffolder template (layout: vm — a real KubeVirt VM as an
    # app, for teams that can't/won't containerize; ADR-032).
    - https://github.com/UA-MIS/platform-infra/blob/main/platform-services/backstage/templates/vm-app/template.yaml
    # Seed org entities (the platform Group that owns the templates, etc.).
    - https://github.com/UA-MIS/platform-infra/blob/main/platform-services/backstage/catalog/org.yaml
---
# Note: real team Groups + Users are ingested at go-live from the UA-MIS GitHub org
# via the GitHub org-data provider (configured in the custom image's backend; see
# README). This file only seeds the platform-owned entities the templates reference.
