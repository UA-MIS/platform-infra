# The Process catalog ROOT (P5) — the single Location the Backstage app-config points at
# (backstage.appConfig.catalog.locations in applicationsets/backstage-process-app.yaml).
# It fans out to the golden-path template(s) + the seed org entities. Adding a
# template = adding its template.yaml target here.
#
# NOTE: served from platform-infra so template CONTENT can be edited without
# rebuilding the custom image. The GitHub integration must be able to read this repo
# (it's public; for private repos the integration token covers it).
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: process-catalog-root
  description: The Process golden-path templates + seed org entities.
spec:
  type: url
  targets:
    # The "2 buttons" end-state (ADR-035 §H): the portal registers exactly two
    # scaffolder templates. The 7 legacy per-stack templates were retired here; their
    # directories remain on disk as a fallback until the per-fragment build-matrix
    # confirms every fragment builds (dir deletion is a separate follow-up PR).
    #
    # The unified "New Project" wizard — one entry point that composes the harvested
    # stack fragments (ADR-034/§G). The primary golden path.
    - https://github.com/UA-MIS/platform-infra/blob/main/platform-services/backstage/templates/new-project/template.yaml
    # The "New Capstone VM" Scaffolder template (layout: vm — a real KubeVirt VM as an
    # app, for teams that can't/won't containerize; ADR-032).
    - https://github.com/UA-MIS/platform-infra/blob/main/platform-services/backstage/templates/vm-app/template.yaml
    # Seed org entities (the platform Group that owns the templates, etc.).
    - https://github.com/UA-MIS/platform-infra/blob/main/platform-services/backstage/catalog/org.yaml
---
# Note: real team Groups + Users are ingested at go-live from the UA-MIS GitHub org
# via the GitHub org-data provider (configured in the custom image's backend; see
# README). This file only seeds the platform-owned entities the templates reference.
