# "React (Vite) Static SPA" — The Process Scaffolder template (survey #137 P5).
#
# A no-database, front-end-ONLY archetype: a single-component static SPA built with
# Vite + React + TypeScript (+ Tailwind) and served by nginx from the built dist/.
# Same golden-path contract as "New Capstone Project" (PR -> preview, merge -> dev,
# tag -> staging, manual gate -> prod) — the student only ever edits `app/` and the
# four fields in `.devops/app-metadata.yaml`; everything else is platform-managed.
#
# WHY THIS TEMPLATE: a large share of the org's capstone repos are front-end-only
# apps with NO backend and NO database, and ~90% ship without a working Dockerfile.
# This template hands them a known-good multi-stage Dockerfile (node build -> nginx,
# non-root, read-only-fs-friendly, SPA-fallback routing) so a fresh scaffold is
# first-try-green, no Docker expertise required.
#
# WHAT IT DOES (steps below) — identical to the service template except the skeleton:
#   1. fetch:template — render the ENTIRE ./skeleton (the Vite/React/TS SPA starter in
#      app/ + the SAME golden-path .devops/ contract [chart base+overlays,
#      promotion.yaml, ci/ scripts] + the .github/ CI workflow + catalog-info.yaml +
#      mkdocs/TechDocs). SELF-CONTAINED: the contract is EMBEDDED in the skeleton —
#      NO fetch:plain from an external repo, NO sample-app dependency, NO contract tag.
#      appName/team/port are substituted INTO the contract so a fresh scaffold is
#      correct for its own team/app on the first build. The GitHub-Actions workflow +
#      .devops/ci/ scripts are copyWithoutTemplating so nunjucks never mangles their
#      ${{ github.* }} / ${VAR} expressions.
#   3. publish:github — create UA-MIS/<repo>, push, set default branch + branch
#      protection (PRs only into main; no direct pushes).
#   4. catalog:register — register catalog-info.yaml so it shows up immediately.
#   4b. capstone:harbor-onboard — create the team Harbor project (+ OIDC mapping) so
#       the first CI build can push.
#   5a. capstone:render-tenant — render tenants/team-<name>/ from tenants/_template/.
#   5b. publish:github:pull-request — open the review-gated platform onboarding PR.
#
# ⚠ REQUIRES (wired at go-live — see platform-services/backstage/README.md): the
#   GitHub integration token (the UA-MIS GitHub App), the capstone:render-tenant +
#   capstone:harbor-onboard custom actions registered in the backend, and OIDC sign-in.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: react-static
  title: React (Vite) Static SPA (no database)
  description: >-
    Create a new UA-MIS capstone repo for a front-end-ONLY static SPA — Vite +
    React + TypeScript + Tailwind, served by nginx (no backend, no database).
    Pre-wired to the platform golden path (PR -> preview, merge -> dev, tag ->
    staging, manual gate -> prod) with a known-good multi-stage Dockerfile. You
    edit only `app/` and the four fields in `.devops/app-metadata.yaml`.
  tags:
    - capstone
    - golden-path
    - react
    - frontend
    - static
    - recommended
spec:
  owner: group:default/platform
  type: website

  parameters:
    - title: Your project
      required:
        - appName
        - team
        - season
        - year
      properties:
        appName:
          title: App name
          type: string
          description: >-
            Short slug for your app + repo (lowercase letters, digits, hyphens — no
            spaces, uppercase, or dots). Becomes the repo name, the Kubernetes
            workload names, and the ingress host <app-name>.<platform-domain>,
            so it MUST be a DNS-1123 label.
          # DNS-1123 label: lowercase alphanumerics + hyphens, must start AND end with
          # an alphanumeric. Same charset as a repo name, a k8s object name, and a DNS
          # hostname segment — all three derive from this one value.
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          maxLength: 30
          ui:autofocus: true
          ui:help: 'Lowercase letters, digits, and hyphens only; must start and end with a letter or digit (e.g. my-capstone-app).'
        team:
          title: Team slug
          type: string
          description: >-
            Your team's canonical slug — MUST equal your GitHub Team slug and your
            AppProject name (the platform keys per-team namespaces, RBAC, Harbor
            project, and OIDC group on this single value, D-026).
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 30
        # Cohort = Season + Year, matching the org's "Capstone {Season} {Year}" naming.
        # Two derived forms downstream (Backstage has no "computed parameter"):
        #   - DISPLAY  "Capstone {Season} {Year}"  (e.g. "Capstone Fall 2026") — PR
        #     title/body, README cohort line, catalog cohort annotation.
        #   - SLUG     "{year}-{season|lower}"      (e.g. "2026-fall") — the
        #     platform.capstone/semester LABEL value, the catalog tag, the
        #     app-metadata.yaml `semester` field, and capstone:render-tenant's input.
        #     Year-first ON PURPOSE — matches render-tenant's existing SEMESTER regex.
        season:
          title: Season
          type: string
          description: The cohort season (part of "Capstone {Season} {Year}").
          enum:
            - Spring
            - Summer
            - Fall
          default: Fall
        year:
          title: Year
          type: integer
          description: The cohort year, e.g. 2026 (part of "Capstone {Season} {Year}").
          minimum: 2020
          maximum: 2099
          default: 2026
        port:
          title: Container port
          type: integer
          description: >-
            The port nginx listens on inside the container (Service/Ingress target).
            Must be >1024 (the container runs non-root). Default 8080.
          default: 8080
          minimum: 1025
          maximum: 65535
        description:
          title: Description
          type: string
          description: One-line description of your project (shown in the catalog).
          default: A UA-MIS capstone static SPA.

    # NOTE: there is intentionally NO separate "Repository" page / repoUrl input.
    # The repo is created at github.com/UA-MIS/<appName> — owner fixed to UA-MIS and
    # the repo name IS the app name. The repoUrl is constructed inline at the publish
    # steps below. We dropped the RepoUrlPicker entirely (The Process has no `github`
    # auth provider — D-017: Dex/OIDC sign-in + the GitHub App for all API calls).

  steps:
    # 1) Render the per-team starter (the Vite/React SPA in app/ + the 4-field
    #    app-metadata.yaml + the golden-path .devops/ contract + catalog).
    #    SELF-CONTAINED: the contract is EMBEDDED in ./skeleton — NO fetch:plain. The
    #    appName/team/port values are substituted INTO the contract (registry,
    #    namespace, ingress host, image name, container port, labels) so a fresh
    #    scaffold is correct for ITS OWN team/app on the first build.
    - id: fetch-skeleton
      name: Render project skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          appName: ${{ parameters.appName }}
          team: ${{ parameters.team }}
          # Cohort in two forms: `semester` = machine SLUG (year-first, e.g. 2026-fall)
          # for the catalog tag + label; `semesterDisplay` = readable org name.
          semester: ${{ parameters.year }}-${{ parameters.season | lower }}
          semesterDisplay: Capstone ${{ parameters.season }} ${{ parameters.year }}
          port: ${{ parameters.port }}
          description: ${{ parameters.description }}
          destination: ${{ ("github.com?owner=UA-MIS&repo=" + parameters.appName) | parseRepoUrl }}
        # Ship the GitHub-Actions workflow + the .devops/ci/ shell scripts VERBATIM —
        # they use ${{ github.* }} / ${VAR}, the SAME ${{ }} nunjucks uses. The workflow
        # is the only file that strictly NEEDS this (the scripts use single-brace ${VAR},
        # nunjucks-safe) but the whole CI surface is protected belt-and-suspenders.
        #
        # ⚠ INDENTATION IS LOAD-BEARING: this key MUST be nested under `input:` (8-space
        # indent, sibling of `url:`/`values:`). At 6 spaces it is silently ignored and
        # the workflow's ${{ github.* }} crashes the render. Keep it under input.
        copyWithoutTemplating:
          - '.github/**'
          - '**/.github/**'
          - '.devops/ci/**'
          - '**/.devops/ci/**'

    # 3) Create UA-MIS/<repo>, push, protect main (PRs only — matches platform policy).
    - id: publish
      name: Publish to GitHub (UA-MIS)
      action: publish:github
      input:
        # Repo = github.com/UA-MIS/<appName> (owner fixed, name = app name; no repoUrl input).
        repoUrl: github.com?owner=UA-MIS&repo=${{ parameters.appName }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: private
        # Self-tags every new tenant repo so the catalog.providers.github 'tenants'
        # discovery provider (app-config.production.yaml / backstage-process-app.yaml)
        # picks it up via filters.topic.include — org-wide discovery with no topic
        # filter would ingest catalog-info.yaml from ANY of the org's other repos.
        topics: ['capstone-tenant']
        # Platform branch policy: PRs into main, no direct pushes.
        protectDefaultBranch: true
        requireCodeOwnerReviews: true
        # Grant repo access by GitHub TEAM (not by creator/individual): the project
        # team gets PUSH; labmx (platform staff) gets ADMIN.
        collaborators:
          - team: ${{ parameters.team }}
            access: push
          - team: labmx
            access: admin
        # No `token:` — publish:github authenticates via integrations.github (the
        # platform GitHub App), the same App used by catalog ingestion + render-tenant.

    # 4) Register the new component so it appears in The Process catalog right away.
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

    # 4b) Create the team's Harbor PROJECT (+ OIDC Developer mapping) NOW, so the
    #     team's very first CI build can push. Idempotent (already-exists is success).
    #     Authenticates with a DEDICATED least-privilege Harbor PROVISIONER ROBOT
    #     (project-create + member-add only — NOT harbor-admin). SCOPE (v1): project +
    #     OIDC mapping only; the CI PUSH robot + per-env PULL robots stay in the
    #     operator's post-merge `make harbor-*-robot` steps (the PR checklist below).
    - id: harbor-onboard
      name: Create Harbor project (team registry)
      action: capstone:harbor-onboard
      input:
        team: ${{ parameters.team }}

    # =====================================================================
    # PLATFORM SIDE — the D-049 review-gated grant path (B1 + B2).
    # The steps above created the STUDENT's own repo + the team's Harbor project.
    # The steps below open a *request* (a PR to platform-infra) that a reviewer
    # *grants* (merge) — a student must NEVER silently mint cluster RBAC/quotas. The
    # merge is the gate.
    # =====================================================================

    # 5a) Render the tenant manifests from the canonical tenants/_template/ blueprint
    #     (D-M4-2: render, do NOT fork). The _template/ files carry literal
    #     __TEAM__/__SEMESTER__ tokens, so the custom capstone:render-tenant action
    #     fetches _template/ at a pinned ref and substitutes the tokens.
    - id: render-tenant
      name: Render tenant manifests (tenants/team-<name>/)
      action: capstone:render-tenant
      input:
        templateUrl: https://github.com/UA-MIS/platform-infra/tree/main/tenants/_template
        team: ${{ parameters.team }}
        # App repo name — the tenant ApplicationSets/AppProject point repoURL/sourceRepos
        # at UA-MIS/<appName> (the repo publish:github creates). MUST be appName.
        appName: ${{ parameters.appName }}
        # SLUG form (year-first, e.g. 2026-fall) — the platform.capstone/semester LABEL
        # value, and MUST match capstone:render-tenant's SEMESTER regex (year-first).
        semester: ${{ parameters.year }}-${{ parameters.season | lower }}
        targetPath: ./tenant-pr

    # 5b) Open the PR to platform-infra adding tenants/team-<name>/. Uses the PLATFORM
    #     GitHub App token, so ANY signed-in UA-MIS member can OPEN the request; the
    #     branch-protection on platform-infra/main is the gate (only a CODEOWNER on
    #     tenants/** can MERGE). (ADR-029 §9 #1; D-049.)
    - id: tenant-pr
      name: Open platform onboarding PR (platform-infra)
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=UA-MIS&repo=platform-infra
        branchName: onboard-team-${{ parameters.team }}
        targetBranchName: main
        title: "onboard tenant: team-${{ parameters.team }} (Capstone ${{ parameters.season }} ${{ parameters.year }})"
        sourcePath: ./tenant-pr
        # B2 — the operator onboarding CHECKLIST is the PR body. Every Harbor command
        # shows TARGET=real-talos explicitly (lesson #1). The non-empty-seal guard
        # (lesson #6) is baked into each seal command so a duplicate-robot 409 can never
        # commit an empty SealedSecret.
        description: |
          ## Tenant onboarding request — `team-${{ parameters.team }}` (Capstone ${{ parameters.season }} ${{ parameters.year }})

          Scaffolded by **The Process** ("React (Vite) Static SPA") for app
          **${{ parameters.appName }}** (repo: ${{ steps['publish'].output.remoteUrl }}).

          This PR adds `tenants/team-${{ parameters.team }}/` (rendered from the
          canonical `tenants/_template/` blueprint — namespaces, AppProject, RBAC,
          quotas, env + preview ApplicationSets). **Merging is the grant**: on merge
          the `tenants-appset` git generator reconciles the team's namespaces and
          ApplicationSets. No cluster RBAC/quota is created until a reviewer merges.

          ---

          ### Reviewer checklist
          - [ ] Manifests render cleanly (`make validate` on `tenants/team-${{ parameters.team }}/`).
          - [ ] AppProject is team-scoped (empty `clusterResourceWhitelist`; destinations limited to `team-${{ parameters.team }}-*`).
          - [ ] `__TEAM__`/`__SEMESTER__` fully substituted (no leftover tokens).

          ### Operator steps (run AFTER merge — imperative Harbor robot provisioning)
          The Harbor **project** + OIDC Developer mapping were already created at
          scaffold time by The Process (`capstone:harbor-onboard`), so the team's
          repo can build immediately. These remaining steps mint the **robot tokens**,
          which are Harbor-generated, one-time, and **cannot** be expressed
          declaratively, so an operator runs them post-merge.
          **Run them with `TARGET=real-talos` exactly as shown** (omitting `TARGET`
          seals the wrong registry host → push/pull 403). All seals use the
          non-empty guard so a duplicate-robot 409 never commits an empty secret.

          ```bash
          # 0) cluster context (Talos)
          export KUBECONFIG=clusters/real-talos/talos-kubeconfig

          # 1) (idempotent) Harbor project + OIDC mapping — already done at scaffold time
          #    by capstone:harbor-onboard; safe re-run (409 = already exists).
          make harbor-onboard NAME=${{ parameters.team }} \
            TARGET=real-talos KUBE_CONTEXT=admin@capstone

          # 2) CI PUSH robot -> sealed `harbor-push` into arc-runners (guarded write)
          make harbor-push-robot NAME=${{ parameters.team }} \
            TARGET=real-talos KUBE_CONTEXT=admin@capstone \
            > /tmp/${{ parameters.team }}-push.yaml \
            && test -s /tmp/${{ parameters.team }}-push.yaml \
            && grep -q 'kind: SealedSecret' /tmp/${{ parameters.team }}-push.yaml \
            && mv /tmp/${{ parameters.team }}-push.yaml \
                  tenants/team-${{ parameters.team }}/harbor-push-sealed.yaml

          # 3) per-env PULL robots -> sealed `harbor-pull` into <team>-<env> (guarded)
          for ENV in dev staging prod; do
            make harbor-robot NAME=${{ parameters.team }} ENV=$ENV \
              TARGET=real-talos KUBE_CONTEXT=admin@capstone \
              > /tmp/${{ parameters.team }}-pull-$ENV.yaml \
              && test -s /tmp/${{ parameters.team }}-pull-$ENV.yaml \
              && grep -q 'kind: SealedSecret' /tmp/${{ parameters.team }}-pull-$ENV.yaml \
              && mv /tmp/${{ parameters.team }}-pull-$ENV.yaml \
                    tenants/team-${{ parameters.team }}/harbor-pull-$ENV-sealed.yaml
          done

          # 4) commit the sealed robot secrets (a follow-up PR; tokens are one-time)
          git add tenants/team-${{ parameters.team }}/harbor-*-sealed.yaml \
            && git commit -m "harbor robots: team-${{ parameters.team }}"
          ```

          > Robot-mint automation (a merge-triggered devops action) is a planned
          > fast-follow (D-M4-1); for now these run by an operator who holds the
          > Harbor-admin/seal-controller trust (kept off the Backstage backend).
        token: ${{ secrets.GITHUB_TOKEN }}

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: Platform onboarding PR (awaiting reviewer merge)
        icon: github
        url: ${{ steps['tenant-pr'].output.remoteUrl }}
    text:
      - title: Next steps
        content: |
          Your repo **${{ parameters.appName }}** is live under UA-MIS. Now:
          1. Clone it and edit `app/` (your SPA: `npm install && npm run dev`) — leave `.devops/` alone.
          2. Open a PR -> a **preview** environment is built automatically.
          3. Merge to `main` -> **dev** auto-deploys.
          4. Tag `vX.Y.Z` -> **staging** auto-deploys; **prod** waits on the manual gate.
          Your app will be at `https://${{ parameters.appName }}.capstone.uamishub.com`
          (dev/staging add a `.dev`/`.staging` segment before the domain).

          **One thing is gated:** a **platform onboarding PR** was opened against
          `UA-MIS/platform-infra` to stand up your team's namespaces/RBAC/Harbor
          (link above). A platform reviewer must **merge** it before your app can
          deploy — your repo builds previews immediately, but dev/staging/prod wait
          on that merge + the operator's Harbor steps (listed in the PR).
