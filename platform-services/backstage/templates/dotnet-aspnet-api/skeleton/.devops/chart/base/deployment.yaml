# Workload Deployment for the sample app.
#
# Image: the `image:` field is the GitOps image-tag SEAM (§4.1). The base pins a
# placeholder; each overlay sets the registry/tag via a kustomize `images:`
# override driven by promotion.yaml (dev=main digest, staging=tag, prod=gated tag).
#
# Secret: APP_SECRET is sourced from the in-namespace Secret `${{ values.appName }}-secret`,
# which the External Secrets Operator materializes from Vault via the per-env
# app-secret ExternalSecret (ADR-030 B1). The app reads it and proves the read on "/".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.appName }}
  labels:
    app.kubernetes.io/name: ${{ values.appName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.appName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${{ values.appName }}
    spec:
      serviceAccountName: ${{ values.appName }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # SEAM: overlays override registry + tag via kustomize images:.
          image: ${{ values.appName }}:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Container port — single source is app-metadata.yaml (port: 8080).
            - name: PORT
              value: "8080"
            # Proof-of-secret-path: value injected from the ESO-materialized Secret.
            # optional: true makes this the SAME base for two cases (M4 zero-config):
            #   - APP_SECRET set in Vault -> the app-secret ExternalSecret materializes
            #     ${{ values.appName }}-secret, APP_SECRET loads, the secret path is demonstrated;
            #   - a freshly-scaffolded repo (nothing in Vault) -> the app-secret
            #     ExternalSecret (deletionPolicy: Delete) creates no Secret, the env is
            #     simply unset, the pod still starts (no CreateContainerConfigError), so a
            #     new app deploys with ZERO manual secret setup. Teams add secrets via The
            #     Process "Secrets" tab only when they need one.
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: ${{ values.appName }}-secret
                  key: APP_SECRET
                  optional: true
            # MySQL connection string for EF Core (Pomelo). Sourced from the SAME
            # ESO-materialized Secret (${{ values.appName }}-secret) under key
            # DATABASE_URL. optional: true keeps M4 zero-config: a freshly-scaffolded
            # app with nothing in Vault still starts (the app reports the DB as
            # unconfigured; /healthz + /api/health stay up). Add a DATABASE_URL secret
            # via The Process "Secrets" tab to wire MySQL. Program.cs reads this env.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${{ values.appName }}-secret
                  key: DATABASE_URL
                  optional: true
            # Run the framework in Production mode in-cluster (Swagger UI is dev-only).
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            # .NET writes to TMPDIR (diagnostics off via DOTNET_EnableDiagnostics in the
            # Dockerfile, but EF/runtime still use /tmp). The rootfs is read-only, so an
            # emptyDir is mounted at /tmp (see volumes below) and TMPDIR points at it.
            - name: TMPDIR
              value: "/tmp"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          # startupProbe GATES the liveness probe until the app has actually come up.
          # Slow cold starts (a JVM backend under the 500m CPU limit takes 18-26s to
          # serve /healthz) otherwise eat one liveness SIGTERM (exit 143) restart on
          # every new pod. failureThreshold 30 x periodSeconds 2 allows up to 60s of
          # startup with fast (2s) detection; liveness (below) only starts counting
          # after the first startup success.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 10
          resources:
            # Sized for the .NET 8 runtime (heavier baseline RSS than the Go starter).
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Writable temp dir for the .NET runtime under the read-only root fs.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
