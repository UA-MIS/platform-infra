# "C# ASP.NET Core Web API" — a language-specialized GOLDEN-PATH scaffolder.
#
# This is a SIBLING of "New Capstone Project" (new-capstone-project/template.yaml): it
# reuses the SAME proven golden-path steps (fetch the skeleton, publish to UA-MIS,
# register in the catalog, create the Harbor project, render the tenant manifests, open
# the review-gated platform onboarding PR) and the SAME embedded `.devops/` contract — it
# changes ONLY the metadata (name/title/description) and the skeleton's `app/` (a real
# ASP.NET Core .NET 8 Web API + EF Core/MySQL instead of the Go starter). Survey #137 P3:
# the C#/.NET backend family is the most durable yearly capstone stack, so it gets a
# first-class, single-component, MySQL-wired starter.
#
# WHAT IT DOES (steps below) — identical to the golden path:
#   1. fetch:template — render the ENTIRE ./skeleton (app/ = the .NET Web API + the
#      embedded .devops/ golden-path contract [chart base+overlays, promotion.yaml, ci/
#      scripts] + the .github/ CI caller + catalog-info.yaml + mkdocs/TechDocs) with the
#      collected values. SELF-CONTAINED: the contract is EMBEDDED in the skeleton — there
#      is NO fetch:plain from an external repo. appName/team are substituted INTO the
#      contract so a fresh scaffold is correct for its own team/app on the first build.
#      The one GitHub-Actions file + the .devops/ci/ shell scripts are listed under
#      copyWithoutTemplating so nunjucks never mangles their ${{ github.* }} / ${VAR}.
#   3. publish:github — create UA-MIS/<repo>, push, set the default branch + branch
#      protection (PRs only into main; no direct pushes).
#   4. catalog:register — register the new component so it shows up in the catalog.
#   4b. capstone:harbor-onboard — create the team's Harbor project (+ OIDC Developer
#      mapping) so the first CI build can push.
#   5a. capstone:render-tenant — render tenants/team-<name>/ from tenants/_template/.
#   5b. publish:github:pull-request — open the REVIEW-GATED onboarding PR to
#      UA-MIS/platform-infra (merge = grant, D-049).
#
# ⚠ REQUIRES (wired at go-live — see platform-services/backstage/README.md): the same
#   prerequisites as new-capstone-project — the GitHub integration token (the UA-MIS
#   GitHub App with repo + admin:org), the capstone:render-tenant + capstone:harbor-onboard
#   custom actions registered in the backend, and the OIDC sign-in for the acting user.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: dotnet-aspnet-api
  title: C# ASP.NET Core Web API (.NET 8 + EF Core + MySQL)
  description: >-
    Create a new UA-MIS capstone C# ASP.NET Core (.NET 8) Web API repo, pre-wired to
    the platform golden path (PR -> preview, merge -> dev, tag -> staging, manual gate
    -> prod). Ships a real Web API starter: health + sample CRUD controllers, EF Core
    on MySQL (Pomelo), a DbContext + sample entity, and a known-good multi-stage
    Dockerfile. You edit only `app/` and the four fields in `.devops/app-metadata.yaml`.
  tags:
    - capstone
    - golden-path
    - dotnet
    - csharp
    - recommended
spec:
  owner: group:default/platform
  type: service

  parameters:
    - title: Your project
      required:
        - appName
        - team
        - season
        - year
      properties:
        appName:
          title: App name
          type: string
          description: >-
            Short slug for your app + repo (lowercase letters, digits, hyphens — no
            spaces, uppercase, or dots). Becomes the repo name, the Kubernetes
            workload names, and the ingress host <app-name>.<platform-domain>,
            so it MUST be a DNS-1123 label.
          # DNS-1123 label: lowercase alphanumerics + hyphens, must start AND end with
          # an alphanumeric (so a hyphen can't be first/last). Same charset as a repo
          # name, a k8s object name, and a DNS hostname segment — all three derive from
          # this one value, so enforce the strictest (DNS) form here.
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          maxLength: 30
          ui:autofocus: true
          ui:help: 'Lowercase letters, digits, and hyphens only; must start and end with a letter or digit (e.g. my-capstone-api).'
        team:
          title: Team slug
          type: string
          description: >-
            Your team's canonical slug — MUST equal your GitHub Team slug and your
            AppProject name (the platform keys per-team namespaces, RBAC, Harbor
            project, and OIDC group on this single value, D-026).
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 30
        # Cohort = Season + Year, matching the org's "Capstone {Season} {Year}" naming
        # (the parent-team convention used for 6+ years). These two inputs compose two
        # derived forms downstream (Backstage has no "computed parameter", so each step
        # builds what it needs inline):
        #   - DISPLAY  "Capstone {Season} {Year}"  (e.g. "Capstone Fall 2026") — the
        #     onboarding PR title/body, the README cohort line, and the catalog
        #     `capstone.uamishub.com/cohort` annotation: human-facing text only.
        #   - SLUG     "{year}-{season|lower}"      (e.g. "2026-fall") — the
        #     platform.capstone/semester LABEL value, the catalog tag, the
        #     app-metadata.yaml `semester` field, and the value passed to
        #     capstone:render-tenant. k8s label values + catalog tags forbid
        #     spaces/uppercase, so the machine form MUST be a slug; the display stays
        #     readable. NOTE: slug is year-first (`2026-fall`) ON PURPOSE — it matches
        #     render-tenant's existing SEMESTER regex so the Backstage image needs NO
        #     rebuild for this template.
        season:
          title: Season
          type: string
          description: The cohort season (part of "Capstone {Season} {Year}").
          enum:
            - Spring
            - Summer
            - Fall
          default: Fall
        year:
          title: Year
          type: integer
          description: The cohort year, e.g. 2026 (part of "Capstone {Season} {Year}").
          minimum: 2020
          maximum: 2099
          default: 2026
        port:
          title: Container port
          type: integer
          description: The port your app listens on (PORT env + Service/Ingress target).
          default: 8080
          minimum: 1
          maximum: 65535
        description:
          title: Description
          type: string
          description: One-line description of your project (shown in the catalog).
          default: A UA-MIS capstone ASP.NET Core Web API.

    # NOTE: there is intentionally NO separate "Repository" page / repoUrl input.
    # The repo is created at github.com/UA-MIS/<appName> — owner is fixed to UA-MIS and
    # the repo name IS the app name (enter once on the page above; no double-entry). The
    # repoUrl is constructed inline at the publish steps below as
    # `github.com?owner=UA-MIS&repo=${{ parameters.appName }}`. We dropped the
    # RepoUrlPicker entirely (rather than just defaulting it) because it added a redundant
    # field AND, with `requestUserCredentials`, would start a USER GitHub OAuth flow
    # (/api/auth/github/start) — but The Process has NO `github` auth provider (D-017:
    # Dex/OIDC sign-in + the GitHub App for all API calls). Repo creation runs as the
    # platform GitHub App via integrations.github (see publish:github — no token input).

  steps:
    # 1) Render the per-team starter (the .NET app/ + the 4-field app-metadata.yaml +
    #    the embedded .devops/ contract + catalog). SINGLE-COMPONENT (this template is
    #    single-component only — a .NET Web API is one deployable). The .github/ workflow
    #    and the .devops/ci/ scripts are copyWithoutTemplating (shipped VERBATIM) so
    #    nunjucks never touches their ${{ github.* }} / ${VAR} expressions.
    - id: fetch-skeleton
      name: Render project skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          appName: ${{ parameters.appName }}
          team: ${{ parameters.team }}
          # Cohort in two forms (see the season/year params above): `semester` = the
          # machine SLUG (year-first, e.g. 2026-fall) for the catalog tag + label; and
          # `semesterDisplay` = the readable org name (e.g. "Capstone Fall 2026").
          semester: ${{ parameters.year }}-${{ parameters.season | lower }}
          semesterDisplay: Capstone ${{ parameters.season }} ${{ parameters.year }}
          port: ${{ parameters.port }}
          description: ${{ parameters.description }}
          destination: ${{ ("github.com?owner=UA-MIS&repo=" + parameters.appName) | parseRepoUrl }}
        # SELF-CONTAINED CONTRACT: the golden-path `.devops/` tree (chart base + 4
        # overlays, promotion.yaml, ci/ scripts) AND the `.github/` CI workflow are
        # EMBEDDED in ./skeleton — NO `fetch:plain` from an external repo. The appName/team
        # values above are substituted INTO the contract (registry, namespace, ingress
        # host, image name, labels) so a fresh scaffold is correct for ITS OWN team/app on
        # the first build. Protect the GitHub-Actions workflow (`${{ github.* }}` — the SAME
        # `${{ }}` nunjucks uses) AND the .devops/ci/ shell scripts from nunjucks.
        #
        # ⚠ INDENTATION IS LOAD-BEARING: this key MUST be nested under `input:` (8-space
        # indent, a sibling of `url:`/`values:`) so fetch:template actually receives it. A
        # prior revision of the sibling template placed it at 6 spaces (a sibling of
        # `input:`) — nunjucks then templated EVERY file and the workflow's
        # `${{ github.* }}` crashed the render with "expected variable end". Keep it here.
        #
        # KEY NAME: `copyWithoutTemplating` is the current name; `copyWithoutRender` is the
        # older alias — BOTH are accepted by fetch:template (deployed
        # @backstage/plugin-scaffolder-backend is 4.0.1). GLOBS are matched by globby
        # (cwd = skeleton root, dot:true); both the root-relative and `**/`-prefixed forms
        # are listed so the exclusion holds regardless of subtree depth.
        copyWithoutTemplating:
          - '.github/**'
          - '**/.github/**'
          - '.devops/ci/**'
          - '**/.devops/ci/**'

    # 3) Create UA-MIS/<repo>, push, protect main (PRs only — matches platform policy).
    - id: publish
      name: Publish to GitHub (UA-MIS)
      action: publish:github
      input:
        # Repo = github.com/UA-MIS/<appName> (owner fixed, name = app name; no repoUrl input).
        repoUrl: github.com?owner=UA-MIS&repo=${{ parameters.appName }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: private
        # Platform branch policy: PRs into main, no direct pushes (mirrors the live
        # branch-protection the golden path assumes; reviewers/CI gate merges).
        protectDefaultBranch: true
        requireCodeOwnerReviews: true
        # Grant repo access by GitHub TEAM (not by creator/individual) so permissions are
        # role-based and don't depend on who clicked "create":
        #   - the project team gets PUSH (read/write — develop + open PRs, NOT admin).
        #   - labmx (platform staff) gets ADMIN (settings/protection/transfer).
        collaborators:
          - team: ${{ parameters.team }}
            access: push
          - team: labmx
            access: admin
        # No `token:` — publish:github authenticates via the configured integrations.github
        # (the platform GitHub App, sealed in backstage-process-secrets), the same App used
        # by catalog ingestion + capstone:render-tenant.

    # 4) Register the new component so it appears in The Process catalog right away.
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

    # 4b) Create the team's Harbor PROJECT (+ OIDC Developer mapping) NOW, so the
    #     team's very first CI build can push. Without this the first build fails with
    #     `UNAUTHORIZED: project <team> not found`. Idempotent (already-exists = success).
    #     SCOPE (v1): project + OIDC mapping only. The CI PUSH robot + per-env PULL robots
    #     stay in the operator's post-merge `make harbor-*-robot` steps (the robot token is
    #     Harbor-generated, one-time, and must be sealed into the cluster).
    - id: harbor-onboard
      name: Create Harbor project (team registry)
      action: capstone:harbor-onboard
      input:
        # The canonical D-026 slug: names the Harbor project AND the OIDC group suffix
        # (group = UA-MIS:<team> -> Developer). Same slug the image registry uses
        # (promotion.yaml registry: harbor.../<team>).
        team: ${{ parameters.team }}

    # =====================================================================
    # PLATFORM SIDE — the D-049 review-gated grant path (B1 + B2).
    # The steps above created the STUDENT's own repo (automatic — they own it) and
    # the team's Harbor project. The steps below open a *request* (a PR to
    # platform-infra) that a reviewer *grants* (merge) — a student must NEVER silently
    # mint cluster RBAC, quotas, or namespaces. The merge is the gate.
    # =====================================================================

    # 5a) Render the tenant manifests from the SINGLE canonical blueprint
    #     tenants/_template/ (D-M4-2: render, do NOT fork). The _template/ files carry
    #     literal __TEAM__/__SEMESTER__ tokens (the make/sed convention), NOT nunjucks
    #     ${{ }}, so the built-in fetch:template can't render them — hence the custom
    #     capstone:render-tenant action.
    - id: render-tenant
      name: Render tenant manifests (tenants/team-<name>/)
      action: capstone:render-tenant
      input:
        # Pinned platform-infra ref for the _template/ blueprint (reproducible).
        templateUrl: https://github.com/UA-MIS/platform-infra/tree/main/tenants/_template
        team: ${{ parameters.team }}
        # App repo name — the tenant ApplicationSets/AppProject point repoURL/sourceRepos
        # at UA-MIS/<appName> (the repo publish:github creates). MUST be appName.
        appName: ${{ parameters.appName }}
        # SLUG form (year-first, e.g. 2026-fall) — the platform.capstone/semester LABEL
        # value substituted into every tenant object; MUST match render-tenant's SEMESTER
        # regex (year-first).
        semester: ${{ parameters.year }}-${{ parameters.season | lower }}
        # Write the rendered tree under this workspace subdir; the PR step picks it up as
        # the PR's sourcePath.
        targetPath: ./tenant-pr

    # 5b) Open the PR to platform-infra adding tenants/team-<name>/. Uses the PLATFORM
    #     GitHub App token (the integrations.github ${GITHUB_TOKEN}), NOT a student USER
    #     OAuth token — so ANY signed-in UA-MIS member can OPEN the request. The
    #     branch-protection on platform-infra/main is the gate: they can open, only a
    #     reviewer (CODEOWNERS on tenants/**) can MERGE. (ADR-029 §9 #1; D-049.)
    - id: tenant-pr
      name: Open platform onboarding PR (platform-infra)
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=UA-MIS&repo=platform-infra
        branchName: onboard-team-${{ parameters.team }}
        targetBranchName: main
        title: "onboard tenant: team-${{ parameters.team }} (Capstone ${{ parameters.season }} ${{ parameters.year }})"
        sourcePath: ./tenant-pr
        # B2 — the operator onboarding CHECKLIST is the PR body. Every Harbor command
        # shows TARGET=real-talos explicitly (lesson #1: omitting TARGET bakes the
        # k3d-default registry host into the sealed robot -> docker auth host-mismatch ->
        # push/pull 403). The non-empty-seal guard (lesson #6) is baked into each seal
        # command so a duplicate-robot 409 can never commit an empty SealedSecret.
        description: |
          ## Tenant onboarding request — `team-${{ parameters.team }}` (Capstone ${{ parameters.season }} ${{ parameters.year }})

          Scaffolded by **The Process** ("C# ASP.NET Core Web API") for app
          **${{ parameters.appName }}** (repo: ${{ steps['publish'].output.remoteUrl }}).

          This PR adds `tenants/team-${{ parameters.team }}/` (rendered from the
          canonical `tenants/_template/` blueprint — namespaces, AppProject, RBAC,
          quotas, env + preview ApplicationSets). **Merging is the grant**: on merge
          the `tenants-appset` git generator reconciles the team's namespaces and
          ApplicationSets. No cluster RBAC/quota is created until a reviewer merges.

          ---

          ### Reviewer checklist
          - [ ] Manifests render cleanly (`make validate` on `tenants/team-${{ parameters.team }}/`).
          - [ ] AppProject is team-scoped (empty `clusterResourceWhitelist`; destinations limited to `team-${{ parameters.team }}-*`).
          - [ ] `__TEAM__`/`__SEMESTER__` fully substituted (no leftover tokens).

          ### Operator steps (run AFTER merge — imperative Harbor robot provisioning)
          The Harbor **project** + OIDC Developer mapping were already created at
          scaffold time by The Process (`capstone:harbor-onboard`), so the team's
          repo can build immediately. These remaining steps mint the **robot tokens**,
          which are Harbor-generated, one-time, and **cannot** be expressed
          declaratively, so an operator runs them post-merge. (Step 1 below is kept as
          an idempotent belt-and-suspenders — it's a no-op 409 if the project exists.)
          **Run them with `TARGET=real-talos` exactly as shown** (omitting `TARGET`
          seals the wrong registry host → push/pull 403). All seals use the
          non-empty guard so a duplicate-robot 409 never commits an empty secret.

          ```bash
          # 0) cluster context (Talos)
          export KUBECONFIG=clusters/real-talos/talos-kubeconfig

          # 1) (idempotent) Harbor project + OIDC mapping — already done at scaffold time
          #    by capstone:harbor-onboard; safe re-run (409 = already exists).
          make harbor-onboard NAME=${{ parameters.team }} \
            TARGET=real-talos KUBE_CONTEXT=admin@capstone

          # 2) CI PUSH robot -> sealed `harbor-push` into arc-runners (guarded write)
          make harbor-push-robot NAME=${{ parameters.team }} \
            TARGET=real-talos KUBE_CONTEXT=admin@capstone \
            > /tmp/${{ parameters.team }}-push.yaml \
            && test -s /tmp/${{ parameters.team }}-push.yaml \
            && grep -q 'kind: SealedSecret' /tmp/${{ parameters.team }}-push.yaml \
            && mv /tmp/${{ parameters.team }}-push.yaml \
                  tenants/team-${{ parameters.team }}/harbor-push-sealed.yaml

          # 3) per-env PULL robots -> sealed `harbor-pull` into <team>-<env> (guarded)
          for ENV in dev staging prod; do
            make harbor-robot NAME=${{ parameters.team }} ENV=$ENV \
              TARGET=real-talos KUBE_CONTEXT=admin@capstone \
              > /tmp/${{ parameters.team }}-pull-$ENV.yaml \
              && test -s /tmp/${{ parameters.team }}-pull-$ENV.yaml \
              && grep -q 'kind: SealedSecret' /tmp/${{ parameters.team }}-pull-$ENV.yaml \
              && mv /tmp/${{ parameters.team }}-pull-$ENV.yaml \
                    tenants/team-${{ parameters.team }}/harbor-pull-$ENV-sealed.yaml
          done

          # 4) commit the sealed robot secrets (a follow-up PR; tokens are one-time)
          git add tenants/team-${{ parameters.team }}/harbor-*-sealed.yaml \
            && git commit -m "harbor robots: team-${{ parameters.team }}"
          ```

          > Robot-mint automation (a merge-triggered devops action) is a planned
          > fast-follow (D-M4-1); for now these run by an operator who holds the
          > Harbor-admin/seal-controller trust (kept off the Backstage backend).
        token: ${{ secrets.GITHUB_TOKEN }}

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: Platform onboarding PR (awaiting reviewer merge)
        icon: github
        url: ${{ steps['tenant-pr'].output.remoteUrl }}
    text:
      - title: Next steps
        content: |
          Your repo **${{ parameters.appName }}** is live under UA-MIS. Now:
          1. Clone it and edit `app/` (your C# code) — leave `.devops/` alone.
          2. Run it locally: `cd app && dotnet run` (then GET http://localhost:${{ parameters.port }}/api/health).
          3. Open a PR -> a **preview** environment is built automatically.
          4. Merge to `main` -> **dev** auto-deploys.
          5. Tag `vX.Y.Z` -> **staging** auto-deploys; **prod** waits on the manual gate.
          Your app will be at `https://${{ parameters.appName }}.capstone.uamishub.com`
          (dev/staging add a `.dev`/`.staging` segment before the domain).

          **Database:** your MySQL connection string is read from the `DATABASE_URL` env
          (materialized from your team's Vault path via the **Secrets** tab) — nothing is
          hardcoded. The app deploys fine with no DB set (it reports DB unconfigured);
          add a `DATABASE_URL` secret when you're ready. See the repo README.

          **One thing is gated:** a **platform onboarding PR** was opened against
          `UA-MIS/platform-infra` to stand up your team's namespaces/RBAC/Harbor
          (link above). A platform reviewer must **merge** it before your app can
          deploy — your repo builds previews immediately, but dev/staging/prod wait
          on that merge + the operator's Harbor steps (listed in the PR).
