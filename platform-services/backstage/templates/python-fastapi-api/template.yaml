# "Python FastAPI API" — a single-component golden-path scaffolder for the Python
# backend family (survey #137 P4). Same proven steps as "New Capstone Project"
# (single-component path): the skeleton EMBEDS the platform `.devops/` golden-path
# contract + the `.github/` CI caller verbatim, and the four-field app-metadata.yaml is
# the only knob a student sets. Only the skeleton's app/ differs: a real minimal FastAPI
# service (SQLAlchemy 2.x + MySQL) instead of the Go starter.
#
# WHAT IT DOES (steps below):
#   1. fetch:template — render the ENTIRE ./skeleton (FastAPI app/ starter + .devops/
#      golden-path contract [chart base+overlays, promotion.yaml, ci/ scripts] +
#      .github/ CI workflow + catalog-info.yaml + mkdocs/TechDocs) with the collected
#      values. SELF-CONTAINED: the contract is EMBEDDED in the skeleton — there is NO
#      fetch:plain from an external repo, NO sample-app dependency, NO contract tag.
#      appName/team are substituted INTO the contract so a fresh scaffold is correct for
#      its own team/app on the first build. The one GitHub-Actions file
#      (.github/workflows/build-and-push.yaml) + the .devops/ci/ shell scripts are listed
#      under copyWithoutTemplating so nunjucks never mangles their ${{ ... }} expressions.
#   3. publish:github — create UA-MIS/<repo>, push, set the default branch + the branch
#      protection the platform expects (PRs only into main; no direct pushes).
#   4. catalog:register — register the new component's catalog-info.yaml.
#   4b. capstone:harbor-onboard — create the team's Harbor project + OIDC mapping so the
#      first CI build can push.
#   5a. capstone:render-tenant — render tenants/team-<name>/ from the canonical
#      tenants/_template/ blueprint.
#   5b. publish:github:pull-request — open a REVIEW-GATED PR to UA-MIS/platform-infra
#      adding those tenant manifests (the merge is the grant, D-049).
#
# ⚠ REQUIRES (wired at go-live — see platform-services/backstage/README.md): the GitHub
#   App integration token (${GITHUB_TOKEN}); the capstone:render-tenant +
#   capstone:harbor-onboard custom actions registered in the backend; OIDC sign-in.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-fastapi-api
  title: Python FastAPI API (SQLAlchemy + MySQL)
  description: >-
    Create a new UA-MIS capstone Python API repo — a minimal FastAPI service
    (SQLAlchemy 2.x + MySQL via DATABASE_URL) pre-wired to the platform golden path
    (PR -> preview, merge -> dev, tag -> staging, manual gate -> prod). You edit only
    `app/` and the four fields in `.devops/app-metadata.yaml`.
  tags:
    - capstone
    - golden-path
    - python
    - fastapi
    - recommended
spec:
  owner: group:default/platform
  type: service

  parameters:
    - title: Your project
      required:
        - appName
        - team
        - season
        - year
      properties:
        appName:
          title: App name
          type: string
          description: >-
            Short slug for your app + repo (lowercase letters, digits, hyphens — no
            spaces, uppercase, or dots). Becomes the repo name, the Kubernetes
            workload names, and the ingress host <app-name>.<platform-domain>,
            so it MUST be a DNS-1123 label.
          # DNS-1123 label: lowercase alphanumerics + hyphens, must start AND end with
          # an alphanumeric (so a hyphen can't be first/last). Same charset as a repo
          # name, a k8s object name, and a DNS hostname segment — all three derive from
          # this one value, so enforce the strictest (DNS) form here.
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          maxLength: 30
          ui:autofocus: true
          ui:help: 'Lowercase letters, digits, and hyphens only; must start and end with a letter or digit (e.g. my-capstone-api).'
        team:
          title: Team slug
          type: string
          description: >-
            Your team's canonical slug — MUST equal your GitHub Team slug and your
            AppProject name (the platform keys per-team namespaces, RBAC, Harbor
            project, and OIDC group on this single value, D-026).
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 30
        # Cohort = Season + Year, matching the org's "Capstone {Season} {Year}" naming.
        # These two inputs compose two derived forms downstream (Backstage has no
        # "computed parameter", so each step builds what it needs inline):
        #   - DISPLAY  "Capstone {Season} {Year}"  (e.g. "Capstone Fall 2026")
        #   - SLUG     "{year}-{season|lower}"      (e.g. "2026-fall")
        # The slug is year-first ON PURPOSE — it matches render-tenant's existing
        # SEMESTER regex so the Backstage image needs NO rebuild for this change.
        season:
          title: Season
          type: string
          description: The cohort season (part of "Capstone {Season} {Year}").
          enum:
            - Spring
            - Summer
            - Fall
          default: Fall
        year:
          title: Year
          type: integer
          description: The cohort year, e.g. 2026 (part of "Capstone {Season} {Year}").
          minimum: 2020
          maximum: 2099
          default: 2026
        port:
          title: Container port
          type: integer
          description: The port your app listens on (PORT env + Service/Ingress target).
          default: 8080
          minimum: 1
          maximum: 65535
        description:
          title: Description
          type: string
          description: One-line description of your project (shown in the catalog).
          default: A UA-MIS capstone Python FastAPI API.

    # NOTE: there is intentionally NO separate "Repository" page / repoUrl input.
    # The repo is created at github.com/UA-MIS/<appName> — owner is fixed to UA-MIS and
    # the repo name IS the app name (enter once on the page above; no double-entry). The
    # repoUrl is constructed inline at the publish steps below as
    # `github.com?owner=UA-MIS&repo=${{ parameters.appName }}`.

  steps:
    # 1) Render the per-team starter (FastAPI app/ + the 4-field app-metadata.yaml +
    #    catalog + the EMBEDDED .devops/ golden-path contract + .github/ CI caller).
    - id: fetch-skeleton
      name: Render project skeleton (FastAPI)
      action: fetch:template
      input:
        url: ./skeleton
        values:
          appName: ${{ parameters.appName }}
          team: ${{ parameters.team }}
          # Cohort in two forms (see the season/year params above): `semester` = the
          # machine SLUG (year-first, e.g. 2026-fall) for the catalog tag + label; and
          # `semesterDisplay` = the readable org name (e.g. "Capstone Fall 2026").
          semester: ${{ parameters.year }}-${{ parameters.season | lower }}
          semesterDisplay: Capstone ${{ parameters.season }} ${{ parameters.year }}
          port: ${{ parameters.port }}
          description: ${{ parameters.description }}
          destination: ${{ ("github.com?owner=UA-MIS&repo=" + parameters.appName) | parseRepoUrl }}
        # SELF-CONTAINED CONTRACT: the golden-path `.devops/` tree (chart base + 4
        # overlays, promotion.yaml, ci/ scripts) AND the `.github/` CI workflow are
        # EMBEDDED in ./skeleton — NO `fetch:plain` from an external repo. The
        # appName/team values above are substituted INTO the contract (registry,
        # namespace, ingress host, image name, labels) so a fresh scaffold is correct
        # for ITS OWN team/app on the first build.
        #
        # Protect the GitHub-Actions workflow (`${{ github.* }}`/`${{ secrets.* }}` —
        # the SAME `${{ }}` nunjucks uses) AND the .devops/ci/ shell scripts from
        # nunjucks. ⚠ INDENTATION IS LOAD-BEARING: this key MUST be nested under
        # `input:` (a sibling of `url:`/`values:`). KEY NAME: `copyWithoutTemplating`
        # is the current name; `copyWithoutRender` is the older alias — both accepted.
        copyWithoutTemplating:
          - '.github/**'
          - '**/.github/**'
          - '.devops/ci/**'
          - '**/.devops/ci/**'

    # 3) Create UA-MIS/<repo>, push, protect main (PRs only — matches platform policy).
    - id: publish
      name: Publish to GitHub (UA-MIS)
      action: publish:github
      input:
        # Repo = github.com/UA-MIS/<appName> (owner fixed, name = app name; no repoUrl input).
        repoUrl: github.com?owner=UA-MIS&repo=${{ parameters.appName }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: private
        # Self-tags every new tenant repo so the catalog.providers.github 'tenants'
        # discovery provider (app-config.production.yaml / backstage-process-app.yaml)
        # picks it up via filters.topic.include — org-wide discovery with no topic
        # filter would ingest catalog-info.yaml from ANY of the org's other repos.
        topics: ['capstone-tenant']
        # Set the repo Actions variable RUNNER_SCALE_SET so this tenant's CI runs on ITS
        # OWN per-team runner scale-set (<team>-kaniko), which injects the tenant's own
        # harbor-push-<team> cred. Without it the workflow's `${{ vars.RUNNER_SCALE_SET ||
        # 'ua-mis-kaniko' }}` falls back to the SHARED ua-mis-kaniko runner (backstage's
        # push cred) -> `UNAUTHORIZED: action: push` to <team>/<app>. Built into
        # publish:github (@0.9.10 calls actions.createRepoVariable) — no Backstage rebuild;
        # requires the platform GitHub App to have Actions Variables: read/write. (Fix A.)
        repoVariables:
          RUNNER_SCALE_SET: ${{ parameters.team }}-kaniko
        # Platform branch policy: PRs into main, no direct pushes.
        protectDefaultBranch: true
        requireCodeOwnerReviews: true
        # Grant repo access by GitHub TEAM (not by creator/individual):
        #   - the project team gets PUSH (read/write — develop + open PRs, NOT admin).
        #   - labmx (platform staff) gets ADMIN.
        collaborators:
          - team: ${{ parameters.team }}
            access: push
          - team: labmx
            access: admin
        # No `token:` — publish:github authenticates via integrations.github (the
        # platform GitHub App), the same App used by catalog ingestion + render-tenant.

    # 4) Register the new component so it appears in The Process catalog right away.
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

    # 4b) Create the team's Harbor PROJECT (+ OIDC Developer mapping) NOW, so the team's
    #     very first CI build can push. Idempotent (already-exists is success).
    #     Authenticates with a DEDICATED least-privilege Harbor PROVISIONER ROBOT
    #     (project-create + member-add only — NOT harbor-admin).
    - id: harbor-onboard
      name: Create Harbor project (team registry)
      action: capstone:harbor-onboard
      input:
        # The canonical D-026 slug: names the Harbor project AND the OIDC group suffix.
        team: ${{ parameters.team }}

    # =====================================================================
    # PLATFORM SIDE — the D-049 review-gated grant path (B1 + B2).
    # =====================================================================

    # 5a) Render the tenant manifests from the SINGLE canonical blueprint
    #     tenants/_template/ (D-M4-2: render, do NOT fork). The _template/ files carry
    #     literal __TEAM__/__SEMESTER__ tokens, NOT nunjucks ${{ }}, so the custom
    #     capstone:render-tenant action substitutes them at a pinned ref.
    - id: render-tenant
      name: Render tenant manifests (tenants/team-<name>/)
      action: capstone:render-tenant
      input:
        # Pinned platform-infra ref for the _template/ blueprint (reproducible).
        templateUrl: https://github.com/UA-MIS/platform-infra/tree/main/tenants/_template
        team: ${{ parameters.team }}
        # App repo name — the tenant ApplicationSets/AppProject point repoURL/sourceRepos
        # at UA-MIS/<appName> (the repo publish:github creates). MUST be appName.
        appName: ${{ parameters.appName }}
        # SLUG form (year-first, e.g. 2026-fall) — the platform.capstone/semester LABEL
        # value, MUST match capstone:render-tenant's SEMESTER regex (year-first).
        semester: ${{ parameters.year }}-${{ parameters.season | lower }}
        # Write the rendered tree under this workspace subdir; the PR step picks it up.
        targetPath: ./tenant-pr

    # 5b) Open the PR to platform-infra adding tenants/team-<name>/. Uses the PLATFORM
    #     GitHub App token, NOT the student's — so ANY signed-in UA-MIS member can OPEN
    #     the request; branch-protection on platform-infra/main is the gate (only a
    #     CODEOWNERS reviewer can MERGE). (ADR-029 §9 #1; D-049.)
    - id: tenant-pr
      name: Open platform onboarding PR (platform-infra)
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=UA-MIS&repo=platform-infra
        branchName: onboard-team-${{ parameters.team }}
        targetBranchName: main
        title: "onboard tenant: team-${{ parameters.team }} (Capstone ${{ parameters.season }} ${{ parameters.year }})"
        sourcePath: ./tenant-pr
        # B2 — the operator onboarding CHECKLIST is the PR body. Every Harbor command
        # shows TARGET=real-talos explicitly (lesson #1). The non-empty-seal guard
        # (lesson #6) is baked into each seal command.
        description: |
          ## Tenant onboarding request — `team-${{ parameters.team }}` (Capstone ${{ parameters.season }} ${{ parameters.year }})

          Scaffolded by **The Process** ("Python FastAPI API") for app
          **${{ parameters.appName }}** (repo: ${{ steps['publish'].output.remoteUrl }}).

          This PR adds `tenants/team-${{ parameters.team }}/` (rendered from the
          canonical `tenants/_template/` blueprint — namespaces, AppProject, RBAC,
          quotas, env + preview ApplicationSets). **Merging is the grant**: on merge
          the `tenants-appset` git generator reconciles the team's namespaces and
          ApplicationSets. No cluster RBAC/quota is created until a reviewer merges.

          ---

          ### Reviewer checklist
          - [ ] Manifests render cleanly (`make validate` on `tenants/team-${{ parameters.team }}/`).
          - [ ] AppProject is team-scoped (empty `clusterResourceWhitelist`; destinations limited to `team-${{ parameters.team }}-*`).
          - [ ] `__TEAM__`/`__SEMESTER__` fully substituted (no leftover tokens).

          ### Operator steps (run AFTER merge — imperative Harbor robot provisioning)
          The Harbor **project** + OIDC Developer mapping were already created at
          scaffold time by The Process (`capstone:harbor-onboard`), so the team's repo
          can build immediately. These remaining steps mint the **robot tokens**, which
          are Harbor-generated, one-time, and **cannot** be expressed declaratively, so
          an operator runs them post-merge. **Run them with `TARGET=real-talos` exactly
          as shown** (omitting `TARGET` seals the wrong registry host → push/pull 403).

          ```bash
          # 0) cluster context (Talos)
          export KUBECONFIG=clusters/real-talos/talos-kubeconfig

          # 1) (idempotent) Harbor project + OIDC mapping — already done at scaffold time.
          make harbor-onboard NAME=${{ parameters.team }} \
            TARGET=real-talos KUBE_CONTEXT=admin@capstone

          # 2) CI PUSH robot -> sealed `harbor-push` into arc-runners (guarded write)
          make harbor-push-robot NAME=${{ parameters.team }} \
            TARGET=real-talos KUBE_CONTEXT=admin@capstone \
            > /tmp/${{ parameters.team }}-push.yaml \
            && test -s /tmp/${{ parameters.team }}-push.yaml \
            && grep -q 'kind: SealedSecret' /tmp/${{ parameters.team }}-push.yaml \
            && mv /tmp/${{ parameters.team }}-push.yaml \
                  tenants/team-${{ parameters.team }}/harbor-push-sealed.yaml

          # 3) per-env PULL robots -> sealed `harbor-pull` into <team>-<env> (guarded)
          for ENV in dev staging prod; do
            make harbor-robot NAME=${{ parameters.team }} ENV=$ENV \
              TARGET=real-talos KUBE_CONTEXT=admin@capstone \
              > /tmp/${{ parameters.team }}-pull-$ENV.yaml \
              && test -s /tmp/${{ parameters.team }}-pull-$ENV.yaml \
              && grep -q 'kind: SealedSecret' /tmp/${{ parameters.team }}-pull-$ENV.yaml \
              && mv /tmp/${{ parameters.team }}-pull-$ENV.yaml \
                    tenants/team-${{ parameters.team }}/harbor-pull-$ENV-sealed.yaml
          done

          # 4) commit the sealed robot secrets (a follow-up PR; tokens are one-time)
          git add tenants/team-${{ parameters.team }}/harbor-*-sealed.yaml \
            && git commit -m "harbor robots: team-${{ parameters.team }}"
          ```

          > Robot-mint automation (a merge-triggered devops action) is a planned
          > fast-follow (D-M4-1); for now these run by an operator who holds the
          > Harbor-admin/seal-controller trust (kept off the Backstage backend).
        token: ${{ secrets.GITHUB_TOKEN }}

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: Platform onboarding PR (awaiting reviewer merge)
        icon: github
        url: ${{ steps['tenant-pr'].output.remoteUrl }}
    text:
      - title: Next steps
        content: |
          Your repo **${{ parameters.appName }}** is live under UA-MIS. Now:
          1. Clone it and edit `app/` (your FastAPI code) — leave `.devops/` alone.
          2. Open a PR -> a **preview** environment is built automatically.
          3. Merge to `main` -> **dev** auto-deploys.
          4. Tag `vX.Y.Z` -> **staging** auto-deploys; **prod** waits on the manual gate.
          Your app will be at `https://${{ parameters.appName }}.capstone.uamishub.com`
          (dev/staging add a `.dev`/`.staging` segment before the domain).

          **DATABASE_URL (MySQL):** set it via the **Secrets** tab on your component
          (a `mysql+pymysql://...` DSN) — never commit credentials. Until then the app
          runs on an in-memory SQLite fallback so it boots with zero setup. See the
          repo README "Database wiring".

          **One thing is gated:** a **platform onboarding PR** was opened against
          `UA-MIS/platform-infra` to stand up your team's namespaces/RBAC/Harbor
          (link above). A platform reviewer must **merge** it before your app can
          deploy — your repo builds previews immediately, but dev/staging/prod wait
          on that merge + the operator's Harbor steps (listed in the PR).
