# App secret — ESO ExternalSecret (ADR-030 B1, "no secret material in git").
#
# This declares the NAME + Vault POINTER only — NO value. ESO (via the per-tenant
# vault-tenant SecretStore) reads the value from Vault at
# secret/data/tenants/${{ values.team }}/prod/app (key APP_SECRET) and materializes the
# in-namespace Secret `${{ values.appName }}-secret` (key `APP_SECRET`), which the base
# Deployment envs into APP_SECRET. This replaces the Phase-1 SealedSecret (D-006) with
# the v1 ESO model — the value lives in Vault, written by the platform or by The
# Process "Secrets" tab (PushSecret / vault kv put), never committed here.
#
# WHY dataFrom/extract, NOT an explicit data[] list (INCIDENT, 2026-09):
# ESO processes spec.data[] ATOMICALLY — if ANY one entry names a Vault property that is
# not set yet, ESO fails the WHOLE ExternalSecret and writes NO Secret at all, discarding
# every other key that resolved fine right along with it. That took down next-up
# staging/prod and mychef dev; curb-web staging/prod were STILL in that failed state
# (Ready=False, SecretSyncedError, 1 of 7 keys surviving) when this template was fixed.
# `dataFrom: extract` has no such all-or-nothing mode: it syncs whatever properties ARE
# present on the Vault object and simply omits what is not. It is also why there is no
# explicit entry for a bring-your-own DATABASE_URL — extract picks it up the moment a team
# writes it to this same object.
#
# M4 ZERO-CONFIG: deletionPolicy Delete means an EMPTY Vault object is not an error — the
# ExternalSecret stays healthy and simply creates no Secret. Combined with the base's
# `optional: true` on APP_SECRET, a freshly-scaffolded app with nothing in Vault still
# deploys (the app reports "secret loaded: false"). A team that needs a secret writes it to
# Vault (directly, or via the Secrets tab) and it appears on the next refresh — no manifest
# change required. (Note the limit of this: `extract` still needs the Vault OBJECT to
# exist — it is the per-PROPERTY atomicity that goes away. Tenant provisioning creates the
# object, which is why every provisioned tenant syncs clean.)
# WHY THIS ENVIRONMENT USES deletionPolicy: Retain (a change to the M4 zero-config contract)
#
# With Delete, a Vault object that becomes unreadable makes ESO DELETE the generated Secret and
# report Ready=True with reason SecretDeleted. The ExternalSecret looks healthy. Reloader
# (--reload-on-create=true) then restarts every replica into the empty state, every
# secret-backed env var in the base is `optional: true` so the pods come up Ready and serve
# 200s with NO credentials, and ArgoCD stays Synced/Healthy. Nothing anywhere turns red.
#
# THE DEFECT IS THE AMBIGUITY, NOT THE ABSENCE. Read that again before concluding that a
# missing Vault object means something bad happened. In the ORDINARY case it does not: KV-v2
# creates an object on first write, so "no object" is simply the normal state of an environment
# nobody has deployed to — and most teams work only in dev, so most staging and prod objects
# legitimately do not exist. The problem is that this benign, common state is INDISTINGUISHABLE
# from an object that was destroyed: same Ready=True, same missing Secret, same green ArgoCD.
# Delete makes the everyday case and the serious case produce identical signals, which is what
# makes the serious one invisible.
#
# Seeding the object EMPTY at onboarding (capstone:seed-vault-app-objects) is what removes the
# ambiguity: once every environment has an object, an ABSENT one means something really did
# happen to it. Retain then surfaces that as Ready=False instead of silently deleting the Secret.
#
# ORDER MATTERS. Retain WITHOUT seeding reports Ready=False for every environment nobody has
# deployed to — the single most common state on the platform — and pages about each one forever.
# Seed first; this setting is only correct behind that.
#
# Note the failure is caused by deletionPolicy, NOT by dataFrom-vs-data[]: tenants on explicit
# `data[]` go equally silent. Retain is the lever on either shape.
#
# WHAT THIS TRADES AWAY: M4 zero-config says a freshly scaffolded app deploys before anyone has
# written a secret. That rationale is real for dev and preview — nothing is written yet, and
# there is no state worth protecting — so those overlays keep Delete. It does not hold here:
# once seeding is in place an absent object in a long-lived environment is a real signal, and
# Delete would throw it away.
#
# With Retain, the last-known-good Secret is kept and the failure surfaces as Ready=False, which
# ExternalSecretSyncError (platform-services/monitoring/alerts.yaml) already pages on.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${{ values.appName }}-secret
  namespace: ${{ values.team }}-prod
  annotations:
    # The secret key NAMES this environment declares, for The Process "Secrets" tab.
    #
    # ESO does not READ this: it reconciles from `spec` only, so nothing here can change what
    # syncs or whether a sync fails. It IS copied onto the generated Secret, though — with no
    # `spec.target.template` set, ESO propagates the ExternalSecret's annotations through
    # (verified on ESO v2.6.0 against db-tier/mariadb-root-credentials, which carries a custom
    # `force-sync` annotation on both objects). That is fine HERE only because this carries key
    # NAMES, already in plaintext two lines below. NEVER put a value in an annotation.
    #
    # `dataFrom: extract` below is what actually syncs the values. Keeping display and wiring
    # separate is the point: a key can be shown in the UI without being declared as an atomic
    # `data[]` entry that could fail the whole sync.
    platform.capstone/declared-keys: ""
  labels:
    app.kubernetes.io/name: ${{ values.appName }}
    platform.capstone/component: tenant
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-tenant
    kind: SecretStore          # the per-tenant store (NOT the ClusterSecretStore)
  target:
    name: ${{ values.appName }}-secret   # the k8s Secret the workload consumes
    creationPolicy: Owner
    # Retain, NOT Delete, on a long-lived environment. This is a deliberate departure from
    # the M4 zero-config default — see the header note.
    deletionPolicy: Retain               # long-lived env: fail loudly, never silently
  dataFrom:
    - extract:
        key: tenants/${{ values.team }}/prod/app
