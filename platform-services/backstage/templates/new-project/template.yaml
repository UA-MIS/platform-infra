# "New Project" — the UNIFIED capstone scaffolder wizard (ADR-034). ONE template with a
# branching form that collapses the per-stack templates (react-express, python-fastapi-api,
# dotnet-aspnet-api, react-static, nextjs-fullstack, ...) into a single entry point. Behind
# it: COMPOSABLE LANGUAGE FRAGMENTS (../_fragments/<category>/<id>/) assembled at scaffold
# time by capstone:compose-project, plus ONE shared .devops/.github contract
# (../_fragments/_contract) — NOT N×M pre-baked combos, and NOT a contract copied per stack.
#
# BRANCHING (project type -> layout -> fragment(s) -> database):
#   web + single             -> pick one app fragment (a backend API, a static site, ...)
#   web + frontend+backend   -> pick a frontend + a backend (deployed behind one ingress:
#                               / -> frontend, /api -> backend)
#   mobile                   -> HIDDEN pre-Tuesday (F-3/D-058/FIX-5): mobile app fragment
#                               (build-artifact .ipa/.apk, NOT a k8s workload) + a backend
#                               fragment. Every mobile fragment's build workflow composes
#                               outside .github/workflows/, so GitHub Actions never runs it —
#                               no artifact ever built, silently. See the projectType comment
#                               below for the restore path; green-check.py's QUARANTINE
#                               tracks the underlying bug.
# VM workloads keep their own dedicated "New VM" template (vm-app, #149) — the second
# top-level button — because a KubeVirt VM is a fundamentally different workload than a
# container; folding it into the compose engine adds risk with no benefit (ADR-034 §VM).
#
# DATABASE: when the chosen stack reads a DB (fragment.yaml needsDB:true), the wizard offers
# host-mysql (auto-provisioned per-env per ADR-033/#146), bring-your-own (you set DATABASE_URL
# via the Secrets tab), or none — PLUS host-postgres, for the stacks that actually speak it
# (see below). The compose engine sets the tenant `database` flag + wires the DATABASE_URL
# ExternalSecret accordingly.
#
# host-postgres is offered ONLY where a fragment can actually use it (D-054, FIX-1, FIX-16/
# D-092). Two ways a fragment earns the option:
#   (a) it ships NO database code of its own — blank/bring-your-own-code, the one fragment
#       whose README documents both mysql:// and postgres:// DATABASE_URL forms; or
#   (b) it ships a REAL Postgres driver alongside its MySQL one and branches on the
#       DATABASE_URL scheme at its DSN entry point — backend/django, backend/express,
#       backend/fastapi, backend/go (FIX-16). The other 8 backend/* + all 3 needsDB
#       fullstack/* fragments remain MySQL-only (zero Postgres driver), so host-postgres
#       stays dropped for that group — exposing it there would produce green CI + a healthy
#       pod + every DB route broken at runtime, same failure mode D-054 first documented.
# This applies uniformly across all three branches that can carry a backend (single,
# frontend-backend, mobile) — a fragment's engine support does not depend on layout position.
# The Crossplane/provider-sql Postgres tier, the XRD `database: postgres` enum member, and
# composePlan.mjs's host-postgres -> postgres mapping needed no change (D-092: already a
# superset of the wizard, proven by composePlan.test.cjs's host-postgres cases) — restore the
# option for the remaining 8 MySQL-only backend/* + 3 fullstack/* once they ship a Postgres
# driver too (post-launch follow-up, same pattern). See composePlan.mjs and composeProject.ts.
#
# DOWNSTREAM: compose assembles the repo, publish/register ship it, then the ZERO-TOUCH seam
# (capstone:emit-tenant-claim -> capstone:commit-to-main, straight onto platform-infra main,
# NO PR / NO human merge) provisions the tenant. The wizard's RESOLVED database choice (compose
# output none|mysql|postgres) flows into the CapstoneTenant XR's spec.database here — ADR-035 §C/§D1 —
# replacing the imperative harbor-onboard/render-tenant/onboarding-PR trio with the same proven
# claim seam the zero-touch template already uses.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-project
  title: New Project
  # This string renders at the top of the New Project form, so it is the FIRST sentence
  # every capstone student reads about the platform. Board #205: it must name only
  # choices the form actually offers. Two clauses were removed and must not come back
  # without the feature coming back first:
  #   - "(web app or mobile app)" — the projectType enum below is [web]; mobile is
  #     quarantined (F-3/D-058, board #90) and unreachable.
  #   - "per-PR preview environments are opt-in — enable them below" — previews are
  #     DEFERRED and have never run for any tenant (docs/operator/tenant-preview-gaps.md);
  #     this actively instructed students to turn on something that does not work.
  # The GitHub-Team prerequisite is stated because the wizard silently skips granting
  # repo push access when the team does not exist yet (board #51).
  description: >-
    Create a new UA-MIS capstone project. Pick your language and framework and a database —
    The Process assembles a repo wired to the platform golden path: merge to `main` deploys
    to dev, a version tag deploys to staging, and a manual workflow promotes to prod.
    Before you start, make sure your GitHub Team already exists and everyone is in it —
    the team slug below must match it exactly.
  tags:
    - capstone
    - golden-path
    - recommended
    - unified
spec:
  owner: group:default/platform
  type: service

  parameters:
    - title: Your project
      required:
        - appName
        - team
        - season
        - year
      properties:
        appName:
          title: App name
          type: string
          description: >-
            Short slug for your app + repo (lowercase letters, digits, hyphens — no spaces,
            uppercase, or dots). Becomes the repo name, the Kubernetes workload names, and the
            ingress host <app-name>.<platform-domain>, so it MUST be a DNS-1123 label.
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          maxLength: 30
          ui:autofocus: true
          ui:help: 'Lowercase letters, digits, and hyphens only; must start and end with a letter or digit (e.g. my-capstone-app).'
        team:
          title: Team slug
          type: string
          description: >-
            Your team's canonical slug — MUST equal your GitHub Team slug and your AppProject
            name (the platform keys per-team namespaces, RBAC, Harbor project, OIDC group on
            this single value, D-026).
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 30
        season:
          title: Season
          type: string
          description: The cohort season (part of "Capstone {Season} {Year}").
          enum: [Spring, Summer, Fall]
          default: Fall
        year:
          title: Year
          type: integer
          description: The cohort year, e.g. 2026.
          minimum: 2020
          maximum: 2099
          default: 2026
        port:
          title: Container port
          type: integer
          description: The port your app listens on (PORT env + Service/Ingress target).
          default: 8080
          minimum: 1
          maximum: 65535
        description:
          title: Description
          type: string
          description: One-line description of your project (shown in the catalog).
          default: A UA-MIS capstone project.
        # NOTE: progressive delivery (canary) is NO LONGER a wizard toggle — it is an ENV-BASED
        # platform default (ADR-037). dev/staging/preview deploy a plain rolling-update
        # `Deployment`; PROD deploys a single-component web project as an auto-completing Argo
        # Rollouts canary (25% -> pause -> 50% -> pause -> 100%). This is decided entirely in the
        # shared contract's chart overlays (_fragments/_contract/.devops/chart/overlays/prod),
        # so there is nothing for the student to choose. See docs/operator/progressive-delivery.md.
        # Per-PR preview environments: DELIBERATELY NOT A WIZARD FIELD (board #169).
        # Previews are DEFERRED on security grounds by owner decision 2026-08-25 --
        # see docs/operator/tenant-preview-gaps.md and the header of
        # tenants/_template/applicationset-preview.yaml ("UNTIL B1 LANDS, PREVIEWS ARE
        # UNFENCED -- do not enable"). The missing fence is a network boundary on the one
        # environment that runs UNTRUSTED pull-request code.
        #
        # This was previously a checkbox here. Ticking it flipped spec.previewEnabled=true
        # on the emitted CapstoneTenant XR, which the Composition gates the preview
        # ApplicationSet behind (`{{- if $preview }}`) -- so the wizard offered self-service
        # activation of a capability the platform's own docs say must not be enabled. A
        # visible control that must not be used invites exactly the action it forbids, and
        # the student who ticks it has done nothing wrong. Defaulting it to false was not
        # enough: it already WAS false. The problem was reachability.
        #
        # The field is omitted rather than rendered read-only so no dead control remains.
        # capstone:emit-tenant-claim takes `previewEnabled` as an OPTIONAL zod input and
        # defaults it to false (`input.previewEnabled ?? false`, emitTenantClaim.ts), so
        # omitting it emits `previewEnabled: false` with NO action change and NO portal
        # image rebuild -- only a catalog refresh.
        #
        # RESTORE THIS FIELD ONLY AFTER the four gaps in tenant-preview-gaps.md close
        # (B1 network fencing first). Re-add the parameter AND the matching
        # `previewEnabled: ${{ parameters.previewEnabled }}` action input below.
        # Team sprint board (D-186). ON by default — this is the one wizard toggle that
        # is opt-OUT rather than opt-in, because a capstone team without a plan of record
        # is the common failure, not the rare one. Unticking it changes NOTHING else about
        # the project: the board is provisioned by a SEPARATE file in a SEPARATE directory
        # (tenants/_boards/<team>.yaml), consumed by a SEPARATE ApplicationSet, into a
        # SEPARATE platform namespace. It does not touch the CapstoneTenant claim, the
        # Composition, the team's namespaces, or any other step of this template — so a
        # project provisioned WITHOUT a board follows byte-for-byte the path it follows today.
        agileBoard:
          title: Sprint board for your team
          type: boolean
          description: >-
            Give your TEAM a sprint/story board at https://<team-slug>-agile.capstone.uamishub.com —
            work items, a kanban board, sprints, branch-on-start and PR linking, signed in with
            your UA-MIS GitHub account. One board per team (not per project): if your team
            already has one, this reuses it rather than making a second.
          default: true

    # ----------------------------------------------------------------------------------
    # What are you building? The projectType choice REVEALS the relevant follow-up fields
    # (JSON-schema dependencies + oneOf — the Backstage conditional-parameter pattern).
    #
    # MOBILE IS HIDDEN (F-3/D-058, FIX-5, catalog-refresh-only): every mobile fragment
    # composes its build workflow to <targetDir>/.mobile-ci/build.yaml, which GitHub Actions
    # never discovers (it only reads .github/workflows/ at the repo root) — so no .apk/.ipa
    # was EVER built for a mobile scaffold, silently, while the paired backend deployed and
    # CI stayed all-green (192/499 = 38% of the wizard surface). Decision: hide the option
    # rather than fix-forward pre-Tuesday — rerouting the workflow files is real work with
    # billing implications (GitHub-hosted macos-14 minutes against the org's Free-plan pool).
    # RESTORE: put 'mobile' back in the enum + enumNames below, AND remove the four mobile/*
    # entries from green-check.py's QUARANTINE dict — _tools/check_wizard_template.py's
    # mobile-quarantine-consistency check (MOB-002) enforces that second step is not
    # forgotten, failing loudly if 'mobile' is reachable while any mobile/* fragment is still
    # quarantined (which would silently re-arm the F-3 bug with no CI signal). The MOBILE
    # oneOf branch further down (`# ===================== MOBILE =====================`) is
    # untouched and still valid — it simply has no reachable path into it while 'mobile' is
    # absent here.
    # ----------------------------------------------------------------------------------
    - title: What are you building?
      required:
        - projectType
      properties:
        projectType:
          title: Project type
          type: string
          enum: [web]
          enumNames:
            - 'Web app (deployed to the cluster)'
          default: web
      dependencies:
        projectType:
          oneOf:
            # ===================== WEB =====================
            - required: [layout]
              properties:
                projectType:
                  enum: [web]
                layout:
                  title: App layout
                  type: string
                  enum: [single, frontend-backend]
                  enumNames:
                    - 'Single component (one app)'
                    - 'Frontend + backend (two components, one repo)'
                  default: single
              dependencies:
                layout:
                  oneOf:
                    # ---- web / single ----
                    # `database` is intentionally NOT required at this level — it is offered
                    # (and required) ONLY for needsDB fragments via the dependencies block
                    # below, and is absent entirely for DB-less frontend/static fragments.
                    - required: [singleFragment]
                      properties:
                        layout:
                          enum: [single]
                        singleFragment:
                          title: App stack
                          type: string
                          description: >-
                            The single-component stack to scaffold (a backend API, a
                            fullstack app, or a static site). Generated from the fragment
                            library by _tools/gen-wizard-enums.py (single slot).
                          enum:
                            - backend/django
                            - backend/dotnet-aspnet
                            - backend/express
                            - backend/fastapi
                            - backend/flask
                            - backend/go
                            - backend/laravel
                            - backend/nestjs
                            - backend/node-bare
                            - backend/rails
                            - backend/rust-axum
                            - backend/spring-boot
                            - blank/bring-your-own
                            - frontend/angular
                            - fullstack/nextjs
                            - fullstack/nuxt
                            - fullstack/sveltekit
                            - static/bare-html
                            - static/react-static
                          enumNames:
                            - 'Python / Django + DRF API (MySQL or PostgreSQL)'
                            - '.NET / ASP.NET Core API (EF Core + MySQL)'
                            - 'Node / Express API (TypeScript + MySQL or PostgreSQL)'
                            - 'Python / FastAPI API (SQLAlchemy + MySQL or PostgreSQL)'
                            - 'Python / Flask API (SQLAlchemy + MySQL)'
                            - 'Go API (Gin + MySQL or PostgreSQL)'
                            - 'PHP / Laravel API (MySQL)'
                            - 'NestJS API (TypeScript + MySQL)'
                            - 'Node.js (bare http, no framework + MySQL)'
                            - 'Ruby on Rails API (API-only, MySQL)'
                            - 'Rust / Axum API (sqlx + MySQL)'
                            - 'Java / Spring Boot API (Spring Web + JDBC + MySQL)'
                            - 'Blank / bring-your-own-code (green placeholder + Dockerfile)'
                            - 'Angular (TypeScript + Tailwind) SPA'
                            - 'Next.js Full-Stack (TypeScript + Prisma + MySQL)'
                            - 'Nuxt 3 fullstack (Vue + Nitro API + MySQL)'
                            - 'SvelteKit fullstack (Svelte + server routes + MySQL)'
                            - 'Static HTML/CSS/JS site (no framework)'
                            - 'React static site (Vite + React Router, no backend)'
                          # NO default (D-099, human directive): the app stack must be an
                          # explicit choice, never a silent pre-selection. Confirmed against
                          # the pinned @rjsf/material-ui 5.24.13 SelectWidget source
                          # (showPlaceholderOption = !multiple && schema.default === undefined)
                          # that omitting `default` here is what makes the widget render the
                          # ui:placeholder MenuItem below instead of leaving the option
                          # silently unselected-but-first-in-list.
                          ui:placeholder: 'Select an app stack…'
                      # The Database question applies ONLY to fragments whose fragment.yaml sets
                      # needsDB:true (all backend/*, all fullstack/*, and blank/bring-your-own).
                      # Frontends (frontend/angular) and static sites (static/*) never read
                      # DATABASE_URL, so the picker is HIDDEN for them. Pure rjsf schema-dependency
                      # (the `database` property exists ONLY in the needsDB branches) — no custom
                      # field extension, so this stays a catalog-refresh change (no image rebuild).
                      #
                      # FOUR groups, not two (D-054/FIX-1, FIX-16/D-092): the needsDB fragments
                      # split further because they are NOT uniformly MySQL-only.
                      #   - blank/bring-your-own ships NO database code at all (main.go +
                      #     Dockerfile + README only) — its README documents BOTH mysql:// and
                      #     postgres:// DATABASE_URL forms.
                      #   - django/express/fastapi/go ship a REAL Postgres driver alongside their
                      #     MySQL one (psycopg / pg / pgx, DSN-scheme-branched — FIX-16) — proven
                      #     under both engines with a live MariaDB and a live PostgreSQL.
                      #   - The remaining 8 backend/* + 3 fullstack/* fragments are still hardcoded
                      #     MySQL-only, so host-postgres stays dropped for that group only.
                      dependencies:
                        singleFragment:
                          oneOf:
                            # Group (a): DB-less single-app fragments — no database question offered.
                            - properties:
                                singleFragment:
                                  enum:
                                    - frontend/angular
                                    - static/bare-html
                                    - static/react-static
                            # Group (b): MySQL-only needsDB fragments — host-postgres dropped
                            # (D-054/FIX-1). These 11 hardcode a MySQL driver only; none has ever
                            # shipped a Postgres one.
                            - required: [database]
                              properties:
                                singleFragment:
                                  enum:
                                    - backend/dotnet-aspnet
                                    - backend/flask
                                    - backend/laravel
                                    - backend/nestjs
                                    - backend/node-bare
                                    - backend/rails
                                    - backend/rust-axum
                                    - backend/spring-boot
                                    - fullstack/nextjs
                                    - fullstack/nuxt
                                    - fullstack/sveltekit
                                database:
                                  title: Database
                                  type: string
                                  description: >-
                                    host-mysql auto-provisions a per-environment MySQL database for
                                    you. PostgreSQL isn't available for this stack — it ships with a
                                    MySQL driver. Pick bring-your-own if you need a different
                                    database (set DATABASE_URL yourself via the Secrets tab), or none
                                    if your app doesn't use a database.
                                  enum: [host-mysql, bring-your-own, none]
                                  enumNames:
                                    - 'Auto MySQL (host-mysql) — provisioned for you'
                                    - 'Bring your own (set DATABASE_URL in the Secrets tab)'
                                    - 'None'
                                  default: host-mysql
                            # Group (d) [FIX-16/D-092]: Postgres-capable needsDB fragments —
                            # host-postgres RESTORED. These four ship a real psycopg/pg/pgx driver
                            # and branch on the DATABASE_URL scheme at their DSN entry point, proven
                            # against a live PostgreSQL 17 (dual-engine runtime harness), so Auto
                            # PostgreSQL is a genuine, working choice for them.
                            - required: [database]
                              properties:
                                singleFragment:
                                  enum:
                                    - backend/django
                                    - backend/express
                                    - backend/fastapi
                                    - backend/go
                                database:
                                  title: Database
                                  type: string
                                  description: >-
                                    host-mysql and host-postgres each auto-provision a per-environment
                                    database for you. Pick bring-your-own if you need a different
                                    database (set DATABASE_URL yourself via the Secrets tab), or none
                                    if your app doesn't use a database. This stack ships both a MySQL
                                    and a PostgreSQL driver, so Auto PostgreSQL genuinely works here.
                                  enum: [host-mysql, host-postgres, bring-your-own, none]
                                  enumNames:
                                    - 'Auto MySQL (host-mysql) — provisioned for you'
                                    - 'Auto PostgreSQL (host-postgres) — provisioned for you'
                                    - 'Bring your own (set DATABASE_URL in the Secrets tab)'
                                    - 'None'
                                  default: host-mysql
                            # Group (c): blank/bring-your-own-code — KEEPS the full 4-way enum
                            # (D-054/FIX-1). This fragment ships no DB driver of its own (the
                            # student brings any language/framework), so host-postgres is a real,
                            # working auto-DB choice for it too.
                            - required: [database]
                              properties:
                                singleFragment:
                                  enum:
                                    - blank/bring-your-own
                                database:
                                  title: Database
                                  type: string
                                  description: >-
                                    host-mysql and host-postgres each auto-provision a per-environment
                                    database for you. Pick bring-your-own to set DATABASE_URL yourself
                                    via the Secrets tab, or none for a DB-less placeholder. Unlike most
                                    other stacks in this wizard, blank/bring-your-own-code ships no DB
                                    driver of its own, so Auto PostgreSQL genuinely works here.
                                  enum: [host-mysql, host-postgres, bring-your-own, none]
                                  enumNames:
                                    - 'Auto MySQL (host-mysql) — provisioned for you'
                                    - 'Auto PostgreSQL (host-postgres) — provisioned for you'
                                    - 'Bring your own (set DATABASE_URL in the Secrets tab)'
                                    - 'None'
                                  default: host-mysql
                    # ---- web / frontend + backend ----
                    - required: [frontendFragment, backendFragment]
                      properties:
                        layout:
                          enum: [frontend-backend]
                        frontendFragment:
                          title: Frontend
                          type: string
                          description: >-
                            The component served at "/" — a framework SPA or a plain static
                            site. Generated from the fragment library (frontend slot).
                            Talks to the backend via relative /api calls. Fullstack
                            frameworks (Next.js/Nuxt/SvelteKit) are NOT offered here — they
                            own their own API, so they only make sense as a single component.
                          enum:
                            - frontend/angular
                            - frontend/react
                            - frontend/solid
                            - frontend/vue
                            - static/bare-html
                          enumNames:
                            - 'Angular (TypeScript + Tailwind) SPA'
                            - 'React (Vite + TypeScript + Tailwind) SPA'
                            - 'SolidJS (Vite + TypeScript + Tailwind) SPA'
                            - 'Vue 3 (Vite + TypeScript + Tailwind) SPA'
                            - 'Static HTML/CSS/JS site (no framework)'
                          # NO default (D-099): see singleFragment above for the rjsf rationale.
                          ui:placeholder: 'Select a frontend…'
                        backendFragment:
                          title: Backend
                          type: string
                          description: >-
                            The API served behind "/api" (longest-prefix ingress route, no
                            prefix strip — the backend serves under /api/...). Generated
                            from the fragment library (backend slot).
                          enum:
                            - backend/django
                            - backend/dotnet-aspnet
                            - backend/express
                            - backend/fastapi
                            - backend/flask
                            - backend/go
                            - backend/laravel
                            - backend/nestjs
                            - backend/node-bare
                            - backend/rails
                            - backend/rust-axum
                            - backend/spring-boot
                          enumNames:
                            - 'Python / Django + DRF API (MySQL or PostgreSQL)'
                            - '.NET / ASP.NET Core API (EF Core + MySQL)'
                            - 'Node / Express API (TypeScript + MySQL or PostgreSQL)'
                            - 'Python / FastAPI API (SQLAlchemy + MySQL or PostgreSQL)'
                            - 'Python / Flask API (SQLAlchemy + MySQL)'
                            - 'Go API (Gin + MySQL or PostgreSQL)'
                            - 'PHP / Laravel API (MySQL)'
                            - 'NestJS API (TypeScript + MySQL)'
                            - 'Node.js (bare http, no framework + MySQL)'
                            - 'Ruby on Rails API (API-only, MySQL)'
                            - 'Rust / Axum API (sqlx + MySQL)'
                            - 'Java / Spring Boot API (Spring Web + JDBC + MySQL)'
                          # NO default (D-099): see singleFragment above for the rjsf rationale.
                          ui:placeholder: 'Select a backend…'
                      # FIX-16/D-092: the database enum is split by backendFragment, same two-way
                      # split as the single-app branch — the four Postgres-capable backends
                      # (django/express/fastapi/go) get host-postgres restored; the other 8
                      # MySQL-only backends do not (D-054). A fragment's engine support does not
                      # depend on layout position, so this mirrors the singleFragment split exactly.
                      dependencies:
                        backendFragment:
                          oneOf:
                            - required: [database]
                              properties:
                                backendFragment:
                                  enum:
                                    - backend/dotnet-aspnet
                                    - backend/flask
                                    - backend/laravel
                                    - backend/nestjs
                                    - backend/node-bare
                                    - backend/rails
                                    - backend/rust-axum
                                    - backend/spring-boot
                                database:
                                  title: Database
                                  type: string
                                  description: >-
                                    host-mysql auto-provisions a per-environment MySQL database for
                                    you. PostgreSQL isn't available for this backend — it ships with
                                    a MySQL driver. Pick bring-your-own if you need a different
                                    database (set DATABASE_URL yourself via the Secrets tab), or none
                                    if your backend doesn't use a database.
                                  enum: [host-mysql, bring-your-own, none]
                                  enumNames:
                                    - 'Auto MySQL (host-mysql) — provisioned for you'
                                    - 'Bring your own (set DATABASE_URL in the Secrets tab)'
                                    - 'None'
                                  default: host-mysql
                            - required: [database]
                              properties:
                                backendFragment:
                                  enum:
                                    - backend/django
                                    - backend/express
                                    - backend/fastapi
                                    - backend/go
                                database:
                                  title: Database
                                  type: string
                                  description: >-
                                    host-mysql and host-postgres each auto-provision a per-environment
                                    database for you. Pick bring-your-own if you need a different
                                    database (set DATABASE_URL yourself via the Secrets tab), or none
                                    if your backend doesn't use a database. This backend ships both a
                                    MySQL and a PostgreSQL driver, so Auto PostgreSQL genuinely works
                                    here.
                                  enum: [host-mysql, host-postgres, bring-your-own, none]
                                  enumNames:
                                    - 'Auto MySQL (host-mysql) — provisioned for you'
                                    - 'Auto PostgreSQL (host-postgres) — provisioned for you'
                                    - 'Bring your own (set DATABASE_URL in the Secrets tab)'
                                    - 'None'
                                  default: host-mysql
            # ===================== MOBILE =====================
            # HIDDEN, not deleted (F-3/D-058/FIX-5) — unreachable while 'mobile' is absent
            # from the projectType enum above. Left byte-for-byte valid (including FIX-16's
            # database-group split within it) so restoring the option is a one-line enum edit
            # plus the QUARANTINE cleanup named there; see the comment above projectType.
            - required: [mobileFragment, backendFragment]
              properties:
                projectType:
                  enum: [mobile]
                mobileFragment:
                  title: Mobile app
                  type: string
                  description: >-
                    The mobile app stack. Builds a signed artifact (.ipa/.apk) via a build
                    workflow — it is NOT deployed to the cluster.
                  enum:
                    - mobile/android-kotlin
                    - mobile/flutter
                    - mobile/ios-swift
                    - mobile/react-native
                  enumNames:
                    - 'Android app (Kotlin / Jetpack Compose, .apk)'
                    - 'Mobile app (Flutter / Dart, cross-platform .apk + .ipa)'
                    - 'iOS app (Swift / SwiftUI, .ipa)'
                    - 'Mobile app (React Native / Expo, cross-platform .apk + .ipa)'
                  # NO default (D-099): see singleFragment above for the rjsf rationale. Kept
                  # consistent here too even though MOBILE is currently unreachable (F-3/D-058)
                  # — this branch stays structurally valid and this is exactly the property
                  # that should not silently re-default when 'mobile' is restored.
                  ui:placeholder: 'Select a mobile app stack…'
                backendFragment:
                  title: Backend (the API your app calls)
                  type: string
                  description: >-
                    The deployed API your mobile app calls. Generated from the fragment
                    library (backend slot).
                  enum:
                    - backend/django
                    - backend/dotnet-aspnet
                    - backend/express
                    - backend/fastapi
                    - backend/flask
                    - backend/go
                    - backend/laravel
                    - backend/nestjs
                    - backend/node-bare
                    - backend/rails
                    - backend/rust-axum
                    - backend/spring-boot
                  enumNames:
                    - 'Python / Django + DRF API (MySQL or PostgreSQL)'
                    - '.NET / ASP.NET Core API (EF Core + MySQL)'
                    - 'Node / Express API (TypeScript + MySQL or PostgreSQL)'
                    - 'Python / FastAPI API (SQLAlchemy + MySQL or PostgreSQL)'
                    - 'Python / Flask API (SQLAlchemy + MySQL)'
                    - 'Go API (Gin + MySQL or PostgreSQL)'
                    - 'PHP / Laravel API (MySQL)'
                    - 'NestJS API (TypeScript + MySQL)'
                    - 'Node.js (bare http, no framework + MySQL)'
                    - 'Ruby on Rails API (API-only, MySQL)'
                    - 'Rust / Axum API (sqlx + MySQL)'
                    - 'Java / Spring Boot API (Spring Web + JDBC + MySQL)'
                  # NO default (D-099): see singleFragment above for the rjsf rationale.
                  ui:placeholder: 'Select a backend…'
              # FIX-16/D-092: the database enum is split by backendFragment, same split as the
              # other two branches — the four Postgres-capable backends (django/express/fastapi/
              # go) get host-postgres restored; the other 8 MySQL-only backends do not (D-054).
              dependencies:
                backendFragment:
                  oneOf:
                    - required: [database]
                      properties:
                        backendFragment:
                          enum:
                            - backend/dotnet-aspnet
                            - backend/flask
                            - backend/laravel
                            - backend/nestjs
                            - backend/node-bare
                            - backend/rails
                            - backend/rust-axum
                            - backend/spring-boot
                        database:
                          title: Database (for the backend)
                          type: string
                          description: >-
                            host-mysql auto-provisions a per-environment MySQL database for you.
                            PostgreSQL isn't available for this backend — it ships with a MySQL
                            driver. Pick bring-your-own if you need a different database (set
                            DATABASE_URL yourself via the Secrets tab), or none if your backend
                            doesn't use a database.
                          enum: [host-mysql, bring-your-own, none]
                          enumNames:
                            - 'Auto MySQL (host-mysql) — provisioned for you'
                            - 'Bring your own (set DATABASE_URL in the Secrets tab)'
                            - 'None'
                          default: host-mysql
                    - required: [database]
                      properties:
                        backendFragment:
                          enum:
                            - backend/django
                            - backend/express
                            - backend/fastapi
                            - backend/go
                        database:
                          title: Database (for the backend)
                          type: string
                          description: >-
                            host-mysql and host-postgres each auto-provision a per-environment
                            database for you. Pick bring-your-own if you need a different database
                            (set DATABASE_URL yourself via the Secrets tab), or none if your
                            backend doesn't use a database. This backend ships both a MySQL and a
                            PostgreSQL driver, so Auto PostgreSQL genuinely works here.
                          enum: [host-mysql, host-postgres, bring-your-own, none]
                          enumNames:
                            - 'Auto MySQL (host-mysql) — provisioned for you'
                            - 'Auto PostgreSQL (host-postgres) — provisioned for you'
                            - 'Bring your own (set DATABASE_URL in the Secrets tab)'
                            - 'None'
                          default: host-mysql

  steps:
    # 1) PREFLIGHT — fail fast + clean if `appName` collides with an existing GitHub repo,
    #    catalog entry, or tenant claim, BEFORE anything is created (the swamiapp lesson: a
    #    reused name once got PAST compose/publish and only failed at register, leaving an
    #    orphaned repo + rendered code), OR if the team already has ANY claim for this
    #    semester under a different app name (one claim per team per semester — PR #311).
    #    Read-only; throws with a clear message on collision.
    - id: preflight
      name: Check for a name collision
      action: capstone:preflight
      input:
        team: ${{ parameters.team }}
        appName: ${{ parameters.appName }}
        # SLUG form (year-first, e.g. 2026-fall) — keys the one-claim-per-team-per-semester
        # guard (PR #311); matches the semester passed downstream to render-tenant.
        semester: ${{ parameters.year }}-${{ parameters.season | lower }}

    # 2) COMPOSE — assemble the repo from the chosen fragment(s) + the ONE shared contract.
    #    This single step replaces the per-stack fetch-skeleton steps. The inactive
    #    *Fragment parameters are simply absent on the other branches (the action skips
    #    empty fragment paths). The action reads each fragment.yaml, computes
    #    .devops/components.yaml, renders the fragment skeleton(s) + the shared contract,
    #    and sets the tenant `database` flag.
    - id: compose
      name: Compose project from fragments
      action: capstone:compose-project
      input:
        # Pinned _fragments tree (reproducible; bump deliberately like any contract pin).
        fragmentsUrl: https://github.com/UA-MIS/platform-infra/tree/main/platform-services/backstage/templates/_fragments
        projectType: ${{ parameters.projectType }}
        layout: ${{ parameters.layout }}
        singleFragment: ${{ parameters.singleFragment }}
        frontendFragment: ${{ parameters.frontendFragment }}
        backendFragment: ${{ parameters.backendFragment }}
        mobileFragment: ${{ parameters.mobileFragment }}
        database: ${{ parameters.database }}
        appName: ${{ parameters.appName }}
        team: ${{ parameters.team }}
        semester: ${{ parameters.year }}-${{ parameters.season | lower }}
        semesterDisplay: Capstone ${{ parameters.season }} ${{ parameters.year }}
        port: ${{ parameters.port }}
        description: ${{ parameters.description }}
        # (progressive delivery is env-based now — decided in the chart's prod overlay, not a
        # compose input; ADR-037. Nothing to pass here.)

    # 3) Create UA-MIS/<repo>, push, protect main (PRs only — platform policy).
    - id: publish
      name: Publish to GitHub (UA-MIS)
      action: publish:github
      input:
        repoUrl: github.com?owner=UA-MIS&repo=${{ parameters.appName }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: private
        # Self-tags every new tenant repo so the catalog.providers.github 'tenants'
        # discovery provider (app-config.production.yaml / backstage-process-app.yaml)
        # picks it up via filters.topic.include — org-wide discovery with no topic
        # filter would ingest catalog-info.yaml from ANY of the org's other repos.
        topics: ['capstone-tenant']
        # Set the repo Actions variable RUNNER_SCALE_SET so this tenant's CI runs on ITS
        # OWN per-team runner scale-set (<team>-kaniko), which injects the tenant's own
        # harbor-push-<team> cred. Without it the workflow's `${{ vars.RUNNER_SCALE_SET ||
        # 'ua-mis-kaniko' }}` falls back to the SHARED ua-mis-kaniko runner (backstage's
        # push cred) -> `UNAUTHORIZED: action: push` to <team>/<app>. Built into
        # publish:github (@0.9.10 calls actions.createRepoVariable) — no Backstage rebuild;
        # requires the platform GitHub App to have Actions Variables: read/write. (Fix A.)
        repoVariables:
          RUNNER_SCALE_SET: ${{ parameters.team }}-kaniko
        protectDefaultBranch: true
        requireCodeOwnerReviews: true
        collaborators:
          - team: ${{ parameters.team }}
            access: push
          - team: labmx
            access: admin

    # 4) WAIT for GitHub to actually serve the just-pushed catalog-info.yaml before the
    #    next step reads it (FIX-19/CATALOG-001). Root cause: `register` below is
    #    Backstage's built-in catalog:register action, which performs a SYNCHRONOUS
    #    first read of catalog-info.yaml the moment it runs -- called immediately after
    #    `publish` above, this raced GitHub's own read-after-write propagation on a
    #    freshly created repo + first push + branch-protection setup, 3/3 reproducibly
    #    in the FINAL e2e report (the identical URL always registered fine on a manual
    #    retry MINUTES later -- a propagation race, not a config/content defect). This
    #    step polls the SAME file at the EXACT commit `publish` just created, with
    #    exponential backoff, so `register` never runs before GitHub can actually serve
    #    it. See waitForRepoContent.ts for the full root-cause writeup.
    - id: wait-for-content
      name: Wait for GitHub to serve catalog-info.yaml
      action: capstone:wait-for-repo-content
      input:
        repo: ${{ parameters.appName }}
        commitHash: ${{ steps['publish'].output.commitHash }}
        catalogInfoPath: '/catalog-info.yaml'

    # 5) Register the new component in the catalog.
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

    # 6) EMIT THE TENANT CLAIM — ONE CapstoneTenant XR carrying the wizard's RESOLVED
    #    database choice. THIS IS THE §C SEAM: capstone:compose-project already collapsed the
    #    wizard `database` choice (host-mysql | bring-your-own | none for every concrete-language
    #    stack; blank/bring-your-own-code alone also offers host-postgres, D-054/FIX-1 — see the
    #    file header) into the XRD's `none|mysql|postgres` enum — `mysql` for host-mysql,
    #    `postgres` for host-postgres (each only with a DB-using component), else `none`
    #    (ADR-035 §D3) — and exposed it as steps.compose.output.database. Feeding that resolved
    #    value into spec.database is what carries the DB choice through to the CapstoneTenant XR
    #    (and thus ADR-033's auto-MySQL). Writes tenants/_claims/<team>-<app>.yaml under ./claim.
    #    Replaces the imperative trio (harbor-onboard + render-tenant + review-gated onboarding
    #    PR) with the same proven claim seam the zero-touch template uses.
    - id: emit-claim
      name: Emit tenant claim (CapstoneTenant XR)
      action: capstone:emit-tenant-claim
      input:
        team: ${{ parameters.team }}
        appName: ${{ parameters.appName }}
        # SLUG form (year-first, e.g. 2026-fall) — matches the XRD `semester` pattern.
        semester: ${{ parameters.year }}-${{ parameters.season | lower }}
        port: ${{ parameters.port }}
        # previewEnabled is intentionally NOT passed (board #169). The wizard no longer
        # exposes the toggle, so there is no `parameters.previewEnabled` to forward -- and
        # forwarding a missing parameter would render an EMPTY STRING, which the action's
        # `z.boolean().optional()` rejects, failing the whole scaffold. Omitting the input
        # lets emitTenantClaim default it (`input.previewEnabled ?? false`) and emit
        # `previewEnabled: false`. Re-add this line if the field is ever restored.
        # THE SEAM (ADR-035 §C): the wizard's RESOLVED DB mode (none|mysql|postgres) from compose ->
        # spec.database on the XR -> the Composition's auto-MySQL/PostgreSQL (ADR-033). NOT
        # parameters.database (the raw 4-way choice) — compose resolves the enum mapping.
        # Requires the `database` input on capstone:emit-tenant-claim (PR #186 — must land
        # together; on the current image the input is a no-op until #186 is in the bundle).
        database: ${{ steps['compose'].output.database }}
        # Write under ./claim so the publish step (sourcePath: ./claim) lands exactly the
        # one tenants/_claims/<team>-<app>.yaml file.
        targetPath: ./claim

    # 7) Land the claim DIRECTLY on platform-infra `main` — NO PR, NO human merge (true
    #    zero-touch, ADR-031 §7 Option A(b) / ADR-035 §D7). capstone:commit-to-main PUTs the
    #    single XR file straight onto main via the platform GitHub App (on the
    #    tenants/_claims/** branch-protection bypass list). ArgoCD (platform-crossplane-claims)
    #    then syncs the XR and Crossplane reconciles the whole tenant — Harbor, Vault, the k8s
    #    tenancy fence, and (when spec.database=mysql) a per-env MariaDB.
    #
    #    This REPLACES the previous 1-click-merge claim PR (publish:github:pull-request): the
    #    installed @backstage/plugin-scaffolder-backend-module-github @0.9.10 has NO autoMerge
    #    input and NO github:pull-request:merge action (Context7-verified), so a PR could never
    #    be truly auto-merged. capstone:commit-to-main is the clean no-PR realization (already
    #    used by the new-capstone-project-zerotouch template — same seam, no drift). Auth is the
    #    SAME integrations.github App as publish:github (no token input).
    - id: commit-claim
      name: Land tenant claim on platform-infra main (zero-touch, no PR)
      action: capstone:commit-to-main
      input:
        repoUrl: github.com?owner=UA-MIS&repo=platform-infra
        branch: main
        # Repo-relative destination = the emitted claim path (tenants/_claims/<team>-<app>.yaml).
        path: ${{ steps['emit-claim'].output.claimPath }}
        # Read the emitted XR from the workspace (emit-claim wrote it under ./claim).
        sourcePath: ./claim/${{ steps['emit-claim'].output.claimPath }}
        commitMessage: "onboard tenant (zero-touch): ${{ parameters.team }}-${{ parameters.appName }} (Capstone ${{ parameters.season }} ${{ parameters.year }})"

    # 8) TEAM SPRINT BOARD (D-186) — OPTIONAL, and skipped entirely when unticked.
    #
    #    Lands ONE small file, tenants/_boards/<team>.yaml, on platform-infra main.
    #    applicationsets/agile-boards-appset.yaml (a git-files generator over that
    #    directory) turns it into one ArgoCD Application rendering the SHARED
    #    agile-board image with this team's environment. No per-team build, no
    #    per-team code, no per-team secret.
    #
    #    KEYED ON THE TEAM, NOT THE PROJECT. The filename IS the team slug, so a team
    #    cannot end up with two boards — the file either exists already or it does not.
    #    (Step 1's preflight independently allows only one claim per team per semester,
    #    so in practice the only way to reach this twice is a NEW semester, where
    #    refreshing the board's tracked repo is the behaviour you want.)
    #
    #    WHY `content:` AND NOT `sourcePath:` — the file is four lines fully determined
    #    by values already on this form, so rendering it inline keeps the whole feature
    #    a TEMPLATE-ONLY change. Nothing in the scaffolder backend image changes, which
    #    means the golden path everyone else uses cannot regress from a bad build.
    #
    #    allowedPathPrefix is narrowed to tenants/_boards/ so this step cannot write a
    #    claim, a workflow, or anything else in platform-infra even if `team` were hostile.
    - id: commit-board
      name: Give the team a sprint board
      if: ${{ parameters.agileBoard }}
      action: capstone:commit-to-main
      input:
        repoUrl: github.com?owner=UA-MIS&repo=platform-infra
        branch: main
        path: tenants/_boards/${{ parameters.team }}.yaml
        allowedPathPrefix: tenants/_boards/
        content: |
          # Sprint board for team `${{ parameters.team }}` — emitted by The Process
          # scaffolder (new-project, D-186). ONE board per TEAM; the filename is the
          # team slug, which is what makes that structural.
          #
          # Rendered by applicationsets/agile-boards-appset.yaml into the shared
          # `agile-boards` namespace, from the ONE shared image. Host is derived:
          # ${{ parameters.team }}-agile.capstone.uamishub.com
          #
          # De-provision = `git rm` this file.
          team: ${{ parameters.team }}
          repos: UA-MIS/${{ parameters.appName }}
          title: ${{ parameters.team }} Board
          accent: "#9e1b32"
        commitMessage: "board: provision sprint board for team ${{ parameters.team }} (Capstone ${{ parameters.season }} ${{ parameters.year }})"

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: Tenant claim commit (auto-provisioning)
        icon: github
        url: ${{ steps['commit-claim'].output.commitUrl }}
    text:
      - title: Next steps
        content: |
          Your repo **${{ parameters.appName }}** is live under UA-MIS. Now:
          1. Clone it and edit your code (`app/`, or `frontend/`+`backend/`) — leave `.devops/` alone.
          2. Open a PR -> CI builds and checks run (per-PR **preview** environments are not available yet).
          3. Merge to `main` -> **dev** auto-deploys.
          4. Tag `vX.Y.Z` -> **staging** auto-deploys; **prod** waits on the manual gate.
          Your app will be at `https://${{ parameters.appName }}.capstone.uamishub.com`.

          {% if parameters.agileBoard %}Your team's **sprint board** is at `https://${{ parameters.team }}-agile.capstone.uamishub.com`
          — sign in with your UA-MIS GitHub account. It is your team's board, shared across every
          project your team owns, and it takes a couple of minutes to come up on first provision.
          {% endif %}
          A **tenant claim** was committed directly to `UA-MIS/platform-infra` main (link
          above) — no PR, no merge. Everything provisions automatically from it: your team's
          namespaces, RBAC, Harbor project/robots, Vault policy, and (if you picked Auto
          MySQL) a per-env MySQL, via Crossplane. No operator steps.
