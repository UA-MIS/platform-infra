# XcodeGen spec (https://github.com/yonaskolb/XcodeGen). The Xcode project is GENERATED
# from this file at build time (`xcodegen generate`) so the fragment ships only source —
# no binary .xcodeproj to drift. The target/scheme name is fixed to `App` so the verbatim
# .mobile-ci/build.yaml can reference it; the user-facing name is CFBundleDisplayName.
name: App
options:
  bundleIdPrefix: com.uamishub.capstone
  deploymentTarget:
    iOS: "16.0"
targets:
  App:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: App-Info.plist            # generated by XcodeGen from the properties below
      properties:
        CFBundleDisplayName: "${{ values.appName }}"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Backend API base URL — read by Sources/AppConfig.swift. Mobile apps run on
        # devices, NOT same-origin with the cluster, so they must call the backend over
        # its PUBLIC ingress host. Replace with your backend fragment's public URL.
        API_BASE_URL: "https://CHANGEME-backend.capstone.uamishub.com"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uamishub.capstone.app
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
