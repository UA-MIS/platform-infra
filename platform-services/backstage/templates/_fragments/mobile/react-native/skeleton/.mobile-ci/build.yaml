# ============================================================================
# .mobile-ci/build.yaml — React Native (Expo) cross-platform build workflow.
#
# Shipped VERBATIM by the compose engine (copyWithoutTemplating); the engine installs it
# as the repo's mobile build workflow (a mobile fragment has NO Dockerfile / k8s workload).
#
# The native android/ + ios/ projects are GENERATED at build time with `expo prebuild`, so
# the repo ships only JS/TS.
#
# RUNNER PREREQ:
#   - android job: Linux `ubuntu-latest` (Android SDK preinstalled). Builds a DEBUG .apk.
#   - ios job:     macOS `macos-14` (REQUIRED for any iOS build). Does prebuild + CocoaPods
#                  + an UNSIGNED iphonesimulator build for validation.
#
# DISTRIBUTABLE artifacts: a signed iOS .ipa and a signed Android release are best produced
# with EAS Build (`eas build -p ios|android`, needs an EXPO_TOKEN secret) or by wiring
# Apple / Play signing secrets into this workflow. Then upload to TestFlight / Play.
# ============================================================================
name: mobile-build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload .apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS app (simulator, unsigned validation)
        run: |
          cd ios
          WS="$(find . -maxdepth 1 -name '*.xcworkspace' | head -1)"
          SCHEME="$(basename "$WS" .xcworkspace)"
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build \
            CODE_SIGNING_ALLOWED=NO
      # For a distributable iOS .ipa: use EAS Build (`eas build -p ios`) or archive +
      # `xcodebuild -exportArchive` with Apple signing secrets, then upload to TestFlight.
