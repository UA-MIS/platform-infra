# fragment.yaml — MOBILE FRAGMENT: cross-platform app (React Native via Expo).
#
# Mobile is a DISTINCT, BUILD-ARTIFACT category (ADR-034 §D4): this fragment produces an
# .apk (Android) and an .ipa (iOS) via a BUILD WORKFLOW (skeleton/.mobile-ci/build.yaml),
# NOT a Kubernetes Deployment. There is NO Dockerfile and NO pod/Service/Ingress. The
# compose engine, on seeing buildType: mobile-artifact, EXCLUDES this component from the
# chart and the Kaniko build matrix, records it in components.yaml, and installs the
# .mobile-ci/ workflow.
#
# A mobile project's BACKEND is a NORMAL backend fragment (express/fastapi/dotnet),
# deployed the usual way; this app talks to it over the backend's PUBLIC ingress host
# (set via app.json -> expo.extra.apiBaseUrl or EXPO_PUBLIC_API_BASE_URL). Always composed
# WITH a backend.
apiVersion: platform.capstone/fragment.v1
id: react-native
displayName: Mobile app (React Native / Expo, cross-platform .apk + .ipa)
category: mobile
language: typescript
framework: react-native
slots:
  - mobile                         # composed alongside a backend fragment (the API it calls)
defaultPort: 0                     # N/A — a mobile app has no listening port
ingressPath: ""                   # N/A — not exposed via ingress
needsDB: false                    # the app has no DB; its BACKEND fragment may
buildType: mobile-artifact         # -> NO Deployment; produces .apk/.ipa via skeleton/.mobile-ci/
dockerfile: ""                     # NONE — mobile has no container; build workflow instead
buildWorkflow: .mobile-ci/build.yaml   # path within skeleton/ to the artifact build workflow
artifact: app-debug.apk            # primary produced artifact; iOS .ipa via EAS / signing (see notes)
healthPath: ""                     # N/A
notes: >-
  Cross-platform React Native app (Expo, TypeScript): a single screen that reads the
  backend API base URL from config (app.json -> expo.extra.apiBaseUrl, overridable via the
  EXPO_PUBLIC_API_BASE_URL env var) and calls GET {API_BASE_URL}/healthz on its backend
  fragment. The native android/ + ios/ projects are GENERATED at build time with
  `expo prebuild` (so the fragment ships only JS/TS — no native dirs). BUILD PATHS: the
  Android DEBUG .apk builds on `ubuntu-latest` (Gradle, no macOS). The iOS path REQUIRES a
  macOS runner (`macos-14`) — CI does a prebuild + CocoaPods install + an UNSIGNED
  iphonesimulator build for validation; a distributable iOS .ipa (and a signed Android
  release) is best produced with EAS Build (`eas build -p ios|android`) or by wiring Apple
  / Play signing secrets into the workflow. The app is DISTRIBUTED to devices
  (TestFlight / Play / internal), NOT hosted in the cluster. Its matching backend is a
  normal backend fragment.
