# Workloads — ONE per component in .devops/components.yaml (this file is a nunjucks loop
# the Scaffolder expanded at create time; each component yields one manifest doc separated
# by `---`). This base ALWAYS renders a plain `Deployment` (rolling update) for every
# component — it is exactly what dev / staging / preview deploy.
#
# PROGRESSIVE DELIVERY IS NOW AN ENV-BASED PLATFORM DEFAULT (no wizard toggle). The PROD
# overlay (overlays/prod) is the ONLY place a workload becomes a canary: for a
# single-component web project (values.single) it `$patch: delete`s this Deployment and adds
# overlays/prod/rollout.yaml — an Argo Rollouts `Rollout` with an auto-completing canary
# (25% -> pause 30s -> 50% -> pause 30s -> 100%). Same container spec / selector / pod
# template shape, same one Service (services.yaml selects on name+component, so traffic routes
# to the Rollout's pods). dev / staging / preview keep this plain Deployment. Multi-component
# (frontend-backend / mobile) projects stay plain Deployments in EVERY env, prod included: the
# Basic Canary approximates weight via ONE Service's stable/canary ReplicaSet ratio, which is a
# single-component pattern. See docs/operator/progressive-delivery.md.
#
# Image: each container's `image:` is the GitOps image-tag SEAM (§4.1). The base pins
# a per-component placeholder `<appName>-<component>:latest`; each overlay sets the
# registry/tag via a kustomize `images:` override (one entry per component) driven by
# promotion.yaml + the CI bump (dev=main git-describe, staging/prod=semver, preview=pull-<sha>).
# In prod, where overlays/prod swaps this Deployment for a Rollout, that same overlay-driven tag
# bump is what TRIGGERS the canary: Argo Rollouts watches the pod template for a change and steps
# through `strategy.canary` instead of replacing all Pods at once.
#
# Secret: APP_SECRET is sourced from the in-namespace Secret `<appName>-secret`, which
# the External Secrets Operator materializes from Vault (ADR-030 B1). ALL components
# share the one per-env ExternalSecret/Secret (one Vault object tenants/<team>/<env>/app),
# matching the M3 Secrets-tab contract — the same `optional:true` zero-config behaviour
# as the single-component chart.
#
# Selectors: each workload selects ONLY its own pods via app.kubernetes.io/component,
# so the N Deployments/Services never cross-bind.
{%- for c in values.components %}
{%- if c.buildType != "mobile-artifact" %}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.appName }}-${{ c.name }}
  labels:
    app.kubernetes.io/name: ${{ values.appName }}
    app.kubernetes.io/component: ${{ c.name }}
  annotations:
    # Reloader (FIX-9/D-065): a rolling restart on secret CHANGE closes the
    # env-injection race above — optional:true secretKeyRefs resolve at container
    # START ONLY, so a pod that started before ESO materialized the Secret runs
    # permanently env-less (kubelet never re-resolves a running container's env).
    # Named-secret form (not reloader.stakater.com/auto, which reacts to ANY
    # Secret change in the namespace) scopes this to exactly the Secret(s) this
    # component's env actually reads, matching the mapping below.
{%- if c.needsDb and (values.database == 'mysql' or values.database == 'postgres') %}
    secret.reloader.stakater.com/reload: "${{ values.appName }}-secret,${{ values.appName }}-db"
{%- else %}
    secret.reloader.stakater.com/reload: "${{ values.appName }}-secret"
{%- endif %}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.appName }}
      app.kubernetes.io/component: ${{ c.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${{ values.appName }}
        app.kubernetes.io/component: ${{ c.name }}
    spec:
      serviceAccountName: ${{ values.appName }}
      automountServiceAccountToken: false
      # Soft (preferred) pod anti-affinity — SPREAD this component's replicas across nodes so
      # a single node failure/drain can't take the whole app down, WITHOUT hard-blocking
      # scheduling on a small/single-node situation. `preferred` (not `required`) means a
      # 1-replica dev/preview pod (or a cluster with fewer schedulable nodes than replicas)
      # still schedules fine — the scheduler just prefers a node not already running a same-
      # component pod. Self-selects on THIS workload's own name+component labels (the only
      # labels on the pods, §3.1). It lives in the pod template, so it governs this Deployment
      # AND the prod overlay's Rollout (overlays/prod/rollout.yaml copies this same template).
      # `preferred` (not `required`) keeps it a no-op for the 1-replica dev/preview envs and
      # only bites where replicas>1 (staging=2, prod=3). topologyKey is the node hostname — the
      # failure domain for tenant workloads on this platform.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: ${{ values.appName }}
                    app.kubernetes.io/component: ${{ c.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
{#! ---------------------------------------------------------------------------------
     DEPLOY-TIME MIGRATIONS (F-1/#48). Rendered ONLY when this component's fragment
     declares a `migrate` argv in fragment.yaml AND the tenant actually has a platform
     database. A fragment that creates its own schema at boot (CREATE TABLE IF NOT
     EXISTS / EnsureCreated()) declares no `migrate` and this block does not render, so
     its manifests stay byte-identical to before this change.

     WHY BOTH HALVES OF THE GATE. `c.migrate` alone is not enough: a student can pick a
     migrator-bearing stack with database "none" or "bring your own", where DATABASE_URL
     is absent or arrives later by hand. Today that scaffolds a working pod that serves a
     clear 503 on the data routes with /healthz green (M4 zero-config). An ungated
     migrator would turn that into a pod wedged in Init forever — trading a documented,
     recoverable state for a hard failure. So the auto-DB condition below MIRRORS the
     Reloader annotation and the DATABASE_URL source selection above: one rule, three
     places, no drift.

     SAME IMAGE, SAME TAG. The migrator runs THIS component's image (the migration CLI
     and the migration files are already inside it), named with the same placeholder the
     app container uses — kustomize's `images:` transformer rewrites initContainers as
     well as containers, so the per-env tag bump in every overlay applies here for free
     and the migrator can never run a different build than the app it precedes.

     DATABASE_URL IS REQUIRED HERE (no `optional: true`, unlike the app container). If
     ESO has not yet materialized `<app>-db`, the kubelet holds the pod in
     CreateContainerConfigError and retries until it does — a visible wait that resolves
     itself. `optional: true` would instead start the migrator with no DATABASE_URL and
     fail it on a confusing error. Loud and correct beats quiet and wrong.

     FAILURE MODE, CHOSEN DELIBERATELY. A migration that fails leaves the pod in Init
     with the migrator's own log as the reason, and the Deployment simply does not
     progress — the PREVIOUS ReplicaSet keeps serving, so a broken migration cannot take
     a running tenant down; it blocks the rollout instead. That is the intended
     behaviour: a bad migration must stop the deploy, not half-apply behind a green pod.

     CONCURRENCY. A rolling update surges one pod at a time (25% of <=4 replicas), so
     migrators run sequentially there. The one genuinely concurrent case is a brand-new
     env, where the ReplicaSet creates all replicas at once. Prisma `migrate deploy` and
     Rails `db:migrate` both take a DB advisory lock and are safe. Django and Laravel do
     not lock: a loser can fail on "table already exists", the kubelet restarts its
     initContainer, and the retry sees the winner's ledger row and succeeds. Self-healing
     and visible, at the cost of one transient Init:Error on a first prod rollout that
     carries a new migration. A PreSync Job would remove even that; it is deliberately
     out of scope here because it introduces a second, hook-shaped mechanism the fragments
     do not document and this platform has been bitten by before.
!#}
{%- if c.migrate and c.needsDb and (values.database == 'mysql' or values.database == 'postgres') %}
      initContainers:
        - name: migrate
          image: ${{ values.appName }}-${{ c.name }}:latest
          imagePullPolicy: IfNotPresent
          command:
{%- for arg in c.migrate %}
            - ${{ arg | dump }}
{%- endfor %}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${{ values.appName }}-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
{%- endif %}
      containers:
        - name: ${{ c.name }}
          # SEAM: overlays override registry + tag via kustomize images: (entry name
          # = `<appName>-<component>`, matching .devops/components.yaml `image`).
          image: ${{ values.appName }}-${{ c.name }}:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: ${{ c.port }}
          env:
            # Container port — single source is this component's `port` in components.yaml.
            - name: PORT
              value: "${{ c.port }}"
            # Proof-of-secret-path; optional + deletionPolicy Delete on the ExternalSecret
            # means a fresh repo with nothing in Vault still starts (M4 zero-config).
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: ${{ values.appName }}-secret
                  key: APP_SECRET
                  optional: true
{%- if c.needsDb %}
            # DATABASE_URL — this component's DB connection string. The SOURCE Secret is
            # chosen ONCE here (base) by the tenant's DB mode (ADR-033):
            #   - database: mysql | postgres (auto-DB)  -> `<appName>-db`, the assembled DSN
            #     that the per-env database.externalsecret.yaml builds from the Crossplane-
            #     provisioned parts in Vault (tenants/<team>/<env>/database). The scheme
            #     (mysql:// vs postgresql://) is set there by the same `values.database`;
            #   - bring-your-own (none/other)  -> `<appName>-secret` key DATABASE_URL, typed
            #     by the team via The Process "Secrets" tab (Vault tenants/<team>/<env>/app).
            # Either way optional:true so a fresh repo with nothing in Vault still starts (the
            # backend degrades to a clear "DATABASE_URL not set" error on the data routes,
            # /healthz stays green — M4 zero-config). NEVER commit creds to git. This env is
            # rendered ONLY for components that declare needsDb: true.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
{%- if values.database == 'mysql' or values.database == 'postgres' %}
                  name: ${{ values.appName }}-db       # auto-DB: DSN assembled by database.externalsecret.yaml (ADR-033)
{%- else %}
                  name: ${{ values.appName }}-secret   # bring-your-own: DATABASE_URL set via the Secrets tab
{%- endif %}
                  key: DATABASE_URL
                  optional: true
{%- endif %}
          # Probes hit the pod DIRECTLY (not via the Ingress), so every component
          # serves /healthz at the container root regardless of its ingress `path`.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          # startupProbe GATES the liveness probe until the app has actually come up.
          # Slow cold starts (a JVM backend under the 500m CPU limit takes 18-26s to
          # serve /healthz) otherwise eat one liveness SIGTERM (exit 143) restart on
          # every new pod. failureThreshold 30 x periodSeconds 2 allows up to 60s of
          # startup with fast (2s) detection; liveness (below) only starts counting
          # after the first startup success.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Writable /tmp under the read-only root fs — JVM/embedded-Tomcat (and other
            # runtimes) create temp files at startup; without this the pod crash-loops on
            # "Unable to create tempDir ... Read-only file system". emptyDir is pod-scoped
            # scratch, so readOnlyRootFilesystem hardening stays fully intact.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{%- endif %}
{%- endfor %}
