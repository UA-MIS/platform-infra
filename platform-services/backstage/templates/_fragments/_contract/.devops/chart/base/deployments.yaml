# Workloads — ONE per component in .devops/components.yaml (this file is a nunjucks loop
# the Scaffolder expanded at create time; each component yields one manifest doc separated
# by `---`). Every component renders a plain `Deployment` EXCEPT: a single-component web
# project ("single" slot, values.single) with the "Progressive delivery (canary)" wizard
# toggle on (values.progressiveDelivery) renders an Argo Rollouts `Rollout` instead — same
# `replicas`/`selector`/`template` shape, same ReplicaSets underneath, just a canary
# strategy instead of RollingUpdate. See docs/operator/progressive-delivery.md. Every other
# component (any frontend-backend/mobile component, or a single project with the toggle
# off) is completely unaffected — this is additive and off by default.
#
# Image: each container's `image:` is the GitOps image-tag SEAM (§4.1). The base pins
# a per-component placeholder `<appName>-<component>:latest`; each overlay sets the
# registry/tag via a kustomize `images:` override (one entry per component) driven by
# promotion.yaml + the CI bump (dev=main git-describe, staging/prod=semver, preview=pull-<sha>).
# On a Rollout, that same overlay-driven tag bump is what TRIGGERS the canary: Argo Rollouts
# watches the pod template for a change and steps through `strategy.canary` instead of
# replacing all Pods at once.
#
# Secret: APP_SECRET is sourced from the in-namespace Secret `<appName>-secret`, which
# the External Secrets Operator materializes from Vault (ADR-030 B1). ALL components
# share the one per-env ExternalSecret/Secret (one Vault object tenants/<team>/<env>/app),
# matching the M3 Secrets-tab contract — the same `optional:true` zero-config behaviour
# as the single-component chart.
#
# Selectors: each workload selects ONLY its own pods via app.kubernetes.io/component,
# so the N Deployments/Services never cross-bind.
{%- for c in values.components %}
{%- if c.buildType != "mobile-artifact" %}
---
{%- if values.single and values.progressiveDelivery %}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{%- else %}
apiVersion: apps/v1
kind: Deployment
{%- endif %}
metadata:
  name: ${{ values.appName }}-${{ c.name }}
  labels:
    app.kubernetes.io/name: ${{ values.appName }}
    app.kubernetes.io/component: ${{ c.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.appName }}
      app.kubernetes.io/component: ${{ c.name }}
{%- if values.single and values.progressiveDelivery %}
  # Basic Canary that AUTO-COMPLETES with NO human and NO kubectl plugin (Basic Canary =
  # no traffic-routing plugin/service mesh wired up, so weight is approximated by the
  # stable/canary ReplicaSet replica-count ratio behind the ONE Service both share, see
  # services.yaml). Every new image bump steps 25% -> (30s) -> 50% -> (30s) -> 100%,
  # auto-advancing on TIMED pauses (not an indefinite empty pause), then promotes to 100% and
  # scales the old ReplicaSet to 0 on its own. scaleDownDelaySeconds is intentionally NOT
  # set (default 30s), so the old revision is cleaned up promptly after promotion — no
  # ImagePullBackOff pod left held forever. The FIRST-ever deploy on a fresh tenant SKIPS
  # these steps and goes straight to 100% (Argo Rollouts has no prior stable revision to
  # canary against yet), so a brand-new app comes up clean without a stuck initial rollout.
  #
  # Want a MANUAL hold gate? Replace a timed `pause` below with a bare `pause:` that has no
  # `duration:` (an empty pause step pauses INDEFINITELY until promoted) and promote it with
  # `kubectl argo rollouts promote ${{ values.appName }}-${{ c.name }} -n <team>-<env>`
  # (requires the kubectl-argo-rollouts plugin installed locally). The DEFAULT here stays
  # fully automatic — see docs/operator/progressive-delivery.md.
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 100
{%- endif %}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${{ values.appName }}
        app.kubernetes.io/component: ${{ c.name }}
    spec:
      serviceAccountName: ${{ values.appName }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${{ c.name }}
          # SEAM: overlays override registry + tag via kustomize images: (entry name
          # = `<appName>-<component>`, matching .devops/components.yaml `image`).
          image: ${{ values.appName }}-${{ c.name }}:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: ${{ c.port }}
          env:
            # Container port — single source is this component's `port` in components.yaml.
            - name: PORT
              value: "${{ c.port }}"
            # Proof-of-secret-path; optional + deletionPolicy Delete on the ExternalSecret
            # means a fresh repo with nothing in Vault still starts (M4 zero-config).
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: ${{ values.appName }}-secret
                  key: APP_SECRET
                  optional: true
{%- if c.needsDb %}
            # DATABASE_URL — this component's DB connection string. The SOURCE Secret is
            # chosen ONCE here (base) by the tenant's DB mode (ADR-033):
            #   - database: mysql | postgres (auto-DB)  -> `<appName>-db`, the assembled DSN
            #     that the per-env database.externalsecret.yaml builds from the Crossplane-
            #     provisioned parts in Vault (tenants/<team>/<env>/database). The scheme
            #     (mysql:// vs postgresql://) is set there by the same `values.database`;
            #   - bring-your-own (none/other)  -> `<appName>-secret` key DATABASE_URL, typed
            #     by the team via The Process "Secrets" tab (Vault tenants/<team>/<env>/app).
            # Either way optional:true so a fresh repo with nothing in Vault still starts (the
            # backend degrades to a clear "DATABASE_URL not set" error on the data routes,
            # /healthz stays green — M4 zero-config). NEVER commit creds to git. This env is
            # rendered ONLY for components that declare needsDb: true.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
{%- if values.database == 'mysql' or values.database == 'postgres' %}
                  name: ${{ values.appName }}-db       # auto-DB: DSN assembled by database.externalsecret.yaml (ADR-033)
{%- else %}
                  name: ${{ values.appName }}-secret   # bring-your-own: DATABASE_URL set via the Secrets tab
{%- endif %}
                  key: DATABASE_URL
                  optional: true
{%- endif %}
          # Probes hit the pod DIRECTLY (not via the Ingress), so every component
          # serves /healthz at the container root regardless of its ingress `path`.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
{%- endif %}
{%- endfor %}
