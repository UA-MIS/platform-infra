# dev overlay — tracks main, auto-synced by the env ApplicationSet (§2.3).
# Image seam: dev follows the latest main build (promotion.yaml: dev=main digest).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${{ values.team }}-dev
resources:
  - ../../base
  # Per-tenant ESO store + SA (vault-tenant / eso-tenant, scoped to this team's
  # Vault path) — the tenant half of the ADR-030 B1 secrets contract.
  - secretstore.yaml
  # ${{ values.appName }}-secret ExternalSecret (demonstrates the secret path; APP_SECRET in
  # base is optional + deletionPolicy Delete so a fresh repo with no Vault value still
  # deploys — M4 zero-config).
  - app-secret.externalsecret.yaml
{%- if values.database == 'mysql' or values.database == 'postgres' %}
  # Auto-DB DATABASE_URL ExternalSecret (ADR-033 / #146). Present for BOTH auto-DB
  # engines (database: mysql OR postgres) — assembles the engine DSN (mysql:// or
  # postgresql://, chosen by values.database) from the Crossplane-provisioned parts in
  # Vault (tenants/${{ values.team }}/<env>/database) into the Secret `${{ values.appName }}-db`,
  # which the base Deployment envs into DATABASE_URL. This gate MUST match
  # database.externalsecret.yaml's own body guard AND the base Deployment's DATABASE_URL
  # source selection (deployments.yaml: `<app>-db` for mysql|postgres) — a mysql-only gate
  # here (the pre-fix bug) left postgres tenants with the Deployment pointing at an
  # <app>-db Secret this file never created, so DATABASE_URL was silently unset and the
  # app never connected to its provisioned DB. A bring-your-own / none stack omits this
  # file entirely (the DATABASE_URL, if any, rides app-secret instead).
  - database.externalsecret.yaml
{%- endif %}
  # harbor-pull image-pull cred (SA imagePullSecrets:[harbor-pull], #C3) is NOT shipped by
  # this overlay. It is owned SOLELY by the platform operator's tenant directory
  # (platform-infra/tenants/<team>/harbor-pull-<env>-sealed.yaml, synced by the tenant-<team>
  # Application and minted by `make harbor-robot`). The base ServiceAccount keeps
  # imagePullSecrets:[harbor-pull] so the pod still pulls from the private Harbor project;
  # the secret is provided out-of-band by that single owner. Shipping a placeholder
  # SealedSecret here too made harbor-pull a dual-owner resource, triggering ArgoCD's
  # SharedResourceWarning and blocking sync (twin of the harbor-push fix, #117). RESERVED
  # for a post-v1 ESO flip: Vault path `secret/data/tenants/<team>/<env>/harbor-pull` (key
  # .dockerconfigjson); ADR-030 follow-on, coordinated with eso-vault.
  # capstone:secrets — The Process "Secrets" tab (M3 ESO rework, ADR-030 §5) adds user
  # secret keys by APPENDING a `data[]` entry to app-secret.externalsecret.yaml above
  # (one ExternalSecret / one k8s Secret `${{ values.appName }}-secret` per env; all keys
  # share the Vault object `tenants/${{ values.team }}/<env>/app`) — it does NOT add files
  # here. Manifests must stay INSIDE this overlay dir: a kustomize resource that escapes
  # the chart/ root (e.g. ../../../secrets/...) fails ArgoCD's default load restrictor.
# env-specific selector label (§3.1). semester comes from app-metadata via the
# tenant; set here for the workload's own label contract.
labels:
  - pairs:
      platform.capstone/env: dev
      platform.capstone/semester: ${{ values.semester }}
    includeSelectors: false
# Image-tag SEAM (§4.1): ONE images[] entry PER COMPONENT (nunjucks loop). The CI
# image-bump rewrites every component's newTag to the just-built tag (all components
# share the one git-describe tag — see .devops/ci/bump-image.sh).
images:
{%- for c in values.components %}
{%- if c.buildType != "mobile-artifact" %}
  - name: ${{ values.appName }}-${{ c.name }}
    newName: harbor.capstone.uamishub.com/${{ values.team }}/${{ values.appName }}-${{ c.name }}
    newTag: v0.0.0
{%- endif %}
{%- endfor %}
# Per-component replica count via a JSON6902 `op: replace` (NOT the builtin `replicas:`
# transformer). dev is ALWAYS a plain Deployment (progressive delivery is prod-only, ADR-037),
# so a `replicas:` transformer would work here — but the patch form is kept UNIFORM across all
# overlays because the PROD overlay's single-component workload is an argoproj.io/Rollout, and
# the builtin `replicas:` transformer is hard-wired to the Deployment/StatefulSet/ReplicaSet/
# ReplicationController GVK set and ERRORS on a Rollout ("resource <app>-<c> does not match a
# config with the following GVK ...", #337, first hit by test tenant `computa`). A patch has no
# such GVK restriction. Naming the kind also excludes the same-named Service (which has no
# /spec/replicas). Base pins replicas:1, so `replace` always has a path to hit.
patches:
{%- for c in values.components %}
{%- if c.buildType != "mobile-artifact" %}
  - target:
      kind: Deployment
      name: ${{ values.appName }}-${{ c.name }}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
{%- endif %}
{%- endfor %}
  - target:
      kind: Ingress
      name: ${{ values.appName }}
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: ${{ values.appName }}.dev.capstone.uamishub.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: ${{ values.appName }}.dev.capstone.uamishub.com
