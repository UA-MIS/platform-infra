# PROD-ONLY progressive-delivery workload (ADR-037 env-based canary policy). This file is
# referenced by overlays/prod/kustomization.yaml ONLY for a single-component web project
# (values.single); that same overlay `$patch: delete`s the base Deployment of the same name,
# so prod runs this Argo Rollouts `Rollout` INSTEAD of the plain Deployment. dev / staging /
# preview never reference this file — they keep the base Deployment (rolling update).
#
# The pod `template` below is a DELIBERATE MIRROR of base/deployments.yaml's pod template —
# kustomize cannot retype a Deployment into a Rollout, so the Rollout must carry the full
# container spec itself. KEEP THE POD TEMPLATE IN SYNC WITH base/deployments.yaml (container
# image seam, env/PORT/APP_SECRET/DATABASE_URL wiring, probes, resources, securityContext,
# serviceAccountName, automountServiceAccountToken, soft pod-antiAffinity). Both are rendered
# once at scaffold time from the SAME `values`, so a fresh scaffold is always consistent; this
# note guards future edits to the shared workload shape — INCLUDING the D-123 migration
# initContainer: prod is the ONE env where the base Deployment is deleted, so a migration
# block added to base/deployments.yaml and NOT to this file would silently skip migrations in
# production only (the exact class of bug D-123 fixes). Both blocks are byte-identical.
#
# Same selector + labels as the base Deployment/Service, so the ONE Service (services.yaml,
# selecting on name+component — no rollouts-pod-template-hash) routes traffic to this Rollout's
# stable+canary ReplicaSets. The prod overlay's JSON6902 replicas patch (#340) targets THIS
# Rollout GVK (argoproj.io/Rollout) — the builtin `replicas:` transformer errors on a Rollout,
# hence a patch — and the prod PDB (#346) selects these pods by label (kind-agnostic).
{%- if values.single %}
{%- for c in values.components %}
{%- if c.buildType != "mobile-artifact" %}
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ${{ values.appName }}-${{ c.name }}
  labels:
    app.kubernetes.io/name: ${{ values.appName }}
    app.kubernetes.io/component: ${{ c.name }}
  annotations:
    # Reloader (FIX-9/D-065) — MIRRORS base/deployments.yaml's annotation per this
    # file's own KEEP-IN-SYNC note above. Reloader supports Argo Rollouts natively:
    # a secret change here advances through the SAME canary steps as an image bump
    # (25% -> 50% -> 100%), not a hard replace-all-pods restart.
{%- if c.needsDb and (values.database == 'mysql' or values.database == 'postgres') %}
    secret.reloader.stakater.com/reload: "${{ values.appName }}-secret,${{ values.appName }}-db"
{%- else %}
    secret.reloader.stakater.com/reload: "${{ values.appName }}-secret"
{%- endif %}
spec:
  replicas: 1   # overlays/prod patches this to 3 (JSON6902 replace, targets the Rollout GVK).
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.appName }}
      app.kubernetes.io/component: ${{ c.name }}
  # Basic Canary that AUTO-COMPLETES with NO human and NO kubectl plugin (Basic Canary =
  # no traffic-routing plugin/service mesh wired up, so weight is approximated by the
  # stable/canary ReplicaSet replica-count ratio behind the ONE Service both share, see
  # ../../base/services.yaml). Every new image bump (the prod promote gate) steps
  # 25% -> (30s) -> 50% -> (30s) -> 100%, auto-advancing on TIMED pauses (not an indefinite
  # empty pause), then promotes to 100% and scales the old ReplicaSet to 0 on its own.
  # scaleDownDelaySeconds is intentionally NOT set (default 30s), so the old revision is
  # cleaned up promptly after promotion — no ImagePullBackOff pod left held forever. The
  # FIRST-ever deploy on a fresh tenant SKIPS these steps and goes straight to 100% (Argo
  # Rollouts has no prior stable revision to canary against yet), so a brand-new app comes up
  # clean without a stuck initial rollout.
  #
  # Want a MANUAL hold gate? Replace a timed `pause` below with a bare `pause:` that has no
  # `duration:` (an empty pause step pauses INDEFINITELY until promoted) and promote it with
  # `kubectl argo rollouts promote ${{ values.appName }}-${{ c.name }} -n ${{ values.team }}-prod`
  # (requires the kubectl-argo-rollouts plugin installed locally). The DEFAULT here stays
  # fully automatic — see docs/operator/progressive-delivery.md.
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 30s }
        - setWeight: 50
        - pause: { duration: 30s }
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${{ values.appName }}
        app.kubernetes.io/component: ${{ c.name }}
    spec:
      serviceAccountName: ${{ values.appName }}
      automountServiceAccountToken: false
      # Soft (preferred) pod anti-affinity — MIRRORS base/deployments.yaml. `preferred` keeps
      # it a no-op below replicas>1 and spreads prod's 3 replicas across nodes for drain/HA.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: ${{ values.appName }}
                    app.kubernetes.io/component: ${{ c.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
{%- if c.migrate %}
      # ---- DEPLOY-TIME SCHEMA MIGRATION (D-123, board #48) --------------------------------
      # Rendered ONLY for a component whose fragment DECLARES a migrator (fragment.yaml
      # `migrate: "<shell command>"` -> components.yaml `migrate`). Most needsDb fragments
      # self-migrate at boot (CREATE TABLE IF NOT EXISTS / EnsureCreated) and MUST NOT get
      # this block: an initContainer running a command their image does not have would turn
      # a working pod into a permanent Init:Error. See composePlan.mjs migrateFor().
      #
      # WHY AN initContainer AND NOT THE APP PROCESS: migrating from the running server races
      # every replica against every other, re-runs on every restart, and needs DDL rights in
      # the serving process. Init ordering gives us exactly one guarantee we want and cannot
      # get any other way: the app container does not start until migrations exited 0.
      #
      # FAILURE MODE (deliberate, D-123): a failing migration leaves the pod in
      # Init:Error/CrashLoopBackOff and it NEVER becomes Ready. On a rolling update that means
      # the OLD ReplicaSet keeps serving and the bad revision takes no traffic; on a brand-new
      # env it means a loud, obvious stop. Both beat the alternative this replaces — a Healthy,
      # Ready, 200-reporting pod serving "table does not exist" to every request.
      #
      # ZERO-CONFIG IS PRESERVED: DATABASE_URL is optional:true (a fresh repo with nothing in
      # Vault still starts, M4). The guard below EXITS 0 when it is unset, so a not-yet-wired
      # app boots exactly as it does today instead of wedging in Init forever. When ESO later
      # materializes the Secret, the Reloader annotation above restarts the pod and this
      # initContainer runs for real. That ordering is load-bearing — do not drop the guard.
      initContainers:
        - name: migrate
          # SAME image as the app container below, by design (§4.1): the overlay's kustomize
          # `images:` override rewrites initContainers[] as well as containers[], so the
          # migration always runs the EXACT build being deployed. No second image, no second
          # build step, nothing extra to push.
          image: ${{ values.appName }}-${{ c.name }}:latest
          imagePullPolicy: IfNotPresent
          # /bin/sh -c so the guard can short-circuit on an unset DATABASE_URL. A fragment on
          # a shell-less base (scratch/distroless) therefore must NOT declare `migrate`.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ -z "${DATABASE_URL:-}" ]; then
                echo "[migrate] DATABASE_URL is unset - skipping migrations (zero-config path)."
                exit 0
              fi
              # BOUNDED RETRY (3 x 5s). Two transient causes are EXPECTED and must not wedge
              # a deploy: (1) replicas racing the same migration on a fresh env - measured,
              # not assumed: 3 concurrent migrators on an empty database produce
              # ActiveRecord::ConcurrentMigrationError (rails) or `1050 Table ... already
              # exists` (django/laravel) in the losers, while the winner completes and the
              # final schema is correct; a serial retry then exits 0. (prisma is the
              # exception - it takes a MySQL advisory lock and all three exit 0.) (2) the DB
              # briefly unreachable while the tier settles. Retrying HERE rather than leaning
              # on kubelet's Init backoff keeps a healthy deploy from flashing Init:Error.
              # A migration that is genuinely broken still fails all 3 attempts and the pod
              # stays in Init - which is the point (D-123): a loud stop beats a Ready pod
              # serving "table does not exist".
              attempt=1
              until [ "$attempt" -gt 3 ]; do
                echo "[migrate] attempt $attempt/3: ${{ c.migrate }}"
                if ${{ c.migrate }}; then
                  echo "[migrate] done."
                  exit 0
                fi
                echo "[migrate] attempt $attempt failed."
                attempt=$((attempt + 1))
                [ "$attempt" -gt 3 ] || sleep 5
              done
              echo "[migrate] FAILED after 3 attempts - the app container will NOT start."
              exit 1
          env:
            # MIRRORS the app container's env below. The migrator needs the same DSN and the
            # same app secret (a framework may read it while booting its config).
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: ${{ values.appName }}-secret
                  key: APP_SECRET
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
{%- if values.database == 'mysql' or values.database == 'postgres' %}
                  name: ${{ values.appName }}-db       # auto-DB: DSN assembled by database.externalsecret.yaml (ADR-033)
{%- else %}
                  name: ${{ values.appName }}-secret   # bring-your-own: DATABASE_URL set via the Secrets tab
{%- endif %}
                  key: DATABASE_URL
                  optional: true
          resources:
            # An init container does NOT add to the pod's steady-state REQUESTS: the scheduler
            # charges max(largest initContainer, sum(containers)), so these requests are free.
            # The memory LIMIT is 512Mi, not the app container's 256Mi. Measured (D-123): all
            # four shipped migrators complete inside a hard 256Mi cgroup limit, so 512Mi is
            # deliberate HEADROOM for a team-authored data migration (a backfill that walks
            # rows is the realistic way to exceed 256Mi), where an OOMKill would be
            # indistinguishable from a failed migration. Cost is bounded and quantified: the
            # pod's quota-charged limits.memory goes 256Mi -> 512Mi, i.e. prod's 3 replicas
            # charge 1.5Gi of the 8Gi per-env limits.memory quota instead of 768Mi, and 512Mi
            # is inside the tenant LimitRange max (1Gi).
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Surface the migration's own output in `kubectl describe pod` when it fails,
          # instead of only in the logs of a container that is already gone.
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            # Same writable /tmp the app container gets — migration CLIs write temp files
            # (prisma engine, bundler, pip) and the root fs is read-only.
            - name: tmp
              mountPath: /tmp
{%- endif %}
      containers:
        - name: ${{ c.name }}
          # SEAM: overlays override registry + tag via kustomize images: (entry name
          # = `<appName>-<component>`, matching .devops/components.yaml `image`).
          image: ${{ values.appName }}-${{ c.name }}:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: ${{ c.port }}
          env:
            # Container port — single source is this component's `port` in components.yaml.
            - name: PORT
              value: "${{ c.port }}"
            # Proof-of-secret-path; optional + deletionPolicy Delete on the ExternalSecret
            # means a fresh repo with nothing in Vault still starts (M4 zero-config).
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: ${{ values.appName }}-secret
                  key: APP_SECRET
                  optional: true
{%- if c.needsDb %}
            # DATABASE_URL — same source selection as base/deployments.yaml (ADR-033):
            # auto-DB (mysql|postgres) -> `<appName>-db`; bring-your-own -> `<appName>-secret`.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
{%- if values.database == 'mysql' or values.database == 'postgres' %}
                  name: ${{ values.appName }}-db       # auto-DB: DSN assembled by database.externalsecret.yaml (ADR-033)
{%- else %}
                  name: ${{ values.appName }}-secret   # bring-your-own: DATABASE_URL set via the Secrets tab
{%- endif %}
                  key: DATABASE_URL
                  optional: true
{%- endif %}
          # Probes hit the pod DIRECTLY (not via the Ingress), so every component
          # serves /healthz at the container root regardless of its ingress `path`.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          # startupProbe GATES the liveness probe until the app has actually come up.
          # Slow cold starts (a JVM backend under the 500m CPU limit takes 18-26s to
          # serve /healthz) otherwise eat one liveness SIGTERM (exit 143) restart on
          # every new pod. failureThreshold 30 x periodSeconds 2 allows up to 60s of
          # startup with fast (2s) detection; liveness (below) only starts counting
          # after the first startup success.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Writable /tmp under the read-only root fs — JVM/embedded-Tomcat (and other
            # runtimes) create temp files at startup; without this the pod crash-loops on
            # "Unable to create tempDir ... Read-only file system". emptyDir is pod-scoped
            # scratch, so readOnlyRootFilesystem hardening stays fully intact.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{%- endif %}
{%- endfor %}
{%- endif %}
