# Auto-DB DATABASE_URL — ESO ExternalSecret (ADR-033 / #146, "no secret material in git").
#
# PLATFORM-OWNED and DISTINCT from app-secret.externalsecret.yaml. Rendered + wired ONLY
# when the tenant chose an auto-DB engine (wizard database: mysql OR postgres);
# for every other DB mode (bring-your-own, none) the body below renders empty AND this
# file is NOT listed in kustomization.yaml -> inert (a bring-your-own DATABASE_URL rides
# app-secret.externalsecret.yaml, key DATABASE_URL, instead).
#
# PREVIEW NOTE: ADR-033 provisions a per-(team,env) database for dev / staging / prod only.
# Ephemeral PR previews get NO provisioned schema, so this leaf never exists on preview and
# the ExternalSecret stays inert (deletionPolicy Delete). It is shipped here purely so the
# base Deployment's DATABASE_URL secretKeyRef (<app>-db, chosen once in base for an
# auto-DB tenant) resolves consistently across every overlay; on preview it simply finds
# nothing (optional: true) and the app starts DB-less. Point a preview at a real DB via
# the Secrets tab (bring-your-own) if it must talk to one.
#
# PRODUCER/CONSUMER contract: Crossplane PushSecrets username/password/host/port to Vault
# at secret/data/tenants/<team>/<env>/database; this ExternalSecret assembles the engine
# DSN (mysql:// or postgresql://) in target.template into the in-namespace Secret
# `<app>-db` (key DATABASE_URL). See
# the dev overlay's database.externalsecret.yaml header for the full rationale.
{%- if values.database == 'mysql' or values.database == 'postgres' %}
{%- if values.database == 'postgres' %}
{%- set dbScheme = 'postgresql' %}
{%- else %}
{%- set dbScheme = 'mysql' %}
{%- endif %}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${{ values.appName }}-db
  namespace: ${{ values.team }}-pr-1
  labels:
    app.kubernetes.io/name: ${{ values.appName }}
    platform.capstone/component: tenant
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-tenant          # the per-tenant store (same one app-secret uses)
    kind: SecretStore
  target:
    name: ${{ values.appName }}-db       # the k8s Secret the workload consumes (key DATABASE_URL)
    creationPolicy: Owner
    deletionPolicy: Delete               # missing Vault leaf != error (preview has no provisioned DB)
    template:
      engineVersion: v2
      data:
        # Assembled DSN. The four {{ .parts }} come from Vault (data: below); the dbname
        # is the fixed structural rule <teamDb>_<env> (teamDb = team slug, '-' -> '_').
        DATABASE_URL: "${{ dbScheme }}://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/${{ values.team | replace('-','_') }}_pr_1"
  data:
    - secretKey: username
      remoteRef:
        key: tenants/${{ values.team }}/pr-1/database
        property: username
    - secretKey: password
      remoteRef:
        key: tenants/${{ values.team }}/pr-1/database
        property: password
    - secretKey: host
      remoteRef:
        key: tenants/${{ values.team }}/pr-1/database
        property: host
    - secretKey: port
      remoteRef:
        key: tenants/${{ values.team }}/pr-1/database
        property: port
{%- endif %}
