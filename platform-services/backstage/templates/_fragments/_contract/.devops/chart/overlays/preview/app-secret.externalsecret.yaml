# App secret — ESO ExternalSecret (ADR-030 B1, "no secret material in git").
#
# This declares the NAME + Vault POINTER only — NO value. ESO (via the per-tenant
# vault-tenant SecretStore) reads Vault object secret/data/tenants/${{ values.team }}/pr-1/app
# and materializes the in-namespace Secret `${{ values.appName }}-secret`, which the base
# Deployment envs into APP_SECRET (and, for bring-your-own DB, DATABASE_URL — see base
# deployments.yaml). This replaces the Phase-1 SealedSecret (D-006) with the v1 ESO
# model — the value lives in Vault, written by the platform or by The Process "Secrets"
# tab (PushSecret / vault kv put), never committed here.
#
# WHY dataFrom/extract, NOT an explicit data[] list for APP_SECRET (INCIDENT, 2026-09):
# ESO processes spec.data[] ATOMICALLY and IN ORDER — if ANY one entry names a Vault
# property that isn't set yet, ESO fails on that entry and writes NO Secret at all,
# discarding every other key that resolved fine right along with it. A template shipping
# a single explicit `data[]` entry for APP_SECRET is harmless ONLY while nothing else
# shares the file (there is nothing else to lose) — and becomes destructive the moment a
# team adds a key of their own via the Secrets tab, because the still-unset APP_SECRET
# entry silently annihilates every key they just added. This is not hypothetical: it took
# down three live tenants (next-up staging/prod, mychef dev) before being caught and
# fixed at the source here. `dataFrom: extract` has no such all-or-nothing failure mode —
# it syncs whatever properties ARE present on the Vault object and simply omits what
# isn't. That is genuinely zero-config (not just zero-config for the single-key case),
# and it is why `dev` alone already used this shape successfully before this fix.
#
# This is also why bring-your-own DATABASE_URL has NO explicit data[] entry here either:
# `extract` picks it up automatically the moment a team writes it to Vault under this
# same object (property DATABASE_URL) — a second explicit entry would reintroduce the
# identical failure mode for any bring-your-own tenant that has set APP_SECRET but not
# yet DATABASE_URL (or vice versa).
#
# Mixing with the Secrets tab is SAFE, and as of the declared-keys change it no longer
# touches `data[]` on this shape AT ALL: when a team adds a key, sealCore.ts records the
# NAME in the `platform.capstone/declared-keys` annotation above (inert to ESO) and leaves
# the sync to `dataFrom: extract`. An explicit `data[]` entry is now appended only to a
# LEGACY overlay that has no `dataFrom:`, where it is the sole way ESO can see the key —
# and even there sealAndPublish() WRITES the Vault value before appending the declaration,
# so an entry never lands ahead of the value it points to.
#
# curb-web-secret incident follow-up (2026-09-12/15, this PR): the safety net above is
# PROCESS discipline, not a schema guarantee — it only holds while every data[] entry
# is appended THROUGH the Secrets tab. Nothing stops a developer from hand-editing this
# file directly, and that is exactly how curb-web-secret broke: a commit hand-wrote a
# `TICKETMASTER_API_KEY` data[] entry into ALL THREE env overlays (dev/staging/prod) at
# once, but the matching Vault value was only ever written for dev. staging/prod each
# already had OTHER keys resolving fine at that Vault path, so the object existed and
# the one absent property triggered ESO's atomic all-or-nothing failure — wiping every
# key in staging/prod, not just the new one, for three days with no PR review to catch
# it (tenant repos own their own .devops/, so this file is not reviewed here).
#
# If you must hand-edit a data[] entry onto this file instead of using the Secrets tab:
# write the Vault value in EVERY environment this entry will exist in FIRST, THEN commit
# the declaration to each of those overlays — never the reverse. ESO 2.6.0's data[] items
# have no per-key optional/ignore-missing field (verified against the ExternalSecret CRD
# spec), so there is no way to declare "this key only exists in dev" — every environment
# that declares a key must have a value for it, or every OTHER key in that environment's
# object goes down with it. ExternalSecretSyncError (platform-services/monitoring/
# alerts.yaml) now pages within 10m on exactly this condition, per-tenant — but a page
# after the fact is not a substitute for not breaking it in the first place.
#
# M4 ZERO-CONFIG: deletionPolicy Delete means an EMPTY Vault object is not an error — the
# ExternalSecret stays healthy and simply creates no Secret. Combined with the base's
# `optional: true` on APP_SECRET/DATABASE_URL, a freshly-scaffolded app with nothing in
# Vault still deploys (the app reports "secret loaded: false"). A team that needs a
# secret writes it to Vault (directly, or via the Secrets tab) and it appears on the
# next refresh — no manifest change required.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${{ values.appName }}-secret
  namespace: ${{ values.team }}-pr-1
  annotations:
    # The secret key NAMES this environment declares, for The Process "Secrets" tab.
    # INERT to ESO (it reconciles from `spec` only, and ExternalSecret annotations are NOT
    # copied onto the generated Secret), so this is pure display metadata — a NAME, never a
    # value. The Secrets tab maintains this list; `dataFrom: extract` below is what actually
    # syncs the values. Decoupling the two is the point: a key can be shown in the UI without
    # being declared as an atomic `data[]` entry that could fail the whole sync.
    platform.capstone/declared-keys: ""
  labels:
    app.kubernetes.io/name: ${{ values.appName }}
    platform.capstone/component: tenant
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-tenant
    kind: SecretStore          # the per-tenant store (NOT the ClusterSecretStore)
  target:
    name: ${{ values.appName }}-secret   # the k8s Secret the workload consumes
    creationPolicy: Owner
    deletionPolicy: Delete               # empty Vault object != error (M4 zero-config)
  dataFrom:
    - extract:
        key: tenants/${{ values.team }}/pr-1/app
