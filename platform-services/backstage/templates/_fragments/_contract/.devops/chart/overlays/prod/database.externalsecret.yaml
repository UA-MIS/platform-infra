# Auto-DB DATABASE_URL — ESO ExternalSecret (ADR-033 / #146, "no secret material in git").
#
# PLATFORM-OWNED and DISTINCT from app-secret.externalsecret.yaml. Rendered + wired ONLY
# when the tenant chose an auto-DB engine (wizard database: mysql OR postgres);
# for every other DB mode (bring-your-own, none) the body below renders empty AND this
# file is NOT listed in kustomization.yaml -> inert (a bring-your-own DATABASE_URL rides
# app-secret.externalsecret.yaml, key DATABASE_URL, instead).
#
# PRODUCER (Crossplane, ADR-033 §"Vault path contract"): the CapstoneTenant Composition
# provisions a per-(team,env) MariaDB schema (mysql) or Postgres database+role (postgres)
# and PushSecrets the FOUR parts (username / password / host / port) to Vault at
# secret/data/tenants/<team>/<env>/database — SAME parts + path for both engines.
# The password is generated at runtime, so the parts — NOT a whole URL — live in Vault.
#
# CONSUMER (this file): reads those four parts via the per-tenant `vault-tenant`
# SecretStore (same store app-secret uses) and ASSEMBLES the engine DSN (mysql:// or
# postgresql://, chosen by values.database) in target.template into the in-namespace
# Secret `<app>-db` (key DATABASE_URL), which the
# base Deployment envs into DATABASE_URL. The dbname follows the fixed STRUCTURAL rule
# <teamDb>_<env> (teamDb = team slug with '-' -> '_') — it is deterministic (set by the
# Composition's crossplane.io/external-name), so it is NOT stored in Vault.
#
# ZERO-CONFIG: deletionPolicy Delete means a MISSING Vault leaf is NOT an error — before
# the DB is provisioned the ExternalSecret stays healthy and creates no Secret, and the
# base's `optional: true` on DATABASE_URL lets the app start (data routes degrade to a
# clear "DATABASE_URL not set" error, /healthz stays green). The Secret appears on the
# next refresh once Crossplane has pushed the parts to Vault.
{%- if values.database == 'mysql' or values.database == 'postgres' %}
{%- if values.database == 'postgres' %}
{%- set dbScheme = 'postgresql' %}
{%- else %}
{%- set dbScheme = 'mysql' %}
{%- endif %}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${{ values.appName }}-db
  namespace: ${{ values.team }}-prod
  labels:
    app.kubernetes.io/name: ${{ values.appName }}
    platform.capstone/component: tenant
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-tenant          # the per-tenant store (same one app-secret uses)
    kind: SecretStore
  target:
    name: ${{ values.appName }}-db       # the k8s Secret the workload consumes (key DATABASE_URL)
    creationPolicy: Owner
    deletionPolicy: Delete               # missing Vault leaf != error (zero-config: no DB yet -> no Secret)
    template:
      engineVersion: v2
      data:
        # Assembled DSN. The four {{ .parts }} come from Vault (data: below); the dbname
        # is the fixed structural rule <teamDb>_<env> (teamDb = team slug, '-' -> '_').
        DATABASE_URL: "${{ dbScheme }}://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/${{ values.team | replace('-','_') }}_prod"
  data:
    - secretKey: username
      remoteRef:
        key: tenants/${{ values.team }}/prod/database
        property: username
    - secretKey: password
      remoteRef:
        key: tenants/${{ values.team }}/prod/database
        property: password
    - secretKey: host
      remoteRef:
        key: tenants/${{ values.team }}/prod/database
        property: host
    - secretKey: port
      remoteRef:
        key: tenants/${{ values.team }}/prod/database
        property: port
{%- endif %}
