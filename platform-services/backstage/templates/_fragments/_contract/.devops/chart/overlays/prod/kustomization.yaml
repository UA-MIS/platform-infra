# prod overlay — the production gate (§2.3, §4; promotion-model redesign, see
# artifacts/design/promotion-model.md in platform-infra). The gate is now the
# promote-to-prod workflow_dispatch (a human click), NOT an ArgoCD manual sync —
# ArgoCD auto-syncs whatever this overlay's images[].newTag says, and nothing
# writes that value except that workflow (promotion.yaml: prod trigger =
# manual:promote-to-prod) — with ONE exception: the FIRST-deploy seed. This overlay
# ships a v0.0.0 placeholder sentinel; on the FIRST push-to-main build, bump-dev's
# seed-initial-envs.sh rewrites it (ONLY while still at the sentinel) to the just-built
# image so prod is green out of the box. After that one-time seed it is promotion-gated
# as described — ongoing pushes bump ONLY dev. Values are explicit here for clarity even
# though the trigger/gate live in promotion.yaml. Image seam: prod=explicitly-promoted tag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ${{ values.team }}-prod
resources:
  - ../../base
{%- if values.single %}
  # ENV-BASED PROGRESSIVE DELIVERY (ADR-037): a single-component web project runs an Argo
  # Rollouts canary in PROD instead of the base Deployment. rollout.yaml adds the Rollout; the
  # `patches:` block below `$patch: delete`s the base Deployment of the same name so ONLY the
  # Rollout remains (kustomize can't retype a Deployment). dev/staging/preview never reference
  # rollout.yaml — they keep the base Deployment. Multi-component prod keeps Deployments too.
  - rollout.yaml
{%- endif %}
  # PodDisruptionBudget(s) — one per component. Shipped ONLY in staging/prod (replicas>1);
  # maxUnavailable:1 keeps a node drain/upgrade from evicting every replica of an app at once
  # (workload-level HA). dev/preview (1 replica) omit this file. Kind-agnostic (selects pod
  # labels), so it governs the prod Rollout's pods too. See pdb.yaml.
  - pdb.yaml
  # Per-tenant ESO store + SA (vault-tenant / eso-tenant, scoped to this team's
  # Vault path) — the tenant half of the ADR-030 B1 secrets contract.
  - secretstore.yaml
  # ${{ values.appName }}-secret ExternalSecret (demonstrates the secret path; APP_SECRET in
  # base is optional + deletionPolicy Delete so a fresh repo with no Vault value still
  # deploys — M4 zero-config).
  - app-secret.externalsecret.yaml
{%- if values.database == 'mysql' or values.database == 'postgres' %}
  # Auto-DB DATABASE_URL ExternalSecret (ADR-033 / #146). Present for BOTH auto-DB
  # engines (database: mysql OR postgres) — assembles the engine DSN (mysql:// or
  # postgresql://, chosen by values.database) from the Crossplane-provisioned parts in
  # Vault (tenants/${{ values.team }}/<env>/database) into the Secret `${{ values.appName }}-db`,
  # which the base Deployment envs into DATABASE_URL. This gate MUST match
  # database.externalsecret.yaml's own body guard AND the base Deployment's DATABASE_URL
  # source selection (deployments.yaml: `<app>-db` for mysql|postgres) — a mysql-only gate
  # here (the pre-fix bug) left postgres tenants with the Deployment pointing at an
  # <app>-db Secret this file never created, so DATABASE_URL was silently unset and the
  # app never connected to its provisioned DB. A bring-your-own / none stack omits this
  # file entirely (the DATABASE_URL, if any, rides app-secret instead).
  - database.externalsecret.yaml
{%- endif %}
  # harbor-pull image-pull cred (SA imagePullSecrets:[harbor-pull], #C3) is NOT shipped by
  # this overlay. It is owned SOLELY by the platform operator's tenant directory
  # (platform-infra/tenants/<team>/harbor-pull-<env>-sealed.yaml, synced by the tenant-<team>
  # Application and minted by `make harbor-robot`). The base ServiceAccount keeps
  # imagePullSecrets:[harbor-pull] so the pod still pulls from the private Harbor project;
  # the secret is provided out-of-band by that single owner. Shipping a placeholder
  # SealedSecret here too made harbor-pull a dual-owner resource, triggering ArgoCD's
  # SharedResourceWarning and blocking sync (twin of the harbor-push fix, #117). RESERVED
  # for a post-v1 ESO flip: Vault path `secret/data/tenants/<team>/<env>/harbor-pull` (key
  # .dockerconfigjson); ADR-030 follow-on, coordinated with eso-vault.
  # capstone:secrets — The Process "Secrets" tab (M3 ESO rework, ADR-030 §5) adds user
  # secret keys by APPENDING a `data[]` entry to app-secret.externalsecret.yaml above
  # (one ExternalSecret / one k8s Secret `${{ values.appName }}-secret` per env; all keys
  # share the Vault object `tenants/${{ values.team }}/<env>/app`) — it does NOT add files
  # here. Manifests must stay INSIDE this overlay dir: a kustomize resource that escapes
  # the chart/ root (e.g. ../../../secrets/...) fails ArgoCD's default load restrictor.
labels:
  - pairs:
      platform.capstone/env: prod
      platform.capstone/semester: ${{ values.semester }}
    includeSelectors: false
# ONE images[] entry PER COMPONENT (nunjucks loop); all share the gated semver tag.
images:
{%- for c in values.components %}
{%- if c.buildType != "mobile-artifact" %}
  - name: ${{ values.appName }}-${{ c.name }}
    newName: harbor.capstone.uamishub.com/${{ values.team }}/${{ values.appName }}-${{ c.name }}
    # FIRST-DEPLOY PLACEHOLDER SENTINEL. Do NOT hand-set a semver here: a bare
    # semver like 0.1.0 references an image CI has NOT built on a brand-new tenant
    # -> ImagePullBackOff out of the box (the bug this replaces). On the first CI run
    # seed-initial-envs.sh points this at the first REAL built image so prod is green
    # out of the box too. Thereafter NOTHING writes this overlay except the
    # promote-to-prod gate (promote.sh reads staging's live tag and writes it here) —
    # ongoing pushes bump ONLY dev, so prod is never auto-deployed on a commit.
    newTag: v0.0.0
{%- endif %}
{%- endfor %}
# Prod runs more replicas; quota ceiling is higher (§3.2).
# Per-component replica count via a JSON6902 `op: replace` (NOT the builtin `replicas:`
# transformer, which is hard-wired to Deployment/StatefulSet/ReplicaSet/RC and ERRORS on a
# progressive-delivery argoproj.io/Rollout — #337). In PROD a single-component web project's
# workload is a Rollout (env-based progressive delivery, ADR-037), so its replicas patch
# targets the Rollout GVK; every other case (multi-component prod, and dev/staging/preview)
# targets the base Deployment. Naming the kind also excludes the same-named Service. Base pins
# replicas:1, so `replace` always has a path to hit.
patches:
{%- if values.single %}
  # Delete the base Deployment of each component (single-component prod runs the Rollout from
  # rollout.yaml instead — ADR-037). kustomize keys Deployment vs Rollout separately by GVK, so
  # deleting the Deployment leaves only the Rollout of the same name.
{%- for c in values.components %}
{%- if c.buildType != "mobile-artifact" %}
  - patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ${{ values.appName }}-${{ c.name }}
{%- endif %}
{%- endfor %}
{%- endif %}
{%- for c in values.components %}
{%- if c.buildType != "mobile-artifact" %}
  - target:
{%- if values.single %}
      group: argoproj.io
      kind: Rollout
{%- else %}
      kind: Deployment
{%- endif %}
      name: ${{ values.appName }}-${{ c.name }}
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
{%- endif %}
{%- endfor %}
  - target:
      kind: Ingress
      name: ${{ values.appName }}
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: ${{ values.appName }}.capstone.uamishub.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: ${{ values.appName }}.capstone.uamishub.com
