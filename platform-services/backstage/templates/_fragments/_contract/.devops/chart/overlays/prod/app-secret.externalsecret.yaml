# App secret — ESO ExternalSecret (ADR-030 B1, "no secret material in git").
#
# This declares the NAME + Vault POINTER only — NO value. ESO (via the per-tenant
# vault-tenant SecretStore) reads the value from Vault at
# secret/data/tenants/${{ values.team }}/prod/app (key APP_SECRET) and materializes the
# in-namespace Secret `${{ values.appName }}-secret` (key `APP_SECRET`), which the base
# Deployment envs into APP_SECRET. This replaces the Phase-1 SealedSecret (D-006) with
# the v1 ESO model — the value lives in Vault, written by the platform or by The
# Process "Secrets" tab (PushSecret / vault kv put), never committed here.
#
# M4 ZERO-CONFIG: deletionPolicy Delete means a MISSING Vault key is NOT an error —
# the ExternalSecret stays healthy and simply creates no Secret. Combined with the
# base's `optional: true` on APP_SECRET, a freshly-scaffolded app with nothing in
# Vault still deploys (the app reports "secret loaded: false"). A team that needs the
# secret writes it to Vault and the Secret appears on the next refresh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${{ values.appName }}-secret
  namespace: ${{ values.team }}-prod
  labels:
    app.kubernetes.io/name: ${{ values.appName }}
    platform.capstone/component: tenant
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-tenant
    kind: SecretStore          # the per-tenant store (NOT the ClusterSecretStore)
  target:
    name: ${{ values.appName }}-secret   # the k8s Secret the workload consumes
    creationPolicy: Owner
    deletionPolicy: Delete               # missing Vault key != error (M4 zero-config)
  data:
    - secretKey: APP_SECRET
      remoteRef:
        key: tenants/${{ values.team }}/prod/app
        property: APP_SECRET
{%- if values.dbWired and values.database != 'mysql' and values.database != 'postgres' %}
    # DATABASE_URL (BRING-YOUR-OWN only) — same per-env Vault object as APP_SECRET
    # (property DATABASE_URL), typed by the team via the Secrets tab. BOTH auto-DB
    # engines (database: mysql AND postgres) do NOT use this entry — they ride the
    # separate platform-owned database.externalsecret.yaml (<app>-db, ADR-033), and the
    # base Deployment sources DATABASE_URL from <app>-db for mysql|postgres. So this
    # bring-your-own entry MUST exclude postgres too: otherwise a postgres tenant gets a
    # dead DATABASE_URL pointer here (ignored by the Deployment) whose missing /app
    # property would fail the whole app-secret ExternalSecret. deletionPolicy Delete
    # means a missing key is not an error (zero-config).
    - secretKey: DATABASE_URL
      remoteRef:
        key: tenants/${{ values.team }}/prod/app
        property: DATABASE_URL
{%- endif %}
