[package]
name = "app"
version = "0.0.0"
edition = "2021"

# Fixed binary name "app" so the Dockerfile can COPY a deterministic
# target/release/app (the scaffolded project name is surfaced in code via APP_NAME).
[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sqlx with RUNTIME queries only (no compile-time DB / no DATABASE_URL needed to build).
# No TLS feature is enabled (the in-cluster MySQL link is plaintext, matching the other
# fragments' drivers) which also keeps the build free of a C toolchain/OpenSSL.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "macros"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
