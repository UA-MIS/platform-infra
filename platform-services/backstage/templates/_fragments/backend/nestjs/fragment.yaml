# fragment.yaml — see _fragments/backend/express/fragment.yaml for the BACKEND CONTRACT
# and ADR-034 for the architecture. Backend fragment: NestJS + TypeScript on MySQL.
apiVersion: platform.capstone/fragment.v1
id: nestjs
displayName: NestJS API (TypeScript + MySQL)
category: backend
language: typescript
framework: nestjs
# A backend can be the `backend` half of a frontend+backend project OR a `single`
# API-only project. (As single it owns "/"; as the backend half it owns "/api".)
slots:
  - backend
  - single
defaultPort: 8080
ingressPath: /api          # the backend half owns "/api"; the engine forces "/" when it is the single component
needsDB: true              # reads DATABASE_URL (mysql://...) — the wizard offers the DB question
buildType: container
dockerfile: Dockerfile
healthPath: /healthz
# BACKEND CONTRACT (load-bearing for the fan-out): a backend fragment MUST serve
#   - GET /healthz  -> 200, DB-INDEPENDENT (the chart probes hit this; stays green with no DB)
#   - its API under /api/... (so the ingress /api route reaches it in a frontend+backend app)
# and MUST read its DB connection from the DATABASE_URL env (a standard mysql:// URI),
# degrading cleanly (clear 503) when it is unset (M4 zero-config). NEVER hardcode creds.
notes: >-
  NestJS (TypeScript) + mysql2 JSON API with a sample /api/items CRUD. A global prefix
  routes the API under /api (with /healthz + /health excluded so the chart probes hit a
  DB-independent root path). Reads DATABASE_URL; data routes return 503 until it is set.
