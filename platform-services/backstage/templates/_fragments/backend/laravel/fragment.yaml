# fragment.yaml — see _fragments/backend/express/fragment.yaml (and ADR-034) for the
# BACKEND CONTRACT. Backend fragment: PHP / Laravel (API routes) on MySQL.
apiVersion: platform.capstone/fragment.v1
id: laravel
displayName: PHP / Laravel API (MySQL)
category: backend
language: php
framework: laravel
slots:
  - backend
  - single
defaultPort: 8080
ingressPath: /api
needsDB: true
# DEPLOY-TIME MIGRATION (D-123, board #48) — MIGRATIONS.md's contract, now actually executed
# by the chart's migration initContainer. `artisan serve` (the CMD) never migrates, so the
# shipped database/migrations/ never ran. --force is REQUIRED: artisan refuses to migrate in
# a production environment without it. artisan + vendor/ are already in the runtime image;
# applied migrations are recorded in the `migrations` table, so re-running is a no-op.
# CONCURRENCY (measured, D-123): artisan migrate takes NO lock by default (--isolated needs a
# lock-capable cache store; this image runs CACHE_STORE=array), so replicas racing an empty
# database make the losers exit 1 on `1050 Table ... already exists`; the winner's schema is
# correct and the chart's bounded retry absorbs it.
migrate: php artisan migrate --force
buildType: container
dockerfile: Dockerfile
healthPath: /healthz
notes: >-
  Laravel 12 (API routes) with a sample /api/items CRUD resource (Eloquent). The
  DB-independent GET /healthz stays 200 with no database. Reads DATABASE_URL (a mysql://
  URI, parsed by Laravel's connection-URL support) via the pdo_mysql driver. When
  DATABASE_URL is unset the data routes degrade to a clear 503 while /healthz stays green.
  Run `php artisan migrate` at deploy time (see MIGRATIONS.md). Listens on $PORT; non-root,
  read-only-fs (logs to stderr, array cache/session, no Blade compilation).
