# fragment.yaml — see _fragments/backend/express/fragment.yaml (and ADR-034) for the
# BACKEND CONTRACT. Backend fragment: PHP / Laravel (API routes) on MySQL.
apiVersion: platform.capstone/fragment.v1
id: laravel
displayName: PHP / Laravel API (MySQL)
category: backend
language: php
framework: laravel
slots:
  - backend
  - single
defaultPort: 8080
ingressPath: /api
needsDB: true
# DEPLOY-TIME MIGRATIONS (F-1/#48). Ships database/migrations; the runtime CMD is
# `artisan serve` only, so nothing applies them at boot. --force is required because
# APP_ENV=production makes artisan prompt for confirmation otherwise (a prompt in an
# initContainer would hang, not fail). --isolated is deliberately NOT used: the image
# sets CACHE_STORE=array, a per-process driver that cannot provide a cross-pod lock.
migrate:
  - php
  - artisan
  - migrate
  - --force
buildType: container
dockerfile: Dockerfile
healthPath: /healthz
notes: >-
  Laravel 12 (API routes) with a sample /api/items CRUD resource (Eloquent). The
  DB-independent GET /healthz stays 200 with no database. Reads DATABASE_URL (a mysql://
  URI, parsed by Laravel's connection-URL support) via the pdo_mysql driver. When
  DATABASE_URL is unset the data routes degrade to a clear 503 while /healthz stays green.
  Run `php artisan migrate` at deploy time (see MIGRATIONS.md). Listens on $PORT; non-root,
  read-only-fs (logs to stderr, array cache/session, no Blade compilation).
