# fragment.yaml — see _fragments/backend/express/fragment.yaml (and ADR-034) for the
# BACKEND CONTRACT. Backend fragment: Python / Django + Django REST Framework on MySQL.
apiVersion: platform.capstone/fragment.v1
id: django
displayName: Python / Django + DRF API (MySQL)
category: backend
language: python
framework: django
slots:
  - backend
  - single
defaultPort: 8080
ingressPath: /api
needsDB: true
# DEPLOY-TIME MIGRATION (D-123, board #48) — MIGRATIONS.md's contract, now actually executed
# by the chart's migration initContainer instead of only documented. gunicorn (the CMD) never
# runs migrate, so without this the shipped items/migrations/0001_initial.py is dead weight
# and /api/items 500s on a missing table. `manage.py` + the venv are already in the runtime
# image; --noinput keeps it non-interactive. Django records applied migrations in
# django_migrations, so re-running on every deploy is a no-op. CONCURRENCY (measured,
# D-123): migrate takes NO cross-process lock — replicas racing an empty database make the
# losers exit 1 on `1050 Table ... already exists`; the winner's schema is correct and the
# chart's bounded retry absorbs it.
migrate: python manage.py migrate --noinput
buildType: container
dockerfile: Dockerfile
healthPath: /healthz
notes: >-
  Django + Django REST Framework with a sample /api/items CRUD resource. DB-independent
  GET /healthz stays 200 with no database. Reads DATABASE_URL (a mysql:// URI, parsed by
  dj-database-url) and uses the pure-Python PyMySQL driver (installed as MySQLdb) so the
  image needs no apt/compiler. When DATABASE_URL is unset the data routes degrade to a
  clear 503 while /healthz stays green (M4 zero-config). Run `python manage.py migrate`
  at deploy time (see MIGRATIONS.md). Listens on $PORT via gunicorn; non-root, read-only-fs.
