# fragment.yaml — see _fragments/backend/express/fragment.yaml (and ADR-034) for the
# BACKEND CONTRACT. Backend fragment: Ruby / Rails (API-only) on MySQL.
apiVersion: platform.capstone/fragment.v1
id: rails
displayName: Ruby on Rails API (API-only, MySQL)
category: backend
language: ruby
framework: rails
slots:
  - backend
  - single
defaultPort: 8080
ingressPath: /api
needsDB: true
# DEPLOY-TIME MIGRATIONS (F-1/#48). Ships db/migrate; the runtime CMD is puma only.
# This is exactly the argv skeleton/MIGRATIONS.md already documents as the contract
# ("applied at deploy time — as a one-shot Job or an init-container — NOT from the
# running app process"); this fragment declared the expectation before the contract
# could honour it. Safe under readOnlyRootFilesystem: production.rb sets
# `config.active_record.dump_schema_after_migration = false`, so no schema.rb write.
# Invoked as `ruby bin/rails` rather than `bin/rails`: the scaffolder renders every file
# through nunjucks and writes it fresh, which does NOT preserve the source tree's exec
# bit, so bin/rails arrives in the image as -rw-rw-r-- and `exec bin/rails` dies with
# "permission denied". Verified by building this fragment's real image and running both
# forms, 2026-08-25. (Same reason MIGRATIONS.md's literal `bin/rails db:migrate` would
# not have worked from a scaffolded repo — filed separately.)
migrate:
  - ruby
  - bin/rails
  - db:migrate
buildType: container
dockerfile: Dockerfile
healthPath: /healthz
notes: >-
  Rails 8 in --api mode with a sample /api/items CRUD resource (Active Record). The
  DB-independent GET /healthz stays 200 with no database. Reads DATABASE_URL (a mysql://
  URI, rewritten to trilogy:// in config/database.yml) and uses the Trilogy client, which
  needs no libmysqlclient at runtime so the image stays slim. When DATABASE_URL is unset
  the data routes degrade to a clear 503 while /healthz stays green. Run `bin/rails
  db:migrate` at deploy time (see MIGRATIONS.md). Listens on $PORT via Puma; non-root,
  read-only-fs (bootsnap disabled, in-memory cache, logs to stdout, no pidfile).
