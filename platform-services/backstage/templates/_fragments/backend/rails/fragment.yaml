# fragment.yaml — see _fragments/backend/express/fragment.yaml (and ADR-034) for the
# BACKEND CONTRACT. Backend fragment: Ruby / Rails (API-only) on MySQL.
apiVersion: platform.capstone/fragment.v1
id: rails
displayName: Ruby on Rails API (API-only, MySQL)
category: backend
language: ruby
framework: rails
slots:
  - backend
  - single
defaultPort: 8080
ingressPath: /api
needsDB: true
# DEPLOY-TIME MIGRATION (D-123, board #48) — this is MIGRATIONS.md's own words ("at deploy
# time - as a one-shot Job or an init-container - NOT from the running app process"), now
# actually executed by the chart's migration initContainer. Puma (the CMD) never migrates.
# The gems + db/migrate are already in the runtime image. Applied versions are recorded in
# schema_migrations, so re-running on every deploy is a no-op. RAILS_ENV=production (image ENV)
# means the schema file is NOT dumped afterwards, which matters under readOnlyRootFilesystem.
# CONCURRENCY (measured, D-123): Active Record takes an advisory lock but does NOT queue on it
# — a losing replica raises ActiveRecord::ConcurrentMigrationError and exits 1. That is safe
# (it refuses rather than double-applying) and the chart's bounded retry absorbs it.
migrate: bundle exec rails db:migrate
buildType: container
dockerfile: Dockerfile
healthPath: /healthz
notes: >-
  Rails 8 in --api mode with a sample /api/items CRUD resource (Active Record). The
  DB-independent GET /healthz stays 200 with no database. Reads DATABASE_URL (a mysql://
  URI, rewritten to trilogy:// in config/database.yml) and uses the Trilogy client, which
  needs no libmysqlclient at runtime so the image stays slim. When DATABASE_URL is unset
  the data routes degrade to a clear 503 while /healthz stays green. Run `bin/rails
  db:migrate` at deploy time (see MIGRATIONS.md). Listens on $PORT via Puma; non-root,
  read-only-fs (bootsnap disabled, in-memory cache, logs to stdout, no pidfile).
