# fragment.yaml — see _fragments/backend/express/fragment.yaml for the BACKEND CONTRACT
# and ADR-034 for the architecture. Backend fragment: Go / Gin on MySQL.
apiVersion: platform.capstone/fragment.v1
id: go
displayName: Go API (Gin + MySQL)
category: backend
language: go
framework: gin
slots:
  - backend
  - single
defaultPort: 8080
ingressPath: /api
needsDB: true
buildType: container
dockerfile: Dockerfile
healthPath: /healthz
notes: >-
  Go + Gin JSON API (database/sql + go-sql-driver/mysql) with a sample /api/items CRUD.
  Reads DATABASE_URL (a standard mysql:// URI, converted to the driver DSN at runtime);
  the data routes return a clear 503 until it is set, while /healthz is DB-independent and
  stays green for the chart probes. NEVER hardcodes credentials. Multi-stage build compiles
  a static (CGO-off) binary into distroless/static:nonroot (uid 65532, read-only-root safe).
