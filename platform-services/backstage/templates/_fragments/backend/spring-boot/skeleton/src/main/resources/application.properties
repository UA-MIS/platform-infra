# Bind the container PORT (the platform chart sets PORT=8080 and the Service/Ingress
# target it). `${PORT:8080}` is Spring's own placeholder (single brace) — the scaffolder
# only substitutes the double-brace dollar form, so a single-brace Spring placeholder
# passes through untouched.
server.port=${PORT:8080}

# spring.application.name previously held the scaffolder's double-brace app-name token
# directly. Spring ITSELF parses this file with its own single-brace PropertySources-
# PlaceholderConfigurer (unlike a plain source file, which the runtime never re-
# interprets), so on the RAW, unrendered skeleton the extra outer brace pair of that token
# is read as a nested Spring placeholder whose name is literally "{ values.appName }" (with
# the braces/spaces as part of the name) — unresolvable, so Spring throws
# PlaceholderResolutionException at ApplicationContext startup, which fails EVERY
# @SpringBootTest, including /healthz. Fixed the same way the other backend fragments avoid
# this class of bug (go/express/fastapi keep scaffolder tokens out of files their runtime
# actually parses as templates): use a Spring-native env-var placeholder here, matching the
# PORT line above, and let the real per-project name live in files Spring does NOT parse —
# pom.xml's name/description elements (Maven leaves an unresolved property expression as
# literal text instead of failing hard) and the compiled Java literals in HealthController's
# "/" and "/api/health" JSON responses (those are scaffolder-rendered at COPY time, then
# just plain Java strings — the JVM never re-parses them as placeholders). This property is
# Spring's own internal app-name bookkeeping (actuator/logging), not surfaced by any route
# this fragment serves, so a generic default is correct both raw and rendered.
spring.application.name=${APP_NAME:app}

# DataSource auto-configuration is disabled in Application.java; the MySQL connection is
# built at runtime from the DATABASE_URL env (see Db.java). Nothing DB-related lives here,
# so the app starts with zero config and the data routes report 503 until DATABASE_URL is
# set via The Process "Secrets" tab. NEVER put credentials in this file.
