# nginx.conf — serves the built Vite SPA. Configured to run FULLY under the platform's
# hardened pod securityContext: runAsNonRoot (uid 65532) + readOnlyRootFilesystem: true.
#
# The ONLY writable location in such a pod is /dev/shm (a tmpfs the container runtime
# mounts read-write, independent of the read-only rootfs), so nginx's pid and every temp
# path point there and the logs go to stdout/stderr — nginx NEVER writes to the read-only
# root filesystem, and no writable volume is required from the chart.
worker_processes auto;
# No `user` directive on purpose: the master process is NOT root (it runs as uid 65532 per
# the chart), so workers simply inherit that uid.
pid /dev/shm/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # All writable scratch under /dev/shm (the one rw tmpfs in a readOnlyRootFilesystem pod).
  client_body_temp_path /dev/shm/client_temp;
  proxy_temp_path       /dev/shm/proxy_temp;
  fastcgi_temp_path     /dev/shm/fastcgi_temp;
  uwsgi_temp_path       /dev/shm/uwsgi_temp;
  scgi_temp_path        /dev/shm/scgi_temp;

  access_log /dev/stdout;
  sendfile   on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    # Listen on this component's port (.devops/components.yaml frontend.port). Non-root can
    # bind ports >1024. Matches the chart containerPort + Service targetPort. If you change
    # the frontend port in components.yaml, update this listen directive to match.
    listen ${{ values.port }};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Probe endpoint — the chart readiness/liveness probes hit /healthz on the pod
    # DIRECTLY (not via the ingress), uniform across components. NOT routed to the backend
    # (the ingress sends /api to the backend before traffic ever reaches this pod).
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # SPA routing: serve the requested static asset, else fall back to index.html so
    # client-side routes (@solidjs/router) resolve.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
