# nginx config for the static SPA — copied to /etc/nginx/nginx.conf by the Dockerfile.
#
# Designed to run NON-ROOT (UID 65532) under a READ-ONLY root filesystem, where exactly two
# writable paths exist: an emptyDir the Deployment mounts at /tmp (node disk, uncapped), and
# /dev/shm, which the container runtime provides as a tmpfs. readOnlyRootFilesystem only
# remounts the container root, so both survive it. Everything else — including /var/run and
# /var/cache/nginx — is read-only and MUST NOT be used: nginx's compiled-in defaults put its
# temp dirs under /var/cache/nginx, which aborts the master at startup with
# "mkdir() ... failed (30: Read-only file system)". Hence the explicit *_temp_path overrides
# below; without them this config does not boot in-cluster.
#
# WHY /dev/shm RATHER THAN THE CHART-DECLARED /tmp: consistency. Every other nginx-based
# fragment (bare-html, vue, angular, react, solid) already puts its pid and temp dirs under
# /dev/shm. react-static was the sole outlier, and divergence between siblings is the exact
# defect class that produced this bug. Deliberate, adjudicated choice — not an accident.
#
# ⚠ SIZE CEILING — /dev/shm IS A 64 MiB tmpfs. That is a kubelet default the chart cannot
# resize. It is ample here because this is a GET-only static SPA: four of the five temp dirs
# below (proxy/fastcgi/uwsgi/scgi) are created at boot and never written, since a static site
# has no proxy_pass or upstream handlers, and only client_body_temp can ever take bytes —
# bounded by nginx's 1 MiB default client_max_body_size.
#
# ⚠ DO NOT COPY THIS PATTERN INTO ANY FRAGMENT THAT ACCEPTS REQUEST BODIES OR UPLOADS.
# tmpfs pages are charged to the pod's memory cgroup, so filling /dev/shm surfaces as an
# OOMKill — not a clean ENOSPC — which is far harder to diagnose. An upload-handling fragment
# must buffer to the /tmp emptyDir (node disk, uncapped) instead, or raise its memory limit
# deliberately with the tmpfs accounted for.
#
# There is intentionally NO `user` directive — the container already runs as the right UID,
# and `user` is ignored (with a warning) for a non-root master. Logs go to stdout/stderr so
# nothing is written to disk.

worker_processes  auto;
pid               /dev/shm/nginx.pid;
error_log         /dev/stderr  warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # All writable scratch under /dev/shm (64 MiB tmpfs — see the size ceiling and the
    # do-not-copy warning in the header). Overriding every *_temp_path is required, not
    # cosmetic: nginx creates all five directories at startup and aborts if it cannot,
    # even though only client_body_temp ever receives bytes on a static site.
    client_body_temp_path /dev/shm/client_temp;
    proxy_temp_path       /dev/shm/proxy_temp;
    fastcgi_temp_path     /dev/shm/fastcgi_temp;
    uwsgi_temp_path       /dev/shm/uwsgi_temp;
    scgi_temp_path        /dev/shm/scgi_temp;

    access_log    /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;
    server_tokens off;

    # Compress text assets (Vite emits hashed .js/.css).
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    server {
        # Unprivileged port (>1024) so the non-root process can bind it. Value comes
        # from .devops/app-metadata.yaml (port) — keep it in sync with the container port.
        listen      ${{ values.port }};
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Liveness/readiness endpoint for the platform probes (Deployment hits /healthz).
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # Long-cache the content-hashed build assets; they are immutable per build.
        location /assets/ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            try_files  $uri =404;
        }

        # SPA fallback: any path that is not a real file serves index.html, so
        # client-side routes (e.g. /about) work on a hard refresh or deep link.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
