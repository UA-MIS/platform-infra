# nginx config for the static SPA — copied to /etc/nginx/nginx.conf by the Dockerfile.
#
# Designed to run NON-ROOT (UID 65532) under a READ-ONLY root filesystem: the pid file and
# temp dirs live under /dev/shm (the one rw tmpfs the container runtime mounts, independent
# of the read-only rootfs), and logs go to stdout/stderr so nothing is written to disk.
# The Deployment mounts ONE writable volume — an emptyDir at /tmp — so /var/run and
# /var/cache/nginx are on the read-only rootfs and MUST NOT be used: nginx's compiled-in
# defaults put its temp dirs under /var/cache/nginx, which aborts the master at startup
# with "mkdir() ... failed (30: Read-only file system)". Hence the explicit *_temp_path
# overrides below — without them this config does not boot in-cluster.
# There is intentionally NO `user` directive — the container already runs as the right UID,
# and `user` is ignored (with a warning) for a non-root master.

worker_processes  auto;
pid               /dev/shm/nginx.pid;
error_log         /dev/stderr  warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # All writable scratch under /dev/shm (the one rw tmpfs in a readOnlyRootFilesystem
    # pod). Overriding every *_temp_path is required, not cosmetic: nginx creates these
    # directories at startup and aborts if it cannot.
    client_body_temp_path /dev/shm/client_temp;
    proxy_temp_path       /dev/shm/proxy_temp;
    fastcgi_temp_path     /dev/shm/fastcgi_temp;
    uwsgi_temp_path       /dev/shm/uwsgi_temp;
    scgi_temp_path        /dev/shm/scgi_temp;

    access_log    /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;
    server_tokens off;

    # Compress text assets (Vite emits hashed .js/.css).
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    server {
        # Unprivileged port (>1024) so the non-root process can bind it. Value comes
        # from .devops/app-metadata.yaml (port) — keep it in sync with the container port.
        listen      ${{ values.port }};
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Liveness/readiness endpoint for the platform probes (Deployment hits /healthz).
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # Long-cache the content-hashed build assets; they are immutable per build.
        location /assets/ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            try_files  $uri =404;
        }

        # SPA fallback: any path that is not a real file serves index.html, so
        # client-side routes (e.g. /about) work on a hard refresh or deep link.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
