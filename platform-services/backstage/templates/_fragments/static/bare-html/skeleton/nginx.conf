# nginx config for the no-framework static site — copied to /etc/nginx/nginx.conf by the
# Dockerfile.
#
# Designed to run NON-ROOT (uid 65532) under a READ-ONLY root filesystem: the pid file and
# temp dirs live under /dev/shm (the one rw tmpfs the container runtime mounts, independent
# of the read-only rootfs), and logs go to stdout/stderr so nothing is written to disk.
# There is intentionally NO `user` directive — the container already runs as the right uid.
worker_processes  auto;
pid               /dev/shm/nginx.pid;
error_log         /dev/stderr  warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # All writable scratch under /dev/shm (the one rw tmpfs in a readOnlyRootFilesystem pod).
  client_body_temp_path /dev/shm/client_temp;
  proxy_temp_path       /dev/shm/proxy_temp;
  fastcgi_temp_path     /dev/shm/fastcgi_temp;
  uwsgi_temp_path       /dev/shm/uwsgi_temp;
  scgi_temp_path        /dev/shm/scgi_temp;

  access_log /dev/stdout;
  sendfile   on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    # Unprivileged port (>1024) so the non-root process can bind it. Value comes from
    # .devops/components.yaml (port) — keep it in sync with the container port.
    listen      ${{ values.port }};
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Liveness/readiness endpoint for the platform probes (the chart hits /healthz).
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # Cache the static asset dirs (tune as you like).
    location /css/ { expires 1h; try_files $uri =404; }
    location /js/  { expires 1h; try_files $uri =404; }

    # Multi-page static serving: serve the requested file, allow extensionless `.html`
    # (e.g. /about -> /about.html), then a directory index, else the custom 404 page.
    # This is a MULTI-PAGE site, so there is NO SPA fallback to index.html.
    location / {
      try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
  }
}
