# VirtualMachine — your app, running as a REAL VM inside the cluster (ADR-032).
#
# This is the "no Docker" equivalent of a Deployment: instead of a container image
# built from a Dockerfile, the workload is a full guest OS. CDI imports a base disk
# image (dataVolumeTemplates below) onto ceph-block, and cloud-init (the secretRef
# volume -> .devops/chart/base/cloud-init.yaml) installs + starts YOUR app on first
# boot. A Service + Ingress (this dir) give it the standard <app>.<domain> URL.
#
# WHAT YOU EDIT:
#   - .devops/chart/base/cloud-init.yaml  — install your runtime/DB/services (first boot).
#   - the `source:` below                 — point at YOUR base disk image (or an http URL).
#   - .devops/vm-metadata.yaml            — the sizing knobs (mirror of cpu/mem/disk/port).
# Everything else (Service/Ingress wiring, labels, the GitOps tier) is platform-managed.
#
# Manifest shapes verified via Context7 (/kubevirt/user-guide, 2026-06-28):
# kubevirt.io/v1 VirtualMachine + cdi.kubevirt.io/v1beta1 DataVolume (dataVolumeTemplates),
# cloudInitNoCloud.secretRef (secret key `userdata`), masquerade pod networking,
# kubevirt.io/domain label as the Service selector, runStrategy.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ${{ values.appName }}
  labels:
    app.kubernetes.io/name: ${{ values.appName }}
spec:
  # Always = keep the VM running, restart on failure (the "it just runs" power state).
  # Alternatives (verified): Halted (defined but off), Manual (virtctl start/stop),
  # RerunOnFailure.
  runStrategy: Always

  # CDI imports the base disk image into a PVC on ceph-block (RBD). The PVC is created
  # AND deleted with the VM (template lifecycle). RBD is RWO (single-node attach — no
  # live-migration on this storage class, ADR-032 §5/open Q3).
  #
  # volumeMode: Filesystem (NOT Block): the CDI importer writes a raw disk.img onto a
  # filesystem PVC, which needs no raw-block privilege and so runs under the VM-tier
  # baseline PSA. Block mode requires a privileged importer (it does `blockdev` on
  # /dev/cdi-block-volume) that baseline PSA correctly denies -> importer
  # CrashLoopBackOff ("Permission denied"). The VM boots fine from the file-backed
  # PVC (CDI names the image disk.img, raw format, uid 107). Minor tradeoff: a thin
  # filesystem layer + ~10% FS overhead vs raw RBD block — negligible at capstone
  # scale. Confirmed via Context7 /kubevirt/containerized-data-importer +
  # /kubevirt/user-guide (CDI v1.65 / KubeVirt v1.8.4, 2026-06-28).
  dataVolumeTemplates:
    - metadata:
        name: ${{ values.appName }}-rootdisk
      spec:
        storage:
          accessModes:
            - ReadWriteOnce
          volumeMode: Filesystem
          storageClassName: ceph-block
          resources:
            requests:
              storage: ${{ values.diskGi }}Gi
        source:
          # BRING-YOUR-OWN DISK: a KubeVirt containerDisk in a registry. Override with
          # your own image. For an http(s) cloud-image instead, replace this whole
          # `registry:` block with:
          #     http:
          #       url: https://example.com/path/your-cloud-image.qcow2
          # For a PRIVATE containerDisk in your team's Harbor project, add:
          #     registry:
          #       url: ${{ values.baseImage }}
          #       secretRef: harbor-pull   # minted at onboarding (see the onboarding PR)
          registry:
            # dump-quoted (D-108 sweep, deck-reviewer finding): this is the LOAD-BEARING
            # copy -- the actual DataVolume source CDI imports from. baseImage is
            # unconstrained free text (a docker://host/repo:tag ref); unquoted, a
            # colon+space or a trailing comment breaks this field's YAML the same way
            # description broke catalog-info.yaml.
            url: ${{ values.baseImage | dump }}

  template:
    metadata:
      labels:
        # The Service (service.yaml) selects the VMI's launcher pod on THIS label.
        kubevirt.io/domain: ${{ values.appName }}
        app.kubernetes.io/name: ${{ values.appName }}
    spec:
      domain:
        cpu:
          # vCPUs RESERVED for the VM's whole lifetime (no overcommit). Mirror in
          # .devops/vm-metadata.yaml.
          cores: ${{ values.cpuCores }}
        resources:
          requests:
            # Guest RAM, reserved for the VM's whole lifetime (ADR-032 §5).
            memory: ${{ values.memoryGi }}Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            # masquerade = pod-network NAT behind the launcher pod IP. Works with the
            # cluster's Cilium CNI + the tenant default-deny NetworkPolicies with no
            # Multus/bridge complexity (ADR-032 §1/§2b).
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: ${{ values.appName }}-rootdisk
        - name: cloudinit
          cloudInitNoCloud:
            # First-boot setup = the "no Dockerfile" install step. The secret (key
            # `userdata`) is generated by kustomize from cloud-init.yaml in this dir
            # (disableNameSuffixHash -> stable name). cloud-init runs ONCE on first
            # boot; to re-run it, recreate the VM.
            secretRef:
              name: ${{ values.appName }}-cloudinit
