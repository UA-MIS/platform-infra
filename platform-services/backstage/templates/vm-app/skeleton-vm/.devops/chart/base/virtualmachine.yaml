# VirtualMachine — your app, running as a REAL VM inside the cluster (ADR-032).
#
# This is the "no Docker" equivalent of a Deployment: instead of a container image
# built from a Dockerfile, the workload is a full guest OS. CDI imports a base disk
# image (dataVolumeTemplates below) onto ceph-block, and cloud-init (the secretRef
# volume -> .devops/chart/base/cloud-init.yaml) installs + starts YOUR app on first
# boot. A Service + Ingress (this dir) give it the standard <app>.<domain> URL.
#
# WHAT YOU EDIT:
#   - .devops/chart/base/cloud-init.yaml  — install your runtime/DB/services (first boot).
#   - the `source:` below                 — point at YOUR base disk image (or an http URL).
#   - .devops/vm-metadata.yaml            — the sizing knobs (mirror of cpu/mem/disk/port).
# Everything else (Service/Ingress wiring, labels, the GitOps tier) is platform-managed.
#
# Manifest shapes verified via Context7 (/kubevirt/user-guide, 2026-06-28):
# kubevirt.io/v1 VirtualMachine + cdi.kubevirt.io/v1beta1 DataVolume (dataVolumeTemplates),
# cloudInitNoCloud.secretRef (secret key `userdata`), masquerade pod networking,
# kubevirt.io/domain label as the Service selector, runStrategy.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ${{ values.appName }}
  labels:
    app.kubernetes.io/name: ${{ values.appName }}
spec:
  # Always = keep the VM running, restart on failure (the "it just runs" power state).
  # Alternatives (verified): Halted (defined but off), Manual (virtctl start/stop),
  # RerunOnFailure.
  runStrategy: Always

  # CDI imports the base disk image into a PVC on ceph-block (RBD). The PVC is created
  # AND deleted with the VM (template lifecycle). RBD is RWO (single-node attach — no
  # live-migration on this storage class, ADR-032 §5/open Q3).
  #
  # volumeMode: Filesystem (NOT Block): the CDI importer writes a raw disk.img onto a
  # filesystem PVC, which needs no raw-block privilege and so runs under the VM-tier
  # baseline PSA. Block mode requires a privileged importer (it does `blockdev` on
  # /dev/cdi-block-volume) that baseline PSA correctly denies -> importer
  # CrashLoopBackOff ("Permission denied"). The VM boots fine from the file-backed
  # PVC (CDI names the image disk.img, raw format, uid 107). Minor tradeoff: a thin
  # filesystem layer + ~10% FS overhead vs raw RBD block — negligible at capstone
  # scale. Confirmed via Context7 /kubevirt/containerized-data-importer +
  # /kubevirt/user-guide (CDI v1.65 / KubeVirt v1.8.4, 2026-06-28).
  dataVolumeTemplates:
    - metadata:
        name: ${{ values.appName }}-rootdisk
      spec:
        storage:
          accessModes:
            - ReadWriteOnce
          volumeMode: Filesystem
          storageClassName: ceph-block
          resources:
            requests:
              storage: ${{ values.diskGi }}Gi
        source:
          # BRING-YOUR-OWN DISK: a KubeVirt containerDisk in a registry. Override with
          # your own image. For an http(s) cloud-image instead, replace this whole
          # `registry:` block with:
          #     http:
          #       url: https://example.com/path/your-cloud-image.qcow2
          # For a PRIVATE containerDisk in your team's Harbor project, add:
          #     registry:
          #       url: ${{ values.baseImage }}
          #       secretRef: harbor-pull   # minted at onboarding (see the onboarding PR)
          registry:
            # dump-quoted (D-108 sweep, deck-reviewer finding): this is the LOAD-BEARING
            # copy -- the actual DataVolume source CDI imports from. baseImage is
            # unconstrained free text (a docker://host/repo:tag ref); unquoted, a
            # colon+space or a trailing comment breaks this field's YAML the same way
            # description broke catalog-info.yaml.
            url: ${{ values.baseImage | dump }}

  template:
    metadata:
      labels:
        # The Service (service.yaml) selects the VMI's launcher pod on THIS label.
        kubevirt.io/domain: ${{ values.appName }}
        app.kubernetes.io/name: ${{ values.appName }}
    spec:
      # DNS — NOT optional, and NOT the cluster default. A VM's traffic leaves the
      # guest through the masquerade interface and never passes through a host
      # socket, so Cilium's socket load-balancer never runs and the kube-dns
      # ClusterIP (10.96.0.10) is never translated. The guest resolves NOTHING
      # while every pod in the same namespace resolves fine, and no NetworkPolicy
      # can fix it — a policy can allow an address, it cannot translate one.
      # Public resolvers + dnsPolicy:None is the shape the live reference VM runs.
      # See tenants/_template-vm/vm/namespaces/vm-prod.yaml, NetworkPolicy 4/5.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 1.0.0.1
      domain:
        cpu:
          # vCPUs RESERVED for the VM's whole lifetime (no overcommit). Mirror in
          # .devops/vm-metadata.yaml.
          cores: ${{ values.cpuCores }}
        # ── RESOURCES — all four values, deliberately. ────────────────────────
        # SETTING ONLY `requests.memory` HERE DOES NOT PRODUCE A VM THAT RUNS SLOWLY.
        # IT PRODUCES A VM THAT NEVER STARTS — and it inflates the ask while doing it.
        #
        # OBSERVED LIVE on paper-papas, 2026-08-27, with exactly this spec (an 8Gi
        # guest declaring a memory REQUEST and no limits):
        #
        #   Error creating pod: pods "virt-launcher-paper-papas-hv7dh" is forbidden:
        #   [maximum cpu usage per Container is 4, but limit is 8,
        #    maximum memory usage per Container is 6Gi, but limit is 17064Mi]
        #
        # Note the 17064Mi. When a memory LIMIT is absent, KubeVirt does not simply
        # pass the request through — it derives a launcher limit of roughly TWICE the
        # guest RAM. The same 8Gi guest on the reference VM, which DOES declare
        # `limits.memory`, produces an 8532Mi container (guest + ~340Mi overhead).
        # So declaring the limit does not merely add a field; it HALVES what the
        # namespace is asked for, from 17064Mi to 8532Mi. A tier ceiling sized for a
        # correct manifest will still reject an incorrect one.
        #
        # The failure is also invisible in the usual places: the VirtualMachine sits
        # at `Starting` and the VMI at `Pending` with no pod to inspect, because the
        # launcher is rejected at admission and never created. Only the namespace
        # EVENTS carry the reason, and KubeVirt retries in a loop that buries them.
        #
        # WHY request == limit for BOTH, rather than the reference VM's cpu 6/8 split:
        #   * Memory is incompressible and KubeVirt reserves the whole guest RAM for
        #     the VM's lifetime (ADR-032 §5), so request MUST equal limit. The
        #     vm-prod.yaml quota enforces exactly this with requests.memory ==
        #     limits.memory. This half is not a choice.
        #   * For CPU it IS a choice, and the obvious reason to prefer equality —
        #     Guaranteed QoS — turns out not to exist here. The launcher pod is
        #     Burstable no matter what this file says, because KubeVirt itself adds
        #     an `ephemeral-storage: 50M` REQUEST with no matching limit, and one
        #     unmatched resource is enough to disqualify the pod. Measured on the
        #     live reference VM:
        #         qosClass=Burstable
        #         compute req={cpu 6, ephemeral-storage 50M, memory 8532Mi}
        #                 lim={cpu 8,                        memory 8532Mi}
        #     So a 6/8 split buys nothing in eviction protection, and equality
        #     costs nothing in it either. The blueprint's "we WANT requests==limits
        #     (Guaranteed QoS)" aspiration is unreachable for VMs; do not re-derive
        #     a CPU split in pursuit of it.
        #   * What equality DOES buy is that this template stays arithmetic-free.
        #     A 75% split needs `cpuCores * 0.75` rounded, evaluated by the
        #     scaffolder's templating engine, in a resource field — and a silent
        #     templating error in a resource field is precisely the failure class
        #     this whole change exists to remove. An integer that is already an
        #     input cannot be miscomputed.
        #   * It also makes the quota arithmetic checkable rather than guessed:
        #     requests.cpu and limits.cpu are the same number, so a tier sized for N
        #     VMs of C cores is exactly N×C plus importer headroom. That is what
        #     hack/lint-vm-tier-bounds.py relies on.
        # The cost is honest: an idle VM reserves its full core count against the
        # namespace quota. On this 5-node/80-core cluster with
        # count/virtualmachines capped at 1 per team, that is affordable; if it
        # stops being affordable, lower the wizard's cpuCores maximum — the guard
        # will make the quota follow — rather than re-splitting here.
        #
        # KubeVirt adds its own overhead ON TOP of these numbers when it builds the
        # launcher pod — measured at ~340Mi of RAM and ~5m of CPU on the live
        # reference VM (an 8Gi guest becomes an 8532Mi container). The namespace
        # quota and LimitRange in tenants/_template-vm/vm/namespaces/vm-prod.yaml are
        # sized WITH that overhead included; do not size them from these numbers
        # directly.
        resources:
          requests:
            # Guest RAM, reserved for the VM's whole lifetime (ADR-032 §5).
            memory: ${{ values.memoryGi }}Gi
            cpu: "${{ values.cpuCores }}"
          limits:
            memory: ${{ values.memoryGi }}Gi
            cpu: "${{ values.cpuCores }}"
        devices:
          # virtio-rng. The cluster runs KubeVirt with useEmulation:true (QEMU TCG,
          # no hardware virt), where guest entropy accrues slowly. sshd generates its
          # host keys on first boot; starved of entropy that can stall for minutes,
          # which presents as "SSH is broken" rather than "SSH is not up yet". The
          # live reference VM carries this device.
          rng: {}
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            # masquerade = pod-network NAT behind the launcher pod IP. Works with the
            # cluster's Cilium CNI + the tenant default-deny NetworkPolicies with no
            # Multus/bridge complexity (ADR-032 §1/§2b).
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: ${{ values.appName }}-rootdisk
        - name: cloudinit
          cloudInitNoCloud:
            # First-boot setup = the "no Dockerfile" install step. The secret (key
            # `userdata`) is generated by kustomize from cloud-init.yaml in this dir
            # (disableNameSuffixHash -> stable name). cloud-init runs ONCE on first
            # boot; to re-run it, recreate the VM.
            secretRef:
              name: ${{ values.appName }}-cloudinit
