# VirtualMachine — your app, running as a REAL VM inside the cluster (ADR-032).
#
# This is the "no Docker" equivalent of a Deployment: instead of a container image
# built from a Dockerfile, the workload is a full guest OS. CDI imports a base disk
# image (dataVolumeTemplates below) onto ceph-block, and cloud-init (the secretRef
# volume -> .devops/chart/base/cloud-init.yaml) installs + starts YOUR app on first
# boot. A Service + Ingress (this dir) give it the standard <app>.<domain> URL.
#
# WHAT YOU EDIT:
#   - .devops/chart/base/cloud-init.yaml  — install your runtime/DB/services (first boot).
#   - the `source:` below                 — point at YOUR base disk image (or an http URL).
#   - .devops/vm-metadata.yaml            — the sizing knobs (mirror of cpu/mem/disk/port).
# Everything else (Service/Ingress wiring, labels, the GitOps tier) is platform-managed.
#
# Manifest shapes verified via Context7 (/kubevirt/user-guide, 2026-06-28):
# kubevirt.io/v1 VirtualMachine + cdi.kubevirt.io/v1beta1 DataVolume (dataVolumeTemplates),
# cloudInitNoCloud.secretRef (secret key `userdata`), masquerade pod networking,
# kubevirt.io/domain label as the Service selector, runStrategy.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: ${{ values.appName }}
  labels:
    app.kubernetes.io/name: ${{ values.appName }}
spec:
  # Always = keep the VM running, restart on failure (the "it just runs" power state).
  # Alternatives (verified): Halted (defined but off), Manual (virtctl start/stop),
  # RerunOnFailure.
  runStrategy: Always

  # CDI imports the base disk image into a PVC on ceph-block (RBD). The PVC is created
  # AND deleted with the VM (template lifecycle). RBD is RWO (single-node attach — no
  # live-migration on this storage class, ADR-032 §5/open Q3).
  #
  # volumeMode: Filesystem (NOT Block): the CDI importer writes a raw disk.img onto a
  # filesystem PVC, which needs no raw-block privilege and so runs under the VM-tier
  # baseline PSA. Block mode requires a privileged importer (it does `blockdev` on
  # /dev/cdi-block-volume) that baseline PSA correctly denies -> importer
  # CrashLoopBackOff ("Permission denied"). The VM boots fine from the file-backed
  # PVC (CDI names the image disk.img, raw format, uid 107). Minor tradeoff: a thin
  # filesystem layer + ~10% FS overhead vs raw RBD block — negligible at capstone
  # scale. Confirmed via Context7 /kubevirt/containerized-data-importer +
  # /kubevirt/user-guide (CDI v1.65 / KubeVirt v1.8.4, 2026-06-28).
  dataVolumeTemplates:
    - metadata:
        name: ${{ values.appName }}-rootdisk
      spec:
        storage:
          accessModes:
            - ReadWriteOnce
          volumeMode: Filesystem
          storageClassName: ceph-block
          resources:
            requests:
              storage: ${{ values.diskGi }}Gi
        source:
          # BRING-YOUR-OWN DISK: a KubeVirt containerDisk in a registry. Override with
          # your own image. For an http(s) cloud-image instead, replace this whole
          # `registry:` block with:
          #     http:
          #       url: https://example.com/path/your-cloud-image.qcow2
          # For a PRIVATE containerDisk in your team's Harbor project, add:
          #     registry:
          #       url: ${{ values.baseImage }}
          #       secretRef: harbor-pull   # minted at onboarding (see the onboarding PR)
          registry:
            # dump-quoted (D-108 sweep, deck-reviewer finding): this is the LOAD-BEARING
            # copy -- the actual DataVolume source CDI imports from. baseImage is
            # unconstrained free text (a docker://host/repo:tag ref); unquoted, a
            # colon+space or a trailing comment breaks this field's YAML the same way
            # description broke catalog-info.yaml.
            url: ${{ values.baseImage | dump }}

  template:
    metadata:
      labels:
        # The Service (service.yaml) selects the VMI's launcher pod on THIS label.
        kubevirt.io/domain: ${{ values.appName }}
        app.kubernetes.io/name: ${{ values.appName }}
    spec:
      # ── PLACEMENT — VMs run on the CONTROL-PLANE nodes, one per node. ─────
      # A VM is PERMANENT and IMMOVABLE: it reserves its full cpu/memory for its
      # whole lifetime (see resources below) and RBD is RWO, so it cannot live-
      # migrate. Build runners are the opposite — ephemeral, and they schedule
      # anywhere. Leaving VMs on the workers therefore inverts the shape: the
      # immovable thing squats on the nodes that exist for flexible work, and the
      # flexible work hits a capacity wall. Measured 2026-08-27, before this
      # change: capstone-w1 76% / w2 74% of CPU REQUESTS, of which 4.0 and 6.0
      # cores respectively were VMs, while capstone-n1/n2/n3 sat at 28-30%
      # requests and 4-5% ACTUAL CPU with ~11 cores free each.
      #
      # The control-plane taint is capstone.io/control-plane=true:PreferNoSchedule
      # — SOFT, so NO toleration is needed here. (Verified on all three nodes,
      # 2026-08-28. If that taint is ever hardened to NoSchedule, this VM stops
      # scheduling and a matching toleration must be added.)
      affinity:
        nodeAffinity:
          # required, not preferred: a soft rule would silently fall back to a
          # worker and recreate exactly the wall this exists to prevent.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
        podAntiAffinity:
          # One VM per node. Without this, three VMs can stack on n1 and rebuild
          # the wall somewhere new.
          #
          # namespaceSelector: {} IS LOAD-BEARING. Each VM tenant lives in its own
          # <team>-vm-prod namespace, and podAntiAffinity defaults to matching only
          # the pod's OWN namespace. Without this line the rule would compare each
          # VM against nothing but itself and spread NOTHING, while still looking
          # correct in review. {} means "all namespaces".
          #
          # CAPACITY CLIFF, deliberate and documented: this is `required`, and
          # there are three control-plane nodes. The FOURTH VM tenant will not
          # schedule — and per the resources comment below, that failure is
          # near-invisible (VirtualMachine sits at `Starting`, VMI at `Pending`,
          # no pod to inspect). Before onboarding a fourth VM team, either add a
          # control-plane node or relax this to
          # preferredDuringSchedulingIgnoredDuringExecution (weight: 100).
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              namespaceSelector: {}
              labelSelector:
                matchExpressions:
                  # every virt-launcher pod carries this, regardless of tenant.
                  - key: kubevirt.io
                    operator: In
                    values:
                      - virt-launcher

      # DNS — NOT optional, and NOT the cluster default. A VM's traffic leaves the
      # guest through the masquerade interface and never passes through a host
      # socket, so Cilium's socket load-balancer never runs and the kube-dns
      # ClusterIP (10.96.0.10) is never translated. The guest resolves NOTHING
      # while every pod in the same namespace resolves fine, and no NetworkPolicy
      # can fix it — a policy can allow an address, it cannot translate one.
      # Public resolvers + dnsPolicy:None is the shape the live reference VM runs.
      # See tenants/_template-vm/vm/namespaces/vm-prod.yaml, NetworkPolicy 4/5.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 1.0.0.1
      domain:
        cpu:
          # vCPUs RESERVED for the VM's whole lifetime (no overcommit). Mirror in
          # .devops/vm-metadata.yaml.
          cores: ${{ values.cpuCores }}
        # ── RESOURCES — all four values, deliberately. ────────────────────────
        # SETTING ONLY `requests.memory` HERE DOES NOT PRODUCE A VM THAT RUNS SLOWLY.
        # IT PRODUCES A VM THAT NEVER STARTS — and it inflates the ask while doing it.
        #
        # OBSERVED LIVE on paper-papas, 2026-08-27, with exactly this spec (an 8Gi
        # guest declaring a memory REQUEST and no limits):
        #
        #   Error creating pod: pods "virt-launcher-paper-papas-hv7dh" is forbidden:
        #   [maximum cpu usage per Container is 4, but limit is 8,
        #    maximum memory usage per Container is 6Gi, but limit is 17064Mi]
        #
        # Note the 17064Mi. When a memory LIMIT is absent, KubeVirt does not simply
        # pass the request through — it derives a launcher limit of roughly TWICE the
        # guest RAM. The same 8Gi guest on the reference VM, which DOES declare
        # `limits.memory`, produces an 8532Mi container (guest + ~340Mi overhead).
        # So declaring the limit does not merely add a field; it HALVES what the
        # namespace is asked for, from 17064Mi to 8532Mi. A tier ceiling sized for a
        # correct manifest will still reject an incorrect one.
        #
        # The failure is also invisible in the usual places: the VirtualMachine sits
        # at `Starting` and the VMI at `Pending` with no pod to inspect, because the
        # launcher is rejected at admission and never created. Only the namespace
        # EVENTS carry the reason, and KubeVirt retries in a loop that buries them.
        #
        # WHY request == limit for BOTH, rather than the reference VM's cpu 6/8 split:
        #   * Memory is incompressible and KubeVirt reserves the whole guest RAM for
        #     the VM's lifetime (ADR-032 §5), so request MUST equal limit. The
        #     vm-prod.yaml quota enforces exactly this with requests.memory ==
        #     limits.memory. This half is not a choice.
        #   * For CPU it IS a choice, and the obvious reason to prefer equality —
        #     Guaranteed QoS — turns out not to exist here. The launcher pod is
        #     Burstable no matter what this file says, because KubeVirt itself adds
        #     an `ephemeral-storage: 50M` REQUEST with no matching limit, and one
        #     unmatched resource is enough to disqualify the pod. Measured on the
        #     live reference VM:
        #         qosClass=Burstable
        #         compute req={cpu 6, ephemeral-storage 50M, memory 8532Mi}
        #                 lim={cpu 8,                        memory 8532Mi}
        #     So a 6/8 split buys nothing in eviction protection, and equality
        #     costs nothing in it either. The blueprint's "we WANT requests==limits
        #     (Guaranteed QoS)" aspiration is unreachable for VMs; do not re-derive
        #     a CPU split in pursuit of it.
        #   * What equality DOES buy is that this template stays arithmetic-free.
        #     A 75% split needs `cpuCores * 0.75` rounded, evaluated by the
        #     scaffolder's templating engine, in a resource field — and a silent
        #     templating error in a resource field is precisely the failure class
        #     this whole change exists to remove. An integer that is already an
        #     input cannot be miscomputed.
        #   * It also makes the quota arithmetic checkable rather than guessed:
        #     requests.cpu and limits.cpu are the same number, so a tier sized for N
        #     VMs of C cores is exactly N×C plus importer headroom. That is what
        #     hack/lint-vm-tier-bounds.py relies on.
        # The cost is honest: an idle VM reserves its full core count against the
        # namespace quota. On this 5-node/80-core cluster with
        # count/virtualmachines capped at 1 per team, that is affordable; if it
        # stops being affordable, lower the wizard's cpuCores maximum — the guard
        # will make the quota follow — rather than re-splitting here.
        #
        # KubeVirt adds its own overhead ON TOP of these numbers when it builds the
        # launcher pod — measured at ~340Mi of RAM and ~5m of CPU on the live
        # reference VM (an 8Gi guest becomes an 8532Mi container). The namespace
        # quota and LimitRange in tenants/_template-vm/vm/namespaces/vm-prod.yaml are
        # sized WITH that overhead included; do not size them from these numbers
        # directly.
        # ── QEMU NEEDS HEADROOM ABOVE THE GUEST'S RAM. ───────────────────────
        # A VM SCAFFOLDED WITHOUT THIS BLOCK CRASHES UNDER ITS OWN WORKLOAD, and the
        # crash looks like nothing at all. Observed on the paper-papas tenant
        # 2026-08-31, during an ordinary `pnpm build` inside the guest:
        #
        #   Warning  SyncFailed  ... Could not get owner Pid of socket
        #                            /pods/.../launcher-sock: connection refused
        #   Warning  Stopped     virtualmachineinstance/paper-papas
        #                            The VirtualMachineInstance crashed.
        #
        # The launcher pod was replaced, the guest cold-booted, /tmp was wiped, and
        # `kubectl get vmi` said Running again about a minute later. To a student it
        # is their build dying and their SSH session dropping, with NOTHING in the
        # guest's own logs — because the guest did not fail, it was killed from
        # outside by the cgroup OOM killer.
        #
        # WHY IT HAPPENS. With `requests == limits` and no `memory.guest`, the guest
        # is handed EXACTLY the container's memory ask and KubeVirt adds only its
        # own overhead estimate on top (measured: a 4096Mi guest produced a compute
        # container limited to 4714397697 B = 4496Mi, i.e. ~400Mi of headroom). That
        # estimate assumes KVM. This cluster runs KubeVirt with useEmulation:true —
        # QEMU TCG, no hardware virtualisation — where the translation caches make
        # the true overhead much larger. MEASURED on that guest: 559Mi at idle,
        # over 1.3Gi during a build.
        #
        # And QEMU's RSS only ever RATCHETS UP: a guest page that has been touched
        # stays resident on the host even after the guest frees it, so the container
        # climbs monotonically toward guest-RAM + overhead and never falls back.
        # Sampled across one build: 1380 -> 2643 -> 2901Mi while the GUEST's own
        # `free` showed usage going DOWN. Any sustained memory-churning workload
        # therefore walks the container into its limit and gets killed.
        #
        # THE FIX is to stop pinning guest RAM to the container ask. `memory.guest`
        # is what the guest SEES; `resources` is what the container may HAVE. The
        # guest still gets exactly the memoryGi the team asked for; the extra 2Gi is
        # hypervisor headroom, not student RAM.
        #
        # The asymmetric requests/limits is REQUIRED, not sloppy: `memory.guest` must
        # lie between requests and limits (`kubectl explain
        # virtualmachine.spec.template.spec.domain.memory.guest`), so requests stays
        # at the guest size. The scheduler reserves the guest's RAM; the headroom is
        # burst.
        memory:
          guest: ${{ values.memoryGi }}Gi
        resources:
          requests:
            # Guest RAM, reserved for the VM's whole lifetime (ADR-032 §5).
            memory: ${{ values.memoryGi }}Gi
            cpu: "${{ values.cpuCores }}"
          limits:
            # Guest RAM + 2Gi of hypervisor headroom. NOT the guest's size — raising
            # this does NOT give the team a bigger machine. `memoryGi` is capped at 8
            # in template.yaml so that this stays inside the tier's 12Gi LimitRange
            # with room for the transient CDI importer.
            memory: ${{ values.memoryGi + 2 }}Gi
            cpu: "${{ values.cpuCores }}"
        devices:
          # virtio-rng. The cluster runs KubeVirt with useEmulation:true (QEMU TCG,
          # no hardware virt), where guest entropy accrues slowly. sshd generates its
          # host keys on first boot; starved of entropy that can stall for minutes,
          # which presents as "SSH is broken" rather than "SSH is not up yet". The
          # live reference VM carries this device.
          rng: {}
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            # masquerade = pod-network NAT behind the launcher pod IP. Works with the
            # cluster's Cilium CNI + the tenant default-deny NetworkPolicies with no
            # Multus/bridge complexity (ADR-032 §1/§2b).
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: ${{ values.appName }}-rootdisk
        - name: cloudinit
          cloudInitNoCloud:
            # First-boot setup = the "no Dockerfile" install step. The secret (key
            # `userdata`) is generated by kustomize from cloud-init.yaml in this dir
            # (disableNameSuffixHash -> stable name). cloud-init runs ONCE on first
            # boot; to re-run it, recreate the VM.
            secretRef:
              name: ${{ values.appName }}-cloudinit
            # ── networkData — DO NOT DELETE. THE VM LOSES ALL NETWORKING WITHOUT IT ──
            #
            # This is not tuning. Without these six lines the guest comes up with NO
            # IP ADDRESS on its SECOND and every subsequent boot, and stays that way
            # forever. Measured on the live `paper-papas` VM, 2026-08-31: guest fully
            # booted to a login prompt, sshd listening, and the launcher's tap device
            # showing `RX: 0 bytes 0 packets` after three days — the guest had never
            # transmitted a single frame.
            #
            # THE MECHANISM, in three facts that only bite in combination:
            #
            #   1. KubeVirt masquerade gives the GUEST the launcher POD's MAC address.
            #      (Verified: guest MAC == `ip link show eth0` in the launcher pod, on
            #      three separate VMs.) The pod's veth MAC is generated fresh by the
            #      CNI for every pod, so the guest's MAC CHANGES on every VM restart,
            #      node drain, eviction, or live-migration-by-recreation.
            #
            #   2. With no networkData, the NoCloud seed KubeVirt builds contains only
            #      `meta-data` + `user-data` (verified by reading the generated
            #      noCloud.iso). cloud-init therefore falls back to
            #      `generate_fallback_config()`, which writes a netplan file pinned to
            #      the MAC it saw AT THAT MOMENT:
            #          match: {macaddress: <first-boot MAC>}
            #
            #   3. cloud-init's `default_update_events` is
            #      `{NETWORK: {BOOT_NEW_INSTANCE}}` — network config is re-applied
            #      only when the INSTANCE-ID changes. The instance-id here is the VM's
            #      stable firmware UUID, so a restart is NOT a new instance and
            #      cloud-init logs "No network config applied" and leaves the old file
            #      alone. (The rootdisk is a persistent PVC, so /var/lib/cloud
            #      survives; this is exactly why the bug is invisible on an ephemeral
            #      containerDisk, where every boot looks like a first boot.)
            #
            # Net effect: first boot works, and the FIRST RESTART silently strands the
            # VM with a netplan rule matching a MAC that no longer exists. Nothing in
            # Kubernetes reports it — the VMI stays Running and Ready, the Service
            # keeps an Endpoint (the launcher pod IP is up even though the guest is
            # not), and every probe from outside just times out. The failure looks
            # exactly like a broken tunnel, a bad NetworkPolicy, or a dead sshd, which
            # is where three days of debugging went before anyone looked at the tap
            # counters.
            #
            # THE FIX: match on interface NAME, not MAC. `e*` covers every predictable
            # name the kernel gives a virtio NIC on the pod bus (enp1s0 today, ens*/eth*
            # on other images), and a name does not change when the MAC does. Written
            # once on first boot, this file keeps working across every later boot with
            # no re-render needed — so it repairs the class of failure rather than the
            # instance. cloud-init.yaml additionally sets `updates.network.when:[boot]`
            # as a second, independent belt (see the comment there).
            #
            # This block is inline rather than a networkDataSecretRef on purpose: it
            # holds no secret, it is identical for every tenant, and putting it in the
            # manifest keeps it visible to anyone reading the VM spec. The KubeVirt
            # admission webhook accepts secretRef (user-data) + inline networkData
            # together — verified with `kubectl apply --dry-run=server` against the
            # live cluster, not assumed.
            networkData: |
              version: 2
              ethernets:
                primary:
                  match:
                    name: "e*"
                  dhcp4: true
                  dhcp6: false
