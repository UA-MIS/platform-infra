# SSH Service (ADR-032a) — the in-cluster target for TEAM SSH access to this VM.
#
# A VM tenant is a PET dev-VM: the team SSHes in (standard client), clones their app
# repo, and runs their stack. This ClusterIP Service selects the VM's virt-launcher
# pod by the KubeVirt domain label (masquerade networking puts the guest behind the
# launcher pod IP) and forwards :22 -> the guest sshd.
#
# This Service is TRANSPORT-AGNOSTIC on purpose: it is the single stable in-cluster
# endpoint that whichever PUBLIC SSH path the platform adopts points at —
#   - a Traefik IngressRouteTCP on a per-tenant TCP entrypoint (native `ssh -p 22NN`),
#   - a Cloudflare Tunnel `ssh://` public-hostname (browser SSH / `cloudflared access`),
#   - or a per-VM LoadBalancer once the fleet has a routable public IP.
# The public transport is an operator/security-track decision (see
# artifacts/design/decisions/adr-032a-vm-tenant-access-ux.md); this Service is the
# app-layer half that is the same regardless of which is chosen. It exposes nothing
# publicly by itself (ClusterIP) — the tenant NetworkPolicy permits ingress to the VM
# from the ingress tier (kube-system/Traefik, HTTP) AND from the `cloudflared`
# namespace on :22 only (SSH).
#
# RESOLVED (ADR-032a D2, cheapest/easiest): the shipped public path is the
# **Cloudflare Tunnel `ssh://` route** — reuses the existing $0 tunnel, no
# LoadBalancer, no paid Spectrum. A Cloudflare Tunnel Public Hostname
# (`<team>-ssh.uamishub.com`, Service type SSH) points DIRECTLY at this Service,
# fronted by a Cloudflare Access application (Zero Trust free tier).
#
# The hostname is a SINGLE label under the APEX. That is a TLS constraint, not a
# preference: the live certificate is `DNS:uamishub.com, DNS:*.uamishub.com` — a
# ONE-level wildcard — so `<team>-ssh.uamishub.com` is covered and a dotted
# `ssh.<team>.uamishub.com` is not (the HTTPS/Access handshake fails outright).
#
# Those Cloudflare-side objects are NO LONGER dashboard steps: the cf-vm-access
# reconciler (platform-services/cf-vm-access, ADR-038) discovers this Service by its
# label and provisions the route + Access app automatically, and removes them when
# the Service goes away. See docs/operator/vm-ssh-cloudflare-access.md.
apiVersion: v1
kind: Service
metadata:
  name: ${{ values.appName }}-ssh
  labels:
    app.kubernetes.io/name: ${{ values.appName }}
    # The team slug the public SSH hostname is built from: <team>-ssh.<domain>.
    # The reconciler prefers this label and falls back to stripping `-vm-<env>` off
    # the namespace, so an omitted label degrades rather than breaks — but set it.
    platform.capstone/team: ${{ values.team }}
    # DESIRED-STATE MARKER for the cf-vm-access reconciler (ADR-038). This label is
    # how the platform enumerates which VM tenants need a Cloudflare SSH route +
    # Access app. Add the Service, the hostname appears; delete it, the hostname is
    # removed on the next pass. Nothing is keyed on a hardcoded tenant name.
    platform.capstone/access: ssh
  annotations:
    # The team's allowed SSH emails — becomes the Cloudflare Access application's
    # Allow policy for <team>-ssh.<domain>. SSH has no OIDC of its own, so Access is
    # the auth in front of the hostname; sshd cert-trust is downstream of it.
    #
    # ⚠ AN EMPTY VALUE HERE PRODUCES AN APP THAT ADMITS NOBODY, and from a student's
    # laptop that is INDISTINGUISHABLE from a missing tunnel route. Both just fail to
    # connect. If SSH does not work, check this annotation before you touch the tunnel.
    #
    # NOT a secret — the same university emails already in the GitHub org.
    # Comma-separated; edit + push to change who may connect.
    platform.capstone/ssh-access-emails: "${{ values.teamEmails }}"
spec:
  type: ClusterIP
  selector:
    # Same launcher-pod selector as the HTTP Service — KubeVirt sets this label on the
    # VMI's virt-launcher pod from the VM template's metadata.labels.
    kubevirt.io/domain: ${{ values.appName }}
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
