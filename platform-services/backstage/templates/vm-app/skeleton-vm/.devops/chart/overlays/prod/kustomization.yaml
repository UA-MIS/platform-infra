# prod overlay — the SINGLE environment for a VM app (ADR-032: a lifted legacy project
# is one self-contained VM, not a dev/staging/prod pipeline). The platform's VM env
# ApplicationSet (tenants/_template, security/devops-owned) points its `path` here and
# its `destination.namespace` at the SAME <team>-vm-prod tier — the two must match.
# Auto-synced (promotion.yaml gate: auto) so "merge -> it runs".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The VM tier namespace (baseline PSA + VM-sized quota + the AppProject VM-kind
# whitelist), created by the onboarding PR from tenants/_template (ADR-032 §2/§6c).
namespace: ${{ values.team }}-vm-prod
resources:
  - ../../base

# ── THE WEB CONSOLE'S PUBLIC DOOR — OFF BY DEFAULT ──────────────────────────
# Uncommenting this publishes a browser shell at
# `${{ values.team }}-console.uamishub.com`. Anyone who gets past Cloudflare Access
# lands in a shell that can sudo, and Access is the ONLY wall in front of it — the
# hostname rides the existing `*.uamishub.com` tunnel rule, so it is live the moment
# ArgoCD syncs, with no tunnel change to slow it down.
#
# DO THIS IN ORDER:
#   1. Create the Cloudflare Access application for that exact hostname, with an
#      Allow policy scoped to this team. Never Bypass, never Service Auth.
#   2. Uncomment the two lines below and open a PR.
#   3. Verify from OUTSIDE the cluster — a 302 to the Access login is correct;
#      a 200 means the shell is open to the internet and must be closed:
#        curl -sSI https://${{ values.team }}-console.uamishub.com/ | head -1
#
# Until then the console still works in-cluster (the Service is in the base) and the
# guest still runs ttyd — only the public route is withheld. See
# ../../components/console-public/kustomization.yaml, which also explains why this
# is a guardrail rather than an interlock.
#
# components:
#   - ../../components/console-public
# env-specific selector labels (§3.1). semester is the cohort slug (year-first).
labels:
  - pairs:
      platform.capstone/env: prod
      platform.capstone/semester: ${{ values.semester }}
    includeSelectors: false
