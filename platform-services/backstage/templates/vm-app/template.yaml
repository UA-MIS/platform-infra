# "New Capstone VM" — The Process scaffolder for the layout: vm capability (ADR-032).
#
# THE "NO DOCKER" GOLDEN PATH. Some capstone teams cannot or will not containerize:
# a legacy Windows/desktop app, a professor-supplied appliance, an OS/sysadmin course,
# or a whole stack that expects "a real machine" (and bundles its own DB/services
# inside the box). This template gives them a first-class IDP path: a student picks
# "Virtual machine", points at a base disk image, edits a cloud-init block, and pushes
# — The Process stands up a KubeVirt VirtualMachine that runs as a workload inside the
# cluster, reachable at the SAME kind of URL as any container app.
#
# WHY A SEPARATE TEMPLATE (not a third `layout: vm` in new-capstone-project):
#   ADR-032 §6d sketches a `layout: vm` enum branch, but the VM path diverges from the
#   container golden path in ways that would force `if:` guards across most of the
#   proven template (risking the LIVE container path — the #1 bug generator per the
#   project retro is touching/copying the proven path):
#     - DIFFERENT PARAMETERS — base disk image + vCPU/RAM/disk sizing, not a Dockerfile.
#     - NO KANIKO BUILD — the disk is an imported OS image, not a container build, so the
#       CI caller is validation-only and never invokes the reusable tenant-build.yaml.
#     - SINGLE ENVIRONMENT — a lifted legacy app is one self-contained VM, not a
#       dev/staging/prod pipeline; the VM deploys into ONE namespace (<team>-vm-<env>).
#     - NO ROBOT MINT — no image push means no per-team Harbor push robot in the
#       onboarding PR; a pull robot is only needed if a team imports a PRIVATE disk.
#   So this is a DEDICATED template that REUSES the proven STEP shapes verbatim
#   (publish:github / catalog:register / capstone:harbor-onboard / capstone:render-tenant
#   / publish:github:pull-request) while keeping new-capstone-project byte-for-byte
#   untouched. The downstream tenancy fence + GitOps planes are the same; only the
#   workload kind and the CI build differ.
#
# WHAT IT DOES (steps below):
#   0. capstone:preflight — fail fast + clean if `appName` collides with an existing
#      GitHub repo, catalog entry, or tenant claim, BEFORE anything below is created
#      (the swamiapp lesson: a reused name once got PAST publish and only failed at
#      register, leaving an orphaned repo behind). Read-only.
#   1. fetch:template — render ./skeleton-vm (the VM chart: VirtualMachine +
#      DataVolume(template) on ceph-block + cloud-init + Service/Ingress, a VM-aware
#      promotion.yaml [single env, no build], a validation-only CI workflow, the
#      catalog-info.yaml + mkdocs/TechDocs). SELF-CONTAINED — no external fetch:plain.
#   3. publish:github — create UA-MIS/<repo>, push, set branch protection (PRs only).
#   4. catalog:register — register the component in The Process catalog.
#   4b. capstone:harbor-onboard — create the team's Harbor project (idempotent). For the
#      no-build VM path this is OPTIONAL home for a private containerDisk; kept so a team
#      that later bakes/pushes its own disk image (v2.1) needs no extra onboarding.
#   5a. capstone:render-tenant — render tenants/team-<name>/ from the DEDICATED VM
#      blueprint tenants/_template-vm/ (baseline-PSA <team>-vm-prod tier + the VM-kind
#      AppProject whitelist + the VM env ApplicationSet — ADR-032 §2/§6b/§6c). The action
#      is shared + unchanged; only the templateUrl differs from the container templates
#      (which point at tenants/_template). A VM tenant renders ONLY the VM tier — no
#      container envs/preview appset (the #376 onboarding bug, structurally fixed here).
#   5b. publish:github:pull-request — open the REVIEW-GATED onboarding PR to
#      platform-infra. Merging is the grant (D-049); a student never mints cluster RBAC.
#
# ⚠ COORDINATION (ADR-032 is the spec; this template does NOT edit tier manifests):
#   The <team>-vm-<env> namespace tier (baseline PSA, VM-sized quota), the AppProject
#   VM-kind whitelist (kubevirt.io/VirtualMachine + cdi.kubevirt.io/DataVolume), and the
#   VM env ApplicationSet (destination namespace <team>-vm-<env>, reading THIS repo's
#   .devops/promotion.yaml) are owned by the platform security/devops track in
#   tenants/_template-vm/. This template's app overlay sets `namespace: <team>-vm-<env>` so
#   the VM workload lands in that tier; the contract between the two is ADR-032.
#
# ⚠ PREREQUISITE (ADR-032 open Q1 — BLOCKING for go-live, NOT for this template):
#   KubeVirt + CDI must be installed (platform ArgoCD apps) and KVM confirmed on the
#   Talos nodes. This scaffolder template is buildable/reviewable now; a rendered VM
#   only RUNS once that capability is live and the onboarding PR is merged.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-capstone-vm
  title: New Capstone VM (no Docker)
  description: >-
    Deploy a REAL virtual machine as an app — for teams that can't or won't
    containerize (legacy/desktop/appliance stacks that bring their own DB/services).
    Pick a base disk image, edit a cloud-init block, push — The Process runs it as a
    KubeVirt VM reachable at https://<app>.capstone.uamishub.com. No Dockerfile, no
    image build, one self-contained environment.
  tags:
    - capstone
    - vm
    - kubevirt
    - no-docker
spec:
  owner: group:default/platform
  type: service

  parameters:
    - title: Your project
      required:
        - appName
        - team
        - season
        - year
      properties:
        appName:
          title: App name
          type: string
          description: >-
            Short slug for your app + repo (lowercase letters, digits, hyphens — no
            spaces, uppercase, or dots). Becomes the repo name, the VirtualMachine
            name, and the ingress host <app-name>.<platform-domain>, so it MUST be a
            DNS-1123 label.
          # DNS-1123 label — same charset as a repo name, a k8s object name, and a DNS
          # hostname segment; all three derive from this one value, so enforce the
          # strictest (DNS) form here (matches new-capstone-project + renderTenant.ts).
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          maxLength: 30
          ui:autofocus: true
          ui:help: 'Lowercase letters, digits, and hyphens only; must start and end with a letter or digit (e.g. my-legacy-app).'
        team:
          title: Team slug
          type: string
          description: >-
            Your team's canonical slug — MUST equal your GitHub Team slug and your
            AppProject name (the platform keys per-team namespaces, RBAC, and the VM
            tier <team>-vm-<env> on this single value, D-026).
          pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 30
        # Cohort = Season + Year (org convention "Capstone {Season} {Year}"), composed
        # into two derived forms downstream exactly like new-capstone-project:
        #   DISPLAY "Capstone {Season} {Year}" (human text: PR body, catalog cohort).
        #   SLUG    "{year}-{season|lower}"     (machine: semester label/tag + the value
        #           passed to capstone:render-tenant — year-first to match its regex).
        season:
          title: Season
          type: string
          description: The cohort season (part of "Capstone {Season} {Year}").
          enum:
            - Spring
            - Summer
            - Fall
          default: Fall
        year:
          title: Year
          type: integer
          description: The cohort year, e.g. 2026 (part of "Capstone {Season} {Year}").
          minimum: 2020
          maximum: 2099
          default: 2026
        description:
          title: Description
          type: string
          description: One-line description of your project (shown in the catalog).
          default: A UA-MIS capstone VM project.

    - title: Virtual machine
      required:
        - baseImage
        - sshPubKey
        - githubUsernames
        # REQUIRED, not optional-with-a-blank-default. Wiring this input (below) fixed
        # the annotation always rendering as `""`, but an input that is merely PRESENT
        # can still be left blank — and a blank one produces a Cloudflare Access
        # application that admits NOBODY, which from a student's laptop is
        # indistinguishable from a missing tunnel route or a broken VM. The failure is
        # silent on every side: the scaffold succeeds, the PR merges, the reconciler
        # creates the app, and the first person to try to connect is the one who finds
        # out. Requiring it moves that discovery to the wizard form.
        - teamEmails
      properties:
        # BRING-YOUR-OWN / IMPORTED DISK IMAGE (ADR-032 §1, §4). The "image" is a whole
        # OS disk CDI imports into a PVC — NOT a container build. Point this at:
        #   - a KubeVirt containerDisk in a registry: docker://<host>/<repo>:<tag>
        #     (the default below is a public Fedora cloud containerDisk that boots +
        #     runs cloud-init), or
        #   - a private containerDisk in YOUR team's Harbor project (then a pull robot
        #     is added at onboarding — see the PR checklist), or
        #   - an http(s) cloud-image URL (edit the DataVolume source in
        #     .devops/chart/base/virtualmachine.yaml from `registry:` to `http:`).
        # cloud-init then ADAPTS the base image into your app (install your stack, your
        # DB, your services) on first boot — this is the "no Dockerfile" equivalent of a
        # build. Prefer a curated/known base over an arbitrary URL (supply chain).
        baseImage:
          title: Base disk image (containerDisk ref)
          type: string
          description: >-
            The base OS disk CDI imports for your VM, as a containerDisk registry ref
            (docker://host/repo:tag). Default is a public Fedora cloud image that runs
            cloud-init. Override with your own image; for an http(s) cloud-image URL,
            edit the DataVolume source in .devops/chart/base/virtualmachine.yaml.
          default: docker://quay.io/containerdisks/fedora:40
        # ⚠ THESE MAXIMA ARE DERIVED FROM THE VM TIER'S CEILING, NOT CHOSEN.
        # They must stay <= what tenants/_template-vm/vm/namespaces/vm-prod.yaml's
        # ResourceQuota and LimitRange will actually admit, with KubeVirt's own
        # overhead counted. hack/lint-vm-tier-bounds.py enforces that and fails CI
        # if the two drift apart.
        #
        # This is not theoretical: on 2026-08-27 this form advertised maximum 16 GiB
        # against a tier whose ceiling was 6 GiB. paper-papas was scaffolded at
        # 8 GiB — accepted by the form, merged, synced, disk imported — and the
        # virt-launcher pod was then refused outright. The form is the last place a
        # student can be told "no" cheaply; after this point the failure costs a
        # provision cycle.
        cpuCores:
          title: vCPUs
          type: integer
          description: >-
            Virtual CPU cores reserved for the VM for its whole lifetime (no overcommit
            like a container). Sized for a real app; keep modest on the shared cluster.
          default: 2
          minimum: 1
          # 8 + KubeVirt overhead + a transient CDI importer fits the tier's
          # requests.cpu/limits.cpu of 12 with room to spare.
          maximum: 8
        memoryGi:
          title: Memory (GiB)
          type: integer
          description: >-
            Guest RAM in GiB, RESERVED for the VM's whole lifetime (ADR-032 §5 — VMs do
            not overcommit; the VM-tier quota caps this). Sized for a real app.
          default: 4
          minimum: 1
          # LOWERED from 16, which the tier could never have run. The tier ceiling is
          # 12Gi; a guest costs guest + ~340Mi KubeVirt overhead, and a transient CDI
          # importer (~600Mi) coexists during the disk import, so the largest guest
          # that actually fits is ~11Gi. Set to 10 to keep a GiB of slack, on the
          # same principle as the quota itself: a bound that only just fits is one
          # overhead change away from breaking every VM at once.
          maximum: 10
        diskGi:
          title: Root disk (GiB)
          type: integer
          description: >-
            Size of the imported root disk PVC on ceph-block (RBD). Make it large enough
            for the base image + your app + its data.
          default: 20
          minimum: 5
          maximum: 200
        port:
          title: App port (inside the VM)
          type: integer
          description: >-
            The TCP port your app listens on INSIDE the VM. The Service/Ingress forward
            to it; the cloud-init starter brings up a small web server on this port so a
            fresh VM serves something immediately.
          default: 8080
          minimum: 1
          maximum: 65535
        # SSH PUBLIC key for team access (ADR-032a). A VM tenant is a PET dev-VM: the
        # team SSHes in with a STANDARD ssh client, clones their app repo, and runs their
        # stack there. cloud-init installs THIS public key into the guest's
        # ~/.ssh/authorized_keys and DISABLES password login (key-only). This is a PUBLIC
        # key — safe to hold in the repo/manifest (it is not a secret). Paste your team's
        # shared key, or a personal key; add more later by editing cloud-init.yaml
        # (`ssh_authorized_keys:`) or via `ssh_import_id: [gh:<github-username>]`.
        sshPubKey:
          title: SSH public key
          type: string
          description: >-
            Your OpenSSH PUBLIC key (the contents of e.g. ~/.ssh/id_ed25519.pub — starts
            with `ssh-ed25519` or `ssh-rsa`). Installed into the VM so you can `ssh` in
            from any laptop with a standard client. Password login is turned OFF once a
            key is set. This is a public key — safe to store in git.
          pattern: '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256|sk-ssh-ed25519@openssh.com|sk-ecdsa-sha2-nistp256@openssh.com) [A-Za-z0-9+/=]+( .*)?$'
          ui:help: 'Run `cat ~/.ssh/id_ed25519.pub` (or generate one with `ssh-keygen -t ed25519`) and paste the single-line output.'
        # THE TEAM ROSTER — this is what makes SSH onboarding SELF-SERVICE (ADR-032a).
        # Each member's PUBLIC keys are pulled from https://github.com/<user>.keys into
        # the guest: once by cloud-init's `ssh_import_id` on first boot, and then every
        # 5 minutes by a systemd timer the same cloud-init installs.
        #
        # THE TIMER IS NOT BELT-AND-BRACES, IT IS THE POINT. cloud-init runs ONCE. On
        # day one NOBODY on the team has uploaded a key yet — the VM is built before
        # they get there — so a first-boot-only import would import nothing and leave
        # every student locked out, with no one already inside to let them in. With the
        # timer: the student adds their key to GitHub and can SSH in ~5 minutes later,
        # with no instructor in the loop.
        #
        # ⚠ THE PREREQUISITE IS REAL AND IS NOT SAFE TO ASSUME. Most students have NO
        # SSH key on their GitHub account (sampled 2026-08-28 across a live MIS 521
        # roster: 1 of 3 members had any). For those members this imports nothing and
        # they simply cannot log in — with NO error anywhere they will see. The
        # generated repo README leads with `ssh-keygen` + "paste it into
        # github.com/settings/keys" as step one for exactly this reason; do not drop it.
        #
        # Membership is STATIC per boot on purpose: changing WHO is on the team is a
        # repo edit + rebuild. Resolving it live would mean a GitHub token on the guest,
        # and a student dev-VM is not a place to keep a credential. Only KEYS refresh.
        githubUsernames:
          title: Team GitHub usernames
          type: array
          minItems: 1
          items:
            type: string
            pattern: '^[A-Za-z0-9](?:[A-Za-z0-9]|-(?=[A-Za-z0-9])){0,38}$'
          description: >-
            The GitHub username of every team member (yours included). Their public SSH
            keys are imported into the VM automatically and refreshed every 5 minutes,
            so nobody has to send anyone a key. Anyone added here can SSH in as soon as
            they add a key to their GitHub account.
          ui:help: 'The username from github.com/<username> — not an email. Add every teammate; you can change the list later by editing .devops/chart/base/cloud-init.yaml.'
        # The team's university emails — rendered into the `<app>-ssh` Service's
        # platform.capstone/ssh-access-emails annotation, which the cf-vm-access
        # reconciler (ADR-038) turns into the Cloudflare Access Allow policy for
        # <team>-ssh.<domain>.
        #
        # ⚠ THIS WAS A REAL, SHIPPED GAP. skeleton-vm/.devops/chart/base/ssh-service.yaml
        # has always consumed `${{ values.teamEmails }}`, but this template never PASSED
        # it — so every VM tenant scaffolded to date rendered the annotation as `""`.
        # That file's own header warns, correctly, that an empty value "PRODUCES AN APP
        # THAT ADMITS NOBODY, and from a student's laptop that is INDISTINGUISHABLE from
        # a missing tunnel route". Verified live on paper-papas 2026-08-28:
        # `platform.capstone/ssh-access-emails: ""`. Wiring the input closes it.
        #
        # NOT a secret — the same university emails already in the GitHub org.
        teamEmails:
          title: Team emails (Cloudflare Access allow-list)
          type: string
          description: >-
            Comma-separated university emails for everyone who may SSH to this VM. This
            becomes the Cloudflare Access policy on <team>-ssh.uamishub.com — the gate in
            FRONT of the VM's sshd. Leave nobody out: an address that is not here cannot
            reach the host at all, no matter what SSH key they have.
          # No `default: ''` — a blank default plus `required` is a field the form will
          # happily accept empty. The pattern demands at least one address that looks
          # like an email, and tolerates spaces after the commas.
          pattern: '^\s*[^@,\s]+@[^@,\s]+\.[^@,\s]+\s*(,\s*[^@,\s]+@[^@,\s]+\.[^@,\s]+\s*)*$'
          ui:help: 'e.g. astudent@crimson.ua.edu, bstudent@crimson.ua.edu'

    # NOTE (same as new-capstone-project): there is intentionally NO repoUrl input — the
    # repo is created at github.com/UA-MIS/<appName> (owner fixed; repo name = app name),
    # constructed inline at the publish steps. Repo creation runs as the platform GitHub
    # App via integrations.github (no user OAuth, no token input — D-017).

  steps:
    # 0) PREFLIGHT — fail fast + clean if `appName` collides with an existing GitHub repo,
    #    catalog entry, or tenant claim, BEFORE anything is created (the swamiapp lesson: a
    #    reused name once got PAST publish and only failed at register, leaving an orphaned
    #    repo behind), OR if the team already has ANY claim for this semester under a
    #    different app name (one claim per team per semester — PR #311). Read-only;
    #    throws with a clear message on collision.
    - id: preflight
      name: Check for a name collision
      action: capstone:preflight
      input:
        team: ${{ parameters.team }}
        appName: ${{ parameters.appName }}
        # SLUG form (year-first, e.g. 2026-fall) — keys the one-claim-per-team-per-semester
        # guard (PR #311); matches the semester passed to render-tenant below.
        semester: ${{ parameters.year }}-${{ parameters.season | lower }}

    # 1) Render the VM starter (chart + cloud-init + VM-aware promotion.yaml + catalog +
    #    validation-only CI). Single fetch (this template is VM-only — no layout branch).
    - id: fetch-skeleton-vm
      name: Render VM skeleton
      action: fetch:template
      input:
        url: ./skeleton-vm
        values:
          appName: ${{ parameters.appName }}
          team: ${{ parameters.team }}
          # Cohort in two forms (see season/year above): machine SLUG (year-first) +
          # readable DISPLAY name.
          semester: ${{ parameters.year }}-${{ parameters.season | lower }}
          semesterDisplay: Capstone ${{ parameters.season }} ${{ parameters.year }}
          description: ${{ parameters.description }}
          baseImage: ${{ parameters.baseImage }}
          cpuCores: ${{ parameters.cpuCores }}
          memoryGi: ${{ parameters.memoryGi }}
          diskGi: ${{ parameters.diskGi }}
          port: ${{ parameters.port }}
          sshPubKey: ${{ parameters.sshPubKey }}
          githubUsernames: ${{ parameters.githubUsernames }}
          teamEmails: ${{ parameters.teamEmails }}
          # The Cloudflare Access PER-APPLICATION SSH CA public key.
          #
          # ⚠ THE SAME SHIPPED GAP AS teamEmails ABOVE, one field over.
          # skeleton-vm/.devops/chart/base/cloud-init.yaml has always consumed
          # `${{ values.cfAccessCaPub }}` at /etc/ssh/cf_access_ca.pub, but this
          # template never DEFINED or PASSED it — so every VM scaffolded to date was
          # born with an empty CA file, i.e. cert auth off. Passing it closes the
          # loop; it is intentionally NOT a wizard question, because the CA does not
          # exist until the Access application does, which is after scaffold. It
          # stays empty at birth (harmless — the guest is key-only until then) and
          # the operator commits the real key during onboarding.
          #
          # If you set this, it MUST be the per-application CA, NOT the
          # account-global / Access-for-Infrastructure one. The two are visually
          # identical and the wrong one fails with no diagnostic. See the two-CA
          # warning in docs/operator/vm-ssh-cloudflare-access.md.
          cfAccessCaPub: ''
          destination: ${{ ("github.com?owner=UA-MIS&repo=" + parameters.appName) | parseRepoUrl }}
        # ⚠ INDENTATION IS LOAD-BEARING (new-capstone-project lesson): this key MUST be
        # nested under `input:` (8-space indent, a sibling of url:/values:). Misplaced at
        # 6 spaces it is silently dropped, nunjucks templates EVERY file, and the CI
        # workflow's `${{ github.* }}` / `${{ vars.* }}` crash the render. The VM CI
        # workflow is the file that needs this (it carries GitHub-Actions ${{ }}); the
        # `**` form matches a root-level subtree under globby's options. The
        # .devops/ci/** glob is kept for parity/safety though the VM skeleton ships no
        # build scripts.
        copyWithoutTemplating:
          - '.github/**'
          - '**/.github/**'
          - '.devops/ci/**'
          - '**/.devops/ci/**'

    # 3) Create UA-MIS/<repo>, push, protect main (PRs only — platform policy). Verbatim
    #    from new-capstone-project (the repo-creation contract is identical for VM apps).
    - id: publish
      name: Publish to GitHub (UA-MIS)
      action: publish:github
      input:
        repoUrl: github.com?owner=UA-MIS&repo=${{ parameters.appName }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: private
        # Self-tags every new tenant repo so the catalog.providers.github 'tenants'
        # discovery provider (app-config.production.yaml / backstage-process-app.yaml)
        # picks it up via filters.topic.include — org-wide discovery with no topic
        # filter would ingest catalog-info.yaml from ANY of the org's other repos.
        topics: ['capstone-tenant']
        # Set the repo Actions variable RUNNER_SCALE_SET so this tenant's CI runs on ITS
        # OWN per-team runner scale-set (<team>-kaniko), which injects the tenant's own
        # harbor-push-<team> cred. Without it the workflow's `${{ vars.RUNNER_SCALE_SET ||
        # 'ua-mis-kaniko' }}` falls back to the SHARED ua-mis-kaniko runner (backstage's
        # push cred) -> `UNAUTHORIZED: action: push` to <team>/<app>. Built into
        # publish:github (@0.9.10 calls actions.createRepoVariable) — no Backstage rebuild;
        # requires the platform GitHub App to have Actions Variables: read/write. (Fix A.)
        repoVariables:
          RUNNER_SCALE_SET: ${{ parameters.team }}-kaniko
        protectDefaultBranch: true
        requireCodeOwnerReviews: true
        # Role-based access by GitHub TEAM (not creator): the project team gets push,
        # labmx (platform staff) gets admin. Unknown team slugs are skipped gracefully.
        collaborators:
          - team: ${{ parameters.team }}
            access: push
          - team: labmx
            access: admin
        # No `token:` — authenticates via integrations.github (the platform GitHub App).

    # 3b) WAIT for GitHub to actually serve the just-pushed catalog-info.yaml before
    #     `register` below reads it (FIX-19/CATALOG-001 -- same root cause + fix as
    #     new-project/template.yaml; see waitForRepoContent.ts for the full writeup).
    #     catalog:register performs a SYNCHRONOUS first read of catalog-info.yaml the
    #     moment it runs; called immediately after `publish`, that raced GitHub's own
    #     read-after-write propagation on a freshly created repo + first push +
    #     branch-protection setup. This polls the SAME file at the EXACT commit
    #     `publish` just created, with exponential backoff, before `register` runs.
    - id: wait-for-content
      name: Wait for GitHub to serve catalog-info.yaml
      action: capstone:wait-for-repo-content
      input:
        repo: ${{ parameters.appName }}
        commitHash: ${{ steps['publish'].output.commitHash }}
        catalogInfoPath: '/catalog-info.yaml'

    # 4) Register the component so it appears in The Process catalog right away.
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

    # 4b) Create the team's Harbor project (idempotent). The no-build VM path pushes NO
    #     container image, so this is not on the critical path — it is kept so a team can
    #     later store a PRIVATE containerDisk (a baked/own base image, ADR-032 §4 v2.1)
    #     in its own Harbor project with no extra onboarding. Safe re-run (409 = exists).
    - id: harbor-onboard
      name: Create Harbor project (optional containerDisk home)
      action: capstone:harbor-onboard
      input:
        team: ${{ parameters.team }}

    # =====================================================================
    # PLATFORM SIDE — the D-049 review-gated grant path. The steps above created the
    # STUDENT's own repo. The steps below open a *request* (a PR to platform-infra) that
    # a reviewer *grants* (merge) — a student NEVER silently mints cluster RBAC/quotas/
    # the VM tier. The merge is the gate.
    # =====================================================================

    # 5a) Render the tenant manifests from the DEDICATED VM blueprint
    #     tenants/_template-vm/ (D-M4-2: render, do NOT fork; the action is shared and
    #     UNCHANGED — only the templateUrl differs from the container templates, which
    #     point at tenants/_template). A VM tenant must render ONLY the VM tier:
    #     _template-vm carries the VM AppProject + the <team>-vm-prod namespace + the VM
    #     env ApplicationSet, and NONE of the container envs/preview appsets. Pointing at
    #     the container _template instead is exactly what broke the first VM tenant
    #     (team-tenantvm, #376): the container envs appset render-failed on a `layout:
    #     vm` prod-only promotion.yaml, and no VM ApplicationSet existed to deploy the VM.
    #     Because capstone:render-tenant reads the blueprint at this git URL at scaffold
    #     time (not from the Backstage image), switching blueprints needs NO image rebuild.
    - id: render-tenant
      name: Render VM tenant manifests (tenants/team-<name>/)
      action: capstone:render-tenant
      input:
        templateUrl: https://github.com/UA-MIS/platform-infra/tree/main/tenants/_template-vm
        team: ${{ parameters.team }}
        appName: ${{ parameters.appName }}
        semester: ${{ parameters.year }}-${{ parameters.season | lower }}
        targetPath: ./tenant-pr

    # 5a-bis) Emit the VM-tenant TEARDOWN LEDGER marker into the SAME onboarding PR
    #     (ADR-032a). Writes tenants/_vm-claims/<team>-<app>.yaml — an inert marker (NOT a
    #     Crossplane XR, NOT applied to the cluster; _vm-claims is excluded from every
    #     tenant generator) that makes this VM tenant VISIBLE to the Backstage teardown UI.
    #     Without it a VM tenant can be created but never torn down through the portal:
    #     capstone-tenants-backend listTenants enumerates only tenants/_claims/*.yaml
    #     (Crossplane claims), and a VM tenant has none (it deploys from the git-directory
    #     generator over tenants/team-<team>/vm/). Rendered into ./tenant-pr so the PR diff
    #     carries both tenants/team-<team>/ AND the ledger marker. NO Backstage rebuild —
    #     a git-served skeleton, exactly like render-tenant's blueprint.
    - id: fetch-vm-ledger
      name: Emit VM teardown ledger (tenants/_vm-claims/)
      action: fetch:template
      input:
        url: ./skeleton-vm-ledger
        targetPath: ./tenant-pr
        values:
          team: ${{ parameters.team }}
          appName: ${{ parameters.appName }}
          semester: ${{ parameters.year }}-${{ parameters.season | lower }}

    # 5b) Open the review-gated onboarding PR to platform-infra. Uses the PLATFORM
    #     GitHub App token (NOT the student's), so ANY signed-in UA-MIS member can OPEN
    #     it; branch protection on platform-infra/main is the gate (only a CODEOWNER
    #     merges). Distinct branch/title from the container onboarding so a team can be
    #     reviewed independently. The PR body is the VM-AWARE operator checklist: there
    #     is NO push-robot step (no image build); a pull robot is needed ONLY if the
    #     base disk is a PRIVATE containerDisk.
    - id: tenant-pr
      name: Open platform onboarding PR (platform-infra)
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=UA-MIS&repo=platform-infra
        branchName: onboard-vm-team-${{ parameters.team }}
        targetBranchName: main
        title: "onboard VM tenant: team-${{ parameters.team }} (Capstone ${{ parameters.season }} ${{ parameters.year }})"
        sourcePath: ./tenant-pr
        description: |
          ## VM tenant onboarding request — `team-${{ parameters.team }}` (Capstone ${{ parameters.season }} ${{ parameters.year }})

          Scaffolded by **The Process** ("New Capstone VM") for VM app
          **${{ parameters.appName }}** (repo: ${{ steps['publish'].output.remoteUrl }}).

          This is a **`layout: vm`** workload (ADR-032): a real KubeVirt VirtualMachine,
          **no Dockerfile / no image build**. The disk is imported by CDI from
          `${{ parameters.baseImage }}` and cloud-init brings the app up on first boot.

          This PR adds `tenants/team-${{ parameters.team }}/` (rendered from the dedicated
          `tenants/_template-vm/` VM blueprint). **Merging is the grant**: on merge the
          `tenants-appset` git generator reconciles the team's namespaces + ApplicationSets,
          including the **`${{ parameters.team }}-vm-prod`** VM tier
          (`baseline` PSA + the VM-sized quota + the AppProject whitelist for
          `kubevirt.io/VirtualMachine` and `cdi.kubevirt.io/DataVolume` — ADR-032 §2/§6).

          ---

          ### Reviewer checklist
          - [ ] **KubeVirt + CDI are installed and KVM is confirmed** on the Talos nodes
                (ADR-032 open Q1) — a VM cannot run until this prerequisite is met.
          - [ ] Manifests render cleanly (`make validate` on `tenants/team-${{ parameters.team }}/`).
          - [ ] AppProject is team-scoped (empty `clusterResourceWhitelist`; the VM kinds
                are NAMESPACED additions only; destinations limited to `team-${{ parameters.team }}-*`).
          - [ ] The VM tier namespace is `baseline` PSA (NOT `restricted` — virt-launcher
                needs it) and carries a VM-sized ResourceQuota (ADR-032 §2d/§6c).
          - [ ] `__TEAM__`/`__SEMESTER__` fully substituted (no leftover tokens).
          - [ ] The VM teardown ledger `tenants/_vm-claims/${{ parameters.team }}-${{ parameters.appName }}.yaml`
                is present (makes this VM tenant visible + tear-down-able in the portal — ADR-032a).
          - [ ] `tenants/team-${{ parameters.team }}/vm/namespaces/vm-prod.yaml` carries the
                `allow-ingress-cloudflared-ssh` NetworkPolicy (port 22, from ns `cloudflared`)
                alongside the Traefik/HTTP one — the SSH transport's in-cluster half
                (ADR-032a D2).

          ### Operator steps (run AFTER merge)
          ```bash
          # 0) cluster context (Talos)
          export KUBECONFIG=clusters/real-talos/talos-kubeconfig

          # 1) (idempotent) Harbor project + OIDC mapping — already done at scaffold time
          #    by capstone:harbor-onboard; safe re-run (409 = already exists). Only needed
          #    at all if this team will store a PRIVATE containerDisk in its Harbor project.
          make harbor-onboard NAME=${{ parameters.team }} \
            TARGET=real-talos KUBE_CONTEXT=admin@capstone

          # 2) (ONLY if baseImage is a PRIVATE containerDisk in this team's Harbor project)
          #    per-env PULL robot -> sealed `harbor-pull` into ${{ parameters.team }}-vm-prod,
          #    and reference it from the DataVolume source.registry.secretRef. Skip this for
          #    the default PUBLIC base image. Guarded write (non-empty seal):
          make harbor-robot NAME=${{ parameters.team }} ENV=vm-prod \
            TARGET=real-talos KUBE_CONTEXT=admin@capstone \
            > /tmp/${{ parameters.team }}-pull-vm.yaml \
            && test -s /tmp/${{ parameters.team }}-pull-vm.yaml \
            && grep -q 'kind: SealedSecret' /tmp/${{ parameters.team }}-pull-vm.yaml \
            && mv /tmp/${{ parameters.team }}-pull-vm.yaml \
                  tenants/team-${{ parameters.team }}/harbor-pull-vm-prod-sealed.yaml \
            && git add tenants/team-${{ parameters.team }}/harbor-pull-vm-prod-sealed.yaml \
            && git commit -m "harbor pull robot (vm): team-${{ parameters.team }}"
          ```

          **3) Shell access — the WEB CONSOLE is the default door.** The VM serves a
          browser terminal itself, so a student needs nothing but their GitHub login:
          no SSH key, no certificate, no client install.

          The console ships **CLOSED**: the chart creates the console Service but not
          its Ingress, which lives in the opt-in `console-public` kustomize component
          and is commented out in the tenant's prod overlay. Two steps, IN THIS ORDER:
          - **First**, Zero Trust → Access controls → Applications → Add → Self-hosted,
            domain `${{ parameters.team }}-console.uamishub.com`, policy **Allow** =
            team-${{ parameters.team }}'s UA-MIS emails.
          - **Then** uncomment the `components:` block in the tenant repo's
            `.devops/chart/overlays/prod/kustomization.yaml` and merge.
          - ⚠ That Access policy is the ONLY wall in front of a root-capable shell.
            Allow only. Never Bypass, never Service Auth. Doing these two steps in the
            wrong order publishes an unauthenticated root shell — the hostname rides
            the existing `*.uamishub.com` route and is live the moment ArgoCD syncs.
          - Verify from OUTSIDE the cluster, and treat this as the acceptance test:
            `curl -sSI https://${{ parameters.team }}-console.uamishub.com/ | head -1`
            → **302** = Access is in front of it (correct); **200** = open to the
            internet, close it now; **502** = published but ttyd is not up.
          - No tunnel change is needed — `*.uamishub.com` already routes to Traefik.

          **SSH (the advanced path) — Cloudflare dashboard steps, NOT git** (the
          tunnel is token-based/remotely-managed; there is no in-cluster `ingress:`
          config to commit for this). Full steps:
          `docs/operator/vm-ssh-cloudflare-access.md`. Summary:
          - Zero Trust → Networks → Tunnels → platform tunnel → Public Hostname → Add:
            subdomain `${{ parameters.team }}-ssh`, domain `uamishub.com`,
            Type `SSH`, URL
            `${{ parameters.appName }}-ssh.${{ parameters.team }}-vm-prod.svc.cluster.local:22`.
            Put this rule ABOVE the `*.uamishub.com` catch-all — first match wins, and
            SSH carries no Host header, so it cannot ride the shared HTTP route.
          - Zero Trust → Access controls → Applications → Add → Self-hosted, domain
            `${{ parameters.team }}-ssh.uamishub.com`, policy Allow =
            team-${{ parameters.team }}'s UA-MIS emails.
          - Confirm the CNAME Cloudflare auto-creates for that hostname in DNS.

          > **Hostnames are ONE label under the apex, and that is a TLS constraint.**
          > The certificate is `DNS:uamishub.com, DNS:*.uamishub.com` — a single-level
          > wildcard. `${{ parameters.team }}-console.uamishub.com` is covered; a
          > dotted `console.${{ parameters.team }}.uamishub.com` or the older
          > `ssh.<app>.capstone.uamishub.com` is two or three labels and fails the TLS
          > handshake BEFORE Cloudflare Access loads — which looks nothing like an
          > auth error and has already cost this project real debugging time.

          > **No CI push robot** — the VM path has no Kaniko build (ADR-032 §6 CI). The
          > only image work, if any, is an OPTIONAL future disk-bake pipeline (v2.1).
        token: ${{ secrets.GITHUB_TOKEN }}

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: Platform onboarding PR (awaiting reviewer merge)
        icon: github
        url: ${{ steps['tenant-pr'].output.remoteUrl }}
    text:
      - title: Next steps
        content: |
          Your VM repo **${{ parameters.appName }}** is live under UA-MIS. Now:
          1. Clone it and edit `.devops/chart/base/cloud-init.yaml` — install YOUR stack
             (runtime, DB, services) on first boot. This is your "no Dockerfile" build.
          2. (optional) Point `.devops/vm-metadata.yaml` / the DataVolume at your OWN base
             disk image, and tune vCPUs / memory / disk size.
          3. Open a PR — CI **validates** your VM manifests + cloud-init (no image build).
          4. Merge to `main` — once the onboarding PR below is merged, ArgoCD deploys your
             VirtualMachine; CDI imports the disk and cloud-init runs your app on first boot.
          Your VM will be reachable at `https://${{ parameters.appName }}.capstone.uamishub.com`.

          **Get a shell — open the web console.** Your VM is a real machine you own.
          The simplest way in is a browser: open
          `https://${{ parameters.team }}-console.uamishub.com`, sign in with GitHub,
          and you get a terminal on the box. **That is the whole procedure** — no SSH
          key to generate, no certificate, no client to install. Your GitHub login is
          the only credential. Everyone on the team gets their own independent shell,
          so you can all be on at once.

          From there, `git clone` your app repo and run your stack right on the VM.

          **SSH in (the advanced path).** If you would rather use a standard `ssh`
          client, that works too. cloud-init imports the GitHub public keys of
          everyone on the team roster and refreshes them every 5 minutes, and turns
          password login OFF. Public SSH rides the platform's existing Cloudflare
          Tunnel (ADR-032a D2, $0, no LoadBalancer) at
          `${{ parameters.team }}-ssh.uamishub.com`, gated by a Cloudflare Access
          login — connect with `ssh -o ProxyCommand='cloudflared access ssh --hostname
          ${{ parameters.team }}-ssh.uamishub.com'
          <cloud-user>@${{ parameters.team }}-ssh.uamishub.com`. Add your key at
          <https://github.com/settings/keys> and wait ~5 minutes.

          Both routes are wired by an **operator dashboard step after your onboarding
          PR merges** (see the PR checklist below /
          `docs/operator/vm-ssh-cloudflare-access.md`) — until then your VM is
          reachable at its HTTP URL but the console and SSH are not yet open.
          Your rootdisk **persists across reboots** (it is a pet, not immutable) — but note
          in-VM changes are NOT in git, so push anything you want to keep back to the repo.

          **Two things are gated:** (a) a **platform onboarding PR** was opened against
          `UA-MIS/platform-infra` to stand up your team's VM tier (link above) — a reviewer
          must **merge** it; and (b) the platform's **KubeVirt capability** must be live
          (ADR-032). Until both are done your VM manifests validate in CI but do not yet run.
