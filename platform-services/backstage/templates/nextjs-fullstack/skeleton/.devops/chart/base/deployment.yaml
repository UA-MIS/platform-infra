# Workload Deployment for the ${{ values.appName }} Next.js app.
#
# Image: the `image:` field is the GitOps image-tag SEAM (§4.1). The base pins a
# placeholder; each overlay sets the registry/tag via a kustomize `images:`
# override driven by promotion.yaml (dev=main digest, staging=tag, prod=gated tag).
#
# Secrets: both APP_SECRET and DATABASE_URL are sourced from the in-namespace Secret
# `${{ values.appName }}-secret`, which the External Secrets Operator materializes from
# Vault via the per-env app-secret ExternalSecret (ADR-030 B1). DATABASE_URL (the MySQL
# connection string the Prisma client reads) is set by the team in The Process "Secrets"
# tab; both are `optional: true` so a fresh scaffold with an empty Vault still deploys.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.appName }}
  labels:
    app.kubernetes.io/name: ${{ values.appName }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ${{ values.appName }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${{ values.appName }}
    spec:
      serviceAccountName: ${{ values.appName }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Database migrations run to completion BEFORE the app container starts, so the app
      # never serves against an un-migrated schema. This uses the SAME image as the app
      # (the overlay `images:` override rewrites both containers) with the PINNED Prisma
      # CLI baked in at /app/prisma-cli (app/Dockerfile `migrator` stage) — it NEVER runs
      # `npx prisma` (that resolves to v7 and breaks the v6 `url = env(...)` schema). It is
      # idempotent (`migrate deploy` only applies pending migrations) so re-runs on restart
      # are no-ops, and it SKIPS when DATABASE_URL is unset so a fresh scaffold with nothing
      # in Vault still deploys green (M4 zero-config), exactly like the app container.
      initContainers:
        - name: migrate
          # SEAM: same image + tag as the app container (overlays patch both via images:).
          image: ${{ values.appName }}:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -z "${DATABASE_URL:-}" ]; then
                echo "DATABASE_URL not set — skipping migrations (M4 zero-config scaffold)."
                exit 0
              fi
              # HOME/TMPDIR point at the writable emptyDir: the root filesystem is read-only.
              export HOME=/tmp TMPDIR=/tmp
              echo "Applying Prisma migrations (migrate deploy)..."
              exec node /app/prisma-cli/node_modules/prisma/build/index.js \
                migrate deploy --schema /app/prisma-cli/prisma/schema.prisma
          env:
            # Same DATABASE_URL the app reads, from the same ESO-materialized Secret.
            # optional: true keeps the zero-config contract (unset -> the guard above skips).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${{ values.appName }}-secret
                  key: DATABASE_URL
                  optional: true
          volumeMounts:
            # Prisma writes only to $HOME/$TMPDIR; back them with the tmp emptyDir so the
            # rest of the root filesystem can stay read-only (below).
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: app
          # SEAM: overlays override registry + tag via kustomize images:.
          image: ${{ values.appName }}:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Container port — single source is app-metadata.yaml (port: 8080).
            - name: PORT
              value: "8080"
            # Proof-of-secret-path: value injected from the ESO-materialized Secret.
            # optional: true makes this the SAME base for two cases (M4 zero-config):
            #   - APP_SECRET set in Vault -> the app-secret ExternalSecret materializes
            #     ${{ values.appName }}-secret, APP_SECRET loads, the secret path is demonstrated;
            #   - a freshly-scaffolded repo (nothing in Vault) -> the app-secret
            #     ExternalSecret (deletionPolicy: Delete) creates no Secret, the env is
            #     simply unset, the pod still starts (no CreateContainerConfigError), so a
            #     new app deploys with ZERO manual secret setup. Teams add secrets via The
            #     Process "Secrets" tab only when they need one.
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: ${{ values.appName }}-secret
                  key: app-secret
                  optional: true
            # Next.js standalone (`node server.js`) binds to $HOSTNAME, which defaults
            # to the pod name Kubernetes injects into HOSTNAME (NOT a bindable address,
            # so the kubelet probes + Service can't reach it). Pin it to 0.0.0.0 so the
            # server listens on all interfaces. (PORT above is the listen port.)
            - name: HOSTNAME
              value: "0.0.0.0"
            # DATABASE_URL (MySQL connection string for the Prisma client). Materialized
            # by ESO into the SAME ${{ values.appName }}-secret the app-secret
            # ExternalSecret owns: the team sets key `DATABASE_URL` per env in The Process
            # "Secrets" tab, which APPENDS a data[] entry to that ExternalSecret (one k8s
            # Secret per env, all keys share the Vault object tenants/<team>/<env>/app).
            # optional: true keeps the M4 zero-config contract — a fresh scaffold with
            # nothing in Vault still deploys (the app reports the DB as not configured
            # instead of crashing). NEVER commit a value here; it lives only in Vault.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${{ values.appName }}-secret
                  key: DATABASE_URL
                  optional: true
          volumeMounts:
            # The platform security contract sets readOnlyRootFilesystem: true (below).
            # Next.js still needs a couple of writable paths at runtime — its
            # .next/cache (fetch/ISR cache) and /tmp — so back them with emptyDir
            # volumes; the rest of the root filesystem stays read-only.
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      # Writable scratch for Next.js (see the container volumeMounts above) — keeps
      # readOnlyRootFilesystem: true while giving the standalone server its cache + tmp.
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
