# ProviderConfig for provider-harbor (globallogicuki). ADR-031 §6 — authenticates
# as a least-privilege Harbor PROVISIONER ROBOT (project + robot + member admin,
# PLUS repository:push/pull/read/list + artifact:read/list + artifact-addition:read
# so it can delegate that exact scope to the per-team CI robots it mints — Harbor
# refuses to let a robot create a child with WIDER permissions than its own; see
# the 2026-07-11 harbor-push-robot incident in creds/README.md § Harbor CI-push
# robot-minting scope. NOT harbor-admin). References the sealed credentials Secret
# (creds/harbor-provisioner-creds-sealed.yaml), materialized to `harbor-provider-creds`.
# The `credentials` key is the JSON the Upjet harbor provider expects:
#   {"url":"http://harbor-core.harbor.svc","username":"robot$provisioner","password":"<token>"}
#
# ⚠ URL MUST be `http://harbor-core.harbor.svc` (plain HTTP, port 80) for the
# in-cluster path. The harbor-core Service serves ONLY `http-web:80->8080` — it does
# NOT listen on 443; TLS terminates at Traefik, not at harbor-core. A `https://` /
# 443 URL dials a closed port and every Project/Robot apply fails with
# `connect: connection refused`, leaving MRs Ready=False (reason "Creating") with
# EMPTY connection secrets — which starves the whole tenant CI push chain
# (crossplane conn-secret -> Vault PushSecret -> ESO -> arc-runners harbor-push).
# The provider makes only small API calls, so the Cloudflare 100MB edge cap is
# irrelevant; use in-cluster HTTP. (Root cause of an EARLIER swamiapp CI push
# blocker — connection-level, distinct from the 2026-07-11 permission-scope
# blocker documented above; both manifest as a broken CI push credential.)
#
# ⚠ Verify the ProviderConfig apiVersion (harbor.crossplane.io/v1beta1) + the
# credentials JSON keys against the installed provider-harbor v0.1.1 CRDs at Phase-0.
#
# ⚠ ROBOT-MINTING SCOPE (2026-07-11 incident + part-2 fix — see creds/README.md and
# docs/operator/harbor-provisioner-robot-effect-fix.md). The `robot$provisioner` this
# config authenticates as must be able to MINT the per-team CI push/pull child robots the
# Composition renders. Harbor enforces "child permissions ⊆ creator permissions", and its
# subset check keys each access policy by Resource:Action:EFFECT. provider-harbor (via
# terraform-provider-harbor) sends every child access entry with effect:"allow", so
# `robot$provisioner` must be minted with (a) the repository/artifact/artifact-addition
# grants at project namespace "*", AND (b) `"effect": "allow"` on EVERY access entry. Miss
# either and Harbor returns `403 permission scope is invalid ... robot$provisioner`, the
# RobotAccount MRs stick Ready=False, connection secrets stay empty, and tenant CI push
# fails UNAUTHORIZED. Fix without reseal: scripts/fix-harbor-provisioner-effect.sh.
apiVersion: harbor.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  labels:
    platform.capstone/component: platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # harbor.crossplane.io CRD is installed by provider-harbor (wave 0)
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: harbor-provider-creds
      key: credentials
