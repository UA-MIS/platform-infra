# vault-ca ConfigMap — the PUBLIC Vault server CA PEM (git-safe). TWO consumers:
#   1. The `vault-push` SecretStore's caProvider (vault-push-secretstore.yaml, wave 2).
#      ESO needs it to build the client that WRITES per-tenant Harbor-robot creds into
#      Vault; without it the SecretStore reports Ready=False / InvalidProviderConfig
#      ("unable to create client") and the crossplane-runtime app goes Degraded.
#   2. The provider-vault Pod (providers/provider-vault.yaml DeploymentRuntimeConfig,
#      wave 0), which mounts this ConfigMap and sets VAULT_CACERT so the provider can run
#      with skip_tls_verify: false. That mount is NOT optional, so this ConfigMap MUST
#      exist before the provider builds its Deployment — hence sync-wave "-1" below
#      (was "2"; the SecretStore at wave 2 is unaffected by the ConfigMap landing earlier).
#
# This mirrors the per-namespace vault-ca pattern the platform already uses elsewhere
# (backstage ns, and the per-tenant Composition drop): key ca.crt = the PUBLIC Vault CA
# PEM, read from the `vault-server-tls` secret (ns vault). It is the SAME platform CA
# committed at arc/platform-ca-configmap.yaml. The CA cert is PUBLIC — NOT secret
# material — so it is git-safe.
#
# ⚠ COMMITTED COPY — if the Vault server CA is rotated (vault-server-tls regenerated)
#   this goes stale and the SecretStore breaks until re-synced. Backstage/tenant copies
#   are dropped imperatively via `make vault-onboard`/`vault-ca-manifest`; this static
#   embed is the declarative equivalent so the SecretStore's CA syncs with the app.
#   The auto-distributing fix (cert-manager trust-manager Bundle) is the post-demo TODO.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-ca
  namespace: crossplane-system
  labels:
    platform.capstone/component: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-1"  # must exist before the wave-0 provider-vault Pod mounts it
data:
  ca.crt: |
