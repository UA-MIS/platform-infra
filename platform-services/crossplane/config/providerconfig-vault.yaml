# ProviderConfig for provider-vault (upbound). ADR-031 §6 — authenticates with a
# Vault token whose policy (`tenant-provisioner`) may write `policy` +
# `auth/kubernetes/role` scoped to tenants/* ONLY (reviewed once). References the
# placeholder-sealed credentials Secret (creds/vault-provisioner-creds-sealed.yaml),
# materialized to `vault-provider-creds`. The `credentials` key is the JSON the
# Upjet vault provider expects:
#   {"token":"<vault-token>","address":"https://vault.vault.svc.cluster.local:8200"}
# In-cluster Vault over TLS. VERIFIED against the v0.1.0 ProviderConfig CRD
# (package/crds/vault.upbound.io_providerconfigs.yaml @ v0.1.0): the spec exposes
# `address` (required), `skip_tls_verify`, and `tls_server_name` — but NO
# ca_cert_file / ca_cert_dir / caBundle field, so there is no in-CR way to trust the
# self-signed Vault CA. We set skip_tls_verify: true (see spec below for the tradeoff).
#
# ⚠ provider-vault is v0.1.0 (early). Verify the ProviderConfig apiVersion
# (vault.upbound.io/v1beta1) + credentials keys against the installed CRDs at Phase-0.
# A static token is the v1 stand-in; a Vault auth-method-issued, short-lived token
# (k8s auth for the provider SA) is the hardening follow-up.
apiVersion: vault.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  labels:
    platform.capstone/component: platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # vault.upbound.io CRD is installed by provider-vault (wave 0)
spec:
  # REQUIRED by vault.upbound.io/v1beta1 (spec.required: [address]) — the field whose
  # absence caused `spec.address: Required value`. Per the CRD: a URL with scheme +
  # host + port and NO path.
  address: "https://vault.vault.svc.cluster.local:8200"
  # The in-cluster Vault serves a self-signed-CA cert. The v0.1.0 ProviderConfig CRD
  # exposes NO CA field (only skip_tls_verify / tls_server_name), so trusting the CA
  # cleanly is not possible on the ProviderConfig itself. Pragmatic in-cluster choice:
  # skip_tls_verify. TRADEOFF: the provider does NOT verify the Vault server cert
  # (MITM exposure) — acceptable only because this traffic never leaves the cluster
  # (ClusterIP vault.vault.svc). HARDENING (follow-up, NOT this PR): add a
  # DeploymentRuntimeConfig that mounts the vault-ca ConfigMap into the provider Pod
  # and sets VAULT_CACERT, then flip this to skip_tls_verify: false.
  skip_tls_verify: true
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: vault-provider-creds
      key: credentials
