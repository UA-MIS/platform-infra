# ProviderConfig for provider-vault (upbound). ADR-031 §6 — authenticates with a
# Vault token whose policy (`tenant-provisioner`) may write `policy` +
# `auth/kubernetes/role` scoped to tenants/* ONLY (reviewed once). References the
# placeholder-sealed credentials Secret (creds/vault-provisioner-creds-sealed.yaml),
# materialized to `vault-provider-creds`. The `credentials` key is the JSON the
# Upjet vault provider expects:
#   {"token":"<vault-token>","address":"https://vault.vault.svc.cluster.local:8200"}
# In-cluster Vault over TLS. VERIFIED against the v0.1.0 ProviderConfig CRD
# (package/crds/vault.upbound.io_providerconfigs.yaml @ v0.1.0): the spec exposes
# `address` (required), `skip_tls_verify`, and `tls_server_name` — but NO
# ca_cert_file / ca_cert_dir / caBundle field, so the CA cannot be trusted on the CR
# itself. HARDENED (this PR): the self-signed Vault CA is trusted at the RUNTIME layer
# instead — providers/provider-vault.yaml carries a DeploymentRuntimeConfig that mounts
# the vault-ca ConfigMap and sets VAULT_CACERT, so we now run skip_tls_verify: false.
#
# ⚠ provider-vault is v0.1.0 (early). Verify the ProviderConfig apiVersion
# (vault.upbound.io/v1beta1) + credentials keys against the installed CRDs at Phase-0.
# A static token is the v1 stand-in; a Vault auth-method-issued, short-lived token
# (k8s auth for the provider SA) is the hardening follow-up.
apiVersion: vault.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  labels:
    platform.capstone/component: platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # vault.upbound.io CRD is installed by provider-vault (wave 0)
spec:
  # REQUIRED by vault.upbound.io/v1beta1 (spec.required: [address]) — the field whose
  # absence caused `spec.address: Required value`. Per the CRD: a URL with scheme +
  # host + port and NO path.
  address: "https://vault.vault.svc.cluster.local:8200"
  # The in-cluster Vault serves a self-signed-CA cert. The provider VERIFIES it:
  # the DeploymentRuntimeConfig in providers/provider-vault.yaml mounts the vault-ca
  # ConfigMap into the provider Pod and sets VAULT_CACERT, which the Upjet vault
  # provider's Vault API client (terraform-provider-vault `ca_cert_file` <- VAULT_CACERT)
  # uses to validate the server cert. TLS verification is ON — the provider will
  # REFUSE a cert it cannot chain to that CA (no MITM window). Requires the vault-ca
  # ConfigMap present in crossplane-system (it is).
  #
  # NOTE (drift cleanup): `skip_tls_verify: false` was previously stated explicitly
  # here, but ArgoCD's ServerSideApply machinery prunes the false-valued boolean
  # from the apply (verified via managedFields: argocd-controller's fieldset never
  # contained it), so the field never landed on the live object and the app sat
  # perpetually OutOfSync on it. The field is OMITTED instead: absent ==
  # provider default `false` == verify TLS — identical semantics, zero drift.
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: vault-provider-creds
      key: credentials
