# ProviderConfig for provider-sql (ADR-033). Connects to the off-cluster DB tier
# (ua-mis-db-1, MariaDB 11.8) using a SCOPED admin credential — NOT the MariaDB
# `root` account. The provisioner only needs CREATE/DROP DATABASE, CREATE/DROP USER,
# and GRANT on the tenant `<team>_<env>` namespace (see creds/README.md for the exact
# SQL grants to mint that login). This mirrors the harbor/vault provisioner-robot
# pattern: the powerful credential lives ONLY in crossplane-system, never in Backstage,
# never with humans, and is the focal point of the one-time SRE review (ADR-031 §6).
#
# The referenced Secret `db-tier-mysql-admin` is materialized from the PLACEHOLDER
# SealedSecret in creds/mysql-admin-creds-sealed.yaml. provider-sql's
# `MySQLConnectionSecret` source reads four FIXED keys from it —
# endpoint/port/username/password — which is exactly what the placeholder
# SealedSecret carries (see creds/README.md; the SRE audits those keys there).
#
# ⚠ NOTE (v0.15.0 schema): the installed provider-sql v0.15.0 ProviderConfig CRD
# does NOT expose a `spec.credentials.secretKeyMapping` field (verified against the
# live CRD + Context7 crossplane-contrib/provider-sql). secretKeyMapping is a
# master-branch/unreleased addition; on v0.15.0 the four secret key names are
# hardcoded to endpoint/port/username/password, so no mapping is declared here.
# TLS: MariaDB on ua-mis-db-1 is reachable over the trusted Tailscale overlay; if TLS
# is later enabled on the DB, add the CA via the provider's runtime config (the tailnet
# is the current transport-security boundary — DB-tier runbook §4).
apiVersion: mysql.sql.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: db-tier-mariadb
  labels:
    platform.capstone/component: platform
spec:
  credentials:
    source: MySQLConnectionSecret
    connectionSecretRef:
      namespace: crossplane-system
      name: db-tier-mysql-admin
