# Sealed against the IN-CLUSTER db-tier (docs/operator/in-cluster-db-tier-runbook.md
# §4c, the tenant-DB migration cutover, PR completing the mysql-side repoint).
# endpoint=capstone-pg-rw.db-tier.svc.cluster.local port=5432
# username=crossplane_provisioner (the `capstone-pg-crossplane-provisioner`
# DatabaseRole on `capstone-pg`, platform-services/cnpg/cluster/roles.yaml —
# LOGIN CREATEDB CREATEROLE, verified live, NOT the `postgres` superuser).
# No live Postgres tenant exists yet (zero postgresql.sql.crossplane.io Database/
# Role/Grant claims at reseal time) so this activates provider-sql's postgres
# ProviderConfig for the first time but has no reconcile blast radius today —
# see providerconfig-postgres.yaml's own header for the sslMode/defaultDatabase
# notes, unchanged by this reseal. crossplane-system's NetworkPolicy ingress to
# db-tier:5432 is NOT yet added (platform-services/db-tier/netpol.yaml) — add it
# at the point a real Postgres tenant is first provisioned against this
# ProviderConfig, same pattern as the mysql:3306 rule added in this PR.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: db-tier-postgres-admin
  namespace: crossplane-system
spec:
  encryptedData:
    endpoint: 
    password: 
    port: 
    username: 
  template:
    metadata:
      name: db-tier-postgres-admin
      namespace: crossplane-system
