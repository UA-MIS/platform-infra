# ============================================================================
# CapstoneTenant XRD — THE TENANT ONBOARDING API (ADR-031 §3).
# ============================================================================
# A Crossplane v2 CompositeResourceDefinition. This is the ENTIRE per-onboarding
# surface: a Backstage scaffold emits ONE CapstoneTenant XR carrying ~10
# schema-validated fields, and the reviewed-once Composition (composition.yaml)
# expands it into the full tenant (repo + Harbor + Vault + the k8s tenancy fence).
#
# Crossplane v2 (apiextensions.crossplane.io/v2): there is NO separate Claim — the
# scaffolder creates the XR directly. scope: CLUSTER (not Namespaced): the Composition
# composes cluster-scoped provider MRs (provider-sql Database/User/Grant, provider-vault
# Policy/AuthBackendRole, provider-harbor Project/RobotAccount, provider-kubernetes
# Object — all Cluster-scoped at the pinned provider versions, none ship a namespaced
# `.m.` variant). In Crossplane v2 a NAMESPACED composite cannot own cluster-scoped MRs
# ("cannot apply cluster scoped composed resource for a namespaced composite resource");
# a CLUSTER composite can compose cluster-scoped MRs AND namespaced resources in any
# namespace (the Object-rendered tenancy fence sets its own metadata.namespace inline).
#
# WHY this is a real security gate (not a rubber stamp): the XR is LOW-TRUST — every
# field below is a string/int/bool bounded by pattern/min/max. A fully automated
# Backstage emit CANNOT escalate, because the *shape of what is possible* is fixed by
# this reviewed XRD + the reviewed Composition + the four scoped ProviderConfigs. The
# pattern/maxLength guards are the SAME DNS-1123 bounds the scaffolder form enforces
# today (template.yaml) — but here they bound the whole blast radius declaratively,
# so the SEC-001 blanket-`sed` malformed-name bug class is impossible by construction.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: capstonetenants.platform.capstone.uamishub.com
  labels:
    platform.capstone/component: platform
spec:
  scope: Cluster                          # cluster-scoped XR — required to own the cluster-scoped provider MRs (see header)
  group: platform.capstone.uamishub.com
  names:
    kind: CapstoneTenant
    plural: capstonetenants
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [team, appName, semester]
              # ⚠ RESERVED-NAME GUARD (CXP-1, privilege-escalation / tenant-isolation).
              # The XR auto-commits to main via the GitHub App with NO human merge
              # (branch-protection bypass — ADR-031 §7), so `team`/`appName` are
              # LOW-TRUST inputs used directly with org-admin + cluster-wide creds.
              # DNS-1123 format alone is NOT enough: `team: platform` would clobber the
              # privileged platform AppProject, and `appName: platform-infra` would hand
              # the tenant push to the infra repo. These CEL rules (Crossplane v2 XRDs
              # support x-kubernetes-validations) reject reserved names at ADMISSION —
              # the same denylist is mirrored in the scaffolder (emitTenantClaim.ts) for
              # defense in depth. Keep the two lists in lockstep.
              x-kubernetes-validations:
                - rule: >-
                    !(self.team in ['platform','argocd','default','kube-system',
                    'crossplane-system','vault','vault-unsealer','harbor','arc-runners',
                    'arc-system','sealed-secrets','external-secrets','monitoring',
                    'cert-manager'])
                  message: >-
                    spec.team is a reserved platform/namespace name and cannot be used as
                    a tenant team slug (would collide with privileged platform RBAC).
                - rule: >-
                    !(self.appName in ['platform-infra','capstone-app-template','.github'])
                  message: >-
                    spec.appName is a reserved org-infrastructure repo name and cannot be
                    used as a tenant app name (would collide with an infra repo).
              properties:
                team:
                  type: string
                  description: >-
                    Team slug — the ONE canonical key (D-026): AppProject name,
                    namespace prefix, Harbor project, Vault path, OIDC group suffix.
                    DNS-1123 label.
                  pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
                  maxLength: 30
                appName:
                  type: string
                  description: >-
                    App/repo slug — the repo name, the workload names, the image name,
                    and the ingress host segment all derive from this one field (kills
                    the v1check appName/repo-name mismatch bug class). DNS-1123 label.
                  pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
                  maxLength: 30
                semester:
                  type: string
                  description: >-
                    Cohort slug (year-first, e.g. 2026-fall) — the universal
                    platform.capstone/semester GC/report selector. Matches the
                    scaffolder's SLUG form.
                  pattern: '^[0-9]{4}-(spring|summer|fall)$'
                githubTeam:
                  type: string
                  description: GitHub team slug for repo push access. Defaults to `team`.
                  pattern: '^[a-z]([-a-z0-9]*[a-z0-9])?$'
                  maxLength: 39
                port:
                  type: integer
                  description: Container port (PORT env + Service/Ingress target).
                  default: 8080
                  minimum: 1
                  maximum: 65535
                previewEnabled:
                  type: boolean
                  description: >-
                    Enable the per-PR preview ApplicationSet (security-gated — see
                    tenants/_template/applicationset-preview.yaml). Default off.
                  default: false
                publicDevIngress:
                  type: boolean
                  description: >-
                    SECURITY-GATED, default off. Drop the non-prod SSO forwardAuth
                    from the DEV ingress only (staging and preview stay gated;
                    prod is public regardless). Set this ONLY for an app whose dev
                    environment is deliberately a public showcase carrying no real
                    user data -- it makes dev exactly as reachable as prod already
                    is. The app's own auth (e.g. Clerk) still protects everything
                    behind it; this removes the platform's outer org-membership
                    gate, not the application's own login.
                    Motivation: the SSO gate returns a 302 BEFORE Traefik routes to
                    the backend, so a gated env produces no per-service ingress
                    metrics at all -- its Grafana traffic panels are structurally
                    empty. Enabling this is what lets a showcase app demonstrate
                    real traffic and real business metrics in ONE dashboard.
                  default: false
                domain:
                  type: string
                  description: Public base domain for ingress hosts.
                  default: capstone.uamishub.com
                database:
                  type: string
                  description: >-
                    Automatic per-(team,env) database provisioning (ADR-033). `mysql`
                    provisions a MariaDB schema + scoped user + grant per environment on
                    the off-cluster DB tier (provider-sql), pushes the credentials into
                    Vault at tenants/<team>/<env>/database, and the app's DATABASE_URL
                    ExternalSecret reads them. `postgres` does the same on the PG17
                    engine of the same DB tier (provider-sql postgresql.sql.crossplane.io:
                    Database + login Role + Grant), writing the SAME four Vault parts
                    (username/password/host/port) so the consumer contract is engine-
                    agnostic — only the DATABASE_URL scheme differs (postgresql://).
                    `none` provisions no database (the default; DB-less stacks like the
                    React static SPA leave it unset). The DB scaffolder templates set
                    `mysql` or `postgres` per the chosen engine; react-static leaves
                    `none`.
                  enum: [none, mysql, postgres]
                  default: none
                maxRunners:
                  type: integer
                  description: >-
                    Per-tenant ARC (actions-runner-controller) scale-set concurrency
                    ceiling — how many CI runner pods this tenant's <team>-kaniko
                    scale set may run at once (the Composition wires this straight
                    into the gha-runner-scale-set Helm values,
                    platform-services/crossplane/apis/composition.yaml). Default 5
                    for new tenants; raise a tenant's own value in its claim only
                    when that team's image build matrix genuinely needs more
                    parallelism (crimson-copies and ida-llm pin 8 — a wide
                    multi-image matrix, owner-approved 2026-08-25, #535). The
                    cross-tenant AGGREGATE ceiling is the arc-runners ResourceQuota
                    (platform-services/arc/resourcequota.yaml, pods 40 /
                    requests.cpu 20 / requests.memory 50Gi) — this field only widens
                    one tenant's own GHA-queue knob; jobs beyond the aggregate quota
                    queue in GitHub Actions rather than spawning unplaceable pods.
                  minimum: 1
                  maximum: 10
                  default: 5
            status:
              type: object
              properties:
                repoUrl:
                  type: string
                  description: The created team app repo URL (set by the Composition).
                harborProject:
                  type: string
                  description: The created Harbor project name (set by the Composition).
                dbConsoleUrl:
                  type: string
                  description: >-
                    The team's dev-env DB console URL (Adminer, SSO-gated), set by the
                    Composition ONLY when spec.database != "none" (tenant-db-access
                    design). Operator-facing visibility (`kubectl get capstonetenant
                    <name> -o jsonpath='{.status.dbConsoleUrl}'`) — the student-facing
                    channel is the scaffolder-emitted catalog-info.yaml `links:` entry,
                    not this field. Absent (empty string) for database == "none".
