# ============================================================================
# CapstoneTenant Composition — THE REVIEWED-ONCE EXPANSION (ADR-031 §4).
# ============================================================================
# `mode: Pipeline` with function-go-templating: reads the ONE CapstoneTenant XR and
# renders EVERY downstream managed resource, doing the substitution that imperative
# `sed`+`make` used to do — but type-checked, reconciling, and drift-correcting.
# function-auto-ready then marks the XR Ready when its composed resources are Ready.
#
# This file IS the blast radius the one-time SRE review scrutinizes (with
# rbac/provider-kubernetes-rbac.yaml). Read the bug→declarative mapping in the
# crossplane README alongside it — each section below is annotated with the
# v1check-era onboarding bug(s) it structurally eliminates.
#
# ⚠ Provider MR apiVersions: the github/harbor/vault MR groups below are pinned to
# the providers in providers/. provider-vault (v0.1.0) + provider-harbor (v0.1.1)
# are early — the SRE confirms the exact group/kind against the installed CRDs at
# Phase-0 apply (notes inline). The k8s tenancy objects (rendered via
# provider-kubernetes Object) are stable and mirror tenants/_template/ verbatim.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: capstonetenant
  labels:
    platform.capstone/component: platform
spec:
  compositeTypeRef:
    apiVersion: platform.capstone.uamishub.com/v1alpha1
    kind: CapstoneTenant
  mode: Pipeline
  pipeline:
    # ------------------------------------------------------------------------
    - step: render-tenant
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        options: ["missingkey=error"]
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $team := $spec.team }}
            {{- $app := $spec.appName }}
            {{- $sem := $spec.semester }}
            {{- $ghTeam := $spec.githubTeam | default $team }}
            {{- $port := $spec.port | default 8080 }}
            {{- $domain := $spec.domain | default "capstone.uamishub.com" }}
            {{- $preview := $spec.previewEnabled | default false }}
            {{- $database := $spec.database | default "none" }}
            {{- /* MySQL identifiers from the team slug: hyphens -> underscores, since
                   `<team>_<env>` becomes a MariaDB schema + username (ADR-033). */}}
            {{- $teamDb := $team | replace "-" "_" }}
            {{- $registry := printf "harbor.%s" $domain }}
            {{- $repoUrl := printf "https://github.com/UA-MIS/%s" $app }}
            {{- $infraUrl := "https://github.com/UA-MIS/platform-infra" }}
            {{- /* env quota tiers — dev/staging modest, prod higher (mirrors tenants/_template/namespaces/*) */}}
            {{- $envs := list
                  (dict "name" "dev"     "cpuReq" "2" "memReq" "2Gi" "cpuLim" "4" "memLim" "4Gi"  "pods" "10" "storageReq" "5Gi"  "pvcs" "4")
                  (dict "name" "staging" "cpuReq" "2" "memReq" "2Gi" "cpuLim" "4" "memLim" "4Gi"  "pods" "10" "storageReq" "5Gi"  "pvcs" "4")
                  (dict "name" "prod"    "cpuReq" "4" "memReq" "4Gi" "cpuLim" "8" "memLim" "8Gi"  "pods" "20" "storageReq" "20Gi" "pvcs" "6") }}

            {{- /* =====================================================================
                   GITHUB — DELIBERATELY EMPTY (ADR-035 §D2, human-approved).
                   The SCAFFOLDER owns the code repo end-to-end; the claim owns only
                   platform tenancy. The zero-touch wizard's `publish:github` step
                   (new-capstone-project-zerotouch/template.yaml) creates UA-MIS/<app>,
                   pushes the COMPOSED FRAGMENT skeleton the student chose, protects
                   `main` (protectDefaultBranch: true), grants the team push
                   (collaborators), and ships CI via the skeleton's thin caller
                   (.github/workflows/build-and-push.yaml → tenant-build.yaml@v1).
                   This Composition previously ALSO created the repo bootstrapped from
                   capstone-app-template + BranchProtection + TeamRepository + a ci.yaml
                   RepositoryFile — a repo-ownership COLLISION that would clobber the
                   student's fragment code with the template bootstrap and defeat the
                   wizard. All four GitHub MRs are dropped: NO Repository / no template
                   bootstrap / no BranchProtection / no TeamRepository / no RepositoryFile.
                   Blast-radius win: the auto-committed claim no longer needs org-admin
                   repo-create. See §D2 rejected alternatives. $repoUrl (above) is
                   retained — the AppProject sourceRepos still references the (now
                   scaffolder-created) repo; the Composition observes it, never seeds it.
                   ===================================================================== */}}

            {{- /* =====================================================================
                   HARBOR — project + push/pull robots (provider-harbor, the spike path).
                   Bug #1 (project missing): Project MR, reconciled. Bug #2 (shared
                   harbor-push collision): per-team push RobotAccount. Bug #10/#11
                   (curl-Job rootfs / legacy API): no Job — the provider speaks the
                   unified API. Robot tokens land in connection secrets (writeConnection
                   SecretToRef) → bridged to Vault by the PushSecrets below.

                   ROBOT-SECRET RECONCILE-STABILITY — VARIANT 2 LOCKED (reliability-first).
                   We let Harbor GENERATE the token (do NOT supply `secret`) and capture it
                   from the connection secret. This is STABLE ACROSS RECONCILES: the Harbor
                   API does not return the robot secret on read, so Upjet/Terraform keep the
                   value in state — it is Computed-ONCE and persists; there is NO regen on
                   steady-state reconcile (confirmed via the TF provider's read behavior).
                   Regeneration happens ONLY on REPLACEMENT-forcing changes, which are not
                   reconciles: editing `permissions` (goharbor TF #140), a prefix plus-sign
                   (#479), or import (#447). So: DO NOT churn the `permissions`/`name` below
                   post-onboarding (a Composition edit to them would replace every tenant's
                   robot → one-time re-pull); greenfield only (no import). `duration: -1`
                   (non-expiring) avoids expiry-driven change.
                   Variant 1 (SUPPLY the secret) was REJECTED: in a stateless go-template
                   Composition a supplied value must be generated each render (sprig
                   randAlphaNum) → churns every reconcile; and supplying the plain `secret`
                   field risks a perpetual update-diff (the reason the TF provider added the
                   write-only `secret_wo`+`secret_wo_version`, unconfirmed in v0.1.1). So
                   variant 1 trades a rare, controllable replacement event for a potential
                   PER-RECONCILE churn — worse on the reliability criterion. ⚠ Phase-0:
                   confirm no reconcile-diff on the captured secret; if variant-2 permission-
                   change churn ever bites AND `secret_wo` is available, revisit.
                   ===================================================================== */}}
            ---
            # ⚠ Verify group/kind vs provider-harbor v0.1.1 (project.harbor.crossplane.io / Project).
            apiVersion: project.harbor.crossplane.io/v1alpha1
            kind: Project
            metadata:
              annotations:
                {{ setResourceNameAnnotation "harbor-project" }}
            spec:
              forProvider:
                name: {{ $team | quote }}
                public: false
                vulnerabilityScanning: true       # auto_scan (verify field name vs CRD)
              providerConfigRef:
                name: default
            ---
            # Per-team PUSH robot (CI). pull+push on the team project. Token → connection
            # secret <team>-harbor-push in crossplane-system → PushSecret → Vault.
            apiVersion: robotaccount.harbor.crossplane.io/v1alpha1
            kind: RobotAccount
            metadata:
              annotations:
                {{ setResourceNameAnnotation "harbor-robot-push" }}
            spec:
              forProvider:
                name: {{ printf "%s-push" $team | quote }}
                description: "CI push robot (managed by Crossplane)"
                level: project
                duration: -1                       # non-expiring (verify; -1 = unlimited)
                permissions:
                  - kind: project
                    namespace: {{ $team | quote }}
                    access:
                      - action: push
                        resource: repository
                      - action: pull
                        resource: repository
              writeConnectionSecretToRef:
                namespace: crossplane-system
                name: {{ printf "%s-harbor-push" $team | quote }}
              providerConfigRef:
                name: default
            ---
            # Per-team PULL robot (workloads). pull-only on the team project. Token →
            # connection secret <team>-harbor-pull → PushSecret → Vault → per-env ESO.
            apiVersion: robotaccount.harbor.crossplane.io/v1alpha1
            kind: RobotAccount
            metadata:
              annotations:
                {{ setResourceNameAnnotation "harbor-robot-pull" }}
            spec:
              forProvider:
                name: {{ printf "%s-pull" $team | quote }}
                description: "Workload pull robot (managed by Crossplane)"
                level: project
                duration: -1
                permissions:
                  - kind: project
                    namespace: {{ $team | quote }}
                    access:
                      - action: pull
                        resource: repository
              writeConnectionSecretToRef:
                namespace: crossplane-system
                name: {{ printf "%s-harbor-pull" $team | quote }}
              providerConfigRef:
                name: default

            {{- /* =====================================================================
                   VAULT — per-tenant scoped policy + k8s-auth role (provider-vault).
                   Bug #7 (vault-onboard never run): Policy + AuthBackendRole MRs created
                   WITH the tenant, reconciled forever. Replaces `make vault-onboard`.
                   Groups CRD-verified vs provider-vault v0.1.0: ACL Policy is
                   vault.vault.upbound.io (NOT policy.vault.upbound.io); k8s-auth role
                   is kubernetes.vault.upbound.io.
                   ===================================================================== */}}
            ---
            apiVersion: vault.vault.upbound.io/v1alpha1
            kind: Policy
            metadata:
              annotations:
                {{ setResourceNameAnnotation "vault-policy" }}
            spec:
              forProvider:
                name: {{ printf "tenant-%s-ro" $team | quote }}
                policy: |
                  path "secret/data/tenants/{{ $team }}/*" {
                    capabilities = ["read"]
                  }
                  path "secret/metadata/tenants/{{ $team }}/*" {
                    capabilities = ["read", "list"]
                  }
              providerConfigRef:
                name: default
            ---
            apiVersion: kubernetes.vault.upbound.io/v1alpha1
            kind: AuthBackendRole
            metadata:
              annotations:
                {{ setResourceNameAnnotation "vault-k8s-role" }}
            spec:
              forProvider:
                backend: kubernetes
                roleName: {{ printf "tenant-%s" $team | quote }}
                boundServiceAccountNames: ["eso-tenant"]
                boundServiceAccountNamespaces:
                  {{- range $envs }}
                  - {{ printf "%s-%s" $team .name | quote }}
                  {{- end }}
                  - {{ printf "%s-preview" $team | quote }}
                audience: vault
                tokenPolicies: [{{ printf "tenant-%s-ro" $team | quote }}]
                tokenTtl: 3600
              providerConfigRef:
                name: default

            {{- /* =====================================================================
                   KUBERNETES TENANCY FENCE — via provider-kubernetes Object.
                   Mirrors tenants/_template/ EXACTLY (the reviewed fence), but rendered
                   from the one XR (no sed → bug #13 SEC-001 malformed names impossible).
                   AppProject includes the ESO whitelist (bug #6) so the SecretStore/
                   ExternalSecret kinds the same template renders are permitted.
                   ===================================================================== */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              # Deterministic Object name so the env/preview ApplicationSet Objects can
              # dependsOn it (provision-before-deploy ordering — see those Objects).
              name: {{ printf "xp-%s-appproject" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "k8s-appproject" }}
            spec:
              providerConfigRef:
                name: default
              # Object is Ready only when the AppProject actually exists (so the XR's
              # function-auto-ready Ready reflects real provisioning — the signal the
              # tenant deploy waits on).
              readiness:
                policy: DeriveFromObject
              forProvider:
                manifest:
                  apiVersion: argoproj.io/v1alpha1
                  kind: AppProject
                  metadata:
                    name: {{ $team | quote }}
                    namespace: argocd
                    labels:
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/component: tenant
                    finalizers:
                      - resources-finalizer.argocd.argoproj.io
                  spec:
                    description: {{ printf "Tenant project for team %s (%s)." $team $sem | quote }}
                    sourceRepos:
                      - {{ $repoUrl | quote }}
                      - {{ printf "%s.git" $repoUrl | quote }}
                      - {{ $infraUrl | quote }}
                      - {{ printf "%s.git" $infraUrl | quote }}
                    destinations:
                      {{- range $envs }}
                      - server: https://kubernetes.default.svc
                        namespace: {{ printf "%s-%s" $team .name | quote }}
                      {{- end }}
                      - server: https://kubernetes.default.svc
                        namespace: {{ printf "%s-pr-*" $team | quote }}
                    clusterResourceWhitelist: []
                    namespaceResourceWhitelist:
                      - { group: '', kind: ConfigMap }
                      - { group: '', kind: Service }
                      - { group: '', kind: ServiceAccount }
                      - { group: apps, kind: Deployment }
                      - { group: apps, kind: ReplicaSet }
                      - { group: autoscaling, kind: HorizontalPodAutoscaler }
                      - { group: networking.k8s.io, kind: Ingress }
                      - { group: bitnami.com, kind: SealedSecret }
                      # Bug #6 — ESO kinds whitelisted WITH the ESO objects this template
                      # also renders, so the whitelist + the CRs can never drift apart.
                      - { group: external-secrets.io, kind: ExternalSecret }
                      - { group: external-secrets.io, kind: SecretStore }
                      # Argo Rollouts (progressive-delivery, opt-in —
                      # docs/operator/progressive-delivery.md). Kept in sync with
                      # tenants/_template/appproject.yaml (same tenancy-safe, namespaced
                      # kind as Deployment above): a team MAY run a Rollout instead of a
                      # Deployment in its own namespace; never a cluster-scoped object.
                      - { group: argoproj.io, kind: Rollout }
                    roles:
                      - name: developer
                        description: {{ printf "Team %s developers — sync/get own apps only." $team | quote }}
                        policies:
                          - {{ printf "p, proj:%s:developer, applications, get, %s/*, allow" $team $team | quote }}
                          - {{ printf "p, proj:%s:developer, applications, sync, %s/*, allow" $team $team | quote }}
                        groups:
                          - {{ printf "%s-developers" $team | quote }}

            {{- /* Per-env namespace bundle: Namespace+Quota+LimitRange+3 NetworkPolicies+
                   RoleBinding + eso-tenant SA + vault-ca ConfigMap + SecretStore +
                   app-secrets ExternalSecret + harbor-pull ExternalSecret. One
                   provider-kubernetes Object per manifest, ranged over envs (DRY; no sed).
                   The developer RBAC is a RoleBinding to the pre-reviewed ClusterRole
                   capstone-tenant-developer (CXP-2) — no inline Role, so the provider
                   needs no cluster-wide mirror of pods/exec + deploy-patch. */}}
            {{- range $e := $envs }}
            {{- $ns := printf "%s-%s" $team $e.name }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-%s-ns" $team $e.name | quote }}
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-ns-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              readiness:
                policy: DeriveFromObject
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Namespace
                  metadata:
                    name: {{ $ns | quote }}
                    labels:
                      app.kubernetes.io/managed-by: argocd
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                      pod-security.kubernetes.io/enforce: restricted
                      pod-security.kubernetes.io/enforce-version: v1.31
                      # Goldilocks recommend-only (Off mode): tenant workloads get sizing
                      # suggestions in the dashboard, never an eviction (mirrors _template).
                      goldilocks.fairwinds.com/enabled: "true"
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-quota-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ResourceQuota
                  metadata:
                    name: compute-quota
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                  spec:
                    hard:
                      requests.cpu: {{ $e.cpuReq | quote }}
                      requests.memory: {{ $e.memReq | quote }}
                      limits.cpu: {{ $e.cpuLim | quote }}
                      limits.memory: {{ $e.memLim | quote }}
                      pods: {{ $e.pods | quote }}
                      services: "5"
                      # Storage cap — the starvation vector CPU/MEM quotas don't fence.
                      # On replica-3 Ceph every 1Gi PVC costs 3Gi raw (mirrors _template).
                      requests.storage: {{ $e.storageReq | quote }}
                      persistentvolumeclaims: {{ $e.pvcs | quote }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-limits-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: LimitRange
                  metadata:
                    name: container-limits
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                  spec:
                    limits:
                      - type: Container
                        default: { cpu: 500m, memory: 256Mi }
                        defaultRequest: { cpu: 50m, memory: 64Mi }
                        max: { cpu: "1", memory: 1Gi }
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-netpol-deny-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: default-deny-all
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                  spec:
                    podSelector: {}
                    policyTypes: [Ingress, Egress]
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-netpol-ingress-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: allow-ingress-traefik-and-intra-ns
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                  spec:
                    podSelector: {}
                    policyTypes: [Ingress]
                    ingress:
                      - from:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: kube-system
                      - from:
                          - podSelector: {}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-netpol-egress-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: allow-egress-dns-and-intra-ns
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                  spec:
                    podSelector: {}
                    policyTypes: [Egress]
                    egress:
                      - to:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: kube-system
                        ports:
                          - { protocol: UDP, port: 53 }
                          - { protocol: TCP, port: 53 }
                      - to:
                          - podSelector: {}
                      # DB tier — MariaDB (3306) / Postgres (5432), scoped to the db-tier
                      # namespace by name. Codifies the tenant side of the
                      # CiliumNetworkPolicy hand-applied live for swami-dev/staging/prod on
                      # 2026-07-07/08 (the matching platform.capstone/team-keyed ingress
                      # lives in platform-services/db-tier/netpol.yaml, rule
                      # allow-ingress-tenant-namespaces — the other half of this door) as a
                      # REUSABLE default rendered for every tenant/env, so a new team never
                      # needs a hand-applied CNP to reach a managed DB.
                      #
                      # tenant-db-access (§6.3): gated on the SAME $database field the
                      # DATABASE blocks below use — a DB-less team's netpol is untouched,
                      # and the one team already live (swami, database != "none") keeps
                      # exactly the access the 2026-07-07/08 hotfix granted it. Port-scoped
                      # to the ONE engine chosen (mutually exclusive, XRD enum is a single
                      # value) — not a blanket db-tier admit. Opening the path does not by
                      # itself grant access — actual credentials/grants below are still
                      # gated on `$database` (mysql/postgres). Supersedes an earlier
                      # unconditional (no `if` guard) variant of this same rule that opened
                      # both ports regardless of `$database`: since the Composition
                      # re-renders on every claim update, there is no need to pre-open the
                      # door for a `database` field that hasn't been set yet, and the
                      # conditional form avoids granting DB-tier egress to teams that have
                      # no database at all.
                      {{- if ne $database "none" }}
                      - to:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: db-tier
                        ports:
                          - protocol: TCP
                            port: {{ if eq $database "postgres" }}5432{{ else }}3306{{ end }}
                      {{- end }}
            ---
            # Developer RBAC (CXP-2): a namespaced RoleBinding to the pre-reviewed
            # ClusterRole capstone-tenant-developer (rbac/capstone-tenant-developer-
            # clusterrole.yaml). No inline Role is minted — so the provider holds NO
            # cluster-wide pods/exec or deployment-write; it only `bind`s this one role.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-rolebinding-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: RoleBinding
                  metadata:
                    name: team-developer
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                  roleRef:
                    apiGroup: rbac.authorization.k8s.io
                    kind: ClusterRole
                    name: capstone-tenant-developer
                  subjects:
                    - apiGroup: rbac.authorization.k8s.io
                      kind: Group
                      name: {{ printf "%s-developers" $team | quote }}
            ---
            # eso-tenant SA (the per-tenant ExternalSecrets authenticate as this →
            # Vault role tenant-<team>). Bug #7 companion.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-eso-sa-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: eso-tenant
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/component: tenant
            ---
            # vault-ca ConfigMap (bug #7): the in-ns CA the namespaced SecretStore's
            # caProvider reads — replaces `make vault-onboard` materializing it.
            # ⚠ The ca.crt VALUE is the PUBLIC Vault server CA PEM (git-safe, NOT secret
            # material). Static embed — the SAME platform CA committed at
            # config/vault-ca-configmap.yaml (crossplane-system/vault-ca) and
            # arc/platform-ca-configmap.yaml; keep all three in lockstep. If the Vault
            # server CA is rotated (vault-server-tls regenerated) these go stale until
            # re-synced. Rotation-proof auto-distribution (cert-manager trust-manager
            # Bundle, or provider-kubernetes patchesFrom crossplane-system/vault-ca) is
            # the documented post-demo TODO.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-vault-ca-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: vault-ca
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/component: tenant
                  data:
                    ca.crt: |
                      -----BEGIN CERTIFICATE-----
                      MIIBgjCCASigAwIBAgIUAd3DM9aqHXUp1CnmoNALdv4X4mcwCgYIKoZIzj0EAwIw
                      HzEdMBsGA1UEAxMUY2Fwc3RvbmUtcGxhdGZvcm0tY2EwHhcNMjYwNjE4MDMwNTM4
                      WhcNMzYwNjE1MDMwNTM4WjAfMR0wGwYDVQQDExRjYXBzdG9uZS1wbGF0Zm9ybS1j
                      YTBZMBMGByqGSM49AgEGCCqGSM49AwEHA0IABKkY0iZxKzIGcXu113AEsQwTVWVg
                      oK1KWF6iIg5QpV/1FXgklWR6np7CEqBnF7AQDmF4F2bY6IotsXHYmumxATajQjBA
                      MA4GA1UdDwEB/wQEAwICpDAPBgNVHRMBAf8EBTADAQH/MB0GA1UdDgQWBBS0asdw
                      cA3QqHVfPkvpXvl9uA9kWjAKBggqhkjOPQQDAgNIADBFAiBagX6h2+w0L4Z7+IYZ
                      i91CA/MNPWHfVR4w3tJ7GoayzwIhAL9aDIRHoM60FGhpF7b9JElBBuaJ93eRhCR2
                      fbbGD1Wk
                      -----END CERTIFICATE-----
            ---
            # Per-tenant namespaced SecretStore (ADR-030 isolation): tenant SA →
            # Vault role tenant-<team> scoped to secret/data/tenants/<team>/*.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-%s-secretstore" $team $e.name | quote }}
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-secretstore-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: SecretStore
                  metadata:
                    name: vault-tenant
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/component: tenant
                  spec:
                    provider:
                      vault:
                        server: "https://vault.vault.svc.cluster.local:8200"
                        path: "secret"
                        version: "v2"
                        caProvider:
                          type: ConfigMap
                          name: vault-ca
                          key: ca.crt
                        auth:
                          kubernetes:
                            mountPath: "kubernetes"
                            role: {{ printf "tenant-%s" $team | quote }}
                            serviceAccountRef:
                              name: eso-tenant
                              audiences: ["vault"]
            {{- /* CONSUMER ExternalSecrets (app-secrets, harbor-pull) are intentionally
                   NOT rendered here. They are owned by the APP OVERLAY (Backstage
                   fetch:template / M3 Secrets-UX for app-secrets; track-4
                   feat/eso-perteam-push for harbor-pull), so each object has exactly
                   ONE owner — this is what AVOIDS re-introducing the bug #3 dual-owner
                   race (the very bug ADR-031 eliminates). track-5 (this Composition)
                   owns the PRODUCER side only: it mints the robots and PushSecrets their
                   creds into Vault at track-4's committed paths (below), and owns the
                   platform ESO PLUMBING above (the vault-tenant SecretStore, the
                   vault-ca ConfigMap, the eso-tenant SA — all platform-owned per
                   external-secrets/README §6). The app-overlay ExternalSecrets then read
                   Vault and materialize app-secrets + the harbor-pull dockerconfigjson. */}}
            {{- end }}

            {{- /* =====================================================================
                   ENV + PREVIEW ApplicationSets (via provider-kubernetes Object).
                   Bug #4 (__PRNUM__) + bug #5: typed fields, no literal tokens. The env
                   ApplicationSet reads the app repo's promotion.yaml (ADR-008) — single
                   source of truth, unchanged.
                   ===================================================================== */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-appset-envs" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "k8s-appset-envs" }}
            spec:
              providerConfigRef:
                name: default
              # PROVISION-BEFORE-DEPLOY (reliability-first, user's checks→plan→apply→deploy
              # model). The env ApplicationSet is the thing that generates the workload
              # Applications — so it is NOT created until the tenant fence + secret plumbing
              # exist: the AppProject (else the App refs a missing project), the namespaces
              # (the deploy targets), the per-env SecretStores (so the app-overlay's
              # ExternalSecrets can resolve), and the Harbor robot→Vault PushSecrets (so the
              # pull cred is in Vault before the pod pulls → no ImagePullBackOff flap).
              # provider-kubernetes `dependsOn` blocks this Object's apply until each
              # referenced Object exists; ArgoCD's own retry/self-heal covers residual
              # readiness. (The XR's overall Ready, via function-auto-ready + the
              # DeriveFromObject readiness on these Objects, is the signal to gate on.)
              references:
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-appproject" $team | quote }}
                {{- range $e := $envs }}
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-%s-ns" $team $e.name | quote }}
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-%s-secretstore" $team $e.name | quote }}
                {{- end }}
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-harborpush" $team | quote }}
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-harborpull" $team | quote }}
              forProvider:
                manifest:
                  apiVersion: argoproj.io/v1alpha1
                  kind: ApplicationSet
                  metadata:
                    name: {{ printf "%s-envs" $team | quote }}
                    namespace: argocd
                    labels:
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/component: tenant
                  spec:
                    goTemplate: true
                    goTemplateOptions: ["missingkey=error"]
                    generators:
                      - matrix:
                          generators:
                            - list:
                                elements:
                                  - { env: dev }
                                  - { env: staging }
                                  - { env: prod }
                            - git:
                                repoURL: {{ $repoUrl | quote }}
                                revision: HEAD
                                files:
                                  - path: .devops/promotion.yaml
                    template:
                      metadata:
                        name: '{{ $team }}-{{ `{{.env}}` }}'
                        labels:
                          platform.capstone/team: {{ $team | quote }}
                          platform.capstone/semester: {{ $sem | quote }}
                          platform.capstone/env: '{{ `{{.env}}` }}'
                      spec:
                        project: {{ $team | quote }}
                        source:
                          repoURL: {{ $repoUrl | quote }}
                          targetRevision: HEAD
                          path: '{{ `{{ (index .environments .env).overlay }}` }}'
                        destination:
                          server: https://kubernetes.default.svc
                          namespace: '{{ $team }}-{{ `{{.env}}` }}'
                    templatePatch: |
                      {{ `{{- $gate := (index .environments .env).gate }}` }}
                      {{ `{{- if eq $gate "auto" }}` }}
                      spec:
                        syncPolicy:
                          automated: { prune: true, selfHeal: true }
                          syncOptions: ["CreateNamespace=false"]
                      {{ `{{- else }}` }}
                      spec:
                        syncPolicy:
                          syncOptions: ["CreateNamespace=false"]
                      {{ `{{- end }}` }}
            {{- if $preview }}
            ---
            # Preview ApplicationSet (security-gated — see tenants/_template/
            # applicationset-preview.yaml header). Only rendered when previewEnabled=true.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-appset-preview" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "k8s-appset-preview" }}
            spec:
              providerConfigRef:
                name: default
              # Same provision-before-deploy gate as the env ApplicationSet.
              references:
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-appproject" $team | quote }}
                {{- range $e := $envs }}
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-%s-secretstore" $team $e.name | quote }}
                {{- end }}
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-harborpull" $team | quote }}
              forProvider:
                manifest:
                  apiVersion: argoproj.io/v1alpha1
                  kind: ApplicationSet
                  metadata:
                    name: {{ printf "%s-preview" $team | quote }}
                    namespace: argocd
                    labels:
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/component: tenant
                  spec:
                    goTemplate: true
                    goTemplateOptions: ["missingkey=error"]
                    generators:
                      - pullRequest:
                          github:
                            owner: UA-MIS
                            repo: {{ $app | quote }}
                            appSecretName: argocd-repo-creds-uamis
                          requeueAfterSeconds: 120
                    template:
                      metadata:
                        name: '{{ $team }}-pr-{{ `{{.number}}` }}'
                        labels:
                          platform.capstone/team: {{ $team | quote }}
                          platform.capstone/semester: {{ $sem | quote }}
                          platform.capstone/env: preview
                      spec:
                        project: {{ $team | quote }}
                        source:
                          repoURL: {{ $repoUrl | quote }}
                          targetRevision: '{{ `{{.head_sha}}` }}'
                          path: .devops/chart/overlays/preview
                          kustomize:
                            namespace: '{{ $team }}-pr-{{ `{{.number}}` }}'
                            # MULTI-COMPONENT (track-6 / multicomp): per-PR image pinning is
                            # NOT done here. A repo may have N components (images named
                            # <appName>-<comp>, all under Harbor project <team> — the
                            # project-level robots already cover them); this Composition does
                            # NOT model components (XRD stays component-agnostic by design).
                            # The preview overlay loops `components` and the overlay+CI set
                            # each component's pull-<sha> tag at the PR head_sha this App reads
                            # (multicomp contract). A single-image kustomize `images:` override
                            # here would assume ONE image and break multi-component previews —
                            # so it is intentionally omitted. Single-component stays correct
                            # (its one overlay image is tagged the same way).
                        destination:
                          server: https://kubernetes.default.svc
                          namespace: '{{ $team }}-pr-{{ `{{.number}}` }}'
                        syncPolicy:
                          automated: { prune: true, selfHeal: true }
                          syncOptions: ["CreateNamespace=true"]
            {{- end }}

            {{- /* =====================================================================
                   HARBOR ROBOT → VAULT bridge (ESO PushSecret) — the PRODUCER side that
                   track-4 (feat/eso-perteam-push) explicitly delegated to track-5. The
                   robot creds captured in the RobotAccount connection secrets (in
                   crossplane-system, via writeConnectionSecretToRef) are pushed into
                   Vault at TRACK-4's COMMITTED PATHS, with KV fields `name` + `secret`
                   (external-secrets/README §7). track-4's app-overlay ExternalSecrets
                   then template these into the harbor-push / harbor-pull dockerconfigjson
                   — so SealedSecrets/kubeseal/TARGET-host are retired for robots (bug
                   #2/#3), with zero human seal/paste (the zero-touch end-state).
                   Rendered via provider-kubernetes Object so they land in crossplane-system
                   (next to the connection secrets a PushSecret must read from) and use the
                   `vault-push` writer SecretStore (config/vault-push-secretstore.yaml).
                   CONNECTION-SECRET KEYS (CRD-verified vs provider-harbor v0.1.1): upjet
                   publishes only the SENSITIVE robot token as `attribute.secret`.
                   `full_name` is NON-sensitive — it lives in status.atProvider.fullName,
                   NOT the connection secret — so a PushSecret referencing
                   `attribute.full_name` fails ("secret key attribute.full_name does not
                   exist"). The robot USERNAME is deterministic (`<project>+<robot>` =
                   `<team>+<team>-{push,pull}`), so it is NOT pushed here; track-4's
                   consumer derives it (it already has $team). We push only the token. */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-harborpush" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "push-harbor-push" }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1alpha1
                  kind: PushSecret
                  metadata:
                    name: {{ printf "%s-harbor-push" $team | quote }}
                    namespace: crossplane-system
                    labels:
                      platform.capstone/component: platform
                  spec:
                    refreshInterval: "1h"
                    secretStoreRefs:
                      - name: vault-push
                        kind: SecretStore
                    selector:
                      secret:
                        name: {{ printf "%s-harbor-push" $team | quote }}   # the RobotAccount connection secret
                    data:
                      # Only the SENSITIVE robot token is a connection-secret key
                      # (attribute.secret). Username is deterministic (<team>+<team>-push),
                      # derived by the consumer — see block header.
                      - match:
                          secretKey: "attribute.secret"
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/ci/harbor-push" $team | quote }}
                            property: secret
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-harborpull" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "push-harbor-pull" }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1alpha1
                  kind: PushSecret
                  metadata:
                    name: {{ printf "%s-harbor-pull" $team | quote }}
                    namespace: crossplane-system
                    labels:
                      platform.capstone/component: platform
                  spec:
                    refreshInterval: "1h"
                    secretStoreRefs:
                      - name: vault-push
                        kind: SecretStore
                    selector:
                      secret:
                        name: {{ printf "%s-harbor-pull" $team | quote }}
                    # The project-level pull robot is identical across envs; write it to
                    # each env path track-4 reads (tenants/<team>/<env>/harbor-pull).
                    data:
                      {{- range $e := $envs }}
                      # Only attribute.secret exists (the token); username is deterministic
                      # (<team>+<team>-pull), derived by the consumer — see block header.
                      - match:
                          secretKey: "attribute.secret"
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/%s/harbor-pull" $team $e.name | quote }}
                            property: secret
                      {{- end }}

            {{- /* =====================================================================
                   ARC PER-TEAM CI PUSH (finish-eso / track-4 PR #128, A1 model).
                   One gha-runner-scale-set per team (the container hook can't pick a
                   secret per-job → per-team scale-set, each mounting its OWN
                   harbor-push-<team>). Retires the shared harbor-push last-write-wins
                   hole. Rendered from platform-services/arc/per-team/*.template.yaml,
                   but ZERO-TOUCH: the push cred is materialized by ESO from Vault
                   (tenants/<team>/ci/harbor-push, populated by the PushSecret above) —
                   no `make harbor-push-robot` + seal. Shared (A1, provided by
                   finish-eso/operator in arc-runners): arc-github-app (ESO from
                   platform/arc/github-app), platform-ca, runner netpol.
                   ===================================================================== */}}
            ---
            # 1) The per-team container-hook ConfigMap. The scale-set points
            #    ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE here so build pods mount ONLY
            #    harbor-push-<team> (registry resolved in-cluster to Traefik to dodge the
            #    Cloudflare 100MB edge cap on image-layer push).
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-arc-hook-cm" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "arc-hook-cm" }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ printf "arc-hook-template-%s" $team | quote }}
                    namespace: arc-runners
                    labels:
                      platform.capstone/component: platform
                      platform.capstone/team: {{ $team | quote }}
                  data:
                    content: |
                      spec:
                        # ⚠ HARDCODED Traefik ClusterIP — keep in sync with the shared
                        # platform-services/arc/hook-template.yaml (single source).
                        hostAliases:
                          - ip: "10.97.22.53"
                            hostnames:
                              - {{ $registry }}
                        containers:
                          - name: "$job"
                            volumeMounts:
                              - name: harbor-push
                                mountPath: /kaniko/.docker
                                readOnly: true
                              - name: platform-ca
                                mountPath: /kaniko/ssl/certs/platform-ca.crt
                                subPath: ca.crt
                                readOnly: true
                        volumes:
                          - name: harbor-push
                            secret:
                              secretName: {{ printf "harbor-push-%s" $team | quote }}
                              optional: true
                              items:
                                - key: .dockerconfigjson
                                  path: config.json
                          - name: platform-ca
                            configMap:
                              name: platform-ca
                              optional: true
                              items:
                                - key: ca.crt
                                  path: ca.crt
            ---
            # 2) harbor-push-<team> imagePullSecret materialized by ESO from Vault — the
            #    zero-touch replacement for the sealed `make harbor-push-robot` output.
            #    Reads via the platform ClusterSecretStore (vault-backend) and templates
            #    dockerconfigjson from the name+secret the PushSecret wrote to Vault.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-arc-pushsecret-es" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "arc-pushsecret-es" }}
            spec:
              providerConfigRef:
                name: default
              references:
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-harborpush" $team | quote }}   # Vault populated first
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ printf "harbor-push-%s" $team | quote }}
                    namespace: arc-runners
                    labels:
                      platform.capstone/component: platform
                      platform.capstone/team: {{ $team | quote }}
                  spec:
                    refreshInterval: "1h"
                    secretStoreRef:
                      name: vault-backend
                      kind: ClusterSecretStore
                    target:
                      name: {{ printf "harbor-push-%s" $team | quote }}
                      creationPolicy: Owner
                      template:
                        type: kubernetes.io/dockerconfigjson
                        data:
                          .dockerconfigjson: |
                            {{ `{"auths":{"` }}{{ $registry }}{{ `":{"username":"{{ .name }}","password":"{{ .secret }}","auth":"{{ printf "%s:%s" .name .secret | b64enc }}"}}}` }}
                    data:
                      - secretKey: name
                        remoteRef:
                          key: {{ printf "tenants/%s/ci/harbor-push" $team | quote }}
                          property: name
                      - secretKey: secret
                        remoteRef:
                          key: {{ printf "tenants/%s/ci/harbor-push" $team | quote }}
                          property: secret
            ---
            # 3) The per-team runner scale-set (Helm gha-runner-scale-set @0.14.2).
            #    releaseName == the runs-on label (<team>-kaniko). Gated behind the hook
            #    ConfigMap + the push ExternalSecret so the runner only starts once its
            #    cred exists (provision-before-deploy for CI too).
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-arc-scaleset" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "arc-scaleset" }}
            spec:
              providerConfigRef:
                name: default
              references:
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-arc-hook-cm" $team | quote }}
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-arc-pushsecret-es" $team | quote }}
              forProvider:
                manifest:
                  apiVersion: argoproj.io/v1alpha1
                  kind: Application
                  metadata:
                    name: {{ printf "platform-arc-runner-%s" $team | quote }}
                    namespace: argocd
                    labels:
                      platform.capstone/component: platform
                      platform.capstone/team: {{ $team | quote }}
                    annotations:
                      argocd.argoproj.io/sync-wave: "1"
                    finalizers:
                      - resources-finalizer.argocd.argoproj.io
                  spec:
                    project: platform
                    source:
                      repoURL: ghcr.io/actions/actions-runner-controller-charts
                      chart: gha-runner-scale-set
                      targetRevision: 0.14.2
                      helm:
                        releaseName: {{ printf "%s-kaniko" $team | quote }}
                        values: |
                          githubConfigUrl: "https://github.com/UA-MIS"
                          githubConfigSecret: arc-github-app
                          controllerServiceAccount:
                            name: arc-gha-rs-controller
                            namespace: arc-system
                          minRunners: 0
                          maxRunners: 3
                          containerMode:
                            type: "kubernetes"
                            kubernetesModeWorkVolumeClaim:
                              accessModes: ["ReadWriteOnce"]
                              storageClassName: "ceph-block"
                              resources:
                                requests:
                                  storage: "5Gi"
                          template:
                            spec:
                              securityContext:
                                runAsNonRoot: true
                                runAsUser: 1001
                                fsGroup: 1001
                                seccompProfile:
                                  type: RuntimeDefault
                              containers:
                                - name: runner
                                  image: ghcr.io/actions/actions-runner:2.335.1
                                  command: ["/home/runner/run.sh"]
                                  securityContext:
                                    allowPrivilegeEscalation: false
                                    capabilities:
                                      drop: ["ALL"]
                                  env:
                                    - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
                                      value: /home/runner/pod-templates/hook-template.yaml
                                  volumeMounts:
                                    - name: hook-template
                                      mountPath: /home/runner/pod-templates
                                      readOnly: true
                                  resources:
                                    requests: { cpu: "250m", memory: "512Mi" }
                                    limits:   { cpu: "2",    memory: "2Gi" }
                              volumes:
                                - name: hook-template
                                  configMap:
                                    name: {{ printf "arc-hook-template-%s" $team | quote }}
                                    items:
                                      - key: content
                                        path: hook-template.yaml
                    destination:
                      server: https://kubernetes.default.svc
                      namespace: arc-runners
                    syncPolicy:
                      automated: { prune: true, selfHeal: true }
                      syncOptions: ["CreateNamespace=false", "ServerSideApply=true"]
                      retry:
                        limit: 5
                        backoff: { duration: 10s, factor: 2, maxDuration: 5m }

            {{- /* =====================================================================
                   DATABASE — automatic per-(team,env) MySQL provisioning (ADR-033).
                   GATED on the XR's `database` field: only rendered when == "mysql"
                   (the DB scaffolder templates set it; react-static leaves "none"). So
                   a DB-less app emits ZERO provider-sql resources — no idle Database,
                   no admin-cred reach for stacks that don't need a DB.

                   Per env (dev/staging/prod) we mint, on the off-cluster DB tier via
                   provider-sql (mysql.sql.crossplane.io), a:
                     • Database `<teamDb>_<env>`  (the schema)
                     • User     `<teamDb>_<env>`  (scoped login; password AUTO-GENERATED
                                                   by provider-sql — never templated, so
                                                   no per-reconcile churn; same reliability
                                                   rationale as the Harbor robot Variant-2)
                     • Grant    ALL on that schema to that user (the tenant owns its own DB)
                   The User's connection secret (crossplane-system, via
                   writeConnectionSecretToRef) carries the generated password; an ESO
                   PushSecret bridges it into Vault at the SAME leaf track-4's app
                   ExternalSecret reads — tenants/<team>/<env>/database (ADR-033 contract).

                   ⚠ external-name = the actual MySQL identifier. In a Composition the
                   composed MR's metadata.name is auto-generated, so we PIN
                   crossplane.io/external-name to make the schema/username deterministic
                   (the consumer assembles DATABASE_URL from a fixed `<teamDb>_<env>`).

                   ⚠ Phase-0 (DB tier not live, PR #29): confirm against provider-sql
                   v0.15.0 CRDs — (a) Database/User/Grant group mysql.sql.crossplane.io/
                   v1alpha1; (b) the User connection-secret KEY NAMES (provider-sql
                   publishes username/password/endpoint/port for User; host/port/username/
                   password/database for Database — we map endpoint->host below); (c) that
                   the captured password does NOT diff on steady-state reconcile.
                   ===================================================================== */}}
            {{- if eq $database "mysql" }}
            {{- range $e := $envs }}
            {{- $dbName := printf "%s_%s" $teamDb $e.name }}
            {{- $connSecret := printf "%s-%s-db" $team $e.name }}
            ---
            # The per-env schema.
            apiVersion: mysql.sql.crossplane.io/v1alpha1
            kind: Database
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "sql-db-%s" $e.name) }}
                crossplane.io/external-name: {{ $dbName | quote }}
            spec:
              forProvider:
                defaultCharacterSet: utf8mb4
                defaultCollation: utf8mb4_unicode_ci
              providerConfigRef:
                name: db-tier-mariadb
            ---
            # The per-env scoped login. No passwordSecretRef -> provider-sql generates
            # the password and writes it (plus username/endpoint/port) to the connection
            # secret in crossplane-system. STABLE across reconciles (generated once).
            apiVersion: mysql.sql.crossplane.io/v1alpha1
            kind: User
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "sql-user-%s" $e.name) }}
                crossplane.io/external-name: {{ $dbName | quote }}
            spec:
              forProvider: {}
              writeConnectionSecretToRef:
                namespace: crossplane-system
                name: {{ $connSecret | quote }}
              providerConfigRef:
                name: db-tier-mariadb
            ---
            # ALL privileges on the tenant's own schema (the team owns its DB). user +
            # database reference the DB-level names (the external-names pinned above).
            apiVersion: mysql.sql.crossplane.io/v1alpha1
            kind: Grant
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "sql-grant-%s" $e.name) }}
            spec:
              forProvider:
                user: {{ $dbName | quote }}
                database: {{ $dbName | quote }}
                privileges:
                  - ALL
              providerConfigRef:
                name: db-tier-mariadb
            ---
            # Bridge the generated DB creds into Vault at the ADR-033 contract path
            # tenants/<team>/<env>/database (properties: username, password, host, port).
            # The app's DATABASE_URL ExternalSecret (DB template, track-4) reads these and
            # assembles mysql://<user>:<pass>@<host>:<port>/<teamDb>_<env> via target.template
            # — the dbname follows the fixed rule (NOT pushed; it is structural, not secret).
            # Rendered via provider-kubernetes Object so it lands in crossplane-system next
            # to the connection secret, and uses the platform `vault-push` writer SecretStore
            # (config/vault-push-secretstore.yaml) — the SAME producer plane as the Harbor
            # robot PushSecrets. ONE writer per Vault leaf (no dual-owner clobber).
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-%s-db-push" $team $e.name | quote }}
              annotations:
                {{ setResourceNameAnnotation (printf "push-db-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1alpha1
                  kind: PushSecret
                  metadata:
                    name: {{ printf "%s-%s-db" $team $e.name | quote }}
                    namespace: crossplane-system
                    labels:
                      platform.capstone/component: platform
                      platform.capstone/team: {{ $team | quote }}
                  spec:
                    refreshInterval: "1h"
                    secretStoreRefs:
                      - name: vault-push
                        kind: SecretStore
                    selector:
                      secret:
                        name: {{ $connSecret | quote }}   # provider-sql User connection secret
                    data:
                      - match:
                          secretKey: username
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                            property: username
                      - match:
                          secretKey: password
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                            property: password
                      # provider-sql publishes the server as `endpoint` -> store as `host`.
                      - match:
                          secretKey: endpoint
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                            property: host
                      - match:
                          secretKey: port
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                            property: port
            {{- /* =====================================================================
                   ADMINER CONSOLE (MySQL) — self-service SQL access, tenant-db-access
                   design (artifacts/research/tenant-db-access.md §3/§4/§7). ONE Adminer
                   pod per (team,env), living IN the team's own namespace, SSO-gated via
                   the shared oauth2-proxy (platform-services/db-console-auth/) + a
                   per-(team,env) Traefik Middleware carrying `?allowed_groups=UA-MIS:<team>`.
                   No password ever typed: dockette/adminer's Autologin plugin
                   (ADMINER_PLUGIN_AUTOLOGIN=1 + ADMINER_AUTOLOGIN_SERVER=<dsn>) reads a
                   server-side-only DSN assembled from the SAME Vault leaf the app's
                   DATABASE_URL ExternalSecret reads (tenants/<team>/<env>/database) —
                   the console is a SECOND consumer of that leaf, not a new producer (no
                   dual-owner risk). DSN driver token is `server` for MySQL/MariaDB (per
                   the Adminer plugin's own doc comment: "the driver for MySQL is called
                   'server'" — verified against vrana/adminer's login-servers.php AND
                   dockette/adminer's shipped autologin plugin source).
                   ⚠ Same un-escaped-DSN-interpolation posture as the existing
                   DATABASE_URL assembly (_fragments/_contract/.../database.externalsecret.yaml)
                   — a generated password containing `@`/`:`/`/` would break the DSN
                   parse. Accepted as the SAME pre-existing platform-wide risk class (ESO
                   templates have no bundled URL-encode function; provider-sql's
                   generated passwords are the same ones the app's own DATABASE_URL
                   already assembles this way), not a new one introduced here.
                   ===================================================================== */}}
            {{- $ns := printf "%s-%s" $team $e.name }}
            ---
            # ExternalSecret: assembles ADMINER_AUTOLOGIN_SERVER from the SAME Vault leaf
            # the app's DATABASE_URL ExternalSecret reads. Depends on the db-push Object
            # above so it doesn't spin on a not-yet-populated Vault leaf on first apply
            # (provision-before-deploy, same pattern as the ARC push ExternalSecret).
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-%s-dbconsole-es" $team $e.name | quote }}
              annotations:
                {{ setResourceNameAnnotation (printf "dbconsole-es-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              references:
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-%s-db-push" $team $e.name | quote }}
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: db-console
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                  spec:
                    refreshInterval: "1h"
                    secretStoreRef:
                      name: vault-tenant
                      kind: SecretStore
                    target:
                      name: db-console
                      creationPolicy: Owner
                      deletionPolicy: Delete
                      template:
                        engineVersion: v2
                        data:
                          ADMINER_AUTOLOGIN_SERVER: "server://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@{{ `{{ .host }}` }}:{{ `{{ .port }}` }}/{{ $dbName }}"
                    data:
                      - secretKey: username
                        remoteRef:
                          key: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                          property: username
                      - secretKey: password
                        remoteRef:
                          key: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                          property: password
                      - secretKey: host
                        remoteRef:
                          key: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                          property: host
                      - secretKey: port
                        remoteRef:
                          key: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                          property: port
            ---
            # Deployment: dockette/adminer:mysql (9MB, MySQL/MariaDB-only variant — no
            # dead weight from the other engines). No USER in the upstream Dockerfile
            # (runs root by default) -> pinned to a non-root UID here; PORT overridden off
            # 80 (privileged) since the pod runs non-root. readOnlyRootFilesystem is
            # DELIBERATELY NOT set: entrypoint.sh `cp`s the activated plugin into
            # /srv/adminer-plugins/ at container start, which a read-only root fs would
            # break — PSA `restricted` does not require readOnlyRootFilesystem, only the
            # fields actually set below.
            # ⚠ RUNTIME FIX (verified against the live crash): /srv/adminer-plugins/ is
            # baked into the image root:root 0755 — even with a writable root fs, UID
            # 1000 still can't `cp` into it (CrashLoopBackOff: "Permission denied").
            # `entrypoint.sh` only ever COPIES INTO this dir (source is the read-only
            # /srv/plugins-available/, left untouched), so shadowing it with an emptyDir
            # is safe and loses no baked-in content (confirmed empty upstream). fsGroup
            # 1000 below makes the kubelet-provisioned emptyDir group-owned+writable by
            # UID 1000's supplemental group, so the `cp` now succeeds.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-%s-dbconsole-deploy" $team $e.name | quote }}
              annotations:
                {{ setResourceNameAnnotation (printf "dbconsole-deploy-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              # provider-kubernetes Object has no `.metadata.references` field (server
              # dry-run rejects it — this is the #281/#283 bug); dependsOn belongs under
              # `spec.references`, same as every other cross-Object dependency in this
              # file (see e.g. the k8s-appset-envs / harborpush-es patterns above).
              references:
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-%s-dbconsole-es" $team $e.name | quote }}
              forProvider:
                manifest:
                  apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: db-console
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                      app.kubernetes.io/name: db-console
                  spec:
                    replicas: 1
                    selector:
                      matchLabels:
                        app.kubernetes.io/name: db-console
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/name: db-console
                          platform.capstone/team: {{ $team | quote }}
                          platform.capstone/env: {{ $e.name | quote }}
                      spec:
                        containers:
                          - name: adminer
                            image: dockette/adminer:mysql
                            imagePullPolicy: IfNotPresent
                            env:
                              - name: ADMINER_PLUGIN_AUTOLOGIN
                                value: "1"
                              - name: PORT
                                value: "8080"
                              - name: ADMINER_BANNER
                                value: "0"
                              - name: ADMINER_AUTOLOGIN_SERVER
                                valueFrom:
                                  secretKeyRef:
                                    name: db-console
                                    key: ADMINER_AUTOLOGIN_SERVER
                            ports:
                              - containerPort: 8080
                            resources:
                              requests: { cpu: "10m", memory: "32Mi" }
                              limits: { memory: "64Mi" }
                            securityContext:
                              allowPrivilegeEscalation: false
                              runAsNonRoot: true
                              runAsUser: 1000
                              capabilities:
                                drop: ["ALL"]
                              seccompProfile:
                                type: RuntimeDefault
                            volumeMounts:
                              - name: adminer-plugins
                                mountPath: /srv/adminer-plugins
                        volumes:
                          - name: adminer-plugins
                            emptyDir: {}
                        securityContext:
                          fsGroup: 1000
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "dbconsole-svc-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: db-console
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                  spec:
                    selector:
                      app.kubernetes.io/name: db-console
                    ports:
                      - port: 80
                        targetPort: 8080
            ---
            # Traefik forwardAuth Middleware — the ONLY per-(team,env) object in the whole
            # auth chain (§3.2 option D). Calls the ONE shared oauth2-proxy's /oauth2/auth
            # with THIS team's allowed_groups, so no shared config (Dex, oauth2-proxy) is
            # ever touched at onboarding.
            # ⚠ NOT added to the AppProject's namespaceResourceWhitelist above: that
            # whitelist gates what the TEAM'S OWN ArgoCD Application (their app repo's
            # .devops/chart overlay) may create — it does NOT gate this Object, which
            # provider-kubernetes applies directly (a separate control plane, its own
            # ProviderConfig, no ArgoCD sync involved). Same reasoning already applies to
            # every other Crossplane-only kind here that was NEVER whitelisted (RoleBinding,
            # NetworkPolicy, the vault-ca ConfigMap, the eso-tenant ServiceAccount,
            # vault-tenant SecretStore) — the ESO kinds ARE whitelisted above for a
            # DIFFERENT reason (the app's OWN .devops/chart overlay also renders an
            # ExternalSecret/SecretStore — that copy IS ArgoCD-synced under this
            # AppProject, unlike this one).
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "dbconsole-mw-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: traefik.io/v1alpha1
                  kind: Middleware
                  metadata:
                    name: db-console-auth
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                  spec:
                    forwardAuth:
                      address: {{ printf "http://oauth2-proxy.db-console-auth.svc.cluster.local:4180/oauth2/auth?allowed_groups=UA-MIS:%s" $team | quote }}
                      trustForwardHeader: true
                      authResponseHeaders:
                        - X-Auth-Request-User
                        - X-Auth-Request-Email
                        - X-Auth-Request-Groups
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "dbconsole-ing-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: Ingress
                  metadata:
                    name: db-console
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                    annotations:
                      # Chain order matters: Traefik applies middlewares in list order,
                      # each wrapping the next, so the `errors` middleware (outermost)
                      # must be listed BEFORE the forwardAuth middleware (innermost) to
                      # catch the 401 it returns and rewrite it to a 302 login redirect.
                      # Cross-namespace ref requires providers.kubernetesCRD.
                      # allowCrossNamespace (applicationsets/traefik-app.yaml).
                      traefik.ingress.kubernetes.io/router.middlewares: {{ printf "db-console-auth-oauth2-proxy-errors@kubernetescrd,%s-db-console-auth@kubernetescrd" $ns | quote }}
                  spec:
                    rules:
                      - host: {{ printf "%s-%s-db.%s" $team $e.name $domain | quote }}
                        http:
                          paths:
                            - path: /
                              pathType: Prefix
                              backend:
                                service:
                                  name: db-console
                                  port:
                                    number: 80
                    tls:
                      - hosts:
                          - {{ printf "%s-%s-db.%s" $team $e.name $domain | quote }}
            {{- end }}
            {{- end }}

            {{- /* =====================================================================
                   DATABASE — automatic per-(team,env) POSTGRES provisioning (ADR-033).
                   The exact structural mirror of the MySQL block above, gated on
                   `database == "postgres"` (mutually exclusive with mysql — the XRD enum
                   is a single value, so at most ONE of the two blocks ever renders; no
                   Vault-leaf or connection-secret collision). Runs against the SAME
                   off-cluster DB tier box (ua-mis-db-1 also runs PG17) via a SECOND
                   provider-sql ProviderConfig `db-tier-postgres` (config/
                   providerconfig-postgres.yaml). provider-sql is one provider that speaks
                   both engines — same controller pod, so the crossplane-db egress netpol
                   (hardening/netpol-controlplane/crossplane-db-cnp.yaml) covers it (it now
                   allows TCP/5432 as well as 3306).

                   Per env we mint, on postgresql.sql.crossplane.io/v1alpha1:
                     • Database `<teamDb>_<env>`  owned BY the tenant Role (the team owns
                                                   its own DB, PG-idiomatic — the owner has
                                                   full control incl. schema creation)
                     • Role     `<teamDb>_<env>`  LOGIN role; password AUTO-GENERATED by
                                                   provider-sql (never templated → no per-
                                                   reconcile churn; same reliability
                                                   rationale as the MySQL User / Harbor
                                                   robot Variant-2)
                     • Grant    CONNECT+CREATE+TEMPORARY on that DB to that Role (explicit
                                                   database-level ALL; mirrors the MySQL
                                                   `Grant: ALL`)
                   The Role's connection secret (crossplane-system, writeConnectionSecret-
                   ToRef) carries the generated password; an ESO PushSecret bridges the
                   SAME four parts (username/password/host/port) into Vault at the SAME
                   ADR-033 leaf the MySQL block uses — tenants/<team>/<env>/database — so
                   the consumer DATABASE_URL ExternalSecret is engine-agnostic (it only
                   swaps the DSN scheme to postgresql://). dbname = the fixed structural
                   rule `<teamDb>_<env>` (pinned via crossplane.io/external-name), NOT
                   stored in Vault.

                   ⚠ Phase-0 (DB tier not live, PR #29): confirm against provider-sql
                   v0.15.0 CRDs — (a) group postgresql.sql.crossplane.io/v1alpha1 for
                   Database/Role/Grant; (b) the Role connection-secret KEY NAMES (assumed
                   username/password/endpoint/port as for the MySQL User — endpoint mapped
                   to `host` below); (c) that the captured password does NOT diff on
                   steady-state reconcile; (d) ORDERING — Database.owner references the
                   Role, which may not exist on the first reconcile; Crossplane retries so
                   it converges, but verify no permanent error; (e) the provisioner login
                   needs CREATEDB + CREATEROLE (so it can create the DB, the role, AND
                   assign the DB's ownership to that role — CREATEROLE auto-grants
                   membership); (f) REDUNDANCY — since the Role OWNS the DB it already
                   holds these privileges, so the Grant may reconcile to a no-op; if it
                   ever shows a perpetual diff, drop it (owner alone suffices). (g) PG15+
                   locks down the `public` schema (no implicit CREATE for non-owners); the
                   role owning the DATABASE does not by itself own `public`. If apps write
                   to `public`, a follow-up may need a schema-level Grant or
                   `ALTER SCHEMA public OWNER TO <role>` — track at go-live.
                   ===================================================================== */}}
            {{- if eq $database "postgres" }}
            {{- range $e := $envs }}
            {{- $dbName := printf "%s_%s" $teamDb $e.name }}
            {{- $connSecret := printf "%s-%s-db" $team $e.name }}
            ---
            # The per-env login Role. No passwordSecretRef -> provider-sql generates the
            # password and writes it (plus username/endpoint/port) to the connection
            # secret in crossplane-system. STABLE across reconciles (generated once).
            apiVersion: postgresql.sql.crossplane.io/v1alpha1
            kind: Role
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "sql-role-%s" $e.name) }}
                crossplane.io/external-name: {{ $dbName | quote }}
            spec:
              forProvider:
                privileges:
                  login: true          # a plain connectable app login — NOT createdb/createrole/superuser
              writeConnectionSecretToRef:
                namespace: crossplane-system
                name: {{ $connSecret | quote }}
              providerConfigRef:
                name: db-tier-postgres
            ---
            # The per-env database, OWNED by the tenant Role (team owns its own DB).
            apiVersion: postgresql.sql.crossplane.io/v1alpha1
            kind: Database
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "sql-db-%s" $e.name) }}
                crossplane.io/external-name: {{ $dbName | quote }}
            spec:
              forProvider:
                owner: {{ $dbName | quote }}     # the Role above (name == dbName)
                encoding: UTF8
              providerConfigRef:
                name: db-tier-postgres
            ---
            # Explicit database-level privileges to the tenant Role (mirrors the MySQL
            # `Grant: ALL`). CONNECT+CREATE+TEMPORARY is database-level ALL in Postgres.
            apiVersion: postgresql.sql.crossplane.io/v1alpha1
            kind: Grant
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "sql-grant-%s" $e.name) }}
            spec:
              forProvider:
                role: {{ $dbName | quote }}
                database: {{ $dbName | quote }}
                privileges:
                  - CONNECT
                  - CREATE
                  - TEMPORARY
              providerConfigRef:
                name: db-tier-postgres
            ---
            # Bridge the generated DB creds into Vault at the ADR-033 contract path
            # tenants/<team>/<env>/database (properties: username, password, host, port) —
            # the SAME leaf + property names the MySQL block writes, so track-4's DATABASE_URL
            # ExternalSecret reads them identically (only its DSN scheme differs). Rendered
            # via provider-kubernetes Object into crossplane-system (next to the connection
            # secret) using the platform `vault-push` writer SecretStore. ONE writer per
            # Vault leaf (mysql/postgres are mutually exclusive → no dual-owner clobber).
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-%s-db-push" $team $e.name | quote }}
              annotations:
                {{ setResourceNameAnnotation (printf "push-db-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1alpha1
                  kind: PushSecret
                  metadata:
                    name: {{ printf "%s-%s-db" $team $e.name | quote }}
                    namespace: crossplane-system
                    labels:
                      platform.capstone/component: platform
                      platform.capstone/team: {{ $team | quote }}
                  spec:
                    refreshInterval: "1h"
                    secretStoreRefs:
                      - name: vault-push
                        kind: SecretStore
                    selector:
                      secret:
                        name: {{ $connSecret | quote }}   # provider-sql Role connection secret
                    data:
                      - match:
                          secretKey: username
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                            property: username
                      - match:
                          secretKey: password
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                            property: password
                      # provider-sql publishes the server as `endpoint` -> store as `host`.
                      - match:
                          secretKey: endpoint
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                            property: host
                      - match:
                          secretKey: port
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                            property: port
            {{- /* =====================================================================
                   ADMINER CONSOLE (Postgres) — structural mirror of the MySQL block
                   above (see its header comment for the full design rationale). Driver
                   token is `pgsql` (not `postgres`/`postgresql`) — the Adminer plugin's
                   own DSN convention (dockette/adminer's shipped autologin plugin
                   examples: `pgsql://postgres:pwd@pg:5432/app`). Image is
                   dockette/adminer:pgsql (8MB, Postgres-only variant).
                   ===================================================================== */}}
            {{- $ns := printf "%s-%s" $team $e.name }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-%s-dbconsole-es" $team $e.name | quote }}
              annotations:
                {{ setResourceNameAnnotation (printf "dbconsole-es-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              references:
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-%s-db-push" $team $e.name | quote }}
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: db-console
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                  spec:
                    refreshInterval: "1h"
                    secretStoreRef:
                      name: vault-tenant
                      kind: SecretStore
                    target:
                      name: db-console
                      creationPolicy: Owner
                      deletionPolicy: Delete
                      template:
                        engineVersion: v2
                        data:
                          ADMINER_AUTOLOGIN_SERVER: "pgsql://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@{{ `{{ .host }}` }}:{{ `{{ .port }}` }}/{{ $dbName }}"
                    data:
                      - secretKey: username
                        remoteRef:
                          key: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                          property: username
                      - secretKey: password
                        remoteRef:
                          key: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                          property: password
                      - secretKey: host
                        remoteRef:
                          key: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                          property: host
                      - secretKey: port
                        remoteRef:
                          key: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                          property: port
            ---
            # ⚠ RUNTIME FIX (same as the MySQL block above): /srv/adminer-plugins/ is
            # baked into the image root:root 0755 — even with a writable root fs, UID
            # 1000 can't `cp` into it. entrypoint.sh only ever COPIES INTO this dir (the
            # source, /srv/plugins-available/, is untouched), so an emptyDir here is
            # safe. fsGroup 1000 below makes it group-writable by UID 1000.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-%s-dbconsole-deploy" $team $e.name | quote }}
              annotations:
                {{ setResourceNameAnnotation (printf "dbconsole-deploy-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              # provider-kubernetes Object has no `.metadata.references` field (server
              # dry-run rejects it — this is the #281/#283 bug); dependsOn belongs under
              # `spec.references`, same as every other cross-Object dependency in this
              # file (see e.g. the k8s-appset-envs / harborpush-es patterns above).
              references:
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-%s-dbconsole-es" $team $e.name | quote }}
              forProvider:
                manifest:
                  apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: db-console
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                      app.kubernetes.io/name: db-console
                  spec:
                    replicas: 1
                    selector:
                      matchLabels:
                        app.kubernetes.io/name: db-console
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/name: db-console
                          platform.capstone/team: {{ $team | quote }}
                          platform.capstone/env: {{ $e.name | quote }}
                      spec:
                        containers:
                          - name: adminer
                            image: dockette/adminer:pgsql
                            imagePullPolicy: IfNotPresent
                            env:
                              - name: ADMINER_PLUGIN_AUTOLOGIN
                                value: "1"
                              - name: PORT
                                value: "8080"
                              - name: ADMINER_BANNER
                                value: "0"
                              - name: ADMINER_AUTOLOGIN_SERVER
                                valueFrom:
                                  secretKeyRef:
                                    name: db-console
                                    key: ADMINER_AUTOLOGIN_SERVER
                            ports:
                              - containerPort: 8080
                            resources:
                              requests: { cpu: "10m", memory: "32Mi" }
                              limits: { memory: "64Mi" }
                            securityContext:
                              allowPrivilegeEscalation: false
                              runAsNonRoot: true
                              runAsUser: 1000
                              capabilities:
                                drop: ["ALL"]
                              seccompProfile:
                                type: RuntimeDefault
                            volumeMounts:
                              - name: adminer-plugins
                                mountPath: /srv/adminer-plugins
                        volumes:
                          - name: adminer-plugins
                            emptyDir: {}
                        securityContext:
                          fsGroup: 1000
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "dbconsole-svc-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: db-console
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                  spec:
                    selector:
                      app.kubernetes.io/name: db-console
                    ports:
                      - port: 80
                        targetPort: 8080
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "dbconsole-mw-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: traefik.io/v1alpha1
                  kind: Middleware
                  metadata:
                    name: db-console-auth
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                  spec:
                    forwardAuth:
                      address: {{ printf "http://oauth2-proxy.db-console-auth.svc.cluster.local:4180/oauth2/auth?allowed_groups=UA-MIS:%s" $team | quote }}
                      trustForwardHeader: true
                      authResponseHeaders:
                        - X-Auth-Request-User
                        - X-Auth-Request-Email
                        - X-Auth-Request-Groups
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "dbconsole-ing-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: Ingress
                  metadata:
                    name: db-console
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                    annotations:
                      # Chain order matters: Traefik applies middlewares in list order,
                      # each wrapping the next, so the `errors` middleware (outermost)
                      # must be listed BEFORE the forwardAuth middleware (innermost) to
                      # catch the 401 it returns and rewrite it to a 302 login redirect.
                      # Cross-namespace ref requires providers.kubernetesCRD.
                      # allowCrossNamespace (applicationsets/traefik-app.yaml).
                      traefik.ingress.kubernetes.io/router.middlewares: {{ printf "db-console-auth-oauth2-proxy-errors@kubernetescrd,%s-db-console-auth@kubernetescrd" $ns | quote }}
                  spec:
                    rules:
                      - host: {{ printf "%s-%s-db.%s" $team $e.name $domain | quote }}
                        http:
                          paths:
                            - path: /
                              pathType: Prefix
                              backend:
                                service:
                                  name: db-console
                                  port:
                                    number: 80
                    tls:
                      - hosts:
                          - {{ printf "%s-%s-db.%s" $team $e.name $domain | quote }}
            {{- end }}
            {{- end }}

            {{- /* =====================================================================
                   STATUS — surface the derived repo + Harbor project on the XR.
                   ===================================================================== */}}
            ---
            apiVersion: platform.capstone.uamishub.com/v1alpha1
            kind: CapstoneTenant
            status:
              repoUrl: {{ $repoUrl | quote }}
              harborProject: {{ $team | quote }}
              dbConsoleUrl: {{ if ne $database "none" }}{{ printf "https://%s-dev-db.%s" $team $domain | quote }}{{ else }}""{{ end }}
    # ------------------------------------------------------------------------
    - step: ready
      functionRef:
        name: function-auto-ready
