# ============================================================================
# CapstoneTenant Composition — THE REVIEWED-ONCE EXPANSION (ADR-031 §4).
# ============================================================================
# `mode: Pipeline` with function-go-templating: reads the ONE CapstoneTenant XR and
# renders EVERY downstream managed resource, doing the substitution that imperative
# `sed`+`make` used to do — but type-checked, reconciling, and drift-correcting.
# function-auto-ready then marks the XR Ready when its composed resources are Ready.
#
# This file IS the blast radius the one-time SRE review scrutinizes (with
# rbac/provider-kubernetes-rbac.yaml). Read the bug→declarative mapping in the
# crossplane README alongside it — each section below is annotated with the
# v1check-era onboarding bug(s) it structurally eliminates.
#
# ⚠ Provider MR apiVersions: the github/harbor/vault MR groups below are pinned to
# the providers in providers/. provider-vault (v0.1.0) + provider-harbor (v0.1.1)
# are early — the SRE confirms the exact group/kind against the installed CRDs at
# Phase-0 apply (notes inline). The k8s tenancy objects (rendered via
# provider-kubernetes Object) are stable and mirror tenants/_template/ verbatim.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: capstonetenant
  labels:
    platform.capstone/component: platform
spec:
  compositeTypeRef:
    apiVersion: platform.capstone.uamishub.com/v1alpha1
    kind: CapstoneTenant
  mode: Pipeline
  pipeline:
    # ------------------------------------------------------------------------
    - step: render-tenant
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        options: ["missingkey=error"]
        inline:
          template: |
            {{- $spec := .observed.composite.resource.spec }}
            {{- $team := $spec.team }}
            {{- $app := $spec.appName }}
            {{- $sem := $spec.semester }}
            {{- $ghTeam := $spec.githubTeam | default $team }}
            {{- $port := $spec.port | default 8080 }}
            {{- $domain := $spec.domain | default "capstone.uamishub.com" }}
            {{- $preview := $spec.previewEnabled | default false }}
            {{- $database := $spec.database | default "none" }}
            {{- /* MySQL identifiers from the team slug: hyphens -> underscores, since
                   `<team>_<env>` becomes a MariaDB schema + username (ADR-033). */}}
            {{- $teamDb := $team | replace "-" "_" }}
            {{- $registry := printf "harbor.%s" $domain }}
            {{- /* Harbor robot LOGIN usernames are deterministic: `robot$<project>+<name>`
                   = `robot$<team>+<team>-{push,pull}` (project == team). Known at render
                   time, so the arc push imagePullSecret templates the username STATICALLY
                   and only reads the token (`secret`) from Vault — the robot connection
                   secret publishes ONLY `attribute.secret`, never a name, so there is no
                   Vault `name` to read (that gap 401'd brand-new tenants). */}}
            {{- $robotPushUser := printf "robot$%s+%s-push" $team $team }}
            {{- $repoUrl := printf "https://github.com/UA-MIS/%s" $app }}
            {{- $infraUrl := "https://github.com/UA-MIS/platform-infra" }}
            {{- /* env quota tiers — dev/staging modest, prod higher.
                   ⚠ MUST STAY IN SYNC with tenants/_template/namespaces/{dev,staging,prod}.yaml.
                   Both are LIVE tenant-creation paths (this Composition serves the
                   CapstoneTenant claim path; the blueprint is rendered into
                   tenants/team-<name>/ by the Backstage new-capstone-project wizard),
                   and nothing references the other — alignment is manual only.
                   These HAD drifted: prod here was cpu 4/8 + pods 20 while the blueprint
                   still said cpu 2/4 + pods 15, so a team's prod ceiling depended on which
                   onboarding path created it. Realigned 2026-08-15 (health audit / B5);
                   the blueprint was moved UP to these values. Change BOTH or neither. */}}
            {{- $envs := list
                  (dict "name" "dev"     "cpuReq" "2" "memReq" "2Gi" "cpuLim" "4" "memLim" "4Gi"  "pods" "10" "storageReq" "5Gi"  "pvcs" "4")
                  (dict "name" "staging" "cpuReq" "2" "memReq" "2Gi" "cpuLim" "4" "memLim" "4Gi"  "pods" "10" "storageReq" "5Gi"  "pvcs" "4")
                  (dict "name" "prod"    "cpuReq" "4" "memReq" "4Gi" "cpuLim" "8" "memLim" "8Gi"  "pods" "20" "storageReq" "20Gi" "pvcs" "6") }}

            {{- /* =====================================================================
                   GITHUB — DELIBERATELY EMPTY (ADR-035 §D2, human-approved).
                   The SCAFFOLDER owns the code repo end-to-end; the claim owns only
                   platform tenancy. The zero-touch wizard's `publish:github` step
                   (new-capstone-project-zerotouch/template.yaml) creates UA-MIS/<app>,
                   pushes the COMPOSED FRAGMENT skeleton the student chose, protects
                   `main` (protectDefaultBranch: true), grants the team push
                   (collaborators), and ships CI via the skeleton's thin caller
                   (.github/workflows/build-and-push.yaml → tenant-build.yaml@v1).
                   This Composition previously ALSO created the repo bootstrapped from
                   capstone-app-template + BranchProtection + TeamRepository + a ci.yaml
                   RepositoryFile — a repo-ownership COLLISION that would clobber the
                   student's fragment code with the template bootstrap and defeat the
                   wizard. All four GitHub MRs are dropped: NO Repository / no template
                   bootstrap / no BranchProtection / no TeamRepository / no RepositoryFile.
                   Blast-radius win: the auto-committed claim no longer needs org-admin
                   repo-create. See §D2 rejected alternatives. $repoUrl (above) is
                   retained — the AppProject sourceRepos still references the (now
                   scaffolder-created) repo; the Composition observes it, never seeds it.
                   ===================================================================== */}}

            {{- /* =====================================================================
                   HARBOR — project + push/pull robots (provider-harbor, the spike path).
                   Bug #1 (project missing): Project MR, reconciled. Bug #2 (shared
                   harbor-push collision): per-team push RobotAccount. Bug #10/#11
                   (curl-Job rootfs / legacy API): no Job — the provider speaks the
                   unified API. Robot tokens land in connection secrets (writeConnection
                   SecretToRef) → bridged to Vault by the PushSecrets below.

                   ROBOT-SECRET RECONCILE-STABILITY — VARIANT 2 LOCKED (reliability-first).
                   We let Harbor GENERATE the token (do NOT supply `secret`) and capture it
                   from the connection secret. This is STABLE ACROSS RECONCILES: the Harbor
                   API does not return the robot secret on read, so Upjet/Terraform keep the
                   value in state — it is Computed-ONCE and persists; there is NO regen on
                   steady-state reconcile (confirmed via the TF provider's read behavior).
                   Regeneration happens ONLY on REPLACEMENT-forcing changes, which are not
                   reconciles: editing `permissions` (goharbor TF #140), a prefix plus-sign
                   (#479), or import (#447). So: DO NOT churn the `permissions`/`name` below
                   post-onboarding (a Composition edit to them would replace every tenant's
                   robot → one-time re-pull); greenfield only (no import). `duration: -1`
                   (non-expiring) avoids expiry-driven change.
                   Variant 1 (SUPPLY the secret) was REJECTED: in a stateless go-template
                   Composition a supplied value must be generated each render (sprig
                   randAlphaNum) → churns every reconcile; and supplying the plain `secret`
                   field risks a perpetual update-diff (the reason the TF provider added the
                   write-only `secret_wo`+`secret_wo_version`, unconfirmed in v0.1.1). So
                   variant 1 trades a rare, controllable replacement event for a potential
                   PER-RECONCILE churn — worse on the reliability criterion. ⚠ Phase-0:
                   confirm no reconcile-diff on the captured secret; if variant-2 permission-
                   change churn ever bites AND `secret_wo` is available, revisit.
                   ===================================================================== */}}
            ---
            # ⚠ Verify group/kind vs provider-harbor v0.1.1 (project.harbor.crossplane.io / Project).
            apiVersion: project.harbor.crossplane.io/v1alpha1
            kind: Project
            metadata:
              annotations:
                {{ setResourceNameAnnotation "harbor-project" }}
            spec:
              forProvider:
                name: {{ $team | quote }}
                public: false
                vulnerabilityScanning: true       # auto_scan (verify field name vs CRD)
                # On teardown, force-delete all repositories so Harbor doesn't refuse to
                # delete a non-empty project ("project <team> is not empty, please set
                # force_delete to TRUE to clean all repositories"). Any tenant that ever
                # built an image has repos here; without this the Project MR hangs
                # Ready=False (Deleting) forever and, via the claim's foregroundDeletion,
                # wedges the entire CapstoneTenant teardown. Field confirmed against the
                # live CRD: project.harbor.crossplane.io/v1alpha1 spec.forProvider.forceDestroy.
                forceDestroy: true
              providerConfigRef:
                name: default
            ---
            # Per-team PUSH robot (CI). pull+push on the team project, plus repository
            # read+list, artifact read+list, and artifact-addition read (supply-chain
            # hardening — mirrors `make harbor-push-robot`: the reusable CI's Trivy gate
            # (supply-chain-verify composite action) (1) polls Harbor's own scan-on-push
            # result via GET .../artifacts/<ref>?with_scan_overview=true (needs
            # resource "artifact" action "read"), then (2) reads the full per-CVE
            # finding list via GET .../artifacts/<ref>/additions/vulnerabilities (needs
            # resource "artifact-addition" action "read", NOT "scan" — verified against
            # goharbor/harbor's own RBAC source; a project-scoped "scan"/"read" grant
            # does not satisfy either call). Without artifact-addition:read the gate
            # 403s on step (2), fails closed, and the build (and its downstream GitOps
            # bump) never completes. Token → connection secret <team>-harbor-push in
            # crossplane-system → PushSecret → Vault.
            apiVersion: robotaccount.harbor.crossplane.io/v1alpha1
            kind: RobotAccount
            metadata:
              annotations:
                {{ setResourceNameAnnotation "harbor-robot-push" }}
            spec:
              forProvider:
                name: {{ printf "%s-push" $team | quote }}
                description: "CI push robot (managed by Crossplane)"
                level: project
                duration: -1                       # non-expiring (verify; -1 = unlimited)
                permissions:
                  - kind: project
                    namespace: {{ $team | quote }}
                    access:
                      - action: push
                        resource: repository
                      - action: pull
                        resource: repository
                      - action: read
                        resource: repository
                      - action: list
                        resource: repository
                      - action: read
                        resource: artifact
                      - action: list
                        resource: artifact
                      - action: read
                        resource: artifact-addition
              writeConnectionSecretToRef:
                namespace: crossplane-system
                name: {{ printf "%s-harbor-push" $team | quote }}
              providerConfigRef:
                name: default
            ---
            # Per-team PULL robot (workloads). pull-only on the team project. Token →
            # connection secret <team>-harbor-pull → PushSecret → Vault → per-env ESO.
            apiVersion: robotaccount.harbor.crossplane.io/v1alpha1
            kind: RobotAccount
            metadata:
              annotations:
                {{ setResourceNameAnnotation "harbor-robot-pull" }}
            spec:
              forProvider:
                name: {{ printf "%s-pull" $team | quote }}
                description: "Workload pull robot (managed by Crossplane)"
                level: project
                duration: -1
                permissions:
                  - kind: project
                    namespace: {{ $team | quote }}
                    access:
                      - action: pull
                        resource: repository
              writeConnectionSecretToRef:
                namespace: crossplane-system
                name: {{ printf "%s-harbor-pull" $team | quote }}
              providerConfigRef:
                name: default

            {{- /* =====================================================================
                   VAULT — per-tenant scoped policy + k8s-auth role (provider-vault).
                   Bug #7 (vault-onboard never run): Policy + AuthBackendRole MRs created
                   WITH the tenant, reconciled forever. Replaces `make vault-onboard`.
                   Groups CRD-verified vs provider-vault v0.1.0: ACL Policy is
                   vault.vault.upbound.io (NOT policy.vault.upbound.io); k8s-auth role
                   is kubernetes.vault.upbound.io.
                   ===================================================================== */}}
            ---
            apiVersion: vault.vault.upbound.io/v1alpha1
            kind: Policy
            metadata:
              annotations:
                {{ setResourceNameAnnotation "vault-policy" }}
            spec:
              forProvider:
                name: {{ printf "tenant-%s-ro" $team | quote }}
                policy: |
                  path "secret/data/tenants/{{ $team }}/*" {
                    capabilities = ["read"]
                  }
                  path "secret/metadata/tenants/{{ $team }}/*" {
                    capabilities = ["read", "list"]
                  }
              providerConfigRef:
                name: default
            ---
            apiVersion: kubernetes.vault.upbound.io/v1alpha1
            kind: AuthBackendRole
            metadata:
              annotations:
                {{ setResourceNameAnnotation "vault-k8s-role" }}
            spec:
              forProvider:
                backend: kubernetes
                roleName: {{ printf "tenant-%s" $team | quote }}
                boundServiceAccountNames: ["eso-tenant"]
                boundServiceAccountNamespaces:
                  {{- range $envs }}
                  - {{ printf "%s-%s" $team .name | quote }}
                  {{- end }}
                  - {{ printf "%s-preview" $team | quote }}
                audience: vault
                tokenPolicies: [{{ printf "tenant-%s-ro" $team | quote }}]
                tokenTtl: 3600
              providerConfigRef:
                name: default

            {{- /* =====================================================================
                   KUBERNETES TENANCY FENCE — via provider-kubernetes Object.
                   Mirrors tenants/_template/ EXACTLY (the reviewed fence), but rendered
                   from the one XR (no sed → bug #13 SEC-001 malformed names impossible).
                   AppProject includes the ESO whitelist (bug #6) so the SecretStore/
                   ExternalSecret kinds the same template renders are permitted.
                   ===================================================================== */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              # Deterministic Object name so the env/preview ApplicationSet Objects can
              # dependsOn it (provision-before-deploy ordering — see those Objects).
              name: {{ printf "xp-%s-appproject" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "k8s-appproject" }}
            spec:
              providerConfigRef:
                name: default
              # Object is Ready as soon as the AppProject is created (D-055: AppProjects
              # publish no status conditions, so DeriveFromObject never resolves and left
              # every claim Ready=False forever — SuccessfulCreate is "Ready when it
              # exists", which is what this Object actually needs to signal to the XR's
              # function-auto-ready Ready).
              readiness:
                policy: SuccessfulCreate
              forProvider:
                manifest:
                  apiVersion: argoproj.io/v1alpha1
                  kind: AppProject
                  metadata:
                    name: {{ $team | quote }}
                    namespace: argocd
                    labels:
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/component: tenant
                    finalizers:
                      - resources-finalizer.argocd.argoproj.io
                  spec:
                    description: {{ printf "Tenant project for team %s (%s)." $team $sem | quote }}
                    sourceRepos:
                      - {{ $repoUrl | quote }}
                      - {{ printf "%s.git" $repoUrl | quote }}
                      - {{ $infraUrl | quote }}
                      - {{ printf "%s.git" $infraUrl | quote }}
                    destinations:
                      {{- range $envs }}
                      - server: https://kubernetes.default.svc
                        namespace: {{ printf "%s-%s" $team .name | quote }}
                      {{- end }}
                      - server: https://kubernetes.default.svc
                        namespace: {{ printf "%s-pr-*" $team | quote }}
                    clusterResourceWhitelist: []
                    namespaceResourceWhitelist:
                      - { group: '', kind: ConfigMap }
                      - { group: '', kind: Service }
                      - { group: '', kind: ServiceAccount }
                      - { group: apps, kind: Deployment }
                      - { group: apps, kind: ReplicaSet }
                      - { group: autoscaling, kind: HorizontalPodAutoscaler }
                      - { group: networking.k8s.io, kind: Ingress }
                      - { group: bitnami.com, kind: SealedSecret }
                      # Bug #6 — ESO kinds whitelisted WITH the ESO objects this template
                      # also renders, so the whitelist + the CRs can never drift apart.
                      - { group: external-secrets.io, kind: ExternalSecret }
                      - { group: external-secrets.io, kind: SecretStore }
                      # Argo Rollouts (progressive-delivery, opt-in —
                      # docs/operator/progressive-delivery.md). Kept in sync with
                      # tenants/_template/appproject.yaml (same tenancy-safe, namespaced
                      # kind as Deployment above): a team MAY run a Rollout instead of a
                      # Deployment in its own namespace; never a cluster-scoped object.
                      - { group: argoproj.io, kind: Rollout }
                      # PodDisruptionBudget (policy/v1) — tenant HA; #346 adds one to
                      # the staging/prod overlays (overlays/{staging,prod}/pdb.yaml).
                      # Namespaced + tenancy-safe like the kinds above.
                      - { group: policy, kind: PodDisruptionBudget }
                    roles:
                      - name: developer
                        description: {{ printf "Team %s developers — sync/get own apps only." $team | quote }}
                        policies:
                          - {{ printf "p, proj:%s:developer, applications, get, %s/*, allow" $team $team | quote }}
                          - {{ printf "p, proj:%s:developer, applications, sync, %s/*, allow" $team $team | quote }}
                        groups:
                          - {{ printf "%s-developers" $team | quote }}

            {{- /* Per-env namespace bundle: Namespace+Quota+LimitRange+3 NetworkPolicies+
                   RoleBinding + eso-tenant SA + vault-ca ConfigMap + SecretStore +
                   app-secrets ExternalSecret + harbor-pull ExternalSecret. One
                   provider-kubernetes Object per manifest, ranged over envs (DRY; no sed).
                   The developer RBAC is a RoleBinding to the pre-reviewed ClusterRole
                   capstone-tenant-developer (CXP-2) — no inline Role, so the provider
                   needs no cluster-wide mirror of pods/exec + deploy-patch. */}}
            {{- range $e := $envs }}
            {{- $ns := printf "%s-%s" $team $e.name }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-%s-ns" $team $e.name | quote }}
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-ns-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              # D-055: core Namespaces publish no Ready condition either, so
              # DeriveFromObject here had the same never-Ready bug as the AppProject
              # Object above — SuccessfulCreate ("Ready when it exists") fixed.
              readiness:
                policy: SuccessfulCreate
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Namespace
                  metadata:
                    name: {{ $ns | quote }}
                    labels:
                      app.kubernetes.io/managed-by: argocd
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                      pod-security.kubernetes.io/enforce: restricted
                      pod-security.kubernetes.io/enforce-version: v1.31
                      # Goldilocks recommend-only (Off mode): tenant workloads get sizing
                      # suggestions in the dashboard, never an eviction (mirrors _template).
                      goldilocks.fairwinds.com/enabled: "true"
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-quota-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ResourceQuota
                  metadata:
                    name: compute-quota
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                  spec:
                    hard:
                      requests.cpu: {{ $e.cpuReq | quote }}
                      requests.memory: {{ $e.memReq | quote }}
                      limits.cpu: {{ $e.cpuLim | quote }}
                      limits.memory: {{ $e.memLim | quote }}
                      pods: {{ $e.pods | quote }}
                      services: "5"
                      # Storage cap — the starvation vector CPU/MEM quotas don't fence.
                      # On replica-3 Ceph every 1Gi PVC costs 3Gi raw (mirrors _template).
                      requests.storage: {{ $e.storageReq | quote }}
                      persistentvolumeclaims: {{ $e.pvcs | quote }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-limits-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: LimitRange
                  metadata:
                    name: container-limits
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                  spec:
                    limits:
                      - type: Container
                        default: { cpu: 500m, memory: 256Mi }
                        defaultRequest: { cpu: 50m, memory: 64Mi }
                        max: { cpu: "1", memory: 1Gi }
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-netpol-deny-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: default-deny-all
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                  spec:
                    podSelector: {}
                    policyTypes: [Ingress, Egress]
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-netpol-ingress-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: allow-ingress-traefik-and-intra-ns
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                  spec:
                    podSelector: {}
                    policyTypes: [Ingress]
                    ingress:
                      - from:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: kube-system
                      - from:
                          - podSelector: {}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-netpol-egress-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: NetworkPolicy
                  metadata:
                    name: allow-egress-dns-and-intra-ns
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                  spec:
                    podSelector: {}
                    policyTypes: [Egress]
                    egress:
                      - to:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: kube-system
                        ports:
                          - { protocol: UDP, port: 53 }
                          - { protocol: TCP, port: 53 }
                      - to:
                          - podSelector: {}
                      # DB tier — MariaDB (3306) / Postgres (5432), scoped to the db-tier
                      # namespace by name. Codifies the tenant side of the
                      # CiliumNetworkPolicy hand-applied live for swami-dev/staging/prod on
                      # 2026-07-07/08 (the matching platform.capstone/team-keyed ingress
                      # lives in platform-services/db-tier/netpol.yaml, rule
                      # allow-ingress-tenant-namespaces — the other half of this door) as a
                      # REUSABLE default rendered for every tenant/env, so a new team never
                      # needs a hand-applied CNP to reach a managed DB.
                      #
                      # tenant-db-access (§6.3): gated on the SAME $database field the
                      # DATABASE blocks below use — a DB-less team's netpol is untouched,
                      # and the one team already live (swami, database != "none") keeps
                      # exactly the access the 2026-07-07/08 hotfix granted it. Port-scoped
                      # to the ONE engine chosen (mutually exclusive, XRD enum is a single
                      # value) — not a blanket db-tier admit. Opening the path does not by
                      # itself grant access — actual credentials/grants below are still
                      # gated on `$database` (mysql/postgres). Supersedes an earlier
                      # unconditional (no `if` guard) variant of this same rule that opened
                      # both ports regardless of `$database`: since the Composition
                      # re-renders on every claim update, there is no need to pre-open the
                      # door for a `database` field that hasn't been set yet, and the
                      # conditional form avoids granting DB-tier egress to teams that have
                      # no database at all.
                      {{- if ne $database "none" }}
                      - to:
                          - namespaceSelector:
                              matchLabels:
                                kubernetes.io/metadata.name: db-tier
                        ports:
                          - protocol: TCP
                            port: {{ if eq $database "postgres" }}5432{{ else }}3306{{ end }}
                      {{- end }}
            ---
            # Developer RBAC (CXP-2): a namespaced RoleBinding to the pre-reviewed
            # ClusterRole capstone-tenant-developer (rbac/capstone-tenant-developer-
            # clusterrole.yaml). No inline Role is minted — so the provider holds NO
            # cluster-wide pods/exec or deployment-write; it only `bind`s this one role.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-rolebinding-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: RoleBinding
                  metadata:
                    name: team-developer
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                  roleRef:
                    apiGroup: rbac.authorization.k8s.io
                    kind: ClusterRole
                    name: capstone-tenant-developer
                  subjects:
                    - apiGroup: rbac.authorization.k8s.io
                      kind: Group
                      name: {{ printf "%s-developers" $team | quote }}
            ---
            # eso-tenant SA (the per-tenant ExternalSecrets authenticate as this →
            # Vault role tenant-<team>). Bug #7 companion.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-eso-sa-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: eso-tenant
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/component: tenant
            ---
            # vault-ca ConfigMap (bug #7): the in-ns CA the namespaced SecretStore's
            # caProvider reads — replaces `make vault-onboard` materializing it.
            # ⚠ The ca.crt VALUE is the PUBLIC Vault server CA PEM (git-safe, NOT secret
            # material). Static embed — the SAME platform CA committed at
            # config/vault-ca-configmap.yaml (crossplane-system/vault-ca) and
            # arc/platform-ca-configmap.yaml; keep all three in lockstep. If the Vault
            # server CA is rotated (vault-server-tls regenerated) these go stale until
            # re-synced. Rotation-proof auto-distribution (cert-manager trust-manager
            # Bundle, or provider-kubernetes patchesFrom crossplane-system/vault-ca) is
            # the documented post-demo TODO.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-vault-ca-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: vault-ca
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/component: tenant
                  data:
                    ca.crt: |
                      -----BEGIN CERTIFICATE-----
                      MIIBgjCCASigAwIBAgIUAd3DM9aqHXUp1CnmoNALdv4X4mcwCgYIKoZIzj0EAwIw
                      HzEdMBsGA1UEAxMUY2Fwc3RvbmUtcGxhdGZvcm0tY2EwHhcNMjYwNjE4MDMwNTM4
                      WhcNMzYwNjE1MDMwNTM4WjAfMR0wGwYDVQQDExRjYXBzdG9uZS1wbGF0Zm9ybS1j
                      YTBZMBMGByqGSM49AgEGCCqGSM49AwEHA0IABKkY0iZxKzIGcXu113AEsQwTVWVg
                      oK1KWF6iIg5QpV/1FXgklWR6np7CEqBnF7AQDmF4F2bY6IotsXHYmumxATajQjBA
                      MA4GA1UdDwEB/wQEAwICpDAPBgNVHRMBAf8EBTADAQH/MB0GA1UdDgQWBBS0asdw
                      cA3QqHVfPkvpXvl9uA9kWjAKBggqhkjOPQQDAgNIADBFAiBagX6h2+w0L4Z7+IYZ
                      i91CA/MNPWHfVR4w3tJ7GoayzwIhAL9aDIRHoM60FGhpF7b9JElBBuaJ93eRhCR2
                      fbbGD1Wk
                      -----END CERTIFICATE-----
            ---
            # Per-tenant namespaced SecretStore (ADR-030 isolation): tenant SA →
            # Vault role tenant-<team> scoped to secret/data/tenants/<team>/*.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-%s-secretstore" $team $e.name | quote }}
              annotations:
                {{ setResourceNameAnnotation (printf "k8s-secretstore-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: SecretStore
                  metadata:
                    name: vault-tenant
                    namespace: {{ $ns | quote }}
                    labels:
                      platform.capstone/component: tenant
                  spec:
                    provider:
                      vault:
                        server: "https://vault.vault.svc.cluster.local:8200"
                        path: "secret"
                        version: "v2"
                        caProvider:
                          type: ConfigMap
                          name: vault-ca
                          key: ca.crt
                        auth:
                          kubernetes:
                            mountPath: "kubernetes"
                            role: {{ printf "tenant-%s" $team | quote }}
                            serviceAccountRef:
                              name: eso-tenant
                              audiences: ["vault"]
            {{- /* CONSUMER ExternalSecrets (app-secrets, harbor-pull) are intentionally
                   NOT rendered here. They are owned by the APP OVERLAY (Backstage
                   fetch:template / M3 Secrets-UX for app-secrets; track-4
                   feat/eso-perteam-push for harbor-pull), so each object has exactly
                   ONE owner — this is what AVOIDS re-introducing the bug #3 dual-owner
                   race (the very bug ADR-031 eliminates). track-5 (this Composition)
                   owns the PRODUCER side only: it mints the robots and PushSecrets their
                   creds into Vault at track-4's committed paths (below), and owns the
                   platform ESO PLUMBING above (the vault-tenant SecretStore, the
                   vault-ca ConfigMap, the eso-tenant SA — all platform-owned per
                   external-secrets/README §6). The app-overlay ExternalSecrets then read
                   Vault and materialize app-secrets + the harbor-pull dockerconfigjson. */}}
            {{- end }}

            {{- /* =====================================================================
                   ENV + PREVIEW ApplicationSets (via provider-kubernetes Object).
                   Bug #4 (__PRNUM__) + bug #5: typed fields, no literal tokens. The env
                   ApplicationSet reads the app repo's promotion.yaml (ADR-008) — single
                   source of truth, unchanged.
                   ===================================================================== */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-appset-envs" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "k8s-appset-envs" }}
            spec:
              providerConfigRef:
                name: default
              # PROVISION-BEFORE-DEPLOY (reliability-first, user's checks→plan→apply→deploy
              # model). The env ApplicationSet is the thing that generates the workload
              # Applications — so it is NOT created until the tenant fence + secret plumbing
              # exist: the AppProject (else the App refs a missing project), the namespaces
              # (the deploy targets), the per-env SecretStores (so the app-overlay's
              # ExternalSecrets can resolve), and the Harbor robot→Vault PushSecrets (so the
              # pull cred is in Vault before the pod pulls → no ImagePullBackOff flap).
              # provider-kubernetes `dependsOn` blocks this Object's apply until each
              # referenced Object exists; ArgoCD's own retry/self-heal covers residual
              # readiness. (The XR's overall Ready, via function-auto-ready + the
              # SuccessfulCreate readiness on these Objects (D-055), is the signal to
              # gate on.)
              references:
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-appproject" $team | quote }}
                {{- range $e := $envs }}
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-%s-ns" $team $e.name | quote }}
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-%s-secretstore" $team $e.name | quote }}
                {{- end }}
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-harborpush" $team | quote }}
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-harborpull" $team | quote }}
              forProvider:
                manifest:
                  apiVersion: argoproj.io/v1alpha1
                  kind: ApplicationSet
                  metadata:
                    name: {{ printf "%s-envs" $team | quote }}
                    namespace: argocd
                    labels:
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/component: tenant
                  spec:
                    goTemplate: true
                    goTemplateOptions: ["missingkey=error"]
                    generators:
                      - matrix:
                          generators:
                            - list:
                                elements:
                                  - { env: dev }
                                  - { env: staging }
                                  - { env: prod }
                            - git:
                                repoURL: {{ $repoUrl | quote }}
                                revision: HEAD
                                files:
                                  - path: .devops/promotion.yaml
                    template:
                      metadata:
                        name: '{{ $team }}-{{ `{{.env}}` }}'
                        labels:
                          platform.capstone/team: {{ $team | quote }}
                          platform.capstone/semester: {{ $sem | quote }}
                          platform.capstone/env: '{{ `{{.env}}` }}'
                      spec:
                        project: {{ $team | quote }}
                        source:
                          repoURL: {{ $repoUrl | quote }}
                          targetRevision: HEAD
                          path: '{{ `{{ (index .environments .env).overlay }}` }}'
                        destination:
                          server: https://kubernetes.default.svc
                          namespace: '{{ $team }}-{{ `{{.env}}` }}'
                    templatePatch: |
                      {{ `{{- $gate := (index .environments .env).gate }}` }}
                      {{ `{{- $nonProd := ne .env "prod" }}` }}
                      spec:
                      {{ `{{- if $nonProd }}` }}
                        # non-prod-sso-gate PR (STAGED — see that PR's body for the
                        # runbook): forwardAuth-gate this env's Ingress behind the
                        # shared oauth2-proxy (any authenticated UA-MIS org member,
                        # ALL paths — reuses the SAME "any UA-MIS member" Middleware
                        # the portal's /internal route uses (portal/middleware.yaml,
                        # `portal-internal-auth`, PR #302), not a new one — see
                        # db-console-auth/README.md "Consumers".
                        # $nonProd (env != prod) is the ONLY gate — prod stays public,
                        # unconditionally, regardless of promotion.yaml's `gate` value
                        # below (that field controls auto-sync, not auth). Strategic
                        # merge (not JSON6902) so this is safe whether or not the
                        # app's own Ingress (backstage/templates/*/skeleton/.devops/
                        # chart/base/ingress.yaml) already carries other annotations.
                        source:
                          kustomize:
                            patches:
                              - target:
                                  kind: Ingress
                                  name: {{ $app | quote }}
                                patch: |-
                                  apiVersion: networking.k8s.io/v1
                                  kind: Ingress
                                  metadata:
                                    name: {{ $app | quote }}
                                    annotations:
                                      traefik.ingress.kubernetes.io/router.middlewares: db-console-auth-oauth2-proxy-errors@kubernetescrd,portal-portal-internal-auth@kubernetescrd
                      {{ `{{- end }}` }}
                      {{ `{{- if eq $gate "auto" }}` }}
                        syncPolicy:
                          automated: { prune: true, selfHeal: true }
                          syncOptions: ["CreateNamespace=false"]
                      {{ `{{- else }}` }}
                        syncPolicy:
                          syncOptions: ["CreateNamespace=false"]
                      {{ `{{- end }}` }}
            {{- if $preview }}
            ---
            # Preview ApplicationSet (security-gated — see tenants/_template/
            # applicationset-preview.yaml header). Only rendered when previewEnabled=true.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-appset-preview" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "k8s-appset-preview" }}
            spec:
              providerConfigRef:
                name: default
              # Same provision-before-deploy gate as the env ApplicationSet.
              references:
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-appproject" $team | quote }}
                {{- range $e := $envs }}
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-%s-secretstore" $team $e.name | quote }}
                {{- end }}
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-harborpull" $team | quote }}
              forProvider:
                manifest:
                  apiVersion: argoproj.io/v1alpha1
                  kind: ApplicationSet
                  metadata:
                    name: {{ printf "%s-preview" $team | quote }}
                    namespace: argocd
                    labels:
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/semester: {{ $sem | quote }}
                      platform.capstone/component: tenant
                  spec:
                    goTemplate: true
                    goTemplateOptions: ["missingkey=error"]
                    generators:
                      - pullRequest:
                          github:
                            owner: UA-MIS
                            repo: {{ $app | quote }}
                            appSecretName: argocd-repo-creds-uamis
                            # LABEL GATE (the 12h HARD-DEATH contract) — keep in LOCKSTEP with
                            # tenants/_template/applicationset-preview.yaml (full rationale in
                            # its header). A preview exists IFF the PR carries the `preview`
                            # label: CI (re-)adds it on every PR-triggered build
                            # (.github/workflows/tenant-build.yaml), and the cohort-gc
                            # preview-ttl CronJob REMOVES it from a >12h preview's PR — the
                            # generator ANDs the labels listed here, so the label-less PR then
                            # yields NO element and `prune:true` tears the App+ns down for
                            # GOOD (a raw App delete is futile; the generator would recreate
                            # it within `requeueAfterSeconds` while the PR is open). The ONLY
                            # revival is re-running CI, which re-adds the label.
                            labels:
                              - preview
                          requeueAfterSeconds: 120
                    template:
                      metadata:
                        name: '{{ $team }}-pr-{{ `{{.number}}` }}'
                        labels:
                          platform.capstone/team: {{ $team | quote }}
                          platform.capstone/semester: {{ $sem | quote }}
                          platform.capstone/env: preview
                      spec:
                        project: {{ $team | quote }}
                        source:
                          repoURL: {{ $repoUrl | quote }}
                          targetRevision: '{{ `{{.head_sha}}` }}'
                          path: .devops/chart/overlays/preview
                          kustomize:
                            namespace: '{{ $team }}-pr-{{ `{{.number}}` }}'
                            # MULTI-COMPONENT (track-6 / multicomp): per-PR image pinning is
                            # NOT done here. A repo may have N components (images named
                            # <appName>-<comp>, all under Harbor project <team> — the
                            # project-level robots already cover them); this Composition does
                            # NOT model components (XRD stays component-agnostic by design).
                            # The preview overlay loops `components` and the overlay+CI set
                            # each component's pull-<sha> tag at the PR head_sha this App reads
                            # (multicomp contract). A single-image kustomize `images:` override
                            # here would assume ONE image and break multi-component previews —
                            # so it is intentionally omitted. Single-component stays correct
                            # (its one overlay image is tagged the same way).
                            #
                            # non-prod-sso-gate PR: previews are ALWAYS non-prod (no
                            # conditional needed, unlike the env ApplicationSet's prod
                            # exclusion above) — forwardAuth-gate the SAME single
                            # per-component-routing Ingress ($app-named, one host, N
                            # paths — see the MULTI-COMPONENT note above) behind the
                            # shared oauth2-proxy. Doubly appropriate here: this whole
                            # generator is still gated behind $preview and flagged
                            # "DO NOT MERGE WITHOUT SECURITY REVIEW" (header) precisely
                            # because untrusted PR code deploys unauthenticated today —
                            # this patch is a real reduction of that exposure, not just
                            # symmetry with dev/staging.
                            patches:
                              - target:
                                  kind: Ingress
                                  name: {{ $app | quote }}
                                patch: |-
                                  apiVersion: networking.k8s.io/v1
                                  kind: Ingress
                                  metadata:
                                    name: {{ $app | quote }}
                                    annotations:
                                      traefik.ingress.kubernetes.io/router.middlewares: db-console-auth-oauth2-proxy-errors@kubernetescrd,portal-portal-internal-auth@kubernetescrd
                        destination:
                          server: https://kubernetes.default.svc
                          namespace: '{{ $team }}-pr-{{ `{{.number}}` }}'
                        syncPolicy:
                          automated: { prune: true, selfHeal: true }
                          syncOptions: ["CreateNamespace=true"]
            {{- end }}

            {{- /* =====================================================================
                   HARBOR ROBOT → VAULT bridge (ESO PushSecret) — the PRODUCER side that
                   track-4 (feat/eso-perteam-push) explicitly delegated to track-5. The
                   robot creds captured in the RobotAccount connection secrets (in
                   crossplane-system, via writeConnectionSecretToRef) are pushed into
                   Vault at TRACK-4's COMMITTED PATHS, with KV fields `name` + `secret`
                   (external-secrets/README §7). track-4's app-overlay ExternalSecrets
                   then template these into the harbor-push / harbor-pull dockerconfigjson
                   — so SealedSecrets/kubeseal/TARGET-host are retired for robots (bug
                   #2/#3), with zero human seal/paste (the zero-touch end-state).
                   Rendered via provider-kubernetes Object so they land in crossplane-system
                   (next to the connection secrets a PushSecret must read from) and use the
                   `vault-push` writer SecretStore (config/vault-push-secretstore.yaml).
                   CONNECTION-SECRET KEYS (CRD-verified vs provider-harbor v0.1.1): upjet
                   publishes only the SENSITIVE robot token as `attribute.secret`.
                   `full_name` is NON-sensitive — it lives in status.atProvider.fullName,
                   NOT the connection secret — so a PushSecret referencing
                   `attribute.full_name` fails ("secret key attribute.full_name does not
                   exist"). The robot USERNAME is deterministic (`<project>+<robot>` =
                   `<team>+<team>-{push,pull}`), so it is NOT pushed here; track-4's
                   consumer derives it (it already has $team). We push only the token. */}}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-harborpush" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "push-harbor-push" }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1alpha1
                  kind: PushSecret
                  metadata:
                    name: {{ printf "%s-harbor-push" $team | quote }}
                    namespace: crossplane-system
                    labels:
                      platform.capstone/component: platform
                  spec:
                    # 1m (was 1h): the robot token (attribute.secret) lands a beat AFTER
                    # the RobotAccount connection secret is created, so the FIRST push
                    # errors ("secret key attribute.secret does not exist"). A short refresh
                    # retries within ~1m so the cred reaches Vault with no manual force-sync
                    # nudge (the tenant-onboarding push-cred race, Fix B).
                    refreshInterval: "1m"
                    secretStoreRefs:
                      - name: vault-push
                        kind: SecretStore
                    selector:
                      secret:
                        name: {{ printf "%s-harbor-push" $team | quote }}   # the RobotAccount connection secret
                    data:
                      # Only the SENSITIVE robot token is a connection-secret key
                      # (attribute.secret). Username is deterministic (<team>+<team>-push),
                      # derived by the consumer — see block header.
                      - match:
                          secretKey: "attribute.secret"
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/ci/harbor-push" $team | quote }}
                            property: secret
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-harborpull" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "push-harbor-pull" }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1alpha1
                  kind: PushSecret
                  metadata:
                    name: {{ printf "%s-harbor-pull" $team | quote }}
                    namespace: crossplane-system
                    labels:
                      platform.capstone/component: platform
                  spec:
                    # 1m (was 1h): same first-reconcile race as harbor-push above — retry
                    # fast so the pull cred reaches Vault without a manual nudge (Fix B).
                    refreshInterval: "1m"
                    secretStoreRefs:
                      - name: vault-push
                        kind: SecretStore
                    selector:
                      secret:
                        name: {{ printf "%s-harbor-pull" $team | quote }}
                    # The project-level pull robot is identical across envs; write it to
                    # each env path track-4 reads (tenants/<team>/<env>/harbor-pull).
                    data:
                      {{- range $e := $envs }}
                      # Only attribute.secret exists (the token); username is deterministic
                      # (<team>+<team>-pull), derived by the consumer — see block header.
                      - match:
                          secretKey: "attribute.secret"
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/%s/harbor-pull" $team $e.name | quote }}
                            property: secret
                      {{- end }}

            {{- /* =====================================================================
                   HARBOR PULL — CONSUMER ExternalSecret (bug #7, onboarding chain).
                   The PushSecret above writes the pull-robot token into Vault at
                   tenants/<team>/<env>/harbor-pull (property `secret`). The workload
                   ServiceAccount sets imagePullSecrets:[harbor-pull], so each tenant
                   namespace needs a docker-registry Secret named `harbor-pull`. For a
                   ZERO-TOUCH tenant nothing materialized it: the zero-touch skeleton
                   overlay ships no harbor-pull ExternalSecret, and there is no operator
                   `make harbor-robot` SealedSecret — so the pod ImagePullBackOff'd on
                   its OWN private image (meow-app pulling harbor.../meow/meow-app, #7 —
                   FailedToRetrieveImagePullSecret harbor-pull).
                   The block header near the top delegated this consumer to the app
                   overlay (track-4), but that consumer was never shipped. track-5 (this
                   Composition) now OWNS it — symmetric with the ARC harbor-push
                   ExternalSecret below, and single-owner (the overlay deliberately ships
                   NO competing harbor-pull, so there is no dual-owner / SharedResource
                   race — verified no tenant repo commits a harbor-pull SealedSecret).
                   Reads via the platform `vault-backend` ClusterSecretStore (the SAME
                   store the proven ARC push ES uses) and templates a
                   kubernetes.io/dockerconfigjson. The robot USERNAME is deterministic —
                   `robot$<team>+<team>-pull` (unified-API `<project>+<robot>` prefix,
                   confirmed live: robot$<team>+<team>-push) — rendered here from $team;
                   only the token lives in Vault. deletionPolicy is Retain-by-default
                   (creationPolicy Owner) so a transient Vault miss doesn't yank a
                   working pull cred out from under a running pod.
                   ⚠ RECONCILE-SAFE: username/registry are constants; do not add the
                   overlay-owned harbor-pull back (would reintroduce the dual-owner race).
                   NOTE: preview (`<team>-preview`) is intentionally NOT covered here —
                   its namespace is ArgoCD-created (CreateNamespace=true), not a
                   Composition Object, so there is no ns Object to gate on; preview is
                   security-gated + off by default. Follow-up if preview-enabled tenants
                   need private pulls (read the dev Vault path).
                   ===================================================================== */}}
            {{- $pullUser := printf "robot$%s+%s-pull" $team $team }}
            {{- range $e := $envs }}
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-%s-harborpull-es" $team $e.name | quote }}
              annotations:
                {{ setResourceNameAnnotation (printf "harborpull-es-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              # Materialize only after the namespace exists and the pull token is in Vault
              # (provision-before-deploy — no ImagePullBackOff flap on first sync).
              references:
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-%s-ns" $team $e.name | quote }}
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-harborpull" $team | quote }}
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: harbor-pull
                    namespace: {{ printf "%s-%s" $team $e.name | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                      platform.capstone/env: {{ $e.name | quote }}
                  spec:
                    refreshInterval: "1h"
                    secretStoreRef:
                      name: vault-backend
                      kind: ClusterSecretStore
                    target:
                      name: harbor-pull
                      creationPolicy: Owner
                      template:
                        type: kubernetes.io/dockerconfigjson
                        data:
                          # Backtick literals pass the inner ESO tokens (the .secret
                          # data key + printf|b64enc) through to ESO's template engine
                          # verbatim; registry + pullUser are rendered NOW by this
                          # Composition. See the ARC push ES below for the same technique.
                          .dockerconfigjson: |
                            {{ `{"auths":{"` }}{{ $registry }}{{ `":{"username":"` }}{{ $pullUser }}{{ `","password":"{{ .secret }}","auth":"{{ printf "%s:%s" "` }}{{ $pullUser }}{{ `" .secret | b64enc }}"}}}` }}
                    data:
                      - secretKey: secret
                        remoteRef:
                          key: {{ printf "tenants/%s/%s/harbor-pull" $team $e.name | quote }}
                          property: secret
            {{- end }}

            {{- /* =====================================================================
                   ARC PER-TEAM CI PUSH (finish-eso / track-4 PR #128, A1 model).
                   One gha-runner-scale-set per team (the container hook can't pick a
                   secret per-job → per-team scale-set, each mounting its OWN
                   harbor-push-<team>). Retires the shared harbor-push last-write-wins
                   hole. Rendered from platform-services/arc/per-team/*.template.yaml,
                   but ZERO-TOUCH: the push cred is materialized by ESO from Vault
                   (tenants/<team>/ci/harbor-push, populated by the PushSecret above) —
                   no `make harbor-push-robot` + seal. Shared (A1, provided by
                   finish-eso/operator in arc-runners): arc-github-app (ESO from
                   platform/arc/github-app), platform-ca, runner netpol.
                   ===================================================================== */}}
            ---
            # 1) The per-team container-hook ConfigMap. The scale-set points
            #    ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE here so build pods mount ONLY
            #    harbor-push-<team> (registry resolved in-cluster to Traefik to dodge the
            #    Cloudflare 100MB edge cap on image-layer push).
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-arc-hook-cm" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "arc-hook-cm" }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: {{ printf "arc-hook-template-%s" $team | quote }}
                    namespace: arc-runners
                    labels:
                      platform.capstone/component: platform
                      platform.capstone/team: {{ $team | quote }}
                  data:
                    content: |
                      spec:
                        # --- Node placement for the KANIKO BUILD step pod (#372/#374; SOFT TIER) ---
                        # MUST mirror platform-services/arc/per-team/hook-template.template.yaml
                        # (the reviewed source of truth). WITHOUT these two fields the step pod
                        # has NO toleration for laptop-01's `capstone.io/dedicated=ci-build:NoSchedule`
                        # taint (#374) and NO nodeAffinity (#372) → it is REPELLED off the dedicated
                        # CI node onto the small Mac workers. runner-container-hooks merges these
                        # top-level PodSpec fields verbatim onto the generated step pod.
                        tolerations:
                          - key: capstone.io/control-plane
                            operator: Equal
                            value: "true"
                            effect: PreferNoSchedule
                          # DEDICATE laptop-01 to CI: tolerate the #374 taint so the Kaniko BUILD
                          # step pod CAN land on the CI-dedicated node; #372 affinity then targets it.
                          - key: capstone.io/dedicated
                            operator: Equal
                            value: ci-build
                            effect: NoSchedule
                        affinity:
                          nodeAffinity:
                            # HARD candidate SET (excludes the 8GiB Mac workers — too small for a
                            # 4Gi/8Gi build): pool=build (laptop-01 + ua-mis-db-1) OR a control-plane
                            # OptiPlex. Ample fallback (5 candidate nodes) so builds never queue.
                            requiredDuringSchedulingIgnoredDuringExecution:
                              nodeSelectorTerms:
                                - matchExpressions:
                                    - { key: capstone.io/pool, operator: In, values: ["build"] }
                                - matchExpressions:
                                    - { key: node-role.kubernetes.io/control-plane, operator: Exists }
                            # SOFT tier bias: laptop-01 (100, matched directly by its own
                            # ci-build=true label — the DEDICATED CI node) → any other
                            # build-pool node e.g. ua-mis-db-1 (50) → OptiPlex (10).
                            preferredDuringSchedulingIgnoredDuringExecution:
                              - weight: 100
                                preference:
                                  matchExpressions:
                                    - { key: capstone.io/ci-build, operator: In, values: ["true"] }
                              - weight: 50
                                preference:
                                  matchExpressions:
                                    - { key: capstone.io/pool, operator: In, values: ["build"] }
                              - weight: 10
                                preference:
                                  matchExpressions:
                                    - { key: node-role.kubernetes.io/control-plane, operator: Exists }
                        # ⚠ HARDCODED Traefik ClusterIP — keep in sync with the shared
                        # platform-services/arc/hook-template.yaml (single source).
                        hostAliases:
                          - ip: "10.97.22.53"
                            hostnames:
                              - {{ $registry }}
                        containers:
                          - name: "$job"
                            volumeMounts:
                              - name: harbor-push
                                mountPath: /kaniko/.docker
                                readOnly: true
                              - name: platform-ca
                                mountPath: /kaniko/ssl/certs/platform-ca.crt
                                subPath: ca.crt
                                readOnly: true
                        volumes:
                          - name: harbor-push
                            secret:
                              secretName: {{ printf "harbor-push-%s" $team | quote }}
                              optional: true
                              items:
                                - key: .dockerconfigjson
                                  path: config.json
                          - name: platform-ca
                            configMap:
                              name: platform-ca
                              optional: true
                              items:
                                - key: ca.crt
                                  path: ca.crt
            ---
            # 2) harbor-push-<team> imagePullSecret materialized by ESO from Vault — the
            #    zero-touch replacement for the sealed `make harbor-push-robot` output.
            #    Reads via the platform ClusterSecretStore (vault-backend). The robot
            #    USERNAME is the deterministic $robotPushUser (static, render-time); only
            #    the token `secret` is read from Vault — the RobotAccount connection secret
            #    publishes ONLY attribute.secret (no name key), so the PushSecret can write
            #    only `secret` to tenants/<team>/ci/harbor-push. A prior version read a Vault
            #    `name` property that was NEVER written, so new tenants (no manual name seed)
            #    got an empty docker username -> 401 UNAUTHORIZED on push.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-arc-pushsecret-es" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "arc-pushsecret-es" }}
            spec:
              providerConfigRef:
                name: default
              references:
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-harborpush" $team | quote }}   # Vault populated first
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: {{ printf "harbor-push-%s" $team | quote }}
                    namespace: arc-runners
                    labels:
                      platform.capstone/component: platform
                      platform.capstone/team: {{ $team | quote }}
                  spec:
                    # 1m (was 1h): consumer side of the push-cred chain — read the token
                    # out of Vault fast once the PushSecret above lands it, so the runner's
                    # harbor-push-<team> imagePullSecret materializes within ~1-2m of tenant
                    # creation with no manual force-sync (Fix B, end-to-end).
                    refreshInterval: "1m"
                    secretStoreRef:
                      name: vault-backend
                      kind: ClusterSecretStore
                    target:
                      name: {{ printf "harbor-push-%s" $team | quote }}
                      creationPolicy: Owner
                      template:
                        type: kubernetes.io/dockerconfigjson
                        data:
                          .dockerconfigjson: |
                            {{ `{"auths":{"` }}{{ $registry }}{{ `":{"username":"` }}{{ $robotPushUser }}{{ `","password":"{{ .secret }}","auth":"` }}{{ `{{ printf "%s:%s" "` }}{{ $robotPushUser }}{{ `" .secret | b64enc }}` }}{{ `"}}}` }}
                    data:
                      # Only the token is read from Vault; the username is the static,
                      # render-time $robotPushUser injected into the template above.
                      - secretKey: secret
                        remoteRef:
                          key: {{ printf "tenants/%s/ci/harbor-push" $team | quote }}
                          property: secret
            ---
            # 3) The per-team runner scale-set (Helm gha-runner-scale-set @0.14.2).
            #    releaseName == the runs-on label (<team>-kaniko). Gated behind the hook
            #    ConfigMap + the push ExternalSecret so the runner only starts once its
            #    cred exists (provision-before-deploy for CI too).
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-arc-scaleset" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "arc-scaleset" }}
            spec:
              providerConfigRef:
                name: default
              references:
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-arc-hook-cm" $team | quote }}
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-arc-pushsecret-es" $team | quote }}
              forProvider:
                manifest:
                  apiVersion: argoproj.io/v1alpha1
                  kind: Application
                  metadata:
                    name: {{ printf "platform-arc-runner-%s" $team | quote }}
                    namespace: argocd
                    labels:
                      platform.capstone/component: platform
                      platform.capstone/team: {{ $team | quote }}
                    annotations:
                      argocd.argoproj.io/sync-wave: "1"
                    finalizers:
                      - resources-finalizer.argocd.argoproj.io
                  spec:
                    project: platform
                    source:
                      repoURL: ghcr.io/actions/actions-runner-controller-charts
                      chart: gha-runner-scale-set
                      targetRevision: 0.14.2
                      helm:
                        releaseName: {{ printf "%s-kaniko" $team | quote }}
                        values: |
                          githubConfigUrl: "https://github.com/UA-MIS"
                          githubConfigSecret: arc-github-app
                          controllerServiceAccount:
                            name: arc-gha-rs-controller
                            namespace: arc-system
                          minRunners: 0
                          maxRunners: 3
                          containerMode:
                            type: "kubernetes"
                            kubernetesModeWorkVolumeClaim:
                              accessModes: ["ReadWriteOnce"]
                              storageClassName: "ceph-block"
                              resources:
                                requests:
                                  storage: "5Gi"
                          template:
                            spec:
                              # --- Node placement for the RUNNER pod (#372/#374; SOFT TIER) ---
                              # MUST mirror platform-services/arc/per-team/runner-scaleset-app.template.yaml
                              # (the reviewed source of truth). WITHOUT these the runner pod has NO
                              # toleration for laptop-01's `capstone.io/dedicated=ci-build:NoSchedule`
                              # taint (#374) and NO nodeAffinity (#372), so it is REPELLED off the
                              # dedicated CI node onto the small Mac workers — leaving the fast 16GiB
                              # laptop idle while builds pile onto the 8GiB Macs. gha-runner-scale-set
                              # passes template.spec.{tolerations,affinity} straight onto the runner pod.
                              tolerations:
                                - key: capstone.io/control-plane
                                  operator: Equal
                                  value: "true"
                                  effect: PreferNoSchedule
                                # DEDICATE laptop-01 to CI: tolerate the #374 taint so the runner pod
                                # CAN land on the CI-dedicated node; #372 affinity then targets it.
                                - key: capstone.io/dedicated
                                  operator: Equal
                                  value: ci-build
                                  effect: NoSchedule
                              affinity:
                                nodeAffinity:
                                  # HARD candidate SET (excludes the 8GiB Mac workers): pool=build
                                  # (laptop-01 + ua-mis-db-1) OR a control-plane OptiPlex. 5 candidate
                                  # nodes → ample fallback, builds never queue when laptop is busy.
                                  requiredDuringSchedulingIgnoredDuringExecution:
                                    nodeSelectorTerms:
                                      - matchExpressions:
                                          - { key: capstone.io/pool, operator: In, values: ["build"] }
                                      - matchExpressions:
                                          - { key: node-role.kubernetes.io/control-plane, operator: Exists }
                                  # SOFT tier bias: laptop-01 (100, matched directly by its own
                                  # ci-build=true label — the DEDICATED CI node) → any other
                                  # build-pool node e.g. ua-mis-db-1 (50) → OptiPlex (10).
                                  preferredDuringSchedulingIgnoredDuringExecution:
                                    - weight: 100
                                      preference:
                                        matchExpressions:
                                          - { key: capstone.io/ci-build, operator: In, values: ["true"] }
                                    - weight: 50
                                      preference:
                                        matchExpressions:
                                          - { key: capstone.io/pool, operator: In, values: ["build"] }
                                    - weight: 10
                                      preference:
                                        matchExpressions:
                                          - { key: node-role.kubernetes.io/control-plane, operator: Exists }
                              securityContext:
                                runAsNonRoot: true
                                runAsUser: 1001
                                fsGroup: 1001
                                seccompProfile:
                                  type: RuntimeDefault
                              containers:
                                - name: runner
                                  image: ghcr.io/actions/actions-runner:2.335.1
                                  command: ["/home/runner/run.sh"]
                                  securityContext:
                                    allowPrivilegeEscalation: false
                                    capabilities:
                                      drop: ["ALL"]
                                  env:
                                    - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
                                      value: /home/runner/pod-templates/hook-template.yaml
                                  volumeMounts:
                                    - name: hook-template
                                      mountPath: /home/runner/pod-templates
                                      readOnly: true
                                  resources:
                                    requests: { cpu: "250m", memory: "512Mi" }
                                    limits:   { cpu: "2",    memory: "2Gi" }
                              volumes:
                                - name: hook-template
                                  configMap:
                                    name: {{ printf "arc-hook-template-%s" $team | quote }}
                                    items:
                                      - key: content
                                        path: hook-template.yaml
                    destination:
                      server: https://kubernetes.default.svc
                      namespace: arc-runners
                    syncPolicy:
                      automated: { prune: true, selfHeal: true }
                      syncOptions: ["CreateNamespace=false", "ServerSideApply=true"]
                      retry:
                        limit: 5
                        backoff: { duration: 10s, factor: 2, maxDuration: 5m }

            {{- /* =====================================================================
                   DATABASE — automatic per-(team,env) MySQL provisioning (ADR-033).
                   GATED on the XR's `database` field: only rendered when == "mysql"
                   (the DB scaffolder templates set it; react-static leaves "none"). So
                   a DB-less app emits ZERO provider-sql resources — no idle Database,
                   no admin-cred reach for stacks that don't need a DB.

                   Per env (dev/staging/prod) we mint, on the off-cluster DB tier via
                   provider-sql (mysql.sql.crossplane.io), a:
                     • Database `<teamDb>_<env>`  (the schema)
                     • User     `<teamDb>_<env>`  (scoped login; password AUTO-GENERATED
                                                   by provider-sql — never templated, so
                                                   no per-reconcile churn; same reliability
                                                   rationale as the Harbor robot Variant-2)
                     • Grant    ALL on that schema to that user (the tenant owns its own DB)
                   The User's connection secret (crossplane-system, via
                   writeConnectionSecretToRef) carries the generated password; an ESO
                   PushSecret bridges it into Vault at the SAME leaf track-4's app
                   ExternalSecret reads — tenants/<team>/<env>/database (ADR-033 contract).

                   ⚠ external-name = the actual MySQL identifier. In a Composition the
                   composed MR's metadata.name is auto-generated, so we PIN
                   crossplane.io/external-name to make the schema/username deterministic
                   (the consumer assembles DATABASE_URL from a fixed `<teamDb>_<env>`).

                   ⚠ Phase-0 (DB tier not live, PR #29): confirm against provider-sql
                   v0.15.0 CRDs — (a) Database/User/Grant group mysql.sql.crossplane.io/
                   v1alpha1; (b) the User connection-secret KEY NAMES (provider-sql
                   publishes username/password/endpoint/port for User; host/port/username/
                   password/database for Database — we map endpoint->host below); (c) that
                   the captured password does NOT diff on steady-state reconcile.
                   ===================================================================== */}}
            {{- if eq $database "mysql" }}
            {{- range $e := $envs }}
            {{- $dbName := printf "%s_%s" $teamDb $e.name }}
            {{- $connSecret := printf "%s-%s-db" $team $e.name }}
            ---
            # The per-env schema.
            apiVersion: mysql.sql.crossplane.io/v1alpha1
            kind: Database
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "sql-db-%s" $e.name) }}
                crossplane.io/external-name: {{ $dbName | quote }}
            spec:
              forProvider:
                defaultCharacterSet: utf8mb4
                defaultCollation: utf8mb4_unicode_ci
              providerConfigRef:
                name: db-tier-mariadb
            ---
            # The per-env scoped login. No passwordSecretRef -> provider-sql generates
            # the password and writes it (plus username/endpoint/port) to the connection
            # secret in crossplane-system. STABLE across reconciles (generated once).
            apiVersion: mysql.sql.crossplane.io/v1alpha1
            kind: User
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "sql-user-%s" $e.name) }}
                crossplane.io/external-name: {{ $dbName | quote }}
            spec:
              forProvider: {}
              writeConnectionSecretToRef:
                namespace: crossplane-system
                name: {{ $connSecret | quote }}
              providerConfigRef:
                name: db-tier-mariadb
            ---
            # Explicit privilege list on the tenant's own schema (the team owns its
            # DB) -- NOT literal `ALL`. crossplane-provisioner (the db-tier-mariadb
            # ProviderConfig admin, in-cluster MariaDB) holds a broad-but-SPECIFIC
            # privilege set WITH GRANT OPTION, not MariaDB's literal ALL PRIVILEGES
            # bundle (confirmed live: SHOW GRANTS FOR 'crossplane-provisioner'@'%' --
            # see docs/db-tier-runbook.md). MariaDB 1044s ("Access denied ... to
            # database") on `GRANT ALL` from a grantor that doesn't itself hold ALL
            # PRIVILEGES -- you can't grant what you don't hold. swami's 3 existing
            # per-env Grants happen to be Synced=True only because they were created
            # 2026-07-03, BEFORE #289 repointed this ProviderConfig at the current
            # restricted-list admin; any NEW tenant onboarded now (or a re-provision)
            # would hit the 1044 with `ALL`. This explicit list mirrors
            # crossplane-provisioner's held set 1:1 (database-scoped subset -- CREATE
            # USER is global-only in MariaDB and cannot appear in a database-level
            # GRANT, so it is excluded even though the grantor holds it) and is
            # functionally equivalent to ALL at the db.* level for an app.
            # user + database reference the DB-level names (the external-names above).
            apiVersion: mysql.sql.crossplane.io/v1alpha1
            kind: Grant
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "sql-grant-%s" $e.name) }}
            spec:
              forProvider:
                user: {{ $dbName | quote }}
                database: {{ $dbName | quote }}
                privileges:
                  - SELECT
                  - INSERT
                  - UPDATE
                  - DELETE
                  - CREATE
                  - DROP
                  - REFERENCES
                  - INDEX
                  - ALTER
                  - CREATE TEMPORARY TABLES
                  - LOCK TABLES
                  - EXECUTE
                  - CREATE VIEW
                  - SHOW VIEW
                  - CREATE ROUTINE
                  - ALTER ROUTINE
                  - EVENT
                  - TRIGGER
              providerConfigRef:
                name: db-tier-mariadb
            ---
            # Bridge the generated DB creds into Vault at the ADR-033 contract path
            # tenants/<team>/<env>/database (properties: username, password, host, port).
            # The app's DATABASE_URL ExternalSecret (DB template, track-4) reads these and
            # assembles mysql://<user>:<pass>@<host>:<port>/<teamDb>_<env> via target.template
            # — the dbname follows the fixed rule (NOT pushed; it is structural, not secret).
            # Rendered via provider-kubernetes Object so it lands in crossplane-system next
            # to the connection secret, and uses the platform `vault-push` writer SecretStore
            # (config/vault-push-secretstore.yaml) — the SAME producer plane as the Harbor
            # robot PushSecrets. ONE writer per Vault leaf (no dual-owner clobber).
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-%s-db-push" $team $e.name | quote }}
              annotations:
                {{ setResourceNameAnnotation (printf "push-db-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1alpha1
                  kind: PushSecret
                  metadata:
                    name: {{ printf "%s-%s-db" $team $e.name | quote }}
                    namespace: crossplane-system
                    labels:
                      platform.capstone/component: platform
                      platform.capstone/team: {{ $team | quote }}
                  spec:
                    refreshInterval: "1h"
                    secretStoreRefs:
                      - name: vault-push
                        kind: SecretStore
                    selector:
                      secret:
                        name: {{ $connSecret | quote }}   # provider-sql User connection secret
                    data:
                      - match:
                          secretKey: username
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                            property: username
                      - match:
                          secretKey: password
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                            property: password
                      # provider-sql publishes the server as `endpoint` -> store as `host`.
                      - match:
                          secretKey: endpoint
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                            property: host
                      - match:
                          secretKey: port
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                            property: port
            {{- end }}
            {{- /* =====================================================================
                   TEAM DB CONSOLE (MySQL) -- ONE Adminer per TEAM (not per
                   env), per user feedback on the original per-env design (design doc
                   artifacts/research/tenant-db-access.md §3/§4/§7). Autologin server carries
                   NO fixed db path, so Adminer's own #dbs switcher (a real
                   <select name="db">, confirmed against the live dockette/adminer:5.4.2
                   image's index.php) lists every database the console's DB user has been
                   granted -- populated by the per-env Grants below, so it always tracks
                   whatever $envs is at render time.

                   Lives in the team's OWN dev namespace ({{ $team }}-dev) -- a deliberate
                   reuse, not a new namespace: that namespace already has the exact
                   plumbing a per-team (not per-env) resource needs -- the vault-tenant
                   SecretStore + eso-tenant SA rendered above, both scoped to the WHOLE
                   tenant-<team> Vault policy (secret/data/tenants/<team>/*), not just the
                   dev env. No new namespace/quota/PSA/netpol/AppProject-destination is
                   needed as a result (dev's existing egress-to-db-tier rule already
                   covers this pod). status.dbConsoleUrl (bottom of this template)
                   reflects the same <team>-db host.

                   Console user: `<teamDb>_console`, granted an EXPLICIT privilege list
                   (functionally equivalent to the per-env app users' ALL, NOT the
                   literal keyword -- see the Grant loop below for why) on EVERY per-env
                   schema. Password Vault leaf: tenants/<team>/console/database
                   (SAME shape/properties as the per-env tenants/<team>/<env>/database
                   leaves, just a `console` slot instead of dev/staging/prod, so it reuses
                   the SAME ExternalSecret/PushSecret pattern verbatim).
                   ===================================================================== */}}
            {{- $consoleUser := printf "%s_console" $teamDb }}
            {{- $consoleConnSecret := printf "%s-console-db" $team }}
            {{- $consoleNs := printf "%s-dev" $team }}
            ---
            # The shared team-console login. No passwordSecretRef -> provider-sql
            # generates the password (stable across reconciles, same rationale as the
            # per-env Users above).
            apiVersion: mysql.sql.crossplane.io/v1alpha1
            kind: User
            metadata:
              annotations:
                {{ setResourceNameAnnotation "sql-user-console" }}
                crossplane.io/external-name: {{ $consoleUser | quote }}
            spec:
              forProvider: {}
              writeConnectionSecretToRef:
                namespace: crossplane-system
                name: {{ $consoleConnSecret | quote }}
              providerConfigRef:
                name: db-tier-mariadb
            {{- range $e := $envs }}
            ---
            # Explicit privilege list on EVERY per-env schema -- NOT literal `ALL`.
            # crossplane-provisioner (the db-tier-mariadb ProviderConfig admin) holds a
            # broad-but-SPECIFIC privilege set WITH GRANT OPTION, not MariaDB's literal
            # ALL PRIVILEGES bundle (confirmed live: SHOW GRANTS FOR
            # 'crossplane-provisioner'@'%' -- see docs/db-tier-runbook.md). MariaDB 1044s
            # ("Access denied ... to database") on `GRANT ALL` from a grantor that
            # doesn't itself hold ALL PRIVILEGES -- you can't grant what you don't hold.
            # (The per-env app-user Grant above still says `ALL` and is Synced=True, but
            # only because those 3 Grants were created 2026-07-03, before #289 repointed
            # this ProviderConfig at the current restricted-list admin; they're stable
            # existing state, not proof `ALL` still works for a *new* Grant today -- a
            # new tenant's per-env Grant would hit this same 1044. Out of scope here;
            # tracked as a follow-up.) This list mirrors crossplane-provisioner's held
            # set 1:1 (database-scoped subset -- CREATE USER is global-only in MariaDB
            # and cannot appear in a database-level GRANT, so it is intentionally
            # excluded even though the grantor holds it). It is also correct
            # least-privilege for a console/admin-tool user, so this is not merely a
            # workaround.
            apiVersion: mysql.sql.crossplane.io/v1alpha1
            kind: Grant
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "sql-grant-console-%s" $e.name) }}
            spec:
              forProvider:
                user: {{ $consoleUser | quote }}
                database: {{ printf "%s_%s" $teamDb $e.name | quote }}
                privileges:
                  - SELECT
                  - INSERT
                  - UPDATE
                  - DELETE
                  - CREATE
                  - DROP
                  - REFERENCES
                  - INDEX
                  - ALTER
                  - CREATE TEMPORARY TABLES
                  - LOCK TABLES
                  - EXECUTE
                  - CREATE VIEW
                  - SHOW VIEW
                  - CREATE ROUTINE
                  - ALTER ROUTINE
                  - EVENT
                  - TRIGGER
              providerConfigRef:
                name: db-tier-mariadb
            {{- end }}
            ---
            # Bridge the console user's generated creds into Vault at the `console` leaf
            # (same four properties as the per-env `database` leaves).
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-console-db-push" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "push-db-console" }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1alpha1
                  kind: PushSecret
                  metadata:
                    name: {{ printf "%s-console-db" $team | quote }}
                    namespace: crossplane-system
                    labels:
                      platform.capstone/component: platform
                      platform.capstone/team: {{ $team | quote }}
                  spec:
                    refreshInterval: "1h"
                    secretStoreRefs:
                      - name: vault-push
                        kind: SecretStore
                    selector:
                      secret:
                        name: {{ $consoleConnSecret | quote }}
                    data:
                      - match:
                          secretKey: username
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/console/database" $team | quote }}
                            property: username
                      - match:
                          secretKey: password
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/console/database" $team | quote }}
                            property: password
                      - match:
                          secretKey: endpoint
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/console/database" $team | quote }}
                            property: host
                      - match:
                          secretKey: port
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/console/database" $team | quote }}
                            property: port
            ---
            # UA-MIS theme ConfigMap. Mounted straight to /srv/adminer.css via subPath in
            # the Deployment below -- bypasses the /srv root:root 0755 write-wall the
            # adminer-plugins emptyDir fix below also works around: Adminer's own css()
            # helper (index.php) does file_exists("adminer.css") relative to its cwd and
            # links it in if present, so no ADMINER_THEME env/entrypoint cooperation is
            # needed, and the kubelet creates this bind mount as root at container-create
            # time (before the UID-1000 process starts), so /srv's permissions never come
            # into it -- a different mechanism than entrypoint.sh's in-container `cp` for
            # adminer-plugins, which IS blocked by them.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-dbconsole-css" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "dbconsole-css-cm" }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: db-console-css
                    namespace: {{ $consoleNs | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                  data:
                    adminer.css: |
                      /*
                       * University of Alabama MIS — Adminer theme (tenant DB console + db-admin console).
                       * ONE committed LIGHT theme. Crimson #9E1B32 accents, warm-white surfaces, dark
                       * readable text, a light-grey / black-mono SQL editor + result grid.
                       *
                       * ============================================================================
                       * WHY THERE IS NO DARK VARIANT / NO OS-ADAPTIVE STYLING (read before editing)
                       * ============================================================================
                       * Adminer's loader (index.php `css()`) scans this file's TEXT and, if it finds
                       * the token that spells the CSS dark-scheme media feature, flips this sheet from
                       * "light" to "adaptive" AND ALSO links Adminer's OWN built-in dark stylesheet
                       * gated to the visitor's OS dark setting. A previous revision of this theme had
                       * that exact token sitting harmlessly in a code comment — which made Adminer pull
                       * in its dark sheet for anyone whose OS was in dark mode, and THAT sheet (not this
                       * one) painted the broken dark-navy action bar / dark panels over our light theme.
                       *
                       * So this file DELIBERATELY contains that token NOWHERE — not in a rule, not in a
                       * comment, not in a media query. We force a single light look for every visitor
                       * regardless of OS via the variable overrides below + `color-scheme: light`. If
                       * you ever add an OS-dark media block here you will silently re-arm that trap.
                       *
                       * ============================================================================
                       * HOW IT WORKS — override Adminer's OWN design tokens, don't fight each element.
                       * ============================================================================
                       * Adminer 5.4.2's default.css drives nearly everything from four CSS variables on
                       * <html>:  --bg (surfaces), --fg (text), --dim (th / secondary surfaces),
                       * --lit (thead + selected-row + :target highlight). Re-defining those four (with
                       * !important, and since this sheet loads AFTER default.css) recolors the bulk of
                       * the UI coherently in one place. We then layer crimson accents + an editor/grid
                       * polish on top, and otherwise WORK WITH Adminer's native layout (a ~19em
                       * absolute left #menu, #content offset 21em, an absolute #breadcrumb) rather than
                       * re-positioning it — the prior fixed-position surgery is what produced the
                       * partial-width header strip and the empty full-height sidebar column.
                       *
                       * DOM verified against the LIVE dockette/adminer:mysql image (Adminer 5.4.2):
                       *   #menu (left nav, holds #dbs the DB switcher + table lists), #content (h1,
                       *   #breadcrumb, tables, forms), .footer > fieldset (the bulk "Selected (N)"
                       *   action bar), textarea.sqlarea.jush-sql (the SQL editor — a PLAIN textarea,
                       *   no JS overlay). CSS is auto-loaded by Adminer via file_exists("adminer.css")
                       *   relative to its docroot (/srv), linked after default.css.
                       */

                      /* ==========================================================================
                       * 1. DESIGN TOKENS
                       *    (a) Override Adminer's four native variables -> light palette.
                       *    (b) Our own namespaced palette for the accent layer.
                       * ========================================================================== */
                      html {
                        /* Adminer's own tokens — the single biggest lever. */
                        --bg:  #ffffff !important;   /* primary surfaces */
                        --fg:  #1a1c20 !important;   /* body text — near-black, high contrast */
                        --dim: #f0eeea !important;   /* th / secondary surfaces — warm light grey */
                        --lit: #f7e5e9 !important;   /* thead + selected-row + :target — crimson tint */
                        color-scheme: light;         /* keep UA form controls / scrollbars light on dark OS */
                      }

                      :root {
                        --ua-crimson:      #9E1B32;
                        --ua-crimson-dark: #7A1426;
                        --ua-tint:         rgba(158, 27, 50, 0.08);
                        --ua-tint-strong:  rgba(158, 27, 50, 0.16);

                        --ua-ink:      #1A1C20;
                        --ua-ink-soft: #4A4642;
                        --ua-muted:    #79736D;

                        --ua-page:     #ffffff;
                        --ua-sidebar:  #F5F3F0;     /* barely-grey sidebar surface */
                        --ua-border:   #E4E1DB;
                        --ua-border-strong: #D3CFC8;

                        --ua-editor-bg: #F5F5F5;    /* light-grey code surface */
                        --ua-editor-fg: #14161A;    /* black-ish mono text */

                        --ua-ok:    #1C7C4A;
                        --ua-ok-bg: #EAF6EF;
                        --ua-err:   #B3261E;
                        --ua-err-bg:#FCEBEA;

                        --ua-radius:    8px;
                        --ua-radius-sm: 6px;
                        --ua-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
                        --ua-mono: "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
                      }

                      /* ==========================================================================
                       * 2. BASE
                       * ========================================================================== */
                      html { box-sizing: border-box; }
                      *, *:before, *:after { box-sizing: inherit; }

                      body {
                        background: var(--ua-page) !important;
                        color: var(--ua-ink) !important;
                        font-family: var(--ua-font) !important;
                        font-size: 14px;
                        line-height: 1.55;
                        -webkit-font-smoothing: antialiased;
                      }

                      a { color: var(--ua-crimson); text-decoration: none; }
                      a:hover { color: var(--ua-crimson-dark); text-decoration: underline; }

                      /* ==========================================================================
                       * 3. LEFT SIDEBAR (#menu) — native Adminer position (absolute, ~19em, left:0).
                       *    We give it a light surface, a clear right border, a min-height so it reads
                       *    as a real column even when its content is short, and the UA-MIS wordmark.
                       * ========================================================================== */
                      #menu {
                        background: var(--ua-sidebar) !important;
                        border-right: 1px solid var(--ua-border) !important;
                        min-height: calc(100vh - 2em) !important;
                        padding: 16px 16px 32px !important;
                        margin: 0 !important;
                        top: 0 !important;               /* start at the very top so the wordmark aligns */
                      }

                      /* UA-MIS wordmark at the top of the sidebar (inline SVG data-URI — no external
                         asset host, offline-safe). */
                      #menu:before {
                        content: "";
                        display: block;
                        height: 34px;
                        margin: 0 0 16px 2px;
                        background: url("data:image/svg+xml;utf8,\
                      <svg xmlns='http://www.w3.org/2000/svg' width='210' height='34' viewBox='0 0 210 34'>\
                      <rect width='34' height='34' rx='6' fill='%239E1B32'/>\
                      <text x='17' y='24' text-anchor='middle' font-family='Georgia, serif' font-size='19' font-weight='700' fill='%23FFFFFF'>A</text>\
                      <text x='44' y='16' font-family='-apple-system, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='%231A1C20' letter-spacing='.3'>UA-MIS</text>\
                      <text x='44' y='29' font-family='-apple-system, Helvetica, Arial, sans-serif' font-size='10' font-weight='500' fill='%2379736D' letter-spacing='.3'>DB Console</text>\
                      </svg>") no-repeat left center;
                        background-size: contain;
                      }

                      /* Nav section headings (Tables / Views / …) rendered as <p> in the menu. */
                      #menu p {
                        font-size: 11px;
                        font-weight: 700;
                        text-transform: uppercase;
                        letter-spacing: .05em;
                        color: var(--ua-muted);
                        margin: 16px 0 6px !important;
                        border: none !important;
                        background: none !important;
                      }

                      #menu a {
                        color: var(--ua-ink) !important;
                        display: inline-block;
                        padding: 3px 8px;
                        margin: 1px 0;
                        border-radius: var(--ua-radius-sm);
                        border: none !important;
                        text-transform: none;   /* nav/table links stay normal-case; only the <p> section headings are uppercased */
                      }
                      #menu a:hover {
                        background: var(--ua-tint) !important;
                        color: var(--ua-crimson-dark) !important;
                        text-decoration: none;
                        box-shadow: inset 2px 0 0 0 var(--ua-crimson);
                      }
                      #menu a.active,
                      #menu a:active {
                        background: var(--ua-tint-strong) !important;
                        color: var(--ua-crimson-dark) !important;
                        box-shadow: inset 3px 0 0 0 var(--ua-crimson);
                      }

                      /* #dbs — the database switcher (the dropdown listing <team>_dev/staging/prod). */
                      #dbs {
                        margin: 0 0 12px !important;
                        padding: 0 !important;
                        border: none !important;
                      }
                      #dbs label { font-weight: 600; color: var(--ua-ink-soft); }

                      /* Sidebar toggle handle */
                      #menuopen { color: var(--ua-muted); }

                      /* ==========================================================================
                       * 4. CONTENT + BREADCRUMB
                       *    #breadcrumb is natively position:absolute with NO width, so ANY colored
                       *    background would render as a short partial strip. We keep it text-only
                       *    (transparent) — no strip, nothing can look "cut off".
                       * ========================================================================== */
                      #content {
                        padding: 8px 32px 48px 28px !important;
                        max-width: 1180px;
                      }

                      #breadcrumb {
                        background: transparent !important;
                        box-shadow: none !important;
                        border: none !important;
                        height: auto !important;
                        line-height: 1.6 !important;
                        padding: 6px 0 !important;
                        margin: 0 0 4px -6px !important;
                        font-size: 12px;
                        color: var(--ua-muted);
                      }
                      #breadcrumb a { color: var(--ua-crimson); }
                      #breadcrumb a:hover { color: var(--ua-crimson-dark); }

                      /* ==========================================================================
                       * 5. TYPOGRAPHY
                       * ========================================================================== */
                      h1 {
                        font-size: 21px;
                        font-weight: 700;
                        color: var(--ua-ink);
                        background: none !important;
                        border: none !important;
                        border-bottom: 2px solid var(--ua-tint-strong) !important;
                        padding: 0 0 10px !important;
                        margin: 4px 0 20px !important;
                      }
                      h1 .version { font-size: 11px; font-weight: 400; color: var(--ua-muted); opacity: .7; }
                      h1 a[href*="adminer.org"] { display: none !important; }   /* hide upstream donate/version chrome */

                      h2 {
                        font-size: 16px;
                        font-weight: 600;
                        color: var(--ua-ink);
                        background: none !important;   /* was --lit; keep clean, use a border accent instead */
                        border: none !important;
                        border-bottom: 2px solid var(--ua-tint-strong) !important;
                        padding: 0 0 8px !important;
                        margin: 26px 0 14px !important;
                      }
                      h3 { font-size: 14px; font-weight: 600; color: var(--ua-ink-soft); margin: 16px 0 8px; }

                      p { color: var(--ua-ink-soft); }

                      /* ==========================================================================
                       * 6. MESSAGES / ALERTS
                       * ========================================================================== */
                      .message, .error {
                        display: block;
                        border-radius: var(--ua-radius);
                        padding: 10px 14px !important;
                        margin: 0 0 16px !important;
                        font-weight: 500;
                        background-image: none !important;
                        box-shadow: none !important;
                      }
                      .message { background: var(--ua-ok-bg) !important;  color: var(--ua-ok) !important;  border: 1px solid rgba(28,124,74,.25); }
                      .error   { background: var(--ua-err-bg) !important; color: var(--ua-err) !important; border: 1px solid rgba(179,38,30,.25); }

                      /* ==========================================================================
                       * 7. FORMS — inputs / selects / buttons
                       * ========================================================================== */
                      fieldset {
                        border: 1px solid var(--ua-border) !important;
                        border-radius: var(--ua-radius);
                        padding: 12px 14px !important;
                        margin: 0 0 14px !important;
                        background: #FCFBFA !important;
                        box-shadow: none !important;
                      }
                      legend {
                        color: var(--ua-ink-soft);
                        font-weight: 600;
                        padding: 0 6px;
                      }

                      input[type=text], input[type=password], input[type=number],
                      input[type=search], input[type=email], input:not([type]), select, textarea {
                        font-family: var(--ua-font);
                        font-size: 13px;
                        color: var(--ua-ink);
                        background: #ffffff;
                        border: 1px solid var(--ua-border-strong);
                        border-radius: var(--ua-radius-sm);
                        padding: 6px 9px;
                        transition: border-color .12s ease, box-shadow .12s ease;
                      }
                      input[type=text]:focus, input[type=password]:focus, input[type=number]:focus,
                      input[type=search]:focus, input[type=email]:focus, input:not([type]):focus,
                      select:focus, textarea:focus {
                        outline: none;
                        border-color: var(--ua-crimson);
                        box-shadow: 0 0 0 3px var(--ua-tint);
                      }

                      /* Primary submit buttons — crimson (matches ArgoCD/Grafana). */
                      input[type=submit], input[type=button], button {
                        font-family: var(--ua-font);
                        font-size: 13px;
                        font-weight: 600;
                        color: #ffffff !important;
                        background: var(--ua-crimson) !important;
                        border: 1px solid var(--ua-crimson) !important;
                        border-radius: var(--ua-radius-sm);
                        padding: 6px 15px;
                        cursor: pointer;
                        transition: background-color .12s ease, border-color .12s ease;
                      }
                      input[type=submit]:hover, input[type=button]:hover, button:hover {
                        background: var(--ua-crimson-dark) !important;
                        border-color: var(--ua-crimson-dark) !important;
                      }

                      /* Destructive actions (drop / delete) — quiet GHOST style, never a bold crimson
                         button, so they don't invite a click. Red only on hover. (DB-level drop is
                         hidden entirely below.) */
                      input[name=drop], input[name=delete], input[name=truncate], input[value=Drop], input[value=Delete] {
                        color: var(--ua-err) !important;
                        background: #ffffff !important;
                        border: 1px solid var(--ua-border-strong) !important;
                        font-weight: 500;
                      }
                      input[name=drop]:hover, input[name=delete]:hover, input[name=truncate]:hover,
                      input[value=Drop]:hover, input[value=Delete]:hover {
                        background: var(--ua-err-bg) !important;
                        border-color: var(--ua-err) !important;
                      }

                      .icon { border-radius: 4px; }

                      /* ==========================================================================
                       * 8. SQL EDITOR — plain textarea, styled to read like a code editor:
                       *    light-grey surface, black mono text, soft inset, crimson focus ring.
                       * ========================================================================== */
                      textarea, .sqlarea, textarea.sqlarea, textarea.jush-sql, .jush-sql {
                        font-family: var(--ua-mono) !important;
                        font-size: 13.5px !important;
                        line-height: 1.65 !important;
                        color: var(--ua-editor-fg) !important;
                        background: var(--ua-editor-bg) !important;
                        border: 1px solid var(--ua-border-strong) !important;
                        border-radius: var(--ua-radius) !important;
                        padding: 13px 15px !important;
                        box-shadow: inset 0 1px 3px rgba(20,22,26,.05) !important;
                        tab-size: 2;
                      }
                      textarea:focus, textarea.sqlarea:focus, .sqlarea:focus {
                        border-color: var(--ua-crimson) !important;
                        box-shadow: inset 0 1px 3px rgba(20,22,26,.05), 0 0 0 3px var(--ua-tint) !important;
                      }

                      code, .jush-js {
                        font-family: var(--ua-mono);
                        background: var(--ua-editor-bg);
                        color: var(--ua-editor-fg);
                        border-radius: 4px;
                        padding: 1px 5px;
                      }
                      .sql-footer { margin-top: 10px; }

                      /* ==========================================================================
                       * 9. TABLES — schema lists AND result grids: light surface, BLACK text.
                       * ========================================================================== */
                      table {
                        border-collapse: collapse;
                        margin: 6px 0 20px;
                        background: #ffffff;
                        border: 1px solid var(--ua-border);
                        border-radius: var(--ua-radius);
                        overflow: hidden;
                        font-size: 13px;
                        color: var(--ua-editor-fg) !important;
                      }

                      thead th, thead td {
                        background: #F7E5E9 !important;   /* crimson tint */
                        color: var(--ua-ink) !important;
                        font-weight: 600;
                        text-align: left;
                        padding: 8px 11px !important;
                        border-bottom: 2px solid var(--ua-tint-strong) !important;
                        white-space: nowrap;
                      }
                      thead th a, thead td a { color: var(--ua-ink) !important; }

                      tbody th, tbody td {
                        padding: 7px 11px !important;
                        border-bottom: 1px solid var(--ua-border) !important;
                        color: var(--ua-editor-fg) !important;
                        background: #ffffff !important;
                        vertical-align: top;
                      }
                      .odds tbody tr:nth-child(2n) td,
                      .odds tbody tr:nth-child(2n) th { background: #FAF9F7 !important; }

                      tbody tr:hover td, tbody tr:hover th { background: var(--ua-tint) !important; }

                      .js .checked td, .js .checked th,
                      .js .checkable .checked td, .js .checkable .checked th { background: var(--ua-tint-strong) !important; }

                      table code { background: transparent; padding: 0; }

                      /* Pagination */
                      .pages { border: none !important; box-shadow: none !important; padding: 4px 0; }
                      .pages a {
                        display: inline-block;
                        padding: 3px 9px; margin: 0 2px 0 0;
                        border: 1px solid var(--ua-border-strong);
                        border-radius: var(--ua-radius-sm);
                        color: var(--ua-ink-soft);
                      }
                      .pages a:hover { border-color: var(--ua-crimson); color: var(--ua-crimson); text-decoration: none; }

                      /* ==========================================================================
                       * 10. FOOTER ACTION BAR (.footer) — Adminer's sticky bulk-action bar. Native
                       *     default.css gives it a `box-shadow: 0 -5px 10px 10px var(--bg)` glow;
                       *     neutralize it so it's a clean inline row, never a floating dark/glowing
                       *     panel.
                       * ========================================================================== */
                      .footer {
                        position: static !important;   /* was sticky (default.css) — pin it inline so it's a clean action row, never a floating overlay */
                        box-shadow: none !important;
                        background: transparent !important;
                        border: none !important;
                        margin: 16px 0 0 !important;
                      }
                      .footer > div {
                        background: transparent !important;
                        box-shadow: none !important;
                        padding: 0 !important;
                      }
                      .footer fieldset {
                        display: inline-block;
                        background: #FCFBFA !important;
                        border: 1px solid var(--ua-border) !important;
                        box-shadow: none !important;
                      }

                      /* ==========================================================================
                       * 11. SAFETY — hide the DATABASE-level bulk "Drop" button.
                       *     Rationale: on the "Select database" page one bulk click drops an entire
                       *     provisioned tenant database. DROP is a single MySQL/PG privilege covering
                       *     both tables AND databases, so it can't be revoked at the grant level
                       *     without losing table-drop too — so we remove the accidental one-click
                       *     PATH instead. A deliberate `DROP DATABASE` typed in the SQL box still
                       *     works (intentional); table-level drop stays fully usable.
                       *
                       *     Scoping: the databases-list page is the ONLY page whose <form> contains
                       *     database checkboxes named `db[]` (verified in index.php: checkbox("db[]",…)
                       *     on the databases listing; the tables page uses `tables[]`/`check[]`). So
                       *     :has() targets exactly that form's Drop submit and nothing else. :has() is
                       *     Baseline-supported in current browsers; if it ever isn't, the button simply
                       *     reverts to visible (fail-safe, no breakage).
                       * ========================================================================== */
                      form:has(input[name="db[]"]) input[name="drop"],
                      form:has(input[name="db[]"]) input[value="Drop"] {
                        display: none !important;
                      }
                      /* Also drop the now-purposeless bulk "Selected" fieldset on that page so the
                         databases view doesn't show an empty action bar. */
                      form:has(input[name="db[]"]) .footer fieldset { display: none !important; }

                      /* ==========================================================================
                       * 12. MISC
                       * ========================================================================== */
                      /* Quiet ghost logout. Selector carries an extra class over `input[type=submit]`
                         so it out-specifies the crimson primary-button rule (which would otherwise win
                         and paint logout a heavy crimson block). */
                      .logout,
                      input[type=submit].logout,
                      input[type=button].logout {
                        display: inline-block;
                        padding: 5px 12px !important;
                        background: #ffffff !important;
                        color: var(--ua-ink-soft) !important;
                        border: 1px solid var(--ua-border-strong) !important;
                        border-radius: var(--ua-radius-sm);
                        box-shadow: none !important;
                        font-size: 12px;
                        font-weight: 600;
                        cursor: pointer;
                      }
                      .logout:hover,
                      input[type=submit].logout:hover {
                        background: #ffffff !important;
                        border-color: var(--ua-crimson) !important;
                        color: var(--ua-crimson) !important;
                      }

                      #lang { color: var(--ua-muted); font-size: 12px; }
                      hr { border: none; border-top: 1px solid var(--ua-border); margin: 18px 0; }

                      /* Narrow screens: let the native layout collapse gracefully (Adminer's own
                         #menuopen toggle still applies). max-width query only — contains no OS-scheme
                         token, so the dark-sheet trap stays disarmed. */
                      @media (max-width: 800px) {
                        #content { margin-left: 0 !important; padding-left: 16px !important; }
                        #menu { min-height: 0 !important; }
                      }

                      /* ==========================================================================
                       * 13. LOGIN FORM — hide the dead-end driver/server/username rows on these
                       *     auto-login consoles. Belt-and-suspenders for the AdminerHideLoginFields
                       *     plugin (db-console-plugin ConfigMap below, mounted at
                       *     /srv/adminer-plugins/adminer-hide-login-fields.php in the Deployment) --
                       *     if that plugin ever fails to load, this still hides the same three rows.
                       *     Scoping: these `name="auth[...]"` attributes are emitted only by Adminer's
                       *     core loginForm() (adminer.inc.php) and appear nowhere else in the app, so
                       *     :has() can't accidentally hide an unrelated row elsewhere. Password and
                       *     Database stay visible/usable either way — only System/Server/Username are
                       *     dead ends here (every other engine/server on the platform is unreachable
                       *     from this console; ADMINER_AUTOLOGIN_SERVER below pins all three).
                       * ========================================================================== */
                      tr:has(select[name="auth[driver]"]),
                      tr:has(input[name="auth[server]"]),
                      tr:has(input[name="auth[username]"]) {
                        display: none !important;
                      }
            ---
            # Adminer login-form plugin ConfigMap: hides the driver ("System"), server, and
            # username rows on the login form of these auto-login consoles.
            # ADMINER_AUTOLOGIN_SERVER (ExternalSecret below) already pins all three — and
            # every other engine/server on the platform is unreachable from here anyway — so
            # leaving them editable is a dead end that only confuses a team ("what do I put
            # here?"), not a real choice. Mounted into /srv/adminer-plugins/ alongside the
            # entrypoint-copied adminer-autologin.php (dbconsole-deploy below, same directory,
            # different file); Adminer 5's own plugin loader glob()s every *.php file it finds
            # there and auto-instantiates any class extending Adminer\Plugin (confirmed against
            # the live dockette/adminer:5.4.2 index.php: `Plugins::__construct` does
            # `foreach(glob("adminer-plugins/*.php") as $p) $this->includeOnce($p)`, then
            # `get_declared_classes()` picks up subclasses of Adminer\Plugin) — no extra wiring
            # needed beyond the volume mount below.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-dbconsole-plugin" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "dbconsole-plugin-cm" }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: db-console-plugin
                    namespace: {{ $consoleNs | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                  data:
                    adminer-hide-login-fields.php: |
                      <?php

                      /**
                       * UA-MIS DB console — hide the unusable login-form fields on these auto-login
                       * consoles. System (driver), Server, and Username are all pinned by
                       * ADMINER_AUTOLOGIN_SERVER (adminer-autologin.php, same
                       * /srv/adminer-plugins/ directory) — there is nowhere else for a team to
                       * point them, so an editable field is a dead end, not a real choice.
                       * Returning '' from loginFormField() suppresses that row entirely
                       * (Adminer's Plugins::__call gives the first non-null hook result priority,
                       * short-circuiting the built-in row for that field name); returning null
                       * (the implicit default below for password/db) leaves Adminer's normal row
                       * untouched, so Password and Database keep working exactly as before.
                       *
                       * Belt-and-suspenders: adminer.css (db-console-css ConfigMap, section 13)
                       * hides these same rows by selector too, in case this plugin ever fails to
                       * load.
                       *
                       * @link https://www.adminer.org/en/plugins/#use
                       */
                      class AdminerHideLoginFields extends Adminer\Plugin {
                        function loginFormField($name, $heading, $value) {
                          if (in_array($name, array('driver', 'server', 'username'))) {
                            return '';
                          }
                        }
                      }
            ---
            # ExternalSecret: assembles ADMINER_AUTOLOGIN_SERVER from the console leaf --
            # NO db path in the DSN, so Adminer's autologin plugin logs into the SERVER
            # only (empty `db`) and lands on its own database list/switcher, populated by
            # the Grants above. Depends on the console PushSecret so it doesn't spin on a
            # not-yet-populated Vault leaf on first apply.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-dbconsole-es" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "dbconsole-es" }}
            spec:
              providerConfigRef:
                name: default
              references:
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-console-db-push" $team | quote }}
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: db-console
                    namespace: {{ $consoleNs | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                  spec:
                    refreshInterval: "1h"
                    secretStoreRef:
                      name: vault-tenant
                      kind: SecretStore
                    target:
                      name: db-console
                      creationPolicy: Owner
                      # Retain (the ESO default), NOT Delete -- same rationale as the
                      # Postgres db-console ES below: on a fresh tenant the console Vault
                      # leaf (tenants/<team>/console/database) and/or the vault-tenant
                      # SecretStore are briefly absent/not-ready at first reconcile, and
                      # Delete treats that transient-missing leaf as "provider secret gone"
                      # -> silently DELETES the target and reports SecretDeleted (a success
                      # state), so it will not retry until refreshInterval (1h), leaving the
                      # db-console Deployment stuck in CreateContainerConfigError. Retain
                      # makes it a SecretSyncedError that requeues on backoff / on the
                      # SecretStore going Ready, so the secret materializes within minutes.
                      deletionPolicy: Retain
                      template:
                        engineVersion: v2
                        data:
                          ADMINER_AUTOLOGIN_SERVER: "server://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@{{ `{{ .host }}` }}:{{ `{{ .port }}` }}"
                    data:
                      - secretKey: username
                        remoteRef:
                          key: {{ printf "tenants/%s/console/database" $team | quote }}
                          property: username
                      - secretKey: password
                        remoteRef:
                          key: {{ printf "tenants/%s/console/database" $team | quote }}
                          property: password
                      - secretKey: host
                        remoteRef:
                          key: {{ printf "tenants/%s/console/database" $team | quote }}
                          property: host
                      - secretKey: port
                        remoteRef:
                          key: {{ printf "tenants/%s/console/database" $team | quote }}
                          property: port
            ---
            # Deployment: dockette/adminer:mysql -- identical pod spec to the retired per-env consoles
            # (see git history for the non-root-UID / adminer-plugins emptyDir
            # rationale), plus the adminer.css mount.
            #
            # Image pinned by digest (Adminer 5.4.4, same build family as db-admin's
            # dockette/adminer:full -- see platform-services/db-admin/deployment.yaml's
            # "Invalid server." comment block for the full 5.4.4 root cause). Was the
            # floating `dockette/adminer:mysql` tag; live-tested against a running
            # tenant console (ADMINER_AUTOLOGIN_SERVER uses the real host:port as
            # SERVER, which -- unlike db-admin's server-list plugin -- already satisfies
            # Adminer 5.4.3+'s `^[-a-z0-9.:]*$` validation, so auto-login itself was
            # NOT broken here; this is a stability/parity pin only, not a functional fix.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-dbconsole-deploy" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "dbconsole-deploy" }}
            spec:
              providerConfigRef:
                name: default
              # provider-kubernetes Object has no `.metadata.references` field (server
              # dry-run rejects it -- this is the #281/#283 bug); dependsOn belongs under
              # `spec.references`, same as every other cross-Object dependency in this
              # file.
              references:
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-dbconsole-es" $team | quote }}
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-dbconsole-css" $team | quote }}
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-dbconsole-plugin" $team | quote }}
              forProvider:
                manifest:
                  apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: db-console
                    namespace: {{ $consoleNs | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                      app.kubernetes.io/name: db-console
                  spec:
                    replicas: 1
                    selector:
                      matchLabels:
                        app.kubernetes.io/name: db-console
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/name: db-console
                          platform.capstone/team: {{ $team | quote }}
                      spec:
                        containers:
                          - name: adminer
                            image: dockette/adminer:mysql@sha256:e35d484253c91131080bacfcf99df1bd62fb22e13e61314cd0202f0bbfee7c6a
                            imagePullPolicy: IfNotPresent
                            env:
                              - name: ADMINER_PLUGIN_AUTOLOGIN
                                value: "1"
                              - name: PORT
                                value: "8080"
                              - name: ADMINER_BANNER
                                value: "0"
                              - name: ADMINER_AUTOLOGIN_SERVER
                                valueFrom:
                                  secretKeyRef:
                                    name: db-console
                                    key: ADMINER_AUTOLOGIN_SERVER
                            ports:
                              - containerPort: 8080
                            # Bumped from requests 10m/32Mi, limits mem-only 64Mi (operator-reported
                            # incident, 2026-07-10: the DB console crashes under a heavy query/click
                            # load — same class of bug as the Grafana fix in
                            # applicationsets/kube-prometheus-stack-app.yaml, see that file's comment
                            # for the full live-cluster diagnosis method). Adminer buffers whole result
                            # sets/HTML tables in PHP memory, so a big SELECT or bulk export under a
                            # 64Mi ceiling (only 32Mi of headroom above the request) is an easy OOMKill;
                            # no cpu limit existed at all, which is itself a Kyverno require-limits
                            # violation in this namespace (db-console namespaces are NOT in that
                            # policy's exclude list, unlike `monitoring` — confirmed live via
                            # `kubectl get events` showing PolicyViolation warnings on db-admin-console,
                            # same pod spec pattern as this one). New limits keep both cpu+memory set
                            # (satisfies require-limits) with real headroom: 4x the old memory ceiling,
                            # and a cpu limit generous enough (500m) not to throttle a heavy query/render
                            # burst while still bounding a single console on this shared homelab cluster.
                            resources:
                              requests: { cpu: "50m", memory: "64Mi" }
                              limits: { cpu: "500m", memory: "256Mi" }
                            securityContext:
                              allowPrivilegeEscalation: false
                              runAsNonRoot: true
                              runAsUser: 1000
                              capabilities:
                                drop: ["ALL"]
                              seccompProfile:
                                type: RuntimeDefault
                            volumeMounts:
                              - name: adminer-plugins
                                mountPath: /srv/adminer-plugins
                              - name: adminer-plugin-hide-login
                                mountPath: /srv/adminer-plugins/adminer-hide-login-fields.php
                                subPath: adminer-hide-login-fields.php
                                readOnly: true
                              - name: adminer-css
                                mountPath: /srv/adminer.css
                                subPath: adminer.css
                                readOnly: true
                        volumes:
                          - name: adminer-plugins
                            emptyDir: {}
                          - name: adminer-plugin-hide-login
                            configMap:
                              name: db-console-plugin
                          - name: adminer-css
                            configMap:
                              name: db-console-css
                        securityContext:
                          fsGroup: 1000
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation "dbconsole-svc" }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: db-console
                    namespace: {{ $consoleNs | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                  spec:
                    selector:
                      app.kubernetes.io/name: db-console
                    ports:
                      - port: 80
                        targetPort: 8080
            ---
            # Traefik forwardAuth Middleware -- team-scoped (allowed_groups=UA-MIS:<team>),
            # unchanged in shape from the retired per-env version, just rendered once.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation "dbconsole-mw" }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: traefik.io/v1alpha1
                  kind: Middleware
                  metadata:
                    name: db-console-auth
                    namespace: {{ $consoleNs | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                  spec:
                    forwardAuth:
                      address: {{ printf "http://oauth2-proxy.db-console-auth.svc.cluster.local:4180/oauth2/auth?allowed_groups=UA-MIS:%s" $team | quote }}
                      trustForwardHeader: true
                      authResponseHeaders:
                        - X-Auth-Request-User
                        - X-Auth-Request-Email
                        - X-Auth-Request-Groups
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation "dbconsole-ing" }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: Ingress
                  metadata:
                    name: db-console
                    namespace: {{ $consoleNs | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                    annotations:
                      # Chain order matters: Traefik applies middlewares in list order,
                      # each wrapping the next, so the `errors` middleware (outermost)
                      # must be listed BEFORE the forwardAuth middleware (innermost) to
                      # catch the 401 it returns and rewrite it to a 302 login redirect.
                      # Cross-namespace ref requires providers.kubernetesCRD.
                      # allowCrossNamespace (applicationsets/traefik-app.yaml).
                      traefik.ingress.kubernetes.io/router.middlewares: {{ printf "db-console-auth-oauth2-proxy-errors@kubernetescrd,%s-db-console-auth@kubernetescrd" $consoleNs | quote }}
                  spec:
                    rules:
                      - host: {{ printf "%s-db.%s" $team $domain | quote }}
                        http:
                          paths:
                            - path: /
                              pathType: Prefix
                              backend:
                                service:
                                  name: db-console
                                  port:
                                    number: 80
                    tls:
                      - hosts:
                          - {{ printf "%s-db.%s" $team $domain | quote }}
            {{- end }}

            {{- /* =====================================================================
                   DATABASE — automatic per-(team,env) POSTGRES provisioning (ADR-033).
                   The exact structural mirror of the MySQL block above, gated on
                   `database == "postgres"` (mutually exclusive with mysql — the XRD enum
                   is a single value, so at most ONE of the two blocks ever renders; no
                   Vault-leaf or connection-secret collision). Runs against the SAME
                   off-cluster DB tier box (ua-mis-db-1 also runs PG17) via a SECOND
                   provider-sql ProviderConfig `db-tier-postgres` (config/
                   providerconfig-postgres.yaml). provider-sql is one provider that speaks
                   both engines — same controller pod, so the crossplane-db egress netpol
                   (hardening/netpol-controlplane/crossplane-db-cnp.yaml) covers it (it now
                   allows TCP/5432 as well as 3306).

                   Per env we mint, on postgresql.sql.crossplane.io/v1alpha1:
                     • Database `<teamDb>_<env>`  owned BY the tenant Role (the team owns
                                                   its own DB, PG-idiomatic — the owner has
                                                   full control incl. schema creation)
                     • Role     `<teamDb>_<env>`  LOGIN role; password AUTO-GENERATED by
                                                   provider-sql (never templated → no per-
                                                   reconcile churn; same reliability
                                                   rationale as the MySQL User / Harbor
                                                   robot Variant-2)
                     • Grant    CONNECT+CREATE+TEMPORARY on that DB to that Role (explicit
                                                   database-level ALL; mirrors the MySQL
                                                   `Grant: ALL`)
                   The Role's connection secret (crossplane-system, writeConnectionSecret-
                   ToRef) carries the generated password; an ESO PushSecret bridges the
                   SAME four parts (username/password/host/port) into Vault at the SAME
                   ADR-033 leaf the MySQL block uses — tenants/<team>/<env>/database — so
                   the consumer DATABASE_URL ExternalSecret is engine-agnostic (it only
                   swaps the DSN scheme to postgresql://). dbname = the fixed structural
                   rule `<teamDb>_<env>` (pinned via crossplane.io/external-name), NOT
                   stored in Vault.

                   ⚠ Phase-0 (DB tier not live, PR #29): confirm against provider-sql
                   v0.15.0 CRDs — (a) group postgresql.sql.crossplane.io/v1alpha1 for
                   Database/Role/Grant; (b) the Role connection-secret KEY NAMES (assumed
                   username/password/endpoint/port as for the MySQL User — endpoint mapped
                   to `host` below); (c) that the captured password does NOT diff on
                   steady-state reconcile; (d) ORDERING — Database.owner references the
                   Role, which may not exist on the first reconcile; Crossplane retries so
                   it converges, but verify no permanent error; (e) the provisioner login
                   is SUPERUSER on this DEDICATED tenant-only cluster (tenant-cluster/
                   roles.yaml) — it therefore creates the role, creates the DB OWNED BY that
                   role, AND (critically) can DROP the DB on teardown. Postgres allows
                   DROP DATABASE only to the owner or a superuser, so a non-super provisioner
                   that merely holds CREATEROLE membership in the owner role can CREATE but
                   NOT DROP (42501) — which wedged the first PG teardown; superuser closes
                   both create and drop with zero isolation cost (apps stay non-super); (f)
                   REDUNDANCY — since the Role OWNS the DB it already holds these privileges,
                   so the Grant may reconcile to a no-op; if it ever shows a perpetual diff,
                   drop it (owner alone suffices). (g) PG15+
                   locks down the `public` schema (no implicit CREATE for non-owners); the
                   role owning the DATABASE does not by itself own `public`. If apps write
                   to `public`, a follow-up may need a schema-level Grant or
                   `ALTER SCHEMA public OWNER TO <role>` — track at go-live.
                   ===================================================================== */}}
            {{- if eq $database "postgres" }}
            {{- range $e := $envs }}
            {{- $dbName := printf "%s_%s" $teamDb $e.name }}
            {{- $connSecret := printf "%s-%s-db" $team $e.name }}
            ---
            # The per-env login Role. No passwordSecretRef -> provider-sql generates the
            # password and writes it (plus username/endpoint/port) to the connection
            # secret in crossplane-system. STABLE across reconciles (generated once).
            apiVersion: postgresql.sql.crossplane.io/v1alpha1
            kind: Role
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "sql-role-%s" $e.name) }}
                crossplane.io/external-name: {{ $dbName | quote }}
            spec:
              forProvider:
                privileges:
                  login: true          # a plain connectable app login — NOT createdb/createrole/superuser
              writeConnectionSecretToRef:
                namespace: crossplane-system
                name: {{ $connSecret | quote }}
              providerConfigRef:
                name: db-tier-postgres
            ---
            # NOTE (TENANT-PG-DROP fix): PR #366 previously minted a MEMBERSHIP Grant here
            # (crossplane_provisioner memberOf <teamDb>_<env>) so the NON-superuser provisioner
            # could `SET ROLE` and run `CREATE DATABASE ... OWNER <teamDb>_<env>`. That made
            # CREATE work but left teardown DEAD-LOCKED: Postgres allows `DROP DATABASE` only to
            # the OWNER or a SUPERUSER — membership in the owner role is NOT enough, and
            # provider-sql does not SET ROLE before dropping — so the first PG teardown wedged on
            #   delete failed: cannot drop database: pq: must be owner of database <db> (42501).
            # Fix: `crossplane_provisioner` is now SUPERUSER on the DEDICATED, tenant-only
            # `capstone-tenant-pg` cluster (platform-services/cnpg/tenant-cluster/roles.yaml).
            # A superuser creates an owned DB directly (no SET-ROLE membership needed) AND can
            # DROP it, so CREATE and DROP both close automatically. The #366 membership Grant is
            # therefore REMOVED (redundant under superuser; it only added an MR that had to be
            # pruned on every teardown). Isolation is unchanged: tenant apps still connect as
            # their own login-only, non-super per-env Role below, scoped by role/grant.
            #
            # The per-env database, OWNED by the tenant Role (team owns its own DB).
            apiVersion: postgresql.sql.crossplane.io/v1alpha1
            kind: Database
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "sql-db-%s" $e.name) }}
                crossplane.io/external-name: {{ $dbName | quote }}
            spec:
              forProvider:
                owner: {{ $dbName | quote }}     # the Role above (name == dbName)
                encoding: UTF8
              providerConfigRef:
                name: db-tier-postgres
            ---
            # Explicit database-level privileges to the tenant Role (mirrors the MySQL
            # `Grant: ALL`). CONNECT+CREATE+TEMPORARY is database-level ALL in Postgres.
            apiVersion: postgresql.sql.crossplane.io/v1alpha1
            kind: Grant
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "sql-grant-%s" $e.name) }}
            spec:
              forProvider:
                role: {{ $dbName | quote }}
                database: {{ $dbName | quote }}
                privileges:
                  - CONNECT
                  - CREATE
                  - TEMPORARY
              providerConfigRef:
                name: db-tier-postgres
            ---
            # Bridge the generated DB creds into Vault at the ADR-033 contract path
            # tenants/<team>/<env>/database (properties: username, password, host, port) —
            # the SAME leaf + property names the MySQL block writes, so track-4's DATABASE_URL
            # ExternalSecret reads them identically (only its DSN scheme differs). Rendered
            # via provider-kubernetes Object into crossplane-system (next to the connection
            # secret) using the platform `vault-push` writer SecretStore. ONE writer per
            # Vault leaf (mysql/postgres are mutually exclusive → no dual-owner clobber).
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-%s-db-push" $team $e.name | quote }}
              annotations:
                {{ setResourceNameAnnotation (printf "push-db-%s" $e.name) }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1alpha1
                  kind: PushSecret
                  metadata:
                    name: {{ printf "%s-%s-db" $team $e.name | quote }}
                    namespace: crossplane-system
                    labels:
                      platform.capstone/component: platform
                      platform.capstone/team: {{ $team | quote }}
                  spec:
                    refreshInterval: "1h"
                    secretStoreRefs:
                      - name: vault-push
                        kind: SecretStore
                    selector:
                      secret:
                        name: {{ $connSecret | quote }}   # provider-sql Role connection secret
                    data:
                      - match:
                          secretKey: username
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                            property: username
                      - match:
                          secretKey: password
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                            property: password
                      # provider-sql publishes the server as `endpoint` -> store as `host`.
                      - match:
                          secretKey: endpoint
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                            property: host
                      - match:
                          secretKey: port
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/%s/database" $team $e.name | quote }}
                            property: port
            {{- end }}
            {{- /* =====================================================================
                   TEAM DB CONSOLE (Postgres) -- ONE Adminer per TEAM (not per
                   env), per user feedback on the original per-env design (design doc
                   artifacts/research/tenant-db-access.md §3/§4/§7). Autologin server carries
                   NO fixed db path, so Adminer's own #dbs switcher (a real
                   <select name="db">, confirmed against the live dockette/adminer:5.4.2
                   image's index.php) lists every database the console's DB user has been
                   granted -- populated by the per-env Grants below, so it always tracks
                   whatever $envs is at render time.

                   Lives in the team's OWN dev namespace ({{ $team }}-dev) -- a deliberate
                   reuse, not a new namespace: that namespace already has the exact
                   plumbing a per-team (not per-env) resource needs -- the vault-tenant
                   SecretStore + eso-tenant SA rendered above, both scoped to the WHOLE
                   tenant-<team> Vault policy (secret/data/tenants/<team>/*), not just the
                   dev env. No new namespace/quota/PSA/netpol/AppProject-destination is
                   needed as a result (dev's existing egress-to-db-tier rule already
                   covers this pod). status.dbConsoleUrl (bottom of this template)
                   reflects the same <team>-db host.

                   Console user: `<teamDb>_console`, granted the SAME privilege level the
                   per-env app users/roles already hold, on EVERY per-env schema (see the
                   Grant loop below). Password Vault leaf: tenants/<team>/console/database
                   (SAME shape/properties as the per-env tenants/<team>/<env>/database
                   leaves, just a `console` slot instead of dev/staging/prod, so it reuses
                   the SAME ExternalSecret/PushSecret pattern verbatim).
                   ===================================================================== */}}
            {{- $consoleUser := printf "%s_console" $teamDb }}
            {{- $consoleConnSecret := printf "%s-console-db" $team }}
            {{- $consoleNs := printf "%s-dev" $team }}
            ---
            # The shared team-console login role. No passwordSecretRef ->
            # provider-sql generates the password (stable across reconciles, same
            # rationale as the per-env Roles above). login-only, same as the per-env
            # Roles -- not createdb/createrole/superuser.
            apiVersion: postgresql.sql.crossplane.io/v1alpha1
            kind: Role
            metadata:
              annotations:
                {{ setResourceNameAnnotation "sql-role-console" }}
                crossplane.io/external-name: {{ $consoleUser | quote }}
            spec:
              forProvider:
                privileges:
                  login: true
              writeConnectionSecretToRef:
                namespace: crossplane-system
                name: {{ $consoleConnSecret | quote }}
              providerConfigRef:
                name: db-tier-postgres
            {{- range $e := $envs }}
            ---
            # CONNECT+CREATE+TEMPORARY on EVERY per-env database -- the same grant the
            # per-env app Role for that env already holds (mirrors the Grant in the
            # per-env loop above; the per-env Role also OWNS its own db, so this is
            # explicit database-level access for the console Role, which owns nothing).
            apiVersion: postgresql.sql.crossplane.io/v1alpha1
            kind: Grant
            metadata:
              annotations:
                {{ setResourceNameAnnotation (printf "sql-grant-console-%s" $e.name) }}
            spec:
              forProvider:
                role: {{ $consoleUser | quote }}
                database: {{ printf "%s_%s" $teamDb $e.name | quote }}
                privileges:
                  - CONNECT
                  - CREATE
                  - TEMPORARY
              providerConfigRef:
                name: db-tier-postgres
            {{- end }}
            ---
            # Bridge the console user's generated creds into Vault at the `console` leaf
            # (same four properties as the per-env `database` leaves).
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-console-db-push" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "push-db-console" }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1alpha1
                  kind: PushSecret
                  metadata:
                    name: {{ printf "%s-console-db" $team | quote }}
                    namespace: crossplane-system
                    labels:
                      platform.capstone/component: platform
                      platform.capstone/team: {{ $team | quote }}
                  spec:
                    refreshInterval: "1h"
                    secretStoreRefs:
                      - name: vault-push
                        kind: SecretStore
                    selector:
                      secret:
                        name: {{ $consoleConnSecret | quote }}
                    data:
                      - match:
                          secretKey: username
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/console/database" $team | quote }}
                            property: username
                      - match:
                          secretKey: password
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/console/database" $team | quote }}
                            property: password
                      - match:
                          secretKey: endpoint
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/console/database" $team | quote }}
                            property: host
                      - match:
                          secretKey: port
                          remoteRef:
                            remoteKey: {{ printf "tenants/%s/console/database" $team | quote }}
                            property: port
            ---
            # UA-MIS theme ConfigMap. Mounted straight to /srv/adminer.css via subPath in
            # the Deployment below -- bypasses the /srv root:root 0755 write-wall the
            # adminer-plugins emptyDir fix below also works around: Adminer's own css()
            # helper (index.php) does file_exists("adminer.css") relative to its cwd and
            # links it in if present, so no ADMINER_THEME env/entrypoint cooperation is
            # needed, and the kubelet creates this bind mount as root at container-create
            # time (before the UID-1000 process starts), so /srv's permissions never come
            # into it -- a different mechanism than entrypoint.sh's in-container `cp` for
            # adminer-plugins, which IS blocked by them.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-dbconsole-css" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "dbconsole-css-cm" }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: db-console-css
                    namespace: {{ $consoleNs | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                  data:
                    adminer.css: |
                      /*
                       * University of Alabama MIS — Adminer theme (tenant DB console + db-admin console).
                       * ONE committed LIGHT theme. Crimson #9E1B32 accents, warm-white surfaces, dark
                       * readable text, a light-grey / black-mono SQL editor + result grid.
                       *
                       * ============================================================================
                       * WHY THERE IS NO DARK VARIANT / NO OS-ADAPTIVE STYLING (read before editing)
                       * ============================================================================
                       * Adminer's loader (index.php `css()`) scans this file's TEXT and, if it finds
                       * the token that spells the CSS dark-scheme media feature, flips this sheet from
                       * "light" to "adaptive" AND ALSO links Adminer's OWN built-in dark stylesheet
                       * gated to the visitor's OS dark setting. A previous revision of this theme had
                       * that exact token sitting harmlessly in a code comment — which made Adminer pull
                       * in its dark sheet for anyone whose OS was in dark mode, and THAT sheet (not this
                       * one) painted the broken dark-navy action bar / dark panels over our light theme.
                       *
                       * So this file DELIBERATELY contains that token NOWHERE — not in a rule, not in a
                       * comment, not in a media query. We force a single light look for every visitor
                       * regardless of OS via the variable overrides below + `color-scheme: light`. If
                       * you ever add an OS-dark media block here you will silently re-arm that trap.
                       *
                       * ============================================================================
                       * HOW IT WORKS — override Adminer's OWN design tokens, don't fight each element.
                       * ============================================================================
                       * Adminer 5.4.2's default.css drives nearly everything from four CSS variables on
                       * <html>:  --bg (surfaces), --fg (text), --dim (th / secondary surfaces),
                       * --lit (thead + selected-row + :target highlight). Re-defining those four (with
                       * !important, and since this sheet loads AFTER default.css) recolors the bulk of
                       * the UI coherently in one place. We then layer crimson accents + an editor/grid
                       * polish on top, and otherwise WORK WITH Adminer's native layout (a ~19em
                       * absolute left #menu, #content offset 21em, an absolute #breadcrumb) rather than
                       * re-positioning it — the prior fixed-position surgery is what produced the
                       * partial-width header strip and the empty full-height sidebar column.
                       *
                       * DOM verified against the LIVE dockette/adminer:mysql image (Adminer 5.4.2):
                       *   #menu (left nav, holds #dbs the DB switcher + table lists), #content (h1,
                       *   #breadcrumb, tables, forms), .footer > fieldset (the bulk "Selected (N)"
                       *   action bar), textarea.sqlarea.jush-sql (the SQL editor — a PLAIN textarea,
                       *   no JS overlay). CSS is auto-loaded by Adminer via file_exists("adminer.css")
                       *   relative to its docroot (/srv), linked after default.css.
                       */

                      /* ==========================================================================
                       * 1. DESIGN TOKENS
                       *    (a) Override Adminer's four native variables -> light palette.
                       *    (b) Our own namespaced palette for the accent layer.
                       * ========================================================================== */
                      html {
                        /* Adminer's own tokens — the single biggest lever. */
                        --bg:  #ffffff !important;   /* primary surfaces */
                        --fg:  #1a1c20 !important;   /* body text — near-black, high contrast */
                        --dim: #f0eeea !important;   /* th / secondary surfaces — warm light grey */
                        --lit: #f7e5e9 !important;   /* thead + selected-row + :target — crimson tint */
                        color-scheme: light;         /* keep UA form controls / scrollbars light on dark OS */
                      }

                      :root {
                        --ua-crimson:      #9E1B32;
                        --ua-crimson-dark: #7A1426;
                        --ua-tint:         rgba(158, 27, 50, 0.08);
                        --ua-tint-strong:  rgba(158, 27, 50, 0.16);

                        --ua-ink:      #1A1C20;
                        --ua-ink-soft: #4A4642;
                        --ua-muted:    #79736D;

                        --ua-page:     #ffffff;
                        --ua-sidebar:  #F5F3F0;     /* barely-grey sidebar surface */
                        --ua-border:   #E4E1DB;
                        --ua-border-strong: #D3CFC8;

                        --ua-editor-bg: #F5F5F5;    /* light-grey code surface */
                        --ua-editor-fg: #14161A;    /* black-ish mono text */

                        --ua-ok:    #1C7C4A;
                        --ua-ok-bg: #EAF6EF;
                        --ua-err:   #B3261E;
                        --ua-err-bg:#FCEBEA;

                        --ua-radius:    8px;
                        --ua-radius-sm: 6px;
                        --ua-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
                        --ua-mono: "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
                      }

                      /* ==========================================================================
                       * 2. BASE
                       * ========================================================================== */
                      html { box-sizing: border-box; }
                      *, *:before, *:after { box-sizing: inherit; }

                      body {
                        background: var(--ua-page) !important;
                        color: var(--ua-ink) !important;
                        font-family: var(--ua-font) !important;
                        font-size: 14px;
                        line-height: 1.55;
                        -webkit-font-smoothing: antialiased;
                      }

                      a { color: var(--ua-crimson); text-decoration: none; }
                      a:hover { color: var(--ua-crimson-dark); text-decoration: underline; }

                      /* ==========================================================================
                       * 3. LEFT SIDEBAR (#menu) — native Adminer position (absolute, ~19em, left:0).
                       *    We give it a light surface, a clear right border, a min-height so it reads
                       *    as a real column even when its content is short, and the UA-MIS wordmark.
                       * ========================================================================== */
                      #menu {
                        background: var(--ua-sidebar) !important;
                        border-right: 1px solid var(--ua-border) !important;
                        min-height: calc(100vh - 2em) !important;
                        padding: 16px 16px 32px !important;
                        margin: 0 !important;
                        top: 0 !important;               /* start at the very top so the wordmark aligns */
                      }

                      /* UA-MIS wordmark at the top of the sidebar (inline SVG data-URI — no external
                         asset host, offline-safe). */
                      #menu:before {
                        content: "";
                        display: block;
                        height: 34px;
                        margin: 0 0 16px 2px;
                        background: url("data:image/svg+xml;utf8,\
                      <svg xmlns='http://www.w3.org/2000/svg' width='210' height='34' viewBox='0 0 210 34'>\
                      <rect width='34' height='34' rx='6' fill='%239E1B32'/>\
                      <text x='17' y='24' text-anchor='middle' font-family='Georgia, serif' font-size='19' font-weight='700' fill='%23FFFFFF'>A</text>\
                      <text x='44' y='16' font-family='-apple-system, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='%231A1C20' letter-spacing='.3'>UA-MIS</text>\
                      <text x='44' y='29' font-family='-apple-system, Helvetica, Arial, sans-serif' font-size='10' font-weight='500' fill='%2379736D' letter-spacing='.3'>DB Console</text>\
                      </svg>") no-repeat left center;
                        background-size: contain;
                      }

                      /* Nav section headings (Tables / Views / …) rendered as <p> in the menu. */
                      #menu p {
                        font-size: 11px;
                        font-weight: 700;
                        text-transform: uppercase;
                        letter-spacing: .05em;
                        color: var(--ua-muted);
                        margin: 16px 0 6px !important;
                        border: none !important;
                        background: none !important;
                      }

                      #menu a {
                        color: var(--ua-ink) !important;
                        display: inline-block;
                        padding: 3px 8px;
                        margin: 1px 0;
                        border-radius: var(--ua-radius-sm);
                        border: none !important;
                        text-transform: none;   /* nav/table links stay normal-case; only the <p> section headings are uppercased */
                      }
                      #menu a:hover {
                        background: var(--ua-tint) !important;
                        color: var(--ua-crimson-dark) !important;
                        text-decoration: none;
                        box-shadow: inset 2px 0 0 0 var(--ua-crimson);
                      }
                      #menu a.active,
                      #menu a:active {
                        background: var(--ua-tint-strong) !important;
                        color: var(--ua-crimson-dark) !important;
                        box-shadow: inset 3px 0 0 0 var(--ua-crimson);
                      }

                      /* #dbs — the database switcher (the dropdown listing <team>_dev/staging/prod). */
                      #dbs {
                        margin: 0 0 12px !important;
                        padding: 0 !important;
                        border: none !important;
                      }
                      #dbs label { font-weight: 600; color: var(--ua-ink-soft); }

                      /* Sidebar toggle handle */
                      #menuopen { color: var(--ua-muted); }

                      /* ==========================================================================
                       * 4. CONTENT + BREADCRUMB
                       *    #breadcrumb is natively position:absolute with NO width, so ANY colored
                       *    background would render as a short partial strip. We keep it text-only
                       *    (transparent) — no strip, nothing can look "cut off".
                       * ========================================================================== */
                      #content {
                        padding: 8px 32px 48px 28px !important;
                        max-width: 1180px;
                      }

                      #breadcrumb {
                        background: transparent !important;
                        box-shadow: none !important;
                        border: none !important;
                        height: auto !important;
                        line-height: 1.6 !important;
                        padding: 6px 0 !important;
                        margin: 0 0 4px -6px !important;
                        font-size: 12px;
                        color: var(--ua-muted);
                      }
                      #breadcrumb a { color: var(--ua-crimson); }
                      #breadcrumb a:hover { color: var(--ua-crimson-dark); }

                      /* ==========================================================================
                       * 5. TYPOGRAPHY
                       * ========================================================================== */
                      h1 {
                        font-size: 21px;
                        font-weight: 700;
                        color: var(--ua-ink);
                        background: none !important;
                        border: none !important;
                        border-bottom: 2px solid var(--ua-tint-strong) !important;
                        padding: 0 0 10px !important;
                        margin: 4px 0 20px !important;
                      }
                      h1 .version { font-size: 11px; font-weight: 400; color: var(--ua-muted); opacity: .7; }
                      h1 a[href*="adminer.org"] { display: none !important; }   /* hide upstream donate/version chrome */

                      h2 {
                        font-size: 16px;
                        font-weight: 600;
                        color: var(--ua-ink);
                        background: none !important;   /* was --lit; keep clean, use a border accent instead */
                        border: none !important;
                        border-bottom: 2px solid var(--ua-tint-strong) !important;
                        padding: 0 0 8px !important;
                        margin: 26px 0 14px !important;
                      }
                      h3 { font-size: 14px; font-weight: 600; color: var(--ua-ink-soft); margin: 16px 0 8px; }

                      p { color: var(--ua-ink-soft); }

                      /* ==========================================================================
                       * 6. MESSAGES / ALERTS
                       * ========================================================================== */
                      .message, .error {
                        display: block;
                        border-radius: var(--ua-radius);
                        padding: 10px 14px !important;
                        margin: 0 0 16px !important;
                        font-weight: 500;
                        background-image: none !important;
                        box-shadow: none !important;
                      }
                      .message { background: var(--ua-ok-bg) !important;  color: var(--ua-ok) !important;  border: 1px solid rgba(28,124,74,.25); }
                      .error   { background: var(--ua-err-bg) !important; color: var(--ua-err) !important; border: 1px solid rgba(179,38,30,.25); }

                      /* ==========================================================================
                       * 7. FORMS — inputs / selects / buttons
                       * ========================================================================== */
                      fieldset {
                        border: 1px solid var(--ua-border) !important;
                        border-radius: var(--ua-radius);
                        padding: 12px 14px !important;
                        margin: 0 0 14px !important;
                        background: #FCFBFA !important;
                        box-shadow: none !important;
                      }
                      legend {
                        color: var(--ua-ink-soft);
                        font-weight: 600;
                        padding: 0 6px;
                      }

                      input[type=text], input[type=password], input[type=number],
                      input[type=search], input[type=email], input:not([type]), select, textarea {
                        font-family: var(--ua-font);
                        font-size: 13px;
                        color: var(--ua-ink);
                        background: #ffffff;
                        border: 1px solid var(--ua-border-strong);
                        border-radius: var(--ua-radius-sm);
                        padding: 6px 9px;
                        transition: border-color .12s ease, box-shadow .12s ease;
                      }
                      input[type=text]:focus, input[type=password]:focus, input[type=number]:focus,
                      input[type=search]:focus, input[type=email]:focus, input:not([type]):focus,
                      select:focus, textarea:focus {
                        outline: none;
                        border-color: var(--ua-crimson);
                        box-shadow: 0 0 0 3px var(--ua-tint);
                      }

                      /* Primary submit buttons — crimson (matches ArgoCD/Grafana). */
                      input[type=submit], input[type=button], button {
                        font-family: var(--ua-font);
                        font-size: 13px;
                        font-weight: 600;
                        color: #ffffff !important;
                        background: var(--ua-crimson) !important;
                        border: 1px solid var(--ua-crimson) !important;
                        border-radius: var(--ua-radius-sm);
                        padding: 6px 15px;
                        cursor: pointer;
                        transition: background-color .12s ease, border-color .12s ease;
                      }
                      input[type=submit]:hover, input[type=button]:hover, button:hover {
                        background: var(--ua-crimson-dark) !important;
                        border-color: var(--ua-crimson-dark) !important;
                      }

                      /* Destructive actions (drop / delete) — quiet GHOST style, never a bold crimson
                         button, so they don't invite a click. Red only on hover. (DB-level drop is
                         hidden entirely below.) */
                      input[name=drop], input[name=delete], input[name=truncate], input[value=Drop], input[value=Delete] {
                        color: var(--ua-err) !important;
                        background: #ffffff !important;
                        border: 1px solid var(--ua-border-strong) !important;
                        font-weight: 500;
                      }
                      input[name=drop]:hover, input[name=delete]:hover, input[name=truncate]:hover,
                      input[value=Drop]:hover, input[value=Delete]:hover {
                        background: var(--ua-err-bg) !important;
                        border-color: var(--ua-err) !important;
                      }

                      .icon { border-radius: 4px; }

                      /* ==========================================================================
                       * 8. SQL EDITOR — plain textarea, styled to read like a code editor:
                       *    light-grey surface, black mono text, soft inset, crimson focus ring.
                       * ========================================================================== */
                      textarea, .sqlarea, textarea.sqlarea, textarea.jush-sql, .jush-sql {
                        font-family: var(--ua-mono) !important;
                        font-size: 13.5px !important;
                        line-height: 1.65 !important;
                        color: var(--ua-editor-fg) !important;
                        background: var(--ua-editor-bg) !important;
                        border: 1px solid var(--ua-border-strong) !important;
                        border-radius: var(--ua-radius) !important;
                        padding: 13px 15px !important;
                        box-shadow: inset 0 1px 3px rgba(20,22,26,.05) !important;
                        tab-size: 2;
                      }
                      textarea:focus, textarea.sqlarea:focus, .sqlarea:focus {
                        border-color: var(--ua-crimson) !important;
                        box-shadow: inset 0 1px 3px rgba(20,22,26,.05), 0 0 0 3px var(--ua-tint) !important;
                      }

                      code, .jush-js {
                        font-family: var(--ua-mono);
                        background: var(--ua-editor-bg);
                        color: var(--ua-editor-fg);
                        border-radius: 4px;
                        padding: 1px 5px;
                      }
                      .sql-footer { margin-top: 10px; }

                      /* ==========================================================================
                       * 9. TABLES — schema lists AND result grids: light surface, BLACK text.
                       * ========================================================================== */
                      table {
                        border-collapse: collapse;
                        margin: 6px 0 20px;
                        background: #ffffff;
                        border: 1px solid var(--ua-border);
                        border-radius: var(--ua-radius);
                        overflow: hidden;
                        font-size: 13px;
                        color: var(--ua-editor-fg) !important;
                      }

                      thead th, thead td {
                        background: #F7E5E9 !important;   /* crimson tint */
                        color: var(--ua-ink) !important;
                        font-weight: 600;
                        text-align: left;
                        padding: 8px 11px !important;
                        border-bottom: 2px solid var(--ua-tint-strong) !important;
                        white-space: nowrap;
                      }
                      thead th a, thead td a { color: var(--ua-ink) !important; }

                      tbody th, tbody td {
                        padding: 7px 11px !important;
                        border-bottom: 1px solid var(--ua-border) !important;
                        color: var(--ua-editor-fg) !important;
                        background: #ffffff !important;
                        vertical-align: top;
                      }
                      .odds tbody tr:nth-child(2n) td,
                      .odds tbody tr:nth-child(2n) th { background: #FAF9F7 !important; }

                      tbody tr:hover td, tbody tr:hover th { background: var(--ua-tint) !important; }

                      .js .checked td, .js .checked th,
                      .js .checkable .checked td, .js .checkable .checked th { background: var(--ua-tint-strong) !important; }

                      table code { background: transparent; padding: 0; }

                      /* Pagination */
                      .pages { border: none !important; box-shadow: none !important; padding: 4px 0; }
                      .pages a {
                        display: inline-block;
                        padding: 3px 9px; margin: 0 2px 0 0;
                        border: 1px solid var(--ua-border-strong);
                        border-radius: var(--ua-radius-sm);
                        color: var(--ua-ink-soft);
                      }
                      .pages a:hover { border-color: var(--ua-crimson); color: var(--ua-crimson); text-decoration: none; }

                      /* ==========================================================================
                       * 10. FOOTER ACTION BAR (.footer) — Adminer's sticky bulk-action bar. Native
                       *     default.css gives it a `box-shadow: 0 -5px 10px 10px var(--bg)` glow;
                       *     neutralize it so it's a clean inline row, never a floating dark/glowing
                       *     panel.
                       * ========================================================================== */
                      .footer {
                        position: static !important;   /* was sticky (default.css) — pin it inline so it's a clean action row, never a floating overlay */
                        box-shadow: none !important;
                        background: transparent !important;
                        border: none !important;
                        margin: 16px 0 0 !important;
                      }
                      .footer > div {
                        background: transparent !important;
                        box-shadow: none !important;
                        padding: 0 !important;
                      }
                      .footer fieldset {
                        display: inline-block;
                        background: #FCFBFA !important;
                        border: 1px solid var(--ua-border) !important;
                        box-shadow: none !important;
                      }

                      /* ==========================================================================
                       * 11. SAFETY — hide the DATABASE-level bulk "Drop" button.
                       *     Rationale: on the "Select database" page one bulk click drops an entire
                       *     provisioned tenant database. DROP is a single MySQL/PG privilege covering
                       *     both tables AND databases, so it can't be revoked at the grant level
                       *     without losing table-drop too — so we remove the accidental one-click
                       *     PATH instead. A deliberate `DROP DATABASE` typed in the SQL box still
                       *     works (intentional); table-level drop stays fully usable.
                       *
                       *     Scoping: the databases-list page is the ONLY page whose <form> contains
                       *     database checkboxes named `db[]` (verified in index.php: checkbox("db[]",…)
                       *     on the databases listing; the tables page uses `tables[]`/`check[]`). So
                       *     :has() targets exactly that form's Drop submit and nothing else. :has() is
                       *     Baseline-supported in current browsers; if it ever isn't, the button simply
                       *     reverts to visible (fail-safe, no breakage).
                       * ========================================================================== */
                      form:has(input[name="db[]"]) input[name="drop"],
                      form:has(input[name="db[]"]) input[value="Drop"] {
                        display: none !important;
                      }
                      /* Also drop the now-purposeless bulk "Selected" fieldset on that page so the
                         databases view doesn't show an empty action bar. */
                      form:has(input[name="db[]"]) .footer fieldset { display: none !important; }

                      /* ==========================================================================
                       * 12. MISC
                       * ========================================================================== */
                      /* Quiet ghost logout. Selector carries an extra class over `input[type=submit]`
                         so it out-specifies the crimson primary-button rule (which would otherwise win
                         and paint logout a heavy crimson block). */
                      .logout,
                      input[type=submit].logout,
                      input[type=button].logout {
                        display: inline-block;
                        padding: 5px 12px !important;
                        background: #ffffff !important;
                        color: var(--ua-ink-soft) !important;
                        border: 1px solid var(--ua-border-strong) !important;
                        border-radius: var(--ua-radius-sm);
                        box-shadow: none !important;
                        font-size: 12px;
                        font-weight: 600;
                        cursor: pointer;
                      }
                      .logout:hover,
                      input[type=submit].logout:hover {
                        background: #ffffff !important;
                        border-color: var(--ua-crimson) !important;
                        color: var(--ua-crimson) !important;
                      }

                      #lang { color: var(--ua-muted); font-size: 12px; }
                      hr { border: none; border-top: 1px solid var(--ua-border); margin: 18px 0; }

                      /* Narrow screens: let the native layout collapse gracefully (Adminer's own
                         #menuopen toggle still applies). max-width query only — contains no OS-scheme
                         token, so the dark-sheet trap stays disarmed. */
                      @media (max-width: 800px) {
                        #content { margin-left: 0 !important; padding-left: 16px !important; }
                        #menu { min-height: 0 !important; }
                      }

                      /* ==========================================================================
                       * 13. LOGIN FORM — hide the dead-end driver/server/username rows on these
                       *     auto-login consoles. Belt-and-suspenders for the AdminerHideLoginFields
                       *     plugin (db-console-plugin ConfigMap below, mounted at
                       *     /srv/adminer-plugins/adminer-hide-login-fields.php in the Deployment) --
                       *     if that plugin ever fails to load, this still hides the same three rows.
                       *     Scoping: these `name="auth[...]"` attributes are emitted only by Adminer's
                       *     core loginForm() (adminer.inc.php) and appear nowhere else in the app, so
                       *     :has() can't accidentally hide an unrelated row elsewhere. Password and
                       *     Database stay visible/usable either way — only System/Server/Username are
                       *     dead ends here (every other engine/server on the platform is unreachable
                       *     from this console; ADMINER_AUTOLOGIN_SERVER below pins all three).
                       * ========================================================================== */
                      tr:has(select[name="auth[driver]"]),
                      tr:has(input[name="auth[server]"]),
                      tr:has(input[name="auth[username]"]) {
                        display: none !important;
                      }
            ---
            # Adminer login-form plugin ConfigMap: hides the driver ("System"), server, and
            # username rows on the login form of these auto-login consoles.
            # ADMINER_AUTOLOGIN_SERVER (ExternalSecret below) already pins all three — and
            # every other engine/server on the platform is unreachable from here anyway — so
            # leaving them editable is a dead end that only confuses a team ("what do I put
            # here?"), not a real choice. Mounted into /srv/adminer-plugins/ alongside the
            # entrypoint-copied adminer-autologin.php (dbconsole-deploy below, same directory,
            # different file); Adminer 5's own plugin loader glob()s every *.php file it finds
            # there and auto-instantiates any class extending Adminer\Plugin (confirmed against
            # the live dockette/adminer:5.4.2 index.php: `Plugins::__construct` does
            # `foreach(glob("adminer-plugins/*.php") as $p) $this->includeOnce($p)`, then
            # `get_declared_classes()` picks up subclasses of Adminer\Plugin) — no extra wiring
            # needed beyond the volume mount below.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-dbconsole-plugin" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "dbconsole-plugin-cm" }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: db-console-plugin
                    namespace: {{ $consoleNs | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                  data:
                    adminer-hide-login-fields.php: |
                      <?php

                      /**
                       * UA-MIS DB console — hide the unusable login-form fields on these auto-login
                       * consoles. System (driver), Server, and Username are all pinned by
                       * ADMINER_AUTOLOGIN_SERVER (adminer-autologin.php, same
                       * /srv/adminer-plugins/ directory) — there is nowhere else for a team to
                       * point them, so an editable field is a dead end, not a real choice.
                       * Returning '' from loginFormField() suppresses that row entirely
                       * (Adminer's Plugins::__call gives the first non-null hook result priority,
                       * short-circuiting the built-in row for that field name); returning null
                       * (the implicit default below for password/db) leaves Adminer's normal row
                       * untouched, so Password and Database keep working exactly as before.
                       *
                       * Belt-and-suspenders: adminer.css (db-console-css ConfigMap, section 13)
                       * hides these same rows by selector too, in case this plugin ever fails to
                       * load.
                       *
                       * @link https://www.adminer.org/en/plugins/#use
                       */
                      class AdminerHideLoginFields extends Adminer\Plugin {
                        function loginFormField($name, $heading, $value) {
                          if (in_array($name, array('driver', 'server', 'username'))) {
                            return '';
                          }
                        }
                      }
            ---
            # ExternalSecret: assembles ADMINER_AUTOLOGIN_SERVER from the console leaf --
            # NO db path in the DSN, so Adminer's autologin plugin logs into the SERVER
            # only (empty `db`) and lands on its own database list/switcher, populated by
            # the Grants above. Depends on the console PushSecret so it doesn't spin on a
            # not-yet-populated Vault leaf on first apply.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-dbconsole-es" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "dbconsole-es" }}
            spec:
              providerConfigRef:
                name: default
              references:
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-console-db-push" $team | quote }}
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ExternalSecret
                  metadata:
                    name: db-console
                    namespace: {{ $consoleNs | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                  spec:
                    refreshInterval: "1h"
                    secretStoreRef:
                      name: vault-tenant
                      kind: SecretStore
                    target:
                      name: db-console
                      creationPolicy: Owner
                      # Retain (the ESO default), NOT Delete. On a fresh tenant the
                      # console leaf (tenants/<team>/console/database) and/or the
                      # vault-tenant SecretStore are briefly absent/not-ready when this
                      # ExternalSecret first reconciles (the Crossplane dependsOn on the
                      # PushSecret Object only gates on the PushSecret RESOURCE existing,
                      # not on ESO finishing the Vault write, and the SecretStore Object's
                      # default SuccessfulCreate readiness is Ready-on-create, not
                      # Ready-on-connected). With Delete, ESO treats that transient missing
                      # leaf as "provider secret gone" -> silently DELETES the target and
                      # reports SecretDeleted (a success state), so it will not retry until
                      # refreshInterval (1h) -- leaving the db-console Deployment stuck in
                      # CreateContainerConfigError ("secret db-console not found") for up to
                      # an hour. Retain makes the same condition a SecretSyncedError, which
                      # the controller requeues on backoff and re-enqueues when the
                      # SecretStore goes Ready, so the secret materializes within minutes.
                      deletionPolicy: Retain
                      template:
                        engineVersion: v2
                        data:
                          ADMINER_AUTOLOGIN_SERVER: "pgsql://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@{{ `{{ .host }}` }}:{{ `{{ .port }}` }}"
                    data:
                      - secretKey: username
                        remoteRef:
                          key: {{ printf "tenants/%s/console/database" $team | quote }}
                          property: username
                      - secretKey: password
                        remoteRef:
                          key: {{ printf "tenants/%s/console/database" $team | quote }}
                          property: password
                      - secretKey: host
                        remoteRef:
                          key: {{ printf "tenants/%s/console/database" $team | quote }}
                          property: host
                      - secretKey: port
                        remoteRef:
                          key: {{ printf "tenants/%s/console/database" $team | quote }}
                          property: port
            ---
            # Deployment: dockette/adminer:postgres -- identical pod spec to the retired per-env consoles
            # (see git history for the non-root-UID / adminer-plugins emptyDir
            # rationale), plus the adminer.css mount.
            #
            # Image pinned by digest -- same rationale and parity-only scope as the
            # dockette/adminer:mysql pin above (see that comment block). Digest is the
            # tag's current manifest-list digest (registry-verified); could NOT verify
            # ADMINER_VERSION on a live Postgres tenant console (none currently
            # deployed) the way the MySQL one was live-tested, so treat this pin as
            # unverified-in-cluster -- re-check ADMINER_AUTOLOGIN_SERVER's host format
            # against Adminer 5.4.4's `^[-a-z0-9.:]*$` rule the first time a Postgres
            # tenant console actually runs post-merge.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: {{ printf "xp-%s-dbconsole-deploy" $team | quote }}
              annotations:
                {{ setResourceNameAnnotation "dbconsole-deploy" }}
            spec:
              providerConfigRef:
                name: default
              # provider-kubernetes Object has no `.metadata.references` field (server
              # dry-run rejects it -- this is the #281/#283 bug); dependsOn belongs under
              # `spec.references`, same as every other cross-Object dependency in this
              # file.
              references:
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-dbconsole-es" $team | quote }}
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-dbconsole-css" $team | quote }}
                - dependsOn:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: Object
                    name: {{ printf "xp-%s-dbconsole-plugin" $team | quote }}
              forProvider:
                manifest:
                  apiVersion: apps/v1
                  kind: Deployment
                  metadata:
                    name: db-console
                    namespace: {{ $consoleNs | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                      app.kubernetes.io/name: db-console
                  spec:
                    replicas: 1
                    selector:
                      matchLabels:
                        app.kubernetes.io/name: db-console
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/name: db-console
                          platform.capstone/team: {{ $team | quote }}
                      spec:
                        containers:
                          - name: adminer
                            image: dockette/adminer:postgres@sha256:9e8ae62bfd8b1b5b3a18cf9bfa9f80c93d918b45bdd6c532153bd0ce26f9ded2
                            imagePullPolicy: IfNotPresent
                            env:
                              - name: ADMINER_PLUGIN_AUTOLOGIN
                                value: "1"
                              - name: PORT
                                value: "8080"
                              - name: ADMINER_BANNER
                                value: "0"
                              - name: ADMINER_AUTOLOGIN_SERVER
                                valueFrom:
                                  secretKeyRef:
                                    name: db-console
                                    key: ADMINER_AUTOLOGIN_SERVER
                            ports:
                              - containerPort: 8080
                            # Bumped from requests 10m/32Mi, limits mem-only 64Mi (operator-reported
                            # incident, 2026-07-10: the DB console crashes under a heavy query/click
                            # load — same class of bug as the Grafana fix in
                            # applicationsets/kube-prometheus-stack-app.yaml, see that file's comment
                            # for the full live-cluster diagnosis method). Adminer buffers whole result
                            # sets/HTML tables in PHP memory, so a big SELECT or bulk export under a
                            # 64Mi ceiling (only 32Mi of headroom above the request) is an easy OOMKill;
                            # no cpu limit existed at all, which is itself a Kyverno require-limits
                            # violation in this namespace (db-console namespaces are NOT in that
                            # policy's exclude list, unlike `monitoring` — confirmed live via
                            # `kubectl get events` showing PolicyViolation warnings on db-admin-console,
                            # same pod spec pattern as this one). New limits keep both cpu+memory set
                            # (satisfies require-limits) with real headroom: 4x the old memory ceiling,
                            # and a cpu limit generous enough (500m) not to throttle a heavy query/render
                            # burst while still bounding a single console on this shared homelab cluster.
                            resources:
                              requests: { cpu: "50m", memory: "64Mi" }
                              limits: { cpu: "500m", memory: "256Mi" }
                            securityContext:
                              allowPrivilegeEscalation: false
                              runAsNonRoot: true
                              runAsUser: 1000
                              capabilities:
                                drop: ["ALL"]
                              seccompProfile:
                                type: RuntimeDefault
                            volumeMounts:
                              - name: adminer-plugins
                                mountPath: /srv/adminer-plugins
                              - name: adminer-plugin-hide-login
                                mountPath: /srv/adminer-plugins/adminer-hide-login-fields.php
                                subPath: adminer-hide-login-fields.php
                                readOnly: true
                              - name: adminer-css
                                mountPath: /srv/adminer.css
                                subPath: adminer.css
                                readOnly: true
                        volumes:
                          - name: adminer-plugins
                            emptyDir: {}
                          - name: adminer-plugin-hide-login
                            configMap:
                              name: db-console-plugin
                          - name: adminer-css
                            configMap:
                              name: db-console-css
                        securityContext:
                          fsGroup: 1000
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation "dbconsole-svc" }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: v1
                  kind: Service
                  metadata:
                    name: db-console
                    namespace: {{ $consoleNs | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                  spec:
                    selector:
                      app.kubernetes.io/name: db-console
                    ports:
                      - port: 80
                        targetPort: 8080
            ---
            # Traefik forwardAuth Middleware -- team-scoped (allowed_groups=UA-MIS:<team>),
            # unchanged in shape from the retired per-env version, just rendered once.
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation "dbconsole-mw" }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: traefik.io/v1alpha1
                  kind: Middleware
                  metadata:
                    name: db-console-auth
                    namespace: {{ $consoleNs | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                  spec:
                    forwardAuth:
                      address: {{ printf "http://oauth2-proxy.db-console-auth.svc.cluster.local:4180/oauth2/auth?allowed_groups=UA-MIS:%s" $team | quote }}
                      trustForwardHeader: true
                      authResponseHeaders:
                        - X-Auth-Request-User
                        - X-Auth-Request-Email
                        - X-Auth-Request-Groups
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha1
            kind: Object
            metadata:
              annotations:
                {{ setResourceNameAnnotation "dbconsole-ing" }}
            spec:
              providerConfigRef:
                name: default
              forProvider:
                manifest:
                  apiVersion: networking.k8s.io/v1
                  kind: Ingress
                  metadata:
                    name: db-console
                    namespace: {{ $consoleNs | quote }}
                    labels:
                      platform.capstone/component: tenant
                      platform.capstone/team: {{ $team | quote }}
                    annotations:
                      # Chain order matters: Traefik applies middlewares in list order,
                      # each wrapping the next, so the `errors` middleware (outermost)
                      # must be listed BEFORE the forwardAuth middleware (innermost) to
                      # catch the 401 it returns and rewrite it to a 302 login redirect.
                      # Cross-namespace ref requires providers.kubernetesCRD.
                      # allowCrossNamespace (applicationsets/traefik-app.yaml).
                      traefik.ingress.kubernetes.io/router.middlewares: {{ printf "db-console-auth-oauth2-proxy-errors@kubernetescrd,%s-db-console-auth@kubernetescrd" $consoleNs | quote }}
                  spec:
                    rules:
                      - host: {{ printf "%s-db.%s" $team $domain | quote }}
                        http:
                          paths:
                            - path: /
                              pathType: Prefix
                              backend:
                                service:
                                  name: db-console
                                  port:
                                    number: 80
                    tls:
                      - hosts:
                          - {{ printf "%s-db.%s" $team $domain | quote }}
            {{- end }}

            {{- /* =====================================================================
                   STATUS — surface the derived repo + Harbor project on the XR.
                   ===================================================================== */}}
            ---
            apiVersion: platform.capstone.uamishub.com/v1alpha1
            kind: CapstoneTenant
            status:
              repoUrl: {{ $repoUrl | quote }}
              harborProject: {{ $team | quote }}
              dbConsoleUrl: {{ if ne $database "none" }}{{ printf "https://%s-db.%s" $team $domain | quote }}{{ else }}""{{ end }}
    # ------------------------------------------------------------------------
    - step: ready
      functionRef:
        name: function-auto-ready
