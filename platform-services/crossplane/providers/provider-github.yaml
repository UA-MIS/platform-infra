# provider-upjet-github (crossplane-contrib, Upjet — wraps the GitHub Terraform
# provider). ADR-031: mints the team's repo (from the capstone-app-template),
# branch protection, team access, and the CI-caller RepositoryFile.
#
# Auth: the EXISTING `ua-mis-backstage` GitHub App (App ID 4097147, install
# 141394298 — see memory capstone-github-app-m2), via the `app_auth` ProviderConfig
# (config/providerconfig-github.yaml). The same App already used by ARC + the
# ArgoCD repo-creds + the Backstage scaffolder; one App, reused.
#
# ⚠ Registry host: Upbound deprecated crossplane-contrib community packages off
# xpkg.upbound.io; crossplane-contrib now publishes to xpkg.crossplane.io (backed
# by ghcr.io). v0.21.0 NEVER EXISTED (404 MANIFEST_UNKNOWN on both hosts) — the
# latest published tag is v0.19.1, verified to resolve to a digest on
# xpkg.crossplane.io. Confirm the latest tag at Phase-0 apply (SRE review); bump
# deliberately + version-pin.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-github
  labels:
    platform.capstone/component: platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # installs the github.upbound.io CRDs (ProviderConfig lands wave 2)
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-upjet-github:v0.19.1
