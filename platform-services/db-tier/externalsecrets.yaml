# DB-tier ExternalSecrets (db-setup task (c)). ESO/Vault materializes every
# credential the in-cluster DB tier's own Helm/CR Applications consume — NO secret
# material in git (ADR-030 §0), same model as everywhere else in the fleet.
#
# All of these authenticate via the PLATFORM-WIDE `vault-backend` ClusterSecretStore
# (platform-services/external-secrets/clustersecretstore.yaml) — db-tier is a
# platform namespace (not multi-tenant), so it does not need the per-tenant
# SecretStore isolation model (secretstore-template.yaml). The ESO controller's
# `external-secrets-ro` Vault policy already grants read on `secret/data/platform/*`
# (platform-services/external-secrets/vault-policies/eso-role.sh) — NO Vault policy
# change is needed for any of the paths below, only the values need writing.
#
# ── Vault path contract (KV v2; ESO reads secret/data/<path>) ──────────────────
#   platform/db/cnpg/backstage                 { username, password }
#   platform/db/cnpg/harbor                    { username, password }
#   platform/db/cnpg/crossplane-provisioner     { username, password }
#   platform/db/mariadb/root                    { password }
#   platform/db/mariadb/crossplane-provisioner  { username, password }
#   platform/db/minio                           { root-user, root-password,
#                                                  cnpg-access-key, cnpg-secret-key,
#                                                  mariadb-access-key, mariadb-secret-key }
#
# The ORCHESTRATOR writes these values into Vault (agents are classifier-gated from
# prod secret writes) — see docs/operator/in-cluster-db-tier-runbook.md §2 for the
# exact `vault kv put` commands and a strong-token generation recipe. Until those
# values exist, every ExternalSecret below sits `SecretSyncError` (safe failure
# mode — same as every other ESO consumer pre-Vault-write) and none of the
# consuming Applications (cnpg-cluster, mariadb-cluster, minio-backups) go Ready.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backstage-app-credentials
  namespace: db-tier
  labels:
    platform.capstone/component: platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cnpg-backstage-app-credentials
    creationPolicy: Owner
    template:
      # kubernetes.io/basic-auth + the cnpg.io/reload label are REQUIRED by CNPG's
      # declarative role management (DatabaseRole passwordSecret,
      # platform-services/cnpg/cluster/roles.yaml) — mergePolicy:Merge keeps the
      # `data:` below as the actual username/password (Replace, the default, would
      # drop them since this template has no `template.data`).
      type: kubernetes.io/basic-auth
      mergePolicy: Merge
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: platform/db/cnpg/backstage
        property: username
    - secretKey: password
      remoteRef:
        key: platform/db/cnpg/backstage
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-harbor-app-credentials
  namespace: db-tier
  labels:
    platform.capstone/component: platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cnpg-harbor-app-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      mergePolicy: Merge
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: platform/db/cnpg/harbor
        property: username
    - secretKey: password
      remoteRef:
        key: platform/db/cnpg/harbor
        property: password
---
# Postgres-tier parity with docs/operator/db-tier-provisioner-setup.md §6 — the
# SAME least-privilege role shape (LOGIN CREATEDB CREATEROLE, NOT SUPERUSER) as the
# off-box `db-tier-postgres-admin` provisioner, so provider-sql's ProviderConfig
# CAN be repointed at this in-cluster cluster later (cutover runbook §4) without a
# privilege-model change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-crossplane-provisioner-credentials
  namespace: db-tier
  labels:
    platform.capstone/component: platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: cnpg-crossplane-provisioner-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      mergePolicy: Merge
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: platform/db/cnpg/crossplane-provisioner
        property: username
    - secretKey: password
      remoteRef:
        key: platform/db/cnpg/crossplane-provisioner
        property: password
---
# MariaDB root credential (mariadb-cluster chart's `mariadb.rootPasswordSecretKeyRef`,
# applicationsets/mariadb-cluster-app.yaml). Plain Opaque — the chart reads a single
# `password` key, no basic-auth typing needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-root-credentials
  namespace: db-tier
  labels:
    platform.capstone/component: platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mariadb-root-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: platform/db/mariadb/root
        property: password
---
# MariaDB-tier parity with docs/operator/db-tier-provisioner-setup.md §3 — same
# least-privilege grant list (excludes SUPER/FILE/PROCESS/RELOAD/SHUTDOWN) as the
# off-box `db-tier-mysql-admin` provisioner (see
# platform-services/mariadb-cluster values in applicationsets/mariadb-cluster-app.yaml
# for the actual GRANT list). Only `password` is ESO-sourced — the mariadb-operator
# User CR takes the username from its own `.metadata.name`/`.spec.name`, not from
# this secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-crossplane-provisioner-credentials
  namespace: db-tier
  labels:
    platform.capstone/component: platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mariadb-crossplane-provisioner-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: platform/db/mariadb/crossplane-provisioner
        property: password
---
# MinIO root credentials (applicationsets/minio-backups-app.yaml `existingSecret`).
# Chart var table: rootUser -> .data.rootUser, rootPassword -> .data.rootPassword
# (verified against the minio/minio chart's values.yaml comment block).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-root-credentials
  namespace: db-tier
  labels:
    platform.capstone/component: platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: minio-root-credentials
    creationPolicy: Owner
  data:
    - secretKey: rootUser
      remoteRef:
        key: platform/db/minio
        property: root-user
    - secretKey: rootPassword
      remoteRef:
        key: platform/db/minio
        property: root-password
---
# MinIO scoped backup-user credentials for CNPG (Barman Cloud plugin ObjectStore
# s3Credentials, platform-services/cnpg/cluster/objectstore.yaml) AND for the
# MinIO chart's own `users:` list (which mints the `cnpg-backup` user via
# `existingSecretKey: ACCESS_SECRET_KEY` on this same Secret — the username itself
# is the literal `accessKey: cnpg-backup` in the Helm values, not secret material).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-cnpg-backup-credentials
  namespace: db-tier
  labels:
    platform.capstone/component: platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: minio-cnpg-backup-credentials
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: platform/db/minio
        property: cnpg-access-key
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: platform/db/minio
        property: cnpg-secret-key
---
# MinIO scoped backup-user credentials for MariaDB (mariadb-cluster chart's
# `physicalBackups[].storage.s3`, applicationsets/mariadb-cluster-app.yaml) AND for
# the MinIO chart's own `users:` list (`mariadb-backup` user, same pattern as the
# CNPG pair above). Key names match the MariaDB operator's own doc examples
# (`access-key-id` / `secret-access-key`) exactly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-mariadb-backup-credentials
  namespace: db-tier
  labels:
    platform.capstone/component: platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: minio-mariadb-backup-credentials
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: platform/db/minio
        property: mariadb-access-key
    - secretKey: secret-access-key
      remoteRef:
        key: platform/db/minio
        property: mariadb-secret-key
