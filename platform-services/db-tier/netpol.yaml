# NetworkPolicy for the db-tier namespace (db-setup task) — closes the gap noted
# in docs/operator/in-cluster-db-tier-runbook.md §3 ("no NetworkPolicy hardening
# yet... a natural next step"). Unlike the argocd/dex/harbor/vault policies in
# hardening/netpol-controlplane/ (MANUAL sync — those namespaces are already
# LIVE, so default-deny needs a deliberate watched apply to avoid a lockout),
# db-tier is a BRAND-NEW namespace standing up for the first time in this same
# PR — there is no running traffic to sever, so it's safe to ship this default-
# deny + scoped-allow policy through the normal automated sync (platform-services-
# appset), same "comes up together" reasoning the netpol-controlplane Application
# itself documents for a fresh bootstrap.
#
# Scope: restrict which namespaces may reach the CNPG/MariaDB/MinIO pods in
# db-tier — the tradeoff explicitly called out in
# applicationsets/mariadb-cluster-app.yaml (crossplane_provisioner's MySQL
# `host: "%"` login) and applicationsets/cnpg-cluster-app.yaml's roles: reachable
# only via the in-cluster Service, boundary enforced here, not by the DB login's
# host string.
#
# CORRECTION (live incident, 2026-07-07/08 — see the CiliumNetworkPolicy at the
# bottom of this file): the claim above ("no CNP needed") was WRONG for two of
# this tier's egress paths, for exactly the reason apiserver-cnp.yaml/
# vault-cnp.yaml already document elsewhere: Cilium identifies in-cluster
# traffic by IDENTITY (`reserved:kube-apiserver`, per-pod identities), NOT by
# IP, so a plain k8s NetworkPolicy `ipBlock` CIDR rule does NOT match it, even
# though the CIDR numerically covers the destination:
#   - CNPG's initdb reaches the apiserver VIP at 10.96.0.1:443 — covered
#     numerically by the `allow-egress-scoped` service-CIDR ipBlock below, but
#     NOT matched, so it i/o-timed-out until fixed.
#   - Galera group-communication (WSREP) between db-tier pods on TCP
#     4567/4568/4444 + UDP 4567 — covered numerically by that same rule's pod-
#     CIDR ipBlock, but NOT matched either (node-1's WSREP gcomm-timeout
#     crashloop). The INGRESS side already works (the intra-ns rule below uses
#     a label `podSelector`, which Cilium resolves to per-pod identity, not
#     CIDR) — only the EGRESS side needed the identity-based fix.
# Both are fixed by the `allow-egress-apiserver` CiliumNetworkPolicy at the
# bottom of this file, using `toEntities: [kube-apiserver, cluster]` — the same
# two-entity idiom apiserver-cnp.yaml/vault-cnp.yaml use for the identical
# class of gap in argocd/dex/harbor/vault. `cluster` matches ALL in-cluster
# endpoints, so it covers Galera's peer ports without enumerating them.
# CNP and k8s NetworkPolicy on the same endpoint/direction are ADDITIVE (OR).
#
# Talos/Cilium CIDRs (see hardening/netpol-controlplane/*-netpol.yaml headers):
# pods 10.244.0.0/16, services 10.96.0.0/12, nodes 10.237.168.0/22
# (apiserver :6443 + kubelet-probe source).

# --- default-deny (ingress + egress) for every pod in db-tier ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zz-default-deny
  namespace: db-tier
  labels:
    platform.capstone/component: platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# --- INGRESS: the two operator namespaces on their exact reconcile/health ports,
#     full intra-namespace (Galera SST/replication on 4444/4567/4568, CNPG
#     streaming replication on 5432, the barman-cloud sidecar and mariadb
#     PhysicalBackup jobs reaching the MinIO pod on 9000 — all same-namespace
#     traffic today, no other namespace is a live DB client yet per runbook §3/§4),
#     and kubelet probes (node CIDR, source is the node IP not a pod/namespace). ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-operators-and-intra-ns
  namespace: db-tier
  labels:
    platform.capstone/component: platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # cnpg-system (the CNPG operator) -> the Postgres instance manager status/
    # webhook port (8000) + the Postgres port itself (5432) — exact port set from
    # the upstream sample (https://cloudnative-pg.io/documentation/1.27/samples/
    # networkpolicy-example): the operator polls instance status over 8000 and
    # connects to 5432 for some checks.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
    # mariadb-system (the mariadb-operator) -> MySQL (3306) + the per-pod Galera
    # agent API (5555, used for cluster bootstrap/recovery orchestration —
    # mariadb-operator/docs/galera.md).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mariadb-system
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 5555
    # ns `backstage` -> CNPG (5432 only) — the companion ingress-allow edit this
    # file's header + docs/operator/in-cluster-db-tier-runbook.md §3 flagged as
    # needed "at that point": Backstage is now a live DB client of capstone-pg
    # (the CNPG cutover, applicationsets/backstage-process-app.yaml). Scoped to
    # port 5432 only (not 3306/5555/9000) — Backstage never talks to MariaDB or
    # MinIO. Harbor/crossplane-system are NOT added here (still on their own
    # paths — out of scope for this change; add per the same pattern at their
    # own cutover).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backstage
      ports:
        - protocol: TCP
          port: 5432
    # Intra-namespace: CNPG replication, Galera SST/replication, and the backup
    # paths (barman-cloud sidecar + mariadb PhysicalBackup Job) reaching the MinIO
    # pod — all same-namespace today.
    - from:
        - podSelector: {}
    # Kubelet health probes (readiness/liveness) originate from the NODE IP, not a
    # pod/namespace — without this, default-deny fails every db-tier pod's probes.
    - from:
        - ipBlock:
            cidr: 10.237.168.0/22
---
# --- EGRESS: DNS, intra-cluster (pod + service CIDRs — covers Galera/CNPG peer
#     replication over pod IPs, the MinIO ClusterIP on 9000, and the operators'
#     own webhook/status callbacks), and the apiserver on the node IPs (the CNPG
#     instance manager and the mariadb-operator's Galera agent both read/write
#     status via the k8s API directly, not only through their operator). No
#     external egress — nothing in db-tier talks off-cluster. ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-scoped
  namespace: db-tier
  labels:
    platform.capstone/component: platform
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS to CoreDNS (kube-system), UDP+TCP 53.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Intra-cluster: any pod (10.244/16) or service (10.96/12) — Galera/CNPG peer
    # replication + reaching the MinIO/CNPG/MariaDB ClusterIPs.
    - to:
        - ipBlock:
            cidr: 10.244.0.0/16
        - ipBlock:
            cidr: 10.96.0.0/12
    # kube-apiserver on the node IPs (:6443) — instance-manager/agent status
    # read-writes.
    - to:
        - ipBlock:
            cidr: 10.237.168.0/22
      ports:
        - protocol: TCP
          port: 6443
---
# Cilium intra-cluster + apiserver egress allow (CiliumNetworkPolicy) — db-tier.
# Companion to hardening/netpol-controlplane/apiserver-cnp.yaml / vault-cnp.yaml
# (same fix, same two-entity idiom); see this file's header CORRECTION note for
# the full incident writeup. Codifies two CiliumNetworkPolicies that were
# applied LIVE by hand (kubectl, context admin@capstone) during the overnight
# bring-up on 2026-07-07/08 and are being made GitOps-permanent here:
#   `allow-db-tier-apiserver-dns` (toEntities: kube-apiserver + kube-dns:53)
#   `allow-db-tier-galera`        (intra-db-tier TCP 4567/4568/4444 + UDP 4567)
# Both are subsumed by the single `toEntities: [kube-apiserver, cluster]` rule
# below — `cluster` is a superset of the exact Galera ports (it matches ALL
# in-cluster endpoints on ALL ports), so one CNP replaces both hotfixes without
# hardcoding the WSREP port list. DNS is NOT repeated here — it's already
# covered by the `allow-egress-scoped` k8s NetworkPolicy above.
#
# Safe to ship through the normal AUTOMATED platform-services-appset sync
# (unlike hardening/netpol-controlplane's MANUAL-SYNC gate): this CNP is
# purely additive (CNP + k8s NetworkPolicy on the same endpoint/direction are
# OR'd, never AND'd), so it can only ADD allowed egress — it cannot narrow or
# break the default-deny / existing scoped-allow that's already live.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-apiserver
  namespace: db-tier
  labels:
    platform.capstone/component: platform
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
        - cluster
