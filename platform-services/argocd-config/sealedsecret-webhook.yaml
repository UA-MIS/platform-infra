# Patch SealedSecret -> adds ONLY `webhook.github.secret` into the install-managed
# `argocd-secret` (argocd ns). This is the shared HMAC secret ArgoCD's webhook
# receiver (`POST /api/webhook` on argocd-server) uses to verify GitHub push
# deliveries. With it set, a push to any UA-MIS repo wired to the ArgoCD webhook
# triggers an instant refresh/sync instead of waiting on the ~3-min poll.
#
# ⚠ THE NAME IS LOAD-BEARING — metadata.name MUST be `argocd-secret`.
# SealedSecrets binds the OUTPUT Secret's name to the SealedSecret CR's
# metadata.name; `spec.template.metadata.name` does NOT retarget it (confirmed in
# the upstream docs and live: the previous CR named `argocd-webhook-github`
# produced a *standalone* Secret `argocd-webhook-github` and NEVER touched
# `argocd-secret`, so ArgoCD — which only reads `webhook.github.secret` from
# `argocd-secret` — saw no secret and every delivery stayed unsigned). To patch
# the real `argocd-secret`, the CR itself must be named `argocd-secret`.
#
# ⚠ patch: "true" is what keeps this non-destructive. The default SealedSecret
# behaviour REPLACES the whole target Secret; that would wipe ArgoCD's autogenerated
# `tls.crt` / `server.secretkey` / `admin.password` (logs everyone out, rotates
# TLS). With `sealedsecrets.bitnami.com/patch: "true"` the controller MERGES —
# adds/updates only the keys present here, deletes nothing, and does NOT take
# ownership of `argocd-secret` (no ownerReference). The annotation must sit on the
# OUTPUT Secret, i.e. under spec.template.metadata.annotations (here).
#
# ⚠ PLACEHOLDER ciphertext — reseal to a real random value BEFORE the org webhook
# is created, per docs/operator/argocd-gitops.md → "Git webhook — instant sync"
# → Step 1. Because the scope is strict (name+namespace), the reseal input Secret
# name MUST be `argocd-secret` (namespace `argocd`) or the controller can't
# decrypt. Applying with this placeholder is non-destructive: the SealedSecret
# stays in an unseal-error, no key is written, ArgoCD just keeps polling.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-secret
  namespace: argocd
spec:
  encryptedData:
    webhook.github.secret: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/patch: "true"
      labels:
        app.kubernetes.io/name: argocd-secret
        app.kubernetes.io/part-of: argocd
        platform.capstone/component: platform
      name: argocd-secret
      namespace: argocd
    type: Opaque
