# SealedSecret -> PATCHES `webhook.github.secret` into the argocd-server-owned
# `argocd-secret` (P-webhook). Enables ArgoCD's Git webhook so a push to
# UA-MIS/platform-infra hits POST https://argocd.capstone.uamishub.com/api/webhook
# and triggers an INSTANT refresh/sync instead of waiting for the ~3-min poll
# (timeout.reconciliation). ArgoCD reads this key from argocd-secret and verifies the
# GitHub HMAC (X-Hub-Signature-256) on every delivery — an unsigned/forged POST is
# rejected. See Context7 argo-cd docs: operator-manual/webhook + argocd-secret-yaml
# (key is literally `webhook.github.secret`).
#
# ⚠ WHY `sealedsecrets.bitnami.com/patch: "true"` IS LOAD-BEARING (DO NOT REMOVE):
# `argocd-secret` is NOT ours — argocd-server autogenerates + owns tls.crt/tls.key,
# server.secretkey (session signing), and admin.password in it. The DEFAULT SealedSecret
# behaviour REPLACES the whole target Secret, which would WIPE those keys → ArgoCD
# regenerates its session key (logs everyone out), its TLS cert, and could reset the
# admin password. The `patch` annotation (sealed-secrets v0.23+) makes the controller
# ADD/UPDATE only the keys present here (webhook.github.secret) and leave every other
# key, label, and annotation untouched. `patch` also does NOT take ownership, so
# deleting this SealedSecret never cascade-deletes argocd-secret. This is the ONLY
# safe way to merge a key into an install-managed Secret.
#
# ⚠ PLACEHOLDER CIPHERTEXT — the encryptedData below is NOT a real sealed value.
# It exists so the manifest is shape-complete and mergeable; it will FAIL to decrypt
# if applied as-is (SealedSecret stays "unsealing"/error, no key is written, ArgoCD
# just keeps polling — non-destructive). The human MUST reseal a real random secret
# per the runbook in artifacts/design/deployment.md (§ ArgoCD Git webhook) BEFORE this
# is merged/applied. Same placeholder pattern as sealedsecret-repo-creds.yaml.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-webhook-github
  namespace: argocd
spec:
  encryptedData:
    webhook.github.secret: PLACEHOLDER_RESEAL_PER_RUNBOOK__NOT_A_REAL_SEALED_VALUE__see_deployment.md
  template:
    metadata:
      name: argocd-secret
      namespace: argocd
      annotations:
        # Merge one key into the existing argocd-secret; preserve all others. CRITICAL.
        sealedsecrets.bitnami.com/patch: "true"
      labels:
        app.kubernetes.io/name: argocd-secret
        app.kubernetes.io/part-of: argocd
        platform.capstone/component: platform
    type: Opaque
