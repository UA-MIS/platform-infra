# ArgoCD OIDC wiring -> Dex (P2.1, §1.1, D-017). Adds two keys to argocd-cm: the
# external `url` (so ArgoCD builds correct OIDC redirect URLs) and `oidc.config`
# pointing at the standalone platform Dex broker.
#
# SELF-HEALING via GitOps (moved here from bootstrap/argocd-install in p2.1-fix):
# ArgoCD's application-controller applies with ServerSideApply using its OWN field
# manager, which merges these keys into the install-created argocd-cm at the FIELD
# level WITHOUT pruning the upstream `resource.customizations.*` / `resource.exclusions`
# keys (verified by live `kubectl diff --server-side --field-manager=...`). This is
# unlike a plain `kubectl apply`, whose default manager + last-applied annotation
# would prune unlisted keys — which is why this lived in the bootstrap patch before.
# Now it self-heals like every other platform-service.
#
# We use `oidc.config` (external OIDC provider) NOT the bundled `dex.config`,
# because §1.1 runs ONE shared platform Dex that Backstage/Grafana/Harbor also
# federate through.
#
# The clientSecret derefs the SealedSecret-materialised Secret `argocd-dex-client`
# (sealedsecret.yaml) as $argocd-dex-client:oidc.dex.clientSecret; it MUST equal
# the `argocd` staticClient secret Dex holds.
#
# UI THEMING (P2.1 THEME, University of Alabama MIS branding):
# The `ui.*` keys below are ADDITIVE and field-level-independent from the OIDC/RBAC
# keys above — they self-heal through the same application-controller SSA merge.
#   - ui.cssurl: a RELATIVE path "./custom/ua-mis.css" resolved against the server's
#     /shared/app static dir. The CSS is served FROM the argocd-server container via
#     a volume-mounted ConfigMap (argocd-ui-theme-cm, kustomization.yaml) mounted at
#     /shared/app/custom by the bootstrap install patch (bootstrap/argocd-install).
#     A LOCAL mount (not an external URL) keeps the theme self-contained + offline —
#     no CDN dependency on a sslip.io-only local cluster, and recreate-safe.
#   - ui.bannercontent: the UA-MIS identity banner. ui.bannerpermanent keeps it
#     visible (no per-user dismiss) so the branding is always present.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
    platform.capstone/component: platform
data:
  # --- Ingress health override (P3 fix) ---------------------------------------
  # ArgoCD's BUILT-IN Ingress health check reports Healthy only once the Ingress has
  # `.status.loadBalancer.ingress` populated — i.e. a cloud LB / MetalLB writes an
  # address back. On THIS cluster (Talos + the bundled Traefik, no cloud-LB/MetalLB;
  # public traffic arrives via the Cloudflare Tunnel) Traefik never writes a LB
  # address to Ingress status, so EVERY Ingress sits Progressing forever. That hung
  # the wave-based sync of `platform-svc-dex` AT the Ingress wave and it NEVER applied
  # the Dex Deployment (Deployment/dex = OutOfSync, zero pods, SSO down) — the app's
  # operation stuck "waiting for healthy state of networking.k8s.io/Ingress/dex".
  # Override: an Ingress with rules is Healthy (Traefik routes by Host header
  # regardless of LB status). This is a `resource.customizations.*` key — co-managed
  # with the install's other resource.customizations via SSA (a NEW distinct key, no
  # conflict) and SEPARATE from the ui.*/oidc.* keys, so it does NOT touch the
  # wipe-gotcha surface. Applies cluster-wide (unblocks dex + any future Ingress).
  resource.customizations.health.networking.k8s.io_Ingress: |
    hs = {}
    if obj.spec ~= nil and obj.spec.rules ~= nil and #obj.spec.rules > 0 then
      hs.status = "Healthy"
      hs.message = "Ingress has routing rules (Traefik routes by Host; no cloud-LB address expected on this tunnel-fronted cluster)"
      return hs
    end
    hs.status = "Progressing"
    hs.message = "Waiting for Ingress rules"
    return hs

  # --- ExternalSecret ignoreDifferences, org-wide (2026-08-19 fix) -----------
  # `platform-svc-slidedeck` was continuously flapping OutOfSync via self-heal
  # (sync history advancing every ~2.5 min, autoHealAttemptsCount in the teens)
  # on ExternalSecret/slidedeck-env in ns `slides`. Root-caused live:
  #   1. The existing class-level ignoreDifferences on the platform-services /
  #      labs-namespace / labs-students ApplicationSet templates only covers
  #      the OLD ExternalSecret v1beta1 shape (`spec.data[].remoteRef.*`,
  #      used by backstage/db-admin/db-tier). slidedeck's manifest uses the
  #      NEWER `spec.dataFrom[].extract` shape; the live object has 4
  #      API-server-defaulted sub-fields under `extract` that git never sets
  #      and that the old rule never covers, so every reconcile diffs.
  #   2. The live object also carries `metadata.annotations.force-sync`, a
  #      manual force-refresh annotation (same recovery pattern used on stuck
  #      PushSecrets/RobotAccounts) that was added directly against the
  #      cluster, never committed to git, and has no matching ignore rule —
  #      a second permanent diff source.
  # Fixed at the org-wide `resource.customizations.ignoreDifferences.<group>_
  # <kind>` layer (not a per-Application/per-ApplicationSet patch) because this
  # same force-synced-annotation + new-shape-extract combination can recur on
  # ANY ExternalSecret across any of the 3 templates that carry the stale
  # data[].remoteRef-only rule, or on a plain (non-appset) Application — a
  # single argocd-cm key covers all of them. Combines additively with (does
  # not replace) the existing per-appset-template ignoreDifferences blocks,
  # which stay in place for the old-shape ExternalSecrets they still cover.
  resource.customizations.ignoreDifferences.external-secrets.io_ExternalSecret: |
    jqPathExpressions:
    - .spec.dataFrom[].extract.conversionStrategy
    - .spec.dataFrom[].extract.decodingStrategy
    - .spec.dataFrom[].extract.metadataPolicy
    - .spec.dataFrom[].extract.nullBytePolicy
    - .metadata.annotations["force-sync"]

  # --- Deployment.spec.replicas ignoreDifferences, org-wide -------------------
  # WITHOUT THIS, A HorizontalPodAutoscaler CANNOT WORK ON THIS PLATFORM.
  #
  # Every tenant Application syncs with `selfHeal: true`. An HPA's entire job is
  # to change `.spec.replicas` away from what git says, which ArgoCD then sees as
  # drift and reverts — so the HPA scales up, ArgoCD scales back down, and the two
  # controllers fight in a loop that burns reconciles and never settles. The
  # workload looks like it is flapping for no reason.
  #
  # This is not hypothetical-only: the tenant AppProject has whitelisted
  # `autoscaling/HorizontalPodAutoscaler` since the fence was written, but NO HPA
  # has ever existed on this cluster (`kubectl get hpa -A` was empty before this
  # change), so the combination had never actually been exercised. ida-llm is the
  # first tenant to use one — its `runner` workload is explicitly variable (2-4
  # workers depending on benchmark load).
  #
  # SAFE FOR EVERY OTHER TENANT, because it is a no-op for them: nothing changes
  # `.spec.replicas` out-of-band unless an autoscaler is present. What it does
  # give up is ArgoCD reverting a manual `kubectl scale` — which is precisely the
  # field you WANT to be externally adjustable, and the one field where GitOps
  # enforcement and autoscaling are mutually exclusive by construction.
  #
  # Scoped to `.spec.replicas` ONLY. Every other field of a Deployment — image,
  # env, probes, resources, securityContext — stays fully enforced.
  #
  # Placed at the org-wide `resource.customizations.<group>_<kind>` layer rather
  # than per-Application for the same reason the ExternalSecret rule above is:
  # the ApplicationSet template is Composition-rendered, so a per-template patch
  # would mean a Composition edit for every tenant that ever adds an autoscaler.
  resource.customizations.ignoreDifferences.apps_Deployment: |
    jsonPointers:
    - /spec/replicas

  url: https://argocd.capstone.uamishub.com

  # ArgoCD-server fetches the issuer's discovery doc SERVER-SIDE over the in-cluster
  # path (id.capstone.uamishub.com -> rewritten by coredns-custom to Traefik -> Dex).
  # That hop presents the cert-manager wildcard cert, which is signed by the
  # self-signed PLATFORM CA (Phase-1, no ACME). ArgoCD won't trust that CA, so for
  # the Phase-1 LOCAL self-signed setup we skip OIDC TLS verification — exactly the
  # case the ArgoCD docs name as acceptable for a self-signed provider cert. This
  # parallels `server.insecure: true` (TLS terminates at Traefik). In-cluster
  # traffic only; the issuer cert is self-CA and rotates on cluster recreate, so
  # pinning a static rootCA PEM would break the reproducible-recreate invariant.
  # PHASE-3 REMOVAL: when the issuer moves to the Cloudflare zone with ACME-trusted
  # certs, DELETE this line (and the coredns-custom rewrite) — discovery becomes
  # publicly resolvable + publicly trusted. (Flagged to security: SEC review item.)
  oidc.tls.insecure.skip.verify: "true"

  oidc.config: |
    name: Dex (GitHub)
    issuer: https://id.capstone.uamishub.com
    clientID: argocd
    clientSecret: $argocd-dex-client:oidc.dex.clientSecret
    requestedScopes:
      - openid
      - profile
      - email
      - groups
    requestedIDTokenClaims:
      groups:
        essential: true

  # --- University of Alabama MIS UI theme (P2.1 THEME) ---
  # Local custom stylesheet served from the argocd-server container (see header).
  ui.cssurl: "./custom/ua-mis.css"
  # Identity banner shown on the login page + throughout the UI. Permanent (the UA-MIS
  # branding is not user-dismissible). PLAIN, NON-CLICKABLE text — ui.bannerurl is
  # deliberately OMITTED so the banner does not hyperlink anywhere (human direction:
  # the banner is identity text, not a link to the Culverhouse/MIS site).
  ui.bannercontent: "University of Alabama MIS — Internal Developer Platform"
  ui.bannerpermanent: "true"
  ui.bannerposition: "top"
