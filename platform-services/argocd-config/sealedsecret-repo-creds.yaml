# ============================================================================
# ArgoCD org-wide PRIVATE-repo credential template (GitHub App) — PLACEHOLDER.
# ============================================================================
# WHY: ArgoCD currently has NO repository credentials registered, so it reads
# every git repo ANONYMOUSLY. That works for the PUBLIC repos (platform-infra,
# sample-app) but FAILS for any PRIVATE tenant app repo — the env/preview
# ApplicationSets' git-files generator errors with:
#     "error retrieving Git files: ... authentication required: Repository not found"
# (observed live on v1check-envs for the PRIVATE UA-MIS/v1check repo).
#
# The Backstage scaffolder creates tenant app repos PRIVATE by default. Rather
# than make each one public (a per-repo band-aid that leaks student source), this
# registers ONE org-scoped credential TEMPLATE so ArgoCD can read EVERY private
# repo under github.com/UA-MIS with a single secret.
#
# HOW IT WORKS (ArgoCD repo-creds — schema verified via Context7 against current
# argo-cd.readthedocs.io/operator-manual/argocd-repo-creds-yaml & declarative-setup):
#   - label `argocd.argoproj.io/secret-type: repo-creds` makes this a CREDENTIAL
#     TEMPLATE (not a single repository). ArgoCD matches it to any repo whose URL
#     is PREFIXED by `url` below. `url: https://github.com/UA-MIS` therefore
#     covers all UA-MIS tenant repos with ONE secret — no per-repo entry.
#   - `type: git` selects the git credential type.
#   - GitHub App auth (githubAppID / githubAppInstallationID / githubAppPrivateKey)
#     reuses the SAME `ua-mis-backstage` GitHub App already sealed for ARC
#     (platform-services/arc/sealedsecret-github-app.yaml: arc-github-app). No new
#     App, no PAT. App ID 4097147, Installation ID 141394298. The App's installation
#     MUST have Repository contents: READ (read-only) on the UA-MIS org — it already
#     does for ARC checkout — VERIFY before relying on this (SEC: no write scope).
#   - The materialised Secret carries label app.kubernetes.io/part-of: argocd so
#     ArgoCD's repo-server picks it up.
#
# STRUCTURE: `type` + `url` are NON-secret selector fields and live in the clear in
# template.stringData (readable in git, drive prefix-matching). Only the three
# githubApp* values are sealed — so the reseal below seals EXACTLY those three keys
# and the committed template block never changes.
#
# ============================================================================
# ⚠⚠⚠ PLACEHOLDER — NOT FUNCTIONAL AS COMMITTED. encryptedData WILL NOT DECRYPT.
# ============================================================================
# The three encryptedData values are PLACEHOLDER strings, NOT real sealed data.
# This file is committed so the wiring is reviewable + merge-able; the OPERATOR
# seals the real GitHub App values host-side (creds never touch git) and replaces
# the three placeholders.
#
# ----------------------------------------------------------------------------
# RESEAL RUNBOOK (fish shell — the user's shell; creds stay on the host)
# ----------------------------------------------------------------------------
#   # 1. Set the App identifiers + point at the .pem the user holds locally:
#   set -x APP_ID 4097147
#   set -x INSTALL_ID 141394298
#   set -x PEM /home/ccsmith33/Downloads/ua-mis-backstage.2026-06-19.private-key.pem
#
#   # 2. Build a throwaway Secret with ONLY the 3 sealed keys and seal it. The
#   #    `--merge-into` writes just spec.encryptedData for these keys straight into
#   #    THIS file, leaving the template block untouched:
#   kubectl create secret generic argocd-repo-creds-uamis \
#     --namespace argocd \
#     --from-literal=githubAppID=$APP_ID \
#     --from-literal=githubAppInstallationID=$INSTALL_ID \
#     --from-file=githubAppPrivateKey=$PEM \
#     --dry-run=client -o yaml \
#   | kubeseal --controller-namespace kube-system \
#       --controller-name sealed-secrets-controller \
#       --format yaml \
#       --merge-into platform-services/argocd-config/sealedsecret-repo-creds.yaml
#
#   # 3. Confirm the 3 encryptedData values are now long base64 blobs (NOT REPLACE_ME),
#   #    the template block is unchanged, then commit + let GitOps sync:
#   git diff platform-services/argocd-config/sealedsecret-repo-creds.yaml
#
# (If you prefer a standalone seal instead of --merge-into: pipe the same kubectl
#  output through `kubeseal --controller-namespace kube-system --controller-name
#  sealed-secrets-controller --format yaml > /tmp/rc.yaml`, then copy the three
#  spec.encryptedData values over the placeholders below. Either yields the same
#  ciphertext scope.)
#
# PROVISION CHECKLIST (operator, before this is live):
#   [ ] Confirm ua-mis-backstage App installation has Repository contents: READ on UA-MIS.
#   [ ] Reseal the real values per the runbook above (kube-system controller).
#   [ ] Verify the 3 placeholder encryptedData values are replaced with real ciphertext.
#   [ ] Commit; let platform-svc-argocd-config sync (do NOT kubectl apply by hand).
#   [ ] Verify: v1check-envs ApplicationSet leaves ErrorOccurred and generates v1check-dev.
# ============================================================================
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-repo-creds-uamis
  namespace: argocd
spec:
  encryptedData:
    # PLACEHOLDER — reseal real values (see header runbook). Will NOT decrypt as-is.
    githubAppID: REPLACE_ME_sealed_githubAppID
    githubAppInstallationID: REPLACE_ME_sealed_githubAppInstallationID
    githubAppPrivateKey: REPLACE_ME_sealed_githubAppPrivateKey
  template:
    metadata:
      name: argocd-repo-creds-uamis
      namespace: argocd
      labels:
        # repo-creds (NOT repository) = a credential TEMPLATE matched by url-prefix
        # to every repo under github.com/UA-MIS.
        argocd.argoproj.io/secret-type: repo-creds
        # Required for ArgoCD's repo-server to consume the materialised Secret.
        app.kubernetes.io/part-of: argocd
        platform.capstone/component: platform
    type: Opaque
    # Non-secret selector fields in the clear (the url PREFIX drives matching).
    stringData:
      type: git
      url: https://github.com/UA-MIS
