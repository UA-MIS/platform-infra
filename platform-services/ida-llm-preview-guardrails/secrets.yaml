# Secrets for a preview namespace — PLATFORM-OWNED, deliberately.
#
# ⚠ WHY THESE ARE HERE AND NOT IN THE TENANT'S OWN preview OVERLAY.
# They reference the CLUSTER-SCOPED `vault-backend` store, whose Vault role can
# read `secret/data/tenants/*` — i.e. EVERY tenant's subtree, not just this one.
# Rendering them from platform-infra under a platform-project Application means
# the path is fixed by the platform and the tenant cannot repoint it. The
# tenant's own chart never references `vault-backend` for exactly this reason.
#
# ⚠ WHY NOT the per-tenant `vault-tenant` SecretStore that dev/staging/prod use.
# It authenticates as the `eso-tenant` ServiceAccount against the Vault k8s-auth
# role `tenant-ida-llm`, whose `bound_service_account_namespaces` is an EXACT
# LIST — the three env namespaces plus the literal `ida-llm-preview`. It is not a
# glob, and provider-vault v0.1.0 exposes no
# `bound_service_account_namespace_selector` field (checked against the live CRD),
# so a per-PR namespace can never be added declaratively without re-writing the
# role on every PR. Binding `["*"]` instead would let ANY namespace assume the
# tenant role — strictly worse. Using the platform store, under platform control,
# is what closes blocker B2.
---
# The image-pull credential. Without this every preview pod ImagePullBackOffs:
# the team's Harbor project is private, and the Composition renders harbor-pull
# for dev/staging/prod ONLY ("preview is intentionally NOT covered here").
# This is blocker B3.
#
# Reads the DEV robot token deliberately — it is the same team-scoped, pull-only
# robot, and previews are a dev-grade concern.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-pull
    creationPolicy: Owner
    # Retain: a transient Vault blip must not yank a working pull credential out
    # from under running pods.
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"harbor.capstone.uamishub.com":{"username":"robot$ida-llm+ida-llm-pull","password":"{{ .secret }}","auth":"{{ printf "%s:%s" "robot$ida-llm+ida-llm-pull" .secret | b64enc }}"}}}
  data:
    - secretKey: secret
      remoteRef:
        key: tenants/ida-llm/dev/harbor-pull
        property: secret
---
# App secrets for previews. ⚠ A SEPARATE VAULT PATH FROM EVERY REAL ENVIRONMENT
# (`tenants/ida-llm/preview/app`), holding MOCK provider keys only.
#
# This is the substantive safety property: a preview runs untrusted PR code, so
# it must never hold a spendable credential. Even though the fence above permits
# :443 egress, the keys it can reach a provider WITH are deliberately fake — so
# the failure mode of a malicious or careless PR is an auth error, not a bill.
# The mock model endpoint is what the preview actually talks to.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ida-llm-secret
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ida-llm-secret
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: MINIO_ACCESS_KEY
      remoteRef: { key: tenants/ida-llm/preview/app, property: MINIO_ACCESS_KEY }
    - secretKey: MINIO_SECRET_KEY
      remoteRef: { key: tenants/ida-llm/preview/app, property: MINIO_SECRET_KEY }
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: { key: tenants/ida-llm/preview/app, property: ANTHROPIC_API_KEY }
    - secretKey: OPENAI_API_KEY
      remoteRef: { key: tenants/ida-llm/preview/app, property: OPENAI_API_KEY }
    - secretKey: SPARKS_API_KEY
      remoteRef: { key: tenants/ida-llm/preview/app, property: SPARKS_API_KEY }
---
# DATABASE_URL for a preview — pointed at the THROWAWAY in-namespace Postgres
# (preview-db.yaml), never at the shared tenant database.
#
# The same four parts also drive the throwaway server's own POSTGRES_* env, so
# the credentials cannot drift between the database and its client.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ida-llm-db
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ida-llm-db
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@ida-llm-preview-db:5432/{{ .dbname }}"
        # Consumed by the throwaway server itself.
        POSTGRES_USER: "{{ .username }}"
        POSTGRES_PASSWORD: "{{ .password }}"
        POSTGRES_DB: "{{ .dbname }}"
  data:
    - secretKey: username
      remoteRef: { key: tenants/ida-llm/preview/database, property: username }
    - secretKey: password
      remoteRef: { key: tenants/ida-llm/preview/database, property: password }
    - secretKey: dbname
      remoteRef: { key: tenants/ida-llm/preview/database, property: dbname }
