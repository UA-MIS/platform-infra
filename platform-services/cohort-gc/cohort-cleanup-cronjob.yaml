# Cohort-cleanup CronJob (DRAFT — design, not yet reviewed/merged).
#
# PURPOSE: sweep up leftover tenant namespaces/Applications for one graduated
# semester, selected by the universal label `platform.capstone/semester=<cohort-slug>`
# (e.g. 2026-fall). Every tenant object carries this label (see tenants/_template).
#
# ⚠ THIS IS `suspend: true` (never fires on a schedule). Graduating a cohort is a
# DELIBERATE, destructive admin act, so this CronJob is a parameterized, on-demand
# RUNNER, not an automatic reaper.
#
# ⚠⚠ THIS JOB IS A RESIDUE-SWEEPER, *NOT* THE PRIMARY TEARDOWN. Onboarding is now
# Crossplane `CapstoneTenant` claims (ADR-031): each tenant is ONE claim file at
# `tenants/_claims/<team>-<app>.yaml`, and a reviewed-once Composition fans it into
# the repo + Harbor + Vault + the whole k8s tenancy fence (AppProject, namespaces,
# quota/netpol/RBAC, and the env/preview ApplicationSets). The GitOps source of truth
# is the CLAIM, not the Apps/namespaces this job deletes.
#
# The CANONICAL, SAFE graduate order is CLAIM-FIRST:
#   1. `git rm tenants/_claims/<team>-<app>.yaml` for every team in the cohort + commit
#      (graduating a whole semester = `git rm tenants/_claims/*` for that cohort).
#   2. ArgoCD (`platform-crossplane-claims`) prunes the CapstoneTenant XR → Crossplane
#      + the AppProject/namespace finalizers DEPROVISION the tenant declaratively
#      (repo, Harbor, Vault, ApplicationSets, namespaces — the controllers own it).
#   3. ONLY IF orphaned Apps/namespaces remain after the controllers settle, run THIS
#      job to sweep the residue.
#
# ⚠ DO NOT run this job while the claim or its ApplicationSets still exist. Imperative
# `kubectl delete` of Apps/namespaces that a live CapstoneTenant/ApplicationSet is
# still reconciling is an APPLY-FIGHT (the 2026-07-10 duplicate-claim cascade:
# imperative-delete vs controller-recreate thrash → Cilium CPU pin → node saturation).
# This job's pre-flight REFUSES to run if a matching CapstoneTenant claim or parent
# ApplicationSet is still present for the cohort (orphan-before-delete discipline,
# mirroring the 2026-07-10 incident runbook). Remove the claim FIRST, let the
# controllers deprovision, THEN sweep.
#
# To run it (after step 1–2 above):
#   1. Set COHORT_SLUG below (or override per-run, see step 3).
#   2. Confirm DRY_RUN; first run with DRY_RUN=true and READ the output.
#   3. Trigger a one-off Job from it:
#        kubectl -n cohort-gc create job cohort-cleanup-<slug> \
#          --from=cronjob/cohort-cleanup
#      (override the cohort/dry-run by editing the env or patching the one-off Job).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cohort-cleanup
  namespace: cohort-gc
  labels:
    platform.capstone/component: platform
spec:
  # Suspended: this never runs on its own. `schedule` is a required field; the value
  # is irrelevant while suspend:true (kept as a yearly placeholder).
  suspend: true
  schedule: "0 0 1 1 *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400   # keep the record a day (audit the teardown)
      template:
        metadata:
          labels:
            platform.capstone/component: platform
        spec:
          serviceAccountName: cohort-gc
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cohort-cleanup
              # kubectl + a real shell (this job's `command` is ["/bin/sh", ...] running
              # a shell script body). The distroless registry.k8s.io/kubectl image has NO
              # /bin/sh, so it StartError'd (exec 128: stat /bin/sh: no such file or
              # directory) — dead on arrival. alpine/k8s bundles a full shell + kubectl
              # (+ jq/curl) and is the exact image the working crossplane-mr-prune CronJob
              # uses (proven live on this cluster; its layers are already node-cached).
              image: alpine/k8s:1.31.5
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: COHORT_SLUG
                  value: ""        # REQUIRED — set the semester slug, e.g. "2026-fall"
                - name: DRY_RUN
                  value: "true"    # run with true first; flip per-run when ready
                - name: HOME
                  value: /tmp
              command: ["/bin/sh", "-eu", "-c"]
              args:
                - |
                  if [ -z "${COHORT_SLUG}" ]; then
                    echo "ERROR: COHORT_SLUG is empty — set the semester slug (e.g. 2026-fall)." >&2
                    exit 2
                  fi
                  echo "==> cohort-cleanup: COHORT_SLUG=$COHORT_SLUG DRY_RUN=$DRY_RUN"
                  echo "==> REMINDER: durable teardown is CLAIM-FIRST. This job only sweeps"
                  echo "    residue AFTER the CapstoneTenant claims are removed:"
                  echo "      git rm tenants/_claims/<team>-<app>.yaml   # per team (or *) for the cohort"
                  echo "    ArgoCD/Crossplane then deprovision the tenant. Do NOT run this while"
                  echo "    a claim or its ApplicationSets are still live (apply-fight risk)."

                  SEL="platform.capstone/semester=${COHORT_SLUG}"

                  # 0) ORPHAN-BEFORE-DELETE PRE-FLIGHT (2026-07-10 incident discipline).
                  #    Refuse to sweep while the tenant's controllers still own the objects:
                  #    imperative delete vs Crossplane/ApplicationSet reconcile = apply-fight.
                  #    Claims are the CapstoneTenant XR (cluster-scoped, group
                  #    platform.capstone.uamishub.com); parent ApplicationSets live in argocd.
                  #    Both carry platform.capstone/semester, so $SEL matches them.
                  CLAIMS=$(kubectl get capstonetenants -l "$SEL" \
                             -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)
                  APPSETS=$(kubectl -n argocd get applicationsets -l "$SEL" \
                              -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)
                  if [ -n "$CLAIMS" ] || [ -n "$APPSETS" ]; then
                    echo "==> ⚠ NOT ORPHANED YET — live controllers still own this cohort:" >&2
                    echo "    CapstoneTenant claims: ${CLAIMS:-（none）}" >&2
                    echo "    ApplicationSets:       ${APPSETS:-（none）}" >&2
                    echo "    Remove the claim(s) FIRST (git rm tenants/_claims/<team>-<app>.yaml)," >&2
                    echo "    let ArgoCD/Crossplane deprovision, THEN re-run this sweeper." >&2
                    if [ "$DRY_RUN" = "true" ]; then
                      echo "    [dry-run] continuing to show the object inventory below, but a" >&2
                      echo "    real run WOULD REFUSE until the claim/ApplicationSets are gone." >&2
                    else
                      echo "==> REFUSING to sweep (apply-fight guard). Exit 3." >&2
                      exit 3
                    fi
                  fi

                  # 1) Delete the tenant ArgoCD Applications for the cohort (so selfHeal
                  #    can't recreate the namespaces before/while we delete them).
                  APPS=$(kubectl -n argocd get applications -l "$SEL" \
                           -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' || true)
                  # 2) Delete the namespaces for the cohort.
                  NSS=$(kubectl get ns -l "$SEL" \
                          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' || true)

                  echo "==> Applications matching $SEL:"; echo "${APPS:-（none）}"
                  echo "==> Namespaces matching $SEL:";  echo "${NSS:-（none）}"

                  if [ "$DRY_RUN" = "true" ]; then
                    echo "    [dry-run] would delete the Applications then the namespaces above."
                    exit 0
                  fi

                  for A in $APPS; do
                    echo "==> deleting Application $A"
                    kubectl -n argocd delete application "$A" --ignore-not-found --wait=false || true
                  done
                  for N in $NSS; do
                    echo "==> deleting namespace $N"
                    kubectl delete ns "$N" --ignore-not-found --wait=false || true
                  done
                  echo "==> cohort-cleanup: residue sweep done. Durability comes from the"
                  echo "    claim removal (git rm tenants/_claims/...), not this job."
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
