# SealedSecret — imagePullSecret for the private Harbor image
# harbor.capstone.uamishub.com/slidedeck/slidedeck. Sealed (strict, ns+name
# bound) for secret `slidedeck-pull` in ns `slides`, which deploy/deployment.yaml
# (app repo) references under imagePullSecrets. Backed by a pull-ONLY Harbor robot
# scoped to the slidedeck project (robot$slidedeck+slidedeck-pull).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: slidedeck-pull
  namespace: slides
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: slidedeck-pull
      namespace: slides
    type: kubernetes.io/dockerconfigjson
