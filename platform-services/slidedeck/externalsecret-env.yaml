# ExternalSecret — slidedeck's application env, materialized in ns `slides` from
# Vault `secret/platform/slidedeck` (written by the operator; agents are
# classifier-gated from prod Vault writes). `deploy/deployment.yaml` (app repo)
# consumes this Secret verbatim via `envFrom.secretRef: slidedeck-env`, so every
# Vault key becomes an env var of the same name: AZURE_CLIENT_ID / AZURE_TENANT_ID
# / AZURE_CLIENT_SECRET (EntraID OIDC), SESSION_SECRET, DATABASE_URL (CNPG
# capstone-pg, db `slides`), ADMIN_EMAILS, and optionally LABMX_DATABASE_URL (the
# read-only roster-sync source — omitted disables the /admin sync button in-app).
#
# `dataFrom.extract` pulls the WHOLE Vault object so adding a key in Vault (e.g.
# LABMX_DATABASE_URL later) flows through on the next refresh with no manifest
# edit. Reads via the cluster-scoped `vault-backend` ClusterSecretStore, whose
# `external-secrets-ro` policy already grants read on secret/data/platform/*.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slidedeck-env
  namespace: slides
  labels:
    platform.capstone/component: platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: slidedeck-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: platform/slidedeck
