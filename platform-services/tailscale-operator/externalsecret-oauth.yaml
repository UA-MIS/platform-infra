# ExternalSecret — the Tailscale Kubernetes operator's OAuth client credential.
#
# The tailscale-operator Helm chart's own oauth-secret.yaml template only renders
# a Secret when `.Values.oauth.clientId` is set in the Helm VALUES — i.e. only if
# the client secret were committed to this repo. We never set that value
# (applicationsets/tailscale-operator-app.yaml leaves `oauth:` empty), so that
# template is inert and the chart falls back to its OTHER path: the operator
# Deployment always mounts a Secret named literally `operator-oauth` (this exact
# name is hardcoded in the chart's deployment.yaml — NOT derived from
# releaseName/fullnameOverride) with keys `client_id` / `client_secret`, read as
# CLIENT_ID_FILE / CLIENT_SECRET_FILE. This ExternalSecret is what actually
# produces that object, from Vault, so the credential never touches git.
#
# ── VAULT PATH: secret/data/platform/tailscale-operator (KV v2)
# Same construction as platform-services/slidedeck/externalsecret-env.yaml and
# platform-services/labmx/externalsecret-env.yaml: `dataFrom.extract` pulls the
# whole Vault object, so the key set is whatever Vault holds (must be EXACTLY
# `client_id` + `client_secret`, no more, no less — the operator only reads
# those two keys, but an extra key is harmless; a MISSING one is not — see the
# runbook in docs/operator/tailscale-operator-access.md before seeding).
#
# NO VAULT POLICY CHANGE NEEDED: the ESO controller's k8s-auth role already
# carries `external-secrets-ro`, which grants `read` on `secret/data/platform/*`
# (platform-services/external-secrets/vault-policies/eso-role.sh) — this path
# falls under that wildcard, same reasoning as the labmx/slidedeck precedents.
#
# ── WHY THIS ONLY WORKS AFTER THE HUMAN STEP
# Nothing has been written to Vault at `platform/tailscale-operator` yet (agents
# are classifier-gated out of prod Vault writes — same boundary as every other
# ExternalSecret in this repo pointing at an unseeded path). Until an operator
# creates the Tailscale OAuth client (docs/operator/tailscale-operator-access.md
# "Owner steps: create the OAuth client") and runs the `vault kv put` in that
# doc, this ExternalSecret sits SecretSyncError and the operator Deployment's
# pod stays ContainerCreating (missing volume) — NOT CrashLoopBackOff, and NOT a
# danger to anything else in the cluster. It self-heals the moment the Vault
# path is seeded; no restart or re-sync needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
  labels:
    platform.capstone/component: platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: platform/tailscale-operator
