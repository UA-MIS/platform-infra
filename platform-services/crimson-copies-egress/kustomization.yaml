# crimson-copies scoped egress (D-155 #1) — rendered by the platform-services
# directory generator (applicationsets/platform-services-appset.yaml) into
# Application `platform-svc-crimson-copies-egress`, project `platform`.
#
# The appset template's destination namespace is kube-system, but every resource
# here declares its OWN metadata.namespace (the three crimson-copies env
# namespaces) and the platform AppProject permits namespace '*', so they land
# correctly.
#
# ORDERING: the three namespaces are created by the CapstoneTenant Composition,
# not here. On a from-scratch apply this Application may briefly fail to sync
# ("namespace not found") until Crossplane reconciles the claim. The appset's
# retry + selfHeal settles it; no manual step.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - netpol.yaml

labels:
  - pairs:
      platform.capstone/component: tenant
    includeSelectors: false
