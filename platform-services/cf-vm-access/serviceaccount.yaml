# ServiceAccount the reconciler CronJob runs as. Needs only cluster-wide READ on
# Services (to enumerate the per-tenant <app>-ssh Services that define desired state)
# — see rbac.yaml. No write RBAC in-cluster; all writes are to the Cloudflare API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cf-vm-access-reconciler
  namespace: cloudflared
  labels:
    platform.capstone/component: platform
    app.kubernetes.io/name: cf-vm-access-reconciler
