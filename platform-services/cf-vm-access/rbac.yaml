# Least-privilege RBAC for the reconciler: cluster-wide READ-ONLY on Services only.
# The reconciler's desired state = every per-tenant `<app>-ssh` Service (label
# platform.capstone/access=ssh) across all `<team>-vm-prod` namespaces, so it lists
# Services cluster-wide. It never reads Secrets, never writes any in-cluster object —
# the ONLY mutations it performs are Cloudflare API calls (tunnel config + Access apps).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cf-vm-access-reconciler
  labels:
    platform.capstone/component: platform
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cf-vm-access-reconciler
  labels:
    platform.capstone/component: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cf-vm-access-reconciler
subjects:
  - kind: ServiceAccount
    name: cf-vm-access-reconciler
    namespace: cloudflared
