# ExternalSecret — the lab MariaDB's admin credentials, materialized in ns `slides`
# from Vault `secret/platform/lab-db` (written by the operator; agents are
# classifier-gated from prod Vault writes). Vault keys, already populated:
#
#   ADMIN_USER      = labadmin
#   ADMIN_PASSWORD  = <random>
#
# Read via the cluster-scoped `vault-backend` ClusterSecretStore — the SAME store
# and the SAME `platform/<name>` key convention as every other platform service
# that reads secret/platform/* (platform-services/slidedeck/externalsecret-env.yaml
# -> `platform/slidedeck`, platform-services/db-admin/externalsecret.yaml ->
# `platform/db/...`). Its `external-secrets-ro` Vault policy already grants read on
# `secret/data/platform/*`, so NO new Vault policy is needed for this path.
#
# `data` (not `dataFrom.extract`) on purpose: the Secret's keys are consumed as
# literal env-var names by the MariaDB entrypoint (MARIADB_*) and by the initdb
# script (LAB_ADMIN_*), so they must be renamed from the Vault key names rather
# than passed through.
#
# ROOT vs ADMIN. MARIADB_ROOT_PASSWORD is deliberately the SAME value as
# ADMIN_PASSWORD, because Vault holds exactly one password for this instance. That
# is safe here: mariadb.yaml pins MARIADB_ROOT_HOST=localhost, so the entrypoint
# creates root ONLY as root@'localhost' (unix-socket/loopback inside the pod) and
# never root@'%' — root is not reachable over the network at all. The account the
# app authenticates as is `labadmin`@'%' (created by initdb-configmap.yaml), which
# is the identity LAB_DB_ADMIN_URL on secret/platform/slidedeck must carry.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lab-db-admin
  namespace: slides
  labels:
    platform.capstone/component: platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: lab-db-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Consumed by the mariadb image entrypoint (root@localhost only).
        MARIADB_ROOT_PASSWORD: "{{ .adminPassword }}"
        # Consumed by /docker-entrypoint-initdb.d/10-lab-admin.sh.
        LAB_ADMIN_USER: "{{ .adminUser }}"
        LAB_ADMIN_PASSWORD: "{{ .adminPassword }}"
  data:
    - secretKey: adminUser
      remoteRef:
        key: platform/lab-db
        property: ADMIN_USER
    - secretKey: adminPassword
      remoteRef:
        key: platform/lab-db
        property: ADMIN_PASSWORD
