# mariadb-operator prereqs (db-setup task) — the namespace that must exist before
# the mariadb-operator-crds / mariadb-operator Helm Applications
# (applicationsets/mariadb-operator-{crds,}-app.yaml) install. Managed by the
# platform-services-appset (directory generator over platform-services/*; this dir
# produces app `platform-svc-mariadb-system`).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml

labels:
  - pairs:
      platform.capstone/component: platform
    includeSelectors: false
