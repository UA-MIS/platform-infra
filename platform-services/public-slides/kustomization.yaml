# platform-services/public-slides — the PLATFORM-owned prerequisites for the
# externally-sourced `public-slides` app: a public, unauthenticated static
# reveal.js slide host at public-slides.capstone.uamishub.com.
#
# Same split as slidedeck and ida-slides: the workload manifests (namespace +
# deployment + service + ingress + netpol) live in the SEPARATE app repo
# (github.com/UA-MIS/public-slides, path deploy) and are synced by the nested
# `public-slides` Application below — NOT here. Like ida-slides and unlike
# slidedeck there is no ExternalSecret: no server-side component, no database,
# no secrets to materialize from Vault.
#
# ⚠ STILL MISSING: sealedsecret-pull.yaml (the sealed Harbor image-pull robot),
# which the siblings both carry. The `public-slides-pull` robot was created in
# Harbor, but its one-time token was not captured, and Harbor v2.15's API no
# longer lists project-scoped robots in a way that let it be deleted and
# re-minted non-interactively. Until this is added the pod will
# ImagePullBackOff on the private Harbor repo. To finish:
#
#   1. Harbor UI -> Projects -> public-slides -> Robot Accounts
#      -> delete `public-slides-pull`
#   2. make harbor-robot NAME=public-slides ENV=prod PULL_NS=public-slides \
#        TARGET=real-talos KUBE_CONTEXT=admin@capstone \
#        > platform-services/public-slides/sealedsecret-pull.yaml
#   3. add `- sealedsecret-pull.yaml` to the resources list below, and commit
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - application.yaml
