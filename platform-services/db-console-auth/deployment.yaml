# oauth2-proxy — the ONE shared SSO gate for every DB console (tenant-db-access
# design, artifacts/research/tenant-db-access.md §3.2 option D), the portal's
# `/internal` route (platform-services/portal/middleware.yaml, `portal-internal-auth`
# — the FIRST consumer of the unscoped "any UA-MIS member" pattern, PR #302) and,
# since the non-prod-sso-gate PR, every non-prod tenant app URL (dev/staging/
# preview) — reusing that SAME `portal-internal-auth` Middleware rather than
# standing up a second near-identical one (see this dir's README "Consumers"
# section). Federates to Dex as the `db-console` staticClient
# (platform-services/dex/configmap.yaml) — same broker, same "one GitHub OAuth app,
# N tools" model as ArgoCD/Harbor/Backstage. The staticClient/Ingress/hostname stay
# named `db-console`/`db-auth` (not renamed to something generic) — it is still just
# the OIDC round-trip target, nobody browses here directly, and renaming it would
# touch the Dex redirectURI + GitHub OAuth app for zero functional benefit.
#
# THIS POD NEVER PROXIES REAL TRAFFIC. `--upstream=static://200` means it only ever
# answers its own `/oauth2/*` endpoints (login, callback, and the auth-check
# `/oauth2/auth`). Every per-(team,env) Adminer console's Traefik `Middleware`
# (rendered by the CapstoneTenant Composition) calls THIS Service's `/oauth2/auth`
# endpoint as a forwardAuth check, appending `?allowed_groups=UA-MIS:<team>` — so ONE
# proxy instance enforces a DIFFERENT group per route without per-team Dex config
# (Dex has no wildcard redirectURIs; see the Composition's ADMINER CONSOLE comments).
# The portal's `/internal` route and non-prod app Ingresses call the SAME endpoint
# with NO `allowed_groups` param (any UA-MIS org member — see
# platform-services/portal/middleware.yaml's header for why that's correct).
#
# `--cookie-domain` + `--whitelist-domain` (each listed TWICE — dotted + bare apex):
# the documented oauth2-proxy pattern for one proxy authenticating many subdomains —
# the session cookie is valid across every `*.capstone.uamishub.com` host, so a
# student already SSO'd into ArgoCD/Harbor/Backstage doesn't see a second login
# screen for a DB console (same Dex session, shared cookie domain). The bare apex
# `capstone.uamishub.com` is listed as a SECOND value on both flags so the apex
# landing/sign-in page (https://capstone.uamishub.com/internal) is covered too — a
# leading-dot cookie domain matches subdomains ONLY, never the bare apex host, so
# without the bare entry the apex cookie was set but never sent back, looping the
# sign-in forever. See the args block below for the length-sort selection guarantee
# that keeps subdomain consoles on the dotted domain (no regression).
#
# SSO REDIRECT: a bare 401 from `/oauth2/auth` (no session cookie yet) is converted
# into a 302 redirect to Dex/GitHub login by the shared `errors` Middleware
# (middleware.yaml, `oauth2-proxy-errors`) chained in front of every console's
# forwardAuth Middleware — see that file's header comment for the full mechanism.
# Requires `providers.kubernetesCRD.allowCrossNamespace: true`
# (applicationsets/traefik-app.yaml), since every consumer lives in a different
# namespace than this one.
#
# ⚠ TLS TO DEX: id.capstone.uamishub.com's in-cluster split-horizon rewrite
# (platform-services/coredns-custom/coredns-custom.yaml) is a documented NO-OP on
# Talos — in-cluster requests to the issuer currently egress via public DNS to
# Cloudflare's edge (a publicly-trusted cert), same path ArgoCD/Backstage already use
# for OIDC discovery today. So this Deployment sets NO special TLS trust config
# (relies on the image's default CA bundle) — if the coredns-custom split-horizon is
# ever fixed (Talos-native CoreDNS, tracked there as a BACKLOG item), in-cluster
# traffic would switch to hitting Traefik directly with the self-signed platform CA
# and this Deployment would need `--provider-ca-file` pointed at a mounted
# `platform-ca` ConfigMap (same pattern as platform-services/arc/hook-template.yaml) —
# revisit at that point, not needed today.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: db-console-auth
  labels:
    platform.capstone/component: platform
    app.kubernetes.io/name: oauth2-proxy
spec:
  # 1 -> 2 (non-prod-sso-gate PR): this proxy previously answered forwardAuth checks
  # only for DB-console page loads (low, occasional traffic). Gating every non-prod
  # tenant app URL (dev/staging/preview, ALL paths) means Traefik now calls
  # /oauth2/auth on every request to those hosts — a much higher, steadier request
  # rate. The check itself is cheap (session-cookie validation, no per-request
  # upstream call), so this is headroom/HA, not a hard scaling requirement: 2
  # replicas means a pod restart/reschedule no longer produces a window where every
  # gated host's forwardAuth check fails closed. Still well within the existing tiny
  # resource footprint (10m cpu / 32Mi mem request per pod, below).
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
        platform.capstone/component: platform
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
          imagePullPolicy: IfNotPresent
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://id.capstone.uamishub.com
            - --redirect-url=https://db-auth.capstone.uamishub.com/oauth2/callback
            - --client-id=db-console
            # Same requestedScopes as ArgoCD's oidc.config (argocd-cm.yaml) — needs
            # the `groups` claim for the per-route allowed_groups check downstream.
            - --scope=openid profile email groups
            - --oidc-groups-claim=groups
            # Org membership is already gated upstream at Dex (GitHub connector
            # `orgs: [UA-MIS]`, SEC-007) — any authenticated UA-MIS member passes
            # THIS proxy's own login; the per-team restriction happens per-request via
            # each Middleware's `?allowed_groups=UA-MIS:<team>` querystring, not here.
            - --email-domain=*
            # BOTH the dotted domain (every *.capstone.uamishub.com console) AND the
            # bare apex host are listed. oauth2-proxy accepts these flags repeatedly and
            # sorts the domains DESCENDING by length at load (pkg/validation/cookie.go:
            # `sort.Slice(o.Domains, len(i) > len(j))`), then GetCookieDomain returns the
            # FIRST suffix match (pkg/cookies/cookies.go). So a subdomain request
            # (db-admin.capstone.uamishub.com) still matches `.capstone.uamishub.com`
            # first (longest, 23 chars) — subdomain consoles do NOT regress — while the
            # bare apex `capstone.uamishub.com` fails the dotted suffix (a leading `.`
            # requires a char before it) and matches the bare entry. Without the bare
            # entry the apex session cookie is scoped to `.capstone.uamishub.com` and is
            # NOT sent back on the bare apex host → the /internal sign-in loops forever
            # (confirmed live via cookies.go "did not match any of the specific cookie
            # domains" warnings on every apex request). whitelist-domain gets the apex
            # too so the post-auth `rd` redirect to https://capstone.uamishub.com/... is
            # allowed. Order here is cosmetic — the load-time length sort is what governs
            # selection. Docs: "The longest domain matching the request's host will be
            # used" (oauth2-proxy configuration/overview, cookie-domain).
            - --cookie-domain=.capstone.uamishub.com
            - --cookie-domain=capstone.uamishub.com
            - --whitelist-domain=.capstone.uamishub.com
            - --whitelist-domain=capstone.uamishub.com
            - --cookie-secure=true
            - --cookie-samesite=lax
            # No real upstream — this proxy only ever answers its own /oauth2/*
            # endpoints (see header). Traefik forwardAuth treats any 2xx as "allow".
            # --- STATIC-ASSET BYPASS (SEC: this is an auth bypass — read both flags
            #     together, they are ONE change and neither works alone).
            #
            #     WHY: tenant app hosts are SSO-gated on ALL paths. A CSS/JS request
            #     that misses Cloudflare's cache reaches the origin, hits this gate and
            #     gets a 302 to the sign-in page — so the browser receives text/html
            #     where it expected text/css and silently drops the stylesheet. It is
            #     intermittent by construction: a cache HIT works, a MISS breaks. Two
            #     mychef students hit this on two machines and two browsers.
            #     Confirmed live: GET /assets/index-BideAULp.css -> 200 text/css
            #     (cf-cache-status: HIT), but the SAME url with a cache-busting query
            #     -> 302 text/html (cf-cache-status: BYPASS). The origin is gated; only
            #     Cloudflare's cached copy was ever public.
            #
            #     ⚠ --reverse-proxy=true IS LOAD-BEARING FOR THE LINE BELOW. In a
            #     Traefik forwardAuth topology Traefik calls THIS proxy at
            #     `/oauth2/auth` and carries the real path in `X-Forwarded-Uri`. Without
            #     --reverse-proxy, oauth2-proxy evaluates --skip-auth-regex against its
            #     OWN path (`/oauth2/auth`), never reads X-Forwarded-Uri, and the regex
            #     matches NOTHING — the bypass is silently inert while looking correct
            #     in git. Measured on v7.15.3 with this exact flag set:
            #         without --reverse-proxy: X-Forwarded-Uri=/assets/x.css -> 401
            #         with    --reverse-proxy: X-Forwarded-Uri=/assets/x.css -> 202
            #     Do not remove one of these two flags without removing the other.
            #
            #     --reverse-proxy is safe here on the two axes that could have bitten:
            #     (1) it makes oauth2-proxy trust X-Forwarded-*, but this namespace's
            #     NetworkPolicy admits ingress ONLY from kube-system (Traefik), so no
            #     tenant workload can spoof those headers; (2) it does NOT hijack the
            #     OIDC redirect_uri — with --redirect-url pinned above, the pin wins.
            #     Verified: with the pin, redirect_uri stays db-auth.capstone... under
            #     --reverse-proxy; WITHOUT the pin it would derive from
            #     X-Forwarded-Host and Dex would reject every login. Never drop
            #     --redirect-url while --reverse-proxy is set.
            #
            #     SCOPE — deliberately narrower than "^/assets/". This proxy is SHARED
            #     by every tenant dev/staging host, every DB console, db-admin and the
            #     portal's /internal, so anything matched here is bypassed for ALL of
            #     them. The pattern is therefore anchored to a known static extension
            #     rather than a path prefix:
            #       - `.map` is EXCLUDED — source maps are gated today (verified: 302,
            #         cf-cache-status DYNAMIC, Cloudflare does not cache them) and a
            #         bare `^/assets/` prefix would have newly published original source.
            #       - `.json` and any other non-listed extension stay gated for the
            #         same reason.
            #       - Path segments cannot contain `.`, so `..` cannot appear: this
            #         cannot be walked out of /assets/ via path confusion. `/assets/
            #         ../api/secret.css` -> 401 (an unanchored pattern returned 202).
            #     oauth2-proxy strips the query before matching, so `?v=1` still
            #     matches and a query cannot be used to smuggle a different path.
            #     Verified against this exact production flag set: asset 202, nested
            #     asset 202, `/` 401, `/api/auth/login` 401, `.map` 401, traversal 401.
            - --reverse-proxy=true
            - '--skip-auth-regex=^/assets/([A-Za-z0-9_~-]+/)*[A-Za-z0-9_~-]+(\.[A-Za-z0-9_~-]+)*\.(css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico|webp|avif)$'
            - --upstream=static://200
            - --http-address=0.0.0.0:4180
            - --skip-provider-button=true
            - --silence-ping-logging=true
            - --standard-logging=true
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-credentials
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-credentials
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 15
          # Tiny, stateless proxy — same footprint class as Dex.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532   # the image's own default nonroot UID (distroless base, v7.6+)
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
