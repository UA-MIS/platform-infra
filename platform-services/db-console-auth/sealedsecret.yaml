# oauth2-proxy credentials (tenant-db-access design). Two values, neither derivable
# from git:
#   client-secret — MUST equal the `db-console` Dex staticClient's secret
#                   (platform-services/dex/configmap.yaml's DB_CONSOLE_CLIENT_SECRET,
#                   sealed into platform-services/dex/sealedsecret.yaml's
#                   `db-console-client-secret` key). Both sides of the OIDC handshake
#                   need to agree on this value.
#   cookie-secret — oauth2-proxy's own AES key for its session cookie (16/24/32 raw
#                   bytes, base64-encoded, e.g. `openssl rand -base64 32`). Unrelated
#                   to Dex; generated once for this proxy only.
#
# PLACEHOLDER VALUES — same live pattern as platform-services/dex/sealedsecret.yaml's
# GitHub creds: this SealedSecret decrypts fine (it IS validly sealed against the live
# controller's public cert, scoped to THIS namespace only) and the Deployment starts,
# but SSO login fails until the operator re-seals with the REAL client-secret chosen
# in the Dex re-seal step (platform-services/dex/README.md "DB console static
# client"). The cookie-secret placeholder is a real, validly-formatted random value —
# it does not need a matching counterpart anywhere else, so it is safe to leave as-is
# (or regenerate) at go-live; regenerating it just invalidates any existing sessions.
#
# Re-seal recipe (after picking the real client-secret and matching Dex's re-seal):
#   cat > /tmp/oauth2-proxy-secret.yaml <<EOF
#   apiVersion: v1
#   kind: Secret
#   metadata: { name: oauth2-proxy-credentials, namespace: db-console-auth }
#   type: Opaque
#   stringData:
#     client-secret: "<SAME VALUE sealed into dex-github's db-console-client-secret>"
#     cookie-secret: "$(openssl rand -base64 32)"
#   EOF
#   make seal SECRET=/tmp/oauth2-proxy-secret.yaml NS=db-console-auth \
#     > platform-services/db-console-auth/sealedsecret.yaml
#   # commit on a branch + PR, then after sync:
#   kubectl -n db-console-auth rollout restart deploy/oauth2-proxy
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: oauth2-proxy-credentials
  namespace: db-console-auth
spec:
  encryptedData:
    client-secret: 
    cookie-secret: 
  template:
    metadata:
      name: oauth2-proxy-credentials
      namespace: db-console-auth
    type: Opaque
