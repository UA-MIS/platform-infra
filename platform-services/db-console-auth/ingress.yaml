# oauth2-proxy Ingress. Exposes the login/callback UI paths at
# db-auth.capstone.uamishub.com — this is the host Dex's `db-console` staticClient
# redirectURI points at (platform-services/dex/configmap.yaml). Matches the dex/
# argocd-config Ingress convention exactly: plain Ingress, TLS host listed but NO
# secretName — Traefik's default TLSStore serves the cert-manager wildcard cert for
# *.capstone.uamishub.com.
#
# NOTE: this Ingress does NOT need a forwardAuth Middleware itself — it IS the auth
# service. Every per-(team,env) console Ingress instead references this Service via a
# Middleware's forwardAuth.address (not this Ingress).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth2-proxy
  namespace: db-console-auth
  labels:
    platform.capstone/component: platform
    app.kubernetes.io/name: oauth2-proxy
spec:
  rules:
    - host: db-auth.capstone.uamishub.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 4180
  tls:
    - hosts:
        - db-auth.capstone.uamishub.com
