# db-console-auth namespace (tenant-db-access design, artifacts/research/
# tenant-db-access.md §3.2 option D) — the ONE shared oauth2-proxy that fronts every
# per-(team,env) Adminer console + the platform-admin Adminer. A platform singleton
# (same tier as Dex/ArgoCD/Harbor: human-reviewed once, never touched per onboarding),
# NOT a per-tenant namespace.
#
# Ships via the platform-services directory generator (platform-services-appset) ->
# Application `platform-svc-db-console-auth`.
#
# pod-security: RESTRICTED. oauth2-proxy is a stateless, unprivileged reverse-proxy
# process — no host mounts, no extra caps — so the strictest PSA profile fits.
apiVersion: v1
kind: Namespace
metadata:
  name: db-console-auth
  labels:
    platform.capstone/component: platform
    goldilocks.fairwinds.com/enabled: "true"   # Goldilocks recommend-only VPAs (Off mode; no eviction)
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
