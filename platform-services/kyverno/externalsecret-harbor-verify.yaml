# SEC-043: Harbor pull credential for the verify-image-signature ClusterPolicy
# (platform-services/kyverno-policies/verify-image-signature.yaml). Without this,
# Kyverno's cosign step hits every Harbor project anonymously and gets
# `401 UNAUTHORIZED` trying to fetch the manifest/signature, which the policy report
# records as a verification FAILURE indistinguishable from "actually unsigned" —
# the report is noise until this credential exists.
#
# Vault + ESO (ADR-030 §0), same as everywhere else in the fleet — NO secret
# material in git. Robot is Harbor SYSTEM-level, PULL-ONLY, scoped to namespace "*"
# (every project) because imageReferences on the policy is
# `harbor.capstone.uamishub.com/*` — i.e. it must be able to read any project's
# manifests, but must never be able to push to any of them (least privilege: a
# signature *verifier* only ever reads).
#
# ── Vault path contract (KV v2; ESO reads secret/data/<path>) ──────────────────
#   platform/harbor/kyverno-verify   { username, password }
# Already covered by the existing `external-secrets-ro` Vault policy (read on
# secret/data/platform/* — platform-services/external-secrets/vault-policies/
# eso-role.sh) — NO Vault policy change needed, only the value needs writing.
# Per the db-tier precedent, writing the value into Vault is an ORCHESTRATOR/
# operator step (agents are classifier-gated from prod secret writes) — see
# docs/operator/kyverno-verify-image-credential.md for the exact command. Until
# that value exists this ExternalSecret sits SecretSyncError (safe failure mode)
# and Kyverno keeps failing UNAUTHORIZED exactly as it does today — no regression.
#
# Target is a standard `kubernetes.io/dockerconfigjson` Secret (the same shape
# imagePullSecrets use) named to match what verify-image-signature.yaml's
# `imageRegistryCredentials.secrets` references. Kept in the SAME namespace
# (kyverno) as a bare name — Kyverno 1.18's "look in my own namespace" default —
# so no cross-namespace RBAC Role/RoleBinding is needed (contrast: a namespace/name
# reference would require granting the admission+background controllers `get` on
# Secrets in that other namespace).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-kyverno-verify
  namespace: kyverno
  labels:
    platform.capstone/component: platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-kyverno-verify
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {{ printf `{"auths":{"harbor.capstone.uamishub.com":{"username":"%s","password":"%s","auth":"%s"}}}` .username .password (printf "%s:%s" .username .password | b64enc) }}
  data:
    - secretKey: username
      remoteRef:
        key: platform/harbor/kyverno-verify
        property: username
    - secretKey: password
      remoteRef:
        key: platform/harbor/kyverno-verify
        property: password
