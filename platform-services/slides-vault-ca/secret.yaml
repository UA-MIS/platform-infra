# vault-ca Secret in ns `slides` — the PUBLIC Vault server CA PEM (git-safe).
#
# WHY: the slides app (UA-MIS/slidedeck) writes per-student DB credentials to
# Vault over HTTPS, and Vault's server certificate is issued by the platform's
# own PRIVATE CA (CN=capstone-platform-ca, self-signed). Without this CA in its
# trust store the app cannot verify the connection and must either fail or run
# with TLS verification disabled. Its Deployment mounts this Secret at
# /var/run/secrets/vault-ca with `optional: true`, so landing it is strictly
# non-breaking: the app runs today without it and picks it up on restart.
#
# WHY A COMMITTED MANIFEST RATHER THAN ESO — this is the platform's ESTABLISHED
# pattern for exactly this problem, not a shortcut. The same CA is already
# committed in three other places for the same reason:
#   platform-services/crossplane/config/vault-ca-configmap.yaml  (provider-vault
#     + the vault-push SecretStore's caProvider)
#   platform-services/arc/platform-ca-configmap.yaml
#   platform-services/crossplane/apis/composition.yaml           (per-tenant drop)
# whose own comment states it plainly: "The CA cert is PUBLIC — NOT secret
# material — so it is git-safe." A CA certificate is a public key; there is no
# confidentiality to protect and nothing here for an attacker to learn.
#
# The ESO alternatives were evaluated and REJECTED:
#   * ESO Kubernetes-provider SecretStore reading `vault-server-tls` from ns
#     `vault`. ESO's own docs require the store's identity to hold get+list+watch
#     on `secrets` in the SOURCE namespace, and RBAC cannot scope list/watch to a
#     single resourceName — so this would grant a slides-namespace ServiceAccount
#     the ability to enumerate and read EVERY Secret in ns `vault`, which today
#     holds `vault-transit-unseal-token` (the auto-unseal transit token) and
#     `vault-unsealer-ca`. Trading a public certificate for read access to the
#     unseal credential is a bad trade. It would also be the first use of ESO's
#     Kubernetes provider anywhere in this repo (every existing store is
#     provider.vault) — new machinery for a solved problem.
#   * Staging the CA into Vault at secret/platform/vault-ca and reading it back
#     through the existing `vault-backend` ClusterSecretStore. Workable, but
#     strictly worse than this file: the copy in Vault would ALSO be a manual
#     snapshot that does not track CA rotation, so it buys no freshness while
#     adding an operator write and a second copy.
#   * A reflector/replicator (emberstack, kubernetes-replicator) — none is
#     installed in this cluster (verified live: no such workload, CRD, or
#     reflector-style annotation anywhere), so this would mean adopting a new
#     controller to copy one public file.
#   * A Kyverno generate+clone rule. NOTE: Kyverno IS installed and healthy here
#     (v1.18.1, 4 controllers Ready in ns `kyverno`, INCLUDING the
#     background-controller that executes `generate` rules) — this chart already
#     depends on Kyverno enforcement in several places, e.g. the
#     `disallow-latest-tag` note in _helpers.tpl. So this option is genuinely
#     AVAILABLE, and unlike the ESO option above it carries NO RBAC downside:
#     Kyverno's own background controller does the copying, and the slides
#     namespace gets no new permission at all. It is rejected purely on
#     PROPORTIONALITY: there are currently ZERO `generate` rules anywhere in this
#     cluster (verified live across all ClusterPolicies/Policies — every existing
#     policy is validate-only), and introducing the first one, plus the
#     background-reconciliation and policy-ownership semantics that come with it,
#     to copy a single static public file is more machinery than the problem
#     warrants. If the platform ever adopts `generate` rules for other reasons,
#     this file is a reasonable thing to fold into them.
#
# A Secret (not a ConfigMap, unlike the crossplane/arc copies above) because the
# consumer mounts it as a `secret:` volume — a ConfigMap volume source would not
# satisfy that mount.
#
# OWNERSHIP: ns `slides` is created and owned by the SEPARATE `slidedeck`
# Application (source repo UA-MIS/slidedeck, path deploy/). Like
# platform-services/lab-db/, this dir ships NO Namespace object and pins
# `namespace: slides` explicitly. `vault-ca` does not exist in ns `slides` today
# (verified live) and the slidedeck repo does not create it — it only mounts it —
# so there is exactly one owner. If slidedeck ever ships its own copy, that
# becomes a dual-owned resource and ArgoCD will raise a SharedResourceWarning;
# delete one side if that happens.
#
# COMMITTED COPY — VERIFIED against the live cluster at authoring time: this PEM
# is byte-identical (DER sha256 match) to `ca.crt` in Secret `vault-server-tls`,
# ns `vault` — the very key the `vault-backend` ClusterSecretStore's caProvider
# already references. Self-signed, notAfter 2036-06-15, so rotation is not
# expected on any near horizon. If the Vault server CA IS ever rotated, this file
# goes stale and must be re-committed alongside the three copies listed above.
# The auto-distributing fix (cert-manager trust-manager Bundle) is the same
# post-demo TODO already recorded in vault-ca-configmap.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: vault-ca
  namespace: slides
  labels:
    platform.capstone/component: platform
type: Opaque
stringData:
  ca.crt: |
