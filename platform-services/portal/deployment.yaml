# The portal — a tiny static site (2 self-contained HTML/CSS pages, no JS
# framework, no backend). `nginxinc/nginx-unprivileged` (listens on 8080, runs as
# the image's own non-root UID 101 by default) instead of the stock `nginx` image
# so this fits the namespace's `restricted` PSA profile with NO capability grants
# (stock nginx needs root or NET_BIND_SERVICE to bind :80) — same rationale as
# db-admin's Adminer using PORT=8080 to avoid a privileged bind.
#
# Content is a ConfigMap (portal-site, generated by kustomization.yaml from the
# site/ dir) mounted with per-file subPaths: index.html at the html root (the
# PUBLIC page) and internal.html at internal/index.html (the GATED page —
# stock nginx directory-index resolution serves it for any request under
# /internal/, matching the /internal Ingress path; no custom nginx.conf needed).
#
# readOnlyRootFilesystem: nginx still needs a few writable scratch dirs at
# runtime (client body temp files, proxy_temp, the pid file) even though it never
# proxies or writes app data — those are emptyDirs below, same pattern as any
# hardened nginx deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: portal
  labels:
    platform.capstone/component: platform
    app.kubernetes.io/name: portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal
        platform.capstone/component: platform
    spec:
      # Spread the 2 replicas across nodes — same posture as cloudflared, this is
      # the front door for every visitor to the platform.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: portal
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine   # PINNED minor — bump deliberately
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          # Tiny static site — same footprint class as Dex/oauth2-proxy.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101   # nginxinc/nginx-unprivileged's own default non-root UID
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: portal-site
              subPath: index.html
              mountPath: /usr/share/nginx/html/index.html
              readOnly: true
            - name: portal-site
              subPath: internal.html
              mountPath: /usr/share/nginx/html/internal/index.html
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: var-cache-nginx
              mountPath: /var/cache/nginx
            - name: var-run
              mountPath: /var/run
      volumes:
        - name: portal-site
          configMap:
            name: portal-site
        - name: tmp
          emptyDir: {}
        - name: var-cache-nginx
          emptyDir: {}
        - name: var-run
          emptyDir: {}
