# Portal nginx server config — OVERRIDES the image's stock
# /etc/nginx/conf.d/default.conf (mounted via subPath from the portal-site
# ConfigMap). Kept intentionally minimal: same listen port, same docroot, same
# directory-index resolution as the stock config, so the existing static-file
# serving is unchanged:
#   /           -> /usr/share/nginx/html/index.html          (PUBLIC page)
#   /internal/  -> /usr/share/nginx/html/internal/index.html (GATED page)
#
# The ONLY functional change vs stock is the two redirect directives below.
#
# WHY (apex sign-in bug, third and final in the chain after Traefik
# forwarded-headers #326 and the oauth2-proxy apex cookie domain #330):
# oauth2-proxy's post-login callback redirects to `/internal` WITHOUT a trailing
# slash. `/internal` is a directory, so nginx auto-issues a 301 adding the slash.
# With the stock default (`absolute_redirect on`), nginx builds an ABSOLUTE
# Location from its own listen socket -> `http://capstone.uamishub.com:8080/internal/`.
# The `:8080` (nginx's non-root container port, NOT TLS) makes the browser attempt
# a plaintext connection on 8080 through the TLS edge -> Firefox "SSL record
# exceeded max length" / Secure Connection Failed.
#
# `absolute_redirect off;` makes that auto-slash redirect RELATIVE
# (`Location: /internal/`) — no scheme, no host, no port — so the browser stays
# on https://capstone.uamishub.com and resolves the slash correctly at the edge.
# `port_in_redirect off;` is belt-and-suspenders: even for any redirect nginx
# still builds absolutely, it will not append the listen port.
#
# NOTE: must stay `listen 8080;` — the nginx-unprivileged image runs as non-root
# UID 101 and cannot bind :80 (that is the whole reason this image is used; see
# deployment.yaml).
server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The fix: never leak scheme/host/port into redirects. The auto
    # add-trailing-slash 301 for /internal becomes a relative `Location: /internal/`.
    absolute_redirect off;
    port_in_redirect  off;

    location / {
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
    }
}
