# SPIFFE/SPIRE workload-identity baseline — DECOMMISSIONED 2026-09-21.
#
# Owner decision: SPIRE was built as an exploratory baseline (see README.md)
# and never acquired a real consumer. Verified across every pod in the
# cluster: the only workloads mounting the SPIFFE/SPIRE Workload API socket
# (CSI or hostPath) were SPIRE's own server, agents, and its one-shot demo
# Job (spire-demo-client, already Complete). No ClusterSPIFFEID registers a
# real external workload — see README.md "Decommissioned" section for the
# full re-verification.
#
# This dir, and the two Helm-chart Applications it used to accompany
# (applicationsets/spire-app.yaml, applicationsets/spire-crds-app.yaml — both
# REMOVED from git in the decommission PR), are kept only as documentation so
# a future SPIRE re-enable does not start from zero. The resources below are
# left in place, unreferenced, for exactly that purpose.
#
# RUNNING STATE: none. Emptying `resources:` here means the
# `platform-svc-spire` Application (still generated by the platform-services
# directory generator — this dir intentionally is NOT excluded from that
# glob) renders nothing, so ArgoCD's normal prune+selfHeal deletes the
# spire-system / spire-server / spire-demo namespaces and the demo
# ClusterSPIFFEID/Job it used to manage. Combined with the removal of the two
# chart Applications in the same PR, this fully un-deploys SPIRE.
#
# TO RE-ENABLE: restore applicationsets/spire-app.yaml and
# applicationsets/spire-crds-app.yaml from git history (this file's
# decommission commit has their last-good content in its parent), then
# uncomment the resources list below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# resources:
#   - namespace-system.yaml
#   - namespace-server.yaml
#   - namespace-demo.yaml
#   - demo-clusterspiffeid.yaml
#   - demo-workload.yaml

labels:
  - pairs:
      platform.capstone/component: platform
    includeSelectors: false
