# Vault Raft snapshot CronJob (ADR-030 B1, Track-2 DR) — periodic disaster-recovery
# backups of the main Vault's integrated Raft storage to a Ceph PVC.
#
# WHY: Vault is now load-bearing (the single store behind ESO). A corrupt PVC, a
# fat-fingered `vault delete`, or a botched upgrade has no recovery path WITHOUT a
# snapshot. `vault operator raft snapshot save` is the supported OSS backup path
# (the `sys/storage/raft/snapshot-auto` automated API is Vault ENTERPRISE only — so
# we drive `snapshot save` from this Kubernetes CronJob instead).
#
# AUTH (the scoped cred): the job authenticates to Vault via the KUBERNETES auth
# method as the `vault-snapshot` ServiceAccount, bound to the `snapshot` role whose
# only policy grants `read` on `sys/storage/raft/snapshot`. NO static token is
# stored in git — the SA's projected token is exchanged for a short-lived Vault
# token at run time. The policy + role are created by the committed, re-runnable
# script platform-services/external-secrets/vault-policies/snapshot-role.sh (operator
# runs it once via `kubectl -n vault exec -i vault-0 -- sh < ...`; see runbook §D). If
# that role is missing, EVERY run fails `invalid role name "snapshot"` at login. This
# manifest only ships the SA, PVC, and CronJob (the GitOps-able half).
#
# RESTORE: `vault operator raft snapshot restore <file>` against a running, unsealed
# Vault — see the runbook §E. RETENTION: the job keeps the newest $RETAIN snapshots
# (default 14 daily) and prunes older ones from the PVC.
#
# VAULT_ADDR (3-node HA note): points at the `vault-active` Service, NOT the
# generic `vault` Service. `vault` round-robins across all 3 pods (leader +
# standbys); `vault-active` always resolves to the current raft leader (the
# chart labels it `vault-active: "true"` and re-points the Service on failover).
# `snapshot save`/`restore` are raft-local operations, not part of Vault's normal
# request-forwarding path — running them against a standby fails, so target the
# leader explicitly rather than relying on round-robin luck.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-snapshot
  namespace: vault
  labels:
    platform.capstone/component: platform
---
# Dedicated PVC for snapshots (Ceph RBD, replica-3 — survives a node loss). Separate
# from the Vault data PVC so a Vault-data failure does NOT take the backups with it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-snapshots
  namespace: vault
  labels:
    platform.capstone/component: platform
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-raft-snapshot
  namespace: vault
  labels:
    platform.capstone/component: platform
spec:
  schedule: "0 3 * * *"            # daily at 03:00 (cluster TZ); tune as needed
  concurrencyPolicy: Forbid        # never overlap snapshot runs
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            platform.capstone/component: platform
            app.kubernetes.io/name: vault-raft-snapshot
        spec:
          serviceAccountName: vault-snapshot
          restartPolicy: Never
          securityContext:
            # Official hashicorp/vault image runs as uid 100 (vault) / gid 1000;
            # fsGroup lets that user write the snapshot file onto the Ceph PVC.
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: snapshot
              image: hashicorp/vault:1.21.2     # same pinned image as the server
              imagePullPolicy: IfNotPresent
              env:
                - name: VAULT_ADDR
                  # Must be the FULL FQDN (not the short "vault-active.vault.svc"
                  # form) — vault-server-tls's SAN list includes
                  # vault-active.vault.svc.cluster.local but NOT the shortened
                  # form, so a short-form VAULT_ADDR fails TLS verification with
                  # "x509: certificate is valid for ..., not vault-active.vault.svc".
                  value: "https://vault-active.vault.svc.cluster.local:8200"
                - name: VAULT_CACERT
                  value: "/vault/tls/ca.crt"     # CA that signed the server cert (from vault-server-tls)
                - name: VAULT_ROLE
                  value: "snapshot"              # k8s auth role (runbook §D)
                - name: RETAIN
                  value: "14"                    # keep newest N snapshots; prune older
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  JWT="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                  VAULT_TOKEN="$(vault write -field=token auth/kubernetes/login \
                      role="${VAULT_ROLE}" jwt="${JWT}")"
                  export VAULT_TOKEN

                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                  DEST="/snapshots/vault-raft-${TS}.snap"

                  # Cleanup trap: on ANY non-zero exit, delete the partial DEST so a failed
                  # run never strands a multi-hundred-MB truncated .snap on the PVC — then
                  # ALWAYS apply retention. (Previously `set -e` exited BEFORE retention on a
                  # failed `snapshot save`, so failed 141M files piled up run after run.)
                  cleanup() {
                    rc=$?
                    if [ "${rc}" -ne 0 ] && [ -f "${DEST}" ]; then
                      echo "[snapshot] run failed (rc=${rc}); removing partial ${DEST}" >&2
                      rm -f "${DEST}"
                    fi
                    ls -1t /snapshots/vault-raft-*.snap 2>/dev/null \
                      | tail -n +"$((RETAIN + 1))" | xargs -r rm -f
                    exit "${rc}"
                  }
                  trap cleanup EXIT

                  # Preflight — confirm VAULT_ADDR resolves to the RAFT LEADER. `snapshot
                  # save` is a raft-local op that is NOT request-forwarded to the active node
                  # (hashicorp/vault#15258): landing on a standby silently yields an incomplete
                  # snapshot ("unable to read SHA256SUMS.sealed file"). vault-active should
                  # always point at the leader, but a failover label-race could misroute us —
                  # fail fast rather than write a bad backup. The active node is the only one
                  # whose `vault status -format=json` reports `"is_self": true` (standbys omit
                  # the field). `grep -q` isolates this from `set -e` even when status is
                  # non-zero (sealed/unreachable node).
                  if vault status -format=json 2>/dev/null \
                       | grep -q '"is_self"[[:space:]]*:[[:space:]]*true'; then
                    :
                  else
                    echo "[snapshot] FATAL: VAULT_ADDR=${VAULT_ADDR} is not the active raft node" >&2
                    echo "[snapshot] (or is sealed/unreachable); refusing to write an incomplete" >&2
                    echo "[snapshot] snapshot. Check the vault-active Service and its endpoints." >&2
                    exit 1
                  fi

                  echo "[snapshot] saving ${DEST}"
                  if ! vault operator raft snapshot save "${DEST}"; then
                    echo "[snapshot] FATAL: 'raft snapshot save' failed." >&2
                    echo "[snapshot] If the error is 'unable to read SHA256SUMS.sealed file', the" >&2
                    echo "[snapshot] transit auto-unseal backend (vault-unsealer.vault-unsealer.svc)" >&2
                    echo "[snapshot] is unreachable or SEALED, so Vault cannot seal-wrap the snapshot" >&2
                    echo "[snapshot] checksums. Verify with 'kubectl -n vault-unsealer exec" >&2
                    echo "[snapshot] vault-unsealer-0 -- vault status' and unseal it per" >&2
                    echo "[snapshot] artifacts/design/vault-dr-runbook.md." >&2
                    exit 1
                  fi

                  # Validate: a complete snapshot is a non-empty gzip tarball. Guard against a
                  # 0-byte / truncated file ever being counted as a good DR backup.
                  if ! gzip -t "${DEST}" 2>/dev/null; then
                    echo "[snapshot] FATAL: ${DEST} is not a valid gzip archive — corrupt/incomplete." >&2
                    exit 1
                  fi
                  echo "[snapshot] saved $(wc -c < "${DEST}") bytes, gzip-verified OK"
                  echo "[snapshot] retention keeps newest ${RETAIN}; current snapshots:"
                  ls -1t /snapshots/vault-raft-*.snap 2>/dev/null || true
              volumeMounts:
                - name: snapshots
                  mountPath: /snapshots
                - name: vault-tls
                  mountPath: /vault/tls
                  readOnly: true
          volumes:
            - name: snapshots
              persistentVolumeClaim:
                claimName: vault-snapshots
            - name: vault-tls
              secret:
                secretName: vault-server-tls   # must include ca.crt (cert-manager provides it)
