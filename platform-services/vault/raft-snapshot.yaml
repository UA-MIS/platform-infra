# Vault Raft snapshot CronJob (ADR-030 B1, Track-2 DR) — periodic disaster-recovery
# backups of the main Vault's integrated Raft storage to a Ceph PVC.
#
# WHY: Vault is now load-bearing (the single store behind ESO). A corrupt PVC, a
# fat-fingered `vault delete`, or a botched upgrade has no recovery path WITHOUT a
# snapshot. `vault operator raft snapshot save` is the supported OSS backup path
# (the `sys/storage/raft/snapshot-auto` automated API is Vault ENTERPRISE only — so
# we drive `snapshot save` from this Kubernetes CronJob instead).
#
# AUTH (the scoped cred): the job authenticates to Vault via the KUBERNETES auth
# method as the `vault-snapshot` ServiceAccount, bound to the `snapshot` role whose
# only policy grants `read` on `sys/storage/raft/snapshot`. NO static token is
# stored in git — the SA's projected token is exchanged for a short-lived Vault
# token at run time. The policy + role are created by the committed, re-runnable
# script platform-services/external-secrets/vault-policies/snapshot-role.sh (operator
# runs it once via `kubectl -n vault exec -i vault-0 -- sh < ...`; see runbook §D). If
# that role is missing, EVERY run fails `invalid role name "snapshot"` at login. This
# manifest only ships the SA, PVC, and CronJob (the GitOps-able half).
#
# RESTORE: `vault operator raft snapshot restore <file>` against a running, unsealed
# Vault — see the runbook §E. RETENTION: the job keeps the newest $RETAIN snapshots
# (default 14 daily) and prunes older ones from the PVC.
#
# VAULT_ADDR (3-node HA note): points at the `vault-active` Service, NOT the
# generic `vault` Service. `vault` round-robins across all 3 pods (leader +
# standbys); `vault-active` always resolves to the current raft leader (the
# chart labels it `vault-active: "true"` and re-points the Service on failover).
# `snapshot save`/`restore` are raft-local operations, not part of Vault's normal
# request-forwarding path — running them against a standby fails, so target the
# leader explicitly rather than relying on round-robin luck.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-snapshot
  namespace: vault
  labels:
    platform.capstone/component: platform
---
# Dedicated PVC for snapshots (Ceph RBD, replica-3 — survives a node loss). Separate
# from the Vault data PVC so a Vault-data failure does NOT take the backups with it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-snapshots
  namespace: vault
  labels:
    platform.capstone/component: platform
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-raft-snapshot
  namespace: vault
  labels:
    platform.capstone/component: platform
spec:
  schedule: "0 3 * * *"            # daily at 03:00 (cluster TZ); tune as needed
  concurrencyPolicy: Forbid        # never overlap snapshot runs
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      # Job objects self-delete 48h after they finish. Without this, a *failed*
      # Job is retained indefinitely: failedJobsHistoryLimit only caps the count
      # at 3, and those slots are evicted by NEWER failures — so if failures stop
      # happening, the last 3 never age out. Three Failed Jobs from 2026-07-06/07/08
      # survived 26-28 days that way and pinned VaultRaftSnapshotFailing critical
      # ON continuously while every actual run succeeded (health audit 2026-08-15,
      # ADV-3). A standing false critical is worse than no alert — it trains
      # responders to ignore the channel.
      #
      # ⚠ PAIRED CHANGE: this TTL is only safe once VaultRaftSnapshotFailing stops
      # keying off `kube_job_status_failed > 0` (the existence of a Failed Job) and
      # keys off snapshot FRESHNESS instead — otherwise a genuine, unfixed failure
      # would self-clear when its Job is reaped at 48h. See platform-services/
      # monitoring/alerts.yaml.
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            platform.capstone/component: platform
            app.kubernetes.io/name: vault-raft-snapshot
        spec:
          serviceAccountName: vault-snapshot
          restartPolicy: Never
          securityContext:
            # Official hashicorp/vault image runs as uid 100 (vault) / gid 1000;
            # fsGroup lets that user write the snapshot file onto the Ceph PVC.
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: snapshot
              image: hashicorp/vault:1.21.2     # same pinned image as the server
              imagePullPolicy: IfNotPresent
              env:
                - name: VAULT_ADDR
                  # Must be the FULL FQDN (not the short "vault-active.vault.svc"
                  # form) — vault-server-tls's SAN list includes
                  # vault-active.vault.svc.cluster.local but NOT the shortened
                  # form, so a short-form VAULT_ADDR fails TLS verification with
                  # "x509: certificate is valid for ..., not vault-active.vault.svc".
                  value: "https://vault-active.vault.svc.cluster.local:8200"
                - name: VAULT_CACERT
                  value: "/vault/tls/ca.crt"     # CA that signed the server cert (from vault-server-tls)
                - name: VAULT_ROLE
                  value: "snapshot"              # k8s auth role (runbook §D)
                - name: RETAIN
                  value: "14"                    # CEILING, not a target: keep AT MOST this
                                                 # many. prune_to_fit may keep fewer when
                                                 # space is short. Never fewer than 1.
                - name: RESERVE_MB
                  value: "4096"                  # free space required BEFORE writing. A
                                                 # fixed conservative figure on purpose -
                                                 # see prune_to_fit for why recent snapshot
                                                 # sizes are not a safe basis.
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  JWT="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                  VAULT_TOKEN="$(vault write -field=token auth/kubernetes/login \
                      role="${VAULT_ROLE}" jwt="${JWT}")"
                  export VAULT_TOKEN

                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                  DEST="/snapshots/vault-raft-${TS}.snap"

                  # Cleanup trap: on ANY non-zero exit, delete the partial DEST so a failed
                  # run never strands a multi-hundred-MB truncated .snap on the PVC — then
                  # ALWAYS apply retention. (Previously `set -e` exited BEFORE retention on a
                  # failed `snapshot save`, so failed 141M files piled up run after run.)
                  cleanup() {
                    rc=$?
                    if [ "${rc}" -ne 0 ] && [ -f "${DEST}" ]; then
                      echo "[snapshot] run failed (rc=${rc}); removing partial ${DEST}" >&2
                      rm -f "${DEST}"
                    fi
                    ls -1t /snapshots/vault-raft-*.snap 2>/dev/null \
                      | tail -n +"$((RETAIN + 1))" | xargs -r rm -f
                    exit "${rc}"
                  }
                  trap cleanup EXIT

                  # ── PRUNE BEFORE WRITING, NOT ONLY IN THE EXIT TRAP ─────────────────
                  # The owner's rule, verbatim: "old vaults should NEVER cause new vaults
                  # to fail. As long as we have at least 1 backup, that's fine."
                  #
                  # The trap-only design could not satisfy that: it pruned AFTER the write,
                  # so a full PVC made `snapshot save` fail, and the space that would have
                  # let it succeed was only reclaimed once it already had. The job needed
                  # free space that it created only after failing.
                  #
                  # RESERVE_MB is a deliberately CONSERVATIVE FIXED figure, not a number
                  # derived from recent snapshot sizes. Recent sizes are untrustworthy as a
                  # basis precisely because a truncated snapshot is SMALLER than a complete
                  # one — sizing from them would shrink the reserve in exactly the situation
                  # that caused the corruption. 4096 MB comfortably exceeds the largest
                  # snapshot observed while the volume was healthy (~2.2 GB).
                  #
                  # FLOOR OF 1: the newest snapshot is never deleted, whatever the space
                  # pressure. A new snapshot failing must never cost us the last good one.
                  # If we cannot free enough while keeping it, we fail loudly WITHOUT having
                  # destroyed anything.
                  avail_mb() { df -Pm /snapshots | awk 'NR==2 {print $4}'; }

                  prune_to_fit() {
                    want="${RESERVE_MB}"
                    echo "[snapshot] prune-before-write: need ${want} MB, have $(avail_mb) MB"
                    # Oldest-first, and never the newest (tail -n +2 on a newest-first list
                    # drops the newest from the deletion candidates).
                    for old in $(ls -1t /snapshots/vault-raft-*.snap 2>/dev/null | tail -n +2 | sed '1!G;h;$!d'); do
                      [ "$(avail_mb)" -ge "${want}" ] && break
                      echo "[snapshot] pruning $(basename "${old}") ($(wc -c < "${old}") bytes) to make room"
                      rm -f "${old}"
                    done
                    have="$(avail_mb)"
                    if [ "${have}" -lt "${want}" ]; then
                      echo "[snapshot] WARNING: only ${have} MB free after pruning to the last" >&2
                      echo "[snapshot] remaining snapshot; refusing to delete it. The write may" >&2
                      echo "[snapshot] fail, but the last known backup is preserved. GROW THE PVC." >&2
                    else
                      echo "[snapshot] prune-before-write: ${have} MB free, proceeding"
                    fi
                  }
                  prune_to_fit

                  # Preflight — confirm VAULT_ADDR resolves to the RAFT LEADER. `snapshot
                  # save` is a raft-local op that is NOT request-forwarded to the active node
                  # (hashicorp/vault#15258): landing on a standby silently yields an incomplete
                  # snapshot ("unable to read SHA256SUMS.sealed file"). vault-active should
                  # always point at the leader, but a failover label-race could misroute us —
                  # fail fast rather than write a bad backup. The active node is the only one
                  # whose `vault status -format=json` reports `"is_self": true` (standbys omit
                  # the field). `grep -q` isolates this from `set -e` even when status is
                  # non-zero (sealed/unreachable node).
                  if vault status -format=json 2>/dev/null \
                       | grep -q '"is_self"[[:space:]]*:[[:space:]]*true'; then
                    :
                  else
                    echo "[snapshot] FATAL: VAULT_ADDR=${VAULT_ADDR} is not the active raft node" >&2
                    echo "[snapshot] (or is sealed/unreachable); refusing to write an incomplete" >&2
                    echo "[snapshot] snapshot. Check the vault-active Service and its endpoints." >&2
                    exit 1
                  fi

                  echo "[snapshot] saving ${DEST}"
                  if ! vault operator raft snapshot save "${DEST}"; then
                    echo "[snapshot] FATAL: 'raft snapshot save' failed." >&2
                    echo "[snapshot] If the error is 'unable to read SHA256SUMS.sealed file', the" >&2
                    echo "[snapshot] transit auto-unseal backend (vault-unsealer.vault-unsealer.svc)" >&2
                    echo "[snapshot] is unreachable or SEALED, so Vault cannot seal-wrap the snapshot" >&2
                    echo "[snapshot] checksums. Verify with 'kubectl -n vault-unsealer exec" >&2
                    echo "[snapshot] vault-unsealer-0 -- vault status' and unseal it per" >&2
                    echo "[snapshot] artifacts/design/vault-dr-runbook.md." >&2
                    exit 1
                  fi

                  # ── VALIDATE WITH `snapshot inspect`, NOT `gzip -t` ─────────────────
                  # ⚠ THIS CHECK WAS `gzip -t` AND THAT IS WHY WE SHIPPED CORRUPT BACKUPS.
                  # `gzip -t` validates the COMPRESSION STREAM. It says nothing about the
                  # ARCHIVE CONTENTS. A Vault raft snapshot is a gzipped tar containing
                  # `meta.json` AND `state.bin` (the actual state). When the PVC filled,
                  # `snapshot save` wrote an archive holding only `meta.json` with a
                  # truncated `state.bin` — and because the gzip stream itself was intact,
                  # `gzip -t` PASSED it. The script then logged "gzip-verified OK", kept the
                  # file, and retention counted it as one of the N good backups.
                  #
                  # So the guard built to stop exactly this outcome is what certified it.
                  # Demonstrated on the real artifact, not a synthetic one: see the
                  # snapshot-validity matrix in artifacts/ for the pair of results on
                  # vault-raft-20261004T030739Z.snap (690 MB).
                  #
                  # `vault operator raft snapshot inspect` parses the snapshot's actual
                  # state and fails on a truncated or incomplete one. It needs no Vault
                  # server and no token — it is a local file operation.
                  #
                  # Do NOT "optimise" this back to a cheaper check. The cost of reading the
                  # file is the entire point; a validator that does not read the state
                  # cannot tell you the state is there.
                  if ! vault operator raft snapshot inspect "${DEST}" >/dev/null 2>&1; then
                    echo "[snapshot] FATAL: ${DEST} failed 'raft snapshot inspect' — the" >&2
                    echo "[snapshot] archive is truncated or incomplete and is NOT a usable" >&2
                    echo "[snapshot] backup. Most likely cause: the PVC ran out of space" >&2
                    echo "[snapshot] mid-write. Check 'df -h /snapshots'. The partial file is" >&2
                    echo "[snapshot] removed by the exit trap so it cannot be mistaken for a" >&2
                    echo "[snapshot] good backup or occupy a retention slot." >&2
                    vault operator raft snapshot inspect "${DEST}" 2>&1 | sed 's/^/[snapshot]   /' >&2 || true
                    exit 1
                  fi
                  echo "[snapshot] saved $(wc -c < "${DEST}") bytes, VERIFIED by 'snapshot inspect'"
                  echo "[snapshot] retention keeps newest ${RETAIN}; current snapshots:"
                  ls -1t /snapshots/vault-raft-*.snap 2>/dev/null || true
              volumeMounts:
                - name: snapshots
                  mountPath: /snapshots
                - name: vault-tls
                  mountPath: /vault/tls
                  readOnly: true
          volumes:
            - name: snapshots
              persistentVolumeClaim:
                claimName: vault-snapshots
            - name: vault-tls
              secret:
                secretName: vault-server-tls   # must include ca.crt (cert-manager provides it)
