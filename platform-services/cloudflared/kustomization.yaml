# cloudflared (P3, §5 ingress, D-036) — the Cloudflare Tunnel connector that exposes
# the platform at *.capstone.uamishub.com. Managed by the platform-services-appset
# (kustomize directory generator over platform-services/*; this dir produces app
# `platform-svc-cloudflared`). Unlike Harbor/ARC/Rook, cloudflared is NOT a Helm chart
# — the Deployment + namespace + tunnel-token SealedSecret all render through here.
#
# The SealedSecret IS now rendered (the real tunnel token was sealed in #48). It
# decrypts in-cluster to Secret `cloudflared-tunnel-token`, which the Deployment
# mounts as TUNNEL_TOKEN. (Was commented out pre-seal so the app could sync cleanly
# with just namespace + Deployment; #48 sealed the real token but missed uncommenting
# this line — that gap left the app Synced-but-Degraded with NO SealedSecret CR and
# no Secret. This fix completes that step.)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - sealedsecret-tunnel-token.yaml
  # Board #157: headless scrape handle for cloudflared's :2000 metrics endpoint.
  # It lives in THIS app rather than platform-services/monitoring/ because it must
  # be in the `cloudflared` namespace, which this app owns — the same split
  # servicemonitors.yaml uses for argocd and cert-manager. Its partner
  # ServiceMonitor is platform-services/monitoring/scrape-cloudflared.yaml and is
  # registered in that app's kustomization; BOTH halves are required or
  # cloudflared_* series never reach Prometheus and the alerts in
  # monitoring/alerts-cloudflared.yaml are silently inert.
  #
  # ⚠ Like the monitoring app's, this `resources:` list is explicit, not globbed:
  # a file dropped in this directory and not listed here renders nothing, deploys
  # nothing, and reports Synced/Healthy while doing it.
  - service-metrics.yaml

labels:
  - pairs:
      platform.capstone/component: platform
    includeSelectors: false
