# Harbor tag-retention + garbage-collection config Job — durability fix for the
# 2026-07-09 registry-full incident (harbor-registry PVC hit 100% of 20Gi, ENOSPC
# on every blob upload, every Backstage image push failed). Root cause: nothing
# ever pruned old tags (backstage/backstage-process: 21 tagged artifacts, ~8.5GB;
# backstage/cache, the Kaniko layer cache: 31 layers, ~1GB) and Harbor's GC had
# never run (verified live: GET /system/gc/schedule returned an empty body, GET
# /system/gc returned []). This Job sets BOTH durably: a per-project "keep the
# most recently pushed 10 tags" retention rule, and a nightly GC schedule
# (delete_untagged:true) that reclaims the blobs retention prunes.
#
# WHY A JOB, NOT A CROSSPLANE MANAGED RESOURCE: provider-harbor (ADR-031) ships
# CRDs for both (retentionpolicies.project.harbor.crossplane.io,
# garbagecollections.garbagecollection.harbor.crossplane.io), and using them would
# make this reconciling instead of run-once. It was NOT used here because the
# ProviderConfig `default` credential (robot$provisioner, config/providerconfig-harbor.yaml)
# is deliberately least-privileged for tenant onboarding (ADR-031 §6: "project +
# robot + member admin ONLY") — verified live via GET /robots that its permission
# list has NO `tag-retention` (project-scoped) and NO `garbage-collection`
# (system-scoped) resource grants. Widening that shared onboarding-automation
# credential to include registry-wide GC power (GC pauses read/write on the whole
# registry while it runs) is a bigger blast-radius change than this incident calls
# for. `garbage-collection` in particular is Harbor SYSTEM ADMIN-only regardless of
# robot scope, and is a one-time system-wide singleton, not a per-tenant reconciling
# resource — it does not fit the Composition's "N resources per tenant" shape.
# harbor-admin (already a namespace-scoped Secret used by the sibling
# harbor-configure-oidc Job) is the right credential for both calls. If a future
# tenant-onboarding need justifies it, granting `tag-retention` (project-scope) to
# a NEW dedicated robot and folding per-project retention into the Composition is a
# reasonable follow-up — filed as a note, not done here.
#
# IDEMPOTENT: retention is create-if-absent (project metadata has no `retention_id`
# yet, verified live for both `backstage` and `swami`) then update-in-place on every
# subsequent run (PUT /retentions/{id}); GC schedule is the same create-once /
# update-in-place shape (POST when GET returns an empty body, PUT thereafter). A
# REGULAR ArgoCD resource (not a sync hook — see harbor-configure-oidc for why a
# hook-only app never fires).
#
# M660-4 — THIS IS NO LONGER A JOB, AND THE OLD ANNOTATION IS GONE ON PURPOSE.
# It used to carry Force=true,Replace=true,ServerSideApply=false so that a changed
# manifest re-ran it immediately. A CronJob must NOT carry that: Replace on a
# CronJob would recreate the schedule object rather than re-run the work, and the
# annotation is correctly absent. Do not add it back.
#
# THE COST, STATED PLAINLY: a change to this script no longer takes effect on
# merge. It waits for the next 00:30Z. That is free on an ordinary day and
# expensive on the day it is an urgent fix — e.g. correcting a rule that is
# deleting the wrong tags. THE ESCAPE HATCH, which is the whole point of writing
# this down:
#   kubectl -n harbor create job --from=cronjob/harbor-configure-retention-gc \
#     keeplist-manual-$(date +%s)
# The script is idempotent (every write is a PUT), so running it by hand at any
# time is safe and is the correct move whenever you cannot wait for 00:30Z.
#
# SAFETY (re-verified live 2026-08-27, read-only queries only — no mutating call was
# made while checking this):
#   - GC's delete_untagged:true only removes UNTAGGED artifacts (manifests with zero
#     tag references) or blobs orphaned once retention removes a tag — never a
#     tagged, in-use image.
#   - Every currently-running image tag in the cluster (checked against live pod,
#     deployment, statefulset and cronjob specs — NOT against assumption) falls in
#     the retained set under the rules below.
#
# 2026-08-27 — WHY THERE IS NOW A SECOND, "always" RULE (board #127/#136).
# The original single `latestPushedK` rule cannot tell a throwaway dev build from a
# promoted release, because on this platform they are lexically indistinguishable:
# every dev tag is a bare git short-SHA (7 or 12 hex chars) and every release tag is
# bare semver with no prefix. Ranked purely by push time, a release sinks as dev
# builds land on top of it and is eventually pruned while still deployed.
#
# This is not hypothetical. Retention execution 792 (policy 6 / ida-llm, 02:00 on
# 2026-08-26, a REAL run, not a dry run) deleted 42 tags — 14 from each of the three
# ida-llm repositories. Release tag 0.1.0 survived that run at rank 10 of 24, by a
# single position. Six pushes later it sits at rank 16 and only a hand-applied,
# git-invisible `disabled:true` on the live policy stopped the next run from taking
# it, along with 0.1.1.
#
# The protection rule keys on RETENTION_PROTECT_TAGS. `*.*.*` matches any tag with at
# least two dots — every semver release, and also a future `v`-prefixed or
# `-rc`-suffixed one — while never matching a bare hex SHA, which has no dots. Under
# `"algorithm": "or"` a tag survives if EITHER rule retains it, so this can only ever
# retain MORE than before; it can never cause a deletion that was not already going
# to happen.
#
# HONEST LIMIT OF THIS PATTERN: "contains two dots" is a heuristic, not a release
# marker. It holds only because of two conventions that nothing actually enforces —
# dev tags are hex, releases are semver. It silently fails for a release tagged `v2`
# or `release-1`, and it would pin a dev build tagged `2026.08.27.1` forever. The
# durable fix is to make releases structurally distinguishable rather than
# inferrable — an explicit `v` prefix emitted by the release workflow, or a Harbor
# immutable-tag rule on `*.*.*` (project has none today: GET /immutabletagrules
# returns [] for every project). Both are cross-repo changes to the release/CI path
# and are filed as follow-ups, not done here. `latest` is carried in the default
# pattern list because slidedeck/slidedeck genuinely has one, pushed 2026-07-24 and
# long since outside any "last 10", which the previous header wrongly asserted did
# not exist anywhere.
#
# SECRETS NEVER ON ARGV: same pattern as harbor-configure-oidc.yaml — admin password
# is injected as env via secretKeyRef; curl reads it with `-u` from
# $HARBOR_ADMIN_PASSWORD, never on the command line / in git.
# 2026-09-16 — JOB -> CRONJOB. THE KEEP-LIST HAD NO SCHEDULER.
# As a bare Job this ran only when the manifest changed, while Harbor's retention
# fires EVERY night at 02:00Z. A keep-list computed once and never refreshed is a
# snapshot that rots, and it rots fast — measured from the span of the last 10
# pushes per repo:
#     curb/curb-web-backend   0.74 days   (under 18 hours)
#     mychef/mychef-backend   1.02 days
# 21 of 36 in-use tags are protected by recency alone. curb-dev deploys a SHA tag,
# it falls out of the top 10 inside a day, and the next 02:00Z retention deletes
# it while the Deployment still references it — reintroducing, within ~48h, the
# exact failure this mechanism exists to prevent.
#
# So it now runs nightly at 00:30Z, deliberately ahead of the 02:00Z retention:
# refresh the keep-list, THEN let retention act on it. Never reorder those.
#
# TRADE-OFF ACCEPTED: a CronJob does not run on manifest change, so edits to
# RETENTION_*/QUOTA_* env now take effect at the next 00:30Z rather than at sync.
# That is correct for a nightly reconciler, and the ~24h lag is bounded and
# visible. To apply a change immediately:
#   kubectl -n harbor create job --from=cronjob/harbor-configure-retention-gc \
#     harbor-retention-manual-$(date +%s)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: harbor-configure-retention-gc
  namespace: harbor
  labels:
    platform.capstone/component: platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # 00:30Z — 90 minutes before Harbor retention at 02:00Z. The ordering is the
  # whole point of the schedule; if retention ever moves, move this with it.
  schedule: "30 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # A missed window (controller down at 00:30) still gets run, LATE, as long as it
  # is picked up within this many seconds of the scheduled time.
  # Precisely: past the deadline the run is SKIPPED, not deferred — Kubernetes does
  # not queue it for later, it abandons that occurrence and waits for the next
  # schedule. So this is "a late start is still acceptable for up to an hour", not
  # "a missed run is guaranteed to happen eventually". An outage longer than an
  # hour at 00:30Z therefore means NO keep-list refresh before 02:00Z retention
  # that night — which is exactly what HarborKeepListStale (alerts.yaml) exists to
  # surface, and why that alert keeps its absent() arm.
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      # M660-2: 10 -> 1. The failures this script produces are DETERMINISTIC —
      # an M-4 rule-cap breach has identical input on every retry, so retrying it
      # ten times just re-runs the entire reconcile (21 retention PUTs + GC + 23
      # quota PUTs) ~6-7 times against a 900s deadline and then reports the Job's
      # terminal status as `DeadlineExceeded`. That relabels the loud, specific
      # failure M-4 was built to produce as a generic timeout — the opposite of
      # the intent, and it buries the actual cause under six identical repeats.
      # 1 retry still absorbs the genuinely transient case, which is real here:
      # the first execution after #652 lost two pods to `curl: (52)` and an
      # HTTP 500 while ArgoCD was restarting harbor-core underneath it.
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            platform.capstone/component: platform
        spec:
          restartPolicy: Never
          # Reads workload specs cluster-wide to build the in-use tag keep-list.
          # Read-only, workload kinds only — see rbac-inuse-reader.yaml.
          serviceAccountName: harbor-retention-inuse-reader
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: configure-retention-gc
              image: curlimages/curl:8.11.1
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              env:
                - name: HARBOR_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: harbor-admin
                      key: HARBOR_ADMIN_PASSWORD
                - name: HARBOR_CORE
                  value: "http://harbor-core.harbor.svc:80"
                # Projects are ENUMERATED from the Harbor API, not listed here. The old
                # hand-typed RETENTION_PROJECTS ("backstage ida-llm") was the copy-not-
                # reference shape this project's own retro names as its #1 bug generator:
                # every new team was a fresh chance to forget, and the result was that on
                # 2026-08-27 only 3 of 16 projects had any retention policy at all — one
                # of which (dockerhub-proxy) this Job never created. crimson-copies, the
                # reference application with 6 repositories, had none. For 13 of 16
                # projects the nightly GC therefore ran, reported Success, and reclaimed
                # essentially nothing: GC only frees blobs belonging to UNTAGGED
                # manifests, and nothing untags anything without a retention rule.
                #
                # This list is the inverse — the projects to LEAVE ALONE:
                #   dockerhub-proxy — a pull-through proxy-cache whose retention (policy
                #     id 5, `nDaysSinceLastPull: 7`) is NOT managed by this Job and does
                #     not appear anywhere in git; it was set by hand. Enumerating without
                #     this exclusion would PUT over it and replace "keep whatever was
                #     pulled in the last 7 days" with "keep the last 10 pushed" — which
                #     for a cache of 17 upstream repos would evict base images that are
                #     in active use. That policy needs its own declarative home; until it
                #     has one, this Job must not touch it.
                #   library — Harbor's built-in default project, 0 repositories, never
                #     pushed to.
                - name: RETENTION_EXCLUDE_PROJECTS
                  value: "dockerhub-proxy library"
                - name: RETENTION_KEEP_LAST_N
                  value: "10"
                # Space-separated doublestar patterns; each becomes its own `always`
                # retain rule, unioned with the keep-last-N rule by "algorithm": "or".
                # See the header for why `*.*.*` separates releases from dev builds here
                # and where that reasoning stops being true.
                - name: RETENTION_PROTECT_TAGS
                  value: "*.*.* latest"
                # Registry host used to filter workload image refs down to ours when
                # building the in-use keep-list (step 0a).
                - name: REGISTRY_HOST
                  value: "harbor.capstone.uamishub.com"
                # Hard cap on rules per retention policy. The job FAILS rather than
                # truncate, because a truncated policy silently unprotects a deployed
                # image — see step 0a.
                - name: RETENTION_MAX_RULES
                  # 15 is Harbor's own documented per-policy rule limit (goharbor
                  # rejects a retention policy with more rules than this), NOT a
                  # number picked here. Raising it does not raise Harbor's limit —
                  # it only converts a clean pre-flight failure into a rejected PUT.
                  value: "15"
                # Maximum percentage the deployed-tag count may shrink in one run
                # before the job refuses to apply (see the shrink guard in step 0a).
                # 40% allows real churn — a team deleting a Deployment, an env torn
                # down — while still catching a truncated enumeration, which
                # typically loses far more than that.
                - name: INUSE_SHRINK_TOLERANCE_PCT
                  value: "40"
                # --- Storage quotas (2026-09-16). See step 3 for why these are
                #     deliberately overcommitted and must not be shrunk to sum under
                #     the PVC size. Sizes are GiB, applied as bytes.
                - name: QUOTA_DEFAULT_GIB
                  value: "10"
                # Space-separated project=GiB. Anything not listed gets the default.
                #   base-images (20.24G live) — the shared upstream mirror every tenant
                #     build pulls from; the single largest legitimate consumer, and the
                #     one whose runaway `_uploads` caused this outage. 40GiB is ~2x its
                #     real footprint, so a mirror refill cannot wedge CI again.
                #   dockerhub-proxy / mcr-proxy — pull-through caches. Their content is
                #     re-fetchable from upstream on demand, so a cap that occasionally
                #     forces a re-pull costs latency, never data.
                #   backstage (6.14G live) — the developer portal image + its Kaniko
                #     layer cache; platform-critical, so headroom over the default.
                - name: QUOTA_OVERRIDES
                  value: "base-images=40 dockerhub-proxy=20 mcr-proxy=20 backstage=15"
              command: ["/bin/sh", "-eu", "-c"]
              args:
                - |
                  # set -f (noglob) — MANDATORY, not hygiene. This script iterates
                  # over Harbor TAG PATTERNS with `for PAT in $VAR`, and unquoted
                  # word-splitting also performs PATHNAME expansion. A pattern of
                  # `**` therefore expands against the container filesystem: caught
                  # live, `for _pt in $_condpats` turned the pattern list into
                  # "bin dev etc home lib proc root sys tmp usr var". Every tag would
                  # then be compared against directory names, so real coverage is
                  # missed and nonsense is reported as a match. `*.*.*` survives today
                  # only because nothing in / happens to have two dots — i.e. this was
                  # already latent for the global protect patterns, not just the new
                  # audit. Pathname expansion is never wanted anywhere in this script;
                  # `case` pattern matching is unaffected by -f, which is what the
                  # matching actually relies on.
                  set -f

                  CORE="$HARBOR_CORE"
                  AUTH="admin:$HARBOR_ADMIN_PASSWORD"

                  echo "==> waiting for Harbor core API at $CORE ..."
                  i=0
                  until curl -fsS -o /dev/null "$CORE/api/v2.0/systeminfo"; do
                    i=$((i+1)); [ "$i" -ge 60 ] && { echo "core not ready after ~5m"; exit 1; }
                    echo "   ...not ready yet (attempt $i), sleeping 5s"; sleep 5
                  done
                  echo "==> core is up."

                  # --- 0) enumerate every project from Harbor, minus the exclusions. ---
                  # The container has no jq, so this is grep parsing, which means it has
                  # to be checked rather than trusted. Two keys occur exactly once per
                  # project object in the /projects payload: `"name":` and `"repo_count":`
                  # (`project_id` does NOT — it appears twice, once at top level and once
                  # nested inside cve_allowlist, verified against the live payload). If
                  # those two counts ever disagree, the response shape has changed under
                  # us and silently dropping a project would recreate exactly the bug this
                  # change exists to fix — so that case is a hard failure, not a skip.
                  echo "==> enumerating projects ..."
                  : > /tmp/all_projects.txt
                  page=1
                  while : ; do
                    curl -fsS -u "$AUTH" "$CORE/api/v2.0/projects?page=${page}&page_size=100" -o /tmp/pp.json
                    n_name=$(grep -o '"name":' /tmp/pp.json | wc -l | tr -d ' ')
                    n_repo=$(grep -o '"repo_count":' /tmp/pp.json | wc -l | tr -d ' ')
                    if [ "$n_name" != "$n_repo" ]; then
                      echo "FAIL: /projects page $page parsed inconsistently (${n_name} name keys vs ${n_repo} repo_count keys)."
                      echo "      Refusing to continue: a missed project silently gets no retention."
                      exit 1
                    fi
                    [ "$n_name" = "0" ] && break
                    grep -o '"name":"[^"]*"' /tmp/pp.json | sed 's/^"name":"//; s/"$//' >> /tmp/all_projects.txt
                    [ "$n_name" -lt 100 ] && break
                    page=$((page+1))
                  done

                  RETENTION_PROJECTS=""
                  while IFS= read -r cand; do
                    [ -n "$cand" ] || continue
                    skip=0
                    for X in $RETENTION_EXCLUDE_PROJECTS; do
                      [ "$cand" = "$X" ] && skip=1 && break
                    done
                    if [ "$skip" = "1" ]; then
                      echo "    - $cand (EXCLUDED)"
                    else
                      echo "    + $cand"
                      RETENTION_PROJECTS="$RETENTION_PROJECTS $cand"
                    fi
                  done < /tmp/all_projects.txt
                  n_total=$(wc -l < /tmp/all_projects.txt | tr -d ' ')
                  echo "==> $n_total projects found; applying retention to:$RETENTION_PROJECTS"
                  [ -n "$RETENTION_PROJECTS" ] || { echo "FAIL: enumeration produced no projects"; exit 1; }

                  # SINGLE SOURCE OF TRUTH for "which deployed tags in project $1 need
                  # a rule of their own" — i.e. deployed, minus anything a global
                  # RETENTION_PROTECT_TAGS pattern already covers.
                  #
                  # It is a function because this exact derivation is needed in THREE
                  # places (the shrink guard, the rule builder, the read-back check)
                  # and the previous版 had it written out inline twice and approximated
                  # a third time in different units. That is what produced the guard
                  # comparing 42 against 15: both numbers were "in use", but one counted
                  # raw refs across all projects and the other counted deduped uncovered
                  # tags in managed projects only. One definition, called three times,
                  # cannot drift like that.
                  uncovered_tags() {
                    _utp="$1"
                    grep "^${_utp}/" /tmp/inuse.txt 2>/dev/null | sed 's|^.*:||' | sort -u \
                      | while IFS= read -r _ut; do
                          [ -n "$_ut" ] || continue
                          _utc=0
                          for _utg in $RETENTION_PROTECT_TAGS; do
                            case "$_ut" in $_utg) _utc=1; break ;; esac
                          done
                          [ "$_utc" = "1" ] || echo "$_ut"
                        done
                  }

                  # --- 0a) IN-USE TAG KEEP-LIST (2026-09-16) --------------------
                  # Recency does not imply "not in use", and the converse is worse: a
                  # stable prod tag is old precisely BECAUSE it is good. Measured live
                  # before this existed — mychef/mychef-backend:95b52f8 ranked 65 of 65
                  # in its repo while mychef PROD ran it on 3 replicas. `keep last 10`
                  # would have deleted it the first time retention actually executed,
                  # and the breakage would have stayed invisible until a pod
                  # rescheduled into ImagePullBackOff.
                  #
                  # So: enumerate what is genuinely deployed and retain it explicitly.
                  # See rbac-inuse-reader.yaml for the SA and for why bare Jobs are
                  # excluded while CronJobs are not.
                  #
                  # This is a UNION with the recency rule (algorithm "or"), so like the
                  # other always-rules it can only ever retain MORE. It cannot cause a
                  # deletion that was not already going to happen.
                  #
                  # ⚠ M-2 — KNOWN BLIND SPOT: this keep-list is derived from WORKLOAD
                  # SPECS, so it sees what the cluster RUNS. It does not see what the
                  # cluster BUILDS FROM. `base-images` exists to serve Dockerfile
                  # `FROM` lines and CI step images, which live in git across the tenant
                  # repos — invisible here. A base image can therefore be in constant
                  # use by every build on the platform and still hold zero workload
                  # references.
                  # Bounded today rather than solved: only `library/busybox` in
                  # base-images exceeds 10 artifacts, so keep-last-10 currently retains
                  # everything anything could FROM. That is a property of today's
                  # inventory, not a guarantee — if base-images repos start carrying
                  # more than 10 tags each, a `FROM` pin can be pruned while still
                  # referenced. The real fix is a second keep-list source derived from
                  # the tenant repos' Dockerfiles/workflows, which is a cross-repo
                  # change and is NOT done here.
                  KUBE="https://kubernetes.default.svc"
                  SA=/var/run/secrets/kubernetes.io/serviceaccount
                  KTOK=$(cat $SA/token)
                  echo "==> in-use: enumerating deployed images from workload specs ..."
                  : > /tmp/inuse_raw.txt
                  for API in \
                    "/apis/apps/v1/deployments" \
                    "/apis/apps/v1/statefulsets" \
                    "/apis/apps/v1/daemonsets" \
                    "/apis/batch/v1/cronjobs" \
                    "/apis/argoproj.io/v1alpha1/rollouts" ; do
                    # M-3: FOLLOW THE CONTINUE TOKEN. `?limit=1000` alone silently
                    # truncates at 1000 objects, and truncation here means a deployed
                    # tag quietly loses its protection — the one outcome this whole
                    # step exists to prevent, in the one step whose stated doctrine is
                    # "fail loudly rather than miss". 169 deployments today is ~6x
                    # headroom, so this is insurance, not a live bug; but the failure
                    # mode is silent, so headroom is not a reason to skip it. Note
                    # nothing in normal operation exercises the continue path at this
                    # scale, so it must be tested deliberately (limit=5) or not at all.
                    _cont=""; _page=0; _api_n=0; _skip_api=0
                    while : ; do
                      _url="${KUBE}${API}?limit=500"
                      [ -n "$_cont" ] && _url="${_url}&continue=${_cont}"
                      code=$(curl -sS -o /tmp/k8s.json -w '%{http_code}' \
                        --cacert $SA/ca.crt -H "Authorization: Bearer $KTOK" "$_url")
                      if [ "$code" = "404" ] && [ "$_page" = "0" ]; then
                        # CRD not installed (e.g. no Argo Rollouts) — not an error.
                        echo "    $API -> 404, kind not present, skipping"; _skip_api=1; break
                      fi
                      if [ "$code" != "200" ]; then
                        # A silent miss here means an in-use tag silently loses its
                        # protection. Fail loudly instead. A 410 Gone on a continue
                        # token (watch cache expired mid-walk) also lands here rather
                        # than being swallowed as a partial list.
                        echo "FAIL: GET $_url returned HTTP $code — refusing to build a partial keep-list"
                        # head, not cat: this payload is ~3.6MB and dumping it whole
                      # buries the actual error in the job log (and in Loki).
                      head -c 2000 /tmp/k8s.json; echo; exit 1
                      fi
                    # NOTE the ': *' in these patterns. The API server pretty-prints by
                    # default, so the field arrives as `"image": "nginx"` WITH a space —
                    # a `"image":"` pattern silently matches zero and yields an empty
                    # keep-list. Caught live: the first run of this step enumerated 0
                    # refs from a 3.6MB payload containing 260 of them. The tolerant
                    # pattern matches both spellings, so it cannot regress if the
                    # server's formatting changes.
                      n=$(grep -o '"image": *"[^"]*"' /tmp/k8s.json | wc -l | tr -d ' ')
                      _api_n=$((_api_n+n))
                      grep -o '"image": *"[^"]*"' /tmp/k8s.json \
                        | sed 's/^"image": *"//; s/"$//' >> /tmp/inuse_raw.txt
                      # metadata.continue is empty string on the final page.
                      _cont=$(grep -o '"continue": *"[^"]*"' /tmp/k8s.json | head -1 \
                              | sed 's/^"continue": *"//; s/"$//')
                      _page=$((_page+1))
                      [ -n "$_cont" ] || break
                      [ "$_page" -lt 50 ] || { echo "FAIL: $API still paginating after 50 pages"; exit 1; }
                    done
                    [ "$_skip_api" = "1" ] || echo "    $API -> $_api_n image refs ($_page page(s))"
                  done

                  # Keep every ref that carries a TAG, INCLUDING refs that carry a
                  # tag AND a digest.
                  #
                  # THIS WAS WRONG UNTIL 2026-09-16 AND THE COMMENT ASSERTED IT WAS
                  # RIGHT. The filter was `grep -v '@sha256:'`, justified as "digest
                  # refs are immune to tag retention, there is no tag to protect".
                  # That holds for a pure `repo@sha256:…` ref. It is FALSE for
                  # `repo:tag@sha256:…`, which has both — and dropping it loses the
                  # tag that needs protecting. The failure chain is not subtle:
                  # retention removes the unprotected tag -> the manifest is now
                  # untagged -> GC at 02:30 with delete_untagged:true DESTROYS it ->
                  # and the digest pull the workload actually uses now fails too. A
                  # digest pin does not protect a manifest; a TAG keeps it reachable.
                  #
                  # Found by the reviewer on a live gap, not in review of this code:
                  # npm-mirror/npm-mirror-0 runs
                  # dockerhub-proxy/verdaccio/verdaccio:5@sha256:9d622d25… and was the
                  # ONE ref in the whole cluster this filter discarded — so it never
                  # entered the keep-list, and the 1b audit that should have flagged it
                  # never saw it. One ref, and it was the npm mirror the whole fleet's
                  # CI pulls through.
                  #
                  # So: strip the digest suffix, then require a tag on what remains.
                  # A pure digest ref reduces to `project/repo` with no colon in the
                  # final segment and is still correctly dropped — it genuinely has no
                  # tag to retain.
                  REGISTRY_HOST="${REGISTRY_HOST:-harbor.capstone.uamishub.com}"
                  grep -F "${REGISTRY_HOST}/" /tmp/inuse_raw.txt 2>/dev/null \
                    | sed "s|^.*${REGISTRY_HOST}/||" \
                    | sed 's/@sha256:[0-9a-f]*$//' \
                    | grep ':' \
                    | sort -u > /tmp/inuse.txt || true
                  n_inuse=$(wc -l < /tmp/inuse.txt | tr -d ' ')
                  echo "==> in-use: $n_inuse tagged image refs on $REGISTRY_HOST"

                  # GUARD: empty is the OBVIOUS failure; PARTIAL is the realistic one.
                  # `-gt 0` alone only catches total enumeration collapse. Since M-3
                  # added pagination the plausible failure changed shape: a truncated
                  # or half-walked list is SHORT, not empty. That matters because these
                  # policies are PUT WHOLESALE — a short keep-list does not merely fail
                  # to add protection, it actively REMOVES the rules that were there
                  # last night, for every tag that went missing. A run like that
                  # reports success and quietly disarms the control.
                  #
                  # So the floor is relative to what we protected last time, persisted
                  # in Harbor itself (no state of our own to keep): count the existing
                  # always-rules that are NOT one of the global RETENTION_PROTECT_TAGS
                  # patterns — i.e. the deployed-tag rules this job wrote on its last
                  # run — and refuse to proceed if today's list would drop more than
                  # INUSE_SHRINK_TOLERANCE_PCT below it.
                  # A real shrink happens (a team deletes a Deployment), hence the
                  # tolerance rather than an exact match; a collapse from 42 to 6 does
                  # not, and that is what this stops.
                  # NB: this runs BEFORE the retention loop, so /tmp/proj_*.json does
                  # not exist yet — fetch it here. Reading the cache at this point is
                  # how the first version of this guard silently counted 0 for every
                  # project and never engaged at all; caught by the count printing 0
                  # while 21 projects visibly had deployed-tag rules.
                  # BOTH SIDES MUST BE IN THE SAME UNITS. The first version of this
                  # guard compared n_inuse (42: raw project/repo:tag lines, all
                  # projects, including tags already covered by *.*.*/latest, counting
                  # mychef-backend:95b52f8 and mychef-frontend:95b52f8 separately)
                  # against _prev (15: deployed-tag RULES in Harbor — deduped, managed
                  # projects only, globals excluded). Floor came out at 9, so it only
                  # fired below 9 of 42 — a 79% loss, while the knob and both comments
                  # said 40%. A pagination failure losing half the fleet produced ~21
                  # and sailed straight through the guard built to catch exactly that.
                  # Now both sides are the rule count, from the same uncovered_tags().
                  _now=0
                  for P in $RETENTION_PROJECTS; do
                    _now=$(( _now + $(uncovered_tags "$P" | wc -l | tr -d ' ') ))
                  done

                  _prev=0
                  for P in $RETENTION_PROJECTS; do
                    if [ ! -s "/tmp/proj_${P}.json" ]; then
                      _fc=$(curl -sS -o "/tmp/proj_${P}.json" -w '%{http_code}' -u "$AUTH" "$CORE/api/v2.0/projects/$P")
                      if [ "$_fc" = "404" ]; then rm -f "/tmp/proj_${P}.json"; continue; fi
                      # FAIL CLOSED. `continue` here let a flaky Harbor silently LOWER
                      # the floor, which is fail-open in a control whose entire job is
                      # to refuse when it cannot be sure — the failure would make the
                      # guard weaker exactly when the platform is least healthy.
                      [ "$_fc" = "200" ] || { echo "FAIL: GET /projects/$P returned HTTP $_fc while measuring the previous keep-list; refusing to guess a floor"; exit 1; }
                    fi
                    _rid=$(grep -o '"retention_id":"[0-9]*"' "/tmp/proj_${P}.json" 2>/dev/null | head -1 | grep -o '[0-9]*' || true)
                    [ -n "$_rid" ] || continue
                    _pc=$(curl -sS -o /tmp/prev.json -w '%{http_code}' -u "$AUTH" "$CORE/api/v2.0/retentions/$_rid")
                    [ "$_pc" = "200" ] || { echo "FAIL: GET /retentions/$_rid returned HTTP $_pc while measuring the previous keep-list; refusing to guess a floor"; exit 1; }
                    # Same hardened parse as the 1b audit: split after "template"
                    # (Harbor serialises it last), keep only `always` rules, and SLICE
                    # to the tag_selectors span before grepping. Without the slice this
                    # also picks up each rule's scope_selectors repository pattern —
                    # harmless today only because every repo scope happens to be the
                    # literal `**`, which the exclusion below drops. The first rule with
                    # a narrower repo scope would inflate _prev and fail a legitimate
                    # run. Two copies of one parse, hardened 300 lines apart, is how
                    # that stays true by luck; they are the same now.
                    _n=$(sed 's/"template":"[^"]*"/&\n/g' /tmp/prev.json \
                         | grep '"template":"always"' \
                         | sed 's/.*"tag_selectors"://; s/"template".*//' \
                         | grep -o '"pattern":"[^"]*"' | sed 's/^"pattern":"//; s/"$//' | sort -u \
                         | while IFS= read -r _pt; do
                             _isglobal=0
                             for _g in $RETENTION_PROTECT_TAGS '**'; do
                               [ "$_pt" = "$_g" ] && _isglobal=1 && break
                             done
                             [ "$_isglobal" = "1" ] || echo x
                           done | wc -l | tr -d ' ')
                    _prev=$((_prev+_n))
                  done
                  echo "==> in-use: $_now deployed-tag rule(s) would be written now; $_prev persisted from the previous run"
                  if [ "$_prev" -gt 0 ]; then
                    _floor=$(( _prev * (100 - INUSE_SHRINK_TOLERANCE_PCT) / 100 ))
                    if [ "$_now" -lt "$_floor" ]; then
                      echo "FAIL: this run would write $_now deployed-tag rule(s), but $_prev are already"
                      echo "      persisted (floor $_floor at ${INUSE_SHRINK_TOLERANCE_PCT}% tolerance)."
                      echo "      Refusing to proceed: policies are PUT wholesale, so applying a short list"
                      echo "      would DELETE protection that exists today. This is what a truncated or"
                      echo "      partially-walked enumeration looks like — check the per-API page counts"
                      echo "      above before assuming workloads really were removed."
                      exit 1
                    fi
                  fi
                  # Total collapse, kept as its own case: unambiguous, and it is the
                  # only one that is wrong even on a genuinely empty cluster.
                  [ "$n_inuse" -gt 0 ] || { echo "FAIL: in-use enumeration returned nothing — refusing to apply retention with an empty keep-list"; exit 1; }

                  # Shared project_id resolver (F-1). Every occurrence, deduped; a
                  # disagreement is a hard failure rather than a guess, because this id
                  # scopes both a deletion policy and a storage quota.
                  resolve_pid() {
                    _f="$1"; _p="$2"
                    _ids=$(grep -o '"project_id":[0-9]*' "$_f" 2>/dev/null | grep -o '[0-9]*$' | sort -u)
                    _n=$(printf '%s\n' "$_ids" | grep -c '[0-9]' || true)
                    if [ -z "$_ids" ] || [ "$_n" != "1" ]; then
                      echo "FAIL: could not unambiguously resolve project_id for '$_p' (got: $(printf '%s' "$_ids" | tr '\n' ' '))" >&2
                      return 1
                    fi
                    printf '%s' "$_ids"
                  }

                  # --- 0b) build the protection rules once: one `always` retain rule per
                  #         pattern in RETENTION_PROTECT_TAGS. Unioned with the
                  #         keep-last-N rule below by "algorithm": "or", so a tag is kept
                  #         if EITHER rule keeps it. Adding these can only retain more.
                  PROTECT_RULES=""
                  n_protect=0
                  for PAT in $RETENTION_PROTECT_TAGS; do
                    n_protect=$((n_protect+1))
                    PROTECT_RULES="${PROTECT_RULES},
                      {
                        \"disabled\": false,
                        \"action\": \"retain\",
                        \"template\": \"always\",
                        \"params\": {},
                        \"tag_selectors\": [
                          { \"kind\": \"doublestar\", \"decoration\": \"matches\", \"pattern\": \"${PAT}\" }
                        ],
                        \"scope_selectors\": {
                          \"repository\": [
                            { \"kind\": \"doublestar\", \"decoration\": \"repoMatches\", \"pattern\": \"**\" }
                          ]
                        }
                      }"
                  done
                  n_rules_expected=$((n_protect+1))
                  echo "==> protection patterns: $RETENTION_PROTECT_TAGS ($n_protect always-rules, $n_rules_expected rules total per policy)"

                  # --- 1) per-project tag retention: keep the N most recently PUSHED
                  #        tags across every repository in the project (doublestar "**"
                  #        matches all repos, including backstage/cache), PLUS the
                  #        always-retain protection rules built above. -------------
                  # Collects projects skipped by the M-4 rule-cap guard so one tenant
                  # cannot abort the shared run for everyone else. Checked at the end.
                  DEFERRED_FAILURES=""
                  for P in $RETENTION_PROJECTS; do
                    echo "==> retention: resolving project '$P' ..."
                    proj_code=$(curl -sS -o "/tmp/proj_${P}.json" -w '%{http_code}' -u "$AUTH" "$CORE/api/v2.0/projects/$P")
                    if [ "$proj_code" = "404" ]; then
                      echo "==> retention: skip: project '$P' gone (404 from GET /projects/$P), continuing."
                      continue
                    fi
                    if [ "$proj_code" != "200" ]; then
                      echo "FAIL: GET /projects/$P returned HTTP $proj_code"; cat "/tmp/proj_${P}.json"; exit 1
                    fi
                    proj=$(cat "/tmp/proj_${P}.json")
                    # `project_id` occurs TWICE in this payload: once at top level and
                    # once nested inside cve_allowlist. Harbor serialises keys
                    # alphabetically, so cve_allowlist comes FIRST -- meaning a bare
                    # `head -1` reads the allowlist's copy, not the project's. Those two
                    # happen to be equal for all 16 projects today (verified live), but
                    # nothing guarantees it: a project reusing the system CVE allowlist
                    # could carry a different id there, and this id is what scopes an
                    # irreversible deletion policy. So: take every occurrence, and if
                    # they are not unanimous, refuse rather than guess.
                    PID=$(printf '%s' "$proj" | grep -o '"project_id":[0-9]*' | grep -o '[0-9]*$' | sort -u)
                    n_pid=$(printf '%s\n' "$PID" | grep -c '[0-9]' || true)
                    if [ -z "$PID" ] || [ "$n_pid" != "1" ]; then
                      echo "FAIL: could not unambiguously resolve project_id for '$P' (got: $(printf '%s' "$PID" | tr '\n' ' '))"
                      echo "      Refusing to scope a deletion policy to a guessed project id."
                      echo "$proj"; exit 1
                    fi
                    RID=$(printf '%s' "$proj" | grep -o '"retention_id":"[0-9]*"' | head -1 | grep -o '[0-9]*' || true)

                    # Per-project in-use rules: one `always` retain rule per tag this
                    # project currently has DEPLOYED, on top of the global protection
                    # patterns. A tag already covered by a RETENTION_PROTECT_TAGS
                    # pattern is skipped, so a semver release does not burn a second
                    # rule slot on a redundant rule.
                    INUSE_RULES=""
                    n_inuse_p=0
                    for TAG in $(uncovered_tags "$P"); do
                      n_inuse_p=$((n_inuse_p+1))
                      INUSE_RULES="${INUSE_RULES},
                      {
                        \"disabled\": false,
                        \"action\": \"retain\",
                        \"template\": \"always\",
                        \"params\": {},
                        \"tag_selectors\": [
                          { \"kind\": \"doublestar\", \"decoration\": \"matches\", \"pattern\": \"${TAG}\" }
                        ],
                        \"scope_selectors\": {
                          \"repository\": [
                            { \"kind\": \"doublestar\", \"decoration\": \"repoMatches\", \"pattern\": \"**\" }
                          ]
                        }
                      }"
                    done
                    n_rules_this=$((n_rules_expected+n_inuse_p))
                    # M-4: cap breach DEFERS the failure instead of exiting mid-loop.
                    # Harbor caps rules per policy, and truncating would silently drop
                    # a deployed tag's protection — so this still fails the run. But it
                    # must not `exit 1` HERE: this is the same bug class fixed in the
                    # quota loop (#657), and it is worse, because the trigger is a
                    # TENANT action. Any team deploying a 13th distinct non-semver tag
                    # would abort the shared platform job at their project and leave
                    # every alphabetically-later project unprocessed — one tenant
                    # silently removing another tenant's protection.
                    #
                    # So: skip only the offending project, keep reconciling the rest,
                    # and exit non-zero at the end with the full list. The run still
                    # fails loudly; it just stops taking bystanders down with it.
                    if [ "$n_rules_this" -gt "$RETENTION_MAX_RULES" ]; then
                      echo "ERROR: project '$P' needs $n_rules_this rules (cap $RETENTION_MAX_RULES):"
                      echo "       $n_inuse_p deployed tag(s) + $n_rules_expected base rule(s)."
                      echo "       Refusing to truncate — that would silently unprotect a DEPLOYED image."
                      echo "       This project is SKIPPED (its policy is left exactly as-is, so"
                      echo "       whatever protection it already had is preserved); other projects"
                      echo "       continue. The run will still exit non-zero at the end."
                      echo "       Remedy: consolidate deployed tags in '$P' (or raise"
                      echo "       RETENTION_MAX_RULES deliberately after checking Harbor's own limit)."
                      DEFERRED_FAILURES="${DEFERRED_FAILURES} ${P}(needs:${n_rules_this})"
                      continue
                    fi
                    echo "==> retention: '$P' has $n_inuse_p deployed tag(s) needing explicit protection ($n_rules_this rules total)"

                    cat > "/tmp/ret_${P}.json" <<EOF
                  {
                    "algorithm": "or",
                    "rules": [
                      {
                        "disabled": false,
                        "action": "retain",
                        "template": "latestPushedK",
                        "params": { "latestPushedK": ${RETENTION_KEEP_LAST_N} },
                        "tag_selectors": [
                          { "kind": "doublestar", "decoration": "matches", "pattern": "**" }
                        ],
                        "scope_selectors": {
                          "repository": [
                            { "kind": "doublestar", "decoration": "repoMatches", "pattern": "**" }
                          ]
                        }
                      }${PROTECT_RULES}${INUSE_RULES}
                    ],
                    "trigger": { "kind": "Schedule", "settings": { "cron": "0 0 2 * * *" }, "references": {} },
                    "scope": { "level": "project", "ref": ${PID} }
                  }
                  EOF

                    if [ -z "$RID" ]; then
                      echo "==> retention: creating policy for project '$P' (id $PID, no existing retention_id) ..."
                      code=$(curl -sS -u "$AUTH" -o "/tmp/ret_${P}.out" -w '%{http_code}' \
                        -X POST "$CORE/api/v2.0/retentions" -H 'Content-Type: application/json' \
                        --data "@/tmp/ret_${P}.json")
                      if [ "$code" != "201" ]; then
                        echo "FAIL: POST /retentions for '$P' returned HTTP $code"; cat "/tmp/ret_${P}.out"; exit 1
                      fi
                      # re-read the project to pick up the retention_id Harbor just assigned
                      RID=$(curl -fsS -u "$AUTH" "$CORE/api/v2.0/projects/$P" \
                        | grep -o '"retention_id":"[0-9]*"' | head -1 | grep -o '[0-9]*' || true)
                      [ -n "$RID" ] || { echo "FAIL: '$P' has no retention_id after create"; exit 1; }
                    else
                      echo "==> retention: updating existing policy $RID for project '$P' (id $PID) ..."
                      code=$(curl -sS -u "$AUTH" -o "/tmp/ret_${P}.out" -w '%{http_code}' \
                        -X PUT "$CORE/api/v2.0/retentions/$RID" -H 'Content-Type: application/json' \
                        --data "@/tmp/ret_${P}.json")
                      if [ "$code" != "200" ]; then
                        echo "FAIL: PUT /retentions/$RID for '$P' returned HTTP $code"; cat "/tmp/ret_${P}.out"; exit 1
                      fi
                    fi

                    # Read-back verification. The previous version of this check grepped
                    # ONLY for "latestPushedK", which meant it passed whether or not the
                    # rest of the policy made it in -- a green Job that proved nothing
                    # about the rule that actually protects releases. Every rule is now
                    # checked individually, and the total rule count is asserted, so a
                    # partially-applied policy fails loudly instead of reporting Success.
                    echo "==> retention: verifying policy $RID for '$P' (read-back) ..."
                    verify=$(curl -fsS -u "$AUTH" "$CORE/api/v2.0/retentions/$RID")
                    echo "$verify" | grep -qF '"latestPushedK"' || { echo "FAIL: policy $RID for '$P' missing latestPushedK after apply"; echo "$verify"; exit 1; }
                    for PAT in $RETENTION_PROTECT_TAGS; do
                      echo "$verify" | grep -qF "\"pattern\":\"${PAT}\"" \
                        || { echo "FAIL: policy $RID for '$P' missing protection rule for pattern '$PAT' after apply"; echo "$verify"; exit 1; }
                    done
                    n_always_expected=$((n_protect+n_inuse_p))
                    n_always=$(echo "$verify" | grep -o '"template":"always"' | wc -l | tr -d ' ')
                    [ "$n_always" = "$n_always_expected" ] \
                      || { echo "FAIL: policy $RID for '$P' has $n_always always-rules, expected $n_always_expected"; echo "$verify"; exit 1; }
                    # Every DEPLOYED tag must come back in the applied policy. This is
                    # the check that actually matters: a policy that applied cleanly but
                    # silently dropped an in-use rule is how prod images get deleted.
                    # Skip tags already covered by a RETENTION_PROTECT_TAGS pattern —
                    # they are protected by that pattern rule and deliberately get no
                    # literal rule of their own. This mirror of the build-side `covered`
                    # test must stay in sync with it: checking for a literal rule on a
                    # pattern-covered tag fails a policy that is in fact correct.
                    for TAG in $(uncovered_tags "$P"); do
                      echo "$verify" | grep -qF "\"pattern\":\"${TAG}\"" \
                        || { echo "FAIL: policy $RID for '$P' is missing a retain rule for DEPLOYED tag '$TAG' after apply"; echo "$verify"; exit 1; }
                    done
                    n_got=$(echo "$verify" | grep -o '"template":"' | wc -l | tr -d ' ')
                    [ "$n_got" = "$n_rules_this" ] \
                      || { echo "FAIL: policy $RID for '$P' has $n_got rules, expected $n_rules_this"; echo "$verify"; exit 1; }
                    echo "==> retention: OK for '$P' (policy id $RID, $n_got rules: keep last $RETENTION_KEEP_LAST_N pushed + always[$RETENTION_PROTECT_TAGS] + $n_inuse_p deployed-tag rule(s), all repos)."
                  done

                  # --- 1b) EXCLUDED projects that nonetheless run deployed images ---
                  # M-1. RETENTION_EXCLUDE_PROJECTS are skipped above so this Job does
                  # not PUT over a policy it does not own (dockerhub-proxy carries a
                  # hand-set `nDaysSinceLastPull: 7` that exists in no manifest). But
                  # "not managed here" is not the same as "not at risk": four workloads
                  # run dockerhub-proxy images, and its policy fires at 00:00Z.
                  #
                  # This step does NOT write to those policies — doing JSON surgery on
                  # a hand-set policy we do not own is how you destroy the thing you
                  # were trying to protect. It DETECTS instead: if a deployed tag in an
                  # excluded project has no rule covering it, say so loudly, every run.
                  # That converts invisible drift into a named, dated failure.
                  #
                  # ⚠ THE DURABLE FIX IS NOT HERE. It is to bring those policies into
                  # git so they stop being hand-set, which is a deliberate decision
                  # about proxy-cache semantics (a proxy cache re-fetches on demand, so
                  # eviction is normally safe — UNLESS upstream is rate-limiting, which
                  # is the entire reason this mirror exists). That decision is escalated,
                  # not made here.
                  EXCLUDED_UNPROTECTED=""
                  for P in $RETENTION_EXCLUDE_PROJECTS; do
                    _tags=$(grep "^${P}/" /tmp/inuse.txt 2>/dev/null | sed 's|^.*:||' | sort -u)
                    [ -n "$_tags" ] || continue
                    echo "==> excluded-check: '$P' is not managed here but has deployed tags; auditing ..."
                    _pj=$(curl -sS -o "/tmp/xproj_${P}.json" -w '%{http_code}' -u "$AUTH" "$CORE/api/v2.0/projects/$P")
                    if [ "$_pj" != "200" ]; then
                      echo "    WARN: GET /projects/$P returned HTTP $_pj — cannot audit, skipping."
                      continue
                    fi
                    _rid=$(grep -o '"retention_id":"[0-9]*"' "/tmp/xproj_${P}.json" | head -1 | grep -o '[0-9]*' || true)
                    if [ -z "$_rid" ]; then
                      echo "    NOTE: '$P' has no retention policy at all, so nothing prunes it — deployed tags are safe."
                      continue
                    fi
                    # M660-3: graceful, matching the project fetch ten lines above.
                    # `curl -fsS` here had no code check and no `|| true`, so under
                    # `sh -eu` a transient 500 on /retentions/{id} killed the whole
                    # run BETWEEN retention and GC — skipping GC and every quota —
                    # which is precisely what this step's own summary promises it
                    # will not do. An audit must never be able to abort the
                    # reconcile it is only observing.
                    _pc=$(curl -sS -o /tmp/xpol.json -w '%{http_code}' -u "$AUTH" "$CORE/api/v2.0/retentions/$_rid")
                    if [ "$_pc" != "200" ]; then
                      echo "    WARN: GET /retentions/$_rid returned HTTP $_pc — cannot audit '$P', skipping."
                      continue
                    fi
                    _pol=$(cat /tmp/xpol.json)
                    # Match tags against the policy's patterns as GLOBS, not as
                    # literals. A literal-only check reports UNPROTECTED for a tag
                    # that a pattern rule genuinely covers (e.g. `1*`), which trains
                    # the reader to ignore this audit — the failure mode of any
                    # checker that cries wolf.
                    #
                    # HONEST LIMIT: this proves a RULE MATCHES, not that the tag is
                    # safe. On an unmanaged policy the matching rule may be
                    # conditional — dockerhub-proxy's is `nDaysSinceLastPull`, which
                    # retains only what was pulled recently, so a match there means
                    # "covered while still being pulled", not "kept". Treating
                    # conditional coverage as a guarantee is out of scope for an
                    # audit that deliberately does not own these policies.
                    # Only patterns belonging to `always` rules count as protection.
                    # The first version of this matched ANY pattern in the policy and
                    # duly reported dockerhub-proxy's tags as "covered by **" — but
                    # that `**` belongs to its nDaysSinceLastPull rule, which retains
                    # only what is still being pulled. Crediting a conditional rule as
                    # coverage is precisely the false assurance this audit exists to
                    # prevent, and it made the checker report OK for the one project
                    # it was written to watch.
                    # Splitting this JSON correctly took three attempts; the two
                    # wrong ones both produced a FALSE OK, which is the worst
                    # possible failure for an audit, so the reasoning is recorded.
                    #  1. Split on `},{` — wrong. tag_selectors and scope_selectors
                    #     are themselves nested objects, so the split lands inside
                    #     rules and patterns get attributed to the wrong template.
                    #  2. Split after `"template":"..."` — necessary but not
                    #     sufficient. Harbor serialises keys alphabetically so
                    #     template is LAST in each rule (…scope_selectors,
                    #     tag_selectors, template), which makes the split point right
                    #     — but EVERY rule also carries a scope_selectors repository
                    #     pattern of `**`, so grepping all patterns still yields `**`
                    #     for every rule. That is what made dockerhub-proxy's tags
                    #     report "retained unconditionally by always-rule '**'" when
                    #     `**` actually belongs to its CONDITIONAL nDaysSinceLastPull.
                    #  3. Split after template, then slice each rule to the span
                    #     between "tag_selectors" and "template" before grepping.
                    #     Verified against the live payloads for policy 22
                    #     (dockerhub-proxy -> 17-alpine 7.4-alpine RELEASE… v0.0.31,
                    #     no `**`) and policy 30 (mychef -> *.*.* latest 95b52f8
                    #     584c796, no `**`).
                    _rules=$(echo "$_pol" | sed 's/"template":"[^"]*"/&\n/g')
                    _pats=$(echo "$_rules" | grep '"template":"always"' \
                            | sed 's/.*"tag_selectors"://; s/"template".*//' \
                            | grep -o '"pattern":"[^"]*"' | sed 's/^"pattern":"//; s/"$//' | sort -u)
                    _condpats=$(echo "$_rules" | grep '"template":' | grep -v '"template":"always"' \
                            | sed 's/.*"tag_selectors"://; s/"template".*//' \
                            | grep -o '"pattern":"[^"]*"' | sed 's/^"pattern":"//; s/"$//' | sort -u)
                    for TAG in $_tags; do
                      _hit=""
                      for _pt in $_pats; do
                        case "$TAG" in $_pt) _hit="$_pt"; break ;; esac
                      done
                      if [ -n "$_hit" ]; then
                        echo "    ok: '$P' tag '$TAG' retained unconditionally by always-rule '$_hit'"
                      else
                        echo "    UNPROTECTED: '$P' tag '$TAG' is DEPLOYED but no always-rule in policy $_rid matches it"
                        # Then say whether a CONDITIONAL rule covers it — genuinely
                        # different from nothing at all, and the distinction is what
                        # the reader needs to decide whether to act. Printed AFTER the
                        # verdict so the verdict is never buried under its caveat.
                        _cond=""
                        for _pt in $_condpats; do
                          case "$TAG" in $_pt) _cond="$_pt"; break ;; esac
                        done
                        [ -z "$_cond" ] || echo "      (note) it does match CONDITIONAL rule '$_cond' — retained only while that rule's terms hold, not guaranteed"
                        EXCLUDED_UNPROTECTED="${EXCLUDED_UNPROTECTED} ${P}:${TAG}"
                      fi
                    done
                  done
                  if [ -n "$EXCLUDED_UNPROTECTED" ]; then
                    echo "==> excluded-check: DRIFT — deployed tags in unmanaged projects with no explicit rule:"
                    echo "   $EXCLUDED_UNPROTECTED"
                    echo "    Not failing the run: this Job deliberately does not own those policies,"
                    echo "    and failing here would block retention/quota reconcile for everything else."
                    echo "    Fix by declaring the policy in git (see the 1b header) — do not hand-add"
                    echo "    rules, because a hand-added rule is exactly what evaporates on recreate."
                  fi

                  # --- 2) system-wide GC schedule, nightly, delete_untagged so retention
                  #        prunes actually reclaim blobs. Runs 30m after the retention
                  #        cron above so pruned tags are already gone by the time GC
                  #        walks the blob graph. -----------------------------------
                  echo "==> gc: checking existing schedule ..."
                  current=$(curl -fsS -u "$AUTH" "$CORE/api/v2.0/system/gc/schedule")
                  cat > /tmp/gc.json <<'EOF'
                  {
                    "schedule": { "type": "Daily", "cron": "0 30 2 * * *" },
                    "parameters": { "delete_untagged": true }
                  }
                  EOF

                  if [ -z "$current" ] || [ "$current" = "null" ]; then
                    echo "==> gc: no schedule set, creating (POST) ..."
                    code=$(curl -sS -u "$AUTH" -o /tmp/gc.out -w '%{http_code}' \
                      -X POST "$CORE/api/v2.0/system/gc/schedule" -H 'Content-Type: application/json' \
                      --data @/tmp/gc.json)
                    if [ "$code" != "201" ]; then
                      echo "FAIL: POST /system/gc/schedule returned HTTP $code"; cat /tmp/gc.out; exit 1
                    fi
                  else
                    echo "==> gc: schedule exists, updating (PUT) ..."
                    code=$(curl -sS -u "$AUTH" -o /tmp/gc.out -w '%{http_code}' \
                      -X PUT "$CORE/api/v2.0/system/gc/schedule" -H 'Content-Type: application/json' \
                      --data @/tmp/gc.json)
                    if [ "$code" != "200" ]; then
                      echo "FAIL: PUT /system/gc/schedule returned HTTP $code"; cat /tmp/gc.out; exit 1
                    fi
                  fi

                  echo "==> gc: verifying schedule (read-back) ..."
                  verify=$(curl -fsS -u "$AUTH" "$CORE/api/v2.0/system/gc/schedule")
                  echo "$verify" | grep -qF '"type":"Daily"' || { echo "FAIL: gc schedule type != Daily after apply"; echo "$verify"; exit 1; }
                  echo "$verify" | grep -qF '"cron":"0 30 2 * * *"' || { echo "FAIL: gc cron mismatch after apply"; echo "$verify"; exit 1; }
                  echo "==> gc: OK (Daily @ 02:30 UTC, delete_untagged=true)."

                  # --- 3) per-project STORAGE QUOTAS (2026-09-16). ---------------
                  # Enforcement, not observation. The 2026-09-16 ENOSPC outage happened
                  # with retention running, GC running nightly and reporting Success, and
                  # every project quota set to `unlimited` (verified live: all 23). The
                  # lesson this platform already paid for once — the MinIO/Velero DR
                  # deadlock on w1, where alerts fired for 59h and changed nothing because
                  # nothing enforced a ceiling — is that a ceiling is the control and the
                  # alert is only the backstop. So: quotas first, alert second.
                  #
                  # Quotas are applied to EVERY project, including the ones excluded from
                  # retention. That exclusion exists for a narrow reason (do not PUT over
                  # dockerhub-proxy's hand-set nDaysSinceLastPull policy) which has no
                  # bearing on a storage ceiling, so it is deliberately NOT reused here.
                  #
                  # HONEST LIMIT — THESE CAPS ARE INTENTIONALLY OVERCOMMITTED.
                  # The sum of all caps (~40 + 20 + 20 + 20 + 15 + the 10GiB default for
                  # the rest) exceeds the ~98GiB usable PVC. That is deliberate: sizing
                  # 23 projects to sum under 98GiB would mean ~4GiB each, which is below
                  # what an active tenant legitimately needs, and would break CI — the
                  # owner's #1 priority — to satisfy an arithmetic tidiness nobody asked
                  # for. What a quota buys here is BLAST-RADIUS containment for
                  # COMMITTED artifacts: no single project can run away on tags and
                  # blobs and take the registry down for every other tenant.
                  #
                  # READ THIS BEFORE CONCLUDING "we have quotas, so it cannot be a
                  # runaway project": a quota does NOT bound the class of data that
                  # caused the 2026-09-16 outage. Harbor's quota accounting does not
                  # count `_uploads` at all — measured during that incident, the quota
                  # API summed ~39.5G across all 23 projects while `df` on the PVC
                  # showed 59G used, and that ~20G delta WAS the orphaned-upload pile.
                  # base-images could reproduce that outage exactly while its quota
                  # still read 18.93G of 40G. Only registry.upload_purging
                  # (applicationsets/harbor-app.yaml) bounds that class.
                  #
                  # Aggregate safety therefore comes from the other two controls
                  # (upload_purging for orphaned uploads, retention for tags per repo),
                  # with the 75%/30m PVC utilisation alert as the backstop for slow
                  # collective drift across projects.
                  # Do not "fix" this by shrinking the caps to sum under capacity.
                  QUOTA_DEFAULT_GIB="${QUOTA_DEFAULT_GIB:-10}"
                  echo "==> quotas: default ${QUOTA_DEFAULT_GIB}GiB, overrides: $QUOTA_OVERRIDES"
                  while IFS= read -r P; do
                    [ -n "$P" ] || continue

                    GIB="$QUOTA_DEFAULT_GIB"
                    for OV in $QUOTA_OVERRIDES; do
                      case "$OV" in
                        "${P}="*) GIB="${OV#*=}" ;;
                      esac
                    done
                    BYTES=$(( GIB * 1073741824 ))

                    # F-1: NOT `head -1`. Step 1 of this same script refuses that for
                    # this exact parse and explains why: Harbor serialises JSON keys
                    # alphabetically, so cve_allowlist's NESTED "project_id" sorts
                    # BEFORE the project's own. A project attached to the system CVE
                    # allowlist reports project_id 0 there, so `head -1` yields pid=0,
                    # the quota lookup finds nothing, and the `exit 1` below kills the
                    # loop mid-way under `set -eu` — leaving every project after it
                    # with NO quota at all, silently. Same unanimity check as step 1:
                    # take every occurrence, and refuse rather than guess if they
                    # disagree.
                    # `|| true` on THIS call only: projects excluded from retention
                    # (RETENTION_EXCLUDE_PROJECTS) have no cached payload, so an absent
                    # file must fall through to the fetch below, NOT abort the script
                    # under `set -eu`. Without it the job dies on the first excluded
                    # project and every project after it gets no quota — the exact
                    # silent-partial-application failure this fix exists to prevent.
                    # The post-fetch call below is strict, so a genuinely ambiguous
                    # payload still fails loudly.
                    pid=$(resolve_pid "/tmp/proj_${P}.json" "$P" 2>/dev/null || true)
                    if [ -z "$pid" ]; then
                      # Retention skipped this project (excluded or 404) so no cached
                      # payload exists; fetch it now rather than silently skipping —
                      # a project with no quota is exactly the hole this step closes.
                      pcode=$(curl -sS -o "/tmp/proj_${P}.json" -w '%{http_code}' -u "$AUTH" "$CORE/api/v2.0/projects/$P")
                      if [ "$pcode" = "404" ]; then
                        echo "==> quotas: skip: project '$P' gone (404), continuing."; continue
                      fi
                      [ "$pcode" = "200" ] || { echo "FAIL: GET /projects/$P returned HTTP $pcode"; exit 1; }
                      pid=$(resolve_pid "/tmp/proj_${P}.json" "$P")
                    fi
                    [ -n "$pid" ] || { echo "FAIL: could not resolve project_id for '$P'"; exit 1; }

                    # The quota payload carries BOTH the quota's own "id" and a nested
                    # "ref":{"id":<project id>}. Strip the nested object first instead
                    # of trusting alphabetical key order to put "id" before "ref" —
                    # same class of bug as the project_id parse above, and picking the
                    # wrong one here would PUT a quota onto an unrelated object.
                    qid=$(curl -fsS -u "$AUTH" "$CORE/api/v2.0/quotas?reference=project&reference_id=${pid}" \
                          | sed 's/"ref":{[^}]*}//g' \
                          | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
                    [ -n "$qid" ] || { echo "FAIL: no quota object for project '$P' (id $pid)"; exit 1; }

                    code=$(curl -sS -u "$AUTH" -o /tmp/q.out -w '%{http_code}' \
                      -X PUT "$CORE/api/v2.0/quotas/${qid}" -H 'Content-Type: application/json' \
                      --data "{\"hard\":{\"storage\":${BYTES}}}")
                    [ "$code" = "200" ] || { echo "FAIL: PUT /quotas/$qid for '$P' returned HTTP $code"; cat /tmp/q.out; exit 1; }

                    # Read back — a quota that silently did not apply is the same as no
                    # quota, and that is the condition that caused this outage.
                    got=$(curl -fsS -u "$AUTH" "$CORE/api/v2.0/quotas/${qid}" \
                          | grep -o '"hard":{[^}]*}' | grep -o '"storage":-\{0,1\}[0-9]*' | cut -d: -f2)
                    [ "$got" = "$BYTES" ] \
                      || { echo "FAIL: quota read-back for '$P' is '$got', expected '$BYTES'"; exit 1; }
                    echo "==> quotas: OK '$P' (project $pid, quota $qid) = ${GIB}GiB"
                  done < /tmp/all_projects.txt

                  if [ -n "$DEFERRED_FAILURES" ]; then
                    echo "FAIL: retention/gc/quota reconcile completed for every other project,"
                    echo "      but these projects breached RETENTION_MAX_RULES and were SKIPPED:"
                    echo "     $DEFERRED_FAILURES"
                    echo "      Their existing policies were left untouched. Fix and re-run."
                    exit 1
                  fi

                  echo "==> harbor retention + gc + quota configuration complete."
          volumes:
            - name: tmp
              emptyDir: {}
