# Declarative PostgreSQL roles on `capstone-pg` (db-setup task (c) — the ESO/Vault
# wiring for app DB connection secrets). `DatabaseRole` is the standalone CRD
# (decoupled from the Cluster object, unlike inline `managed.roles`) — each role's
# password comes from an ESO-materialized `kubernetes.io/basic-auth` Secret
# (platform-services/db-tier/externalsecrets.yaml), never a literal in git.
#
# `databaseRoleReclaimPolicy: retain` on all three: never let a CR delete/DROP a
# live role + its data as a side effect of a manifest being removed — deletion is
# a deliberate operator action, not something ArgoCD prune should ever trigger.
---
# Backstage's owner role — CONSUMED since the §4a cutover
# (docs/operator/in-cluster-db-tier-runbook.md §4a;
# applicationsets/backstage-process-app.yaml now points here instead of its
# bundled Bitnami postgresql subchart). Deliberately NOT granted `createdb`
# (unlike crossplane_provisioner below) — Backstage runs with
# `backend.database.pluginDivisionMode: schema` instead of its default
# `database` mode specifically so this role doesn't need it (each plugin gets a
# schema inside the one `backstage` database, which this role already owns via
# databases.yaml — schema creation is an owner privilege, no CREATEDB required).
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: capstone-pg-backstage
  namespace: db-tier
  labels:
    platform.capstone/component: platform
spec:
  cluster:
    name: capstone-pg
  name: backstage
  login: true
  superuser: false
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: cnpg-backstage-app-credentials   # platform-services/db-tier/externalsecrets.yaml
---
# Harbor's eventual owner role (same cutover-target status as backstage above;
# applicationsets/harbor-app.yaml still uses the chart-bundled postgres+redis).
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: capstone-pg-harbor
  namespace: db-tier
  labels:
    platform.capstone/component: platform
spec:
  cluster:
    name: capstone-pg
  name: harbor
  login: true
  superuser: false
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: cnpg-harbor-app-credentials
---
# Crossplane tenant-provisioning parity role — mirrors the off-box
# `crossplane_provisioner` Postgres role EXACTLY (LOGIN CREATEDB CREATEROLE, NOT
# SUPERUSER; docs/operator/db-tier-provisioner-setup.md §6b) so provider-sql's
# `db-tier-postgres` ProviderConfig CAN be repointed at this in-cluster cluster
# later without a privilege-model change (cutover runbook §4). NOT wired into
# provider-sql yet — `config/providerconfig-postgres.yaml` still points at
# ua-mis-db-1; repointing it is the cutover, out of scope here.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: capstone-pg-crossplane-provisioner
  namespace: db-tier
  labels:
    platform.capstone/component: platform
spec:
  cluster:
    name: capstone-pg
  name: crossplane_provisioner
  login: true
  superuser: false
  createdb: true
  createrole: true
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: cnpg-crossplane-provisioner-credentials
---
# slidedeck's owner role (slides.uamishub.com — reveal.js slide host). Owns the
# `slides` database (databases.yaml); the app runs its own idempotent DDL on boot
# so no createdb/createrole needed. Password from the ESO-materialized basic-auth
# Secret (platform-services/db-tier/externalsecrets.yaml → Vault
# secret/platform/db/cnpg/slides). Same non-superuser, retain-on-delete posture as
# backstage/harbor above.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: capstone-pg-slides
  namespace: db-tier
  labels:
    platform.capstone/component: platform
spec:
  cluster:
    name: capstone-pg
  name: slides
  login: true
  superuser: false
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: cnpg-slides-app-credentials
---
# Grafana's owner role (grafana.capstone.uamishub.com). Owns the `grafana`
# database (databases.yaml); Grafana runs its own migrations on boot, which only
# need OWNER privileges on that database — deliberately NOT granted createdb or
# createrole (same least-privilege posture as backstage/slides, unlike
# crossplane_provisioner which explicitly needs both). Password from the
# ESO-materialized basic-auth Secret (platform-services/db-tier/
# externalsecrets.yaml -> Vault secret/platform/db/cnpg/grafana). Same
# retain-on-delete posture as every role above.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: capstone-pg-grafana
  namespace: db-tier
  labels:
    platform.capstone/component: platform
spec:
  cluster:
    name: capstone-pg
  name: grafana
  login: true
  superuser: false
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: cnpg-grafana-app-credentials   # platform-services/db-tier/externalsecrets.yaml
---
# Owner role for the platform agile board's database (databases.yaml). The app
# self-migrates on boot, which needs OWNER on that one database and nothing more
# — no createdb, no createrole, not superuser (same least-privilege posture as
# backstage/slides/grafana). Password comes from the SealedSecret-materialized
# basic-auth Secret in platform-services/db-tier/sealedsecret-agile.yaml.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: capstone-pg-agile
  namespace: db-tier
  labels:
    platform.capstone/component: platform
spec:
  cluster:
    name: capstone-pg
  name: agile
  login: true
  superuser: false
  databaseRoleReclaimPolicy: retain
  passwordSecret:
    name: cnpg-agile-app-credentials   # platform-services/db-tier/sealedsecret-agile.yaml
