# CloudNativePG `Cluster` — the in-cluster Postgres 17 tier (db-setup task (a)).
# HA: 3 instances (1 primary + 2 streaming replicas, automatic failover managed by
# the operator), required pod anti-affinity across the 3 control-plane nodes (one
# instance per node — matches the Rook-Ceph replica-3/failure-domain-host posture:
# survives ANY single node loss with no data loss and no manual failover).
#
# Image: pinned to the exact (non-floating) CNPG-published PG17 build, Trixie
# base — version + OS-family parity with the off-cluster ua-mis-db-1 box
# (docs/db-tier-runbook.md: "PostgreSQL 17... pgBackRest from the Trixie repo").
# Pin; bump deliberately (project convention — no :latest / floating minor tags).
#
# Storage: ceph-block (Rook-Ceph RBD, replica-3) — the cluster default SC. 10Gi is
# generous headroom for small application-metadata databases (Backstage catalog +
# Harbor metadata; NOT image blobs — those live in Harbor's own object storage).
#
# Bootstrap: CNPG requires an initdb bootstrap database; `app`/`app` is UNUSED by
# any real consumer (Backstage/Harbor get their OWN databases + roles via
# databases.yaml/roles.yaml, declared separately and decoupled from the Cluster
# object). No `bootstrap.initdb.secret` -> the operator auto-generates + owns
# `capstone-pg-app` (harmless, nothing reads it).
#
# Backups: via the Barman Cloud plugin (platform-services/cnpg/barman-plugin/),
# NOT the deprecated in-tree `spec.backup.barmanObjectStore` — see
# platform-services/cnpg/barman-plugin/kustomization.yaml for why. `isWALArchiver:
# true` turns on continuous WAL shipping (PITR) in addition to the nightly
# ScheduledBackup (scheduledbackup.yaml).
#
# No `enableSuperuserAccess` / no `managed.roles` here — per-app roles are
# declared via the separate `DatabaseRole` CRD (roles.yaml), least-privilege and
# decoupled from this object (no need to touch the Cluster spec to add a role).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: capstone-pg
  namespace: db-tier
  labels:
    platform.capstone/component: platform
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.9-202605110912-standard-trixie

  storage:
    storageClass: ceph-block
    size: 30Gi   # expanded live 2026-11-01 (low-disk halt); git reconciled to match

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname   # one instance per node (3 nodes, 3 instances)
    podAntiAffinityType: required
    # Scheduling hardening (noisy-neighbor incident follow-up, applicationsets/
    # vault-app.yaml has the full writeup): `additionalPodAntiAffinity` is
    # explicitly documented by the CNPG API as ADDITIVE to the required
    # self-anti-affinity above (not a replacement), so it's safe to layer here.
    # Soft-prefer nodes that are not already running a Vault server pod or the
    # Prometheus pod — best-effort only, since with just 3 HA-eligible Mac-Mini
    # workers the 3 CNPG instances still land 1-per-Mac-Mini alongside the 3
    # Vault pods by construction of their own independent required rules; the
    # real fix for that deeper co-location is a 4th HA-eligible worker node
    # (tracked as a follow-up, not in this PR's blast radius since it doesn't
    # touch any live pod's scheduling — additionalPodAntiAffinity only affects
    # FUTURE scheduling decisions for this Cluster's instances).
    additionalPodAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 80
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: vault
                component: server
            topologyKey: kubernetes.io/hostname
        - weight: 60
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: prometheus
            topologyKey: kubernetes.io/hostname

  # WAL retention ceiling for replication slots. CNPG creates one physical slot
  # per replica; at PostgreSQL's default (-1, unlimited) an UNAVAILABLE replica's
  # slot pins WAL forever. On 2026-11-02 the two slots belonging to instances on
  # the dead w1/n3 nodes had pinned 19GB of WAL into capstone-tenant-pg's 20Gi
  # PVC -> "Detected low-disk space condition" -> CNPG refused to start Postgres
  # -> every tenant database went down with it (13 agile boards, Backstage,
  # ida-llm). pg_wal was 19G against a 905M base.
  #
  # Nothing in the archiving signals showed this: ContinuousArchiving and
  # LastBackupSucceeded were both True and archive_status/*.ready was 0. The WAL
  # was PINNED, not queued. Diagnose with pg_replication_slots (active=f +
  # wal_status=extended), never with pg_stat_archiver.
  #
  # 8GB is several times the steady-state WAL footprint, so a replica can be down
  # for hours and still catch up incrementally; one that is down for days has its
  # slot invalidated (wal_status=lost) and re-bootstraps from a base backup -- a
  # sub-second operation at this data size, and far cheaper than filling the disk.
  postgresql:
    parameters:
      max_slot_wal_keep_size: 8GB

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
    # No CPU limit — same reasoning as the Ceph OSDs (rook-ceph-cluster-app.yaml):
    # avoid CPU-throttling a DB under load; the memory limit is the real RAM-
    # governance guardrail on this fleet. Revisit if Goldilocks (goldilocks.
    # fairwinds.com/enabled label above -> N/A, this is set on the namespace) flags
    # a better-fit request/limit once real traffic lands.

  bootstrap:
    initdb:
      database: app
      owner: app

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # `enabled: true` is EXPLICIT (it is the CNPG webhook's default) because
      # spec.plugins is an ATOMIC list: ArgoCD's ServerSideApply-predicted state
      # replaces the whole entry, the webhook re-adds the default, and the app
      # sat perpetually OutOfSync on this one field. Stating the default in git
      # makes desired == live. (Drift-cleanup; same fix in tenant-cluster/.)
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: capstone-pg-backup-store   # platform-services/cnpg/cluster/objectstore.yaml

  # Observability: real `cnpg_*` Postgres metrics (replication lag, connections,
  # xact commit/rollback rate, database size, WAL, cache hit ratio) for
  # "Platform / Infra — CNPG / Postgres" (dashboard-cnpg-postgres.yaml). The
  # `cnpg-operator-app.yaml` comment claiming the chart's `monitoring.
  # podMonitorEnabled` default gives this "for free" was checked live
  # (2026-07-08) and found NOT true — no PodMonitor exists for this Cluster.
  # `enablePodMonitor` is the definitive, documented per-Cluster switch
  # (independent of the operator chart's global default): the operator creates
  # a PodMonitor targeting each instance's `metrics` port itself, no manual
  # ServiceMonitor/PodMonitor needed here.
  # ⚠ `kubectl explain cluster.spec.monitoring.enablePodMonitor` flags this
  # field DEPRECATED on the live CRD ("will be removed in an upcoming
  # release... create a PodMonitor manually") — still functional as of chart
  # 0.29.0/CNPG 1.30.0 (this pin), so left as the one-line switch for now. If a
  # future CNPG bump removes it, fall back to a hand-written PodMonitor in
  # servicemonitors.yaml (same pattern already used there for ESO/Crossplane)
  # targeting the Cluster's `metrics` port.
  monitoring:
    enablePodMonitor: true
