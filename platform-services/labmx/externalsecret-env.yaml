# ════════════════════════════════════════════════════════════════════════════
# ExternalSecret — LabMx's application env, materialized into ns `labmx` as the
# Secret `labmx-env`, which BOTH Deployments consume verbatim via
# `envFrom.secretRef`. Every Vault key becomes an env var of the same name.
#
# ⚠⚠ THIS OBJECT DOES NOT WORK YET AND MUST NOT BE MADE TO WORK CARELESSLY. ⚠⚠
#
# ── STATUS AS OF 2026-10-01: STILL NOT WORKING, AND IT NEVER HAS.
# Step 1 below (seeding Vault) was never performed. This ExternalSecret has been
# in SecretSyncedError continuously since 2026-09-09T04:22:45Z, retrying roughly
# every 7 minutes, with:
#     Ready=False  SecretSyncedError: could not get secret data from provider
#     error processing spec.dataFrom[0].extract, err: Secret does not exist
#
# ⚠ THE ARGOCD APP IS GREEN ANYWAY. `platform-svc-labmx` reports Synced, because
# Synced only means "the live manifests match git" — it says NOTHING about whether
# the secret inside actually resolves. The app's HEALTH is Degraded, and that is
# the only field that reflects this failure. If you check Synced and move on, you
# will conclude this works. It does not. Check the ExternalSecret directly:
#     kubectl -n labmx get externalsecret labmx-env
#
# The store is NOT at fault: 116 of 119 ExternalSecrets cluster-wide are Ready, and
# slides/slidedeck-env uses the IDENTICAL dataFrom.extract + vault-backend
# construction. The only missing thing is the Vault path itself.
#
# CONSEQUENCE: the live `labmx-env` Secret is still the hand-applied object from
# 2026-09-08 — it carries kubectl's last-applied-configuration and has no
# ownerReferences, so ESO is not its author and nothing reconciles it. It is not in
# git. No GitOps change can currently alter its contents.
# Nothing has been written to Vault (agents are classifier-gated out of prod Vault
# writes). Read the ORDERING section at the bottom before seeding — doing the
# steps out of order takes uamishub.com down.
#
# ── WHY `dataFrom.extract` AND NOT AN ENUMERATED `data:` LIST
# This is the single most important line in the file. The live `labmx-env` Secret
# holds SEVEN keys, not the three the migration notes recorded:
#
#     $ kubectl -n labmx get secret labmx-env -o json | jq -r '.data | keys[]'
#     AZURE_CLIENT_ID
#     AZURE_CLIENT_SECRET
#     AZURE_TENANT_ID
#     DATABASE_URL
#     NEXT_PUBLIC_AZURE_CLIENT_ID
#     NEXT_PUBLIC_AZURE_TENANT_ID
#     RESUME_SIGNING_SECRET
#
# The hand-off note for this work listed only DATABASE_URL, AZURE_CLIENT_SECRET
# and RESUME_SIGNING_SECRET. An enumerated `data:` list written from that note
# would have been accepted by every validator in this repo, gone green, and then —
# on the first successful ESO sync — REPLACED a 7-key Secret with a 3-key one.
# `creationPolicy: Owner` means ESO owns the whole Secret, not a subset of its
# keys. The four dropped keys are the entire Entra ID / Azure AD client
# configuration, so the failure would not even be immediate: the pods keep running
# on their already-resolved env (env is read once at container start), and the site
# breaks at the NEXT restart, with sign-in failing and nothing in the diff to
# explain it.
#
# `dataFrom.extract` pulls the WHOLE Vault object instead, so the key set is
# whatever Vault holds — adding a key later needs no manifest edit, and no
# manifest edit can silently drop one. Same construction as
# platform-services/slidedeck/externalsecret-env.yaml.
#
# ── STORE CHOICE: the platform-wide ClusterSecretStore, not a per-tenant one
# `vault-backend` (platform-services/external-secrets/clustersecretstore.yaml).
# The per-namespace `vault-tenant` SecretStore isolation model
# (external-secrets/secretstore-template.yaml) is for SCAFFOLDED student tenants:
# it requires `make vault-onboard NAME=... ENV=...` to mint a `tenant-<team>` Vault
# k8s-auth role plus an in-namespace `vault-ca` ConfigMap, and it exists so a
# student's ServiceAccount cannot read another student's subtree. LabMx has no
# student ServiceAccount and no tenant lifecycle — it is a platform-operated site.
# platform-services/lab-hosting makes exactly this call, in writing, for the same
# reason ("read via the SAME platform-wide `vault-backend` ClusterSecretStore every
# other platform service reads through — NOT a per-student SecretStore").
#
# ── VAULT PATH: `tenants/labmx/prod/app`
# The repo's documented tenant path convention is
# `secret/data/tenants/<team>/<env>/app` (external-secrets/secretstore-template.yaml),
# and it lines up with this namespace's own `platform.capstone/team=labmx` +
# `platform.capstone/env=prod` labels. NO VAULT POLICY CHANGE IS NEEDED: the
# `external-secrets-ro` policy bound to the ESO controller's k8s-auth role already
# grants `read` on `secret/data/tenants/*` AND `secret/data/platform/*`
# (external-secrets/vault-policies/eso-role.sh lines 15-26). `platform/labmx` would
# have worked equally well policy-wise (the slidedeck precedent); `tenants/labmx/
# prod/app` was chosen because it matches the labels this namespace already
# carries.
#
# PATH NOTATION: `remoteRef.key` below is the BARE KV-v2 logical path — no
# `secret/` and no `secret/data/` prefix. The ClusterSecretStore already supplies
# `path: "secret"` as the mount and ESO appends `/data` itself for KV v2. The raw
# HTTP form (`secret/data/tenants/labmx/prod/app`) and the CLI form
# (`vault kv put secret/tenants/labmx/prod/app`) are correct in THEIR contexts and
# are not interchangeable with this field.
#
# ── ORDERING — the operator runbook. DO NOT DEVIATE.
#
#   0. Read the live values first. They are the source of truth; there is no copy
#      anywhere else:
#        kubectl -n labmx get secret labmx-env -o json \
#          | jq -r '.data | to_entries[] | "\(.key)=\(.value|@base64d)"'
#
#   1. Write ALL SEVEN keys to Vault in ONE put (a `put` replaces the object, so a
#      partial put is how you lose keys):
#        vault kv put secret/tenants/labmx/prod/app \
#          AZURE_CLIENT_ID=... AZURE_CLIENT_SECRET=... AZURE_TENANT_ID=... \
#          DATABASE_URL=... NEXT_PUBLIC_AZURE_CLIENT_ID=... \
#          NEXT_PUBLIC_AZURE_TENANT_ID=... RESUME_SIGNING_SECRET=...
#
#      ⚠⚠ THE DSN HOSTNAME IS CONDITIONAL. READ THIS BEFORE CHOOSING ONE. ⚠⚠
#
#      There are two valid hosts and the correct one depends on whether the
#      TEMPORARY single-writer pin is still in force:
#
#        (a) capstone-mariadb-mariadb-cluster.db-tier.svc.cluster.local
#            The normal, round-robin Service. THIS IS THE DEFAULT AND THE END
#            STATE. Writes spread across all three Galera nodes, and losing one
#            node degrades to the survivors.
#
#        (b) capstone-mariadb-mariadb-cluster-primary.db-tier.svc.cluster.local
#            Single-writer pin to pod -0. Correct ONLY while the temporary
#            mitigation described below is deliberately active.
#
#      Everything else in the DSN (user `mishub`, the password, `:3306`, `/mishub`)
#      is identical either way — only the hostname differs by the `-primary` suffix.
#
#      HOW TO TELL WHICH ONE APPLIES: read what is live, do not guess from this
#      comment, because this comment can go stale and the live object cannot:
#        kubectl -n labmx get secret labmx-env -o jsonpath='{.data.DATABASE_URL}' \
#          | base64 -d | sed -E 's#^mysql://[^@]+@##'
#      Seed Vault with the SAME host that is live. If it shows (a), write (a).
#
#      ⚠ IF YOU ARE READING THIS LONG AFTER 2026-10-01, THE ANSWER IS PROBABLY (a).
#      The pin was always meant to be temporary — see "TEMPORARY PIN" below.
#      Writing (b) out of habit re-introduces a single point of failure that was
#      deliberately removed.
#
#      ── TEMPORARY PIN: what it was for, and when it ends ──────────────────────
#      On 2026-10-01 the live Secret's DATABASE_URL was patched in place from (a)
#      to (b), and both Deployments were restarted, to stop a live student-facing
#      bug. db-tier is MariaDB 11.8.8 Galera with three nodes and ALL THREE are
#      writable (read_only=OFF on 0, 1 and 2 — measured, not assumed), so the
#      round-robin Service sent concurrent upserts of the SAME row to different
#      writable nodes and one was certification-aborted at commit. That surfaced as
#      MariaDB error 1020 "Record has changed since last read in table 'users'" /
#      Prisma P2034 on prisma.user.upsert(), at 536 P2034 request failures in ~23h
#      in hub (60 in the trailing hour) against 17 in attendance.
#
#      THE PIN IS A MITIGATION WITH AN EXPIRY, NOT A DESIGN CHOICE. It must be
#      reverted to (a) once the application change that removes the per-request
#      writes to `users` and `user_groups` is deployed and verified. Until then,
#      LabMx has NO database if pod -0 is unavailable, where the round-robin
#      Service would have survived on -1/-2. That is a knowingly accepted,
#      time-boxed availability regression — do not let it become permanent by
#      copying (b) forward without checking.
#
#      ⚠ THIS IS WHY STEP 0 IS NOT SIMPLY "COPY THE LIVE VALUE". As of 2026-10-01
#      the live Secret's DATABASE_URL was patched in-place to the `-primary` host,
#      so copying it forward is now CORRECT. But that patch exists ONLY in the live
#      cluster object — it is in no git history and no Vault path. The moment you
#      seed Vault, ESO adopts this Secret (the live object already carries the label
#      `reconcile.external-secrets.io/managed: "true"`) and OVERWRITES all seven
#      keys with whatever you wrote. Seed the round-robin host and you silently
#      reintroduce the P2034 storm, with nothing in any diff to explain it.
#
#      ── IF YOU EVER WANT ESO TO REWRITE THE HOST RATHER THAN STORING IT ───────
#      This is RECORDED KNOWLEDGE, NOT AN INSTRUCTION TO APPLY. It is deliberately
#      NOT present in this manifest's spec, because a committed template would
#      silently re-pin the DSN to the single-writer Service the moment Vault is
#      seeded — including long after the temporary pin above has been reverted, by
#      someone who never read any of this. Store the host you want in Vault; do not
#      rewrite it here.
#
#      Should a host rewrite ever genuinely be wanted, this is the verified form:
#
#        target:
#          template:
#            engineVersion: v2
#            mergePolicy: Merge
#            data:
#              DATABASE_URL: "{{ .DATABASE_URL | replace \"<old-host>\" \"<new-host>\" }}"
#
#      Two facts about it, both established by EXECUTION against this cluster's ESO
#      v2.6.0 (rendered through a scratch ExternalSecret in a throwaway namespace
#      against an equivalent 7-key source), not from documentation:
#
#        1. `mergePolicy: Merge` IS LOAD-BEARING. The CRD default is `Replace`,
#           which publishes a Secret containing ONLY the templated key and DROPS
#           the other six — the entire Entra ID / Azure AD client configuration
#           plus RESUME_SIGNING_SECRET. Nothing fails at apply time, and nothing
#           fails while pods keep running, because env resolves once at container
#           start. Sign-in breaks at the NEXT restart, with no diff to explain it.
#           With `Merge`, the templated key layers on top of the full key set from
#           `dataFrom.extract`: verified 7 keys out, other 6 byte-identical.
#        2. `.DATABASE_URL` IS in template scope from `dataFrom.extract`, and
#           sprig's argument order is `| replace "<old>" "<new>"`.
#           `engineVersion: v2` is the only value the CRD accepts.
#
#   2. Merge this PR and let `platform-svc-labmx` sync. The ExternalSecret is
#      created. Expect it to sit in error at this point — see step 3.
#
#   3. ESO will NOT take over a Secret it did not create. `labmx-env` exists today
#      as a hand-made object with no ESO ownership metadata, so the ExternalSecret
#      reports a not-owned/already-exists condition and the live Secret is left
#      UNTOUCHED. That is the safe failure mode and it is why steps 1-2 cannot
#      break the site. Hand over ownership only once you have confirmed ESO can
#      actually read the path:
#        kubectl -n labmx get externalsecret labmx-env -o jsonpath='{.status.conditions}'
#      Then, and only then:
#        kubectl -n labmx delete secret labmx-env
#      ESO recreates it within its reconcile window (seconds, not the 1h
#      refreshInterval — deletion of an owned target triggers immediate reconcile).
#
#      ⚠ THE WINDOW IN STEP 3 IS THE ONLY DANGEROUS MOMENT IN THIS WHOLE PR. While
#      `labmx-env` does not exist, any pod that restarts enters
#      CreateContainerConfigError and stays there: the `envFrom.secretRef` has no
#      `optional: true` (matching live), so a missing Secret blocks container
#      start. Running pods are unaffected — env was resolved at their start. Do
#      this at a quiet hour and do not roll the Deployments until step 4 passes.
#
#   4. Verify the key set came back IDENTICAL before walking away:
#        kubectl -n labmx get secret labmx-env -o json | jq -r '.data|keys[]'
#      Expect exactly the seven keys listed at the top of this file. A short list
#      means Vault was seeded incompletely — re-do step 1, do not roll the pods.

#   5. Verify the DSN HOST survived, not just the key count. A seven-key Secret
#      with the round-robin host is the failure this file now exists to prevent:
#        kubectl -n labmx get secret labmx-env -o jsonpath='{.data.DATABASE_URL}' \
#          | base64 -d | sed -E 's#^mysql://[^@]+@##'
#      Expect: capstone-mariadb-mariadb-cluster-primary.db-tier.svc.cluster.local:3306/mishub
#      Then roll both Deployments — env is resolved once at container start, so an
#      unrestarted pod keeps serving the OLD value and will not show the change:
#        kubectl -n labmx rollout restart deploy/hub deploy/attendance
#      Confirm where writes actually land, from a throwaway pod using the new DSN:
#        SELECT CONCAT(@@hostname," read_only=",@@read_only);
#      Expect capstone-mariadb-mariadb-cluster-0 on every connection.
# ════════════════════════════════════════════════════════════════════════════
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: labmx-env
  namespace: labmx
  labels:
    platform.capstone/component: platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: labmx-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: tenants/labmx/prod/app
