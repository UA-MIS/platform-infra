# `attendance` — the LabMx attendance app (attendance.uamishub.com). Next.js
# standalone server, listening on 3001.
#
# Same provenance rules as deployment-hub.yaml: transcribed from the LIVE object,
# image tag corrected to the running `:v2` (the source artifact still says
# `:migrate`), everything else byte-for-byte.
#
# NOTE the two apps share ONE Secret (`labmx-env`) and therefore one Azure app
# registration + one database. That is how they were migrated; it is recorded here
# rather than "fixed", because splitting the credential is a change to the running
# site, not an adoption.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance
  namespace: labmx
  labels:
    app: attendance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attendance
  template:
    metadata:
      labels:
        app: attendance
    spec:
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: attendance
          image: harbor.capstone.uamishub.com/labmx/attendance:v2
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: labmx-env
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_PUBLIC_HUB_URL
              value: "https://uamishub.com"
            - name: NEXT_PUBLIC_ATTENDANCE_URL
              value: "https://attendance.uamishub.com"
            - name: NEXT_PUBLIC_AZURE_REDIRECT_URI
              value: "https://attendance.uamishub.com/"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
