# Active right-sizing for Backstage (ns backstage) — the developer portal. Stateless
# Deployment (its catalog/state live in the external CNPG Postgres, not in-pod), so a
# VPA eviction is safe.
#
# ⚠ SLOW START: Backstage takes 60-120s to boot (plugin init + catalog client). An
# Auto eviction is a 1-2 min PORTAL OUTAGE — sequence it LAST in the supervised apply
# and confirm Ready before moving on. Reclaim here is marginal (req 576Mi vs target
# ~560Mi ≈ already right-sized); it is included for correctness/consistency, not RAM
# savings. If the 1-2 min outage is unwanted, set this one object's updateMode to
# "Initial" (right-sizes at the next natural image-bump restart, no forced eviction).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: backstage
  namespace: backstage
  labels:
    platform.capstone/component: platform
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backstage
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: { cpu: 25m, memory: 256Mi }
        maxAllowed: { cpu: 1000m, memory: 1Gi }
