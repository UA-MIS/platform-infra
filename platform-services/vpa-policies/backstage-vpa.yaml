# Active right-sizing for Backstage (ns backstage) — the developer portal. Stateless
# Deployment (its catalog/state live in the external CNPG Postgres, not in-pod).
#
# updateMode "Initial", NOT "Auto" -- D-180: never evict a single-replica user-facing
# service midday; sizing lands on natural restarts. Backstage also takes 60-120s to
# boot (plugin init + catalog client), so a forced Auto eviction would additionally be
# a 1-2 min PORTAL OUTAGE on top of the eviction-blip risk. Reclaim here is marginal
# (req 576Mi vs target ~560Mi ≈ already right-sized); it is included for
# correctness/consistency, not RAM savings.
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: backstage
  namespace: backstage
  labels:
    platform.capstone/component: platform
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backstage
  updatePolicy:
    # Initial: never evict a single-replica user-facing service midday; sizing
    # lands on natural restarts.
    updateMode: "Initial"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: { cpu: 25m, memory: 256Mi }
        maxAllowed: { cpu: 1000m, memory: 1Gi }
