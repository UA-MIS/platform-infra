# Active right-sizing for the ASYNC Kyverno controllers (ns kyverno). Background,
# cleanup, and reports controllers are off the admission request path — they reconcile
# policy reports / mutate-existing / TTL-cleanup on their own loops, so a one-time VPA
# eviction is a harmless reconcile gap.
#
# ⚠ DELIBERATELY EXCLUDED from Auto — kyverno-admission-controller. It is a
# single-replica Deployment fronting ValidatingWebhookConfigurations with
# failurePolicy: Fail (verified: validate-policy, cel-exception, exception,
# global-context, policy/resource-mutating). Evicting it opens a gap where those
# Fail-closed webhooks reject pod/resource admission cluster-wide until the new pod is
# Ready — a self-inflicted control-plane stall. It keeps its recommend-only Off VPA
# from Goldilocks; right-size it at a natural restart (or add a 2nd replica first, then
# it becomes Auto-safe).
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kyverno-background-controller
  namespace: kyverno
  labels:
    platform.capstone/component: platform
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kyverno-background-controller
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: { cpu: 10m, memory: 32Mi }
        maxAllowed: { cpu: 500m, memory: 512Mi }
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kyverno-cleanup-controller
  namespace: kyverno
  labels:
    platform.capstone/component: platform
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kyverno-cleanup-controller
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: { cpu: 10m, memory: 32Mi }
        maxAllowed: { cpu: 500m, memory: 512Mi }
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: kyverno-reports-controller
  namespace: kyverno
  labels:
    platform.capstone/component: platform
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kyverno-reports-controller
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: { cpu: 10m, memory: 32Mi }
        maxAllowed: { cpu: 500m, memory: 512Mi }
