# Active right-sizing for the STATELESS ArgoCD components (ns argocd). ArgoCD's UI/API
# and reconcile helpers are ordinary Deployments that self-heal on restart, so a
# one-time VPA eviction is a ~15-30s availability blip on the ArgoCD control surface
# (no user-facing workload impact — app reconciliation resumes automatically).
#
# ⚠ EXCLUDED from Auto (get recommend-only Off VPAs from Goldilocks instead):
#   - argocd-application-controller  → StatefulSet, the core reconcile engine and a
#       singleton; evicting it stalls ALL app reconciliation and it is the single
#       heaviest reserver (~2.4Gi target). Right-size it by hand from the Goldilocks
#       recommendation at a natural restart, never by Auto eviction.
#   - argocd-redis                   → in-memory cache singleton; an eviction flushes
#       the reconcile cache and briefly slows every app. Low value, left recommend-only.
#
# Deployment names are the argo-cd chart defaults. controlledValues: RequestsOnly —
# VPA sets right-sized REQUESTS only, never touches limits.
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    platform.capstone/component: platform
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: argocd-server
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledValues: RequestsOnly
        minAllowed: { cpu: 10m, memory: 64Mi }
        maxAllowed: { cpu: 1000m, memory: 768Mi }
---
apiVersion: autoscaling.k8s.io/v1
