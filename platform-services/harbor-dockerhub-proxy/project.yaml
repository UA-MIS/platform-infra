# dockerhub-proxy: the pull-through cache project (B4). registryIdRef resolves the
# numeric registry_id from registry.yaml's Registry MR (same dir) — standard
# Crossplane cross-resource reference, avoids hardcoding an ID that only exists
# after the Registry is created.
#
# public: true — deliberately, so every existing pull path (tenant CI runners,
# Kaniko build-step containers, any future kubelet image pull) can use this
# unauthenticated, with ZERO new credential plumbing. This is a cache of images
# that are ALREADY public on Docker Hub; making the cache itself public adds no
# new exposure. (A private proxy-cache project would need every consumer to carry
# a pull secret scoped to it — unnecessary complexity for public upstream content.)
#
# forceDestroy: true — mirrors the tenant Project MR in apis/composition.yaml
# (same reasoning: without it, a non-empty project — and a cache WILL be
# non-empty after any use — refuses to delete, "please set force_destroy to
# TRUE"). This project holds no source-of-truth content (everything in it is a
# reconstructible cache of a public upstream), so force-destroy has no data-loss
# implication, unlike a tenant's own project.
#
# registryId (hardcoded 1), NOT registryIdRef — deliberate, confirmed correct
# in review. A from-scratch apply of this Registry/Project pair has a SLOW
# async reconcile — observed live (2026-08-15) on provider-harbor v0.1.1:
# Registry reached Ready=True (atProvider populated) roughly 10 minutes after
# creation, Project roughly 5 minutes. registryIdRef genuinely CANNOT resolve
# during that window ("referenced field was empty" — Registry.atProvider is
# still empty), so a fresh apply using the reference would sit
# Synced=False/ReconcileError for up to ~10 minutes before self-healing once
# Registry's status catches up. That's a real, if transient and harmless,
# error-looking state; the earlier draft of this file over-corrected from it
# (wrongly concluded the gap was PERMANENT after only watching it for a few
# minutes — caught in review, see B4-001 in the evidence bundle). The
# resolution: KEEP registryId hardcoded — avoids that transient
# Synced=False window entirely, at the small, accepted cost that this value
# must be updated manually if the dockerhub Registry is ever deleted and
# recreated (registry_id 1 is Harbor's own stable identifier for it; verified
# it does not change across normal reconciles). No ArgoCD health override is
# needed either way — with the hardcoded ID, Ready reaches True on its own
# normal timeline (no reference to wait on), and ArgoCD's default assessment
# is accurate throughout (Progressing, then Healthy).
apiVersion: project.harbor.crossplane.io/v1alpha1
kind: Project
metadata:
  name: dockerhub-proxy
  labels:
    platform.capstone/component: platform
spec:
  forProvider:
    name: dockerhub-proxy
    public: true
    registryId: 1
    vulnerabilityScanning: false   # proxy-cached upstream content, not platform-built; scanning it is not actionable here
    forceDestroy: true
  providerConfigRef:
    name: default
