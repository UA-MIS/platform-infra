# dockerhub-proxy: the pull-through cache project (B4). registryIdRef resolves the
# numeric registry_id from registry.yaml's Registry MR (same dir) — standard
# Crossplane cross-resource reference, avoids hardcoding an ID that only exists
# after the Registry is created.
#
# public: true — deliberately, so every existing pull path (tenant CI runners,
# Kaniko build-step containers, any future kubelet image pull) can use this
# unauthenticated, with ZERO new credential plumbing. This is a cache of images
# that are ALREADY public on Docker Hub; making the cache itself public adds no
# new exposure. (A private proxy-cache project would need every consumer to carry
# a pull secret scoped to it — unnecessary complexity for public upstream content.)
#
# forceDestroy: true — mirrors the tenant Project MR in apis/composition.yaml
# (same reasoning: without it, a non-empty project — and a cache WILL be
# non-empty after any use — refuses to delete, "please set force_destroy to
# TRUE"). This project holds no source-of-truth content (everything in it is a
# reconstructible cache of a public upstream), so force-destroy has no data-loss
# implication, unlike a tenant's own project.
#
# registryIdRef (not a hardcoded registryId) — this is the correct, restored
# state. A prior revision hardcoded registryId: 1 believing the reference
# "genuinely cannot resolve" during the Registry/Project pair's slow
# from-scratch reconcile (Registry reaches Ready=True ~10 minutes after
# creation, Project ~5 minutes on provider-harbor v0.1.1) — that reasoning
# was itself wrong, and its own review had already caught the same mistake
# once before, in the earlier draft this comment used to describe (see
# B4-001 in the evidence bundle). The corrected position, honestly stated:
#
#   - The transient MR unresolved/Synced=False window (~5-10 minutes) IS
#     real, but it is ACCEPTABLE, not something to engineer around. It sits
#     comfortably under FIX-4's CrossplaneManagedResourceNotSynced alert
#     threshold (15 minutes), so it never pages anyone, and it converges to
#     Synced=True/Ready=True permanently on its own once Registry.atProvider
#     populates. No ArgoCD health override is needed — ArgoCD's default
#     assessment is accurate throughout (Progressing, then Healthy).
#   - A hardcoded registryId trades that harmless, bounded, alert-covered
#     window for a SILENT failure mode with no bound and no alert coverage:
#     if the dockerhub Registry is ever deleted and recreated, Harbor issues
#     it a new numeric id, and the hardcoded value here goes stale with no
#     signal — the Project MR keeps reconciling against a registry_id that
#     no longer exists, or worse, now points at a DIFFERENT registry. The
#     ref re-resolves automatically in that scenario; the hardcode does not.
#
# registryIdRef is therefore the right default, not just the approved one.
apiVersion: project.harbor.crossplane.io/v1alpha1
kind: Project
metadata:
  name: dockerhub-proxy
  labels:
    platform.capstone/component: platform
spec:
  forProvider:
    name: dockerhub-proxy
    public: true
    registryIdRef:
      name: dockerhub
    vulnerabilityScanning: false   # proxy-cached upstream content, not platform-built; scanning it is not actionable here
    forceDestroy: true
  providerConfigRef:
    name: default
