# SealedSecret -> Secret `minio-prometheus-token` in the `monitoring` namespace.
# Bearer token for scrape-minio.yaml's ServiceMonitor (bucket-quota-approaching
# alerting, alerts-minio-backup-store.yaml, 2026-09-21 kopia-deadlock incident).
#
# WHY A TOKEN, NOT `MINIO_PROMETHEUS_AUTH_TYPE=public`: MinIO's Prometheus
# endpoints default to requiring a signed JWT (`AUTH_TYPE=jwt`). Flipping the
# server to public/unauthenticated metrics was considered and rejected — this
# bucket holds every namespace's Velero backup data (see
# hardening/netpol-controlplane/minio-netpol.yaml's "crown jewels" note) and a
# public metrics endpoint is one more unauthenticated surface on it for no
# reason, when the authenticated path costs nothing extra to wire up.
#
# Generated with `mc admin prometheus generate <alias> cluster` against the
# live server (uses the root credential to mint the token; does NOT expose or
# rotate the root credential itself). The token is a JWT signed by MinIO's own
# admin secret (HS512, `sub: minio-dr-admin`) — it is valid for both the
# `/minio/v2/metrics/cluster` and `/minio/v2/metrics/bucket` paths and does not
# expire on any human timescale (`exp` is year-2126), matching MinIO's own
# behavior for prometheus tokens (they are not designed to be rotated on a
# schedule; rotate only if this Secret is ever suspected leaked, by re-running
# `mc admin prometheus generate` — that invalidates the previous token).
#
# ⚠ COUPLING: this token is tied to the CURRENT `minio-admin` root credential
# (sealedsecret-admin.yaml, platform-services/minio/). Rotating the MinIO root
# password invalidates this token silently — scrape-minio.yaml's target would
# start returning 403s with no other symptom until MinioMetricsScrapeDown
# fires (up to 15m + `for` delay). Re-generate and reseal this Secret in the
# SAME change that rotates the root credential.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: minio-prometheus-token
  namespace: monitoring
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: minio-prometheus-token
      namespace: monitoring
    type: Opaque
