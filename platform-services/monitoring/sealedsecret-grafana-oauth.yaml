# Grafana OIDC client secret (Observability SSO). Grafana's `auth.generic_oauth`
# federates to Dex as the `grafana` staticClient (platform-services/dex/
# configmap.yaml). This `client-secret` key is injected into the Grafana pod as
# GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET via `grafana.envValueFrom` in
# applicationsets/kube-prometheus-stack-app.yaml — never inlined in the Helm
# values. This is a REAL seal (sealed live against this cluster's
# sealed-secrets controller, same value as the `grafana-client-secret` key in
# platform-services/dex/sealedsecret.yaml) — no reseal needed before go-live,
# unlike the grafana-admin placeholder in sealedsecret-grafana-admin.yaml.
#
# Rotate with the same two-sided recipe as db-console-client-secret
# (platform-services/dex/README.md "DB console static client"): generate one
# new value, reseal it into BOTH this file's `client-secret` key AND the
# `grafana-client-secret` key in platform-services/dex/sealedsecret.yaml, then
# `kubectl -n dex rollout restart deploy/dex` and
# `kubectl -n monitoring rollout restart deploy/kube-prometheus-stack-grafana`.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-oauth
  namespace: monitoring
spec:
  encryptedData:
    client-secret: 
  template:
    metadata:
      name: grafana-oauth
      namespace: monitoring
    type: Opaque
