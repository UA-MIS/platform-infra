# ntfy — the REAL Alertmanager notification destination (Observability follow-up).
# Self-hosted, in-cluster (binwiederhier/ntfy), raw manifests (no maintained Helm
# chart exists upstream — same "raw manifests for a small custom addition" call as
# thanos.yaml in this same directory).
#
# WHY ntfy over a bridge service: ntfy has a BUILT-IN `?template=alertmanager` query
# param (docs.ntfy.sh/publish) that turns Alertmanager's raw webhook JSON into a
# readable firing/resolved push notification with NO separate translator process —
# Alertmanager's `platform-oncall` receiver (kube-prometheus-stack-app.yaml) just
# POSTs straight to this server's topic URL.
#
# AUTH MODEL: `auth-default-access: deny-all` (private server — nothing anonymous).
# ONE user, `platform-oncall`, granted read-write on ONE topic, `platform-alerts`
# (created/granted by the idempotent initContainer below — the ntfy CLI has no
# "create if not exists" flag, so the container script checks first). The SAME
# username/password is used for BOTH ends of the pipe:
#   - Alertmanager PUBLISHES with it (embedded as HTTP Basic Auth in the resealed
#     `alertmanager-webhook` SealedSecret's URL, kube-prometheus-stack-app.yaml —
#     reused verbatim, no Alertmanager values changes needed for this PR).
#   - A phone SUBSCRIBES with it (see "Phone subscription" below).
# This is a single shared credential, not per-consumer scoping — a deliberate
# homelab-scale simplification (see thanos.yaml's MinIO IAM policy for the more
# rigorous per-consumer pattern used where credentials are otherwise root-equivalent;
# here the ntfy user role is already the least privilege ntfy itself offers: `user`,
# not `admin`, obeying the ACL grant rather than bypassing it).
#
# PERSISTENCE: auth.db (the user/ACL database) and cache.db (recent messages, so a
# subscriber reconnecting after a blip doesn't miss anything within cache-duration)
# both live on ONE Ceph RBD PVC. Losing that PVC means re-running the bootstrap
# (idempotent — just deletes/recreates the pod) — acceptable for a notification
# channel, not treated as DR-grade data.
#
# EXPOSURE: internal Alertmanager→ntfy traffic stays fully IN-CLUSTER
# (ntfy.monitoring.svc.cluster.local:8080, plain HTTP — same posture as the Loki
# datasource wiring) so alerting never depends on the Cloudflare tunnel being up.
# The Ingress below is a SEPARATE, additional path that exists ONLY so a phone off
# the home network can subscribe — same Traefik + wildcard-TLS pattern as
# Grafana/Harbor/Dex (id.capstone.uamishub.com precedent).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: monitoring
  labels:
    platform.capstone/component: platform
data:
  server.yml: |
    base-url: "https://ntfy.capstone.uamishub.com"
    listen-http: ":8080"          # unprivileged port — container runs as non-root
    behind-proxy: true            # trust X-Forwarded-For from Traefik
    cache-file: "/var/lib/ntfy/cache.db"
    cache-duration: "12h"
    attachment-cache-dir: "/var/lib/ntfy/attachments"
    auth-file: "/var/lib/ntfy/auth.db"
    auth-default-access: "deny-all"   # private server — nothing anonymous
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-data
  namespace: monitoring
  labels:
    platform.capstone/component: platform
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: monitoring
  labels:
    platform.capstone/component: platform
    app.kubernetes.io/name: ntfy
spec:
  replicas: 1
  # Recreate — the single Ceph RBD PVC is ReadWriteOnce; a rolling update briefly
  # running old+new pod together would fail the new pod's mount.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy
        platform.capstone/component: platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Idempotent bootstrap: create the `platform-oncall` user (once — the ntfy
        # CLI has no create-if-missing flag, so check first) and (re-)grant it
        # read-write on the `platform-alerts` topic (safe to repeat every restart).
        - name: bootstrap
          image: binwiederhier/ntfy:v2.25.0   # pinned; match the main container below
          command: ["/bin/sh", "-ec"]
          args:
            - |
              CONF=/etc/ntfy/server.yml
              if ntfy user list --config "$CONF" 2>/dev/null | grep -q 'platform-oncall'; then
                echo "[ntfy-bootstrap] user platform-oncall already exists"
              else
                echo "[ntfy-bootstrap] creating user platform-oncall"
                printf '%s' "$NTFY_ONCALL_PASSWORD" | ntfy user add --config "$CONF" --role=user --password-stdin platform-oncall
              fi
              ntfy access --config "$CONF" platform-oncall platform-alerts rw
              echo "[ntfy-bootstrap] platform-oncall has rw on platform-alerts"
          env:
            - name: NTFY_ONCALL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ntfy-platform-oncall-credentials
                  key: password
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/ntfy
            - name: config
              mountPath: /etc/ntfy
              readOnly: true
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.25.0   # pinned; bump deliberately
          command: ["ntfy", "serve", "--config", "/etc/ntfy/server.yml"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/ntfy
            - name: config
              mountPath: /etc/ntfy
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ntfy-data
        - name: config
          configMap:
            name: ntfy-config
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: monitoring
  labels:
    platform.capstone/component: platform
    app.kubernetes.io/name: ntfy
spec:
  selector:
    app.kubernetes.io/name: ntfy
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Public path for phone subscription ONLY (see file header — Alertmanager itself
# never uses this, it talks to the ClusterIP Service directly). Matches the
# dex/grafana/harbor Ingress convention exactly: plain Ingress, TLS host listed but
# NO secretName — Traefik's default TLSStore serves the cert-manager wildcard cert
# for *.capstone.uamishub.com. No Cloudflare-side change needed (the tunnel already
# routes the whole wildcard to Traefik, platform-services/cloudflared/deployment.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ntfy
  namespace: monitoring
  labels:
    platform.capstone/component: platform
    app.kubernetes.io/name: ntfy
spec:
  rules:
    - host: ntfy.capstone.uamishub.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ntfy
                port:
                  number: 8080
  tls:
    - hosts:
        - ntfy.capstone.uamishub.com
---
# REAL seal (not a placeholder) — generated in this PR. Same username/password used
# by both the initContainer bootstrap above and the resealed `alertmanager-webhook`
# SealedSecret (kube-prometheus-stack-app.yaml). Rotate ALL THREE together (this
# file's bootstrap re-grants access idempotently on the next pod restart, but the
# alertmanager-webhook secret needs a matching manual reseal — see README).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ntfy-platform-oncall-credentials
  namespace: monitoring
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: ntfy-platform-oncall-credentials
      namespace: monitoring
