# ntfy — the REAL Alertmanager notification destination (Observability follow-up).
# Self-hosted, in-cluster (binwiederhier/ntfy), raw manifests (no maintained Helm
# chart exists upstream — same "raw manifests for a small custom addition" call as
# thanos.yaml in this same directory).
#
# WHY ntfy over a bridge service: ntfy has a BUILT-IN `?template=alertmanager` query
# param (docs.ntfy.sh/publish) that turns Alertmanager's raw webhook JSON into a
# readable firing/resolved push notification with NO separate translator process —
# Alertmanager's `platform-oncall` receiver (kube-prometheus-stack-app.yaml) just
# POSTs straight to this server's topic URL.
#
# AUTH MODEL: `auth-default-access: deny-all` (private server — nothing anonymous).
# ONE user, `platform-oncall`, granted read-write on ONE topic, `platform-alerts`
# (created/granted by the idempotent initContainer below — the ntfy CLI has no
# "create if not exists" flag, so the container script checks first). The SAME
# username/password is used for BOTH ends of the pipe:
#   - Alertmanager PUBLISHES with it (embedded as HTTP Basic Auth in the resealed
#     `alertmanager-webhook` SealedSecret's URL, kube-prometheus-stack-app.yaml —
#     reused verbatim, no Alertmanager values changes needed for this PR).
#   - A phone SUBSCRIBES with it (see "Phone subscription" below).
# This is a single shared credential, not per-consumer scoping — a deliberate
# homelab-scale simplification (see thanos.yaml's MinIO IAM policy for the more
# rigorous per-consumer pattern used where credentials are otherwise root-equivalent;
# here the ntfy user role is already the least privilege ntfy itself offers: `user`,
# not `admin`, obeying the ACL grant rather than bypassing it).
#
# PERSISTENCE: auth.db (the user/ACL database) and cache.db (recent messages, so a
# subscriber reconnecting after a blip doesn't miss anything within cache-duration)
# both live on ONE Ceph RBD PVC. Losing that PVC means re-running the bootstrap
# (idempotent — just deletes/recreates the pod) — acceptable for a notification
# channel, not treated as DR-grade data.
#
# EXPOSURE: internal Alertmanager→ntfy traffic stays fully IN-CLUSTER
# (ntfy.monitoring.svc.cluster.local:8080, plain HTTP — same posture as the Loki
# datasource wiring) so alerting never depends on the Cloudflare tunnel being up.
# The Ingress below is a SEPARATE, additional path that exists ONLY so a phone off
# the home network can subscribe — same Traefik + wildcard-TLS pattern as
# Grafana/Harbor/Dex (id.capstone.uamishub.com precedent).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-config
  namespace: monitoring
  labels:
    platform.capstone/component: platform
data:
  server.yml: |
    base-url: "https://ntfy.capstone.uamishub.com"
    listen-http: ":8080"          # unprivileged port — container runs as non-root
    behind-proxy: true            # trust X-Forwarded-For from Traefik
    cache-file: "/var/lib/ntfy/cache.db"
    cache-duration: "12h"
    attachment-cache-dir: "/var/lib/ntfy/attachments"
    auth-file: "/var/lib/ntfy/auth.db"
    auth-default-access: "deny-all"   # private server — nothing anonymous
    # Named message templates (the `ntfy-templates` ConfigMap below). NOT ntfy's
    # default (/etc/ntfy/templates) — a sibling path, because /etc/ntfy is itself
    # a ConfigMap mount and nesting a volume inside a read-only tmpfs is fragile.
    # See the Deployment's `templates` volumeMount for the full reasoning. If this
    # path and that mountPath ever disagree, ntfy finds an empty template-dir and
    # SILENTLY falls back to its oversized built-in template — i.e. the 400s come
    # straight back. Keep them in sync.
    template-dir: "/etc/ntfy-templates"
    # ── Alert-storm headroom (FIX-7) ──────────────────────────────────
    # ntfy rate-limits per VISITOR at burst 60, replenishing 1 per 5s. Alertmanager
    # is ONE visitor (a single pod IP), so a storm — a node failing and firing
    # dozens of groups at once — can exhaust the burst and start collecting HTTP
    # 429s. Alertmanager DOES retry 429 (unlike the 400 that caused this task), so
    # this was never silent loss, but a storm is exactly when notifications must
    # not be delayed. Observed directly while validating the template fix: replaying
    # all 43 live alert groups back-to-back produced 26 × 429 once the burst ran out.
    # ⚠ SECURITY: this exempts from RATE LIMITING ONLY. It grants no access —
    # `auth-default-access: deny-all` above still applies, so publishing to
    # `platform-alerts` continues to require the platform-oncall credential.
    # Scoped to the in-cluster pod CIDR (Talos/Cilium 10.244.0.0/16, the same
    # constant used by platform-services/db-tier/netpol.yaml), NOT 0.0.0.0/0.
    visitor-request-limit-exempt-hosts: "10.244.0.0/16"
    # ── SQLite write contention (FIX-7 / BLOCK-2, secondary) ────────────────
    # ntfy defaults to SYNCHRONOUS cache writes (`cache-batch-size: 0`), which
    # under this platform's publish rate produced a recurring
    #   WARN Error sending delayed messages (error=database is locked, tag=publish)
    # roughly every 15s (the delayed-sender goroutine contending with the
    # message-cache writer). Values are upstream's own "Tuning for scale →
    # Message cache" recommendation (docs.ntfy.sh/config): batch the cache
    # writes and put SQLite in WAL mode so readers don't block the writer.
    #   busy_timeout 15000 — wait up to 15s for a lock instead of erroring out
    #                        immediately, which is what surfaced as "locked".
    # NOTE: this was NOT the cause of the 62% Alertmanager delivery failure —
    # that was the message-size 400 fixed by the template override below. This
    # block fixes the (separate, real) log-noise/contention issue.
    cache-batch-size: 25
    cache-batch-timeout: "1s"
    cache-startup-queries: |
      pragma journal_mode = WAL;
      pragma synchronous = normal;
      pragma temp_store = memory;
      pragma busy_timeout = 15000;
---
# ── THE alert-delivery fix (FIX-7 / BLOCK-2 root cause) ──────────────────────
# A named template file that OVERRIDES ntfy's BUILT-IN `alertmanager` template.
#
# WHAT WAS ACTUALLY BROKEN (this is NOT what the health audit guessed):
# Alertmanager's `platform-oncall` webhook was failing ~62% of notifications
# with an UNRECOVERABLE error — Alertmanager does not retry 4xx:
#   HTTP 400 {"code":40041,"error":"invalid request: message or title is too
#             large after replacing template"}
# ntfy's built-in `alertmanager` template renders EVERY alert in the group,
# including each one's full multi-sentence `description` annotation. Our
# Alertmanager groups by ['namespace','alertname'], so one webhook POST can
# carry 6-7 alerts; the rendered output then exceeds ntfy's 4096-byte
# message-size-limit and the whole notification is dropped. The audit's
# "SQLite database is locked" finding is a REAL but SEPARATE issue (fixed by
# the cache-batch/WAL settings above) — it is not on this failure path.
#
# WHY NOT JUST RAISE message-size-limit: ntfy's docs are explicit that sizes
# over 4K are "not recommended and remain largely untested", and that keeping
# 4K is CRITICAL when FCM/APNS are involved because those services impose
# similar limits and silently fail to deliver larger messages. The entire point
# of this channel is push-to-phone (which is FCM), so raising the limit would
# trade a visible 400 for an invisible non-delivery. Fix the payload instead.
#
# HOW THE OVERRIDE STAYS SMALL — three bounded reductions:
#   1. The summary is printed ONCE from `.commonAnnotations` (it is identical
#      across a group by construction), not once per alert.
#   2. At most 5 alerts are itemised, each as just its DISTINGUISHING labels
#      (`omit` drops the ones that are constant or pure plumbing), every value
#      truncated to 32 chars; the rest collapse to "… and N more".
#   3. `description` is printed once, truncated to 350 chars.
#
# VERIFIED BY EXECUTION, not by inspection (FIX-7 evidence bundle): ntfy
# v2.25.0 run locally against the reconstructed webhook payloads for ALL 43
# alert groups live on the cluster at the time of the fix —
#   built-in template: 4/43 groups rejected with the exact 40041 error above
#   this override:     0/43 rejected, max rendered size 1613 B of 4096 (2.5x
#                      headroom on the worst real group)
#
# ⚠ NO SealedSecret RESEAL NEEDED: ntfy resolves a file named `<name>.yml` in
# template-dir AHEAD of its built-in of the same name, so the existing
# `?template=alertmanager` query param already baked into the
# `alertmanager-webhook` SealedSecret URL keeps working untouched.
#
# ⚠ Priority mapping is deliberate: critical -> 5 (max/urgent, bypasses phone
# Do-Not-Disturb), other firing -> 4 (high), resolved -> 2 (low, so the
# all-clear does not buzz at 3am).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-templates
  namespace: monitoring
  labels:
    platform.capstone/component: platform
data:
  alertmanager.yml: |
    title: |
      {{- $t := add (len .alerts) (default 0 .truncatedAlerts) -}}
      {{- if eq .status "firing" }}🔴{{ else }}✅{{ end }} {{ .groupLabels.alertname | default "alert" }}
      {{- with .groupLabels.namespace }} [{{ . }}]{{ end }}
      {{- if gt $t 1 }} ×{{ $t }}{{ end }}
    message: |
      {{- $t := add (len .alerts) (default 0 .truncatedAlerts) -}}
      {{ .status | upper }}{{ if gt $t 1 }} — {{ $t }} alerts{{ end }}
      {{- with .commonLabels.severity }} · severity: {{ . }}{{ end }}

      {{ with .commonAnnotations.summary }}{{ . | trunc 200 }}{{ else }}{{ with (index .alerts 0).annotations.summary }}{{ . | trunc 200 }}{{ end }}{{ end }}
      {{- if gt $t 1 }}
      {{- range $i, $a := .alerts }}{{ if lt $i 5 }}
      • {{ range $k, $v := omit $a.labels "prometheus" "endpoint" "instance" "container" "service" "uid" "job" "replica" "cluster" "__name__" "exported_namespace" "dest_server" "autosync_enabled" }}
        {{- if ne (toString (index $.commonLabels $k)) (toString $v) }}{{ $k }}={{ $v | trunc 32 }} {{ end }}
      {{- end }}
      {{- end }}{{ end }}
      {{- if gt $t 5 }}
      … and {{ sub $t 5 }} more
      {{- end }}
      {{- end }}
      {{ with .commonAnnotations.description }}
      {{ . | trunc 350 }}
      {{- end }}
    priority: |
      {{ if eq .status "resolved" }}2{{ else if eq (.commonLabels.severity | default "warning") "critical" }}5{{ else }}4{{ end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-data
  namespace: monitoring
  labels:
    platform.capstone/component: platform
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: monitoring
  labels:
    platform.capstone/component: platform
    app.kubernetes.io/name: ntfy
spec:
  replicas: 1
  # Recreate — the single Ceph RBD PVC is ReadWriteOnce; a rolling update briefly
  # running old+new pod together would fail the new pod's mount.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy
        platform.capstone/component: platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Idempotent bootstrap: create the `platform-oncall` user and (re-)grant it
        # read-write on the `platform-alerts` topic (safe to repeat every restart).
        #
        # v2.25.0 CLI notes (verified against the real image — `ntfy user add --help`):
        #   - There is NO `--password-stdin` flag. The password is passed via the
        #     `NTFY_PASSWORD` env var (the only scripting-friendly option the CLI
        #     supports — `ntfy user add phil` / `NTFY_PASSWORD=... ntfy user add phil`).
        #   - `ntfy user add` takes `--ignore-exists`, which makes user creation
        #     itself idempotent natively (no more `user list | grep` pre-check needed).
        #   - Global flags like `--config` must come AFTER the subcommand noun and
        #     BEFORE the verb, i.e. `ntfy user --config <file> add ...`, not
        #     `ntfy user add --config <file> ...` (rejected: "flag provided but not
        #     defined: -config") and not `ntfy --config <file> user add ...` (same
        #     error — `--config` isn't a root-level flag, it's scoped to `user`/`access`).
        #   - CRITICAL: `ntfy user`/`ntfy access` refuse to run against a fresh
        #     `auth-file` that has never been created ("auth-file does not exist;
        #     please start the server at least once to create it") — verified live.
        #     On a brand-new PVC there is no auth.db yet, and an initContainer runs
        #     BEFORE the main `ntfy serve` container ever starts, so the very first
        #     deploy would otherwise crash-loop here even with correct CLI syntax.
        #     Fix: if auth.db is missing, this script starts `ntfy serve` itself in
        #     the background just long enough to let it create auth.db, runs the
        #     user/access provisioning against that same file, then stops it —
        #     the main container starts fresh afterwards and reuses the same PVC.
        - name: bootstrap
          image: binwiederhier/ntfy:v2.25.0   # pinned; match the main container below
          command: ["/bin/sh", "-ec"]
          args:
            - |
              CONF=/etc/ntfy/server.yml
              AUTHDB=/var/lib/ntfy/auth.db
              SERVER_PID=""
              if [ ! -f "$AUTHDB" ]; then
                echo "[ntfy-bootstrap] auth.db missing (first deploy) — starting temp server to initialize it"
                ntfy serve --config "$CONF" &
                SERVER_PID=$!
                i=0
                while [ ! -f "$AUTHDB" ] && [ "$i" -lt 30 ]; do
                  sleep 0.5
                  i=$((i + 1))
                done
                if [ ! -f "$AUTHDB" ]; then
                  echo "[ntfy-bootstrap] ERROR: auth.db still missing after 15s wait"
                  exit 1
                fi
              fi
              ntfy user --config "$CONF" add --role=user --ignore-exists platform-oncall
              echo "[ntfy-bootstrap] platform-oncall user present"
              ntfy access --config "$CONF" platform-oncall platform-alerts rw
              echo "[ntfy-bootstrap] platform-oncall has rw on platform-alerts"
              if [ -n "$SERVER_PID" ]; then
                kill "$SERVER_PID" 2>/dev/null || true
                wait "$SERVER_PID" 2>/dev/null || true
              fi
          env:
            - name: NTFY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ntfy-platform-oncall-credentials
                  key: password
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/ntfy
            - name: config
              mountPath: /etc/ntfy
              readOnly: true
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.25.0   # pinned; bump deliberately
          command: ["ntfy", "serve", "--config", "/etc/ntfy/server.yml"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/ntfy
            - name: config
              mountPath: /etc/ntfy
              readOnly: true
            # Named templates (ntfy-templates ConfigMap) — see `template-dir` in
            # the ntfy-config ConfigMap.
            # ⚠ MOUNTED AT ITS OWN TOP-LEVEL PATH, deliberately NOT at ntfy's
            # default /etc/ntfy/templates: /etc/ntfy is already a ConfigMap
            # volume (read-only tmpfs), and nesting a second volume inside one is
            # fragile — the kubelet has to create the `templates/` mountpoint
            # inside a read-only filesystem. A sibling path avoids the question
            # entirely, and template-dir is configurable precisely so it can.
            - name: templates
              mountPath: /etc/ntfy-templates
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ntfy-data
        - name: config
          configMap:
            name: ntfy-config
        - name: templates
          configMap:
            name: ntfy-templates
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: monitoring
  labels:
    platform.capstone/component: platform
    app.kubernetes.io/name: ntfy
spec:
  selector:
    app.kubernetes.io/name: ntfy
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Public path for phone subscription ONLY (see file header — Alertmanager itself
# never uses this, it talks to the ClusterIP Service directly). Matches the
# dex/grafana/harbor Ingress convention exactly: plain Ingress, TLS host listed but
# NO secretName — Traefik's default TLSStore serves the cert-manager wildcard cert
# for *.capstone.uamishub.com. No Cloudflare-side change needed (the tunnel already
# routes the whole wildcard to Traefik, platform-services/cloudflared/deployment.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ntfy
  namespace: monitoring
  labels:
    platform.capstone/component: platform
    app.kubernetes.io/name: ntfy
spec:
  rules:
    - host: ntfy.capstone.uamishub.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ntfy
                port:
                  number: 8080
  tls:
    - hosts:
        - ntfy.capstone.uamishub.com
---
# REAL seal (not a placeholder) — generated in this PR. Same username/password used
# by both the initContainer bootstrap above and the resealed `alertmanager-webhook`
# SealedSecret (kube-prometheus-stack-app.yaml). Rotate ALL THREE together (this
# file's bootstrap re-grants access idempotently on the next pod restart, but the
# alertmanager-webhook secret needs a matching manual reseal — see README).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ntfy-platform-oncall-credentials
  namespace: monitoring
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: ntfy-platform-oncall-credentials
      namespace: monitoring
