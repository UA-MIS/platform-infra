---
# Alertmanager notification destination (retro #3 — close the "alerts fire into the
# void" gap left by PR #127's empty `platform-oncall` receiver). Holds ONE key, `url`,
# the generic-webhook endpoint Alertmanager POSTs firing/resolved alerts to.
#
# Mounted into the Alertmanager pods at /etc/alertmanager/secrets/alertmanager-webhook/
# via `alertmanager.alertmanagerSpec.secrets: [alertmanager-webhook]` in
# applicationsets/kube-prometheus-stack-app.yaml; the `platform-oncall` receiver reads
# it with `webhook_configs[].url_file` so the URL is NEVER inlined in the Helm values.
#
# ⚠ PLACEHOLDER CIPHERTEXT — this will NOT decrypt. The sealed-secrets controller will
# leave no `alertmanager-webhook` Secret, so Alertmanager mounts nothing and the
# receiver stays effectively silent until a human RESEALS a real URL. Reseal runbook:
# platform-services/monitoring/README.md "Wiring a notification channel". This must be
# done before this change is relied on in production (does NOT block the sync/deploy —
# the stack stays up, alerts just aren't pushed yet, same posture as before).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: alertmanager-webhook
  namespace: monitoring
spec:
  encryptedData:
    # PLACEHOLDER — reseal with a real webhook URL (see README). Fails to decrypt by design.
    url: PLACEHOLDER_RESEAL_BEFORE_USE_AgABReplaceThisWithARealSealedValueViaKubeseal==
  template:
    metadata:
      name: alertmanager-webhook
      namespace: monitoring
    type: Opaque
