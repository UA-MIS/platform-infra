# Admin dashboard (Observability admin dashboards, Grafana SSO + dashboard fleet
# PR). MariaDB/Galera (3-node multi-master, `capstone-mariadb` in db-tier)
# cluster size, readiness, connections, query rate, and flow-control back-
# pressure.
#
# Becomes real once THIS SAME PR's applicationsets/mariadb-cluster-app.yaml
# change (`mariadb.metrics.enabled: true`) syncs — the mariadb-operator deploys
# the mysqld_exporter sidecar + creates the ServiceMonitor itself (confirmed
# live via `kubectl explain mariadb.spec.metrics`, 2026-07-08). ArgoCD-managed,
# self-heals — no human step required.
#
# Standard mysqld_exporter metric names.
#
# Auto-provisioned by the Grafana sidecar via the `grafana_dashboard: "1"` label,
# filed into the "Platform / Infra" folder via the `grafana_folder` annotation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-mariadb-galera
  namespace: monitoring
  labels:
    platform.capstone/component: platform
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Platform / Infra"
data:
  mariadb-galera.json: |
    {
      "uid": "platform-mariadb-galera",
      "title": "Platform / Infra — MariaDB / Galera",
      "description": "Real once mariadb-cluster-app.yaml's mariadb.metrics.enabled syncs (ArgoCD-managed, self-heals — no human step).",
      "tags": ["platform", "admin", "database"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": { "from": "now-6h", "to": "now" },
      "refresh": "1m",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          }
        ]
      },
      "panels": [
        { "id": 1, "type": "row", "title": "Cluster health", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 } },
        {
          "id": 2, "type": "stat", "title": "Instances Up",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "orange", "value": 1 }, { "color": "green", "value": 3 } ] } }, "overrides": [] },
          "targets": [ { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "sum(mysql_up)", "instant": true, "refId": "A" } ]
        },
        {
          "id": 3, "type": "stat", "title": "Galera Cluster Size (expect 3)",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "orange", "value": 2 }, { "color": "green", "value": 3 } ] } }, "overrides": [] },
          "targets": [ { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "max(mysql_global_status_wsrep_cluster_size)", "instant": true, "refId": "A" } ]
        },
        {
          "id": 4, "type": "stat", "title": "Nodes Ready (wsrep_ready)",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "short", "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "orange", "value": 1 }, { "color": "green", "value": 3 } ] } }, "overrides": [] },
          "targets": [ { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "sum(mysql_global_status_wsrep_ready)", "instant": true, "refId": "A" } ]
        },
        {
          "id": 5, "type": "timeseries", "title": "Flow Control Paused Fraction (back-pressure — should stay near 0)",
          "description": "wsrep_flow_control_paused is a 0-1 fraction of time this node paused writes for flow control. Sustained non-zero values indicate a slow node throttling the whole cluster.",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1, "min": 0 }, "overrides": [] },
          "targets": [ { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "mysql_global_status_wsrep_flow_control_paused", "legendFormat": "{{pod}}", "refId": "A" } ]
        },
        { "id": 6, "type": "row", "title": "Connections + queries", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 7 } },
        {
          "id": 7, "type": "timeseries", "title": "Connected Threads",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [ { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "mysql_global_status_threads_connected", "legendFormat": "{{pod}}", "refId": "A" } ]
        },
        {
          "id": 8, "type": "timeseries", "title": "Queries/sec",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [ { "datasource": { "type": "prometheus", "uid": "${datasource}" }, "expr": "sum(rate(mysql_global_status_queries[5m]))", "legendFormat": "queries/s", "refId": "A" } ]
        },
        {
          "id": 9, "type": "table", "title": "wsrep Local State (per node, raw label value)",
          "description": "Uncertain exact exposition form for this label-valued gauge (mysqld_exporter typically exposes wsrep_local_state_comment as a labeled gauge, e.g. mysql_global_status_wsrep_local_state_comment{wsrep_local_state_comment=\"Synced\"} == 1) — shown as a raw table rather than a computed panel so it degrades gracefully (empty table, not a broken query) if the exact label name differs on this exporter version. Expected healthy value: \"Synced\".",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "mysql_global_status_wsrep_local_state_comment",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ]
        }
      ]
    }
