# Tempo — distributed tracing backend (Observability follow-up). Raw manifests, NOT
# the `grafana/tempo` Helm chart: that chart (the single-binary "monolithic mode"
# packaging, the only one with Loki-style simplicity) is marked `deprecated: true`
# upstream (confirmed via `helm show chart grafana/tempo --version 1.24.4`) in favor
# of `tempo-distributed`, which has NO equivalent single-process mode — only the full
# microservices split (distributor/ingester/querier/compactor/memcached...), which is
# the wrong altitude for this platform's trace volume. Rather than depend on a
# deprecated chart, this ships the single-binary config directly as a StatefulSet —
# same "raw manifests for a small, well-understood component" call as thanos.yaml /
# ntfy.yaml in this same directory. The config below matches upstream single-binary
# Tempo's own shape (verified against `helm template grafana/tempo`), just trimmed to
# OTLP-only receivers and un-ballasted for this platform's small resource footprint.
#
# SCOPE (anti-gold-plate, same posture as Loki's single-binary choice): ONE process,
# local filesystem storage on a Ceph RBD PVC — NOT the distributed/microservices
# split, NO S3/GCS trace backend, NO memcached caches. `retention: 24h` — short on
# purpose; traces are bursty and much larger per-event than metrics, and the real
# RAM control for tracing is upstream in the OTel Collector's low sampling rate
# (see otel-collector's ConfigMap comment below) — Tempo just stores whatever
# fraction of traces survives sampling, for a day. A long-term trace store (Tempo
# does support its own S3/GCS backend — the same dr-backup MinIO bucket could serve
# it) is a possible future add, deliberately left as a follow-up, not built here.
#
# Ingest path: OTLP ONLY (grpc :4317 / http :4318) from the OTel Collector
# (otel-collector.yaml, below) — the Collector is the one thing instrumented apps
# talk to; nothing talks to Tempo directly.
#
# Grafana wiring: the `Tempo` entry in `additionalDataSources`
# (applicationsets/kube-prometheus-stack-app.yaml), http://tempo.monitoring.svc.cluster.local:3200.
#
# Metrics-generator: the `metrics_generator` block below enables the `local-blocks`
# processor so Grafana's Traces Drilldown span-rate / RED panels (TraceQL `rate()`,
# `histogram_over_time()`) work — without this the querier returns 500 "empty ring".
# It is self-contained (no Prometheus remote-write); see that block's comment for the
# root cause and why span-metrics/service-graphs are a deliberate follow-up.
#
# Image: docker.io/grafana/tempo:2.9.0, pinned (same appVersion the now-deprecated
# chart would have installed at 1.24.4) — bump deliberately.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: monitoring
  labels:
    platform.capstone/component: platform
data:
  tempo.yaml: |
    multitenancy_enabled: false
    usage_report:
      reporting_enabled: false
    compactor:
      compaction:
        block_retention: 24h
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    ingester: {}
    server:
      http_listen_port: 3200
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
    querier: {}
    query_frontend: {}
    # ── Metrics-generator: TraceQL metrics (`rate()`, `histogram_over_time()`,
    # `quantile_over_time()` …) that back Grafana's Traces Drilldown span-rate / RED
    # panels. ROOT CAUSE of the prior 500 ("error querying generators in
    # Querier.queryRangeRecent: … error finding generators: empty ring"): there was
    # NO `metrics_generator` block AND `overrides.defaults` was empty, so no
    # processor was ever enabled for the (single, default) tenant → the
    # metrics-generator module (which IS part of the single-binary `all` target in
    # Tempo 2.9 — verified against cmd/tempo/app/modules.go@v2.9.0) never activated,
    # never registered in its ring → the querier found an empty generator ring.
    #
    # SCOPE (matches this platform's "NO Prometheus remote-write" posture, header of
    # applicationsets/kube-prometheus-stack-app.yaml — and that Prometheus is already
    # ~96% of its memory limit): enable ONLY the `local-blocks` processor.
    # `local-blocks` answers TraceQL metrics straight from the generator's own
    # recent-trace store; it needs NO remote_write into Prometheus. `span-metrics` /
    # `service-graphs` (which DO remote_write high-cardinality series to Prometheus,
    # would need `enableRemoteWriteReceiver: true` on that Prometheus AND a
    # cardinality budget) are a deliberate follow-up — NOT enabled here.
    metrics_generator:
      # Ring: kvstore defaults to `memberlist`, exactly like the ingester ring
      # above. In single-binary this self-registers a ring-of-one over the same
      # memberlist cluster the ingester already forms (proven live: ingester ring
      # ACTIVE, member tempo-0 on :7946) — so NO explicit ring config is needed.
      processor:
        local_blocks:
          # Keep ALL spans (not just server spans) so arbitrary TraceQL metrics —
          # including the Drilldown's `{nestedSetParent<0 …} | rate() by(...)` —
          # have complete data. Default `true` would drop client/internal spans.
          filter_server_spans: false
          # Flush completed local blocks to `traces_storage` so the query-frontend
          # serves TraceQL metrics over the whole retention window, not just the
          # in-memory recent slice.
          flush_to_storage: true
      # local-blocks trace store — on the writable Ceph RBD PVC (/var/tempo, the
      # only writable path under readOnlyRootFilesystem: true).
      traces_storage:
        path: /var/tempo/generator/traces
      # Prometheus-registry WAL path (present so the generator initialises cleanly).
      # remote_write is intentionally EMPTY: local-blocks does not use it, and
      # span-metrics/service-graphs (the only processors that would) are not enabled.
      storage:
        path: /var/tempo/generator/wal
        remote_write: []
    overrides:
      defaults:
        # THIS is the line whose absence produced the empty ring: turn the
        # local-blocks processor ON for the default tenant.
        metrics_generator:
          processors:
            - local-blocks
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo
  namespace: monitoring
  labels:
    platform.capstone/component: platform
    app.kubernetes.io/name: tempo
spec:
  replicas: 1
  serviceName: tempo
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo
        platform.capstone/component: platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tempo
          image: docker.io/grafana/tempo:2.9.0   # pinned; bump deliberately
          args:
            - -config.file=/conf/tempo.yaml
            # NO -mem-ballast-size-mbs: the chart default (1024MB, a permanent GC
            # pre-allocation) would alone exceed this Deployment's whole memory
            # limit below — irrelevant at this platform's trace volume.
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          resources:
            # Memory bumped 512Mi → 768Mi: enabling the local-blocks processor
            # makes the metrics-generator module retain recent traces in memory (+
            # a Prometheus registry) in-process, on top of ingest. Low trace volume
            # here keeps this modest; raise `limits.memory` (and, if needed, add
            # `metrics_generator.processor.local_blocks.max_live_traces`) if the pod
            # OOMs under heavier trace load.
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /conf
            - name: storage
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: tempo-config
  volumeClaimTemplates:
    - metadata:
        name: storage
        labels:
          platform.capstone/component: platform
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-block   # replica-3 Ceph RBD (survives node loss)
        resources:
          requests:
            # PVC LIVE-RESIZED 2026-08-19 (KubePersistentVolumeFillingUp alert, firing since
            # 2026-08-18T04:58Z, "6.018% available, ~4 days to full"): storage-tempo-0 was
            # patched live from 5Gi -> 20Gi (`kubectl patch pvc storage-tempo-0 -n monitoring`),
            # then `kubectl rollout restart statefulset/tempo` to complete the node-side
            # filesystem resize (ceph-block has allowVolumeExpansion:true, confirmed before
            # attempting). Live result: /var/tempo went from 94% used (293Mi free) to 23% used
            # (15.0Gi free). This field intentionally stays at the ORIGINAL provisioning size
            # (5Gi) and is NOT bumped to match: Kubernetes forbids updating a StatefulSet's
            # `volumeClaimTemplates` after creation (only replicas/ordinals/template/
            # updateStrategy/persistentVolumeClaimRetentionPolicy/minReadySeconds are mutable) —
            # ArgoCD applying a git-side bump here would hard-fail every sync, which is worse
            # than the drift it's meant to fix. PVC resizing is decoupled from this template by
            # design (K8s never re-reconciles an existing PVC's size against it), so this is
            # NOT tracked/diffed by ArgoCD (the PVC itself has no standalone manifest) and
            # introduces zero OutOfSync risk. Any FUTURE replica (or full StatefulSet
            # recreation) would provision fresh at this 5Gi baseline and need the same manual
            # bump repeated — flagged here rather than silently relying on tribal knowledge.
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: monitoring
  labels:
    platform.capstone/component: platform
    app.kubernetes.io/name: tempo
spec:
  selector:
    app.kubernetes.io/name: tempo
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
# Scrape Tempo's own /metrics — same "scrape everything" ethos as servicemonitors.yaml.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tempo
  namespace: monitoring
  annotations:
    # Sync-deadlock fix (#127) precedent — see servicemonitors.yaml.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
  labels:
    platform.capstone/component: platform
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: ["monitoring"]
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  endpoints:
    - port: http
      interval: 60s
