            "defaults": {
              "unit": "percent",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(sum(rate(traefik_service_requests_total{exported_service=~\"$namespace-crimson-copies-.*\", code=~\"5..\"}[5m])) or vector(0)) / (sum(rate(traefik_service_requests_total{exported_service=~\"$namespace-crimson-copies-.*\"}[5m])) > 0) * 100",
              "refId": "A",
              "instant": true
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Response Time (p95)",
          "description": "95% of requests finish faster than this. The slow tail is what users actually complain about, which is why this is p95 and not an average.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{exported_service=~\"$namespace-crimson-copies-.*\"}[5m])))",
              "refId": "A",
              "instant": true
            }
          ]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Files Uploaded",
          "description": "Artwork files customers successfully uploaded over SFTP in the selected range. NOTE: web-dropzone uploads are not counted here -- that code path has no metric yet (see the note at the bottom of this dashboard).",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  },
                  {
                    "color": "purple",
                    "value": 1
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(increase(sftp_uploads_total{namespace=\"$namespace\", result=\"success\"}[$__range])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ]
        },
        {
          "id": 8,
          "type": "row",
          "title": "Customer traffic -- what visitors see",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Requests per minute, by site",
          "description": "Traffic split between your storefront (customers) and staff console (your team). Measured at the ingress, so this is real outside traffic.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true,
                "gradientMode": "opacity",
                "pointSize": 5,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisPlacement": "auto",
                "axisLabel": ""
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "label_replace(sum by (exported_service) (rate(traefik_service_requests_total{exported_service=~\"$namespace-crimson-copies-.*\"}[5m])) * 60, \"site\", \"$1\", \"exported_service\", \".*crimson-copies-(storefront|staff-console|file-service)-http@kubernetes\")",
              "refId": "A",
              "legendFormat": "{{site}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Response time",
          "description": "How long requests take. p50 is the typical experience; p95/p99 are the slow tail. A widening gap between p50 and p99 usually means something is intermittently slow, not uniformly slow.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": true,
                "gradientMode": "opacity",
                "pointSize": 5,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisPlacement": "auto",
                "axisLabel": ""
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{exported_service=~\"$namespace-crimson-copies-.*\"}[5m])))",
              "refId": "A",
              "legendFormat": "p50 (typical)"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{exported_service=~\"$namespace-crimson-copies-.*\"}[5m])))",
              "refId": "B",
              "legendFormat": "p95 (slow tail)"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{exported_service=~\"$namespace-crimson-copies-.*\"}[5m])))",
              "refId": "C",
              "legendFormat": "p99 (worst)"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Responses by status code",
          "description": "2xx = success, 3xx = redirect (sign-in bounces show up here), 4xx = the client asked for something wrong, 5xx = your app broke. Stacked, so the total height is your overall request rate.",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 15
          },
