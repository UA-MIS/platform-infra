# Crimson Copies -- the team-facing app dashboard (the "my app's numbers" view).
#
# WHY A DEDICATED DASHBOARD: the existing fleet answers platform questions --
# "Platform / Tenants -- App Golden Signals" shows Traefik traffic/errors/latency
# for ANY namespace, and "Tenant Logs" shows log lines. Both are correct and both
# are the wrong altitude for a student team, which wants to see ORDERS and
# QUOTES, not `traefik_service_requests_total`. This dashboard is the app-level
# view: the same ingress signals on top (they need them), plus the app's own
# business + per-route metrics underneath.
#
# TWO METRIC SOURCES, deliberately:
#   1. Traefik (`traefik_service_*`) -- already scraped, works with zero app
#      instrumentation. NOTE the label is `exported_service`, NOT `service`:
#      Prometheus renames Traefik's own `service` label on collision with the
#      target's k8s Service label. Filtering on `service` here would silently
#      match the Traefik Service itself and show the wrong numbers.
#   2. The app's own /metrics (`http_requests_total`, `sftp_uploads_total`, ...)
#      -- scraped via the ServiceMonitor the app repo now ships in
#      .devops/chart/base/servicemonitor.yaml. That requires BOTH the
#      `monitoring.coreos.com/ServiceMonitor` whitelist entry AND the `monitoring`
#      ingress netpol rule added in this same PR; without them these panels read
#      "No data" while the Traefik panels above keep working.
#
# BUSINESS PANELS ARE DERIVED, NOT BESPOKE: the app registers no order/revenue
# counters (D-155 left instrumentation out of scope). What it does have is
# route-labelled request counters, so "orders placed" is a successful POST to the
# checkout route and "quotes" is a successful POST /api/quote. That is real
# measured traffic, not an estimate -- but it does mean REVENUE is not available
# at any price, because no metric carries order value. The "About this dashboard"
# text panel states that gap on the dashboard itself rather than quietly shipping
# an empty panel; see it for the exact instrumentation seam that would close it.
#
# Auto-provisioned by the Grafana sidecar via the `grafana_dashboard: "1"` label,
# filed into its own folder via the `grafana_folder` annotation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-crimson-copies-app
  namespace: monitoring
  labels:
    platform.capstone/component: platform
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Crimson Copies"
data:
  crimson-copies-app.json: |
    {
      "uid": "crimson-copies-your-app",
      "title": "Crimson Copies -- Your App",
      "description": "The team-facing view of Crimson Copies: customer traffic from Traefik, plus the app's own business and per-route metrics. Switch environments with the `namespace` selector.",
      "tags": [
        "crimson-copies",
        "tenants",
        "app"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "1m",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "label": "Data source"
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "label": "Environment",
            "description": "Which environment to show: dev, staging or prod.",
            "query": {
              "query": "label_values(kube_pod_info{namespace=~\"crimson-copies-(dev|staging|prod)\"}, namespace)",
              "refId": "namespace"
            },
            "refresh": 2,
            "multi": false,
            "includeAll": false,
            "current": {
              "text": "crimson-copies-prod",
              "value": "crimson-copies-prod"
            },
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Right now",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Orders Placed",
          "description": "Completed orders in the selected time range. Counts cart checkouts (POST /api/orders/:id/checkout) plus legacy one-shot orders (POST /api/orders). Carts that were started but never checked out are NOT counted.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(increase(http_requests_total{namespace=\"$namespace\", job=~\".*orders-api.*\", method=\"POST\", route=~\"/api/orders|/api/orders/:id/checkout\", status_code=~\"200|201\"}[$__range])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Quotes Configured",
          "description": "Successful price quotes from the /pricing configurator (POST /api/quote). Every time a customer changes quantity, paper or turnaround, that is one quote.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  },
                  {
                    "color": "blue",
                    "value": 1
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(increase(http_requests_total{namespace=\"$namespace\", job=~\".*orders-api.*\", method=\"POST\", route=\"/api/quote\", status_code=\"200\"}[$__range])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Visitors / min",
          "description": "Requests per minute arriving at your app through the ingress, averaged over the last 5 minutes. This is every page load and asset request your visitors make.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.1
                  }
                ]
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(traefik_service_requests_total{exported_service=~\"$namespace-crimson-copies-.*\"}[5m])) * 60 or vector(0)",
              "refId": "A",
              "instant": true
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Error Rate",
          "description": "Share of requests failing with a 5xx server error over the last 5 minutes. Anything sustained above 1% deserves a look at the logs.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
