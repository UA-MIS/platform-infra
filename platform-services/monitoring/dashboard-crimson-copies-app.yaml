          },
          "options": {
            "mode": "markdown",
            "content": "### What these numbers come from\n\n**Customer traffic** panels are measured by **Traefik**, the platform's ingress -- they count every request that reaches your app from outside, and they work whether or not your app is instrumented.\n\n**Business** and **API** panels come from your app's own `/metrics` endpoint (`prom-client`), scraped from `orders-api`, `notify` and `file-service`. They are derived from **route-labelled request counters** -- an order is a successful `POST` to the checkout route, a quote is a successful `POST /api/quote`.\n\n**Not measured yet** -- honest gaps, not broken panels:\n\n- **Revenue.** No metric carries order value. The app knows `order.totalCents` at checkout but only writes it to a log line, never to a counter. Adding a `Counter`/`Histogram` at that seam (`apps/orders-api/src/routes/orders.ts`, the `order checked out` log) is the single change that would unlock a revenue panel.\n- **Orders broken down by status.** Status *changes* are counted (above), but nothing exports the current number of orders sitting in each status -- that needs a `Gauge` fed from a database query.\n- **Web-dropzone uploads.** `sftp_uploads_total` covers the SFTP path only; the browser upload route is uninstrumented.\n\nEverything shown above is real measured traffic. Nothing on this dashboard is simulated or estimated."
          }
