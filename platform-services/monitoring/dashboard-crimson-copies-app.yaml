                "gradientMode": "opacity",
                "pointSize": 5,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "axisPlacement": "auto",
                "axisLabel": ""
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (code) (rate(traefik_service_requests_total{exported_service=~\"$namespace-crimson-copies-.*\"}[5m])) * 60",
              "refId": "A",
