# Observability platform-service (retro #3) — the `monitoring` namespace + the
# platform alert rules + the cross-component scrape configs. The actual stacks
# (kube-prometheus-stack, Loki, Alloy) are SEPARATE Helm-source Applications
# (applicationsets/{kube-prometheus-stack,loki,alloy}-app.yaml, deploy method A) — the
# same split as harbor/vault/external-secrets (the dir ships the ns + CRs, the chart
# is its own app), so they do NOT render through this dir.
#
# Generated as `platform-svc-monitoring` by the platform-services-appset (git
# directory generator over platform-services/*).
#
# ⚠ ORDERING (sync-deadlock fix #127): alerts.yaml (PrometheusRule) +
# servicemonitors.yaml (ServiceMonitor / PodMonitor) are instances of CRDs installed
# by platform-kube-prometheus-stack. On a fresh cluster those CRDs may not exist when
# this app first syncs — WITHOUT mitigation ArgoCD's dry-run rejects the whole sync
# ("one or more synchronization tasks are not valid") and, combined with the stack
# previously waiting on this app to create the ns, neither could go first (deadlock).
# Each CR now carries `argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true`
# (skip the dry-run on the missing type) + sync-wave "1" (after the Namespace);
# ArgoCD's retry/selfHeal then applies them once the CRDs register.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ⚠ THIS IS AN EXPLICIT RESOURCE LIST, NOT A DIRECTORY GLOB.
# A .yaml file dropped into this directory and NOT listed below is silently
# ignored: ArgoCD reports the Application `Synced` and `successfully synced (all
# tasks run)`, because from its point of view there is nothing to apply. There is
# no error anywhere -- the object simply never exists.
# (Cost real time twice now: once on the deploy-contract change #481->#483, and
# again adding dashboard-ida-llm-app.yaml + alerts-ida-llm.yaml, which sat on
# main for half an hour looking deployed.)
# ADD THE FILE HERE IN THE SAME COMMIT THAT CREATES IT.
resources:
  - namespace.yaml
  - alerts.yaml
  - servicemonitors.yaml
  # FIX-4: Crossplane MR-stuck alerting. Own PrometheusRule file (not folded into
  # alerts.yaml) to avoid a merge conflict with FIX-7, which owns that file.
  - alerts-crossplane-vault.yaml
  # DEV-2 (PR #481): Crossplane RobotAccount async-race alert (Ready-stuck rule,
  # keys off Synced=True/Ready-absent-or-False — the false-success shape FIX-4's
  # CrossplaneManagedResourceNotSynced is structurally blind to). Own PrometheusRule
  # file, same reasoning as alerts-crossplane-vault.yaml above. Registration here was
  # missed by the original PR (only added the file, not this reference) — this app's
  # `resources:` list is explicit, not globbed, so the rule never rendered/deployed
  # despite the PR merging clean; caught during live post-merge verification.
  - alerts-crossplane-robot-race.yaml
  - alerts-ida-llm.yaml
  # FIX-4: dedicated kube-state-metrics (CustomResourceState) exporting series for
  # the 11 Crossplane MR kinds the Composition creates — the metrics source
  # alerts-crossplane-vault.yaml's CrossplaneManagedResourceNotSynced/
  # CrossplaneMRMetricsDown rules depend on.
  - crossplane-mr-metrics.yaml
  # SealedSecrets consumed by the kube-prometheus-stack Helm app (separate
  # Application) — they live here because this app owns the `monitoring` ns and its
  # non-chart CRs. alertmanager-webhook → the notification destination (now a REAL
  # seal pointed at ntfy.yaml below, no longer a placeholder — see README);
  # grafana-admin → the rotated Grafana admin creds — a REAL seal, verified
  # live 2026-08-15 (see README "Access"); grafana-oauth → the Dex
  # `grafana` staticClient secret (Observability SSO) — also a REAL seal, no
  # reseal needed before go-live (see README "Grafana SSO (Dex)").
  - sealedsecret-alertmanager-webhook.yaml
  - sealedsecret-grafana-admin.yaml
  - sealedsecret-grafana-oauth.yaml
  # Grafana's CNPG database credential (SQLite -> Postgres backend migration).
  # ExternalSecret (not a seal — the value lives in Vault at
  # platform/db/cnpg/grafana, same as its db-tier sibling). Consumed by
  # `grafana.envValueFrom.GF_DATABASE_PASSWORD` in the SEPARATE
  # kube-prometheus-stack Helm Application, same cross-app pattern as the three
  # seals above. ⚠ This `resources:` list is EXPLICIT, not globbed — see the
  # alerts-crossplane-robot-race.yaml note above for the incident where adding a
  # file WITHOUT registering it here rendered nothing while the PR merged clean.
  - externalsecret-cnpg-db.yaml
  # Tracing: Tempo (raw manifests — the single-binary Helm chart is upstream
  # `deprecated: true`, see the file header) + the OTel Collector Helm Application's
  # matching ConfigMap comment (applicationsets/otel-collector-app.yaml).
  - tempo.yaml
  # Thanos long-term metrics (Query/Store-Gateway/Compactor + the objstore
  # SealedSecret the Prometheus sidecar also reads) — see the file header for the
  # hard dependency on platform-minio's `dr-backup` bucket.
  - thanos.yaml
  # ntfy — the real Alertmanager notification destination (self-hosted push,
  # replaces the example.com placeholder). See the file header for the auth model
  # + phone-subscription path.
  - ntfy.yaml
  # Observability dashboards (dashboards-as-code) — the Grafana fleet. Each
  # ConfigMap carries `grafana_dashboard: "1"` (the sidecar's selector label) and
  # a `grafana_folder` ANNOTATION (folder placement — `sidecar.dashboards.
  # folderAnnotation` in kube-prometheus-stack-app.yaml); the Grafana chart's
  # default k8s-sidecar watches for the label and auto-provisions the JSON
  # payload into that folder — no manual Grafana import step, no dependency on
  # the datasource's generated UID (each dashboard's `datasource` template
  # variable resolves it at load time). See README "Dashboard fleet" for the
  # full folder/dashboard table and the metrics-not-yet-scraped follow-ups.
  #
  # --- Platform / Infra (admin-facing, cross-tenant) ---
  - dashboard-cluster-overview.yaml
  - dashboard-platform-health.yaml
  - dashboard-argocd.yaml
  - dashboard-coredns.yaml
  - dashboard-cert-manager.yaml
  - dashboard-ceph-rook.yaml
  - dashboard-eso.yaml
  - dashboard-cnpg-postgres.yaml
  - dashboard-mariadb-galera.yaml
  - dashboard-loki-logs-overview.yaml
  - dashboard-traefik-ingress.yaml
  - dashboard-network-traffic-by-namespace.yaml
  # Cost allocation (OpenCost, applicationsets/opencost-app.yaml): per-namespace
  # $/hr and est. monthly cost derived from OpenCost's owned-hardware custom
  # pricing. See README "Cost allocation (OpenCost)" for the pricing derivation.
  - dashboard-cost-allocation.yaml
  # --- Platform / Tenants (per-app, `namespace`-templated — the "team logs in,
  #     sees their app cleanly" default view, PART B) ---
  - dashboard-tenant-quota.yaml
  - dashboard-tenant-cicd.yaml
  - dashboard-tenant-golden-signals.yaml
  - dashboard-tenant-logs.yaml
  # --- Reference app (Crimson Copies) ------------------------------------------
  # The app-level "my app's numbers" view: the same Traefik signals the golden-
  # signals dashboard shows, PLUS this app's own business + per-route metrics
  # (scraped via the ServiceMonitor the app repo ships). Filed into its own
  # "Crimson Copies" Grafana folder rather than "Platform / Tenants" -- it is
  # tenant-SPECIFIC, not a namespace-templated view that works for any team.
  - dashboard-crimson-copies-app.yaml
  - dashboard-ida-llm-app.yaml
  # "Tenant / App Observability" (DASH-1) — the capstone-team-facing "my app
  # broke, where do I look" dashboard: Traefik RED metrics (exported_service
  # label, NOT the always-"traefik-metrics" service label the Golden Signals
  # dashboard above uses), live + errors-only Loki logs, pod health, and
  # shared-backend-DB health, all scoped by the $namespace picker.
  - dashboard-tenant-app-observability.yaml

labels:
  - pairs:
      platform.capstone/component: platform
    includeSelectors: false

# UA-MIS UI theme (THEME, matching the ArgoCD pattern in
# platform-services/argocd-config/kustomization.yaml): the favicon + apple-touch-icon
# PNGs (generated from the committed .svg sources in grafana-theme/) are packed into a
# ConfigMap here, in the SAME namespace (monitoring) the separate
# platform-kube-prometheus-stack Helm Application (applicationsets/kube-prometheus-
# stack-app.yaml) deploys Grafana into. That Application's `grafana.extraConfigmapMounts`
# value references this ConfigMap BY NAME to overlay Grafana's default fav32.png /
# apple-touch-icon.png (see that file for the exact mount paths + the Grafana-source
# citation for those paths). A STABLE name (disableNameSuffixHash) is required because
# the Helm values' extraConfigmapMounts reference is a fixed string, same reasoning as
# argocd-ui-theme-cm.
configMapGenerator:
  - name: grafana-ua-mis-theme-cm
    namespace: monitoring
    files:
      - grafana-theme/fav32.png
      - grafana-theme/apple-touch-icon.png
generatorOptions:
  disableNameSuffixHash: true
