# Platform failure-mode alerts (Observability, retro #3 — "no alert even on 'Vault
# sealed'"). Six PrometheusRule groups on failure modes this platform has ACTUALLY
# hit. Prometheus (platform-kube-prometheus-stack) discovers this rule cluster-wide
# because the chart sets ruleSelectorNilUsesHelmValues:false; the `release` label is
# belt-and-suspenders. Critical|warning alerts route to the `platform-oncall`
# Alertmanager receiver (see the chart values + monitoring/README.md).
#
# Where each signal comes from:
#   (a,d,f) kube-state-metrics — SHIPS WITH the stack, so these work day-one, no
#           per-component wiring.
#   (b)     External Secrets Operator /metrics — scraped via the PodMonitor in
#           servicemonitors.yaml.
#   (c)     ArgoCD application-controller /metrics — scraped via the ServiceMonitor.
#   (e)     cert-manager controller /metrics — scraped via the ServiceMonitor.
#
# NOTE: kube-prometheus-stack's defaultRules already include generic versions of the
# CrashLoop/NodeNotReady alerts; (d) and (f) are restated here explicitly so all six
# retro-named failure modes live in one auditable place (harmless minor overlap).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-failure-modes
  namespace: monitoring
  annotations:
    # Sync-deadlock fix (#127). PrometheusRule is a CRD installed by
    # platform-kube-prometheus-stack; on a fresh cluster it may not exist when
    # platform-svc-monitoring first syncs. SkipDryRunOnMissingResource stops the whole
    # app's sync from hard-failing on the missing type; retry/selfHeal applies this
    # rule once the CRD registers. sync-wave "1" orders it after the in-app Namespace
    # (wave 0). Per-resource because platform-svc-monitoring is ApplicationSet-generated
    # (shared template — no per-app syncOptions). See servicemonitors.yaml.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
  labels:
    platform.capstone/component: platform
    release: kube-prometheus-stack
spec:
  groups:
    # ── (a) Vault sealed or down ──────────────────────────────────────────────
    # The vault StatefulSet reports 0 ready replicas whenever the pod is sealed
    # (Running but not Ready), crash-looping, or absent. Robust regardless of the
    # transit auto-unseal work (if auto-unseal fails, the pod stays not-Ready).
    - name: vault
      rules:
        - alert: VaultSealedOrDown
          expr: kube_statefulset_status_replicas_ready{namespace="vault", statefulset="vault"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Vault is sealed or down"
            description: >-
              The vault StatefulSet has 0 ready replicas for 5m — Vault is sealed,
              crash-looping, or down. ESO keeps serving already-materialized Secrets,
              but NEW/refreshed secret sync is paused. Check `kubectl -n vault get pods`
              and unseal/recover per artifacts/design/vault-dr-runbook.md.

        # ── (a2) Transit auto-unseal backend sealed ───────────────────────────
        # The main Vault (a) auto-unseals against a SEPARATE single-node, manual-
        # Shamir unsealer Vault (`vault-unsealer` ns). That unsealer is NOT covered
        # by (a) — and when it seals (e.g. after a node-churn restart) the main Vault
        # stays UP and serving (it holds its key in memory) so NOTHING in (a) fires.
        # But the main Vault can no longer seal-WRAP new data: transit/encrypt returns
        # 503 "Vault is sealed", which silently breaks `raft snapshot save` (the
        # SHA256SUMS.sealed file can't be produced) AND means any main-Vault pod
        # restart can no longer auto-unseal — a latent full-platform outage. A sealed
        # Vault reports its pod not-Ready, so 0 ready replicas of the unsealer STS is
        # the signal. This gap let the unsealer sit sealed for 5h+ unnoticed.
        - alert: VaultUnsealerSealed
          expr: kube_statefulset_status_replicas_ready{namespace="vault-unsealer", statefulset="vault-unsealer"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Vault transit auto-unseal backend is sealed or down"
            description: >-
              The vault-unsealer StatefulSet has 0 ready replicas for 5m — the transit
              auto-unseal backend is SEALED or down. The main Vault keeps serving
              already-unsealed, but (1) `raft snapshot save` fails with 'unable to read
              SHA256SUMS.sealed file' (no fresh DR backup), and (2) any main-Vault pod
              restart can NO LONGER auto-unseal → latent platform-wide outage. The
              unsealer is single-node manual-Shamir: unseal it by hand per
              artifacts/design/vault-dr-runbook.md (`kubectl -n vault-unsealer exec -it
              vault-unsealer-0 -- vault operator unseal`, 3 key shares).

        # 3-node Raft HA (this PR): a degraded-but-serving state is now possible —
        # 1 or 2 of 3 pods down while the cluster still has quorum via the rest.
        # This is warning (not critical): secret sync is NOT interrupted, but the
        # cluster has lost its failure headroom (one more pod loss = full outage,
        # the VaultSealedOrDown alert above). Distinct metric from (a) on purpose —
        # replicas < spec.replicas, not replicas_ready == 0.
        - alert: VaultHADegraded
          expr: >-
            kube_statefulset_status_replicas_ready{namespace="vault", statefulset="vault"}
            < kube_statefulset_spec_replicas{namespace="vault", statefulset="vault"}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Vault Raft HA is degraded"
            description: >-
              The vault StatefulSet has fewer ready replicas than desired
              (spec.replicas: 3) for 10m — one or more Vault pods is down, sealed,
              or unjoined. The cluster still has quorum and secret sync continues,
              but availability headroom is reduced. Check
              `kubectl -n vault get pods` and `vault operator raft list-peers`;
              see artifacts/design/vault-dr-runbook.md §G.

        # The daily raft-snapshot CronJob is the ONLY Vault DR backup. A failing run
        # means no fresh snapshot → data loss past the last good snapshot is
        # unrecoverable. This alert exists because the job failed silently for >29h
        # (missing `snapshot` k8s-auth role) with nothing watching it (retro #3).
        # ── REWRITTEN (FIX-7, ADV-3 — handed over by devops-health/FIX-6) ─────
        # The previous expression was
        #   kube_job_status_failed{namespace="vault", job_name=~"vault-raft-snapshot-.*"} > 0
        # which fired on the mere EXISTENCE of a Failed Job object, with no time
        # bound. Combined with the CronJob's `failedJobsHistoryLimit: 3`, three
        # Jobs that failed on 2026-07-06/07/08 stayed retained for 26-28 days —
        # and because those three history slots are only evicted by NEWER
        # failures, once failures STOP the last three never age out. So the alert
        # pinned itself ON permanently: it said "is failing" (present tense) but
        # actually meant "has ever failed and the object still exists". It was a
        # standing critical false alarm (x6) claiming Vault DR was unrecoverable
        # while the last three snapshot runs had in fact all succeeded.
        #
        # Now keyed on SNAPSHOT FRESHNESS — the thing the annotation always
        # claimed to measure. 129600s = 36h = one missed daily run plus grace.
        # Cannot be pinned on by stale objects, and cannot be silently cleared by
        # them either.
        #
        # The `or absent(...)` arm matters: without it, deleting/renaming the
        # CronJob (or it never having succeeded even once) makes the series vanish
        # and the alert go quiet forever — the exact silent-DR-failure mode this
        # rule exists to prevent. Same absent() idiom as the Ceph job-missing
        # alerts.
        #
        # ⚠ ORDERING DEPENDENCY with devops-health's FIX-6 PR, which adds
        # `ttlSecondsAfterFinished: 172800` to the snapshot CronJob so Job objects
        # self-reap after 48h. That TTL is only SAFE once this rule is
        # freshness-based: under the OLD expression, a genuine unfixed failure
        # would silently self-clear when its Job got reaped at 48h — strictly
        # worse than the false alarm. This rule must land BEFORE, or together
        # with, that TTL. Verified live before merging:
        # kube_cronjob_status_last_successful_time IS exposed by this
        # kube-state-metrics build (1 series, vault-raft-snapshot).
        - alert: VaultRaftSnapshotFailing
          expr: >-
            (time() - kube_cronjob_status_last_successful_time{namespace="vault", cronjob="vault-raft-snapshot"} > 129600)
            or
            absent(kube_cronjob_status_last_successful_time{namespace="vault", cronjob="vault-raft-snapshot"})
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "No fresh Vault raft snapshot in over 36h"
            description: >-
              The vault-raft-snapshot CronJob has not completed successfully in over
              36 hours (or its metric has disappeared entirely) — there is no fresh
              Vault DR snapshot on the vault-snapshots PVC, and a Vault data loss
              right now would be unrecoverable past the last good snapshot. Common
              causes: (1) the transit auto-unseal backend is SEALED — error 'unable
              to read SHA256SUMS.sealed file' — see the VaultUnsealerSealed alert and
              unseal vault-unsealer-0 (runbook); (2) the `snapshot` k8s-auth role is
              missing (`invalid role name "snapshot"` at login) — re-run
              platform-services/external-secrets/vault-policies/snapshot-role.sh
              (runbook §D). Check `kubectl -n vault get cronjob,jobs` and the logs of
              the most recent run. NOTE: unlike the old version of this alert, a
              stale FAILED Job object left lying around does NOT trigger this — only
              genuine snapshot staleness does.

    # ── (b) External Secrets Operator: store not Ready / sync error ────────────
    #
    # ── curb-web-secret incident (2026-09-12/15) — ExternalSecretSyncError FIXED,
    #    NOT ADDED. This alert already existed (committed 2026-09-03) and its
    #    expression genuinely matched curb-web-secret's Ready=False condition the
    #    entire three days it sat broken — so "add detection" was the wrong frame.
    #    It was already there. The question that mattered was why it never reached
    #    a human, and the answer is a labeling bug, not a missing rule.
    #
    #    THE BUG: `namespace` LIES on this metric. ESO's own exporter (confirmed
    #    against upstream's Grafana dashboard, which queries
    #    `externalsecret_status_condition{...} by (namespace, name)`) labels each
    #    series with the NAMESPACE OF THE EXTERNALSECRET IT DESCRIBES — i.e. it is
    #    designed to carry `namespace="curb-staging"`. But on THIS cluster's scrape
    #    config, the ESO controller pod itself lives in the `external-secrets`
    #    namespace, and Prometheus auto-attaches its OWN `namespace` label from
    #    the scrape target (`external-secrets`) to every series it scrapes from
    #    that pod. That collides with the exporter's own `namespace` label, and
    #    with `honor_labels: false` (the default, and what this PodMonitor uses)
    #    Prometheus's target label wins — the exporter's original is renamed
    #    `exported_namespace` instead of being dropped. The TenantDatabaseSecretMissing
    #    rule below already discovered and worked around this for ITS join
    #    (`exported_namespace` in its `by()`/annotations); these three rules
    #    predate that discovery and were never revisited.
    #
    #    THE CONSEQUENCE, verified against this exact config (not assumed): every
    #    ExternalSecretSyncError/SecretStoreNotReady alert, for EVERY tenant in the
    #    fleet, carries the SAME `namespace` label value — the ESO controller's own
    #    namespace, `external-secrets` — never the tenant's. Two failures stack:
    #      1. The rendered alert text ("ExternalSecret {{ $labels.namespace }}/...")
    #         shows `external-secrets`, not `curb-staging` — actively misleading,
    #         not just blank, because `external-secrets` reads as a plausible real
    #         value instead of an obvious gap.
    #      2. WORSE: Alertmanager's route tree groups `by: ['namespace', 'alertname']`
    #         (kube-prometheus-stack-app.yaml). Every tenant's ExternalSecretSyncError
    #         collapses into ONE Alertmanager group (namespace=external-secrets,
    #         alertname=ExternalSecretSyncError) — this is the SAME group-collapse
    #         class already diagnosed for Crossplane MR alerts (see the `max_alerts:
    #         25` / 128 KiB-ntfy-cap comment on the platform-oncall receiver), just
    #         never connected to this rule. Bundle one big group and the per-tenant
    #         signal — WHICH tenant, and whether curb's line even survives the
    #         25-alert truncation — depends on how many other ExternalSecrets are
    #         unhealthy fleet-wide at that moment. That is a plausible, evidenced
    #         mechanism for "the alert fired the whole time and nobody could tell
    #         curb was in it" — not proof of the exact 3-day timeline (this PR does
    #         not have cluster/Alertmanager access to confirm what was actually
    #         delivered), but a real bug independent of that question, worth fixing
    #         regardless of which mechanism dropped curb specifically.
    #
    #    THE FIX: `label_replace` the real tenant namespace from `exported_namespace`
    #    back onto the literal `namespace` label before it reaches Alertmanager —
    #    label_replace OVERWRITES an existing destination label, so this corrects
    #    both the misleading annotation text and the Alertmanager grouping key with
    #    one change, no route-tree edit required. ClusterSecretStoreNotReady is left
    #    alone: ClusterSecretStore is genuinely cluster-scoped, so its `namespace`
    #    label already means the ESO controller (there is no tenant namespace to
    #    recover).
    - name: external-secrets
      rules:
        - alert: ExternalSecretSyncError
          expr: >-
            label_replace(
              externalsecret_status_condition{condition="Ready", status="False"} == 1,
              "namespace", "$1", "exported_namespace", "(.+)"
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} not syncing"
            description: >-
              ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} has been
              Ready=False (SecretSyncError) for 10m. The backing k8s Secret is stale
              or missing. Check the ExternalSecret status and the SecretStore it
              references. Common cause on this platform: an explicit spec.data[]
              entry whose Vault property isn't set in THIS environment — ESO's
              data[] is atomic, so one missing key blocks the whole Secret,
              silently discarding every OTHER key that resolved fine (this is what
              happened to curb-web-secret in curb-staging/curb-prod, 2026-09-12).
              `kubectl -n {{ $labels.namespace }} describe externalsecret {{ $labels.name }}`
              names the exact missing key.
        - alert: ClusterSecretStoreNotReady
          expr: clustersecretstore_status_condition{condition="Ready", status="False"} == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "ClusterSecretStore {{ $labels.name }} not Ready"
            description: >-
              ClusterSecretStore {{ $labels.name }} has been Ready=False for 10m —
              ESO cannot reach/authenticate to Vault. ALL ExternalSecrets that use it
              are blocked. Check Vault reachability + the k8s-auth role.
        - alert: SecretStoreNotReady
          expr: >-
            label_replace(
              secretstore_status_condition{condition="Ready", status="False"} == 1,
              "namespace", "$1", "exported_namespace", "(.+)"
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "SecretStore {{ $labels.namespace }}/{{ $labels.name }} not Ready"
            description: >-
              Namespaced SecretStore {{ $labels.namespace }}/{{ $labels.name }} has
              been Ready=False for 10m. ExternalSecrets in that namespace are blocked.

        # ── (b2) THE "HEALTHY-LOOKING TENANT WITH NO SECRETS" BLIND SPOT ───────
        # (FIX-7 scope addition; pairs with FIX-4's provider-layer MR alert —
        #  that one catches Crossplane failing to WRITE the secret to Vault, this
        #  one catches ESO failing to DELIVER it into the namespace.)
        #
        # WHY THE THREE RULES ABOVE DO NOT COVER THIS. ESO reports the
        # ExternalSecret **Ready=True** for a target Secret it has DELETED — the
        # distinction lives only in the condition's `reason` (SecretSynced vs
        # SecretDeleted). Verified live: 3 ExternalSecrets currently sit at
        # Ready=True/SecretDeleted with their target Secret genuinely absent, and
        # every Ready=False rule above correctly ignores them. So a deleted secret
        # is INVISIBLE to condition-status alerting.
        #
        # ⚠ AND `reason` IS NOT QUERYABLE. Checked against the live metric rather
        # than assumed: `externalsecret_status_condition` carries only
        # {condition, status, name, exported_namespace, ...} — there is NO `reason`
        # label on this ESO build. (The `condition="Deleted"` series that do exist
        # are stale leftovers from the torn-down e2efall26 tenant, not a usable
        # signal.) So this rule cannot be written off ESO's own metrics at all.
        # Instead it JOINS against kube-state-metrics: "an ExternalSecret exists,
        # but the Secret it targets does not".
        #
        # ⚠ WHY IT IS SCOPED TO `.+-db` AND MUST STAY THAT WAY. Tenant app-secrets
        # (`<team>-secret`) sit in exactly this deleted state BY DESIGN — M4
        # zero-config onboarding means students set app secrets later via the
        # portal, and `deletionPolicy: Delete` + no key in Vault yet is the normal,
        # expected resting state for a brand-new tenant (INV-1). Alerting on those
        # would page for every single new tenant on day one and rebuild exactly the
        # alert-fatigue problem the rest of FIX-7 exists to remove.
        # A tenant DB secret (`<team>-db`) is the opposite: it is provisioned
        # automatically and its absence is never normal. Fleet-wide disappearance
        # of these is the precise fingerprint of the F-2 outage — a Vault/provider
        # failure plus `deletionPolicy: Delete` wipes them, and because the pods'
        # secret refs are `optional: true` the apps come up Ready and serving 200s
        # with an EMPTY DATABASE_URL. Nothing else on the platform notices.
        #
        # VERIFIED LIVE with a positive control before shipping (FIX-7 evidence):
        #   this expression, as written        -> 0 series (all 3 molly-demo-db exist)
        #   same expression with `.+-secret`   -> exactly 3 series, the known
        #                                         zero-config app-secrets
        # i.e. the join genuinely detects missing target Secrets, and the `-db`
        # scope is what keeps the by-design ones out.
        #
        # 20m (not 10m): tenant provisioning legitimately has a window where the
        # ExternalSecret exists before Vault has been seeded and the Secret
        # materialises. 20m clears normal onboarding without hiding a real outage.
        #
        # FIX-15/MON-007: the `unless` join's right-hand side comes from
        # kube-state-metrics (kube_secret_info), a DIFFERENT exporter than the left
        # side (ESO's own externalsecret_status_condition). If KSM stops reporting
        # while ESO keeps reporting, the right side goes empty and EVERY tenant DB
        # ExternalSecret matches — a fleet-wide critical, student-facing false page
        # ("your database secrets have been wiped") on a KSM outage, which runs as a
        # single replica here. `and on() (count(kube_secret_info) > 0)` gates the
        # whole rule on that data source actually being present, so a KSM outage
        # produces 0 series instead of one critical per tenant. Verified live:
        #   count(kube_secret_info) right now                          = 187 (present)
        #   guard clause `and on() (count(kube_secret_info) > 0)`       = passes (1)
        #   simulated absence (count() of a namespace with 0 Secrets)   = 0 (blocks)
        #
        # curb-web-secret incident follow-up (this PR): `max by (exported_namespace,
        # name)` drops every OTHER label, including `namespace` — so this alert had
        # NO namespace label at all, and Alertmanager's `group_by: ['namespace',
        # 'alertname']` collapsed every tenant's TenantDatabaseSecretMissing into one
        # group (empty namespace), same class of bug as ExternalSecretSyncError above,
        # independently discovered here. The outer label_replace restores a real
        # `namespace` label from `exported_namespace` so grouping is per-tenant again;
        # the annotation already used `exported_namespace` directly and is unchanged.
        - alert: TenantDatabaseSecretMissing
          expr: >-
            label_replace(
              (
                max by (exported_namespace, name) (
                  externalsecret_status_condition{condition="Ready", status="True", name=~".+-db"} == 1
                )
                and on () (count(kube_secret_info) > 0)
              )
              unless on (exported_namespace, name) (
                label_replace(
                  label_replace(
                    max by (namespace, secret) (kube_secret_info),
                    "exported_namespace", "$1", "namespace", "(.+)"
                  ),
                  "name", "$1", "secret", "(.+)"
                )
              ),
              "namespace", "$1", "exported_namespace", "(.+)"
            )
          for: 20m
          labels:
            severity: critical
            impact: student-facing
          annotations:
            summary: "Tenant DB secret {{ $labels.exported_namespace }}/{{ $labels.name }} has vanished"
            description: >-
              The ExternalSecret {{ $labels.exported_namespace }}/{{ $labels.name }}
              reports healthy, but the Kubernetes Secret it targets DOES NOT EXIST —
              ESO deleted it (deletionPolicy: Delete) and still reports Ready=True.
              The tenant's app will keep running and serving HTTP 200 with an EMPTY
              DATABASE_URL, because its secret refs are optional:true — so this will
              NOT show up as a Degraded app or a CrashLoop. Almost always means Vault
              or the Crossplane provider credential broke and the DB secret was wiped
              fleet-wide. Check Vault is unsealed and reachable, check the
              ClusterSecretStore, then confirm the tenant's Vault path
              `tenants/<team>/<env>/db` still holds its keys. Expect this to fire for
              MANY tenants at once — that is the signature, not a coincidence.
              (If kube-state-metrics itself is down, THIS alert stays silent by
              design — check TargetDown / KSM's own pod status instead; that is a
              different outage from "secrets were wiped".)

    # ── (c) ArgoCD app Degraded or stuck OutOfSync ────────────────────────────
    # Excludes platform-netpol-controlplane: it is INTENTIONALLY OutOfSync (SEC-011
    # manual security gate), the one known-permanent drift.
    - name: argocd
      rules:
        # SCOPED TO PLATFORM APPS (FIX-7): tenant + lab apps are handled by
        # TenantAppDegraded in the `tenant-delivery` group at the bottom of this
        # file, which pages with student-facing wording and a longer window. The
        # two selectors are EXACT COMPLEMENTS, verified live against Prometheus —
        # every Degraded app matches exactly one of the two rules, never both
        # (no duplicate page) and never neither (no coverage hole).
        - alert: ArgoCDAppDegraded
          expr: argocd_app_info{health_status="Degraded", project=~"platform|default", dest_namespace!~"lab-.*"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is Degraded"
            description: >-
              ArgoCD Application {{ $labels.name }} (project {{ $labels.project }})
              has been Degraded for 10m. Inspect with `argocd app get {{ $labels.name }}`.
        - alert: ArgoCDAppStuckOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync", name!~"platform-netpol-controlplane.*"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} stuck OutOfSync"
            description: >-
              ArgoCD Application {{ $labels.name }} has been OutOfSync for 15m (not the
              SEC-011 manually-gated netpol). selfHeal should have reconciled it —
              check for a sync error or a drifted manually-edited resource.

    # ── (d) Pod CrashLoopBackOff / ImagePullBackOff ───────────────────────────
    - name: workloads
      rules:
        # SCOPED TO PLATFORM NAMESPACES (FIX-7) — tenant/lab namespaces are
        # covered by TenantAppWorkloadStuck below. Exact complement of that rule's
        # selector: the two `namespace` matchers are negations of each other and the
        # reason lists are identical, so every waiting container matches exactly one
        # of the two rules (verified live at 3 reasons: 1 platform + 7 tenant = 8
        # total; re-verified after CreateContainerConfigError was added as a 4th).
        # ⚠ THE REASON LISTS MUST BE KEPT IDENTICAL between this rule and
        # TenantAppWorkloadStuck — adding a reason to only one silently opens a
        # coverage hole on the other side of the namespace split. That is exactly how
        # CreateContainerConfigError went unmonitored (MON-003). The namespace pattern is the
        # tenancy naming convention: `lab-<course>` for the lab tenants and
        # `<team>-<env>` for scaffolded app tenants; no platform namespace ends in
        # -dev/-staging/-prod (verified live).
        - alert: PodCrashLoopOrImagePullBackOff
          expr: kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError", namespace!~"lab-.*|.*-(dev|staging|prod)"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} stuck ({{ $labels.reason }})"
            description: >-
              Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }}
              has been waiting with reason {{ $labels.reason }} for 10m. Check
              `kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}`.

    # ── (e) cert-manager certificate expiring soon ────────────────────────────
    - name: cert-manager
      rules:
        - alert: CertManagerCertExpiringSoon
          expr: (certmanager_certificate_expiration_timestamp_seconds - time()) < (14 * 24 * 3600)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expiring soon"
            description: >-
              Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in under
              14 days and has not been renewed. cert-manager should auto-renew —
              check the Certificate + its issuer if this persists.

    # ── (f) Node NotReady ─────────────────────────────────────────────────────
    - name: nodes
      rules:
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready", status="true"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is NotReady"
            description: >-
              Node {{ $labels.node }} has been NotReady for 10m. Pods on it may be
              evicted/unschedulable. Check `kubectl describe node {{ $labels.node }}`.

        # ── Build-pool disk headroom (added with the local-path CI work volume) ──
        # WHY THIS EXISTS — a deliberate trade recorded in ADR-038 §3. The ARC CI
        # work volume moved from ceph-block (a real 5Gi RBD block device) to the
        # node-local `local-path-ci` class, which is a DIRECTORY on the node's
        # root filesystem. local-path-provisioner does NOT enforce the PVC's
        # requested size, so the 5Gi request is now NOMINAL:
        #   - before: a runaway build hit ENOSPC inside its own 5Gi volume and
        #     failed just that job.
        #   - after:  a runaway build can consume the NODE's free space, trip the
        #     kubelet's DiskPressure eviction threshold, and take out unrelated
        #     pods on the same node.
        # That regression is the price of ~47s -> ~13s on the per-job externals
        # copy. This alert is the compensating control: it must fire with enough
        # margin to intervene BEFORE the kubelet's eviction threshold starts
        # evicting.
        #
        # ── 2026-09-03 CORRECTION (w1 DiskPressure incident) ──────────────────
        # Two things in the original text were WRONG and cost us an incident:
        #
        # 1. "eviction threshold (10% available)" is NOT what binds here. The
        #    kubelet on the Debian workers sets no evictionHard, so it uses the
        #    DEFAULTS — and because nodefs and imagefs are the SAME filesystem
        #    (single /dev/sda2), the binding rule is `imagefs.available<15%`,
        #    not nodefs' 10%. Measured on capstone-w1 2026-09-03: kubelet
        #    reported "Threshold quantity: 69707516625, available: 67952744Ki"
        #    — 69707516625 / 464716759040 = exactly 15.0%. So the real gap
        #    between this alert (20%) and first eviction (15%) is 5 points
        #    (~22 GiB on a 433 GiB disk), not the 10 points the comment implied.
        #
        # 2. The runbook pointed ONLY at /var/local-path-provisioner. On w1 the
        #    actual consumer was /var/lib/minio-dr-backup (324.5 G = 94% of
        #    used space — Velero's Kopia repos + the Thanos block bucket), and
        #    an operator following this text would have found an empty CI dir
        #    and moved on. The description below now names the real candidates
        #    in size order.
        #
        # Also note WHY a second, critical-severity rule now exists: this
        # warning fired continuously for 59.1 HOURS on capstone-w1 before the
        # incident (verified via ALERTS_FOR_STATE) and was being delivered
        # successfully to the platform-oncall webhook the whole time. The
        # failure was not detection and not delivery — it was that a warning
        # that never escalates reads as background noise. The critical rule
        # below fires in the 2-point band immediately above first eviction, so
        # "about to evict" is distinguishable from "getting full".
        - alert: BuildPoolDiskFilling
          expr: >-
            (node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
             / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}) < 0.20
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.instance }} root filesystem below 20% free"
            description: >-
              {{ $labels.instance }} has less than 20% free on /. Kubelet begins
              evicting pods at 15% available on these nodes (nodefs==imagefs, so
              the default imagefs.available<15% rule binds first) — this alert
              leaves roughly 5 percentage points of margin, about 22 GiB on a
              433 GiB disk. Find the consumer in size order, do NOT assume CI:
              `sudo du -sh /var/lib/minio-dr-backup /var/lib/containerd
              /var/local-path-provisioner/* /var/log 2>/dev/null | sort -rh`.
              On capstone-w1 the dominant consumer is the node-local DR store
              (Velero Kopia repos + Thanos blocks), not CI work volumes; on the
              other workers a runaway build in local-path-ci is more likely.
              See docs/operator/disk-headroom.md.

        # Critical tier: the 2-point band immediately above first eviction.
        # Deliberately NOT the same severity as the 20% warning — see the long
        # comment above for why a non-escalating warning failed to prompt action
        # for 59 hours. `for: 5m` (not 15m) because at this level the remaining
        # headroom is single-digit GiB and a single Kaniko build can cross it.
        - alert: NodeRootFilesystemNearEviction
          expr: >-
            (node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
             / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}) < 0.17
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.instance }} is within ~2 points of kubelet eviction"
            description: >-
              {{ $labels.instance }} has less than 17% free on /; kubelet starts
              evicting pods at 15% (imagefs.available default). At this level the
              node is minutes of build output away from evicting unrelated pods —
              on 2026-09-03 this took out alloy, the VPA recommender and a
              student team's CI runner, failing their build at
              "Initialize containers". Act now, do not wait for a maintenance
              window. Runbook: docs/operator/disk-headroom.md.

    # ── (g) TENANT / LAB DELIVERY PATH (FIX-7, BLOCK-1 durable half) ──────────
    # WHY THIS GROUP EXISTS. Two student lab tenants sat completely broken for
    # NINE DAYS and nobody found out. Their images were never published (the
    # single `build` run in each repo died in a transient GitHub Actions incident
    # on 2026-08-06 and was never retried), so their pods sat in ImagePullBackOff,
    # their ArgoCD apps sat Degraded, and their public URLs served 503 — for the
    # entire time, with no retry and no notification.
    #
    # The failure was NOT that nothing fired. Generic rules DID fire the whole
    # time. The failure was that (a) alert delivery was broken (BLOCK-2: ntfy was
    # rejecting ~62% of notifications with a message-size 400) and (b) what did
    # get through was indistinguishable from ~79 alerts of mostly structural
    # noise. So this group is not "another alert" — it SPLITS the student-facing
    # delivery path out of the generic platform rules above into alerts that name
    # the affected tenant and say what to actually do about it. The generic rules
    # were narrowed to the exact complement of these selectors, so total alert
    # volume does not increase and nothing is covered twice.
    #
    # WHY 30m AND NOT 10m: a student's app is legitimately broken-then-fixed many
    # times an hour while they are working on it — that is the point of the
    # platform, not an incident. 30m is long enough that normal iteration never
    # pages, and short enough that a genuinely stuck tenant surfaces within the
    # hour instead of in nine days.
    #
    # HOW TENANT/LAB WORKLOADS ARE IDENTIFIED (verified live, 2026-08-15) — by
    # NAMING CONVENTION, deliberately not by namespace label:
    # `kube_namespace_labels` is NOT emitted by kube-state-metrics in this install
    # (the only series carrying `label_platform_capstone_team` come from opencost,
    # and they cover just the three molly-demo namespaces — the lab namespaces are
    # absent entirely). A label-join would therefore have silently MISSED the exact
    # tenants this group exists to catch.
    #   namespaces : `lab-<course>` (lab tenants) and `<team>-<env>` where env is
    #                dev|staging|prod (scaffolded app tenants). No platform
    #                namespace matches either shape.
    #   argocd apps: lab apps live in the `platform` project but deploy into a
    #                `lab-*` namespace, so they are matched on dest_namespace;
    #                app tenants get their own AppProject, so they are matched as
    #                "any project that is not platform/default".
    # FIX-15/MON-014 (ROLLOUT-SUSPENDED, filed by FIX-14): widened Degraded-only to
    # also catch Missing and Unknown — Argo CD's other two "something is wrong and
    # nobody would notice" health states (Missing: a resource ArgoCD expects never
    # got created; Unknown: the health check itself errored). Suspended is
    # DELIBERATELY NOT included here — Argo Rollouts' bundled health check maps a
    # PAUSED canary (a legitimate, common mid-promotion state) to Suspended, and a
    # short pause must not page the same way a broken app does. It gets its own
    # sibling rule below with a much longer window instead of being silently folded
    # in here or silently dropped altogether (the FIX-14 finding this closes).
    #
    # PARTITION ARITHMETIC RE-VERIFIED LIVE (2026-08-15, after this widening):
    # the platform/tenant split is a NAMESPACE partition (project/dest_namespace),
    # orthogonal to which health_status values a rule cares about — widening the
    # VALUES this rule matches cannot reopen the exact-complement NAMESPACE split
    # ArgoCDAppDegraded and this rule already verified against each other. Live:
    #   count(project=~"platform|default", dest_namespace!~"lab-.*")        = 84
    #   count(project!~"platform|default" or dest_namespace=~"lab-.*")     =  8
    #   total argocd_app_info series                                       = 92
    # 84 + 8 = 92 — still exact, no overlap, no gap, at the NAMESPACE level.
    # What DOES change: ArgoCDAppDegraded (the platform-side sibling, unchanged by
    # this task) still matches health_status="Degraded" ONLY — a platform app that
    # goes Missing or Unknown is not covered by any rule after this change. That
    # asymmetry is real and intentionally out of THIS task's scope (task brief:
    # "widen main TENANT rule to Missing|Unknown" — the tenant side only); flagging
    # it here rather than leaving it silently discoverable only by reading the diff.
    - name: tenant-delivery
      rules:
        - alert: TenantAppDegraded
          expr: >-
            argocd_app_info{health_status=~"Degraded|Missing|Unknown", project!~"platform|default"} == 1
            or
            argocd_app_info{health_status=~"Degraded|Missing|Unknown", dest_namespace=~"lab-.*"} == 1
          for: 30m
          labels:
            severity: warning
            impact: student-facing
          annotations:
            summary: "Tenant app {{ $labels.name }} has been broken for 30m ({{ $labels.health_status }})"
            description: >-
              The tenant/lab ArgoCD Application {{ $labels.name }} (namespace
              {{ $labels.dest_namespace }}) has been {{ $labels.health_status }} for
              30 minutes — a student's app is down and they are probably stuck. THIS
              IS THE ALERT THAT WOULD HAVE CAUGHT THE 9-DAY-DEAD LAB TENANTS. Most
              common cause by far: their image was never published, because the
              `build` workflow in their repo failed and was never retried — check
              the Actions tab of {{ $labels.repo }} first and re-run the failed run.
              Missing usually means a manifest never applied (check `argocd app
              get {{ $labels.name }}` for a sync error); Unknown usually means
              Argo CD itself could not evaluate health (check the
              application-controller logs). Then
              `kubectl -n {{ $labels.dest_namespace }} get pods`.

        # FIX-15 (ROLLOUT-SUSPENDED, FIX-14): the Argo Rollouts bundled health check
        # maps ANY paused canary — spec.paused:true OR a non-empty pauseConditions —
        # to Argo CD health "Suspended", including the platform's own DEFAULT
        # 25%->(30s)->50%->(30s)->100% auto-advancing canary steps
        # (_contract/.devops/chart/overlays/prod/rollout.yaml), which pass through
        # Suspended TWICE for ~30s each on every completely normal rollout. A short
        # for: window here would page on routine promotions, not stuck ones — hence
        # a MUCH longer window (2h, ~240x the ~30s a normal timed pause lasts) than
        # TenantAppDegraded's 30m. The real failure mode this closes is a MANUAL
        # hold (an empty `pause:` step, or `kubectl argo rollouts pause`) that
        # nobody ever promotes: prod silently keeps serving the OLD version
        # indefinitely, with no crash and no Degraded status, so nothing else on
        # this platform would ever notice. severity: warning (not critical) — the
        # app is still SERVING, just not on the new version.
        - alert: TenantAppSuspended
          expr: >-
            argocd_app_info{health_status="Suspended", project!~"platform|default"} == 1
            or
            argocd_app_info{health_status="Suspended", dest_namespace=~"lab-.*"} == 1
          for: 2h
          labels:
            severity: warning
            impact: student-facing
          annotations:
            summary: "Tenant app {{ $labels.name }} canary paused for 2h — nobody promoted it"
            description: >-
              The tenant/lab ArgoCD Application {{ $labels.name }} (namespace
              {{ $labels.dest_namespace }}) has been Suspended (a paused Argo
              Rollouts canary) for 2 hours — far longer than this platform's
              default ~30s auto-advancing timed pause, so this is very likely a
              MANUAL hold nobody has promoted. Prod is still serving the OLD
              version; nothing is crashing, which is why no other alert caught
              this. Check with `kubectl argo rollouts get rollout <name> -n
              {{ $labels.dest_namespace }}` and, once ready,
              `kubectl argo rollouts promote <name> -n {{ $labels.dest_namespace }}`.

        - alert: TenantAppWorkloadStuck
          expr: kube_pod_container_status_waiting_reason{reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError", namespace=~"lab-.*|.*-(dev|staging|prod)"} == 1
          for: 30m
          labels:
            severity: warning
            impact: student-facing
          annotations:
            summary: "Tenant pod {{ $labels.namespace }}/{{ $labels.pod }} stuck ({{ $labels.reason }}) 30m"
            description: >-
              Container {{ $labels.container }} in tenant/lab pod
              {{ $labels.namespace }}/{{ $labels.pod }} has been stuck in
              {{ $labels.reason }} for 30 minutes. ImagePullBackOff/ErrImagePull
              almost always means the tenant's image was never pushed — their build
              failed and nothing retried it; re-run the failed `build` workflow in
              their repo. CrashLoopBackOff means the image exists but the app dies
              on boot — check `kubectl -n {{ $labels.namespace }} logs
              {{ $labels.pod }} --previous` (a bad DB connection string or a missing
              secret are the usual causes on this platform).
              CreateContainerConfigError means the pod cannot even START because a
              Secret or ConfigMap it references is ABSENT — on this platform that is
              the ESO/Vault missing-secret signature (F-2/INV-1): the kubelet is
              refusing to build the container because an envFrom/secretKeyRef target
              does not exist. Check the tenant's ExternalSecrets and the
              ClusterSecretStore before looking at the app itself; pair this with
              TenantDatabaseSecretMissing above, which catches the same outage from
              the ESO side.

    # ── (g) Harbor unavailable — CI-critical path (FIX-20) ─────────────────────
    # Harbor has ZERO scrape coverage today (no ServiceMonitor, up{namespace="harbor"}
    # returns nothing) — a real gap (proper Harbor-native metrics is a post-Tuesday
    # backlog item), but kube-state-metrics ALREADY covers every namespace's pods for
    # free, so this uses that instead of waiting on new exporter wiring.
    #
    # WHY THIS EXISTS NOW: harbor-registry was EvictedByVPA mid-image-push
    # (updateMode:Auto) and hit a Multi-Attach RWO-PVC delay bringing the
    # replacement up — a ~3min 502 window on every tenant's CI push/pull path
    # (DEPLOY-1 outage). B4 (dockerhub-proxy repoint) made Harbor that critical
    # path for EVERY team's build, not an optional cache. FIX-20 also flips the
    # four harbor-* VPAs to updateMode:Initial (platform-services/vpa-policies/
    # harbor-vpa.yaml) so this class of eviction stops happening — this alert is
    # the safety net for whatever still causes a replica to drop (node issues,
    # crashes, a bad rollout), not a substitute for that fix.
    #
    # for: 0m, NOT a longer dwell — verified live, not assumed: querying
    # kube_deployment_status_replicas_unavailable{namespace="harbor",
    # deployment="harbor-registry"} across the actual 2026-08-16T01:56:31Z eviction
    # (kube-state-metrics scrapes + this rule both evaluate on a 60s tick) shows
    # EXACTLY ONE nonzero sample — 0 at 01:56:00, 1 at 01:57:00, 0 again at 01:58:00.
    # A `for:` of 1m or more requires the condition to hold across a SECOND
    # consecutive evaluation and would NOT have fired for this exact incident —
    # confirmed with a promtool unit test reproducing this precise sample pattern
    # against for:0m/1m/2m/3m variants (only 0m fires). All four harbor-*
    # Deployments are single-replica (replicas:1), so "one scrape sample of
    # unavailable" is the SHORTEST detectable outage this metric's 60s granularity
    # can ever show — there is no shorter real incident to tune for. 0m is not
    # over-sensitive noise here: with VPA evictions stopped by the Initial-mode fix
    # above, a genuine replica drop on these singletons should be rare (an ArgoCD
    # deploy, a crash, a node issue) — each one IS worth knowing about for
    # CI-critical infrastructure, not "cry wolf" background noise.
    #
    # RUNBOOK NOTE (REV-11 advisory): a brief page during a DELIBERATE Harbor
    # version bump or a planned node drain is EXPECTED — acknowledge it, don't
    # treat it as a fresh incident. The alert has no way to distinguish "planned
    # maintenance touched a single-replica Deployment" from "something broke";
    # that's what the on-call human is for. If you're about to bump Harbor's
    # chart/image or drain a node running harbor-*, expect this to fire and
    # that's fine — confirm the replacement pod comes Ready promptly and move on.
    - name: harbor-availability
      rules:
        - alert: HarborCriticalPathUnavailable
          expr: >-
            kube_deployment_status_replicas_unavailable{namespace="harbor", deployment=~"harbor-registry|harbor-core"} > 0
          for: 0m
          labels:
            severity: critical
            impact: student-facing
          annotations:
            summary: "Harbor {{ $labels.deployment }} has an unavailable replica — CI push/pull path"
            description: >-
              {{ $labels.deployment }} (namespace harbor) has {{ $value }}
              unavailable replica(s) — this is the exact signature of the
              DEPLOY-1 outage (a VPA eviction + slow RWO-PVC re-attach produced a
              ~3min 502 window on every tenant's image push/pull). Both
              harbor-registry and harbor-core are single-replica, so ANY drop
              means the whole CI critical path is down for every team right now,
              not degraded. Check `kubectl -n harbor get pods -l app=harbor,component={{ $labels.deployment }}`
              and `kubectl -n harbor describe pod <pod>` for the cause (VPA
              eviction, crash, node issue, PVC attach delay). If it's a VPA
              eviction, `kubectl -n harbor get vpa {{ $labels.deployment }} -o
              jsonpath='{.spec.updatePolicy.updateMode}'` should read `Initial`
              (FIX-20) — if it reads `Auto`, that is itself the bug: file it,
              do not just fix the symptom again.
        - alert: HarborSupportPathUnavailable
          expr: >-
            kube_deployment_status_replicas_unavailable{namespace="harbor", deployment=~"harbor-jobservice|harbor-portal"} > 0
          for: 0m
          labels:
            severity: warning
            impact: student-facing
          annotations:
            summary: "Harbor {{ $labels.deployment }} has an unavailable replica"
            description: >-
              {{ $labels.deployment }} (namespace harbor) has {{ $value }}
              unavailable replica(s). jobservice handles async jobs (GC,
              replication, retention) — a brief drop delays those, it does not
              block a live push/pull. portal is the web UI only — the registry
              API (what CI actually talks to) is unaffected. warning, not
              critical, for exactly that reason; see HarborCriticalPathUnavailable
              for the CI-blocking pair (registry/core).

    # --- Harbor registry STORAGE (2026-09-16, ENOSPC outage) ------------------
    # Harbor storage had NO alert of any kind before this. Note carefully: the
    # metric was never missing — kubelet_volume_stats_* has been scraped for the
    # harbor-registry PVC all along (verified live: it read 0.5995 immediately
    # after the fix, matching `df` at 60%). Nobody was ever told. The gap was an
    # alerting gap, not an instrumentation gap, which is why this is four lines of
    # PromQL and not a new exporter.
    #
    # These alerts are the BACKSTOP, not the fix. The controls are:
    #   1. registry.upload_purging age=24h (applicationsets/harbor-app.yaml) —
    #      removes the orphaned-`_uploads` leak that actually caused the outage.
    #   2. per-project quotas (harbor-retention-gc-config) — ceiling so one
    #      project cannot take CI down for everyone.
    #   3. tag retention + nightly GC — bounds tags/blobs per repo.
    # Ordering matters and is deliberate: this cluster already learned, in the
    # MinIO/Velero DR deadlock on w1, that alerts alone do not prevent an outage —
    # those fired for 59h and changed nothing because no ceiling was enforced.
    # An alert with no enforcement behind it is a notification that you are about
    # to have an outage, not a control that prevents one.
    - name: harbor-storage
      rules:
        - alert: HarborRegistryStorageHigh
          expr: >-
            kubelet_volume_stats_used_bytes{namespace="harbor", persistentvolumeclaim="harbor-registry"}
            / kubelet_volume_stats_capacity_bytes{namespace="harbor", persistentvolumeclaim="harbor-registry"}
            > 0.75
          for: 30m
          labels:
            severity: warning
            impact: student-facing
          annotations:
            summary: "Harbor registry PVC is {{ $value | humanizePercentage }} full — CI push path at risk"
            description: >-
              The harbor-registry PVC has been over 75% full for 30m (currently
              {{ $value | humanizePercentage }}). At 100% every tenant image push
              fails with ENOSPC/Err:28 and ALL CI is blocked — this is not a
              single-tenant problem, the first team to push simply finds it first.
              75%/30m is chosen to fire days before ENOSPC at the observed growth
              rate, leaving room to act calmly rather than at 2am.
              TRIAGE, in order:
              (1) `kubectl -n harbor exec deploy/harbor-registry -c registry -- df -h /storage`
              for ground truth.
              (2) Check for the known leak class FIRST — orphaned multipart uploads:
              `kubectl -n harbor exec deploy/harbor-registry -c registry -- sh -c
              'find /storage/docker/registry/v2/repositories -type d -name _uploads -exec du -sm {} \;'`.
              These are invisible to BOTH tag retention and GC, and to Harbor's own
              quota accounting, so a "GC ran Success" message means nothing about
              them. If this is large, upload_purging is not doing its job — check
              `age` in the registry config, do not just expand the PVC again.
              (3) Only then look at real image growth (Harbor UI → Projects →
              storage) and per-project quotas.
              Do NOT reflexively expand the PVC: it has already gone 20Gi -> 60Gi
              -> 100Gi across two outages, and twice the expansion was mistaken for
              the fix.
        - alert: HarborRegistryStorageCritical
          expr: >-
            kubelet_volume_stats_used_bytes{namespace="harbor", persistentvolumeclaim="harbor-registry"}
            / kubelet_volume_stats_capacity_bytes{namespace="harbor", persistentvolumeclaim="harbor-registry"}
            > 0.90
          for: 5m
          labels:
            severity: critical
            impact: student-facing
          annotations:
            summary: "Harbor registry PVC {{ $value | humanizePercentage }} full — CI outage imminent"
            description: >-
              The harbor-registry PVC is over 90% full. Every tenant's image push
              is minutes-to-hours from failing with ENOSPC. Treat as an active
              incident. See HarborRegistryStorageHigh for the triage order; check
              orphaned `_uploads` before anything destructive, and never reclaim
              space by deleting tenant images as a first move.
        - alert: HarborRegistryStorageFillingFast
          expr: >-
            predict_linear(
              kubelet_volume_stats_available_bytes{namespace="harbor", persistentvolumeclaim="harbor-registry"}[6h],
              4 * 24 * 3600
            ) < 0
          for: 1h
          labels:
            severity: warning
            impact: student-facing
          annotations:
            summary: "Harbor registry PVC trending to full within 4 days"
            description: >-
              Extrapolating the last 6h of free space, the harbor-registry PVC
              runs out within 4 days. This is the RATE alert, and it is the one
              that would actually have caught the 2026-09-16 outage early: the
              orphan leak ran at ~4-7GB/day against a 60Gi volume, so utilisation
              crossed from comfortable to ENOSPC in under a week — a static
              threshold alone gives very little warning at that slope, which is
              why this rule exists alongside the 75%/90% pair rather than instead
              of them. A sudden change in slope usually means a runaway producer
              (a failing mirror/replication job stranding partial uploads), not
              organic tenant growth. Check the `_uploads` triage in
              HarborRegistryStorageHigh first.
