---
# Grafana admin credentials (retro #3 — rotate off the shipped chart default
# `admin` / `prom-operator`; Grafana is internet-reachable via the Cloudflare tunnel at
# grafana.capstone.uamishub.com). Two keys, `admin-user` + `admin-password`, the exact
# key names the Grafana chart expects for `admin.existingSecret`.
#
# Consumed by `grafana.admin.existingSecret: grafana-admin` (+ userKey/passwordKey) in
# applicationsets/kube-prometheus-stack-app.yaml, which replaces the inline
# `grafana.adminPassword`. Credentials therefore live only in this SealedSecret.
#
# ⚠ PLACEHOLDER CIPHERTEXT — this will NOT decrypt. Until a human RESEALS real values,
# the `grafana-admin` Secret is absent and the Grafana pod stays in
# CreateContainerConfigError (it will NOT silently fall back to a default password).
# Reseal runbook: platform-services/monitoring/README.md "Rotating the Grafana admin
# password". Reseal before merge/go-live.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  encryptedData:
    # PLACEHOLDER — reseal with real values (see README). Fails to decrypt by design.
    admin-user: PLACEHOLDER_RESEAL_BEFORE_USE_AgABReplaceThisAdminUserViaKubeseal==
    admin-password: PLACEHOLDER_RESEAL_BEFORE_USE_AgABReplaceThisAdminPasswordViaKubeseal==
  template:
    metadata:
      name: grafana-admin
      namespace: monitoring
    type: Opaque
