# ExternalSecret — Grafana's CNPG database credential (the SQLite -> Postgres
# backend migration). Materializes a SECOND, namespace-local consumer of the SAME
# Vault value that platform-services/db-tier/externalsecrets.yaml's
# `cnpg-grafana-app-credentials` already reads (platform/db/cnpg/grafana) — that
# Secret lives in ns db-tier (where CNPG's declarative DatabaseRole must read it)
# and a pod in ns monitoring cannot mount it, so this is a second materialization,
# NOT a new credential. Exactly the shape Backstage's CNPG cutover used
# (platform-services/backstage/externalsecret-cnpg-db.yaml).
#
# No new Vault policy is needed: `external-secrets-ro` already grants read on
# secret/data/platform/* (platform-services/external-secrets/vault-policies/
# eso-role.sh), and vault-backend is a ClusterSecretStore (cluster-scoped, usable
# from any namespace).
#
# The rendered key is GF_DATABASE_PASSWORD, consumed by an EXPLICIT secretKeyRef in
# `grafana.envValueFrom` (applicationsets/kube-prometheus-stack-app.yaml) — the same
# injection mechanism that file already uses for
# GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET. Grafana maps GF_<SECTION>_<KEY> onto its ini,
# so this env var IS `[database] password`, and the password is therefore never
# written into the Helm values (ADR-030 §0: no secret material in git).
#
# Note this is a plain Opaque Secret with a templated key, NOT the
# kubernetes.io/basic-auth + cnpg.io/reload shape its db-tier sibling uses — that
# typing/label pair is required only by CNPG's DatabaseRole passwordSecret contract,
# which does not apply to a plain env-injection consumer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cnpg-db-credentials
  namespace: monitoring
  labels:
    platform.capstone/component: platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-cnpg-db-credentials
    creationPolicy: Owner
    template:
      data:
        GF_DATABASE_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: platform/db/cnpg/grafana
        property: password
