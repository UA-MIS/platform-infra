# ServiceAccount the portal-tenants refresher runs as. It lives in crossplane-system
# (NOT the portal namespace) for ONE reason: this namespace already has the egress
# path to the kube-apiserver that a kubectl-based Job needs, and it hosts the proven
# sibling pattern (crossplane-mr-prune) that also reads cluster state on a schedule.
# The portal namespace is deliberately default-deny / DNS-only egress (portal/netpol.yaml)
# so its nginx pods can never call out — putting an apiserver-talking Job there would
# require poking a hole in that lockdown (a Cilium apiserver-egress policy). Reusing
# crossplane-system avoids that entirely.
#
# Its authority (rbac.yaml) is minimal: get/list Ingresses cluster-wide (READ) + write
# the ONE portal-tenants ConfigMap in the portal namespace. Nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal-tenants-refresh
  namespace: crossplane-system
  labels:
    platform.capstone/component: platform
    app.kubernetes.io/name: portal-tenants-refresh
