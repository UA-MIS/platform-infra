# ExternalSecret -> Secret `harbor-database-credentials` in the harbor namespace.
# Feeds the Harbor chart's `database.external.existingSecret`
# (applicationsets/harbor-app.yaml) — the chart requires that secret to live in
# harbor-core's OWN namespace with a literal `password` key (core-dpl.yaml reads
# `secretKeyRef.name: {{ .Values.database.external.existingSecret }} / key:
# password`), so the db-tier ExternalSecret (cnpg-harbor-app-credentials,
# platform-services/db-tier/externalsecrets.yaml) can't be referenced directly —
# Secret refs don't cross namespaces. This mirrors that same Vault source
# (platform/db/cnpg/harbor) through the platform-wide `vault-backend`
# ClusterSecretStore (cluster-scoped, usable from any namespace).
#
# Only `password` is pulled — `database.external.username` is set as a plain
# literal ("harbor") in the Helm values since it is not sensitive and the CNPG
# role name is fixed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-database-credentials
  namespace: harbor
  labels:
    platform.capstone/component: platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: harbor-database-credentials
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: password
      remoteRef:
        key: platform/db/cnpg/harbor
        property: password
