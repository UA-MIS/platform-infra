# Gated to UA-MIS:labmx ONLY (the confirmed platform-admin GitHub Team —
# argocd-rbac-cm.yaml `g, UA-MIS:labmx, role:admin`) — disjoint from every
# UA-MIS:<team> gate the per-tenant consoles use, so a student's own team membership
# never grants access here. Same shared oauth2-proxy as every other console.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: db-admin-console-auth
  namespace: db-admin
  labels:
    platform.capstone/component: platform
spec:
  forwardAuth:
    address: http://oauth2-proxy.db-console-auth.svc.cluster.local:4180/oauth2/auth?allowed_groups=UA-MIS:labmx
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
