# db-admin (tenant-db-access design §5) — the platform-operator-only Adminer,
# pre-seeded with every non-tenant platform DB, gated to UA-MIS:labmx. Managed by the
# platform-services-appset (kustomize directory generator over platform-services/*;
# this dir produces app `platform-svc-db-admin`).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - netpol.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - middleware.yaml
  - ingress.yaml

labels:
  - pairs:
      platform.capstone/component: platform
    includeSelectors: false
