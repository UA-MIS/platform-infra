# db-admin (tenant-db-access design §5) — the platform-operator-only Adminer,
# pre-seeded with every non-tenant platform DB, gated to UA-MIS:labmx. Managed by the
# platform-services-appset (kustomize directory generator over platform-services/*;
# this dir produces app `platform-svc-db-admin`).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - netpol.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - middleware.yaml
  - ingress.yaml

# UA-MIS theme (same design as the per-team consoles, platform-services/crossplane/
# apis/composition.yaml's ADMINER CONSOLE blocks — see adminer.css's own header for
# the full rationale: crimson/charcoal chrome + a light-grey/black SQL editor and
# result tables). A STABLE name (disableNameSuffixHash) is required because
# deployment.yaml's volume reference is a fixed string, same pattern as
# platform-services/argocd-config/kustomization.yaml's argocd-ui-theme-cm.
configMapGenerator:
  - name: db-admin-adminer-css
    namespace: db-admin
    files:
      - adminer.css
generatorOptions:
  disableNameSuffixHash: true

labels:
  - pairs:
      platform.capstone/component: platform
    includeSelectors: false
