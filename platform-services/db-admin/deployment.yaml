# Platform-admin Adminer (tenant-db-access design §5). Same tool as the tenant
# consoles, dockette/adminer:full (needs BOTH MySQL and Postgres drivers under ONE
# instance — the per-engine-only images used per-tenant don't fit here since this
# console lists presets from both engines at once). ADMINER_PLUGIN_SERVER_LIST (not
# autologin) — a dropdown of every platform DB with an Auto Sign-In button.
#
# Same non-root-UID + PORT-off-80 posture as the per-tenant consoles
# (platform-services/crossplane/apis/composition.yaml's ADMINER CONSOLE blocks) — see
# those comments for the full rationale.
#
# ⚠ RUNTIME FIX: /srv/adminer-plugins/ is baked into the dockette/adminer image
# root:root 0755 — entrypoint.sh's `cp .../adminer-server-list.php /srv/adminer-plugins/`
# fails Permission Denied under UID 1000 even with a writable root fs. The source dir
# (/srv/plugins-available/) is untouched by this mount, so shadowing the (empty)
# target dir with an emptyDir is safe. fsGroup 1000 below makes the kubelet-owned
# emptyDir group-writable by UID 1000's supplemental group.
#
# UA-MIS THEME: Adminer's own css() helper (index.php) does file_exists("adminer.css")
# relative to its cwd (/srv) and links it in if present — no ADMINER_THEME env/
# entrypoint cooperation needed. A single-file ConfigMap subPath mount straight to
# /srv/adminer.css sidesteps the SAME /srv root:root 0755 permission wall as the
# adminer-plugins fix above WITHOUT needing a writable /srv: the kubelet creates the
# bind mount as root at container-create time, before the UID-1000 process ever
# starts, so the parent dir's permissions are irrelevant (verified: this is a
# different mechanism than entrypoint.sh's in-container `cp`, which IS blocked by
# them). ADMINER_THEME (image-bundled /srv/designs/<name>/) was considered and
# rejected — none of the bundled themes are UA-MIS branded, and using it would still
# hit the same in-container-cp permission wall.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-admin-console
  namespace: db-admin
  labels:
    platform.capstone/component: platform
    app.kubernetes.io/name: db-admin-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db-admin-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-admin-console
        platform.capstone/component: platform
    spec:
      containers:
        - name: adminer
          image: dockette/adminer:full
          imagePullPolicy: IfNotPresent
          env:
            - name: ADMINER_PLUGIN_SERVER_LIST
              value: "1"
            - name: PORT
              value: "8080"
            - name: ADMINER_BANNER
              value: "0"
            - name: ADMINER_SERVERS_CNPG_Backstage
              valueFrom:
                secretKeyRef:
                  name: db-admin-console
                  key: ADMINER_SERVERS_CNPG_Backstage
            - name: ADMINER_SERVERS_CNPG_Harbor
              valueFrom:
                secretKeyRef:
                  name: db-admin-console
                  key: ADMINER_SERVERS_CNPG_Harbor
            - name: ADMINER_SERVERS_CNPG_Crossplane_Provisioner
              valueFrom:
                secretKeyRef:
                  name: db-admin-console
                  key: ADMINER_SERVERS_CNPG_Crossplane_Provisioner
            - name: ADMINER_SERVERS_MariaDB_Root
              valueFrom:
                secretKeyRef:
                  name: db-admin-console
                  key: ADMINER_SERVERS_MariaDB_Root
            - name: ADMINER_SERVERS_MariaDB_Crossplane_Provisioner
              valueFrom:
                secretKeyRef:
                  name: db-admin-console
                  key: ADMINER_SERVERS_MariaDB_Crossplane_Provisioner
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: adminer-plugins
              mountPath: /srv/adminer-plugins
            - name: adminer-css
              mountPath: /srv/adminer.css
              subPath: adminer.css
              readOnly: true
      volumes:
        - name: adminer-plugins
          emptyDir: {}
        - name: adminer-css
          configMap:
            name: db-admin-adminer-css
      securityContext:
        fsGroup: 1000
