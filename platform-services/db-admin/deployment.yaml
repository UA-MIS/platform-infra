# Platform-admin Adminer (tenant-db-access design §5). Same tool as the tenant
# consoles, dockette/adminer:full (needs BOTH MySQL and Postgres drivers under ONE
# instance — the per-engine-only images used per-tenant don't fit here since this
# console lists presets from both engines at once). Server-list plugin (not
# autologin) — a dropdown of every platform DB with an Auto Sign-In button. NOTE:
# ADMINER_PLUGIN_SERVER_LIST=1 is intentionally NOT set below — the plugin is
# activated by directly ConfigMap-mounting a patched copy of it instead (see the
# "Adminer 5.4.4" comment block below for why).
#
# Same non-root-UID + PORT-off-80 posture as the per-tenant consoles
# (platform-services/crossplane/apis/composition.yaml's ADMINER CONSOLE blocks) — see
# those comments for the full rationale.
#
# ⚠ RUNTIME FIX: /srv/adminer-plugins/ is baked into the dockette/adminer image
# root:root 0755 — entrypoint.sh's `cp .../adminer-server-list.php /srv/adminer-plugins/`
# fails Permission Denied under UID 1000 even with a writable root fs. The source dir
# (/srv/plugins-available/) is untouched by this mount, so shadowing the (empty)
# target dir with an emptyDir is safe. fsGroup 1000 below makes the kubelet-owned
# emptyDir group-writable by UID 1000's supplemental group.
#
# UA-MIS THEME: Adminer's own css() helper (index.php) does file_exists("adminer.css")
# relative to its cwd (/srv) and links it in if present — no ADMINER_THEME env/
# entrypoint cooperation needed. A single-file ConfigMap subPath mount straight to
# /srv/adminer.css sidesteps the SAME /srv root:root 0755 permission wall as the
# adminer-plugins fix above WITHOUT needing a writable /srv: the kubelet creates the
# bind mount as root at container-create time, before the UID-1000 process ever
# starts, so the parent dir's permissions are irrelevant (verified: this is a
# different mechanism than entrypoint.sh's in-container `cp`, which IS blocked by
# them). ADMINER_THEME (image-bundled /srv/designs/<name>/) was considered and
# rejected — none of the bundled themes are UA-MIS branded, and using it would still
# hit the same in-container-cp permission wall.
#
# ⚠ ADMINER 5.4.4 "Invalid server." FIX (incident: every login/Auto-Sign-In POST
# 403'd on this console starting ~when w1/w2 joined and pulled the then-current
# dockette/adminer:full digest, which resolves to Adminer 5.4.4). Root cause
# (verified against vrana/adminer's auth.inc.php, diffed v5.4.2 -> v5.4.4): Adminer
# 5.4.3 added a security fix (GHSA-r4x9-5m63-3vxw, "Validate server") that requires
# `host_port(SERVER)`'s host component to match `^[-a-z0-9.:]*$`, erroring
# lang('Invalid server.') otherwise. dockette's bundled adminer-server-list.php
# plugin (activated below via ADMINER_SERVERS_* env vars, one per platform DB)
# submits the env var's suffix itself (e.g. "MariaDB_Root", "CNPG_Backstage") as
# `auth[server]` / SERVER — and those suffixes contain underscores, which the new
# regex rejects. Reproduced live (Auto Sign-In -> HTTP 403 "Invalid server.")
# before this fix.
#
# Fix: adminer-server-list.php below is a patched, ConfigMap-mounted copy of that
# plugin (see its own header for the full diff rationale) — same underscore-bearing
# names are still shown as the dropdown's display label, but a separate
# regex-safe slug is what's actually submitted/validated as SERVER. It's mounted
# directly at /srv/adminer-plugins/adminer-server-list.php (subPath, alongside the
# adminer-plugins emptyDir fix above) INSTEAD of relying on
# ADMINER_PLUGIN_SERVER_LIST=1's entrypoint.sh copy step — that env var is
# deliberately NOT set below, because entrypoint.sh runs under `set -Eeo pipefail`
# and its `cp .../adminer-server-list.php /srv/adminer-plugins/` would try to
# overwrite this already-mounted read-only file, fail Permission Denied, and crash
# the container on every start. Adminer's own plugin loader glob()s every *.php in
# that directory regardless of the env var, so no further wiring is needed — this
# is the same pattern already used for the per-tenant adminer-hide-login-fields.php
# plugin (platform-services/crossplane/apis/composition.yaml).
#
# Image is now pinned by digest (was the floating `dockette/adminer:full` tag,
# imagePullPolicy IfNotPresent — the exact mechanism that silently pulled 5.4.4 onto
# the new workers and triggered this incident). Digest below = the Adminer 5.4.4
# build this fix targets and was verified against; bump deliberately (re-diff
# auth.inc.php against the new tag first) rather than floating again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-admin-console
  namespace: db-admin
  labels:
    platform.capstone/component: platform
    app.kubernetes.io/name: db-admin-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db-admin-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-admin-console
        platform.capstone/component: platform
    spec:
      containers:
        - name: adminer
          image: dockette/adminer:full@sha256:206994d32c8c4e692ef0d05be679cc5e468f1894615f1d7bc2ee8c97137dab09
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: ADMINER_BANNER
              value: "0"
            - name: ADMINER_SERVERS_CNPG_Backstage
              valueFrom:
                secretKeyRef:
                  name: db-admin-console
                  key: ADMINER_SERVERS_CNPG_Backstage
            - name: ADMINER_SERVERS_CNPG_Harbor
              valueFrom:
                secretKeyRef:
                  name: db-admin-console
                  key: ADMINER_SERVERS_CNPG_Harbor
            - name: ADMINER_SERVERS_CNPG_Crossplane_Provisioner
              valueFrom:
                secretKeyRef:
                  name: db-admin-console
                  key: ADMINER_SERVERS_CNPG_Crossplane_Provisioner
            - name: ADMINER_SERVERS_MariaDB_Root
              valueFrom:
                secretKeyRef:
                  name: db-admin-console
                  key: ADMINER_SERVERS_MariaDB_Root
            - name: ADMINER_SERVERS_MariaDB_Crossplane_Provisioner
              valueFrom:
                secretKeyRef:
                  name: db-admin-console
                  key: ADMINER_SERVERS_MariaDB_Crossplane_Provisioner
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          # Bumped from requests 10m/32Mi, limits mem-only 64Mi (operator-reported incident,
          # 2026-07-10: the DB console crashes under a heavy query/click load — same class of
          # bug as the Grafana fix in applicationsets/kube-prometheus-stack-app.yaml, see that
          # file's comment for the full live-cluster diagnosis method, and
          # platform-services/crossplane/apis/composition.yaml's dbconsole containers for the
          # identical per-tenant fix). Adminer buffers whole result sets/HTML tables in PHP
          # memory, so a big SELECT or bulk export under a 64Mi ceiling (only 32Mi of headroom
          # above the request) is an easy OOMKill; no cpu limit existed at all, which is itself
          # a Kyverno require-limits violation in this namespace (`db-admin` is NOT in that
          # policy's exclude list, unlike `monitoring` — confirmed live via `kubectl get events`
          # showing PolicyViolation warnings on this exact Deployment/ReplicaSet/Pod). New
          # limits keep both cpu+memory set (satisfies require-limits) with real headroom: 4x
          # the old memory ceiling, and a cpu limit generous enough (500m) not to throttle a
          # heavy query/render burst while still bounding this console on this shared cluster —
          # this instance queries EVERY platform DB (Backstage/Harbor/Crossplane-provisioner/
          # MariaDB), so it sees the widest variety of query sizes of any console.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: adminer-plugins
              mountPath: /srv/adminer-plugins
            - name: adminer-server-list-plugin
              mountPath: /srv/adminer-plugins/adminer-server-list.php
              subPath: adminer-server-list.php
              readOnly: true
            - name: adminer-css
              mountPath: /srv/adminer.css
              subPath: adminer.css
              readOnly: true
      volumes:
        - name: adminer-plugins
          emptyDir: {}
        - name: adminer-server-list-plugin
          configMap:
            name: db-admin-adminer-server-list-plugin
        - name: adminer-css
          configMap:
            name: db-admin-adminer-css
      securityContext:
        fsGroup: 1000
