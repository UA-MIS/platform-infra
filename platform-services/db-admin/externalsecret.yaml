# Platform-admin Adminer preset connections (tenant-db-access design §5). Reads the
# SAME platform Vault tree platform-services/db-tier/externalsecrets.yaml already
# reads (secret/platform/db/{cnpg,mariadb}/*) via the SAME platform-wide
# `vault-backend` ClusterSecretStore — NO new Vault policy needed (the
# `external-secrets-ro` policy already grants read on `secret/data/platform/*`).
#
# Uses dockette/adminer's `server-list` plugin (ADMINER_PLUGIN_SERVER_LIST=1,
# deployment.yaml) — a dropdown of every preset below with an "Auto Sign-In" button;
# credentials are handled server-side and never exposed to the browser (verified
# against the plugin's own shipped source, .plugins/adminer-server-list.php).
#
# DSN format: driver://username:password@host:port/database (driver `server` =
# MySQL/MariaDB, `pgsql` = Postgres — same convention as the per-tenant consoles).
# Usernames NOT stored in Vault (CNPG role names / the MariaDB root user / the
# mariadb-operator User CR name) are the platform's own fixed, non-secret identifiers
# — hardcoded here, matching how platform-services/backstage/app/app-config.production.yaml
# already hardcodes `user: backstage` alongside the Vault-sourced password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-admin-console
  namespace: db-admin
  labels:
    platform.capstone/component: platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: db-admin-console
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ADMINER_SERVERS_CNPG_Backstage: "pgsql://{{ .cnpgBackstageUser }}:{{ .cnpgBackstagePass }}@capstone-pg-rw.db-tier.svc.cluster.local:5432/backstage"
        ADMINER_SERVERS_CNPG_Harbor: "pgsql://{{ .cnpgHarborUser }}:{{ .cnpgHarborPass }}@capstone-pg-rw.db-tier.svc.cluster.local:5432/harbor"
        ADMINER_SERVERS_CNPG_Crossplane_Provisioner: "pgsql://{{ .cnpgProvUser }}:{{ .cnpgProvPass }}@capstone-pg-rw.db-tier.svc.cluster.local:5432/postgres"
        ADMINER_SERVERS_MariaDB_Root: "server://root:{{ .mariadbRootPass }}@capstone-mariadb.db-tier.svc.cluster.local:3306/"
        ADMINER_SERVERS_MariaDB_Crossplane_Provisioner: "server://crossplane-provisioner:{{ .mariadbProvPass }}@capstone-mariadb.db-tier.svc.cluster.local:3306/"
  data:
    - secretKey: cnpgBackstageUser
      remoteRef:
        key: platform/db/cnpg/backstage
        property: username
    - secretKey: cnpgBackstagePass
      remoteRef:
        key: platform/db/cnpg/backstage
        property: password
    - secretKey: cnpgHarborUser
      remoteRef:
        key: platform/db/cnpg/harbor
        property: username
    - secretKey: cnpgHarborPass
      remoteRef:
        key: platform/db/cnpg/harbor
        property: password
    - secretKey: cnpgProvUser
      remoteRef:
        key: platform/db/cnpg/crossplane-provisioner
        property: username
    - secretKey: cnpgProvPass
      remoteRef:
        key: platform/db/cnpg/crossplane-provisioner
        property: password
    - secretKey: mariadbRootPass
      remoteRef:
        key: platform/db/mariadb/root
        property: password
    - secretKey: mariadbProvPass
      remoteRef:
        key: platform/db/mariadb/crossplane-provisioner
        property: password
