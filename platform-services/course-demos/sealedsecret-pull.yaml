# SealedSecret — imagePullSecret for the private Harbor images
# harbor.capstone.uamishub.com/course-demos/{hub,flask-hello}. Sealed (strict, ns+name
# bound) for secret `course-demos-pull` in ns `demos`, SHARED by both deployments
# (deploy/deployment-*.yaml reference it). Backed by a pull-ONLY Harbor robot scoped
# to the course-demos project (robot$course-demos+course-demos-pull).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: course-demos-pull
  namespace: demos
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: course-demos-pull
      namespace: demos
    type: kubernetes.io/dockerconfigjson
