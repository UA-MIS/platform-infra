# Docker Hub population for base-images (project.yaml, same dir) — a plain
# Kubernetes CronJob running `crane copy`, NOT a Harbor-native Replication MR
# like the MCR/GCR sources use (replication-mcr-*.yaml, replication-gcr-*.yaml).
#
# WHY NOT REPLICATION FOR DOCKER HUB (verified by execution, 2026-09-10):
# Harbor's pull-based replication engine LISTS the source repo's tags (or the
# namespace's repos) server-side before applying the name/tag filter. Docker
# Hub's Hub API caps that listing for an ANONYMOUS caller and 403s once the
# result set is large enough:
#   "get tags for repo 'nginxinc/nginx-unprivileged' from DockerHub error:
#    403 -- pagination offset too large for anonymous requests; sign in to
#    page further"
# This reproduced for BOTH the "library" official-image namespace (tested:
# library/nginx) AND a small third-party org (nginxinc/nginx-unprivileged) —
# it is not a "library is huge" problem, it is "Docker Hub's listing API
# requires auth past a shallow page depth, full stop." MCR and GCR replicated
# cleanly (execution evidence: policy_id 3,4,5,6,7 all Succeed 1/1) because
# their generic docker-registry v2 adapters use a single unpaginated
# `/v2/_catalog` + `/v2/<repo>/tags/list` call, not Docker Hub's proprietary
# Hub API.
#
# `crane copy` sidesteps the LISTING problem entirely: it resolves ONE exact
# tag reference directly (`GET /v2/<repo>/manifests/<tag>`), never lists
# anything, so the pagination cap never applies.
#
# SOURCE IS mirror.gcr.io, NOT docker.io DIRECTLY (for Docker Hub entries) — a
# second, independent Docker Hub limitation found by execution: pulling ~20
# images anonymously from docker.io in one run tripped Docker Hub's separate
# anonymous PULL RATE LIMIT ("TOOMANYREQUESTS: You have reached your
# unauthenticated pull rate limit"), which is IP-bucketed — the whole
# cluster's egress shares one budget, so this bites at cluster scale even
# though a single `docker pull` never would. `mirror.gcr.io` is Google's
# public, anonymous, read-through cache of Docker Hub (the same mirror
# Kubernetes' own docs recommend for exactly this reason) — it is not subject
# to Docker Hub's rate limit because the request never reaches Docker Hub for
# an already-cached tag. Confirmed working end-to-end:
# `mirror.gcr.io/library/node:22-alpine` copied clean via this exact path
# immediately after `docker.io/library/node:22-alpine` had 429'd in the same
# session.
#
# PER-ENTRY SOURCE REGISTRY (2026-09-14): `mirror.gcr.io` ONLY mirrors Docker
# Hub — it MANIFEST_UNKNOWNs anything actually hosted on gcr.io or
# mcr.microsoft.com. dockerhub-mirror-configmap.yaml's images.txt now carries
# an optional second column naming the real source registry for non-Docker-Hub
# entries (kaniko-project/executor from gcr.io; dotnet/sdk, dotnet/aspnet from
# mcr.microsoft.com — digest-pinned, D-030; distroless/static-debian12,
# distroless/cc-debian12 from gcr.io — floating :nonroot tag, added after both
# were found missing since the 2026-09-13 incident, see below), defaulting to
# `mirror.gcr.io` when omitted so every pre-existing line is unchanged. See
# that ConfigMap's header comment for the full format and why these 5 need to
# be here in addition to their `schedule: manual` Replication MRs
# (replication-mcr-*.yaml, replication-gcr-*.yaml, same dir): this job is the
# AUTOMATIC recovery path,
# replication is the faster path for a deliberate version bump.
#
# WHY hostAliases + platform-ca (not the public hostname): confirmed by
# execution — going out through the public Cloudflare-fronted hostname hit
# Cloudflare's 100MB per-request body cap on several of the larger/multi-arch
# node:* blobs (`413 Payload Too Large... <center>cloudflare</center>`), plus
# assorted `502`/`504`/stream PROTOCOL_ERROR under sustained load. This is the
# SAME known gap as docs/operator/gotchas-and-lessons.md's registry-internal-
# routing entry (CF 100MB cap; fix = in-cluster hostAliases to Traefik's
# ClusterIP). Routing this Job the same way ARC's Kaniko build pods already do
# (hook-template.yaml's hostAliases + platform-ca mount) made every retry of
# the same failing images succeed cleanly — confirmed by execution
# (library/postgres:17-alpine, previously 413-ing over the public path,
# copied clean over hostAliases+CA).
#
# DIGEST-PINNED CONSUMERS (next-up's dotnet/sdk+aspnet, the reusable checks-
# job matrix's golang/python/maven/rust/ruby/composer/node/dotnet-sdk step
# pins, tenant-build.yaml's two node@sha256 job containers): this CronJob only
# ever fetches by TAG, so it keeps the tag's CURRENT content mirrored, but a
# consumer pinned to a SPECIFIC historical digest needs that exact digest
# fetched once, separately (`crane copy <src>@sha256:<d> harbor.../base-images/
# <repo>@sha256:<d>`), same as any digest-pin bump today. This list existing
# does not replace that one-time step when a NEW digest pin is introduced or
# bumped -- see the platform-infra PR description for the full one-time
# by-digest fetch log for every pin that existed at mirror-creation time.
#
# NEVER DELETES: `crane copy` has no delete verb, the RobotAccount credential
# it authenticates as (robotaccount-mirror-push.yaml) has no delete permission
# on the project, and this manifest contains no delete/prune/GC step anywhere.
# "Never evict" is therefore a structural property of the mechanism, not just
# a policy choice.
#
# RETRY (2026-09-14, incident-driven): each `crane copy` gets up to 3 attempts
# with a short backoff before it counts as a real failure. Verified by
# execution during the 2026-09-13 recovery: the ~800MB dotnet/sdk image failed
# once on a transient `stream ID …; CANCEL` from Microsoft's CDN, then
# succeeded on an immediate retry — without a retry, a flaky upstream CDN
# fails the whole nightly job (backoffLimit: 1 means the Job itself does not
# retry) and someone ends up debugging a non-problem.
#
# SCHEDULE: nightly at 07:00Z. This header previously read "02:00, ahead of the
# proxy projects' 02:30 GC — no interaction, different projects, just avoiding a
# coincidental resource clash." That was WRONG in a way that mattered and is
# corrected here: Harbor's GC is a SYSTEM-WIDE singleton that puts the whole
# REGISTRY read-only while it runs, so "different projects" buys nothing — a
# 02:00-03:00 mirror run had GC opening a read-only window straight through the
# middle of its push phase. See the schedule: field below for the timing evidence
# and for why 07:00Z (not 22:00Z) is the right destination. A run that copies nothing new is a fast no-op (crane's manifest HEAD
# short-circuits unchanged digests). REFRESH/NEW-IMAGE FLOW: add a line to
# dockerhub-mirror-configmap.yaml (same dir) in a normal PR; the next
# scheduled run picks it up, or trigger immediately with
# `kubectl create job --from=cronjob/dockerhub-mirror-populate -n harbor
# dockerhub-mirror-populate-manual-$(date +%s)`.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dockerhub-mirror-populate
  namespace: harbor
  labels:
    platform.capstone/component: platform
spec:
  # 02:00Z -> 07:00Z (2026-09-16, ENOSPC follow-up). Two separate reasons.
  #
  # (1) COLLISION. Three jobs were stacked on the same hour:
  #       02:00  this mirror run (up to 1h, so 02:00-03:00)
  #       02:00  Harbor tag retention  (harbor-retention-gc-config)
  #       02:30  Harbor garbage collection — which puts the registry READ-ONLY
  #              while it runs, i.e. squarely inside this job's push window.
  #     A push landing in the GC read-only window fails, burns one of the three
  #     retries, and strands another partial multipart upload.
  #
  # (2) BLAST RADIUS. This CronJob has no spec.timeZone, so the cron is UTC and
  #     local is UTC-5. This job saturates the registry and strands ~9GB per
  #     killed run, so the hour it occupies should be the one where the FEWEST
  #     tenant pushes can collide with it. Measured over 680 tag pushes:
  #       02:00Z (21:00 local)  33 pushes   <- the old window
  #       22:00Z (17:00 local)  55 pushes   <- 3rd BUSIEST hour; rejected
  #       07:00Z (02:00 local)   4 pushes   <- quietest usable; chosen
  #     An earlier revision of this change used 22:00Z, which reads like "late
  #     evening" but is 17:00 local — the middle of the working afternoon. Do not
  #     "fix" this back to an hour that looks quiet in UTC without re-checking
  #     what it is locally.
  #
  # 07:00-08:00Z was checked clear against every other schedule on the cluster
  # (vault 03:00, Velero 04:00, mr-prune Sun 04:00, curb-event-sync 06:11,
  # Harbor retention 02:00, Harbor GC 02:30).
  schedule: "0 7 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # DELIBERATELY LEFT AT 3600 — do not raise this. It was suspected of being
      # broken during the 2026-09-16 ENOSPC incident because `kubectl get jobs`
      # showed DURATION of 13h and 37h. It is not broken: `.status.conditions`
      # shows Failed/DeadlineExceeded at exactly 3600s after startTime for all
      # three failed runs. The long DURATION is a kubectl display artifact —
      # `.status.completionTime` is only set on SUCCESS, so for a failed Job
      # kubectl renders `now - startTime`, which grows forever.
      #
      # The deadline firing is nonetheless part of the leak: SIGKILL mid-`crane
      # copy` strands the in-flight multipart uploads, ~9GB per killed run
      # (measured from PVC utilisation: clean ~14-15pp steps at each kill window,
      # flat in between). RAISING the deadline would make that WORSE, not better —
      # a 4h window stranding ~4x the bytes — so the containment is
      # registry.upload_purging (age 24h, applicationsets/harbor-app.yaml), not a
      # longer rope here.
      #
      # A run that gets killed is not lost work: `crane copy` skips images already
      # present, so each night resumes where the last left off and the list
      # converges over a few runs. The 1h cap is what bounds the per-night damage.
      # The skip behaviour is evidenced, not assumed — the 09-12 and 09-13 runs
      # completed in 26s and 23s against this same 30-image list, which is only
      # possible if already-present images are skipped outright.
      #
      # ⚠ CAVEAT — convergence holds only while the job still fails CLEANLY, and
      # right now the evidence does not show it converging. Since the 09-14 list
      # expansion there have been three consecutive DeadlineExceeded kills with no
      # decrease in per-run damage (~14-15pp of the PVC each time). Capacity is the
      # reason: library/rust:1-slim alone took 15m27s for ONE image, so a 3600s
      # budget is realistically ~4 large images, against a 30-image list.
      #
      # So: if the run at 07:00Z is ALSO killed, stop treating this as transient.
      # The list needs structural attention — a per-image deadline, or splitting
      # the large pulls across runs — because until then registry.upload_purging
      # is permanently load-bearing rather than a safety net, and it is the only
      # control standing between this leak and a repeat ENOSPC.
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            platform.capstone/component: platform
        spec:
          restartPolicy: Never
          hostAliases:
            - ip: "10.97.22.53"   # kube-system/traefik ClusterIP — see header comment
              hostnames:
                - harbor.capstone.uamishub.com
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: crane
              image: gcr.io/go-containerregistry/crane:debug
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: SSL_CERT_FILE
                  value: /platform-ca/ca.crt
                - name: HOME
                  value: /home/mirror
                - name: ROBOT_USER
                  value: "robot$base-images+mirror-push"   # deterministic: robot$<project>+<robot-name>
                - name: ROBOT_PW
                  valueFrom:
                    secretKeyRef:
                      name: base-images-mirror-push
                      key: attribute.secret
              command:
                - sh
                - -c
                - |
                  # set -f (noglob). This script does `set -- $line` — an UNQUOTED
                  # expansion — so every field of every list entry is subject to
                  # pathname expansion. Any entry containing a glob character would be
                  # expanded against the container filesystem instead of being treated
                  # as an image ref. No current entry triggers it, which is exactly how
                  # the identical exposure survived unnoticed in the retention job one
                  # directory over until it was hit for real (`**` expanding to
                  # "bin dev etc home lib proc root sys tmp usr var", 2026-09-16).
                  # Pathname expansion is never wanted anywhere in this script.
                  set -ef
                  crane auth login harbor.capstone.uamishub.com -u "$ROBOT_USER" -p "$ROBOT_PW"

                  # Up to 3 attempts per image with a short backoff — a flaky
                  # upstream CDN (verified: Microsoft's, on the ~800MB
                  # dotnet/sdk image) must not fail the whole nightly run.
                  #
                  # $3 (optional) = a `crane copy --platform` value, e.g. "linux/amd64".
                  # THE MULTI-ARCH TAX (2026-09-21, verified by execution): a plain
                  # `crane copy` of a floating TAG copies the ENTIRE manifest list —
                  # every platform upstream ships (5 for the distroless images below,
                  # 10-16 for a typical Docker Hub official image) — even though every
                  # node in this cluster is amd64 (`kubectl get nodes -o wide`,
                  # confirmed). Measured: `library/rust:1-slim` unfiltered took 15m27s
                  # (the figure already on record below); the SAME copy with
                  # `--platform linux/amd64` took 7.3s, a ~127x reduction, because
                  # 90-94% of the bytes a full copy transfers are for architectures
                  # nothing here can ever run. That tax, repeated across a ~30+ entry
                  # list inside one activeDeadlineSeconds: 3600 budget, is why this job
                  # has been SIGKILLed mid-run three nights running (see the note below)
                  # with the tail of the list never reached at all — not a fluke, a
                  # structural consequence of paying the multi-arch tax on every tag
                  # entry.
                  #
                  # SCOPED TO TAG ENTRIES ONLY — digest-pinned entries are NOT touched
                  # here. A `@sha256:...`-pinned entry is called with NO platform arg
                  # (see the call site below) and this function leaves it as a plain
                  # `crane copy`, even though checking (2026-09-21, `crane manifest`)
                  # shows all 3 current digest-pinned entries ALSO pin an
                  # index/manifest-list digest, not a single-platform one, so they pay
                  # this same tax today. They are deliberately left alone: the pin is
                  # to the INDEX's own digest, and `crane copy --platform ...` would
                  # push a single-platform manifest under a DIFFERENT digest at the
                  # destination — breaking both this script's own pin-check below
                  # (which asserts the ORIGINAL index digest still resolves post-copy)
                  # and any consumer's `FROM ...@sha256:<index-digest>`. Narrowing these
                  # safely needs a real inventory first (which consumers pin the index
                  # vs. an already-platform-specific digest, and updating each pin to
                  # match) — out of scope for this change, flagged here so it doesn't
                  # read as solved.
                  copy_with_retry() {
                    src_ref="$1"
                    dst_ref="$2"
                    platform_arg="${3:-}"
                    attempt=1
                    max_attempts=3
                    while [ "$attempt" -le "$max_attempts" ]; do
                      if [ -n "$platform_arg" ]; then
                        if crane copy --platform "$platform_arg" "$src_ref" "$dst_ref"; then
                          return 0
                        fi
                      else
                        if crane copy "$src_ref" "$dst_ref"; then
                          return 0
                        fi
                      fi
                      echo "=== attempt $attempt/$max_attempts failed for $dst_ref ==="
                      attempt=$((attempt + 1))
                      [ "$attempt" -le "$max_attempts" ] && sleep 5
                    done
                    return 1
                  }

                  FAIL=0
                  while IFS= read -r line; do
                    case "$line" in
                      ''|'#'*) continue ;;
                    esac
                    # Word-split on whitespace: field 1 = image-ref
                    # (repo:tag or repo@sha256:digest), field 2 = optional
                    # source registry (default mirror.gcr.io — back-compat
                    # with every pre-existing entry). See
                    # dockerhub-mirror-configmap.yaml's header for the format.
                    set -- $line
                    img="$1"
                    src="${2:-mirror.gcr.io}"

                    # A DIGEST-PINNED ENTRY MUST STILL LAND WITH A TAG.
                    # `crane copy src@sha256:X dst@sha256:X` stores the manifest in
                    # Harbor UNTAGGED, and Harbor's nightly GC runs with
                    # delete_untagged:true — so a digest-only mirror entry is deleted
                    # the very next night, every night, forever.
                    #
                    # This was not theoretical. Verified from GC 1832's own log,
                    # 2026-09-15T02:30:04Z:
                    #   delete the untagged artifact: base-images/dotnet/sdk
                    #     Digest:(sha256:5ef85cc12cb25be6...)
                    #   delete the untagged artifact: base-images/dotnet/aspnet
                    #     Digest:(sha256:9a464e9a7e8c6144...)
                    # Those are exactly the two digests next-up's Dockerfile pins, and
                    # their removal broke every next-up build with
                    # `unable to complete operation after 0 attempts`. The same pair had
                    # already been hand-restored on 09-14 (dotnet-mirror-fix,
                    # dotnet-sdk-retry) and GC deleted them again the next night — a
                    # loop, because the restore reproduced the untagged state.
                    # kaniko-project/executor is pinned by digest in this same list and
                    # survived ONLY because its replication MR happens to give it a tag
                    # (v1.23.2-debug). That is luck, not design.
                    #
                    # So: derive a stable tag from the digest. The manifest content is
                    # unchanged, therefore the DIGEST IS UNCHANGED, therefore every
                    # existing `FROM ...@sha256:...` pin keeps resolving with no change
                    # on the consumer side. The tag exists purely to keep the manifest
                    # reachable, which is what stops GC reclaiming it.
                    # `plat`: the multi-arch-tax fix (see copy_with_retry's header
                    # comment) applies ONLY to tag entries. A digest-pinned entry keeps
                    # `plat=""` (plain, unfiltered `crane copy`) — deliberately, not an
                    # oversight; see that same comment for why.
                    plat=""
                    case "$img" in
                      *@sha256:*)
                        _repo="${img%@*}"
                        _dg="${img#*@}"
                        # `repo:tag@sha256:digest` is a VALID ref and is in use on this
                        # platform right now (npm-mirror runs
                        # dockerhub-proxy/verdaccio/verdaccio:5@sha256:9d622d25...).
                        # Without this, _repo keeps its tag and the destination becomes
                        # `library/foo:5:pinned-9d622d25...` — two tags, which crane
                        # rejects. It fails closed rather than corrupting anything, but
                        # it fails on an entry shape someone will eventually add here.
                        case "$_repo" in *:*) _repo="${_repo%:*}" ;; esac
                        _short=$(echo "$_dg" | sed 's/^sha256://' | cut -c1-12)
                        dst="harbor.capstone.uamishub.com/base-images/${_repo}:pinned-${_short}"
                        ;;
                      *)
                        dst="harbor.capstone.uamishub.com/base-images/${img}"
                        plat="linux/amd64"
                        ;;
                    esac

                    echo "=== COPYING ${src}/${img} -> ${dst} ${plat:+(platform=$plat)} ==="
                    if copy_with_retry "${src}/${img}" "$dst" "$plat"; then
                      # For a digest entry, prove the pin still resolves. A copy that
                      # "succeeded" but changed the digest would silently leave every
                      # consumer broken, which is the failure being fixed.
                      case "$img" in
                        *@sha256:*)
                          # RETRY THIS TOO. Every other crane call in this file goes
                          # through copy_with_retry because the MCR/GCR CDNs
                          # intermittently reset (`stream ID ...; CANCEL` — observed 3
                          # times in 5 on a single dotnet/sdk restore). A single-shot
                          # assertion turns one transient reset into `PIN BROKEN` on a
                          # copy that actually SUCCEEDED — a false alarm whose text
                          # points at the real bug this change fixes, which is the
                          # worst kind to emit.
                          _pa=1
                          _pok=0
                          while [ "$_pa" -le "$max_attempts" ]; do
                            if crane manifest "harbor.capstone.uamishub.com/base-images/${_repo}@${_dg}" >/dev/null 2>&1; then
                              _pok=1; break
                            fi
                            echo "=== pin check attempt $_pa/$max_attempts failed for ${_repo}@${_dg} ==="
                            _pa=$((_pa + 1))
                            [ "$_pa" -le "$max_attempts" ] && sleep 5
                          done
                          if [ "$_pok" = "1" ]; then
                            echo "=== PIN OK ${_repo}@${_dg} resolves ==="
                          else
                            echo "=== PIN BROKEN: ${_repo}@${_dg} does not resolve after copy ==="
                            FAIL=1
                          fi
                          ;;
                      esac
                      echo "=== OK $img ==="
                    else
                      echo "=== FAILED $img (from $src, after $max_attempts attempts) ==="
                      FAIL=1
                    fi
                  done < /lists/images.txt
                  if [ "$FAIL" = "1" ]; then
                    echo "ONE OR MORE COPIES FAILED — see FAILED lines above"
                    exit 1
                  fi
                  echo "ALL COPIES SUCCEEDED"
              volumeMounts:
                - name: platform-ca
                  mountPath: /platform-ca
                - name: lists
                  mountPath: /lists
                - name: home
                  mountPath: /home/mirror
          volumes:
            - name: platform-ca
              configMap:
                name: platform-ca
            - name: lists
              configMap:
                name: dockerhub-mirror-list
            - name: home
              emptyDir: {}
