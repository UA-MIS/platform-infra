# Curated base-image list for dockerhub-mirror-cronjob.yaml (same dir).
#
# FORMAT (2026-09-14, incident-driven — see docs/operator/base-images.md):
# one entry per line, whitespace-separated:
#
#   <image-ref>  [<source-registry>]
#
# - <image-ref> is `<repo>:<tag>` OR `<repo>@sha256:<digest>` (digest form
#   preserves a SEC digest-pin exactly, same convention as every other
#   digest-pinned reference in this repo — D-030).
# - <source-registry> is OPTIONAL. Omitted = `mirror.gcr.io` (Google's public,
#   anonymous, read-through Docker Hub cache — see the CronJob's header
#   comment for why Docker Hub is never addressed directly). This is BACK-
#   COMPATIBLE: every line that predates this column is still a bare
#   `<image-ref>` and still resolves to `mirror.gcr.io`, unchanged behavior.
# - Blank lines and lines starting with `#` are skipped by the copy loop
#   (this header stays out-of-band above `data:`, but in-list comments are
#   supported for grouping below).
#
# WHY A SOURCE COLUMN AT ALL: incident 2026-09-13 (base-images destroyed,
# see docs/operator/base-images.md) surfaced 3 images the project held that
# this job could never have fetched under the old bare-repo:tag format,
# because `mirror.gcr.io` ONLY mirrors Docker Hub — it 404s/MANIFEST_UNKNOWNs
# anything actually hosted on gcr.io or mcr.microsoft.com. Those 3 were
# previously reachable ONLY via the Harbor-native Replication MRs
# (replication-mcr-*.yaml, replication-gcr-*.yaml, same dir), which are
# `schedule: manual` — they do NOT self-heal on a project recreate; a human
# has to remember to POST an execution. Carrying them here too means the
# nightly run (which IS automatic and idempotent — a re-copy of an unchanged
# digest is a fast no-op) recovers them without anyone remembering a manual
# step. This does not replace the Replication MRs (leave them — they're the
# faster/native path for a deliberate version bump); it closes the
# automatic-recovery gap they leave open.
#
# "How does a new version get in": add/edit a line here (a normal, reviewable
# PR), then either wait for the next scheduled run or trigger one immediately
# (`kubectl create job --from=cronjob/dockerhub-mirror-populate -n harbor
# dockerhub-mirror-populate-manual-$(date +%s)`). Removing a line does NOT
# delete anything already mirrored — the CronJob only ever adds/updates
# (crane copy is a push, never a delete), so an old entry simply stops being
# refreshed, it is never cleaned up automatically. That is intentional: an
# image a tenant still depends on must never vanish just because this list
# was tidied.
#
# Every entry here corresponds 1:1 to a FROM line, CI `container:` image, or
# scaffolder fragment base image found in: next-up, mychef, curb-web, ida-llm,
# springais, attributeextractor, and platform-services/backstage/templates/
# _fragments/**. See the platform-infra PR description for the full mapping,
# and docs/operator/base-images.md for the authoritative current list.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dockerhub-mirror-list
  namespace: harbor
  labels:
    platform.capstone/component: platform
data:
  images.txt: |
    # ORDER IS LOAD-BEARING. This file is processed TOP TO BOTTOM by a job capped at
    # activeDeadlineSeconds: 3600, and when there is real work to do that budget does
    # not cover the whole list — library/rust:1-slim alone measured 15m27s. On
    # 2026-09-14/15/16 the run was SIGKILLed at exactly 3600s having reached roughly
    # entry 23, three nights running, and the tail never executed at all.
    #
    # That is why the DIGEST-PINNED entries are first. They were last (28-30), sitting
    # directly behind a block of four entries that were themselves broken, so they
    # were never reached — and they are the entries whose consumers pin by digest and
    # break hardest when the artifact is missing (next-up's build outage, 2026-09-16).
    # They are also the cheapest entries in the file: three small images that are a
    # fast no-op once mirrored.
    #
    # Rule of thumb when adding entries: anything a tenant pins BY DIGEST goes at the
    # top, because a missing digest-pinned image cannot be worked around by the
    # consumer. Bulk tag-based images go below.

    # --- Digest-pinned, FIRST (see note above) ---
    # kaniko executor: needed by EVERY build (Kaniko itself). Also covered by
    # replication-gcr-kaniko-executor.yaml (manual-trigger); this entry is the
    # automatic-recovery path.
    kaniko-project/executor@sha256:c3109d5926a997b100c4343944e06c6b30a6804b2f9abe0994d3de6ef92b028e gcr.io

    # --- MCR (explicit source; digest-pinned, D-030) ---
    # Also covered by replication-mcr-dotnet-{sdk,aspnet}.yaml (manual-trigger);
    # these entries are the automatic-recovery path.
    dotnet/sdk@sha256:5ef85cc12cb25be6ec319a7392d1e9efd53c3bc8abb971c53d8058a473f09053 mcr.microsoft.com
    dotnet/aspnet@sha256:9a464e9a7e8c6144631020975f703c89034fe386417cb740620df69c2c6cfe24 mcr.microsoft.com

    # --- GCR (explicit source; floating tag, NOT digest-pinned) ---
    # backend/go and backend/rust-axum's scaffold Dockerfiles FROM these for the
    # runtime stage. Deliberately NOT digest-pinned (owner directive, see
    # replication-gcr-distroless-{static,cc}.yaml's header: distroless images are
    # not semver-tagged per patch upstream, so a floating :nonroot tag is the
    # correct convention here, matching the fragments' own FROM lines) -- so,
    # unlike the digest-pinned block above, these need no synthetic pinned-<short>
    # tag rewrite: `crane copy` lands them tagged `:nonroot` directly, which is
    # already enough to keep nightly GC (delete_untagged:true) from reclaiming
    # them. Small images, placed early (same reasoning as the digest-pinned
    # block): every fragment's boot-and-probe CI check depends on these existing.
    #
    # Also covered by replication-gcr-distroless-{static,cc}.yaml (manual-
    # trigger, policy_id 4/6); this entry is the automatic-recovery path -- see
    # docs/operator/base-images.md's "How it gets (re)populated" for why both
    # exist. Added after both were found missing (never re-triggered since the
    # 2026-09-13 base-images incident) failing wizard-green-check's
    # boot-and-probe job -- see that doc's Incident section for the full history
    # and the platform-infra PR that added this entry for the restoration log.
    distroless/static-debian12:nonroot gcr.io
    distroless/cc-debian12:nonroot gcr.io

    # --- Docker Hub (source defaults to mirror.gcr.io) ---
    library/python:3.12-slim
    library/python:3.11-slim
    library/python:3.12-slim-bookworm
    library/node:22-alpine
    library/node:18-alpine
    library/node:24.16-alpine
    library/node:24.16-trixie-slim
    library/node:24.16-trixie
    library/node:24-trixie
    library/node:24-trixie-slim
    library/node:22-bookworm-slim
    library/nginx:1.27-alpine
    library/nginx:1.29-alpine
    nginxinc/nginx-unprivileged:1.27-alpine
    library/golang:1.23
    library/golang:1.23-alpine
    library/golang:1.26-alpine
    library/composer:2
    library/php:8.4-cli
    library/ruby:3.3-slim
    library/ruby:3.3
    library/rust:1-slim
    library/rust:1-slim-trixie
    library/maven:3.9-eclipse-temurin-21
    library/eclipse-temurin:21-jre
    library/postgres:17-alpine
    library/python:3-slim

