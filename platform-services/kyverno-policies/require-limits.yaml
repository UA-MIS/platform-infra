# require-limits — every container must declare BOTH cpu and memory resource
# limits. Without a limit a single runaway container can starve/OOM-kill its
# node's neighbors — on this 6-node homelab (3 OptiPlex control-plane + 3 Mac
# workers) that blast radius is a much bigger fraction of capacity than on a
# large cloud cluster.
#
# CRITICAL SAFETY (see verify-image-signature.yaml for the full rationale, shared
# across all three policies in this dir):
#   - failurePolicy: Ignore — a down Kyverno webhook fails OPEN, never blocking
#     scheduling.
#   - exclude kube-system / argocd / vault / rook-ceph / cert-manager (+ kyverno
#     itself) — the control plane, GitOps engine, secrets store, storage layer,
#     cert issuer, and the policy engine's own pods are never gated by policies
#     that engine itself runs.
#
# ⚠ OPERATOR REVIEW: `validationFailureAction: Enforce` BLOCKS a container
# missing cpu OR memory limits at admission, cluster-wide except the excluded
# namespaces above. Several platform addons (Harbor's many sub-components,
# monitoring stack, ARC runners, Backstage) may not all set explicit limits
# today — confirm before this syncs live, or add their namespaces to the
# exclude list here as a temporary grace period while limits are backfilled.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Requires every container to declare both cpu and memory resource limits.
spec:
  validationFailureAction: Enforce
  failurePolicy: Ignore   # CRITICAL SAFETY — see header. A down webhook fails OPEN.
  background: true
  rules:
    - name: require-container-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - argocd
                - vault
                - rook-ceph
                - cert-manager
                - kyverno
      validate:
        message: "Every container must set resources.limits.cpu and resources.limits.memory."
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              resources:
                limits:
                  cpu: "?*"
                  memory: "?*"
          - list: "request.object.spec.initContainers"
            pattern:
              resources:
                limits:
                  cpu: "?*"
                  memory: "?*"
