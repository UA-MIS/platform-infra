# ============================================================================
# backstage-process-build-push.yaml — CI for "The Process" platform image
# (P5 / ADR-029 §8, D-046). Builds the custom Backstage portal image from the
# in-repo monorepo (platform-services/backstage/app) and pushes it to the
# dedicated Harbor `backstage` project.
#
# This is a PLATFORM-COMPONENT build (not a tenant golden-path build) — The
# Process is part of the platform, so it lives here in platform-infra rather
# than going through the team-sample-app .devops/promotion.yaml resolver. The
# build SHAPE is identical to the tenant golden path (team-sample-app's
# build-and-push.yaml) because both ride the same ARC + Kaniko + Harbor robot
# contract; only the tag policy is simpler (no semver prod-gate yet — M1 ships
# a single mutable :<short-sha> dev image; deploy is the manual go-live flip).
#
# WHAT IT DOES
#   - Builds with KANIKO (rootless, no docker daemon/socket) on the self-hosted
#     ARC runners (runs-on: ua-mis-kaniko, containerMode:kubernetes, non-root).
#   - Pushes to the dedicated Harbor project:
#       harbor.capstone.uamishub.com/backstage/backstage-process:<short-sha>
#     using the least-privilege PUSH robot secret `harbor-push` (pull+push on
#     the `backstage` project ONLY — minted via `make harbor-push-robot
#     NAME=backstage`), consumed at /kaniko/.docker/config.json. Harbor scans on
#     push (D-028) — no Trivy step here (no dup).
#
# TAG / PUSH POLICY (M1):
#   - push to main touching the app   -> :<short-sha>  (mutable dev image, PUSHED)
#   - pull_request touching the app   -> BUILD ONLY (--no-push). PR code is
#                                        untrusted; validated, never pushed.
#   The deploy is NOT auto-bumped: a human flips the Application's image.tag to
#   the built <short-sha> at go-live (the deploy-enable batch). No Image Updater.
#
# CONTAINER-MODE SHAPE: the ARC runners are containerMode:kubernetes, which
# REQUIRES every job to declare a `container:` ("Jobs without a job container are
# forbidden on this runner") — job steps run in that container pod, not on the
# runner pod. So:
#   - the JOB CONTAINER is a small node image (node:24-trixie-slim) — it just needs
#     node for actions/checkout + a shell for the resolve step. (checkout has no git
#     in this image and falls back to a REST tarball download, which is fine for a
#     build context.) It is NOT the Kaniko image: the runner internals need node/sh,
#     which the scratch-based Kaniko image lacks.
#   - the KANIKO build is a `uses: docker://...` container-action STEP, which the
#     runner-container-hooks execute in a SEPARATE pod from the Kaniko image with
#     the shared _work volume mounted (the checked-out repo = Kaniko's context), and
#     the container-hook template injects the harbor-push cred into THAT pod.
# (The earlier "job runs on the runner pod, no container" shape was wrong for
# containerMode:kubernetes — it hard-fails at "Set up job".)
#
# The multi-stage Dockerfile builds Backstage from source INSIDE the image
# (yarn install + tsc + build:backend), so this is a single self-contained Kaniko
# invocation — no host pre-build step. apt in the build stage goes over HTTPS
# (:443) to match the :443-only runner egress (SEC-014) — see the Dockerfile.
# ============================================================================
name: backstage-process-build-push

on:
  workflow_dispatch: {}   # manual trigger (added so a rebuild does not require an app/** change)
  push:
    branches: [main]
    # Only rebuild when something that actually lands in the runtime image changes.
    # SCOPE (D-046):
    #   - The image is built from `platform-services/backstage/app/**` ONLY — the
    #     in-repo Backstage monorepo, INCLUDING the in-tree plugins under
    #     `app/plugins/**` (e.g. scaffolder-backend-module-capstone), which ARE
    #     compiled into the backend bundle. So plugin-source churn legitimately
    #     rebuilds the image.
    #   - SIBLINGS of `app/` are NOT in the image and are already excluded by the
    #     `app/**` anchor: `platform-services/backstage/{templates,catalog,scripts}/**`
    #     (scaffolder templates, catalog-location docs, helper scripts). Editing
    #     those no longer triggers this build.
    #   - Files under `app/` that the multi-stage Dockerfile strips out — unit tests
    #     and markdown — are excluded below so a test-only/doc-only change doesn't
    #     trigger a no-op rebuild+push. (A commit that ALSO touches a real `.ts`
    #     source file still matches the positive anchor and rebuilds — correct.)
    paths:
      - "platform-services/backstage/app/**"
      - "!platform-services/backstage/app/**/*.test.ts"
      - "!platform-services/backstage/app/**/*.md"
      - ".github/workflows/backstage-process-build-push.yaml"
  pull_request:
    paths:
      - "platform-services/backstage/app/**"
      - "!platform-services/backstage/app/**/*.test.ts"
      - "!platform-services/backstage/app/**/*.md"
      - ".github/workflows/backstage-process-build-push.yaml"

# Least privilege for the workflow token. `contents: read` is all actions/checkout
# needs. The registry push is authenticated by the Harbor `harbor-push` robot —
# NOT GITHUB_TOKEN (no packages/registry scope is granted). build-and-push
# RE-DECLARES `id-token: write` for itself (cosign keyless signing, supply-chain
# hardening, same as tenant-build.yaml's build-and-push job).
permissions:
  contents: read

# Don't pile up redundant builds for the same ref; cancel superseded runs.
concurrency:
  group: backstage-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Harbor image repo for The Process (dedicated `backstage` project, D-046).
  IMAGE_REPO: harbor.capstone.uamishub.com/backstage/backstage-process
  # Kaniko LAYER CACHE repo (CI-fast, #237). A sibling repository in the SAME dedicated
  # `backstage` Harbor project as the image, so the existing project-scoped `harbor-push`
  # robot (pull+push on the `backstage` project) already has write access to it — no new
  # cred. Harbor auto-creates the repo on first cache push. Kaniko writes each Dockerfile
  # stage's result here and, on the next build whose earlier stages are byte-identical,
  # PULLS them instead of re-running — so a commit that doesn't touch package.json /
  # yarn.lock skips the ~15-min `yarn install` stage. Cache is written ONLY on push
  # (main) builds; untrusted PR builds stay build-only and never write cache (below).
  CACHE_REPO: harbor.capstone.uamishub.com/backstage/cache
  # Where the Harbor push cred lands inside the Kaniko step pod (Kaniko's default
  # DOCKER_CONFIG dir). The platform runner's container-hook template injects
  # secret `harbor-push` (dockerconfigjson) -> config.json here. Only this value
  # changes if the platform ever mounts the dockerconfigjson at a different path.
  DOCKER_CONFIG_DIR: /kaniko/.docker

jobs:
  build-and-push:
    runs-on: ua-mis-kaniko
    # Surfaced to the downstream bump-portal job: the push decision and the exact
    # 12-char tag that was just built+pushed (so bump-portal writes THAT tag).
    outputs:
      PUSH: ${{ steps.resolve.outputs.PUSH }}
      SHORT_SHA: ${{ steps.resolve.outputs.SHORT_SHA }}
    # REQUIRED by containerMode:kubernetes (see header). FULL node image (NOT
    # -slim): besides node + a shell for the resolve step, the post-push
    # supply-chain-verify composite action needs curl + tar + sha256sum + a real
    # /etc/ssl/certs/ca-certificates.crt bundle (see that action's header) — -slim
    # ships none of these. The Kaniko build still runs in its OWN pod via the
    # `uses: docker://` step, so this image does NOT need Kaniko itself.
    container:
      image: node:24-trixie
    # cosign keyless signing needs the OIDC ID-token this grants (workflow default
    # permissions above is contents:read only).
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout (build context = the Backstage monorepo)
        uses: actions/checkout@v4

      - name: Resolve image tag + push decision
        id: resolve
        run: |
          set -eu
          # Short SHA is the dev image tag (mutable; the human bumps the
          # Application to this exact tag at go-live).
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          IMAGE="${IMAGE_REPO}:${SHORT_SHA}"
          # Push on real pushes to main; PR builds validate only (untrusted code).
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            PUSH=true
          else
            PUSH=false
          fi
          {
            echo "IMAGE=${IMAGE}"
            echo "PUSH=${PUSH}"
            # SHORT_SHA is surfaced as a job output too — the bump-portal job REUSES
            # this exact 12-char tag (never recomputes it) to write the deploy manifest,
            # so the built tag and the deployed tag can never drift (the #110 7-vs-12
            # class of bug is structurally impossible).
            echo "SHORT_SHA=${SHORT_SHA}"
          } | tee -a "$GITHUB_OUTPUT"

      # --- Kaniko build as a container-action STEP (its own pod; shared _work) ---
      # `uses: docker://` runs the Kaniko image in a separate job-step pod with the
      # checked-out repo mounted. We override the entrypoint with a tiny sh wrapper
      # so we can (a) fail closed if a push build is missing its cred, and (b) build
      # vs. --no-push from the resolver's PUSH decision.
      #
      # KANIKO MEMORY (OOM fix): the build stage runs `yarn install` (~2800 pkgs,
      # +1.09 GiB node_modules + native modules), then Kaniko snapshots the full
      # filesystem. The Kaniko step-pod (patched by arc/hook-template.yaml) has NO
      # memory limit, so the default `full` snapshot mode + in-memory compressed-layer
      # cache grew until the NODE OOM-killed the pod mid-snapshot ("Taking snapshot of
      # full filesystem..." -> container-hook failure, run 28622490073). Two
      # correctness-safe reducers on the executor below (they change HOW snapshots are
      # computed/cached, not the produced image):
      #   --snapshot-mode=redo        hash mtime+size+perms, not file CONTENT (cheaper)
      #   --compressed-caching=false  do not retain compressed layers in RAM (big saver
      #                               on the 1 GiB node_modules layer)
      #   --use-new-run               detect RUN-command changes WITHOUT a full-fs
      #                               snapshot -- redo+compressed-caching alone cleared
      #                               the yarn-install snapshot but the retained
      #                               per-RUN snapshot memory then stacked with the next
      #                               heavy build process (`yarn tsc`) and re-OOMed the
      #                               unbounded pod (run 28623210989, died 11s into tsc).
      #                               new-run removes those RUN snapshots entirely.
      # --reproducible is kept (deterministic timestamps); its memory cost is at
      # finalize, after the peak-snapshot memory is freed.
      - name: Build (and push) with Kaniko
        uses: docker://gcr.io/kaniko-project/executor:v1.23.2-debug
        with:
          entrypoint: /busybox/sh
          args: >-
            -c '
            set -eu;
            CFG="${DOCKER_CONFIG_DIR}/config.json";
            if [ "${PUSH}" = "true" ] && [ ! -s "$CFG" ]; then
              echo "ERROR: Harbor push credential not found at $CFG — the platform" \
                   "runner must inject secret harbor-push (container-hook template)." \
                   "Run: make harbor-push-robot NAME=backstage KUBE_CONTEXT=admin@capstone." \
                   "Refusing an unauthenticated push." >&2;
              exit 1;
            fi;
            COMMON="--context=dir://${GITHUB_WORKSPACE}/platform-services/backstage/app
                    --dockerfile=packages/backend/Dockerfile
                    --destination=${IMAGE}
                    --reproducible
                    --snapshot-mode=redo
                    --compressed-caching=false
                    --use-new-run
                    --verbosity=info";
            if [ "${PUSH}" = "true" ]; then
              echo "==> building + pushing ${IMAGE} (layer cache: ${CACHE_REPO})";
              /kaniko/executor $COMMON --cache=true --cache-repo="${CACHE_REPO}" --image-name-with-digest-file=${GITHUB_WORKSPACE}/.image-digest;
            else
              echo "==> PR build-only validation for ${IMAGE} (no push, no cache write)";
              /kaniko/executor $COMMON --no-push --tar-path=/tmp/image.tar;
            fi
            '
        env:
          IMAGE: ${{ steps.resolve.outputs.IMAGE }}
          PUSH: ${{ steps.resolve.outputs.PUSH }}
          DOCKER_CONFIG_DIR: ${{ env.DOCKER_CONFIG_DIR }}
          # Kaniko layer-cache repo (see top-level env). Only consumed on push builds.
          CACHE_REPO: ${{ env.CACHE_REPO }}

      # --- post-push supply chain: Trivy gate + cosign sign + syft SBOM ---------
      # PUSH-only (nothing to verify for a --no-push PR validation build). Shared
      # composite action with tenant-build.yaml's build-and-push job — a
      # threshold/version bump ships to both at once via @v1.
      - name: Capture built image digest
        if: ${{ steps.resolve.outputs.PUSH == 'true' }}
        id: digest
        run: |
          set -eu
          DIGEST_FILE="${GITHUB_WORKSPACE}/.image-digest"
          [ -s "${DIGEST_FILE}" ] || {
            echo "ERROR: kaniko did not write a digest file at ${DIGEST_FILE} (expected" \
                 "--image-name-with-digest-file to run on the push path)." >&2
            exit 1
          }
          IMAGE_REF="$(cat "${DIGEST_FILE}")"
          echo "built image ref: ${IMAGE_REF}"
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Supply-chain verify (Harbor Trivy gate + cosign sign + syft SBOM)
        if: ${{ steps.resolve.outputs.PUSH == 'true' }}
        # LOCAL ref (not the remote UA-MIS/platform-infra@v1 form): this job already
        # ran `actions/checkout@v4` above (step "Checkout (build context = the
        # Backstage monorepo)"), so ./.github/actions/... resolves against the
        # checked-out repo — always in sync with main, no git-tag dependency. The
        # remote @v1 ref broke every run once this action was added to main AFTER
        # the v1 tag was cut (v1 doesn't contain .github/actions/supply-chain-verify).
        # This workflow is NOT reusable/externally-versioned like tenant-build.yaml,
        # so there's no reason to pin to a tag here.
        uses: ./.github/actions/supply-chain-verify
        with:
          image-ref: ${{ steps.digest.outputs.IMAGE_REF }}
          # Dedicated `backstage` Harbor project (D-046); repo leaf `backstage-process`
          # (see IMAGE_REPO, top-level env) — static, unlike the tenant workflow which
          # derives the project per-team.
          harbor-project: backstage
          harbor-repo: backstage-process
          docker-config-dir: ${{ env.DOCKER_CONFIG_DIR }}
          sbom-artifact-name: sbom-backstage-process-${{ github.run_id }}-${{ github.run_attempt }}

  # ============================================================================
  # bump-portal — the GitOps deploy-bump for The Process portal (mirrors the
  # tenant `bump-dev` job in tenant-build.yaml). After build-and-push pushes the
  # portal image, rewrite the Application's Helm image.tag to the just-built
  # 12-char sha and commit it to main; ArgoCD (platform-backstage-process has
  # syncPolicy.automated) syncs the new image into the live portal — hands-free.
  # This KILLS the manual go-live tag flip (the recurring 12-vs-7-char toil).
  #
  # WHY A GITHUB APP TOKEN (not GITHUB_TOKEN): platform-infra `main` has CLASSIC
  # branch protection with "require a pull request before merging". A protected
  # branch can only be pushed directly by an identity on the branch's
  # bypass-pull-request-allowances list. The ephemeral `github-actions[bot]`
  # (the identity behind the job's GITHUB_TOKEN) CANNOT be added to that list —
  # GitHub's classic-protection bypass picker offers only "Organization and
  # repository administrators" plus GitHub Apps; the bot user is not selectable
  # (verified: empty API bypass list, no bot option in the dropdown). GitHub APPS
  # ARE selectable there, so this job authenticates the push with a short-lived
  # GitHub App INSTALLATION TOKEN minted by actions/create-github-app-token. The
  # App (see PR body / operator runbook) is added to main's bypass list by name,
  # which is what actually lets the direct push land on the protected branch.
  #
  # (Tenant repos' bump-dev pushes with plain GITHUB_TOKEN only because those
  # repos are private-on-free-plan with NO branch protection at all — there is no
  # bypass list to satisfy. platform-infra is protected, so it needs the App.)
  #
  # SECURITY (least privilege — SEPARATE job):
  #   - `if:` restricts to a real push to main with PUSH == true. NEVER runs on
  #     pull_request, so UNTRUSTED PR code can never mint or reach the App token.
  #   - the App is a DEDICATED least-privilege CI App: `contents: write` on
  #     platform-infra ONLY (recommended over reusing the auth-critical Backstage
  #     SSO App — see PR body). The installation token is auto-scoped to THIS repo
  #     and auto-revoked by the action's post step.
  #   - the job's own GITHUB_TOKEN is dropped to `contents: read` — the write
  #     authority now comes ENTIRELY from the App installation token, not the
  #     workflow token. build-and-push also keeps read.
  #   - loop guard: the commit message carries `[skip ci]`. (Belt-and-suspenders:
  #     the bump touches only applicationsets/**, which is OUTSIDE this workflow's
  #     `paths:` app/** filter, so it would not re-trigger the build anyway.)
  #   - reuses the EXACT 12-char SHORT_SHA from build-and-push (never recomputed) —
  #     the built tag and the deployed tag are the same value by construction.
  #
  # PROD BOUNDARY: this is main/dev-equivalent ONLY. The portal has a single live
  # env tracking main; there is no prod promotion here (that is #209's domain).
  #
  # ⚠ OPERATOR PREREQ (one-time, GitHub-side — see PR body / runbook): create the
  # dedicated CI App, install it on platform-infra, add repo secrets APP_ID +
  # APP_PRIVATE_KEY, and add the App to main's bypass-pull-request-allowances by
  # NAME. Until all four are done, the app-token step or `git push origin HEAD:main`
  # FAILS LOUD (set -e) — never a silent no-deploy.
  # ============================================================================
  bump-portal:
    needs: build-and-push
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-and-push.outputs.PUSH == 'true' }}
    runs-on: ua-mis-kaniko
    # FULL node image (NOT -slim): this job git-commits + `git push`es to main, and
    # actions/checkout needs git for a real .git + persist-credentials; we also curl
    # yq. -slim ships neither git nor curl.
    container:
      image: node:24-trixie
    # The job's own GITHUB_TOKEN needs NO write scope: the push is authenticated by
    # the App installation token (below), not GITHUB_TOKEN. Kept explicit + read-only
    # so the workflow token can never be the thing that writes to main.
    permissions:
      contents: read
    steps:
      # Mint a short-lived GitHub App installation token. The App is in main's
      # branch-protection bypass list (operator step), so a push authenticated with
      # THIS token lands on the protected branch — unlike github-actions[bot], which
      # GitHub will not let you add to that list. Pinned to a commit SHA (supply-chain
      # hardening); the action auto-scopes the token to this repo and auto-revokes it
      # in its post step. APP_ID + APP_PRIVATE_KEY are repo secrets (operator step).
      - name: Generate GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Install yq (pinned + checksum-verified)
        env:
          YQ_VERSION: v4.44.3
          YQ_SHA256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
        run: |
          set -eu
          curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /usr/local/bin/yq" | sha256sum -c -
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Checkout main (writable; full history for a clean commit base)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Persist the APP INSTALLATION TOKEN as the git credential so the later
          # `git push origin HEAD:main` authenticates as the App (which IS in main's
          # bypass list) rather than github-actions[bot] (which cannot be).
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Bump portal image.tag -> built 12-char sha + commit + push
        env:
          # CONSUME the exact tag build-and-push just pushed (no recompute).
          TAG: ${{ needs.build-and-push.outputs.SHORT_SHA }}
          MANIFEST: applicationsets/backstage-process-app.yaml
          GIT_AUTHOR_NAME: ua-mis-ci
          GIT_AUTHOR_EMAIL: ci@capstone.uamishub.com
          GIT_COMMITTER_NAME: ua-mis-ci
          GIT_COMMITTER_EMAIL: ci@capstone.uamishub.com
        run: |
          set -eu
          # CI checks out as a different uid than the container root → mark the
          # workspace safe so git will operate on it (dubious-ownership guard).
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          # valuesObject makes .backstage.image.tag a REAL yq node. strenv keeps the
          # value a string (yq quotes an all-numeric sha), so the tag is never
          # coerced to an int. This is the whole point of the values->valuesObject
          # refactor: the tag is now addressable in place.
          TAG="${TAG}" yq -i \
            '.spec.source.helm.valuesObject.backstage.image.tag = strenv(TAG)' \
            "${MANIFEST}"
          echo "==> portal Application now pins tag: ${TAG}"
          git diff --unified=0 "${MANIFEST}" || true
          git add "${MANIFEST}"
          # `[skip ci]` so this deploy commit does NOT re-trigger the build (belt).
          git commit -m "chore(backstage): bump portal image to ${TAG} [skip ci]" \
            && echo "committed. ArgoCD (platform-backstage-process, automated) will sync the portal." \
            || { echo "nothing to commit (tag unchanged) — skipping push."; exit 0; }
          # Push to main using the persisted App installation token. The App must be
          # in main's bypass-pull-request-allowances (operator step), else the
          # protected branch rejects this push and it FAILS LOUD (set -e) — never a
          # silent no-deploy.
          git push origin HEAD:main
