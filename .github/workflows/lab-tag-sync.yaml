# ============================================================================
# lab-tag-sync.yaml — SCHEDULED workflow, lives ONLY in platform-infra (students
# cannot modify it — this is the whole point, see below). Replaces the earlier
# design where each student's own CI wrote its own tag file directly
# (adversarial review H-2 — see `.github/workflows/lab-build.yaml`'s header and
# README "Security hardening: H-2" for the full incident this fixes).
#
# WHAT IT DOES, every 5 minutes: reads the (slides-owned, trusted) roster —
# every `labs/*/students.yaml` in `UA-MIS/capstone-labs-fleet` — and for each
# row, asks the GitHub API for that student's repo's default-branch HEAD
# commit SHA, then writes/updates `labs/<labSlug>/tags/<username>.yaml` with
# the 12-char short form, committing every change from this ONE poll in a
# SINGLE commit. This is now the ONLY writer to `labs/*/tags/*.yaml` — no
# student-controlled code touches the fleet repo at all, closing the H-2
# attack surface completely (a student cannot corrupt another student's tag
# file, corrupt `students.yaml`, or `git rm` a lab's directory, because they
# have no credential that can do any of those things).
#
# LATENCY IS FINE (per adversarial review): the labs-students ApplicationSet's
# git generators already requeue on ArgoCD's own ~3min default polling
# interval, so a 5-minute sync cadence here is not the bottleneck.
#
# NOT VERIFIED: whether the build for a given HEAD sha actually SUCCEEDED
# (i.e. whether `ghcr.io/<repo>:<sha12>` really exists) before writing the
# tag — this workflow trusts that lab-build.yaml (triggered on push, same
# repo) will have already run by the time this polls. A failed/slow build
# means the pod sits ImagePullBackOff (self-healing: kubelet retries on its
# own backoff, and the NEXT successful push/poll cycle recovers it) — the
# same tolerance this design already accepts for a fresh student with no tag
# yet (`:unreleased`). Deliberately not hardened further, to keep this thin —
# see README "Backlog" if verifying GHCR package existence before writing
# becomes worth the added complexity.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: lab-tag-sync
  cancel-in-progress: false # queue, don't cancel a mid-commit run

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Install yq (pinned + checksum-verified — same pin as tenant-build.yaml)
        env:
          YQ_VERSION: v4.44.3
          YQ_SHA256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
        run: |
          set -eu
          # L-1: ubuntu-latest is not the root ARC runner every other pinned
          # -install in this repo targets — `sudo` here, trivially, rather
          # than assume the hosted runner's default /usr/local/bin ownership.
          curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -o root -g root -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version

      # ADVERSARIAL REVIEW: TWO separate credentials, deliberately — a broad
      # READ-ONLY token (safe to be broad: it can only ever READ commit
      # metadata, never write/destroy anything) for scanning every student
      # repo's HEAD, and a NARROW token limited to Contents:read/write on
      # ONLY `capstone-labs-fleet` for the actual write. Neither is ever
      # exposed to a student repo — both are platform-infra-only secrets.
      - name: Clone capstone-labs-fleet (roster read + the write target)
        env:
          GH_TOKEN: ${{ secrets.LAB_FLEET_WRITE_TOKEN }}
        run: |
          set -eu
          # L-2: a FULL clone, not --depth 1 — the commit+push step's
          # `git pull --rebase` retry path can fail against shallow history
          # (rebase needs the merge-base, which a depth-1 clone doesn't have
          # once a concurrent write has moved origin/main). The fleet repo is
          # tiny (a handful of small YAML files per lab), so a full clone
          # costs nothing meaningful here.
          git clone "https://x-access-token:${GH_TOKEN}@github.com/UA-MIS/capstone-labs-fleet.git" fleet

      - name: Poll each student's default-branch HEAD, update tag files
        id: sync
        env:
          READ_TOKEN: ${{ secrets.LAB_ROSTER_READ_TOKEN }}
        run: |
          set -eu
          cd fleet
          CHANGED=0
          API="https://api.github.com"
          for students_file in labs/*/students.yaml; do
            [ -f "$students_file" ] || continue
            LAB_SLUG="$(basename "$(dirname "$students_file")")"
            # ADVERSARIAL REVIEW round-4 (path traversal — see the fuller
            # comment on the per-row USERNAME check below): LAB_SLUG is
            # interpolated into the SAME `labs/${LAB_SLUG}/tags/...` path as
            # USERNAME, once per FILE (not per row), so it is validated once
            # here — a `continue` at this point in the `for` body skips the
            # rest of this iteration, i.e. this whole students.yaml file,
            # which is correct: an unsafe directory name should never be
            # trusted for any row inside it.
            case "$LAB_SLUG" in
              ''|*[!a-z0-9-]*|-*|*-)
                echo "WARN: ${students_file} labSlug '${LAB_SLUG}' (from directory name) is not lowercase DNS-safe, skipping whole file"
                continue
                ;;
            esac
            # ADVERSARIAL REVIEW round-5 L-1: tolerate a malformed
            # students.yaml (`yq` erroring under `set -eu` would otherwise
            # kill the ENTIRE run — every other lab, not just this one file
            # — the same "one bad row must not stop the other N" principle
            # this workflow already applies to individual rows, one layer
            # up). `|| echo 0` treats an unparseable file as zero rows
            # (skip it) rather than aborting.
            #
            # ADVERSARIAL REVIEW round-6 R5-2: the tolerance above originally
            # had NO output on either failure path (a `yq` error was
            # redirected to /dev/null and immediately folded into a clean
            # "0" by `|| echo 0` BEFORE any format check could ever see the
            # failure — so a case guard placed AFTER that fallback, like the
            # first version of this fix, could never actually fire for the
            # exact "yq errored" scenario it was written for; verified live
            # via `bash -x`, which showed `COUNT=0` assigned straight from
            # the `|| echo 0` branch with no WARN reachable). A whole lab's
            # roster could drop out of every sync with zero signal anywhere
            # except the ABSENCE of `==>` lines for its students, on an
            # otherwise-green job — the one silent exception in the round
            # themed on eliminating silent failures. Fixed by checking `yq`'s
            # OWN exit status directly (not folding it into the value first),
            # so the WARN fires on genuine failure while a legitimately EMPTY
            # roster (`students.yaml` containing just `[]`, which `yq`
            # resolves cleanly to `0`) still passes through silently — an
            # empty roster is a normal state, not an error.
            if COUNT="$(yq '. | length' "$students_file" 2>/dev/null)"; then
              case "$COUNT" in
                ''|*[!0-9]*)
                  echo "WARN: ${students_file} resolved to a non-numeric row count ('${COUNT}'), skipping whole file"
                  COUNT=0
                  ;;
              esac
            else
              echo "WARN: ${students_file} is not parseable as a list of rows, skipping whole file"
              COUNT=0
            fi
            i=0
            while [ "$i" -lt "$COUNT" ]; do
              ROW="$i"
              USERNAME="$(yq -r ".[$i].username" "$students_file")"
              REPO="$(yq -r ".[$i].repo" "$students_file")"
              ROW_LAB_SLUG="$(yq -r ".[$i].labSlug" "$students_file")"
              i=$((i + 1))
              # L-3: report $ROW (the row just read), not $i (already
              # incremented past it) — otherwise the WARN always names the
              # NEXT row instead of the one that actually failed.
              if [ -z "$USERNAME" ] || [ "$USERNAME" = "null" ] || [ -z "$REPO" ] || [ "$REPO" = "null" ]; then
                echo "WARN: ${students_file} row ${ROW} missing username/repo, skipping"
                continue
              fi
              # ADVERSARIAL REVIEW round-5 L-2: the workflow derives
              # LAB_SLUG from the DIRECTORY name (labs/<slug>/students.yaml),
              # never from the row's own `labSlug` field — so a row whose
              # `labSlug` disagrees with its directory (e.g. `labSlug:
              # "lab-1"` sitting inside `labs/lab1/`) would silently write
              # its tag file under the DIRECTORY's slug while the row itself
              # claims a different one. The merge generator's
              # `[username, labSlug]` join then compares the STUDENTS.YAML
              # row's `labSlug` (mismatched) against the TAG FILE's `labSlug`
              # (correct, directory-derived) and never matches — that
              # student is pinned on `:unreleased` with NO loud failure
              # anywhere: both values are individually well-formed, so
              # neither this workflow's guards nor the chart's fail-guards
              # ever see anything invalid. This is the last silent-failure
              # gap in an otherwise fail-loud contract; catch it here.
              if [ "$ROW_LAB_SLUG" != "$LAB_SLUG" ]; then
                echo "WARN: ${students_file} row ${ROW} labSlug '${ROW_LAB_SLUG}' does not match its directory '${LAB_SLUG}', skipping"
                continue
              fi
              # ADVERSARIAL REVIEW round-4 (path traversal, pre-existing —
              # not a regression from the H-1 heredoc fix): USERNAME is
              # interpolated straight into TAG_FILE below with zero
              # validation. A roster row with e.g. `username: "../students"`
              # would resolve to `labs/<slug>/tags/../students.yaml` ==
              # `labs/<slug>/students.yaml` — OVERWRITING the roster itself
              # with a 3-line tag file, which `git add -A -- labs` then
              # stages and pushes; with `prune: true` on labs-students-
              # appset.yaml, the next ArgoCD sync would delete every student
              # Application in that lab. Post-H-2 a student holds no
              # fleet-write credential, so this needs a SLIDES-side bug to
              # trigger rather than an attacker — but this workflow is
              # specifically the hardened sole writer and should not be one
              # malformed roster row away from wiping a lab. Reject anything
              # that isn't already lowercase-DNS-safe (the SAME contract
              # `_helpers.tpl`'s `lab-app.username` fail-guard already
              # requires downstream) BEFORE it ever touches a path — a `../`
              # sequence, a leading/trailing hyphen, uppercase, or any other
              # non-`[a-z0-9-]` character all fail this case pattern and are
              # skipped, never interpolated into TAG_FILE. (LAB_SLUG got the
              # same treatment above, once per file, not per row.)
              case "$USERNAME" in
                ''|*[!a-z0-9-]*|-*|*-)
                  echo "WARN: ${students_file} row ${ROW} username '${USERNAME}' is not lowercase DNS-safe (^[a-z0-9-]+$, no leading/trailing hyphen), skipping"
                  continue
                  ;;
              esac
              DEFAULT_BRANCH="$(curl -sS -H "Authorization: Bearer ${READ_TOKEN}" \
                -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
                "${API}/repos/${REPO}" | jq -r '.default_branch // empty')"
              if [ -z "$DEFAULT_BRANCH" ]; then
                echo "WARN: cannot resolve default branch for ${REPO} (repo missing / token lacks access?), skipping"
                continue
              fi
              SHA="$(curl -sS -H "Authorization: Bearer ${READ_TOKEN}" \
                -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
                "${API}/repos/${REPO}/commits/${DEFAULT_BRANCH}" | jq -r '.sha // empty')"
              if [ -z "$SHA" ]; then
                echo "WARN: cannot resolve HEAD sha for ${REPO}, skipping"
                continue
              fi
              TAG="$(printf '%s' "$SHA" | cut -c1-12)"
              TAG_FILE="labs/${LAB_SLUG}/tags/${USERNAME}.yaml"
              CUR_TAG=""
              if [ -f "$TAG_FILE" ]; then
                # ADVERSARIAL REVIEW round-5 L-1: tolerate a malformed/
                # partially-written tags/*.yaml (e.g. a hand-edit that isn't
                # a mapping) — demonstrated to otherwise kill the ENTIRE run
                # under `set -eu` (yq exits non-zero -> script aborts ->
                # `changed=` never emitted -> the commit step is skipped ->
                # every OTHER lab's already-resolved tag updates in this same
                # run are discarded too, and that lab's directory is never
                # even reached). `|| echo ""` treats an unreadable tag as
                # "no current tag" instead — CUR_TAG stays empty, so this row
                # falls through to rewriting TAG_FILE with a fresh, valid
                # one, which is exactly the self-healing behavior wanted: the
                # NEXT poll fixes the file the same way a fresh student's
                # first successful poll creates it.
                CUR_TAG="$(yq -r '.tag // ""' "$TAG_FILE" 2>/dev/null || echo "")"
              fi
              if [ "$CUR_TAG" = "$TAG" ]; then
                continue
              fi
              mkdir -p "labs/${LAB_SLUG}/tags"
              # ADVERSARIAL REVIEW M-4: every field QUOTED. ArgoCD's git files
              # generator parses via sigs.k8s.io/yaml -> JSON — an UNQUOTED
              # all-digit 12-char short sha (~1.4% of builds, (10/16)^12) would
              # parse as a JSON NUMBER (`1.23456789012e+11`), which the
              # chart's own `^[a-f0-9]{7,64}$` fail-guard then correctly
              # rejects as invalid — a one-character-looking bug that breaks
              # ~1 in 70 students. An unquoted username/labSlug that happens
              # to be a YAML 1.1 boolean word (`on`, `no`, `yes`, `off`, …)
              # hits the same class of coercion. Quoting every field removes
              # the whole class.
              #
              # ADVERSARIAL REVIEW H-1 (round 3, CRITICAL): this used to be a
              # `cat > "$TAG_FILE" <<EOF ... EOF` heredoc, indented to match
              # the surrounding script (both the body AND the `EOF`
              # delimiter) for readability inside this nested for/while loop.
              # That is a real bash syntax error, NOT a cosmetic one: a
              # heredoc delimiter must sit at column 0 (`<<-EOF` strips only
              # LEADING TABS, never spaces, and this was plain `<<EOF`
              # anyway) — verified live by extracting this exact step via
              # `yaml.safe_load` (the same parse GitHub Actions performs) and
              # running `bash -n` on it: `here-document ... delimited by
              # end-of-file (wanted 'EOF')` / `syntax error: unexpected end
              # of file`. The broken heredoc silently swallowed the rest of
              # the script (both loop `done`s and the `changed=` output),
              # meaning this workflow — the SOLE writer to `tags/*.yaml`
              # after the H-2 fix — never wrote a single file, ever: every
              # student was permanently pinned on `:unreleased`. `printf`
              # sidesteps the whole indentation-sensitive heredoc class
              # rather than just re-indenting it correctly, so a future edit
              # inside this loop can't reintroduce the same bug.
              printf 'username: "%s"\nlabSlug: "%s"\ntag: "%s"\n' \
                "$USERNAME" "$LAB_SLUG" "$TAG" > "$TAG_FILE"
              echo "==> ${TAG_FILE} -> ${TAG}"
              CHANGED=1
            done
          done
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"

      - name: Commit + push (single batched commit for this poll)
        if: steps.sync.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.LAB_FLEET_WRITE_TOKEN }}
        run: |
          set -eu
          cd fleet
          git config user.name "lab-tag-sync"
          git config user.email "lab-tag-sync@users.noreply.github.com"
          # `-A -- labs` (not a `labs/*/tags` glob pathspec, whose cross-`/`
          # matching semantics are easy to get subtly wrong): this workflow
          # only ever writes under labs/<slug>/tags/, so staging everything
          # under labs/ is unambiguous and safe — students.yaml/lab.yaml are
          # never touched by this job.
          git add -A -- labs
          if git diff --cached --quiet; then
            echo "==> nothing actually changed (all resolved tags matched an existing file byte-for-byte), skipping commit"
            exit 0
          fi
          git commit -m "lab-tag-sync: update student build tags"
          # origin already carries the write-token-embedded URL from the
          # clone step above; concurrency: cancel-in-progress:false means this
          # is the only writer at a time, but retry anyway in case of an
          # out-of-band manual commit to the same file between poll and push.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "==> push rejected (attempt $i), rebasing and retrying..."
            git pull --rebase origin main
          done
          echo "FAIL: could not push after 5 attempts"
          exit 1
