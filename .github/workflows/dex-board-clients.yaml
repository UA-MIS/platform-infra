# Keeps the Dex `agile-board` static client in sync with tenants/_boards/ (D-186).
#
# ── THE PROBLEM THIS SOLVES ──────────────────────────────────────────────────
# The wizard commits `tenants/_boards/<team>.yaml` STRAIGHT TO MAIN (zero-touch —
# no PR, no review). That is the whole point of the claim seam, and it works fine
# for everything a board needs EXCEPT one thing: Dex has no wildcard redirect
# URIs, so the board's callback must also be listed in
# platform-services/dex/configmap.yaml.
#
# Because the wizard's commit bypasses PRs, a PR-only gate would not notice the
# gap until somebody opened an unrelated PR — possibly days later.
#
# ⚠ CORRECTION (board #186, 2026-08-27): this header used to say "`make validate`
#   (which runs on PRs)". It did not run anywhere. `make validate` occurred in NO
#   workflow in this repo; the parenthetical was the only mention of it under
#   .github/, and it asserted an enforcement that did not exist.
#   `.github/workflows/validate.yaml` now runs it on pull_request AND on push to
#   main, so guard [6/6] is CI-enforced on the wizard's direct-to-main path too.
#   This workflow is still the better instrument for that path and stays: a red X
#   tells you a board is broken, whereas this opens the fix pre-written, and its
#   10-minute schedule also catches a hand-edit of the generated region that no
#   commit-triggered gate would see.
#
# The failure is the quiet kind: the board deploys, goes Ready, serves
# its landing page, and only dies when a student clicks "Sign in", with an opaque
# OIDC error. A board that looks healthy and cannot be logged into is worse than
# one that never came up.
#
# ── WHY THIS OPENS A PR INSTEAD OF PUSHING TO MAIN ───────────────────────────
# Pushing the fix directly would need a branch-protection BYPASS credential in CI.
# This repo has already considered and rejected exactly that trade for exactly
# this kind of convenience (FIX-10, tenants/_claims/README.md: automating the
# topic-strip "would require handing a CI trigger ... a real widening of the trust
# boundary for a convenience win"). So this workflow uses the DEFAULT
# `GITHUB_TOKEN` and nothing else: it can create a branch and open a PR, which is
# all it needs. No new secret, no bypass actor, no widened trust boundary.
#
# Net effect: drift is detected within ~10 minutes, the fix arrives pre-written,
# and a human clicks merge. ArgoCD syncs the ConfigMap and Stakater Reloader rolls
# Dex automatically (platform-services/dex/deployment.yaml) — so merging the PR is
# genuinely the last human action.
name: dex-board-clients

on:
  push:
    branches: [main]
    paths:
      - "tenants/_boards/**"
      - "platform-services/dex/gen-board-clients.py"
  # Backstop: catches a board file that landed while this workflow was failing,
  # and any hand-edit of the generated region in the ConfigMap.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  # Never let two runs race to open the same PR.
  group: dex-board-clients
  cancel-in-progress: false

permissions:
  contents: write        # create the fix branch (NOT main — it is protected)
  pull-requests: write   # open/update the PR

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the Dex board clients
        id: gen
        run: |
          set -euo pipefail
          python3 platform-services/dex/gen-board-clients.py
          if git diff --quiet -- platform-services/dex/configmap.yaml; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "Dex board clients are in sync."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Dex board clients are OUT OF SYNC with tenants/_boards/ — opening a PR."
            git --no-pager diff -- platform-services/dex/configmap.yaml
          fi

      - name: Open (or update) the fix PR
        if: steps.gen.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH=chore/dex-board-clients
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add platform-services/dex/configmap.yaml
          git commit -m "chore(dex): sync agile-board redirect URIs with tenants/_boards/"
          # Force-push: this branch is a disposable, always-regenerated fix.
          git push --force origin "$BRANCH"

          printf '%s\n' \
            'Generated by `.github/workflows/dex-board-clients.yaml`.' \
            '' \
            'A sprint board was provisioned (a file landed in `tenants/_boards/`) but Dex' \
            'does not yet list its OAuth callback. Dex has no wildcard redirect URIs, so' \
            'until this merges **that board will deploy, report healthy, and fail at' \
            'sign-in** with an opaque OIDC error.' \
            '' \
            'Merging is the last human action required: ArgoCD syncs the ConfigMap and' \
            'Stakater Reloader rolls Dex automatically.' \
            '' \
            'Do not hand-edit the generated region — edit `tenants/_boards/` and let the' \
            'generator run.' \
            > /tmp/pr-body.md

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "chore(dex): sync agile-board redirect URIs with tenants/_boards/" \
              --body-file /tmp/pr-body.md
          else
            echo "PR already open for $BRANCH; the force-push above refreshed it."
          fi
