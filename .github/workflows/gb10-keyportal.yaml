# ============================================================================
# gb10-keyportal.yaml — run appliances/gb10/keyportal/tests/
#
# ── WHY THIS EXISTS ─────────────────────────────────────────────────────────
# The service that authenticates every student, mints their LiteLLM key,
# holds the only plaintext copy of it, and renders the Continue config block
# containing it must have its tests run in CI, not "on whichever machine last
# ran them by hand". Five rounds of security review are recorded in app.py's
# docstrings; those rounds produced tests, and this job runs them.
#
# ── WHAT IT ACTUALLY DOES ───────────────────────────────────────────────────
# Runs the real suite: it drives the FastAPI app through TestClient, parses
# the Continue config block the portal renders with PyYAML (valid YAML, only
# roles/capabilities Continue accepts, the key round-tripping byte for byte),
# and asserts on response headers and escaping.
#
# ── WHY THE MUTATION-CHECK JOB ──────────────────────────────────────────────
# A CI job that passes against broken code manufactures confidence. It applies
# mutations to app.py and requires each to trip a SPECIFIC named test --
# including putting the invalid `roles: [agent]` back.
#
# ── WHY ubuntu-latest, AND WHY NO MATRIX ────────────────────────────────────
# This service runs in exactly one place: a python:3.12-slim container on the
# GB10, single uvicorn process (see keyportal/Dockerfile's own warning about
# --workers). There is no second platform to cover. The
# interpreter is pinned to 3.12 to match the image rather than tracking
# whatever the runner ships.
#
# ── WHY THERE IS NO NETWORK ─────────────────────────────────────────────────
# Nothing here reaches LiteLLM or Cloudflare: every outbound call is mocked at
# httpx, and Cloudflare Access JWT verification is patched out. No secrets are
# needed and none are granted.
# ============================================================================
name: gb10 keyportal

on:
  pull_request:
    paths:
      - 'appliances/gb10/keyportal/**'
      - '.github/workflows/gb10-keyportal.yaml'
  push:
    branches: [main]
    paths:
      - 'appliances/gb10/keyportal/**'
      - '.github/workflows/gb10-keyportal.yaml'
  workflow_dispatch:

concurrency:
  group: gb10-keyportal-${{ github.ref }}
  # Superseded PR pushes are worth cancelling; main history is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    name: run the keyportal suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: appliances/gb10/keyportal
    steps:
      - name: Check out the repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Matches keyportal/Dockerfile's python:3.12-slim. Pinned rather
          # than tracking the runner image, so the interpreter under test is
          # the interpreter in production.
          python-version: '3.12'

      - name: Install dependencies
        run: |
          # requirements-dev.txt pulls in requirements.txt, so this is the
          # production dependency set plus pytest/pytest-mock/PyYAML. Every
          # version in both files is pinned, deliberately: this suite is what
          # decides whether a credential-handling service is correct, so it
          # must not start failing (or, worse, start passing) because a
          # transitive dependency moved.
          python -m pip install --disable-pip-version-check --quiet \
            -r requirements-dev.txt
          python -c "import fastapi, httpx, jwt, yaml; print('deps ok')"

      - name: Run the suite
        run: |
          # -ra so the log records skips with their reasons. One test is
          # skipped by design (tests/test_live_integration.py needs the real
          # appliance); a skip count silently drifting upward is how a suite
          # stops testing things, so it is printed rather than hidden.
          python -m pytest tests/ -q -ra

  mutation-check:
    name: prove the suite catches broken code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: appliances/gb10/keyportal
    steps:
      - name: Check out the repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            -r requirements-dev.txt

      - name: Mutate app.py and require the suite to notice
        run: |
          # Each mutation names the test it MUST newly trip. A mutation that
          # survives, or that only trips something unrelated, fails this job
          # -- that is a gap in the assertions, not a pass. All of them are
          # SILENT failures: each leaves a service that starts, serves 200s
          # and looks right.
          #
          # Mutations are applied to a staged COPY of the tree, never to the
          # checkout, and the script refuses to report at all unless the
          # baseline actually executed the suite (its first version staged
          # the tree wrong, collected 230 import errors, and read that as a
          # clean green baseline).
          python tests/mutation-check.py
