# ============================================================================
# tenant-build.yaml — the CENTRAL, reusable tenant CI pipeline (P2.3, D-032;
# ADR-031 §8). `on: workflow_call`. STAGED: prepare -> (scan + checks) ->
# build-and-push -> bump-dev / bump-staging, as SEPARATE jobs wired with
# `needs:` (ease + reliability over speed — a failed gate stops everything
# downstream).
#
# WHY THIS FILE EXISTS (the retro's #1 fix — stop copying).
#   The whole pipeline was COPIED verbatim into every tenant repo, the scaffolder
#   skeleton, and the Makefile, so a CI fix had to be re-landed in N places — the
#   root cause behind the ~14-bug onboarding saga. Now the orchestration lives
#   HERE, once. Every tenant ships a ~10-line CALLER that does
#     uses: UA-MIS/platform-infra/.github/workflows/tenant-build.yaml@v1
#   so a fix ships ONCE and every tenant picks it up at the pinned @v1 ref.
#   (ADR-031 §8 sketched the central file as build-and-push.yaml; we name it
#   tenant-build.yaml to keep it distinct from the tenant-side CALLER, which is
#   itself .github/workflows/build-and-push.yaml in each tenant repo.)
#
# STAGED PIPELINE (user north star: ease-of-use / reliability / consistency > speed)
#   1. prepare        — resolve the image identity (tag/env/push/registry) ONCE,
#                       and discover the COMPONENT MATRIX (single- or multi-component).
#   2. scan           — secret scan of the source (gitleaks), BLOCKING. The IMAGE
#                       vuln scan stays Harbor-on-push (D-028); this is the
#                       complementary SOURCE gate, not a dup.
#   3. checks         — per-component lint + unit test (language-detected),
#                       BLOCKING. Runs in parallel with scan.
#   4. build-and-push — per-component Kaniko build+push. `needs: [scan, checks]`,
#                       so a failed gate never reaches the registry. On a real push,
#                       each pushed image is then GATED on Harbor's own Trivy
#                       scan-on-push (fails the job on any CRITICAL finding),
#                       cosign KEYLESS-signed (public Fulcio/Rekor), and given a
#                       syft SBOM artifact — see .github/actions/supply-chain-verify
#                       (shared with the Backstage portal build; same "stop
#                       copying" rationale as tenant-ci-scripts below).
#   5. bump-dev       — the GitOps dev-overlay image bump (push-to-main only).
#   6. bump-staging   — the GitOps staging-overlay image bump (vX.Y.Z tag push
#                       only; promotion.yaml: environments.staging.trigger =
#                       tag:v*). Prod stays the human gate — see promote-to-prod.yaml
#                       (workflow_dispatch, #209) — untouched by this pipeline.
#
# MULTI-COMPONENT (FE+BE in ONE repo) — consumes the multicomp COMPONENT MODEL.
#   The component model (`.devops/components.yaml`: per-component name / build
#   context / Dockerfile / image / port / route / kind) is owned + defined SOLELY
#   by the multicomp track (one-way authority — this workflow CONSUMES it, never
#   redefines it). The matrix is produced by `.devops/ci/resolve-components.sh`
#   (multicomp, task #7) when present; otherwise this workflow falls back to a
#   SINGLE-component matrix synthesized from promotion.yaml — so single-component
#   repos (v1check / sample) build EXACTLY as before (full back-compat). The
#   TAG/ENV/PUSH/REGISTRY are per-COMMIT (identical for every component); only the
#   image name + build context + Dockerfile differ per component.
#
# WHAT STAYS PER-REPO (single source of truth, NOT a copy):
#   .devops/promotion.yaml          registry/app + trigger->env->tag map
#   .devops/ci/resolve-image.sh     trigger->image resolver (shared w/ local loop)
#   .devops/ci/bump-image.sh        the GitOps overlay-tag bump (multicomp #7
#                                   generalizes it to bump N component entries;
#                                   single-component behaviour is unchanged)
#   .devops/ci/resolve-components.sh  the component matrix (multicomp #7; optional)
#   .devops/chart/overlays/*        the student's deployment surface
#   These are deliberately scripts (NOT inlined here): the SAME tested
#   resolver/bumper the LOCAL dev loop uses. Inlining a copy would re-create the
#   drift this change removes. This workflow CALLS them from the caller's checkout.
#
# HOW THE CALLER'S REPO IS USED.
#   A reusable workflow's `github` context is the CALLER's (event_name/ref/sha/PR
#   head sha), and `actions/checkout` with no `repository:` checks out the CALLER
#   (tenant) repo — so this builds the tenant's components, reads the tenant's
#   promotion.yaml/components.yaml, and runs the tenant's .devops/ci/*. @v1 only
#   versions THIS yaml.
#
# CONTAINER-MODE SHAPE. The ARC runners are containerMode:kubernetes — every job
# MUST declare a job `container:` or the runner hard-fails at "Set up job". The
# heavy work (Kaniko build, language toolchains, scanners) runs as `uses: docker://`
# CONTAINER-ACTION STEPs, which the runner-container-hooks execute in a SEPARATE
# pod (shared _work volume), so the small node job-container is enough for the
# Actions internals + checkout.
# ============================================================================
name: tenant-build (reusable)

on:
  workflow_call:
    inputs:
      # The self-hosted ARC runner label / scale-set name (every job's runs-on).
      # Default = the shared platform Kaniko scale set, so single-scale-set tenants
      # (A1, today) pass NOTHING. Two reasons it's an input:
      #   - central retarget: rename the shared scale set -> bump this default + @v1,
      #     no per-tenant edit.
      #   - PER-TEAM scale sets (finish-eso A2 target, PR #128): when a team moves to
      #     its own scale set (<team>-kaniko, for a per-team harbor-push robot), the
      #     caller passes `with: { runner: <team>-kaniko }` — a one-value cutover, no
      #     workflow change. (Caller seam: see the skeleton build-and-push.yaml.)
      runner:
        description: "Self-hosted ARC runner label / scale-set (job runs-on). Per-team: <team>-kaniko."
        type: string
        required: false
        default: ua-mis-kaniko

# Least-privilege DEFAULT. `contents: read` is all the build/scan/checks jobs need.
# bump-dev and bump-staging RE-DECLARE `contents: write` for themselves;
# build-and-push RE-DECLARES `id-token: write` for itself (cosign keyless signing,
# supply-chain hardening). NOTE: a reusable workflow can only DOWNGRADE the
# caller's grant, so the caller's calling job MUST grant BOTH
# `permissions: contents: write` (for bump-dev/bump-staging) AND
# `permissions: id-token: write` (for build-and-push's cosign step) or those jobs
# silently lose the scope they ask for.
permissions:
  contents: read

# Don't pile up redundant builds for the same ref; cancel superseded runs. Scoped
# per-caller-repo (github.ref is the caller's), so tenants never collide here.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) prepare — resolve the image identity ONCE (component-independent) and emit
  # the component MATRIX. Every downstream job keys off these outputs so the
  # tag/env/push decision is computed in exactly one place (no drift).
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ${{ inputs.runner }}
    # node:24-trixie (NOT -slim): resolve-image.sh's git-describe needs git, and we
    # curl yq. -slim ships neither git nor curl.
    container:
      image: node:24-trixie
    # actions:read + pull-requests:write are for the BEST-EFFORT queue-status step
    # below (read this run's queue timing; post the sticky "you were in a queue" PR
    # comment). Both are capped by the CALLER's grant — a caller that hasn't been
    # re-synced to grant them just makes queue-status degrade to a generic note; it
    # never fails. contents:read is what checkout needs.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    outputs:
      # The build job COMPOSES the full image ref per component from these:
      #   IMAGE = <REGISTRY>/<matrix.image (leaf)>:<TAG>
      # resolve-components.sh emits only the LEAF image (contract 4d8af4a) — registry +
      # the one per-commit tag come from resolve-image.sh here. PUSH+TAG also drive bump-dev.
      REGISTRY: ${{ steps.resolve.outputs.REGISTRY }}
      PUSH: ${{ steps.resolve.outputs.PUSH }}
      TAG: ${{ steps.resolve.outputs.TAG }}
      MATRIX: ${{ steps.components.outputs.matrix }}
    steps:
      - name: Install yq (pinned + checksum-verified)
        env:
          YQ_VERSION: v4.44.3
          YQ_SHA256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
        run: |
          set -eu
          curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /usr/local/bin/yq" | sha256sum -c -
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Checkout (build context + promotion.yaml + .devops/ci + tags)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # fetch-depth: 0 = full history + ALL TAGS, REQUIRED for resolve-image.sh's
          # `git describe --tags` (Deploy Model A readable dev tag).
          fetch-depth: 0

      - name: Install canonical CI scripts (central @v1 — overrides per-repo copies)
        # Pulls resolve-image.sh / resolve-components.sh / bump-image.sh from platform-infra
        # @v1 into .devops/ci, so CI runs the ONE central, component-aware script set — a
        # script fix ships once (no per-repo drift). No cross-repo token (composite action).
        uses: UA-MIS/platform-infra/.github/actions/tenant-ci-scripts@v1

      - name: Ensure the `preview` label is on the PR (12h hard-death revival hook)
        # PREVIEW LIFECYCLE (operator contract): a preview env exists IFF its PR carries
        # the `preview` label (tenants/_template/applicationset-preview.yaml gates the
        # pullRequest generator on it). The cohort-gc preview-ttl CronJob HARD-KILLS a
        # preview at 12h by REMOVING that label; the generator then prunes the App for
        # good and will NOT recreate it while the PR sits open. The ONLY revival path is
        # RE-RUNNING CI — so this step (re-)adds the label on every PR-triggered build.
        # Opening a PR, pushing to it, or re-running this workflow all land here and
        # (re)create/revive the preview. Idempotent: adding a present label is a no-op.
        # BEST-EFFORT + fail-open (like queue-status) — a preview is a convenience, never
        # a gate; without pull-requests:write it degrades to a notice, never fails the build.
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          API="https://api.github.com/repos/${OWNER_REPO}"
          H_AUTH="Authorization: Bearer ${GH_TOKEN}"
          H_ACC="Accept: application/vnd.github+json"
          H_VER="X-GitHub-Api-Version: 2022-11-28"
          # 1) Ensure the label EXISTS in the repo (the add-labels endpoint does not
          #    reliably auto-create). POST /labels is a no-op-with-422 if it already
          #    exists, so ignore a non-2xx here.
          curl -sS -o /dev/null -X POST -H "$H_AUTH" -H "$H_ACC" -H "$H_VER" \
            "${API}/labels" \
            -d '{"name":"preview","color":"0e8a16","description":"Ephemeral preview env (12h TTL; re-run CI to revive)"}' || true
          # 2) Add the label to THIS PR (idempotent — GitHub de-dupes).
          curl -sS -o /dev/null -w 'add-label HTTP %{http_code}\n' -X POST -H "$H_AUTH" -H "$H_ACC" -H "$H_VER" \
            "${API}/issues/${PR_NUMBER}/labels" \
            -d '{"labels":["preview"]}'
          echo "==> ensured 'preview' label on ${OWNER_REPO}#${PR_NUMBER} — preview env will be (re)created/revived"

      - name: Queue status — report how long you waited + your position
        # OPERATOR UX (the "you were in a queue, #N in line" ask). A QUEUED Actions job
        # runs NO code until a runner picks it up (builds run 2-at-a-time — maxRunners:2
        # on the Kaniko scale set — so overflow WAITS in GitHub Actions with no pod), so
        # this cannot announce position WHILE waiting. Instead, the instant a runner
        # starts this FIRST job, it reports to the run Summary and (on PRs) a sticky PR
        # comment how long the build sat in the queue and how many of THIS repo's builds
        # were ahead of it. BEST-EFFORT + fail-open: it never fails the build; without
        # actions:read / pull-requests:write (see the job permissions) it degrades to a
        # generic "builds run 2 at a time" note. Script installed centrally just above.
        if: ${{ always() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .devops/ci/queue-status.mjs

      - name: Resolve image identity from promotion.yaml (tag/env/push/registry)
        id: resolve
        env:
          # For a pull_request, feed the PR HEAD sha so the preview tag (pull-<head-sha>)
          # matches what the preview ApplicationSet pulls. Empty for push/tag builds
          # (resolver falls back to GITHUB_SHA).
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sh .devops/ci/resolve-image.sh | tee -a "$GITHUB_OUTPUT"

      - name: Discover component matrix (resolve-components.sh)
        id: components
        run: |
          set -eu
          # resolve-components.sh is the multi-component track's canonical script (installed
          # centrally by the composite step above, so it is ALWAYS present). Contract 4d8af4a:
          # it is a pure "list the components" reader — NO tag/registry/push inputs — emitting
          # a COMPACT JSON ARRAY whose objects carry:
          #   name       component id            context    build dir (Kaniko --context)
          #   dockerfile path relative to context
          #   image      Harbor repo LEAF (e.g. <appName>-<name>); NOT the full ref
          # The build job composes the full ref: <REGISTRY>/<image>:<TAG>. It emits the
          # IMPLICIT single component when there is NO components.yaml (image=<promotion.app>),
          # so it is the single source for both layouts (single stays byte-for-byte).
          ARR="$(sh .devops/ci/resolve-components.sh)"
          echo "resolve-components.sh -> $ARR"
          # strategy.matrix consumes {"include":[...]} — each array entry's keys become
          # matrix.name / matrix.context / matrix.dockerfile / matrix.image (leaf).
          echo "matrix={\"include\":${ARR}}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2) scan — SOURCE secret scan (gitleaks), BLOCKING. Catches committed secrets
  # before anything is built or pushed. The IMAGE vulnerability scan is Harbor's
  # on-push scan (D-028) — this is the complementary source-level gate, not a dup.
  # Repo-wide (not per-component), so it runs once.
  # ---------------------------------------------------------------------------
  scan:
    needs: prepare
    runs-on: ${{ inputs.runner }}
    container:
      image: node:24-trixie-slim
    steps:
      - name: Checkout (working tree to scan)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
      - name: Secret scan (gitleaks — BLOCKING)
        # Digest-pinned (SEC). gitleaks v8.21.2. `dir` scans the checked-out files
        # (not git history) — fast, and the working tree is what gets built. Exits
        # non-zero on any finding, failing the gate before build.
        uses: docker://zricethezav/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 # v8.21.2
        with:
          # Run under a shell so $GITHUB_WORKSPACE expands to the STEP-POD workspace mount
          # (/__w/<repo>) that the ARC container-hook creates for a `docker://` step — NOT
          # the JOB-container ${{ github.workspace }} (/home/runner/_work/<repo>), which does
          # NOT exist inside the separate gitleaks step pod (symptom: gitleaks
          # "FTL stat /home/runner/_work/<repo>: no such file or directory"). The Kaniko
          # build step already uses $GITHUB_WORKSPACE for exactly this reason.
          entrypoint: /bin/sh
          args: -c 'gitleaks dir "$GITHUB_WORKSPACE" --no-banner --redact --exit-code 1'

  # ---------------------------------------------------------------------------
  # 3) checks — per-component lint + unit test, BLOCKING. Language is auto-detected
  # from the component's build context (manifest/lockfile) and the toolchain runs as a
  # `uses: docker://` step in its own pod. Unknown languages SKIP cleanly (a notice, not
  # a failure) so a valid repo is never blocked spuriously — but real test failures DO
  # block the build.
  #
  # LANGUAGE COVERAGE (v1) — kept in lockstep with the scaffolder's self-contained
  # contract workflow (_fragments/_contract/.github/workflows/build-and-push.yaml), which
  # is what the unified "New Project" wizard actually ships per tenant; this reusable file
  # serves the legacy thin-caller (single-component) skeletons. STRICT (a failure blocks):
  # go, node/typescript, python, java(Maven), .NET, rust. BEST-EFFORT (dependency-install
  # failure in the stock toolchain image degrades to a warning-skip; a real test failure
  # still blocks): ruby(Rails), php(Laravel). DEFERRED (fall through to the 'none' skip):
  # Gradle/Android, Swift, Flutter, static/mobile artifacts.
  # ---------------------------------------------------------------------------
  checks:
    needs: prepare
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.MATRIX) }}
    container:
      image: node:24-trixie-slim
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
      - name: Detect language for component '${{ matrix.name }}'
        id: detect
        env:
          CONTEXT: ${{ matrix.context }}
        run: |
          set -eu
          # First match wins. Compiled / manifest-specific languages are tested BEFORE
          # node/python so a secondary package.json (a Rails importmap, a Laravel Vite
          # bundle) never hijacks detection. Mobile toolchains (Gradle-Android / Swift /
          # Flutter) are intentionally NOT matched (deferred) — they fall through to 'none'
          # and skip; react-native is TS/node and is handled by the node path.
          lang=none
          if   [ -f "${CONTEXT}/go.mod" ]; then lang=go
          elif [ -f "${CONTEXT}/pom.xml" ]; then lang=java
          elif ls "${CONTEXT}"/*.csproj >/dev/null 2>&1 || ls "${CONTEXT}"/*.sln >/dev/null 2>&1; then lang=dotnet
          elif [ -f "${CONTEXT}/Cargo.toml" ]; then lang=rust
          elif [ -f "${CONTEXT}/composer.json" ]; then lang=php
          elif [ -f "${CONTEXT}/Gemfile" ]; then lang=ruby
          elif [ -f "${CONTEXT}/package.json" ]; then lang=node
          elif [ -f "${CONTEXT}/pyproject.toml" ] || [ -f "${CONTEXT}/requirements.txt" ]; then lang=python
          fi
          echo "component '${{ matrix.name }}' (context '${CONTEXT}') -> lang=${lang}"
          echo "lang=${lang}" >> "$GITHUB_OUTPUT"

      - name: Go — vet + test
        if: ${{ steps.detect.outputs.lang == 'go' }}
        # Digest-pinned (SEC). golang:1.26-alpine. go vet = lint, go test = unit tests
        # (both compile the package, so a build error is caught too). Both BLOCKING.
        uses: docker://golang@sha256:3ad57304ad93bbec8548a0437ad9e06a455660655d9af011d58b993f6f615648 # 1.26-alpine
        with:
          entrypoint: /bin/sh
          args: >-
            -c 'set -eu;
            cd "$GITHUB_WORKSPACE/${{ matrix.context }}";
            echo "==> go vet (lint)"; go vet ./...;
            echo "==> go test"; go test ./...'

      - name: Node/TypeScript — install + lint + typecheck + test
        if: ${{ steps.detect.outputs.lang == 'node' }}
        # Digest-pinned (SEC). node:24-trixie-slim. Install uses `npm ci` only when a lockfile
        # (package-lock.json / npm-shrinkwrap.json) is committed — otherwise `npm install`, so a
        # lockfile-less starter installs cleanly with no `npm ci` EUSAGE error wall. lint +
        # typecheck run only --if-present (a bare starter without them is not blocked); `npm test`
        # runs only when a test script exists (npm test hard-errors on a missing script otherwise).
        # A real lint / tsc / test failure BLOCKS.
        uses: docker://node@sha256:366fdef91728b1b7fa18c84fba63b6e79ed77b7e10cc206878e9705da4d7b169 # 24-trixie-slim
        with:
          entrypoint: /bin/sh
          args: >-
            -c 'set -eu;
            cd "$GITHUB_WORKSPACE/${{ matrix.context }}";
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then echo "==> npm ci (lockfile present)"; npm ci; else echo "==> npm install (no lockfile — commit one to switch to fast reproducible npm ci)"; npm install; fi;
            echo "==> lint (if present)"; npm run lint --if-present;
            echo "==> typecheck (if present)"; npm run typecheck --if-present;
            if npm run | grep -qE "^[[:space:]]+test"; then echo "==> npm test"; npm test;
            else echo "::notice::no npm test script — test run skipped"; fi'

      - name: Python — install + ruff (advisory) + pytest
        if: ${{ steps.detect.outputs.lang == 'python' }}
        # Digest-pinned (SEC). python:3-slim. Installs requirements(.txt|-dev.txt) + the app
        # (if pyproject) + pytest/ruff over :443. ruff is advisory; pytest is BLOCKING. A
        # pytest exit 5 (no tests collected) degrades to a notice, not a failure.
        uses: docker://python@sha256:63a4c7f612a00f92042cbdcc7cdc6a306f38485af0a200b9c89de7d9b1607d15 # 3-slim
        with:
          entrypoint: /bin/sh
          args: >-
            -c 'set -u;
            cd "$GITHUB_WORKSPACE/${{ matrix.context }}" || exit 1;
            PIP="python -m pip install --quiet --root-user-action=ignore";
            [ -f requirements.txt ] && $PIP -r requirements.txt;
            [ -f requirements-dev.txt ] && $PIP -r requirements-dev.txt;
            [ -f pyproject.toml ] && $PIP . || true;
            $PIP pytest ruff;
            echo "==> ruff (advisory)"; ruff check . || true;
            echo "==> pytest"; pytest -q; rc=$?;
            if [ "$rc" = "5" ]; then echo "::notice::pytest collected no tests — skipped"; rc=0; fi;
            exit $rc'

      - name: Java (Maven) — compile + test
        if: ${{ steps.detect.outputs.lang == 'java' }}
        # Digest-pinned (SEC). maven:3.9-eclipse-temurin-21. `mvn test` compiles main + test
        # sources (a compile error blocks) and runs the JUnit/spring-boot-starter-test suite.
        uses: docker://maven@sha256:2b4496088e7b80ae10a8c9f74e574ea21380325a006ec684532ad6bad5bc7273 # 3.9-eclipse-temurin-21
        with:
          entrypoint: /bin/sh
          args: >-
            -c 'set -eu;
            cd "$GITHUB_WORKSPACE/${{ matrix.context }}";
            echo "==> mvn test (compile + unit tests)";
            mvn -B -ntp test'

      - name: .NET — build + test
        if: ${{ steps.detect.outputs.lang == 'dotnet' }}
        # Digest-pinned (SEC). dotnet/sdk:8.0. Runs the *.Tests.csproj if present (which
        # restores+builds+tests, catching compile errors); otherwise a plain `dotnet build`
        # is the compile check.
        uses: docker://mcr.microsoft.com/dotnet/sdk@sha256:63ebabdcde24cc8134304a6f50719cf1e22bb4e9f7148ac4ef967c7680187356 # 8.0
        with:
          entrypoint: /bin/sh
          args: >-
            -c 'set -eu;
            cd "$GITHUB_WORKSPACE/${{ matrix.context }}";
            TP="$(find . -name "*.Tests.csproj" -o -name "*.Test.csproj" | head -n1)";
            if [ -n "$TP" ]; then echo "==> dotnet test $TP"; dotnet test "$TP" --nologo;
            else echo "==> no test project — dotnet build (compile check)"; dotnet build --nologo; fi'

      - name: Rust — fmt (advisory) + cargo test
        if: ${{ steps.detect.outputs.lang == 'rust' }}
        # Digest-pinned (SEC). rust:1-slim-trixie. `cargo test` compiles the crate (a
        # compile error blocks) and runs any #[test]s; fmt is advisory. Uses --locked only
        # when a Cargo.lock is committed.
        uses: docker://rust@sha256:14c4fe50ea427dc42381a1a09a9a839c1d2346a2e508cd491bf02c659dbc0ed7 # 1-slim-trixie
        with:
          entrypoint: /bin/sh
          args: >-
            -c 'set -eu;
            cd "$GITHUB_WORKSPACE/${{ matrix.context }}";
            echo "==> cargo fmt --check (advisory)"; cargo fmt --check || true;
            echo "==> cargo test (compile + tests)";
            if [ -f Cargo.lock ]; then cargo test --locked; else cargo test; fi'

      - name: Ruby — bundle + test (best-effort install)
        if: ${{ steps.detect.outputs.lang == 'ruby' }}
        # Digest-pinned (SEC). ruby:3.3. BEST-EFFORT: a bundle install failure (native-ext
        # build deps / DB client headers the stock image lacks, e.g. mysql2) degrades to a
        # warning-skip; a real test failure still BLOCKS. Harden the image to make strict.
        uses: docker://ruby@sha256:8d62d05359e370f55c2710645c976d7f04c9f5811378c7acc340ff416986da1e # 3.3
        with:
          entrypoint: /bin/sh
          args: >-
            -c 'set -eu;
            cd "$GITHUB_WORKSPACE/${{ matrix.context }}";
            echo "==> bundle install";
            if ! bundle install --quiet; then
              echo "::warning::bundle install failed (native-ext toolchain / DB headers not in the stock ruby image) — skipping ruby checks; harden the toolchain image to enforce"; exit 0; fi;
            if [ -f bin/rails ]; then echo "==> bin/rails test"; bin/rails test;
            elif bundle exec rake -T 2>/dev/null | grep -q "rake test"; then echo "==> rake test"; bundle exec rake test;
            elif [ -d spec ]; then echo "==> rspec"; bundle exec rspec;
            else echo "::notice::no rails/rake/rspec tests — skipped"; fi'

      - name: PHP (Composer) — install + test (best-effort install)
        if: ${{ steps.detect.outputs.lang == 'php' }}
        # Digest-pinned (SEC). composer:2. BEST-EFFORT: a composer install failure (PHP
        # extensions the runtime Dockerfile provides but a stock image lacks) degrades to a
        # warning-skip; a real test failure still BLOCKS. Harden the image to make strict.
        uses: docker://composer@sha256:5946476338742b200bb9ff88f8be56275ddae4b3949c72305cb0dbf10cfcb760 # 2
        with:
          entrypoint: /bin/sh
          args: >-
            -c 'set -eu;
            cd "$GITHUB_WORKSPACE/${{ matrix.context }}";
            echo "==> composer install";
            if ! composer install --no-interaction --no-progress --prefer-dist --ignore-platform-reqs; then
              echo "::warning::composer install failed (PHP extensions not in the stock composer image) — skipping php checks; harden the toolchain image to enforce"; exit 0; fi;
            if composer run-script --list 2>/dev/null | grep -qE "^[[:space:]]+test"; then echo "==> composer test"; composer test;
            elif [ -x vendor/bin/phpunit ]; then echo "==> phpunit"; vendor/bin/phpunit;
            else echo "::notice::no composer test script / phpunit — skipped"; fi'

      - name: No recognized language — checks skipped
        if: ${{ steps.detect.outputs.lang == 'none' }}
        run: |
          echo "::notice::component '${{ matrix.name }}' (context '${{ matrix.context }}'):" \
               "no recognized manifest (go.mod / pom.xml / *.csproj / Cargo.toml /" \
               "composer.json / Gemfile / package.json / pyproject|requirements) —" \
               "language lint+test auto-checks skipped (static sites, mobile artifacts," \
               "and bring-your-own land here). Add a recognized manifest to enable them."

  # ---------------------------------------------------------------------------
  # 4) build-and-push — per-component Kaniko build (and push). `needs: [scan,
  # checks]` so a failed gate never reaches the registry. One matrix job per
  # component; the tag/env/push/registry come from prepare (component-independent).
  # ---------------------------------------------------------------------------
  build-and-push:
    needs: [prepare, scan, checks]
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.MATRIX) }}
    # FULL node image (NOT -slim): the post-push supply-chain-verify composite
    # action needs curl + tar + sha256sum (installing cosign/syft, same
    # pinned+checksum-verified convention as the yq installs elsewhere in this
    # file) AND a real /etc/ssl/certs/ca-certificates.crt bundle to extend with
    # the platform CA (see that action's header). -slim ships none of these.
    container:
      image: node:24-trixie
    env:
      DOCKER_CONFIG_DIR: /kaniko/.docker
    # RE-DECLARES id-token: write (workflow default is contents:read only) — cosign
    # keyless signing needs the OIDC ID-token this grants. Reusable-workflow caveat
    # (see the top-level permissions comment): the CALLER's job must also grant
    # `permissions: id-token: write` or this downgrades to none and the supply-chain
    # step's OIDC guard fails closed with a clear message.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout (build context)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Guard — push builds must have the Harbor cred mounted
        if: ${{ needs.prepare.outputs.PUSH == 'true' }}
        run: |
          echo "push build for ${{ needs.prepare.outputs.REGISTRY }}/${{ matrix.image }}:${{ needs.prepare.outputs.TAG }}" \
               "— Harbor cred expected at ${DOCKER_CONFIG_DIR}/config.json in the Kaniko step pod"

      # --- Kaniko build as a container-action STEP (its own pod; shared _work) ---
      # SNAPSHOT SPEED (COMMON args below) — Kaniko's default snapshotter content-hashes
      # every file after each layer (O(bytes)); for a heavy frontend it hashes the whole
      # freshly-`npm install`ed node_modules twice, wedging for 20-30 min on slow-disk
      # workers (e.g. the 8GB Mac fallback runners). `.dockerignore` can't help — those
      # files are CREATED inside the image by the RUN, not carried in the context. Two
      # safe, universal flags fix it (applies to ALL stages incl. the build stage):
      #   --snapshot-mode=redo — hash file METADATA (mtime/size/mode) not content
      #                          (O(files)); the dominant win, correct for npm builds.
      #   --use-new-run        — detect RUN changes without a full-FS snapshot.
      # NOT --single-snapshot: it collapses all changes into one layer (killing Harbor
      # push-time layer dedup for components that ship deps in the runtime image) and its
      # win overlaps redo — a per-image tuning knob, not a good default for this shared
      # reusable workflow. --reproducible is kept (D-030 supply-chain property).
      # SECURITY — preview (pull_request) PUSHES untrusted PR code, authenticated by
      # the SAME least-privilege harbor-push robot (pull+push on THIS team's OWN
      # Harbor project only). The tag is pull-<head-sha>, DISJOINT from dev's
      # git-describe + prod's semver, so a PR can never overwrite dev/staging/prod;
      # the image only ever lands in the fenced <team>-pr-<n> preview namespace.
      - name: Build (and push) component '${{ matrix.name }}' with Kaniko
        # Digest-pinned (SEC, D-030): the Kaniko image holds the Harbor push cred.
        # digest = gcr.io/kaniko-project/executor:v1.23.2-debug.
        uses: docker://gcr.io/kaniko-project/executor@sha256:c3109d5926a997b100c4343944e06c6b30a6804b2f9abe0994d3de6ef92b028e # v1.23.2-debug
        with:
          entrypoint: /busybox/sh
          args: >-
            -c '
            set -eu;
            CFG="${DOCKER_CONFIG_DIR}/config.json";
            if [ "${PUSH}" = "true" ] && [ ! -s "$CFG" ]; then
              echo "ERROR: Harbor push credential not found at $CFG — the platform" \
                   "runner must inject secret harbor-push (container-hook template)." \
                   "Refusing an unauthenticated push." >&2;
              exit 1;
            fi;
            COMMON="--context=dir://${GITHUB_WORKSPACE}/${CONTEXT}
                    --dockerfile=${DOCKERFILE}
                    --destination=${IMAGE}
                    --reproducible
                    --snapshot-mode=redo
                    --use-new-run
                    --verbosity=info";
            if [ "${PUSH}" = "true" ]; then
              echo "==> building + pushing ${IMAGE}";
              /kaniko/executor $COMMON --image-name-with-digest-file=${GITHUB_WORKSPACE}/.image-digest;
            else
              echo "==> PR build-only validation for ${IMAGE} (no push)";
              /kaniko/executor $COMMON --no-push --tar-path=/tmp/image.tar;
            fi
            '
        env:
          # COMPOSE the full ref from the LEAF (matrix.image, contract 4d8af4a) + the
          # registry + the one per-commit tag from prepare/resolve-image.sh.
          IMAGE: ${{ needs.prepare.outputs.REGISTRY }}/${{ matrix.image }}:${{ needs.prepare.outputs.TAG }}
          PUSH: ${{ needs.prepare.outputs.PUSH }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          DOCKER_CONFIG_DIR: ${{ env.DOCKER_CONFIG_DIR }}

      # --- post-push supply chain: Trivy gate + cosign sign + syft SBOM ---------
      # PUSH-only (nothing to verify for a --no-push PR validation build — no image
      # landed in the registry). `--image-name-with-digest-file` above writes
      # `<destination>@sha256:<digest>` into the shared _work volume; this job's
      # OWN pod (not a separate `docker://` step) reads it back with a real shell.
      - name: Capture built image digest + derive the Harbor project
        if: ${{ needs.prepare.outputs.PUSH == 'true' }}
        id: digest
        env:
          REGISTRY: ${{ needs.prepare.outputs.REGISTRY }}
        run: |
          set -eu
          DIGEST_FILE="${GITHUB_WORKSPACE}/.image-digest"
          [ -s "${DIGEST_FILE}" ] || {
            echo "ERROR: kaniko did not write a digest file at ${DIGEST_FILE} (expected" \
                 "--image-name-with-digest-file to run on the push path)." >&2
            exit 1
          }
          IMAGE_REF="$(cat "${DIGEST_FILE}")"
          echo "built image ref: ${IMAGE_REF}"
          {
            echo "IMAGE_REF=${IMAGE_REF}"
            # REGISTRY is always <harbor-host>/<team-project> (one path segment, no
            # nesting — promotion.yaml schema v1); strip the host to get the project.
            echo "HARBOR_PROJECT=${REGISTRY#*/}"
          } >> "$GITHUB_OUTPUT"

      - name: Supply-chain verify (Harbor Trivy gate + cosign sign + syft SBOM)
        if: ${{ needs.prepare.outputs.PUSH == 'true' }}
        uses: UA-MIS/platform-infra/.github/actions/supply-chain-verify@v1
        with:
          image-ref: ${{ steps.digest.outputs.IMAGE_REF }}
          harbor-project: ${{ steps.digest.outputs.HARBOR_PROJECT }}
          harbor-repo: ${{ matrix.image }}
          docker-config-dir: ${{ env.DOCKER_CONFIG_DIR }}
          sbom-artifact-name: sbom-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}

  # ============================================================================
  # 5) bump-dev — the GitOps image-bump (D-030 automated promotion: push -> builds
  # -> DEPLOYS, hands-free). After build-and-push pushes the dev image(s), rewrite
  # the dev overlay's images[].newTag to the just-built tag and commit it to main;
  # ArgoCD syncs the new image into <team>-dev.
  #
  # MULTI-COMPONENT: bump-image.sh is generalized by multicomp (task #7) to bump
  # EVERY component's overlay images[] entry to TAG (one tag per commit for all
  # components). For single-component repos its behaviour is unchanged. We call it
  # once with the prepare TAG; the script handles 1..N entries.
  #
  # SECURITY (least privilege — SEPARATE job):
  #   - `if:` restricts to a real push to main OR a manual workflow_dispatch on
  #     main. NEVER runs on pull_request, so UNTRUSTED PR code can't reach the
  #     write token.
  #   - job-scoped `permissions: contents: write` (build/scan/checks keep read).
  #     Reusable-workflow caveat: the caller's calling job MUST grant
  #     contents: write or this downgrades to read.
  #   - loop guard: bump-image.sh's commit message carries `[skip ci]` so the bump
  #     commit does NOT re-trigger the caller's build (no infinite loop).
  #
  # BRANCH PROTECTION (Option A, D-030): main requires PRs; the platform allowlists
  # `github-actions[bot]` in main's bypass-pull-request-allowances so this job's
  # GITHUB_TOKEN can push the overlay-tag commit. If the bypass isn't configured the
  # push fails LOUD (set -e) — never a silent no-deploy.
  # ============================================================================
  bump-dev:
    needs: [prepare, build-and-push]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.prepare.outputs.PUSH == 'true' }}
    runs-on: ${{ inputs.runner }}
    # FULL node image (NOT -slim): bump-image.sh git-commits the overlay and this
    # job `git push`es it to main; actions/checkout needs git for a real .git +
    # persist-credentials. -slim ships neither git nor curl (verified: `docker run
    # --rm node:24-trixie-slim sh -c 'which git curl'` finds neither).
    #
    # DIGEST-PINNED (F-5, FIX-10, VERIFY-2 2026-08-15): was a floating `node:24-trixie`
    # tag, which (a) contradicts the platform's own pin-all-versions rule and (b)
    # can silently re-pull a Node minor that re-opens the Node 24.17 keepAlive
    # regression previously fixed by pinning the portal to 24.16. Pinned here to
    # the digest resolved at fix time; bump deliberately (same convention as the
    # `checks` job's node:24-trixie-slim digest pin above).
    #
    # -slim WAS CONSIDERED for the ~5x pull-size win (1.25GB full vs 238MB slim,
    # matching the observed 4m36s vs 55s "Initialize containers" gap) using the
    # platform's own proven apt-over-https bootstrap (see any fragment Dockerfile's
    # "ADDING apt PACKAGES" footer for the exact block: rewrite sources.list to
    # https, apt-get with Acquire::https::Verify-Peer=false for the ONE
    # ca-certificates bootstrap fetch, then a normal apt-get install for git+curl —
    # required because the ARC runner egress NetworkPolicy is :443-only and slim
    # Debian bases ship no CA bundle). Verified locally that this bootstrap works
    # and IS git/curl afterward. NOT switched in this PR: this job also does the
    # ONLY `git push` to `main` in the tenant pipeline (every tenant's dev deploy
    # depends on it), and this fix's live-runner verification was not available —
    # the risk of a subtle apt/network difference breaking dev deploys for every
    # tenant outweighs the speed win for what the task scoped as an optional item.
    # Left as a well-evidenced follow-up, not attempted blind against production CI.
    container:
      image: node@sha256:05c60dce78787e477fd7c0d61d9efcd5b7ae3f21a8b18787c7ef3daf9c9a2ad3 # 24-trixie
    permissions:
      contents: write
    steps:
      - name: Install yq (pinned + checksum-verified; bump-image.sh needs it)
        env:
          YQ_VERSION: v4.44.3
          YQ_SHA256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
        run: |
          set -eu
          curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /usr/local/bin/yq" | sha256sum -c -
          chmod +x /usr/local/bin/yq
          yq --version
      - name: Checkout main (writable; full history for a clean commit base)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install canonical CI scripts (central @v1 — overrides per-repo copies)
        # Same central bump-image.sh every tenant runs (the component-aware version that
        # bumps EVERY overlay images[] entry; single-component = the one entry).
        uses: UA-MIS/platform-infra/.github/actions/tenant-ci-scripts@v1

      - name: Bump dev overlay newTag -> built tag + commit + push
        env:
          TAG: ${{ needs.prepare.outputs.TAG }}
          GIT_AUTHOR_NAME: ua-mis-ci
          GIT_AUTHOR_EMAIL: ci@capstone.uamishub.com
          GIT_COMMITTER_NAME: ua-mis-ci
          GIT_COMMITTER_EMAIL: ci@capstone.uamishub.com
        run: |
          set -eu
          # CONSUME prepare's TAG (readable git-describe; no recompute). bump-image.sh
          # (COMMIT=1) rewrites the dev overlay newTag(s) + git-commits with a
          # "[skip ci]" message (so this push does NOT re-trigger build), and marks
          # the workspace a safe.directory (CI checks out as a different uid).
          COMMIT=1 sh .devops/ci/bump-image.sh dev "${TAG}"
          git push origin HEAD:main

  # ============================================================================
  # 6) bump-staging — the GitOps image-bump for staging (promotion.yaml:
  # environments.staging.trigger = tag:v*, gate:auto — mirrors bump-dev, but on a
  # vX.Y.Z semver TAG push instead of a push-to-main). A pushed `vX.Y.Z` tag builds
  # ONE immutable `:X.Y.Z` image (prepare/resolve-image.sh resolves ENV=prod for a
  # tag push, but only to read the SHARED registry/app/semver tagConvention — see
  # resolve-image.sh's header note); that same image+tag is what BOTH staging and
  # prod overlays pin. This job auto-promotes staging to it; prod stays the human
  # gate (promote-to-prod.yaml, workflow_dispatch, #209) — untouched by this job.
  #
  # SECURITY (least privilege — SEPARATE job, same shape as bump-dev):
  #   - `if:` restricts to a real push of a vX.Y.Z tag. NEVER runs on pull_request
  #     or a plain branch push, so untrusted PR code / a bare main push can't reach
  #     the write token or touch staging's overlay.
  #   - job-scoped `permissions: contents: write` (build/scan/checks keep read).
  #     Reusable-workflow caveat: the caller's calling job MUST grant
  #     contents: write (already required for bump-dev) or this downgrades to read.
  #   - loop guard: bump-image.sh's commit message carries `[skip ci]` so the bump
  #     commit does NOT re-trigger the caller's build (no infinite loop). A tag push
  #     never re-triggers itself anyway (the commit doesn't create a new tag), but
  #     the guard is harmless/consistent with bump-dev.
  #
  # BRANCH PROTECTION (Option A, D-030): same as bump-dev — main requires PRs; the
  # platform allowlists `github-actions[bot]` in main's bypass-pull-request-allowances
  # so this job's GITHUB_TOKEN can push the overlay-tag commit. If the bypass isn't
  # configured the push fails LOUD (set -e) — never a silent no-deploy.
  # ============================================================================
  bump-staging:
    needs: [prepare, build-and-push]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.prepare.outputs.PUSH == 'true' }}
    runs-on: ${{ inputs.runner }}
    # FULL node image (NOT -slim): bump-image.sh git-commits the overlay and this
    # job `git push`es it to main; actions/checkout needs git for a real .git +
    # persist-credentials. -slim ships neither git nor curl. Same reasoning as
    # bump-dev.
    container:
      image: node:24-trixie
    permissions:
      contents: write
    steps:
      - name: Install yq (pinned + checksum-verified; bump-image.sh needs it)
        env:
          YQ_VERSION: v4.44.3
          YQ_SHA256: a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7
        run: |
          set -eu
          curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  /usr/local/bin/yq" | sha256sum -c -
          chmod +x /usr/local/bin/yq
          yq --version
      - name: Checkout main (writable; full history for a clean commit base)
        # The tagged commit may not be on main's tip HEAD (a tag can point anywhere),
        # so this checks out main itself (like bump-dev) — the overlay bump is a
        # commit to main's GitOps state, not to the tag/release ref.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install canonical CI scripts (central @v1 — overrides per-repo copies)
        # Same central bump-image.sh every tenant runs (the component-aware version that
        # bumps EVERY overlay images[] entry; single-component = the one entry).
        uses: UA-MIS/platform-infra/.github/actions/tenant-ci-scripts@v1

      - name: Bump staging overlay newTag -> built (tagged) semver + commit + push
        env:
          TAG: ${{ needs.prepare.outputs.TAG }}
          GIT_AUTHOR_NAME: ua-mis-ci
          GIT_AUTHOR_EMAIL: ci@capstone.uamishub.com
          GIT_COMMITTER_NAME: ua-mis-ci
          GIT_COMMITTER_EMAIL: ci@capstone.uamishub.com
        run: |
          set -eu
          # CONSUME prepare's TAG (the bare semver resolve-image.sh stripped from the
          # pushed vX.Y.Z tag; no recompute). bump-image.sh (COMMIT=1) rewrites the
          # staging overlay newTag(s) + git-commits with a "[skip ci]" message.
          COMMIT=1 sh .devops/ci/bump-image.sh staging "${TAG}"
          git push origin HEAD:main
