# The "platform" AppProject — the cluster-scoped fence for platform-engineer-owned
# Applications ONLY (the root app, platform-services, and the per-team bootstrap
# Apps the tenants-appset emits). This is the privileged project: it MAY create
# cluster-scoped resources (CRDs, ClusterRoles, the sealed-secrets controller,
# cert-manager, etc.). NO team workload ever lands here — teams get their own
# per-team AppProject (tenants/_template/appproject.yaml), which whitelists only
# their namespaces and forbids cluster-scoped resources (§2.1 boundary rule).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  labels:
    platform.capstone/component: platform
  # Keep the project from being pruned if its parent app is ever removed.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform-engineer-owned cluster services and tenant bootstrap apps.

  # Only the platform-infra repo feeds this project. Team app repos are NOT here
  # — they are whitelisted per-team in each team's own AppProject.
  sourceRepos:
    - https://github.com/UA-MIS/platform-infra
    - https://github.com/UA-MIS/platform-infra.git
    # --- P2.2 (deploy method A, D-022): pinned external Helm chart repos for
    #     platform services that are Helm-only upstream. This widens the supply-chain
    #     allowlist by ONE named repo per chart; security audits each addition; chart
    #     VERSIONS are pinned in the Application (targetRevision). If the human picks
    #     method B (kustomize helm-inflation rendered from platform-infra), REVERT
    #     these — they're only needed for Helm-SOURCE Applications.
    - https://helm.goharbor.io        # Harbor (platform-harbor Application)
    # ARC (P2.3, D-032): GitHub's official OCI Helm charts for the Actions Runner
    # Controller (controller + runner scale set). OCI registry — ONE named source,
    # chart versions pinned in the Applications (gha-runner-scale-set[-controller]
    # @ 0.14.2). ⚠ INSTALL-OWNED: like the helm.goharbor.io add, this reaches the
    # live `platform` AppProject only via `make bootstrap`/`make bootstrap-reapply`
    # (bootstrap/platform-appproject.yaml is not GitOps-reconciled) — re-apply after
    # merge or the ARC apps will InvalidSpecError "repo not permitted".
    - ghcr.io/actions/actions-runner-controller-charts   # ARC (platform-arc-* Applications)
    # Rook-Ceph (P4, §3.4, D-035): the operator + cluster Helm charts (replicated
    # block storage on the 3-node hardware). ONE named source; chart versions pinned
    # in the Applications (rook-ceph + rook-ceph-cluster @ v1.20.1). ⚠ INSTALL-OWNED
    # (same as the Harbor/ARC adds): reaches the live `platform` AppProject only via
    # `make bootstrap`/`make bootstrap-reapply` — re-apply after merge or the
    # platform-rook-ceph-* apps will InvalidSpecError "repo not permitted".
    - https://charts.rook.io/release    # Rook-Ceph (platform-rook-ceph-* Applications)
    # metrics-server (P4): the Metrics API provider (kubectl top / k9s CPU+MEM, HPA
    # backing). ONE named source; chart version pinned in the Application
    # (metrics-server @ 3.13.1). ⚠ INSTALL-OWNED (same as Harbor/ARC/Rook adds):
    # reaches the live `platform` AppProject only via `make bootstrap`/`make
    # bootstrap-reapply` — re-apply after merge or platform-metrics-server will
    # InvalidSpecError "repo not permitted".
    - https://kubernetes-sigs.github.io/metrics-server/   # metrics-server (platform-metrics-server Application)
    # Traefik ingress (D-042/ADR-028): the official Traefik Helm chart — the Talos
    # ingress controller (k3s no longer bundles it). ONE named source, chart version
    # pinned in the Application (traefik @ 40.2.0, appVersion v3.7.1). ⚠ INSTALL-OWNED
    # (same as the Harbor/ARC/Rook/metrics-server adds): reaches the live
    # `platform` AppProject only via `make bootstrap`/`make bootstrap-reapply` —
    # re-apply after merge + VERIFY (the AppProject is bootstrap-managed, not
    # GitOps-reconciled) or platform-traefik will InvalidSpecError "repo not permitted".
    - https://traefik.github.io/charts                    # Traefik ingress (platform-traefik Application)
    # Backstage "The Process" (P5, D-022 method A): the official Backstage OCI Helm chart
    # (developer portal). OCI registry — ONE named source, chart version pinned in the
    # Application (backstage @ 2.8.2). ⚠ INSTALL-OWNED (same as the Harbor/ARC/Rook/
    # metrics-server adds): reaches the live `platform` AppProject only via `make
    # bootstrap`/`make bootstrap-reapply` — re-apply after merge or platform-backstage-process
    # will InvalidSpecError "repo not permitted". (NOT needed until The Process go-live.)
    - ghcr.io/backstage/charts                            # Backstage The Process (platform-backstage-process Application)
    # ESO + Vault (ADR-030 B1, the v1 secrets model "no secret material in git"):
    # the External Secrets Operator chart repo + the HashiCorp Vault chart repo. TWO
    # named sources, chart versions pinned in the Applications (external-secrets @
    # 2.6.0, vault @ 0.33.0). ⚠ INSTALL-OWNED (same as the Harbor/ARC/Rook/metrics-
    # server/Traefik/Backstage adds): reaches the live `platform` AppProject only via
    # `make bootstrap`/`make bootstrap-reapply` + VERIFY (the AppProject is
    # bootstrap-managed, not GitOps-reconciled) or platform-external-secrets /
    # platform-vault will InvalidSpecError "repo not permitted".
    - https://charts.external-secrets.io                  # ESO (platform-external-secrets Application)
    - https://helm.releases.hashicorp.com                 # Vault (platform-vault Application)
    # Crossplane core (ADR-031, zero-touch tenant onboarding): the Crossplane Helm
    # chart repo. ONE named source, chart version pinned in the Application
    # (crossplane @ 2.3.2). ⚠ INSTALL-OWNED (same as the Harbor/ARC/Rook/metrics-
    # server/Traefik/Backstage/ESO/Vault adds): reaches the live `platform`
    # AppProject only via `make bootstrap`/`make bootstrap-reapply` + VERIFY (the
    # AppProject is bootstrap-managed, not GitOps-reconciled) or
    # platform-crossplane-core will InvalidSpecError "repo not permitted". The
    # Crossplane PROVIDER/FUNCTION packages are pulled from xpkg.upbound.io by the
    # Crossplane package manager (NOT an ArgoCD source), so no further sourceRepos
    # entry is needed for them — only this one Helm chart repo.
    - https://charts.crossplane.io/stable                 # Crossplane core (platform-crossplane-core Application)
    # Observability (retro #3 "we run the platform blind"): the kube-prometheus-stack
    # chart repo (Prometheus + Alertmanager + Grafana + node-exporter + kube-state-
    # metrics) and the Grafana chart repo (Loki single-binary + Alloy log shipper).
    # TWO named sources, chart versions pinned in the Applications (kube-prometheus-
    # stack @ 87.3.0, loki @ 6.55.0, alloy @ 1.10.0). ⚠ INSTALL-OWNED (same as the
    # Harbor/ARC/Rook/metrics-server/Traefik/Backstage/ESO/Vault adds): reaches the
    # live `platform` AppProject only via `make bootstrap`/`make bootstrap-reapply` +
    # VERIFY (the AppProject is bootstrap-managed, not GitOps-reconciled) or
    # platform-kube-prometheus-stack / platform-loki / platform-alloy will
    # InvalidSpecError "repo not permitted".
    - https://prometheus-community.github.io/helm-charts   # kube-prometheus-stack (platform-kube-prometheus-stack Application)
    - https://grafana.github.io/helm-charts                # Loki + Alloy (platform-loki / platform-alloy Applications)
    # Tracing + long-term metrics (this PR): OTel Collector chart repo (traces pipe
    # into Tempo, sampled low for RAM). ONE named source, chart version pinned in
    # the Application (opentelemetry-collector @ 0.162.0). Tempo and Thanos (query/
    # store-gateway/compactor) are BOTH shipped as raw manifests
    # (platform-services/monitoring/{tempo,thanos}.yaml) — Tempo's own single-binary
    # Helm chart is upstream `deprecated: true` (see tempo.yaml's header) — so
    # neither needs a sourceRepos entry at all. ⚠ INSTALL-OWNED (same
    # as every add above): reaches the live `platform` AppProject only via `make
    # bootstrap`/`make bootstrap-reapply` + VERIFY (the AppProject is bootstrap-
    # managed, not GitOps-reconciled) or platform-otel-collector will
    # InvalidSpecError "repo not permitted".
    #
    # ⚠ NOTE (overnight integration merge): the standalone Helm `platform-minio`
    # Application originally proposed alongside this (chart `charts.min.io`) was
    # DROPPED during the merge — it would have deployed a second, conflicting MinIO
    # into the same `minio` namespace/Service already owned by the `dr-backup`
    # plain-manifest MinIO (platform-services/minio/, PR #247). See
    # platform-services/monitoring/README.md "Long-term metrics (Thanos)" for the
    # resulting unresolved integration gap (Thanos's `dr-backup` bucket + `thanos`
    # IAM user still need to be provisioned against the existing MinIO). No
    # `charts.min.io` sourceRepos entry is needed unless that follow-up switches
    # back to a Helm-source MinIO.
    - https://open-telemetry.github.io/opentelemetry-helm-charts   # OTel Collector (platform-otel-collector Application)
    # Resource governance (resource-governance-backlog): the Fairwinds stable chart repo
    # serves BOTH the Vertical Pod Autoscaler chart (platform-vpa @ vpa 4.12.3) and the
    # Goldilocks recommendation dashboard (platform-goldilocks @ goldilocks 10.4.1). ONE
    # named source, chart versions pinned in the Applications. ⚠ INSTALL-OWNED (same as
    # every add above): reaches the live `platform` AppProject only via `make bootstrap`/
    # `make bootstrap-reapply` + VERIFY (the AppProject is bootstrap-managed, not
    # GitOps-reconciled) or platform-vpa / platform-goldilocks will InvalidSpecError
    # "repo not permitted".
    - https://charts.fairwinds.com/stable                  # VPA + Goldilocks (platform-vpa / platform-goldilocks Applications)
    # Disaster recovery (dr-backup): the official Velero Helm chart repo —
    # scheduled backup of all namespaces + PVs into the platform's own node-local
    # MinIO. ONE named source, chart version pinned in the Application
    # (velero @ 12.1.0). MinIO itself is NOT a Helm-source Application (plain
    # pinned manifests, platform-services/minio — see its statefulset.yaml header
    # for why), so it needs no sourceRepos entry. ⚠ INSTALL-OWNED (same as every
    # add above): reaches the live `platform` AppProject only via `make
    # bootstrap`/`make bootstrap-reapply` + VERIFY (the AppProject is
    # bootstrap-managed, not GitOps-reconciled) or platform-velero will
    # InvalidSpecError "repo not permitted".
    - https://vmware-tanzu.github.io/helm-charts            # Velero (platform-velero Application)
    # Kyverno (supply-chain hardening): the admission-policy engine that verifies
    # every Pod image carries a valid cosign KEYLESS signature bound to this org's
    # GitHub Actions identity, disallows `:latest`, and requires resource limits.
    # ONE named source, chart version pinned in the Application (kyverno @ 3.8.1,
    # appVersion v1.18.1). ⚠ INSTALL-OWNED (same as every add above): reaches the
    # live `platform` AppProject only via `make bootstrap`/`make bootstrap-reapply`
    # + VERIFY (the AppProject is bootstrap-managed, not GitOps-reconciled) or
    # platform-kyverno will InvalidSpecError "repo not permitted".
    - https://kyverno.github.io/kyverno/                    # Kyverno (platform-kyverno Application)
    # OpenCost (cost visibility on owned hardware): the official OpenCost Helm chart
    # repo. ONE named source, chart version pinned in the Application (opencost @
    # 2.5.26). ⚠ INSTALL-OWNED (same as every add above): reaches the live `platform`
    # AppProject only via `make bootstrap`/`make bootstrap-reapply` + VERIFY (the
    # AppProject is bootstrap-managed, not GitOps-reconciled) or platform-opencost
    # will InvalidSpecError "repo not permitted".
    - https://opencost.github.io/opencost-helm-chart        # OpenCost (platform-opencost Application)
    # SPIFFE/SPIRE workload identity (exploratory baseline): the SPIFFE project's own
    # "hardened" Helm chart repo, serving BOTH spire-crds (platform-spire-crds @ 0.5.0)
    # and the spire umbrella chart (platform-spire @ 0.29.0, appVersion 1.14.5 —
    # server+agent+controller-manager+CSI-driver). ONE named source, chart versions
    # pinned in the Applications. ⚠ INSTALL-OWNED (same as every add above): reaches
    # the live `platform` AppProject only via `make bootstrap`/`make bootstrap-reapply`
    # + VERIFY (the AppProject is bootstrap-managed, not GitOps-reconciled) or
    # platform-spire-crds / platform-spire will InvalidSpecError "repo not permitted".
    - https://spiffe.github.io/helm-charts-hardened/        # SPIRE (platform-spire-crds / platform-spire Applications)

  # Platform services are cluster-wide; allow any namespace on the in-cluster API.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'

  # The platform project is privileged BY DESIGN: it installs CRDs and
  # cluster-scoped controllers. This is the ONE project allowed to do so.
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
