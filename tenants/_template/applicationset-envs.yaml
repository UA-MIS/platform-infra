# ============================================================================
# Environment ApplicationSet (§2.3, §4; ADR-008) — dev / staging / prod Apps.
# Tokens: __TEAM__, __APPNAME__ (the app repo, UA-MIS/<appName>), __SEMESTER__.
#
# MATRIX generator = (env list) x (git-files read of the app repo's CANONICAL
# promotion.yaml). Per ADR-008 (D-011) there is NO promotion.yaml in
# platform-infra; the single source of truth is
# __APPNAME__/.devops/promotion.yaml. This ApplicationSet READS it via the
# git `files:` generator so the per-env `gate` (auto vs manual) and `overlay`
# drive the rendered Application without a second copy and without a cross-repo
# fetch (the app repo is already this ApplicationSet's source, §2.3).
#
# How the matrix composes:
#   - list generator contributes {env: dev|staging|prod}
#   - git-files generator parses promotion.yaml; its TOP-LEVEL keys land at the
#     template root: .registry, .app, .environments (ArgoCD git-files exposes a
#     parsed file's top-level keys directly — confirmed against current docs).
#   - templatePatch reads (index .environments .env).gate: "manual" => NO
#     automated block; "auto" => prune+selfHeal. This template is data-driven off
#     promotion.yaml's `gate` — it does NOT hardcode env=>gate. Since the
#     promotion-model redesign (artifacts/design/promotion-model.md in
#     platform-infra), prod's gate is `auto`: the human gate moved to the
#     promote-to-prod workflow_dispatch (the git commit IS the approved state),
#     so ArgoCD just executes it — prod is Synced/green normally, OutOfSync only
#     for the brief window between a promotion commit and the next reconcile.
#
# Each generated App is pinned to the TEAM AppProject (project: __TEAM__) — the
# tenancy fence (§2.1) — so a team App can never escape its own project.
#
# NON-PROD SSO GATE (non-prod-sso-gate PR, STAGED — see that PR's body for the
# runbook): templatePatch ALSO forwardAuth-gates this env's Ingress behind the
# shared oauth2-proxy (any authenticated UA-MIS org member, ALL paths) whenever
# env != prod — see the templatePatch block below. Reuses the SAME Middleware the
# portal's /internal route uses (platform-services/portal/middleware.yaml,
# `portal-internal-auth`, PR #302), not a new one — see
# platform-services/db-console-auth/README.md "Consumers". This is `env`-gated,
# NOT `gate`-gated — promotion.yaml's `gate` (auto/manual) controls sync policy
# only and must not be conflated with auth.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: __TEAM__-envs
  namespace: argocd
  labels:
    platform.capstone/team: __TEAM__
    platform.capstone/semester: __SEMESTER__
    platform.capstone/component: tenant
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          # 1) the three stable environments.
          - list:
              elements:
                - env: dev
                - env: staging
                - env: prod
          # 2) the CANONICAL promotion.yaml from the APP repo (ADR-008). Its
          #    top-level keys (registry/app/environments) become root template
          #    params. One file -> one element, matrixed across the three envs.
          - git:
              repoURL: https://github.com/UA-MIS/__APPNAME__
              revision: HEAD
              files:
                - path: .devops/promotion.yaml
  # Non-cascading prune (F-7, FIX-10): by DEFAULT (preserveResourcesOnDeletion:
  # false), the ApplicationSet controller adds the ArgoCD resources-finalizer to
  # every generated Application, so pruning one (ApplicationSet deleted, or an env
  # element drops out of the matrix) makes ArgoCD individually delete its deployed
  # resources first -- and if a namespace vanishes mid-sync (Crossplane's cascade
  # deletes the tenant namespace independently and roughly concurrently during
  # teardown), ArgoCD won't run that finalizer while the sync operation is still
  # retrying, wedging the whole delete chain (Application -> AppProject -> the
  # Crossplane Object -> XR -> claim) until the retry budget exhausts. Setting
  # preserveResourcesOnDeletion: true makes Application pruning NON-cascading (no
  # finalizer added, so no wait): ArgoCD just removes its own Application CR, and
  # the ACTUAL cleanup of the deployed resources is Crossplane's job anyway --
  # deleting the tenant namespace already reclaims everything in it. This is the
  # SAME pattern already used for the identical class of problem in
  # applicationsets/platform-services-appset.yaml, whose own comment states the
  # trade-off exactly: "a dir removed WITHOUT a successor app leaves its live
  # objects orphaned for manual cleanup -- for this platform that beats a
  # glob/exclude edit being able to delete a live service." The tenant path
  # accepts the identical trade-off below.
  #
  # Does NOT touch the AppProject's own resources-finalizer (composition.yaml,
  # xp-<team>-appproject) -- that finalizer is a DIFFERENT mechanism (per ArgoCD's
  # own docs: "AppProjects use finalizers to ensure a project is not deleted
  # while it is still referenced by any application"), a safety check, not a
  # cascade-delete of deployed resources. Leaving it in place still costs one
  # extra reconcile-latency leg during teardown (observed ~70s, devops-e2e
  # live run) after the Application race above is eliminated -- expect
  # convergence in the ~2-2.5 min range, not ~90s, until/unless that leg is
  # addressed as its own deliberate decision (out of scope here).
  #
  # Trade-off (accepted, same as the precedent above): an env Application pruned
  # WITHOUT its namespace also going away (e.g. a malformed promotion.yaml drops
  # an element from the matrix) would leave its live workload resources running
  # until the namespace itself is cleaned up -- for a tenant env this is a
  # non-issue in the actual teardown path (the namespace goes with it), and is a
  # lesser risk than a tenant wedged Terminating indefinitely.
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '__TEAM__-{{.env}}'
      labels:
        platform.capstone/team: __TEAM__
        platform.capstone/semester: __SEMESTER__
        platform.capstone/env: '{{.env}}'
    spec:
      project: __TEAM__
      source:
        repoURL: https://github.com/UA-MIS/__APPNAME__
        targetRevision: HEAD
        # overlay is the FULL repo-relative path per the §4.1 schema, e.g.
        # ".devops/chart/overlays/dev" — used verbatim (not basename-joined).
        path: '{{ (index .environments .env).overlay }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '__TEAM__-{{.env}}'
  # Per-env sync policy from promotion.yaml's `gate`. `manual` => no `automated`
  # block => the production gate (§4). `auto` => prune+selfHeal.
  templatePatch: |
    {{- $gate := (index .environments .env).gate }}
    {{- $nonProd := ne .env "prod" }}
    spec:
    {{- if $nonProd }}
      # non-prod-sso-gate PR: $nonProd (env != prod) is the ONLY gate here — prod
      # stays public unconditionally, regardless of $gate above (sync policy, not
      # auth). Strategic merge (not JSON6902), safe whether or not the app's own
      # Ingress already carries other annotations.
      source:
        kustomize:
          patches:
            - target:
                kind: Ingress
                name: __APPNAME__
              patch: |-
                apiVersion: networking.k8s.io/v1
                kind: Ingress
                metadata:
                  name: __APPNAME__
                  annotations:
                    traefik.ingress.kubernetes.io/router.middlewares: db-console-auth-oauth2-proxy-errors@kubernetescrd,portal-portal-internal-auth@kubernetescrd
    {{- end }}
    {{- if eq $gate "auto" }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
    {{- else }}
      syncPolicy:
        syncOptions:
          - CreateNamespace=false
    {{- end }}
