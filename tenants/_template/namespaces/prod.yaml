# ============================================================================
# <team>-prod namespace bundle — PROD tier (§3.1–§3.4).
# Tokens: __TEAM__, __SEMESTER__.  Bundles, in dependency order:
#   Namespace -> ResourceQuota -> LimitRange -> NetworkPolicies -> Role/RoleBinding
# Every object carries the mandatory platform.capstone/{team,semester,env} labels.
# ============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: __TEAM__-prod
  labels:
    app.kubernetes.io/managed-by: argocd
    # Goldilocks recommend-only (Off mode) — sizing suggestions, never an eviction.
    goldilocks.fairwinds.com/enabled: "true"
    platform.capstone/team: __TEAM__
    platform.capstone/semester: __SEMESTER__
    platform.capstone/env: prod
    # Pod Security Admission: enforce the restricted profile cluster-side, so the
    # tenancy guarantee does not depend solely on the workload's own securityContext.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.31
---
# ResourceQuota — prod starting values (§3.2). Tunable per team later.
#
# ⚠ MUST STAY IN SYNC with the prod row of the env list in
# platform-services/crossplane/apis/composition.yaml (search `"name" "prod"`).
# Both are LIVE tenant-creation paths — this blueprint is rendered into
# tenants/team-<name>/ by the Backstage new-capstone-project wizard (picked up by
# tenants-appset, which excludes only tenants/_*), while the Composition serves
# the CapstoneTenant claim path. There is no reference between them, so they can
# only be kept aligned by hand.
#
# They had already drifted: this file said cpu 2/4 and pods 15 while the
# Composition said cpu 4/8 and pods 20, so a team's prod ceiling depended on
# which onboarding path created it. Corrected to match the Composition
# (health audit 2026-08-15 / B5). dev and staging were already identical.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: __TEAM__-prod
  labels:
    platform.capstone/team: __TEAM__
    platform.capstone/semester: __SEMESTER__
    platform.capstone/env: prod
spec:
  # Prod = higher ceiling than non-prod (§3.2).
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "20"
    services: "15"
    # Storage cap (replica-3 Ceph starvation fence). Prod = higher ceiling than non-prod.
    requests.storage: 20Gi
    persistentvolumeclaims: "6"
---
# LimitRange — per-container defaults + ceiling (§3.2). Ensures every pod gets
# requests/limits even if the workload omits them, so the quota is enforceable.
apiVersion: v1
kind: LimitRange
metadata:
  name: container-limits
  namespace: __TEAM__-prod
  labels:
    platform.capstone/team: __TEAM__
    platform.capstone/semester: __SEMESTER__
    platform.capstone/env: prod
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 1Gi
---
# NetworkPolicy 1/3 — DEFAULT-DENY ingress + egress (§3.4). Selects all pods;
# with no allow rules this denies everything until the allowances below add back
# the minimum. Cross-team traffic is denied by construction (no rule references
# another team's namespace).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: __TEAM__-prod
  labels:
    platform.capstone/team: __TEAM__
    platform.capstone/semester: __SEMESTER__
    platform.capstone/env: prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# NetworkPolicy 2/3 — allow ingress from Traefik to app pods, and intra-namespace
# pod<->pod (§3.4). Traefik runs in kube-system on k3s/k3d; we select it by
# namespace label. Intra-ns is allowed so an app's own components can talk.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-traefik-and-intra-ns
  namespace: __TEAM__-prod
  labels:
    platform.capstone/team: __TEAM__
    platform.capstone/semester: __SEMESTER__
    platform.capstone/env: prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # From the bundled Traefik (kube-system on k3s/k3d). kube-system carries the
    # well-known kubernetes.io/metadata.name label set by the API server.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    # Intra-namespace: pods of THIS team's namespace may talk to each other.
    - from:
        - podSelector: {}
    # Prometheus scrapes (un-defers D-155#6; pairs with the ServiceMonitor kind
    # in appproject.yaml's namespaceResourceWhitelist). WITHOUT this rule a
    # tenant ServiceMonitor is accepted, the target renders, and every scrape
    # silently BLACKHOLES -- Cilium enforces these policies for real (SEC-011
    # deny-test), and a denied scrape shows up as `context deadline exceeded`
    # (a timeout that reads like a slow app), NOT `connection refused`.
    # Scoped to the port named `http`, so this exposes the app's HTTP port to
    # the monitoring namespace and nothing else.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: http
---
# NetworkPolicy 3/3 — allow egress to cluster DNS only, plus intra-namespace
# (§3.4). The sample app needs DNS; it does NOT need the API server (its SA token
# is not even mounted), so no API egress is granted — least privilege.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns-and-intra-ns
  namespace: __TEAM__-prod
  labels:
    platform.capstone/team: __TEAM__
    platform.capstone/semester: __SEMESTER__
    platform.capstone/env: prod
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # DNS to CoreDNS in kube-system (UDP + TCP 53).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Intra-namespace egress so the app's own components can reach each other.
    - to:
        - podSelector: {}
    # DB tier — MariaDB (3306) / Postgres (5432), scoped to the db-tier namespace
    # by name. Codifies the tenant side of the CiliumNetworkPolicy hand-applied
    # live for swami-dev/staging/prod on 2026-07-07/08 (platform.capstone/team-
    # keyed ingress lives in platform-services/db-tier/netpol.yaml) as a REUSABLE
    # default: every tenant namespace gets the network PATH to db-tier, so a new
    # team never needs a hand-applied CNP to reach a managed DB. Opening the path
    # does not by itself grant access — actual credentials/grants are provisioned
    # only when the tenant claim sets spec.database (mysql/postgres); see
    # platform-services/crossplane/apis/composition.yaml.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: db-tier
      ports:
        - protocol: TCP
          port: 3306
        - protocol: TCP
          port: 5432
---
# Team Role — namespaced, workload-scoped (§3.3). Read + limited write on the
# kinds a student debugs/deploys. NEVER: Secrets (raw), Nodes, RBAC, Quota,
# LimitRange, NetworkPolicy (all platform-managed). No cluster-admin anywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: team-developer
  namespace: __TEAM__-prod
  labels:
    platform.capstone/team: __TEAM__
    platform.capstone/semester: __SEMESTER__
    platform.capstone/env: prod
rules:
  # Inspect + manage own workloads.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["bitnami.com"]
    resources: ["sealedsecrets"]
    verbs: ["get", "list", "watch"]
  # Debugging: read pods, logs, and exec — but NOT delete pods or read Secrets.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
# RoleBinding — binds the team Role to the team's Keycloak group (Phase 2) /
# local admin (Phase 1). Scoped to THIS namespace only; no ClusterRoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-developer
  namespace: __TEAM__-prod
  labels:
    platform.capstone/team: __TEAM__
    platform.capstone/semester: __SEMESTER__
    platform.capstone/env: prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: team-developer
subjects:
  # Phase 2: the Keycloak-federated group for this team. Phase 1: demonstrated
  # via the local argocd admin; this Group subject is inert until OIDC is wired.
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: __TEAM__-developers
