# ============================================================================
# VM-TIER AppProject — the tenancy fence for KubeVirt workloads (ADR-032). *** GATE ***
# Tokens: __TEAM__, __APPNAME__, __SEMESTER__.
#
# A SEPARATE AppProject from the team's container project, by design. This is
# defense-in-depth: VM kinds (VirtualMachine/DataVolume) are whitelisted ONLY in
# this project, whose destinations are ONLY the `__TEAM__-vm-*` baseline-PSA
# namespaces. So even at the GitOps layer — not just Pod Security Admission — a
# team cannot create a VM in their `restricted` container namespaces, and cannot
# create container Deployments in their relaxed VM namespace. The privilege
# relaxation and the VM kinds travel together, fenced to one place.
#
# SECURITY CONTRACT (parallels tenants/_template/appproject.yaml):
#   - sourceRepos: ONLY the team's app repo + platform-infra (same as container).
#   - destinations: ONLY __TEAM__-vm-* on the in-cluster API. Cannot target another
#     team's namespace, the container namespaces, or another cluster.
#   - clusterResourceWhitelist: EMPTY. VirtualMachine, VirtualMachineInstance, and
#     DataVolume are ALL namespaced, so NO cluster-scope grant is needed — the hard
#     tenancy boundary (no CRDs/ClusterRoles/PVs/Namespaces) is preserved verbatim.
#   - namespaceResourceWhitelist: the VM kinds + ONLY the networking/config/secret
#     kinds a VM needs to be reachable and configured. Deliberately ABSENT vs the
#     container project: Deployment / ReplicaSet / HorizontalPodAutoscaler — the
#     baseline-PSA namespace must host VMs, not become a home for arbitrary
#     relaxed-privilege containers.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: __TEAM__-vm
  namespace: argocd
  labels:
    platform.capstone/team: __TEAM__
    platform.capstone/semester: __SEMESTER__
    platform.capstone/component: tenant
    platform.capstone/tier: vm
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "VM-tier project for team __TEAM__ (__SEMESTER__). KubeVirt workloads only; baseline-PSA namespaces; no cluster-scoped resources."

  # --- source repos: the team's app repo + platform-infra (identical to container) ---
  sourceRepos:
    - https://github.com/UA-MIS/__APPNAME__
    - https://github.com/UA-MIS/__APPNAME__.git
    - https://github.com/UA-MIS/platform-infra
    - https://github.com/UA-MIS/platform-infra.git

  # --- destinations: ONLY this team's VM namespaces on the in-cluster API ---------
  # `vm-prod` is the default single VM home; the `__TEAM__-vm-*` wildcard also
  # covers an opt-in `__TEAM__-vm-dev` without an AppProject edit.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: __TEAM__-vm-prod
    - server: https://kubernetes.default.svc
      namespace: __TEAM__-vm-*

  # --- cluster-scoped resources: NONE. Hard tenancy boundary, unchanged. ----------
  # All VM kinds are namespaced; no cluster-scope grant is required. (KubeVirt/CDI
  # CRDs + the KubeVirt CR are installed by the PLATFORM, not by tenants.)
  clusterResourceWhitelist: []

  # --- namespaced resources: VM kinds + only what a VM needs to run/serve ---------
  namespaceResourceWhitelist:
    # VM workload kinds (ADR-032 §2c). VirtualMachineInstance is normally created by
    # the controller from the VirtualMachine, but is whitelisted so a team may also
    # declare a bare VMI and so ArgoCD does not flag the controller-created VMI as
    # an out-of-whitelist resource during pruning/diff.
    - group: kubevirt.io
      kind: VirtualMachine
    - group: kubevirt.io
      kind: VirtualMachineInstance
    - group: cdi.kubevirt.io
      kind: DataVolume
    # Networking + config so the VM gets a URL and first-boot setup.
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: networking.k8s.io
      kind: Ingress
    # Secrets stay encrypted-at-rest only (raw Secret ABSENT — platform controllers
    # mint it), exactly as in the container project.
    - group: bitnami.com
      kind: SealedSecret
    - group: external-secrets.io
      kind: ExternalSecret
    - group: external-secrets.io
      kind: SecretStore
    # NOTE — deliberately NOT whitelisted: Deployment, ReplicaSet,
    # HorizontalPodAutoscaler (container workloads belong in the restricted tiers),
    # VirtualMachineInstanceMigration (live-migration deferred — needs CephFS RWX,
    # ADR-032 open Q3), and any cluster-scoped kind.

  # --- ArgoCD RBAC role for the team (parallels the container project) -------------
  roles:
    - name: developer
      description: "Team __TEAM__ developers — sync/get own VM apps only."
      policies:
        - p, proj:__TEAM__-vm:developer, applications, get, __TEAM__-vm/*, allow
        - p, proj:__TEAM__-vm:developer, applications, sync, __TEAM__-vm/*, allow
        # Explicitly NO delete, NO override, NO action/* — least privilege.
      groups:
        - __TEAM__-developers
