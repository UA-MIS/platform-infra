# Crimson Copies — the feature-complete REFERENCE application (D-154/D-155).
#
# ONE CapstoneTenant XR; the reviewed-once Crossplane Composition
# (platform-services/crossplane/apis/composition.yaml) expands it into the full
# tenant: Harbor project + push/pull robots, Vault policy/role, the k8s tenancy
# fence (3 namespaces + quota/limitrange/netpol/RBAC/PSA), ESO plumbing
# (SecretStore vault-tenant + SA eso-tenant + vault-ca), the env ApplicationSet,
# a per-team ARC runner scale set (runs-on: crimson-copies-kaniko), and — because
# `database: mysql` — a per-env MariaDB schema/user/grant on the in-cluster DB
# tier with credentials pushed to tenants/crimson-copies/<env>/database.
#
# NOTE the Composition creates NO GitHub state (ADR-035 §D2) — the app repo
# UA-MIS/crimson-copies is owned end-to-end outside this claim. The env
# ApplicationSet reads .devops/promotion.yaml from that repo at HEAD, so the repo
# must exist and carry the contract before dev can render.
#
# De-provision = `git rm` this file (plus strip the app repo's `capstone-tenant`
# topic — see tenants/_claims/README.md).
apiVersion: platform.capstone.uamishub.com/v1alpha1
kind: CapstoneTenant
metadata:
  name: crimson-copies-crimson-copies
  labels:
    platform.capstone/team: "crimson-copies"
    platform.capstone/semester: "2026-fall"
    platform.capstone/component: tenant
spec:
  team: "crimson-copies"
  appName: "crimson-copies"
  semester: "2026-fall"
  githubTeam: "crimson-copies"
  # Container port of the PUBLIC entrypoint (storefront, Next.js standalone).
  # The chart sets each component's own port from .devops/components.yaml; this
  # XRD field is only the default the Composition carries.
  port: 3000
  # Preview OFF: preview namespaces (<team>-pr-<n>) get no quota/LimitRange/netpol,
  # no eso-tenant SA and no harbor-pull from the Composition, and the Vault role
  # binds the literal `crimson-copies-preview` namespace which the preview
  # ApplicationSet never creates. Not safe to enable for this tenant.
  previewEnabled: false
  # SECURITY-GATED (default false platform-wide; see xrd.yaml). Drops the non-prod
  # SSO forwardAuth from the DEV ingress only -- staging stays gated, prod was
  # never gated.
  #
  # WHY, specifically: the SSO gate returns a 302 BEFORE Traefik routes to the
  # backend, so a gated environment emits NO per-service ingress metrics at all --
  # measured, not assumed: 453 requests to dev produced 453 entries in
  # traefik_entrypoint_requests_total and ZERO in traefik_service_requests_total.
  # That makes dev's Grafana traffic panels structurally empty, and dev is the only
  # env where synthetic orders are permitted. Without this flag the reference app
  # cannot show real traffic AND real business metrics on one dashboard -- the
  # whole point of it being the reference app.
  #
  # ALL THREE DEV HOSTS, not just the storefront. Traefik's
  # `router.middlewares` annotation lives on the Ingress OBJECT, not per-rule,
  # and this chart puts all three hosts on one Ingress -- so the gate drops from
  # crimson-copies-dev, crimson-copies-staff-dev AND crimson-copies-intake-dev
  # together. The intake host is the one worth thinking about: it is the
  # ADR-058 email webhook, path-scoped `Exact` to /inbound/email, and it CREATES
  # ORDERS. It is safe here because it was designed to face the internet without
  # the platform gate and carries its own stack: HMAC-SHA256 over the raw body
  # with timingSafeEqual, a 5-minute replay window with the timestamp bound into
  # the signed material, size/extension/attachment caps, a per-sender rate limit,
  # and one indistinguishable 401 for every failure (no oracle). Its secret is
  # per-env (secret/tenants/crimson-copies/dev/app), so a dev compromise cannot
  # be replayed at prod. And prod's intake host has NEVER been gated -- prod is
  # unconditionally excluded from $nonProd -- so this endpoint has always had to
  # survive on its own guards. Dev is catching up to prod's posture, not
  # departing from it. (It also un-breaks something: with the gate on, Cloudflare
  # could not have POSTed to dev's intake host at all.)
  #
  # Exposure this actually grants: dev's public pages (/, /pricing, /sign-in)
  # become reachable without an org login -- exactly what prod already exposes.
  # Everything behind them is still Clerk-gated by the app itself (/order,
  # /orders, /api/orders are middleware-protected), the staff console needs a
  # staff role, and orders-api has no public ingress at all. The data is
  # synthetic. This removes the platform's outer org-membership gate, not the
  # application's own login.
  publicDevIngress: true
  domain: "capstone.uamishub.com"
  # MySQL-compatible (in-cluster MariaDB 11.8). Every backend in this app is
  # MySQL-only (Drizzle + mysql2), so `postgres` is not an option here.
  database: "mysql"
  # Pinned explicitly (2026-08-25, owner-decided): the platform default for
  # spec.maxRunners just dropped 8→5 (xrd.yaml) now that it's a per-tenant claim
  # field instead of a value hardcoded for every tenant (#535 follow-on). This
  # tenant's 5-image build matrix is the reason 8 was raised platform-wide in the
  # first place, so it stays at 8 here explicitly — pinning it in the claim is
  # what keeps this tenant from silently regressing to the new 5 default.
  maxRunners: 8
