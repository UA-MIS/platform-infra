# Emitted by The Process scaffolder (capstone:emit-tenant-claim, ADR-031).
# ONE CapstoneTenant XR — a reviewed-once Crossplane Composition expands it into
# the full tenant (repo + Harbor + Vault + the k8s tenancy fence). No onboarding
# PR, no operator make steps.
#
# De-provision: prefer The Process admin "Tenant Teardown" page (it opens this
# same git-rm PR AND strips the capstone-tenant GitHub topic from the app repo,
# so catalog discovery stops re-registering it). `git rm` THIS FILE ALONE also
# fully reclaims the cluster/Harbor/Vault resources (Crossplane cascade, same as
# the portal path) but leaves the app repo's capstone-tenant topic in place — a
# "ghost tenant" that keeps reappearing in the catalog until someone strips the
# topic by hand. See tenants/_claims/README.md "De-provision".
apiVersion: platform.capstone.uamishub.com/v1alpha1
kind: CapstoneTenant
metadata:
  name: motion-attributeextractor
  labels:
    platform.capstone/team: "motion"
    platform.capstone/semester: "2026-fall"
    platform.capstone/component: tenant
spec:
  team: "motion"
  appName: "attributeextractor"
  semester: "2026-fall"
  githubTeam: "motion"
  port: 8080
  previewEnabled: false
  domain: "capstone.uamishub.com"
  database: "mysql"
  # Kaniko BUILD step-pod memory raise (xrd.yaml spec.kanikoMemoryLimitGi), scoped
  # to this tenant only -- the arc-runners namespace default (8Gi,
  # platform-services/arc/limitrange.yaml) stays untouched for every other team.
  # attributeextractor's image is ~9.7GB (torch/transformers/spacy/pandas); it
  # OOMKilled (exit 137) at 8Gi even after the shared _contract's Kaniko
  # memory-safety flags (--snapshot-mode=redo/--compressed-caching=false/
  # --use-new-run) fixed the build-time OOM -- --reproducible still has to
  # rewrite every layer's tar headers for the full image size at PUSH/finalize
  # time. 16Gi verified live (arc-hook-template-motion, hand-patched for the
  # test ahead of this PR) to get the build through push + digest-file write.
  # NOTE for the team: the real fix is the CPU-only PyTorch wheel index (see the
  # devops write-up) -- that would cut this image by roughly two-thirds and make
  # this override unnecessary. Lower this back toward the platform default once
  # that lands and the measured image size no longer needs it.
  kanikoMemoryLimitGi: 16
