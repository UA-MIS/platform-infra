# IDA-LLM — an LLM benchmark harness + results platform (2026-fall).
#
# PROVISIONED BY HAND, deliberately. The Backstage zero-touch wizard emits this
# same XR, but not for this SHAPE: the wizard has no `database: postgres` option
# (D-185 — "ask us and we set it up by hand" is the documented path for it), and
# the app runs two kinds the tenant AppProject only just learned to permit
# (StatefulSet for Redis, CronJob for the nightly sweeps — platform-infra #532).
# Everything below is otherwise the ordinary contract; nothing here is bespoke.
#
# ONE CapstoneTenant XR; the reviewed-once Crossplane Composition
# (platform-services/crossplane/apis/composition.yaml) expands it into the full
# tenant: Harbor project + push/pull robots, Vault policy/role, the k8s tenancy
# fence (3 namespaces + quota/limitrange/netpol/RBAC/PSA), ESO plumbing
# (SecretStore vault-tenant + SA eso-tenant + vault-ca), the env ApplicationSet,
# a per-team ARC runner scale set (runs-on: ida-llm-kaniko), and — because
# `database: postgres` — a per-env PG17 database + login role + grant on the
# in-cluster tenant DB tier, with credentials pushed to
# tenants/ida-llm/<env>/database plus the per-team Adminer console in ida-llm-dev.
#
# The Composition creates NO GitHub state (ADR-035 §D2) — the app repo
# UA-MIS/ida-llm is owned end-to-end outside this claim. The env ApplicationSet
# reads .devops/promotion.yaml from that repo at HEAD, so the repo must exist and
# carry the contract before dev can render. It does.
#
# De-provision = `git rm` this file (plus strip the app repo's `capstone-tenant`
# topic — see tenants/_claims/README.md).
apiVersion: platform.capstone.uamishub.com/v1alpha1
kind: CapstoneTenant
metadata:
  name: ida-llm-ida-llm
  labels:
    platform.capstone/team: "ida-llm"
    platform.capstone/semester: "2026-fall"
    platform.capstone/component: tenant
spec:
  team: "ida-llm"
  appName: "ida-llm"
  semester: "2026-fall"
  githubTeam: "ida-llm"
  # Container port of the PUBLIC entrypoint (the Next.js frontend, standalone).
  # The chart sets each component's own port from .devops/components.yaml; this
  # XRD field is only the default the Composition carries.
  port: 3000

  # ── PREVIEW: ON. Every blocker below was closed first, not waived. ────────
  # Turning this flag on used to produce previews that were broken AND unfenced.
  # The four blockers named in tenants/_template/applicationset-preview.yaml
  # ("UNTIL B1 LANDS, PREVIEWS ARE UNFENCED — do not enable") are now addressed:
  #
  #   B1  NO FENCE. A preview namespace is ArgoCD-created, so the Composition's
  #       per-env bundle (which ranges over dev|staging|prod) never gave it a
  #       quota, LimitRange or NetworkPolicy — it had MORE network reach than
  #       prod while running untrusted PR code. CLOSED by
  #       applicationsets/ida-llm-preview-guardrails.yaml: a PLATFORM-project
  #       ApplicationSet on the same pullRequest generator and the same `preview`
  #       label gate, rendering the fence into ida-llm-pr-<n>. It must be a
  #       platform app — a tenant that can write its own quota and netpol has no
  #       fence at all.
  #
  #   B2  VAULT AUTH. The k8s-auth role's bound_service_account_namespaces is an
  #       exact list (the three envs + the literal `ida-llm-preview`), not a
  #       glob, and provider-vault v0.1.0 exposes no namespace-SELECTOR field —
  #       verified against the live CRD, not assumed. Binding ["*"] would let any
  #       namespace assume the tenant role, which is strictly worse. CLOSED by
  #       not needing it: preview secrets come from the platform-owned
  #       `vault-backend` ClusterSecretStore, rendered by the guardrails app so
  #       the tenant cannot repoint the path.
  #
  #   B3  IMAGE PULLS. harbor-pull is explicitly not rendered for preview, so
  #       every pod ImagePullBackOff'd against the private Harbor project. CLOSED
  #       by the guardrails app materialising it from the same dev robot token.
  #
  #   B4  STATIC pr-1 COLLISION. Only ever affected the OLD blueprint path
  #       (tenants/_template/namespaces/preview.yaml). This tenant was created
  #       from the CapstoneTenant claim, which renders no static pr-1 namespace —
  #       confirmed by reading the Composition. Not applicable here.
  #
  # AND THE THING THAT MAKES A PREVIEW SAFE TO RUN AT ALL: it never touches the
  # team's data or their money. The fence grants NO egress to the db-tier, so a
  # preview gets a THROWAWAY in-namespace Postgres instead of the shared tenant
  # database — one bad migration in a PR cannot drop the team's dev tables. Its
  # provider keys come from a SEPARATE Vault path holding mock values only, and
  # the overlay points the harness at the in-cluster mock model endpoint, so a
  # pull request cannot spend cloud credits or reach campus hardware.
  #
  # Lifecycle is unchanged: a preview exists IFF its PR carries the `preview`
  # label. CI re-adds it on every PR build; the cohort-gc preview-ttl CronJob
  # removes it at 12h, which drops the element from BOTH generators so the app
  # and its fence are pruned together.
  previewEnabled: true

  # Default (false). Dev keeps the platform's non-prod SSO forwardAuth gate.
  # Unlike crimson-copies there is no showcase-metrics argument for dropping it
  # here, and benchmark results are the team's own research output.
  publicDevIngress: false

  domain: "capstone.uamishub.com"

  # PostgreSQL — the PG17 engine of the in-cluster tenant DB tier, via
  # provider-sql (postgresql.sql.crossplane.io Database + login Role + Grant).
  # Chosen because the app is Python/SQLAlchemy + Alembic and stores benchmark
  # run records relationally. Per env this mints database + role `ida_llm_<env>`
  # and pushes username/password/host/port to tenants/ida-llm/<env>/database —
  # the SAME four properties the MySQL path writes, so the consumer contract is
  # engine-agnostic and only the DSN scheme differs (postgresql://).
  database: "postgres"

  # Pinned explicitly (2026-08-25, owner-decided): the platform default for
  # spec.maxRunners just dropped 8→5 (xrd.yaml) now that it's a per-tenant claim
  # field instead of a value hardcoded for every tenant (#535 follow-on). This
  # tenant's near-term 3-4 image build matrix is the reason 8 was raised
  # platform-wide in the first place, so it stays at 8 here explicitly — pinning
  # it in the claim is what keeps this tenant from silently regressing to the
  # new 5 default.
  maxRunners: 8
