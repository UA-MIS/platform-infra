# Crimson Copies (STRIPPED) — the student-start variant of the reference app,
# deployed as a SECOND, independent tenant alongside crimson-copies (D-154/D-155).
#
# Temporary / short-lived: stood up for a professor demo so the stripped and
# reference apps can be compared side by side. De-provision = `git rm` this file
# (then strip the app repo's `capstone-tenant` topic — see _claims/README.md).
#
# HOW THIS TENANT DIFFERS from crimson-copies:
#   - Auth is HAND-ROLLED (signed session cookie + a `users` table), NOT Clerk. The
#     app makes NO outbound calls to any third party, so this tenant needs NO
#     external-egress NetworkPolicy — the default tenant fence (DNS + intra-ns +
#     db-tier:3306) is sufficient. That is a real reduction in blast radius versus
#     the reference tenant, not an oversight.
#   - FOUR components, not five: file-intake was carved out and notify is a stub.
#   - No object store and no SMTP sink are deployed (nothing writes to either).
#
# Same in every other respect: MySQL-family backend on the in-cluster MariaDB tier,
# build-once/promote-same-image across dev/staging/prod.
apiVersion: platform.capstone.uamishub.com/v1alpha1
kind: CapstoneTenant
metadata:
  name: crimson-copies-stripped-crimson-copies-stripped
  labels:
    platform.capstone/team: "crimson-copies-stripped"
    platform.capstone/semester: "2026-fall"
    platform.capstone/component: tenant
spec:
  team: "crimson-copies-stripped"
  appName: "crimson-copies-stripped"
  semester: "2026-fall"
  githubTeam: "crimson-copies-stripped"
  # Container port of the public entrypoint (storefront, Next.js standalone). Each
  # component's real port comes from .devops/components.yaml.
  port: 3000
  # Preview OFF — preview namespaces get no quota/netpol/eso-tenant/harbor-pull from
  # the Composition, and the Vault role binds a `-preview` namespace the preview
  # ApplicationSet never creates.
  previewEnabled: false
  domain: "capstone.uamishub.com"
  # The stripped orders-api is Drizzle + mysql2, same as the reference.
  database: "mysql"
