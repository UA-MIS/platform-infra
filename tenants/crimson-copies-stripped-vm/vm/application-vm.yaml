# ============================================================================
# VM Application — deploys the crimson-copies-stripped guest into
# crimson-copies-stripped-vm-prod.
#
# WHY AN Application AND NOT THE BLUEPRINT'S applicationset-vm.yaml.
# The blueprint's ApplicationSet sources the VM chart from the APP repo
# (.devops/chart/overlays/prod, discovered via .devops/promotion.yaml). That is
# exactly the deploy infrastructure this tenant deliberately does NOT have:
# UA-MIS/crimson-copies-stripped is the STUDENT-START template, reset to 60c1fbd,
# and containerising + GitOps-deploying it is the work students do in later
# stories. Shipping a .devops/ tree back onto that repo to satisfy the appset
# would hand them the answer key — the whole reason this tenant was re-architected
# off the container tier.
#
# So the VM's manifests live PLATFORM-side instead, under
# tenants/_vm-workloads/crimson-copies-stripped/, and a plain Application syncs
# them. The destination is still only crimson-copies-stripped-vm-prod; nothing about
# the tenancy boundary moves.
#
# ⚠ THE PARAGRAPH THAT USED TO BE HERE WAS TRUE WHEN WRITTEN AND IS NOT ANY MORE.
# It said "the VM AppProject already whitelists platform-infra as a sourceRepo". That
# held on 2026-08-21 (7d954b7, #505), when this tenant was rendered from a
# tenants/_template-vm/ that still carried the entry. On 2026-08-26, 1175d4b (#569)
# removed platform-infra from every tenant AppProject for SEC-024 — naming THIS
# tenant's file explicitly — and this Application, which depended on that entry, was
# not updated with it. The result was silent: ArgoCD refused to reconcile with
#     InvalidSpecError — application repo .../platform-infra is not permitted
#     in project 'crimson-copies-stripped-vm'
# while the already-synced VM kept running and lastOp still read "Succeeded". A
# comment asserting a fact about ANOTHER file is a claim that goes stale without
# telling anyone; `make validate` guard [8/8] now checks the relation for real.
#
# The project below is therefore NOT the tenant VM project. It is a PLATFORM-owned
# project that permits platform-infra and binds no tenant role — see
# appproject-vm-platform.yaml for why that, rather than re-adding platform-infra to
# the tenant fence and reversing SEC-024.
#
# Single environment, matching the blueprint's model: one lifted VM, one live home,
# no dev/staging/prod fan-out.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crimson-copies-stripped-vm-prod
  namespace: argocd
  labels:
    platform.capstone/team: crimson-copies-stripped
    platform.capstone/semester: 2026-fall
    platform.capstone/env: prod
    platform.capstone/tier: vm
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: crimson-copies-stripped-vm-platform
  source:
    repoURL: https://github.com/UA-MIS/platform-infra
    targetRevision: HEAD
    path: tenants/_vm-workloads/crimson-copies-stripped
  destination:
    server: https://kubernetes.default.svc
    namespace: crimson-copies-stripped-vm-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The namespace + quota + netpols come from the vm/namespaces bundle, which
      # the tenant bootstrap app owns — this app must not create it.
      - CreateNamespace=false
      # A DataVolume mutates heavily while CDI imports (status, conditions,
      # annotations), and the VirtualMachine's dataVolumeTemplates are rewritten by
      # the controller. Server-side apply keeps ArgoCD from fighting those.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
