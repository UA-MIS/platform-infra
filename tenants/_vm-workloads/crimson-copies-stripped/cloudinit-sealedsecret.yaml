# ============================================================================
# cloud-init userdata for the crimson-copies-stripped VM — SEALED.
#
# KubeVirt's cloudInitNoCloud.secretRef reads a RAW Secret with key `userdata`;
# it cannot take a ConfigMap. The VM tier's AppProject whitelists a plain Secret
# for exactly that reason, but on the assumption (see its comment) that a
# cloud-init body is NON-secret bootstrap. This one is not: it carries a
# READ-ONLY, single-repo GitHub deploy key, because UA-MIS/crimson-copies-stripped
# is private and the guest clones its own source on first boot. So it ships
# sealed instead of plain, which is also what the container tier requires of
# every other secret.
#
# What the userdata does, in short: rewrites apt to HTTPS (the tier allows :443
# only), installs Node 22 + MariaDB + nginx natively, clones the app pinned to
# 60c1fbd, builds it, seeds the demo users, installs the app repo's OWN four
# systemd units verbatim, and puts nginx in front. The app's runtime secrets
# (session secrets, internal API key, DB password) are generated ON the guest at
# first boot and never exist in git.
#
# To regenerate after editing the plaintext userdata:
#   kubectl create secret generic crimson-copies-stripped-cloudinit \
#     --namespace crimson-copies-stripped-vm-prod \
#     --from-file=userdata=./userdata.yaml --dry-run=client -o yaml \
#   | kubeseal --controller-namespace kube-system \
#              --controller-name sealed-secrets-controller --format yaml
#
# The seal is strict-scoped to this exact name + namespace.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: crimson-copies-stripped-cloudinit
  namespace: crimson-copies-stripped-vm-prod
spec:
  encryptedData:
    userdata: 
  template:
    metadata:
      name: crimson-copies-stripped-cloudinit
      namespace: crimson-copies-stripped-vm-prod
