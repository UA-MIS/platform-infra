# ============================================================================
# Environment ApplicationSet (§2.3, §4; ADR-008) — dev / staging / prod Apps.
# Tokens: tenantvm, tenantvm (the app repo, UA-MIS/<appName>), 2026-summer.
#
# MATRIX generator = (env list) x (git-files read of the app repo's CANONICAL
# promotion.yaml). Per ADR-008 (D-011) there is NO promotion.yaml in
# platform-infra; the single source of truth is
# tenantvm/.devops/promotion.yaml. This ApplicationSet READS it via the
# git `files:` generator so the per-env `gate` (auto vs manual) and `overlay`
# drive the rendered Application without a second copy and without a cross-repo
# fetch (the app repo is already this ApplicationSet's source, §2.3).
#
# How the matrix composes:
#   - list generator contributes {env: dev|staging|prod}
#   - git-files generator parses promotion.yaml; its TOP-LEVEL keys land at the
#     template root: .registry, .app, .environments (ArgoCD git-files exposes a
#     parsed file's top-level keys directly — confirmed against current docs).
#   - templatePatch reads (index .environments .env).gate: "manual" => NO
#     automated block; "auto" => prune+selfHeal. This template is data-driven off
#     promotion.yaml's `gate` — it does NOT hardcode env=>gate. Since the
#     promotion-model redesign (artifacts/design/promotion-model.md in
#     platform-infra), prod's gate is `auto`: the human gate moved to the
#     promote-to-prod workflow_dispatch (the git commit IS the approved state),
#     so ArgoCD just executes it — prod is Synced/green normally, OutOfSync only
#     for the brief window between a promotion commit and the next reconcile.
#
# Each generated App is pinned to the TEAM AppProject (project: tenantvm) — the
# tenancy fence (§2.1) — so a team App can never escape its own project.
#
# NON-PROD SSO GATE (non-prod-sso-gate PR, STAGED — see that PR's body for the
# runbook): templatePatch ALSO forwardAuth-gates this env's Ingress behind the
# shared oauth2-proxy (any authenticated UA-MIS org member, ALL paths) whenever
# env != prod — see the templatePatch block below. Reuses the SAME Middleware the
# portal's /internal route uses (platform-services/portal/middleware.yaml,
# `portal-internal-auth`, PR #302), not a new one — see
# platform-services/db-console-auth/README.md "Consumers". This is `env`-gated,
# NOT `gate`-gated — promotion.yaml's `gate` (auto/manual) controls sync policy
# only and must not be conflated with auth.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenantvm-envs
  namespace: argocd
  labels:
    platform.capstone/team: tenantvm
    platform.capstone/semester: 2026-summer
    platform.capstone/component: tenant
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          # 1) the three stable environments.
          - list:
              elements:
                - env: dev
                - env: staging
                - env: prod
          # 2) the CANONICAL promotion.yaml from the APP repo (ADR-008). Its
          #    top-level keys (registry/app/environments) become root template
          #    params. One file -> one element, matrixed across the three envs.
          - git:
              repoURL: https://github.com/UA-MIS/tenantvm
              revision: HEAD
              files:
                - path: .devops/promotion.yaml
  template:
    metadata:
      name: 'tenantvm-{{.env}}'
      labels:
        platform.capstone/team: tenantvm
        platform.capstone/semester: 2026-summer
        platform.capstone/env: '{{.env}}'
    spec:
      project: tenantvm
      source:
        repoURL: https://github.com/UA-MIS/tenantvm
        targetRevision: HEAD
        # overlay is the FULL repo-relative path per the §4.1 schema, e.g.
        # ".devops/chart/overlays/dev" — used verbatim (not basename-joined).
        path: '{{ (index .environments .env).overlay }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'tenantvm-{{.env}}'
  # Per-env sync policy from promotion.yaml's `gate`. `manual` => no `automated`
  # block => the production gate (§4). `auto` => prune+selfHeal.
  templatePatch: |
    {{- $gate := (index .environments .env).gate }}
    {{- $nonProd := ne .env "prod" }}
    spec:
    {{- if $nonProd }}
      # non-prod-sso-gate PR: $nonProd (env != prod) is the ONLY gate here — prod
      # stays public unconditionally, regardless of $gate above (sync policy, not
      # auth). Strategic merge (not JSON6902), safe whether or not the app's own
      # Ingress already carries other annotations.
      source:
        kustomize:
          patches:
            - target:
                kind: Ingress
                name: tenantvm
              patch: |-
                apiVersion: networking.k8s.io/v1
                kind: Ingress
                metadata:
                  name: tenantvm
                  annotations:
                    traefik.ingress.kubernetes.io/router.middlewares: db-console-auth-oauth2-proxy-errors@kubernetescrd,portal-portal-internal-auth@kubernetescrd
    {{- end }}
    {{- if eq $gate "auto" }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
    {{- else }}
      syncPolicy:
        syncOptions:
          - CreateNamespace=false
    {{- end }}
