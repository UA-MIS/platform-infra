  prod_overlay_prune_gap:
    ask: >
      molly-demo-prod (a LIVE, in-use tenant — NOT to be torn down) has zero
      Deployments but 2 live ReplicaSets + 4 pods (2 known/expected
      crash-looping on a pre-66d5660 image, not the subject of this
      investigation). Root-cause whether ArgoCD's prune is misconfigured for
      the prod overlay's resource kinds; fix in the contract/appset if so.
    investigation_so_far: >
      Read the code before asking anyone to run anything live. Prod overlay
      for a single-component tenant runs an Argo Rollouts `Rollout` in place
      of a Deployment (ADR-037: rollout.yaml + a kustomize
      `$patch: delete` on the base Deployment of the same name) — so "zero
      Deployments" in prod is EXPECTED architecture, not automatically an
      anomaly on its own. platform-services/argocd-config/argocd-cm.yaml has
      NO `resource.customizations.health.argoproj.io_Rollout` entry — ArgoCD
      has no special health/resource-tree awareness of Rollout beyond
      installing the controller (applicationsets/argo-rollouts-app.yaml).

      Per Argo Rollouts' own docs/source (Context7 /argoproj/argo-rollouts):
      a canary's `pause` steps (even timed ones) only begin counting once the
      preceding `setWeight` step's canary pods are Available; at
      `setWeight: 100` the stable RS scales to 0. If the new revision's pods
      never become Ready — which matches "2 crash-looping pods" — the Rollout
      can hang indefinitely at a partial step with BOTH stable and canary
      ReplicaSets holding live, non-zero pods. This strategy has no
      `analysis`/automated-abort step configured (rollout.yaml), so nothing
      would ever un-stick it or roll it back automatically.

      Working hypothesis, NOT yet confirmed: this may not be an ArgoCD prune
      gap at all — it could be a Rollout stuck mid-canary on a permanently-
      unhealthy image, which is a different (if related) problem: the
      canary strategy has no failure-abort path, so a broken image just
      burns double resources forever instead of the deploy failing loudly.
      Requested devops-e2e pull the live Rollout status, each ReplicaSet's
      ownerReferences (do they point at the live Rollout, or are they
      genuinely orphaned/ownerless), and the ArgoCD Application's tracked
      resources (does it even list these RS) to distinguish "stuck canary"
      from "true prune gap" before committing to a contract fix.
    status: "PENDING — diagnostic request sent to devops-e2e, read-only, specimen preserved."

# ============================================================================
# 1. F-7 — ArgoCD sync race during teardown
# ============================================================================
f7_argocd_sync_race:
  finding: >
    The final teardown delete chain stalled 4+ minutes on three orphaned
    Applications (e2efall26-{dev,staging,prod}): "Retrying attempt #5",
    "Skipping retrying in-progress operation." This resolved only because the
    retry budget (limit: 5) exhausted — a longer/unbounded retry policy would
    wedge a tenant in Terminating indefinitely.

  root_cause: >
    Confirmed against the ArgoCD ApplicationSet documentation (Context7
    /argoproj/applicationset, Application-Deletion.md), not inferred: "If the
    .syncPolicy.preserveResourcesOnDeletion is set to false [the DEFAULT], these
    Application resources also have an Argo CD finalizer. When an ApplicationSet
    is deleted, its Application resources are deleted, and subsequently, the
    resources deployed by those Applications are also deleted by Argo CD."

    The tenant env ApplicationSet (rendered by composition.yaml AND mirrored in
    tenants/_template/applicationset-envs.yaml) does NOT set
    preserveResourcesOnDeletion, so it defaults to false. When teardown deletes
    this ApplicationSet's Object (as part of the XR cascade), the ApplicationSet
    controller therefore CASCADE-deletes its generated dev/staging/prod
    Applications: it adds the resources-finalizer, then deletes, which makes
    ArgoCD try to individually delete each Application's deployed resources
    before letting the Application CR itself go. Crossplane's own k8s-ns-*
    Objects delete the SAME tenant namespaces independently and roughly
    concurrently (no explicit ordering between the two deletion paths). If the
    namespace vanishes while an Application's sync is still retrying (e.g. the
    workload was unhealthy — F-6/CrashLoopBackOff — and mid-retry when teardown
    landed), ArgoCD won't run the deletion finalizer while that operation is
    "in progress", so the Application (and everything above it — AppProject,
    Object, XR, claim) is stuck until the retry budget (limit 5, exponential
    backoff 5s/10s/20s/40s/80s, capped maxDuration 3m) exhausts.

  fix: >
    Add `syncPolicy.preserveResourcesOnDeletion: true` to the tenant env
    ApplicationSet spec (sibling to `generators`/`template`, NOT the per-env
    Application's own syncPolicy in templatePatch — those are different fields
    at different levels). This makes Application pruning NON-cascading: ArgoCD
    just removes its own Application CR (no finalizer added, no wait). The
    actual cleanup of deployed resources is Crossplane's job anyway — deleting
    the tenant namespace already reclaims everything in it — so nothing is lost,
    only the redundant/racy cascade-prune step is skipped.

    This is not a novel pattern: it is the SAME fix already used in this repo
    for the identical problem class — applicationsets/platform-services-appset.yaml
    sets preserveResourcesOnDeletion: true with the comment "Non-cascading prune
    of generator-removed Applications ... the appset controller deletes the
    generated Application WITHOUT the resources-finalizer cascade, so the LIVE
    objects survive". FIX-10 applies the same reasoning to the tenant path.

  fix_candidate_selection: >
    The task offered three candidates: (a) order deletion so
    Applications/AppProjects terminate before namespaces, (b) terminate
    in-progress operations in the teardown flow, (c) bound retries
    deliberately. Chose a FOURTH, stronger option once the actual mechanism was
    understood: eliminate the cascade-delete finalizer entirely, so there is no
    operation-in-progress state to race against a vanishing namespace at all.
    This is strictly better than (c) (bound retries) — bounding retries would
    only shrink the worst-case stall, not remove the race — and safer than (b)
    (teardownCore.ts explicitly has NO k8s/ArgoCD client by design — "it never
    talks to the cluster directly ... the whole platform is GitOps-driven" — so
    adding a live ArgoCD API call there would be an unreviewed architecture
    change, not a config tuning). (a) (explicit deletion ordering) was not
    pursued because Crossplane's provider-kubernetes `dependsOn` only gates
    CREATION ("blocks this Object's apply until each referenced Object
    exists" — composition.yaml's own comment), not deletion, and no ordering
    primitive (e.g. a `Usage` resource) is used elsewhere in this repo for
    deletion ordering; introducing one would be new, untested surface area
    versus reusing an existing, proven pattern.

  files_changed:
    - tenants/_template/applicationset-envs.yaml
    - platform-services/crossplane/apis/composition.yaml

  trade_off_accepted: >
    Same trade-off the precedent (platform-services-appset.yaml) already
    accepts: an env Application pruned WITHOUT its namespace also being
    removed (e.g. a malformed promotion.yaml drops an element from the
    ApplicationSet's generator matrix) would leave its live workload running
    until the namespace itself is cleaned up some other way. This is a
    non-issue in the ACTUAL teardown path (the namespace goes with it via
    Crossplane regardless of what ArgoCD does), and is a materially smaller
    risk than a tenant wedged Terminating indefinitely.

  verification:
    structural: >
      Both edits verified to parse as valid YAML at the correct nesting level
      (syncPolicy sibling to generators/template, not nested under
      templatePatch) — tenants/_template/applicationset-envs.yaml verified
      with `python3 -c "import yaml; yaml.safe_load(...)"` directly (plain
      YAML, no templating); composition.yaml verified by indentation
      cross-check against sibling keys (`cat -A`) since the file is a Go
      Template string block (function-go-templating) not independently
      parseable without the Crossplane function pipeline.
    live_execution: >
      NOT YET RUN. The task's own verification bar is "run a teardown WITH a
      deliberately in-flight sync and show clean convergence" — this requires
      cluster access this session does not have (classifier-gated, no
      kubectl). Requesting devops-e2e (who ran the original VERIFY-2 teardown
      that surfaced F-7) to re-run a teardown against a tenant with a
      deliberately-unhealthy env (so ArgoCD is still retrying a sync when the
      claim is removed) on this branch, and confirm convergence completes in
      the normal ~90s window rather than the observed 4+ minute stall.

# ============================================================================
# 2. Residue policy
# ============================================================================
residue_2a_github_topic:
  finding: >
    `git rm tenants/_claims/<name>.yaml` alone (bypassing the portal's Tenant
    Teardown page) reclaims the cluster/Harbor/Vault side correctly via the
    Crossplane cascade, but does NOT strip the `capstone-tenant` GitHub topic
    from the app repo — only the portal's teardownCore.ts does that. The
    claim file's own emitted header comment ("De-provision = git rm this
    file") and tenants/_claims/README.md both documented this as if it were
    the complete, self-sufficient procedure, which is misleading: the repo
    stays catalog-discoverable ("ghost tenant") until someone manually strips
    the topic.

  fix:
    - "Corrected the claim-header comment (emitTenantClaim.ts) and tenants/_claims/README.md to explicitly document the gap and recommend the portal Tenant Teardown page as the default path for single-tenant teardown, with a manual gh api topic-strip fallback documented for bulk cohort-GC git rm."
    - "Did NOT wire topic-stripping into an automatic git-path CI hook — see decision below."

  automation_considered_and_rejected: >
    Investigated whether a push-triggered GitHub Actions workflow (on
    tenants/_claims/** deletions) could call the GitHub API to strip the
    topic automatically, closing the gap for the git-rm path too. Rejected:
    the ONLY existing platform-infra CI credential with cross-repo GitHub App
    access (APP_ID/APP_PRIVATE_KEY, used by bump-portal) is explicitly
    documented as "a DEDICATED least-privilege CI App: contents: write on
    platform-infra ONLY" — it does NOT have Administration permission on
    tenant app repos. Topic-stripping needs the broader ua-mis-backstage App
    (per teardownCore.ts's own comment: "PUT /repos/{owner}/{repo}/topics
    needs the GitHub App's Administration repository permission"). Granting
    THAT App's credentials to a CI trigger fired by any merge to
    platform-infra's protected main — which is a coarser trust boundary
    (repo-write access) than teardownCore.ts's ADMIN-group-only check
    (requireAdmin(), belt-and-suspenders group re-derivation) — would be a
    real widening of the trust surface for a convenience win, and is exactly
    the kind of architecture/security trade-off this task's own instructions
    say to escalate rather than decide unilaterally. Documented the trade-off
    explicitly in tenants/_claims/README.md; flagged as a possible follow-up
    (a NEW admin-gated bulk-teardown action in teardownCore.ts, reusing its
    existing requireAdmin() spine, rather than an unauthenticated CI hook) —
    not implemented here.

  files_changed:
    - platform-services/backstage/app/plugins/scaffolder-backend-module-capstone/src/actions/emitTenantClaim.ts
    - tenants/_claims/README.md

  verification: >
    No test coupling to the exact comment text found (emitTenantClaim.test.ts
    grep clean). Both docs edits are comment/documentation-only — no runtime
    behavior change, so no test to run; reviewed for accuracy against
    teardownCore.ts's actual behavior (read in full).

residue_2b_vault_kv:
  finding: >
    Every tenant PushSecret writes Harbor robot credentials and per-env
    database passwords to Vault at tenants/<team>/**. VERIFY-2 suspected (but
    could not confirm — its provider-vault token lacks list on secret/tenants)
    that this data persists after teardown, since PushSecrets default to NOT
    deleting the remote value unless deletionPolicy: Delete is set.

  confirmed_by_source_and_docs: >
    Both halves of this confirmed WITHOUT needing live cluster access:
    (1) none of the 6 tenant PushSecret resources in composition.yaml set
    deletionPolicy at all; ESO's own docs (Context7 /websites/external-secrets_io,
    "Push Secrets" guide) state the default leaves the remote secret in place —
    "By default, secrets created in the provider remain there even after the
    PushSecret resource is deleted." So yes, the data persists.
    (2) the writer identity these PushSecrets authenticate as
    (crossplane-push, platform-services/external-secrets/vault-policies/
    crossplane-push-role.sh) has a Vault policy DELIBERATELY scoped to
    create/read/update only — the script's own comment calls out "NO delete,
    NO other paths" as an explicit least-privilege choice, reviewed and
    committed (not an oversight). So a bare `deletionPolicy: Delete` flip
    would not even work — ESO would 403 trying to delete.

  decision: "D-082 (artifacts/context/decision-log.md) — KEEP-BY-DESIGN."
  decision_summary: >
    Do not set deletionPolicy: Delete; do not widen the crossplane-push
    writer's grant to include delete. Reasoning: the retained data is
    functionally INERT the instant teardown completes — VERIFY-2's own
    teardown table shows the underlying MySQL databases/users/grants and the
    Harbor project+robots ARE deleted by the Crossplane cascade, so there is
    nothing left for the retained Vault credential to authenticate to. This
    rules out the task brief's speculated "grade-recovery" rationale
    (nothing to recover access to) — but it also means the only
    implementation path for cleanup (granting crossplane-push `delete` on
    secret/{data,metadata}/tenants/*) would widen a deliberately narrow
    writer's blast radius (a compromised writer could then DESTROY any
    tenant's Vault data, not just read/write it) to fix a low-severity,
    dead-credential residue. Recommended follow-up, NOT implemented here: an
    out-of-band, separately-credentialed Vault KV garbage-collector that
    vacuums tenants/<team>/** for teams whose claim no longer exists, keeping
    the day-to-day writer's grant unchanged.

  coordination: >
    Requested devops-vault (admin-scope Vault access) to empirically confirm
    via `vault kv list secret/tenants/<team>/` against a recently-torn-down
    tenant, per the task's explicit instruction to coordinate before
    deciding. Response PENDING as of this evidence bundle — the decision
    above already rests on source+docs proof that does not depend on that
    confirmation (it corroborates, it is not a precondition), but will be
    appended here when it lands.

  files_changed:
    - tenants/_claims/README.md (documents the decision + D-082 pointer)
    - artifacts/context/decision-log.md (D-082, orchestrator repo)

  no_code_change: >
    Per the task's explicit instruction ("Do not change deletionPolicy
    without that decision"), and because the decision reached is
    keep-by-design, composition.yaml's PushSecret resources are UNCHANGED.

