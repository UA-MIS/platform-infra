    live_baseline_pre_fix:
      command: "kubectl -n harbor get vpa -o custom-columns='NAME:.metadata.name,MODE:.spec.updatePolicy.updateMode'"
      result: |
        harbor-core         Auto
        harbor-jobservice   Auto
        harbor-portal       Auto
        harbor-registry     Auto
      note: >-
        Captured live at evidence-bundle time, immediately before this PR's
        merge — confirms the defect is real and currently live, not
        historical-only.
    historical_incident_confirmation:
      command: "kubectl -n harbor get events --field-selector reason=EvictedByVPA"
      result: >-
        2026-08-16T01:56:31Z harbor-registry-6bffd7979d-2xm45 "Pod was
        evicted by VPA Updater to apply resource recommendation."
    post_merge_live_check: >-
      PENDING — to be run after this PR merges and ArgoCD syncs:
      `kubectl -n harbor get vpa -o custom-columns='NAME:.metadata.name,MODE:.spec.updatePolicy.updateMode'`
      must show all four as Initial, and no new EvictedByVPA events should
      appear against harbor-* pods going forward. Flagged to team-lead as a
      follow-up check once live (a dev-role agent has no cluster-write scope
      to trigger the sync itself, but this is a read-only verification once
      ArgoCD has synced on its own).
  alert_rules:
    syntax_check:
      method: promtool check rules (podman quay.io/prometheus/prometheus:v3.0.0)
      target: the full, real platform-services/monitoring/alerts.yaml (8 groups)
      result: "SUCCESS: 18 rules found" — zero syntax/semantic errors across the whole file.
    unit_tests:
      method: >-
        promtool test rules against the REAL alert definitions extracted
        from the merged alerts.yaml (not throwaway proxy alert names) — 5
        scenarios, all using the exact alert names, expr, labels, and
        annotation templates as shipped.
      scenarios:
        - name: "Positive control — real incident retro-fire"
          input: >-
            kube_deployment_status_replicas_unavailable{deployment="harbor-registry"}
            values "0x10 1 0x5" — mirrors the live-queried DEPLOY-1 pattern
            (single 60s nonzero sample) exactly; harbor-core/jobservice/portal
            held healthy throughout.
          asserted:
            - "eval_time 11m (the evaluation right after the nonzero sample): HarborCriticalPathUnavailable fires with exact real labels (severity=critical, impact=student-facing, namespace=harbor, deployment=harbor-registry) and exact real rendered annotations (summary + full description, both $labels/$value-templated)."
            - "eval_time 12m (one evaluation later, metric back to 0): HarborCriticalPathUnavailable no longer firing — proves for:0m clears immediately with the condition, not 'stuck firing forever'."
            - "eval_time 11m: HarborSupportPathUnavailable does NOT fire (harbor-core, the other critical-path member, stayed healthy) — confirms the two alerts are scoped independently, not coupled."
          result: PASS (all three assertions)
        - name: "Negative control — fully healthy Harbor"
          input: all four deployments' unavailable-replica metric held at 0 for the whole window
          asserted: neither HarborCriticalPathUnavailable nor HarborSupportPathUnavailable fires at any evaluated time
          result: PASS
        - name: "Support-path positive control + severity-scope proof"
          input: harbor-jobservice drops for one 60s sample; registry/core/portal stay healthy
          asserted: >-
            HarborSupportPathUnavailable fires with the exact real warning-
            severity labels/annotations for harbor-jobservice; the
            critical-severity HarborCriticalPathUnavailable does NOT fire —
            proves the critical/warning split is an exact, disjoint
            partition of the four Harbor deployments (no double-fire, no gap).
          result: PASS
      overall_result: "promtool test rules: SUCCESS (all 5 scenarios)"
      test_files_note: >-
        Unit test + extracted real-rules fixture built in the session
        scratchpad (fix20_unit_test.yml, fix20_alerts.yaml) for verification
        purposes only — not committed to the repo; the project's monitoring
        stack has no existing promtool-test-in-CI convention to attach a
        persistent fixture to, matching the alerts.yaml file's existing
        alerts (none of which have committed promtool unit tests either).
    live_scrape_availability_gap: >-
      Documented, not fixed here (correctly out of this task's "quick" scope
      per the brief): there is currently no ServiceMonitor scraping Harbor's
      own component metrics, so up{namespace="harbor"} is empty in
      Prometheus. This alert group intentionally rides entirely on
      kube-state-metrics (kube_deployment_status_replicas_unavailable),
      which IS already scraped platform-wide with zero new scrape config —
      so the alert is live and functional today despite the gap. Proper
      Harbor-native metrics scraping is a separate, larger post-Tuesday
      backlog item (noted inline in alerts.yaml's harbor-availability
      group header comment).

