# D-186 gate closure — the LIVE PORTAL run that PR #545 could not do before merge.
# Merged commit under test: 571d9d6 (platform-infra main).
# Running/checkpointed by: devops teammate, 2026-08-25.
id: D-186-portal-gate
status: COMPLETE
verdict: BOTH_GATE_LEGS_PASS — no live defect in 571d9d6; nothing reverted

baseline_before_any_action:
  boards_dir_on_main: "tenants/_boards/{README.md,_example-team.yaml} only — no live board file"
  applicationset_agile_boards: "present in argocd (created by the merge), 0 generated Applications"
  agile_namespace: "1 pod (agile-5b5885664c-4858j 1/1) — maintainers' board only"
  claims_on_main: "crimson-copies-crimson-copies.yaml, ida-llm-ida-llm.yaml (+README/_example)"

step_1_template_pickup:
  status: PASS
  method: "live catalog API on process.capstone.uamishub.com (backend service token)"
  observations:
    - "template:default/new-project served from url:.../tree/main/.../new-project/template.yaml"
    - "page-1 property `agileBoard` present: type boolean, default true, NOT in `required`"
    - "steps: preflight,compose,publish,wait-for-content,register,emit-claim,commit-claim,commit-board"
    - "commit-board carries if=${{ parameters.agileBoard }}, action capstone:commit-to-main, path tenants/_boards/${{ parameters.team }}.yaml, allowedPathPrefix tenants/_boards/"
  note: "no catalog refresh needed — the GithubEntityProvider had already re-ingested main."

method_note: >-
  The portal's sign-in is OIDC-through-Dex-through-GitHub, which cannot be driven
  headlessly without the owner's GitHub credentials. Both legs are therefore driven by
  POSTing the SAME /api/scaffolder/v2/tasks request the wizard form issues, against the
  LIVE portal, using a Backstage backend service token. This exercises the registered
  template, parameter values, the `if:` gate and every step/action for real. What it does
  NOT exercise is the rjsf checkbox widget rendering in the browser. Stated plainly.

