---
- name: reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

# Journal cap drop-in (docs/operator/disk-headroom.md). journald must be
# restarted for SystemMaxUse/SystemKeepFree to take effect — the vacuum of
# already-archived journals happens on that restart.
- name: restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
