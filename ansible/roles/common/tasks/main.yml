---
# Base OS prep shared by every Mac worker: packages, kernel modules, sysctl,
# swap off, time sync. Idempotent — safe to re-run.

- name: Install base packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - conntrack        # kube-proxy-replacement / connection tracking helpers
      - socat            # port-forward, some CNI helpers
      - ethtool          # cilium queries NIC features
      - ipset
      - nftables
      - chrony           # accurate clock => TLS bootstrap does not fail on skew
      - python3
    state: present
    update_cache: true
    cache_valid_time: 3600

# --- APT signature verifier: Debian 13 (trixie) ships `sqv`, which rejects some
# third-party repo signatures (e.g. pkgs.k8s.io's SHA1/v3 sig — upstream k8s
# #133098: "Signature Packet v3 is not considered secure since 2026-02-01 ...
# repository is not signed"). Point apt back at the legacy gpgv verifier BEFORE
# any third-party repo (tailscale, pkgs.k8s.io) is added or updated. ---
- name: Ensure gpgv present (trixie sqv rejects some third-party repo signatures)
  ansible.builtin.apt:
    name: gpgv
    state: present

- name: Point apt at legacy gpgv verifier (trixie sqv rejects k8s repo SHA1/v3 sig, upstream k8s #133098)
  ansible.builtin.copy:
    content: "APT::Key::gpgvcommand \"/usr/bin/gpgv\";\n"
    dest: /etc/apt/apt.conf.d/90gpgv
    mode: "0644"

- name: Ensure chrony (time sync) is running — TLS bootstrap is clock-sensitive
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

# --- Swap off: kubelet defaults to failSwapOn=true; Talos nodes run swapless ---
- name: Disable all active swap now
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Remove swap entries from /etc/fstab (persist swap-off across reboot)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1  # disabled for kubernetes (capstone)'

# Commenting fstab alone is NOT sufficient on these Debian workers: systemd can bring
# swap back on its own at boot (systemd-fstab-generator re-derives .swap units from a
# stale fstab snapshot/cache, and systemd-gpt-auto-generator can activate a GPT
# "Linux swap" partition even with NO fstab entry at all). This bit us live — a
# Debian-worker reboot silently re-enabled swap, and kubelet (failSwapOn=true) then
# refused to start. Masking swap.target is the canonical, broad fix: every swap unit
# (fstab-generated or gpt-auto-generated) is WantedBy=swap.target, and a masked unit
# can never be started, so nothing systemd does at boot can re-enable swap.
- name: Persistently mask swap.target (prevents systemd from re-enabling swap on reboot)
  ansible.builtin.systemd:
    name: swap.target
    masked: true
    enabled: false
    state: stopped

- name: Disable dphys-swapfile if present
  ansible.builtin.systemd:
    name: dphys-swapfile
    state: stopped
    enabled: false
  failed_when: false

# --- Kernel modules required for the CRI + Cilium datapath ---
- name: Persist required kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/capstone-k8s.conf
    mode: "0644"
    content: |
      # Managed by Ansible (capstone). Loaded at boot for the CRI + Cilium.
      overlay
      br_netfilter

- name: Load kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

# --- sysctl for the container/pod datapath ---
- name: Apply kubernetes sysctls
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-capstone-k8s.conf
    mode: "0644"
    content: |
      # Managed by Ansible (capstone).
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
  notify: reload sysctl

# --- inotify limits for CI build workers (CI-fast, #237) ---
# Debian's default fs.inotify.max_user_instances (128) is exhausted by the ARC Kaniko
# build pods + esbuild/tsc/yarn watchers on a busy worker, so a Backstage build died with
# `failed to create fsnotify watcher: too many open files`. Raise the per-user inotify
# INSTANCE and WATCH ceilings so future Debian workers get the headroom automatically
# (the operator already applied these live to the current Macs; this makes it permanent).
# ansible.builtin.sysctl both sets the value live and persists it to sysctl_file — idempotent.
- name: Raise inotify limits (CI build watchers exhaust the Debian defaults)
  ansible.builtin.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-capstone-inotify.conf
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { name: fs.inotify.max_user_instances, value: "1024" }
    - { name: fs.inotify.max_user_watches, value: "524288" }

# --- Bound the systemd journal (2026-09-03 capstone-w1 DiskPressure incident) ---
# The journal is unbounded by default on Debian and had grown to 3.4 G on
# capstone-w1 — not the root cause of that incident (the node-local DR store at
# 324.5 G was), but 3.4 G was a meaningful share of the 3.88 GiB of margin the
# node had left above the kubelet's 15% eviction line, and it regrows silently.
# SystemKeepFree is the load-bearing half: it makes journald back off when the
# FILESYSTEM is tight, not just when the journal is large.
# Applied live to capstone-w1 on 2026-09-03; this makes it permanent and applies
# it to every worker.
- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Cap systemd journal size so it cannot eat node disk headroom
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-capstone-cap.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (capstone). See docs/operator/disk-headroom.md.
      [Journal]
      SystemMaxUse=200M
      SystemKeepFree=2G
  notify: restart systemd-journald

- name: Flush handlers so sysctls apply before later roles
  ansible.builtin.meta: flush_handlers

# --- DNS resolver detection for the kubelet (avoid the 127.0.0.53 stub loop) ---
- name: Detect whether systemd-resolved is active
  ansible.builtin.command: systemctl is-active systemd-resolved
  register: resolved_active
  changed_when: false
  failed_when: false

- name: Set kubelet resolvConf fact (real upstream file when resolved is active)
  ansible.builtin.set_fact:
    kubelet_resolv_conf: >-
      {{ '/run/systemd/resolve/resolv.conf'
         if resolved_active.stdout == 'active'
         else kubelet_resolv_conf_default }}
