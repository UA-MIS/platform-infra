# =============================================================================
# SECRETS TEMPLATE  ->  copy to  secrets.yml  and encrypt with ansible-vault:
#
#     cp inventory/group_vars/secrets.example.yml inventory/group_vars/secrets.yml
#     # fill in real values, then:
#     ansible-vault encrypt inventory/group_vars/secrets.yml
#
# secrets.yml is git-ignored (see ansible/.gitignore). NEVER commit real values.
# Run the play with:  ansible-playbook site.yml --ask-vault-pass
# =============================================================================

# ---- kubelet TLS-bootstrap token -------------------------------------------
# Format: "<token-id>.<token-secret>"  (6 lowercase alnum . 16 lowercase alnum)
# The OPERATOR mints the matching bootstrap.kubernetes.io/token Secret in
# kube-system with auth-extra-groups=system:bootstrappers:nodes BEFORE the run.
# Exact kubectl is in docs/operator/debian-worker-onboarding.md. Short-TTL: mint
# it right before an onboarding batch and let it expire.
kubelet_bootstrap_token: "REPLACE_TOKENID.REPLACE_TOKEN_SECRET"

# ---- Tailscale auth key -----------------------------------------------------
# A REUSABLE, PRE-APPROVED auth key from the tailnet admin console, tagged so the
# node lands in the right ACL group (e.g. tag:capstone / tagged-devices). NOT
# ephemeral (the node must persist across reboots). Create in the runbook's
# prerequisites section. The real value starts with the usual Tailscale auth-key
# prefix followed by the key material.
tailscale_authkey: "REPLACE_WITH_REUSABLE_PREAPPROVED_TAILSCALE_AUTH_KEY"

# ---- Admin SSH keys (optional here; can also live in mac_workers.yml) -------
# admin_ssh_keys:
