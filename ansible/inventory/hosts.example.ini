; ---------------------------------------------------------------------------
; Inventory template for the Debian Mac-Mini worker fleet.
;
; Copy to hosts.ini and fill in real ansible_host values.
;
; ansible_host  -> how the Ansible CONTROLLER reaches the box for SSH. This is
;                  ONLY used for the SSH transport, never baked into the cluster.
;                  Prefer the box's TAILSCALE 100.x IP or its MagicDNS name so it
;                  keeps working after the Mac is relocated and its DHCP LAN IP
;                  changes. A raw LAN IP also works for the very first run before
;                  Tailscale is up (see the runbook "validate on clay-mac1").
;
; kube_node_name -> the Kubernetes node name this box registers as. Must be a
;                   valid DNS-1123 label, unique across the fleet. The kubelet
;                   client cert CN becomes system:node:<kube_node_name>.
; ---------------------------------------------------------------------------

[mac_workers]
; First box we validate the whole flow on. Before Tailscale exists on it, reach
; it by its current LAN IP or MagicDNS; after onboarding it is reachable at its
; stable 100.x address. Do NOT hardcode a LAN IP long-term.
mac-debian-01 ansible_host=clay-mac1        kube_node_name=mac-debian-01

; Remaining ~19 boxes (fill in as they are imaged):
; mac-debian-02 ansible_host=100.x.x.x      kube_node_name=mac-debian-02
; mac-debian-03 ansible_host=mac3.taile5d412.ts.net  kube_node_name=mac-debian-03
; ...

[mac_workers:vars]
ansible_user               = admin
ansible_ssh_private_key_file = ~/.ssh/id_ed25519
