# Ansible configuration for the Debian Mac-Mini worker onboarding play.
# Run all ansible-playbook commands from the ansible/ directory so this file is picked up.
[defaults]
inventory            = inventory/hosts.ini
roles_path           = roles
host_key_checking    = True
retry_files_enabled  = False
stdout_callback      = yaml
interpreter_python   = auto_silent
forks                = 5
timeout              = 30

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root

[ssh_connection]
pipelining = True
# ControlMaster speeds up multi-task runs across the 20-box fleet.
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
